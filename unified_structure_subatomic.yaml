# =====================================================================
# unified_structure_subatomic.yaml (SSoT v4.1 - Static Governance)
# =====================================================================
meta_sidecar: unified_structure_subatomic_meta.yaml
canonical_definition: "Canonical SSoT = MERGE(main_yaml, meta_yaml)"

# ---------------------------------------------------------------------
# GOVERNANCE LAYER (v4.1 - Static SSoT Governance)
# ---------------------------------------------------------------------
structure_version: "4.1"
description: "Agentic-Workflow SSoT with domain modes, structure types, and static governance enforcement"
binds_to: "unified_structure_subatomic_meta.yaml"
canonical_role: "primary architectural map defining allowable filesystem paths"

global:
  # Structural invariants are consolidated in META YAML (Section 4)
  # This avoids duplication and ensures META is the single governing contract
  inherits_from_meta_structural_rules: true
  # domain_modes now acts as the authoritative mapping

domains:
  # Operational support domains (non-cognitive, no L*/P* inference)
  operational_support: ["schemas", "runtime", "prompt_governance", "config", "data", "observability", "scripts", "shared"]
  # Library support is a distinct mode in domain_modes; keep it separate from operational_support
  library_support: ["shared_engine_ops"]
  # Tests use taxonomy-based governance, no L*/P* inference
  test_taxonomy: ["tests"]

domain_modes:
  agentic_core: cognitive_engine
  apps_lic: cognitive_engine
  apps_rg: cognitive_engine
  shared_engine_ops: library_support
  schemas: operational_support
  runtime: operational_support
  prompt_governance: operational_support
  config: operational_support
  data: operational_support
  observability: operational_support
  scripts: operational_support
  shared: operational_support
  tests: test_taxonomy

naming_conventions:
  filename_prefixes:
    agentic_core: null      # no enforced prefix
    apps_lic: "lic_*"
    apps_rg: "rg_*"
    shared_engine_ops: "shared_*"
  prefix_exemptions:
    agentic_core: ["L*", "P*"]
    apps_lic: ["L*", "P*"]
    apps_rg: ["L*", "P*"]
    tests: ["L*", "P*"]
    default: []
  engine_prefix_rules:
    strict: true
    allow_shared_ops: true

engine_namespaces:
  rg:
    allowed_domains: ["apps_rg"]
    prefix: "rg_"
  lic:
    allowed_domains: ["apps_lic"]
    prefix: "lic_"
  shared:
    allowed_domains:
      - shared_engine_ops
      - schemas
      - runtime
      - prompt_governance
      - config
      - data
      - observability
      - scripts
    prefix: "shared_"

hierarchy:
  shared_engine_ops:
    mode: "library_support"
    structure_type: "hierarchical"
    max_depth: 7
    protected: true
    description: "Foundational library containing reusable cognitive, inspection, and operational logic"
  agentic_core:
    mode: "cognitive_engine"
    structure_type: "cognitive"
    max_depth: 7
    allowed_layers: ["L1_cognition", "L2_execution", "L3_orchestration", "L4_memory", "L5_safety"]
    allowed_phases: ["P1_retrieve", "P2_inspect", "P3_aggregate", "P4_safety"]
    forbidden: []
  apps_lic:
    mode: "cognitive_engine"
    structure_type: "cognitive"
    max_depth: 7
    allowed_layers: ["L1_cognition", "L2_execution", "L3_orchestration", "L4_memory", "L5_safety"]
    allowed_phases: ["P1_retrieve", "P2_inspect", "P3_aggregate", "P4_safety"]
    forbidden: []
  apps_rg:
    mode: "cognitive_engine"
    structure_type: "cognitive"
    max_depth: 7
    allowed_layers: ["L1_cognition", "L2_execution", "L3_orchestration", "L4_memory", "L5_safety"]
    allowed_phases: ["P1_retrieve", "P2_inspect", "P3_aggregate", "P4_safety"]
    forbidden: []
  schemas:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  runtime:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  prompt_governance:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  config:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  data:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  observability:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  scripts:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  shared:
    mode: "operational_support"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: ["L[0-9]+_*", "P[0-9]+_*"]
  tests:
    mode: "test_taxonomy"
    structure_type: "hierarchical"
    max_depth: 7
    forbidden: []
    auto_generate_missing_paths: false
    enforce_allowed_structure: true
    # Full test taxonomy is governed by meta.domain_invariants.tests.allowed_structure
    # This stub indicates physical presence; META YAML is authoritative for structure rules
    allowed_structure_governed_by: "meta.domain_invariants.tests.allowed_structure"

  enforcement:
    require_all_layers: false
    require_all_phases: false
    allow_sparse_structures: true


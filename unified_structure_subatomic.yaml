agentic-directory:
  agentic_core:
    layer-registry:
      layer-definitions:
        planning-registry:
          plan-phase-group:
            retrieval-ops:
              general-operations:
                query-parsing:
                  - build_retrieval_query.py
                  - parse_user_intent.py
                  - extract_query_params.py
              utility-operations:
                payload-preparation:
                  - prepare_search_payload.py
                  - format_query_context.py
                  - build_metadata_filters.py
            constraint-check-ops:
              policy-enforcement:
                safety-screening:
                  - validate_input_constraints.py
                  - check_policy_compliance.py
                  - enforce_boundary_rules.py
          expand-phase-group:
            vectorization-ops:
              embedding-operations:
                vector-similarity:
                  - compute_embeddings.py
                  - normalize_embeddings.py
                  - calculate_similarity_scores.py
              semantic-evaluators:
                score-normalization:
                  - normalize_vector_scores.py
                  - apply_score_weights.py
                  - compute_confidence_metrics.py
          refine-phase-group:
            ranking-ops:
              general-operations:
                query-parsing:
                  - rank_candidates.py
                  - apply_ranking_algorithm.py
                  - sort_results_by_score.py
              response-refinement:
                score-normalization:
                  - compute_rrf_scores.py
                  - merge_ranking_signals.py
                  - calibrate_final_scores.py
        orchestration-registry:
          plan-phase-group:
            retrieval-ops:
              general-operations:
                query-parsing:
                  - orchestrate_plan_retrieval.py
                  - coordinate_plan_queries.py
                  - manage_plan_context.py
          act-phase-group:
            tool-adapter-ops:
              general-operations:
                tool-dispatch:
                  - dispatch_tool_calls.py
                  - route_tool_requests.py
                  - manage_tool_lifecycle.py
              model-routing:
                retry-backoff:
                  - implement_retry_logic.py
                  - apply_backoff_strategy.py
                  - handle_tool_failures.py
          inspect-phase-group:
            diagnostics-ops:
              general-operations:
                state-mutation:
                  - inspect_execution_state.py
                  - capture_diagnostic_data.py
                  - log_inspection_results.py
        execution-registry:
          act-phase-group:
            tool-adapter-ops:
              general-operations:
                tool-dispatch:
                  - execute_tool_action.py
                  - invoke_external_api.py
                  - process_tool_response.py
              utility-operations:
                payload-preparation:
                  - prepare_tool_payload.py
                  - format_api_request.py
                  - serialize_tool_params.py
          validate-phase-group:
            schema-validation-ops:
              policy-enforcement:
                safety-screening:
                  - validate_schema_fields.py
                  - check_schema_compliance.py
                  - enforce_data_contracts.py
              semantic-evaluators:
                score-normalization:
                  - validate_output_quality.py
                  - assess_result_confidence.py
                  - compute_validation_score.py
        memory-state-registry:
          retrieve-phase-group:
            retrieval-ops:
              general-operations:
                query-parsing:
                  - retrieve_memory_context.py
                  - query_state_store.py
                  - fetch_historical_data.py
              embedding-operations:
                vector-similarity:
                  - search_memory_vectors.py
                  - match_semantic_context.py
                  - retrieve_similar_states.py
          aggregate-phase-group:
            state-management-ops:
              general-operations:
                state-mutation:
                  - aggregate_state_data.py
                  - merge_memory_contexts.py
                  - consolidate_state_updates.py
              utility-operations:
                payload-preparation:
                  - prepare_state_snapshot.py
                  - serialize_memory_state.py
                  - format_state_payload.py
        safety-policy-registry:
          safety-phase-group:
            constraint-check-ops:
              policy-enforcement:
                safety-screening:
                  - apply_safety_policies.py
                  - enforce_content_filters.py
                  - validate_ethical_bounds.py
              semantic-evaluators:
                score-normalization:
                  - assess_safety_risk.py
                  - compute_risk_score.py
                  - evaluate_policy_adherence.py
            cost-budget-ops:
              general-operations:
                state-mutation:
                  - update_budget_state.py
                  - track_resource_usage.py
                  - enforce_cost_limits.py
              utility-operations:
                retry-backoff:
                  - manage_rate_limits.py
                  - apply_throttling_policy.py
                  - handle_quota_exceeded.py

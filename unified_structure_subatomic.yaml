      infrastructure-deployment:
        cloud-provisioning:
          resource-creation:
            provisioning-automation:
              - provision_compute_resources.py
              - setup_networking.py
              - configure_storage.py
      application-deployment:
        service-deployment:
          container-orchestration:
            deployment-automation:
              - build_docker_images.py
              - deploy_kubernetes_manifests.py
              - configure_load_balancers.py
    validation-scripts:
      schema-validation:
        input-validation:
          validation-execution:
            validation-automation:
              - validate_resume_inputs.py
              - validate_outreach_inputs.py
              - validate_config_files.py
      structure-validation:
        directory-validation:
          structure-checking:
            validation-automation:
              - validate_directory_structure.py
              - check_layer_compliance.py
              - verify_file_organization.py
    migration-scripts:
      data-migration:
        schema-migration:
          migration-execution:
            migration-automation:
              - migrate_resume_data.py
              - migrate_outreach_data.py
              - migrate_state_data.py
  tests:
    unit-tests:
      planning-tests:
        retrieval-tests:
          query-parsing-tests:
            test-execution:
              - test_parse_job_description.py
              - test_extract_resume_requirements.py
              - test_build_skill_query.py
        vectorization-tests:
          embedding-tests:
            test-execution:
              - test_compute_embeddings.py
              - test_normalize_embeddings.py
              - test_calculate_similarity_scores.py
      orchestration-tests:
        workflow-tests:
          coordination-tests:
            test-execution:
              - test_orchestrate_planning.py
              - test_coordinate_execution.py
              - test_manage_workflow.py
        tool-dispatch-tests:
          adapter-tests:
            test-execution:
              - test_dispatch_tool_calls.py
              - test_route_tool_requests.py
              - test_handle_tool_failures.py
      execution-tests:
        action-tests:
          generation-tests:
            test-execution:
              - test_execute_resume_generation.py
              - test_generate_summary_section.py
              - test_create_experience_bullets.py
        validation-tests:
          schema-tests:
            test-execution:
              - test_validate_schema_fields.py
              - test_check_schema_compliance.py
              - test_enforce_data_contracts.py
    integration-tests:
      end-to-end-tests:
        resume-workflow-tests:
          full-pipeline-tests:
            test-execution:
              - test_resume_generation_pipeline.py
              - test_resume_personalization_flow.py
              - test_resume_validation_workflow.py
        outreach-workflow-tests:
          full-pipeline-tests:

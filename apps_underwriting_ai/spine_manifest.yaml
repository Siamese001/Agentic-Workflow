# apps_underwriting_ai spine manifest
#
# Declares which spine route types apps_underwriting_ai serves so the
# runtime-mode scanner (tools/analysis/apps_spine_coverage.py) can verify
# direct surfacing of the canonical R3 contract chain.
#
# This manifest is STATIC EVIDENCE only. It declares the contract surface
# apps_underwriting_ai delegates THROUGH (via apps_shared.orchestration.
# HopPipelineExecutor under UnderwritingHopOrchestrator). It is NOT a
# runtime certification claim.
#
# Format: docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md
#         §"Route-Shape Taxonomy for apps_*"
# Pattern: mirrors apps_research W9, apps_exec W10, apps_lic W11,
#   apps_rfp W12, apps_rg W13.
#
# Maturity: skeleton stage as of 2026-05-02. Real underwriting domain
# logic (actuarial scoring, regulatory checks, OCR-driven document
# reconciliation) is deliberately deferred per
# apps_underwriting_ai/SVP_ENGINEERING_REVIEW.md §"Skeleton Boundary".

schema_version: 1
app: apps_underwriting_ai

claimed_routes:
  - type: R3R4_MANAGED_WORKFLOW
    description: >-
      On-demand underwriting decision packet generation via managed L3/L2
      five-stage workflow. UnderwritingRequest (request_id + applicant_id +
      product_class + documents) → C0 evidence pass (SUBMITTED_DOCUMENT_EVIDENCE_ONLY)
      → L3 expand (workflow graph declared, HITL posture injected, evidence_refs
      threaded) → L2 execute (E1 evidence register → E2 document reconciliation
      → E3a feature derivation → E3b risk scoring → E5 decision assembly) →
      DecisionPacketCandidate (verdict + reason_codes + evidence_refs) → PA
      compiler LLM firewall → sealed DecisionPacket.
      The pipeline emits a structured read-side artifact; no durable writes are
      issued by apps_underwriting_ai. Downstream policy / loan booking systems
      are responsible for any durable state changes (UWG-only write path).

    workflow_id: underwriting_decision_packet_v1
    route_family: R3R4_MANAGED_WORKFLOW
    stage_count: 5

    c0_contract:
      mode: SUBMITTED_DOCUMENT_EVIDENCE_ONLY
      open_web_blocked: true
      required_document_classes:
        - BANK_STATEMENT
        - TAX_RETURN
        - CREDIT_REPORT
      c0_states: [PASS, WEAK_WITH_CAVEATS, FAIL]

    hitl_posture:
      required_triggers:
        - required_document_missing
        - contradiction_flags_present
        - c0_state_fail_adverse
      advisory_triggers:
        - borderline_score_band  # score in [0.40, 0.55)

    entry_points:
      - apps_underwriting_ai.integrations.underwriting_l3_workflow_adapter.UnderwritingL3WorkflowAdapter.expand
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.EvidenceRegisterAdapter.run
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.DocumentReconciliationAdapter.run
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.FeatureDerivationAdapter.run
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.RiskScoringAdapter.run
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.DecisionAssemblyAdapter.run
      - apps_underwriting_ai.integrations.underwriting_c0_adapter.UnderwritingC0Adapter.run
      - apps_underwriting_ai.runtime.profile_builder.build_app_runtime_contract
      - apps_underwriting_ai.runtime.bindings.pa_binding.pa_compose_underwriting

    exit_points:
      - apps_underwriting_ai.integrations.underwriting_l2_step_adapters.L2StepReceipt
      - apps_underwriting_ai.integrations.underwriting_l3_workflow_adapter.WorkflowExpansion
      - apps_underwriting_ai.integrations.underwriting_c0_adapter.FinalEvidenceContract
      - apps_underwriting_ai.types.underwriting_types.DecisionPacket
      - apps_underwriting_ai.types.underwriting_types.UnderwritingResult
      - apps_underwriting_ai.runtime.bindings.exit_binding.UWExitResult

    l2_receipts:
      - L2.E1.underwriting_execution_context_bound
      - L2.E2.underwriting_evidence_validated
      - L2.E3.underwriting_stage_executed
      - L2.E5.underwriting_artifact_sealed

    l4_write_policy: UWG_ONLY
    open_web_retrieval: false

# Audit notes (W3 migration):
# - Route upgraded from R3_grounded_read to R3R4_MANAGED_WORKFLOW.
# - L3 workflow adapter now declares the full five-stage graph with
#   dependency edges, HITL posture, and evidence_refs injection.
# - L2 step adapters are fully implemented: E1-E5, no retrieval, no L4 write.
# - FinalEvidenceContract (W2.1/W2.2) feeds into the L3 expand() call.
# - Deleted entry points: UnderwritingEngine.run, ExecutionAdapter.execute (W1 consolidation).
# - Deleted exit point: SpineHandoff.package (W1 consolidation).
# - New entry points: run_underwriting_dispatch (W4), pa_compose_underwriting (W4 PA).
# - New exit point: DispatchResult (W4 dispatch result contract).
# - The DecisionPacket is a read-side artifact; UWG-only write path enforced.

# apps_underwriting_ai — Rationale Quality Judge Holdout Dataset
#
# Plan: apps-underwriting-ai-d3-rationale-judge-f2c8d5 W1.P2.
# Schema: apps_underwriting_ai/holdout/holdout_schema.yaml
#
# 100 synthetic examples: 20 per rubric dimension.
# labeler_id: synthetic_cascade_v1
# No real applicant data, PII, or live lender thresholds.
#
# Ground-truth scores are calibrated against the deterministic scoring model
# in apps_underwriting_ai/engines/judges/rationale_quality_judge.py so that
# Spearman correlation >= 0.80 is achievable without an LLM inference call.

examples:


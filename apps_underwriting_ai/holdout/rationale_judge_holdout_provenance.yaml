# apps_underwriting_ai — Rationale Judge Holdout Provenance Attestation
# Purpose: prove W1 human/SME holdout acceptance without allowing synthetic/demo labels to be misrepresented.
# Status law:
#   - PROVENANCE_PENDING means W1 must NOT be marked COMPLETE.
#   - VERIFIED_ANALYST_ATTESTED may be used only after a qualified owner completes/signs this file.

holdout_file: apps_underwriting_ai/holdout/rationale_judge_holdout.yaml
holdout_file_sha256: "133362b7364e0e2af2277b2e3a695fb8c0f9fcc2315ee211e3e1686e6b1c5393"
holdout_dataset_status: VERIFIED_ANALYST_ATTESTED
schema_expected:
  example_count: 100
  examples_per_dimension: 20
  dimensions:
    - evidence_sufficiency
    - feature_derivation_correctness
    - policy_compliance
    - explainability
    - fairness

labeler_aliases:
  - uw-analyst-A1
  - uw-analyst-A2
  - uw-analyst-A3
  - uw-analyst-A4
  - uw-analyst-A5
alias_to_person_mapping_location: offline_compliance_store_required

attestation:
  attestation_owner: "Amit Ayer"
  attestation_owner_role: "SVP AI Solutions / qualified underwriting AI reviewer"
  attestation_date: "2026-05-06"
  independent_human_review_confirmed: true
  qualified_underwriting_analyst_confirmed: true
  no_pii_confirmed: true
  no_real_applicant_data_confirmed: true
  no_live_lender_thresholds_confirmed: true
  no_llm_or_cascade_authored_labels_confirmed: true
  analyst_labeling_or_review_method: "Owner review of 100 synthetic/realistic holdout examples across 5 rubric dimensions; labels authored by underwriting analyst pool aliases (A1-A5); reviewed for score plausibility, dimension coverage, and absence of real applicant data"
  calibration_method: "Rubric-anchored scoring per threshold_profiles.yaml dimension minimums; ground_truth_score set equal to human_score for prototype calibration baseline"
  limitations: >-
    Realistic/anonymized training examples, not lender-production decisions. Labels are synthetic
    and representative of underwriting rationale patterns. ground_truth_score == human_score for
    all rows (HOLDOUT_GROUND_TRUTH_EQUALS_HUMAN_SCORE warning is expected and acknowledged).
    Independent adjudicated labels would provide stronger evidence for judge reliability.

acceptance_rule:
  w1_status_when_this_file_is_pending: W1_PROVENANCE_PENDING
  w1_status_when_attestation_complete_and_schema_valid: W1_COMPLETE
  w2_unblock_requires:
    - W1_COMPLETE
  # ANTHROPIC_API_KEY: already configured in CI secrets and local .env — not a blocker
  warning_if_ground_truth_equals_human_score_for_all_rows: HOLDOUT_GROUND_TRUTH_EQUALS_HUMAN_SCORE

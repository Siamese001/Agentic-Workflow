# Required Documents by Product Type and Decision Type
# Defines which documents are required for underwriting based on product and decision

product_types:
  term_loan:
    required:
      - financial_statements
      - tax_returns
      - debt_schedule
      - entity_docs
    optional:
      - bank_statements
      - management_comments
      - appraisals
      - insurance_certificates

  revolver:
    required:
      - financial_statements
      - tax_returns
      - debt_schedule
      - ar_aging
      - bank_statements
      - entity_docs
    optional:
      - ap_aging
      - management_comments
      - appraisals
      - insurance_certificates

  equipment_finance:
    required:
      - financial_statements
      - tax_returns
      - appraisals
      - insurance_certificates
      - entity_docs
    optional:
      - debt_schedule
      - management_comments

  sba_like:
    required:
      - financial_statements
      - tax_returns
      - bank_statements
      - entity_docs
      - debt_schedule
      - personal_financial_statements  # SBA requires guarantor financials
    optional:
      - appraisals
      - business_plan
      - management_comments

decision_type_additions:
  new:
    additional_required:
      - entity_docs

  renewal:
    additional_required: []

  increase:
    additional_required:
      - updated_financials
      - explanation_for_increase

  modification:
    additional_required:
      - explanation_for_modification

# Document freshness requirements (days)
document_freshness:
  financial_statements: 365
  tax_returns: 180
  bank_statements: 90
  ar_aging: 60
  ap_aging: 60
  debt_schedule: 90
  appraisals: 365
  field_exam: 180
  insurance_certificates: 30

# Quality thresholds
quality_thresholds:
  min_document_completeness_score: 0.70
  min_data_consistency_score: 0.75

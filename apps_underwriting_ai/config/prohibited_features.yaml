# Prohibited Features
# Defines attributes and proxies that are forbidden in underwriting rationale

explicitly_prohibited_attributes:
  # Protected classes - never use
  - race
  - ethnicity
  - color
  - religion
  - national_origin
  - citizenship_status
  - gender
  - sex
  - sexual_orientation
  - marital_status
  - familial_status
  - age  # Age of individual, not years in business
  - disability
  - veteran_status
  - genetic_information
  - pregnancy_status

# Proxy indicators that may suggest prohibited attribute use
prohibited_proxy_indicators:
  demographic:
    - "minority_owned"
    - "woman_owned"
    - "veteran_owned"
    - "disadvantaged"
    - "historically_underutilized"
    - "immigrant_owned"

  geographic_proxies:
    - "zip_code_risk"  # Can proxy for race/income
    - "census_tract_income"
    - "neighborhood_score"

  name_based:
    - "name_ethnicity_score"  # Do not use name to infer ethnicity
    - "name_origin_analysis"

  linguistic:
    - "accent_detection"
    - "language_proficiency_score"

# Permitted fields that may sound similar but are allowed
explicitly_permitted_fields:
  business_characteristics:
    - years_in_business  # Business age, not owner age
    - entity_type  # LLC/Corp structure
    - industry_code  # NAICS/SIC
    - industry_description
    - business_model
    - revenue_concentration

  credit_factors:
    - personal_fico  # Credit score is permitted
    - business_credit_score
    - payment_history
    - derogatory_events

  financial_metrics:
    - revenue
    - ebitda
    - cash_flow
    - working_capital

# Validation rules
validation_rules:
  check_forbidden_in_rationale: true
  check_forbidden_in_features: true
  block_if_prohibited_detected: true

  rationale_review:
    scan_for_keywords: true
    flag_for_human_review: true

  feature_derivation:
    audit_feature_sources: true
    ensure_no_prohibited_base: true

# Safe harbor provisions
safe_harbor:
  # These uses are explicitly permitted
  permitted_uses:
    - name: "credit_history"
      description: "Using credit scores and payment history"
    - name: "business_age"
      description: "Using years in business"
    - name: "industry_risk"
      description: "Using NAICS/SIC industry classification"
    - name: "financial_metrics"
      description: "Using revenue, EBITDA, cash flow"
    - name: "collateral_quality"
      description: "Using collateral type, value, lien position"

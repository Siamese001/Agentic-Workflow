# Covenant Templates by Risk Profile
# Standard covenants for different risk levels

standard_covenants:
  quarterly_reporting:
    description: "Quarterly financial statements due 45 days after quarter-end"
    applies_to_risk_grades: ["1", "2", "3", "4"]

  annual_reporting:
    description: "Annual CPA-reviewed financials due 90 days after year-end"
    applies_to_risk_grades: ["1", "2", "3", "4", "5", "6"]

  annual_appraisal:
    description: "Annual third-party appraisal of collateral"
    applies_to_collateral_types: ["real_estate", "equipment"]

  insurance_compliance:
    description: "Maintain insurance naming Lender as loss payee"
    applies_to_all: true

financial_covenants:
  dscr_minimum:
    description: "Minimum quarterly DSCR of {min_dscr:.2f}x"
    applies_to_risk_grades: ["3", "4", "5", "6"]

  leverage_maximum:
    description: "Maximum Debt/EBITDA of {max_leverage:.2f}x tested quarterly"
    applies_to_risk_grades: ["4", "5", "6"]

  current_ratio_minimum:
    description: "Minimum current ratio of {min_ratio:.2f}x tested quarterly"
    applies_to_risk_grades: ["4", "5", "6"]

monitoring_covenants:
  monthly_reporting_high_risk:
    description: "Monthly borrowing base certificate and financial reporting"
    applies_to_risk_grades: ["5", "6", "7"]
    applies_to_products: ["revolver"]

  concentration_limit:
    description: "Top customer concentration not to exceed {max_pct}% of AR"
    default_max_pct: 35
    applies_to_risk_grades: ["4", "5", "6"]

  springing_dominion:
    description: "Cash dominion triggered if DSCR falls below 1.20x for two consecutive quarters"
    applies_to_risk_grades: ["5", "6"]

reporting_covenants:
  notice_requirements:
    description: "Prompt written notice of material adverse change, default, or litigation"
    applies_to_all: true

  compliance_certificate:
    description: "Annual compliance certificate executed by CFO"
    applies_to_risk_grades: ["1", "2", "3", "4", "5", "6"]

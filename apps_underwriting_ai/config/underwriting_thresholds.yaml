# Underwriting Policy Thresholds
# Defines minimum/maximum thresholds for underwriting decisions

capacity:
  min_dscr: 1.25
  max_debt_to_ebitda: 3.5
  min_ebitda_margin: 0.05

credit:
  min_fico: 680
  max_delinquencies_24m: 3
  max_defaults_ever: 0
  max_bankruptcies_ever: 0
  max_judgments_or_liens: 1
  max_tradeline_utilization: 0.80

collateral:
  max_ltv_term_loan: 0.80
  max_ltv_revolver: 0.85
  max_ltv_equipment: 0.75
  min_lien_position_eligible: "first"
  eligible_types:
    - ar
    - inventory
    - equipment
    - real_estate
    - mixed

liquidity:
  min_current_ratio: 1.20
  min_quick_ratio: 0.80
  min_cash_buffer_months: 1.0

industry:
  restricted_naics_prefixes:
    - "7132"  # Gambling
    - "7211"  # Casino hotels
    - "111"   # Agriculture (some lenders restrict)

  high_risk_naics_prefixes:
    - "722"   # Food services
    - "812"   # Personal services
    - "453"   # Miscellaneous store retailers

# Risk score thresholds
risk_grades:
  grade_1_max_score: 0.20
  grade_2_max_score: 0.30
  grade_3_max_score: 0.40
  grade_4_max_score: 0.50
  grade_5_max_score: 0.60
  grade_6_max_score: 0.70
  grade_7_max_score: 0.80
  grade_8_max_score: 0.90
  grade_9_max_score: 1.00

# Confidence thresholds
confidence:
  min_for_auto_approve: 0.80
  min_for_approve_conditions: 0.65
  min_for_counter_offer: 0.55
  min_for_pend: 0.40

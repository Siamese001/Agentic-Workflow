# apps_underwriting_ai Fort Knox app-domain contract — generated from tools/apps_proof/generate_compact_app_contracts.py
- eval_rubric_id: aer::apps_underwriting_ai::underwriting_decision::v1
  app_id: apps_underwriting_ai
  task_class: underwriting_decision
  version: 1.0.0
  status: active
  policy_hash: policy://apps_underwriting_ai/v1
  score_dimensions:
  - dimension_id: evidence_sufficiency
    description: Decision is backed by minimum evidence set.
    weight: 0.25
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: feature_derivation_correctness
    description: Derived features match expected computation.
    weight: 0.2
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: policy_compliance
    description: Decision respects underwriting policy.
    weight: 0.25
    grader_type: deterministic
    min_required_score: 0.99
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: explainability
    description: Decision carries an evidence-cited explanation.
    weight: 0.15
    grader_type: hybrid
    min_required_score: 0.7
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: capability
  - dimension_id: fairness
    description: No protected-attribute-based signal in decision.
    weight: 0.15
    grader_type: deterministic
    min_required_score: 0.99
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  # apps-underwriting-ai-rationale-judge-deferred-d4e7a2 W2.P3 — promoted to v3 LLM-as-judge.
  # RationaleQualityJudge v3 (IS_STUB=False, LLM primary + v2 deterministic fallback, Spearman≥0.85).
  # W1_COMPLETE: VERIFIED_ANALYST_ATTESTED by Amit Ayer 2026-05-06.
  # weight=0.05 keeps the original five weighted dims at their original proportions.
  # fail_closed_if_unknown: true — strict mode active.
  - dimension_id: rationale_quality
    description: Rationale text quality — length, evidence refs, explanation terms, policy signal.
    weight: 0.05
    grader_type: llm_as_judge
    min_required_score: 0.50
    evidence_required: false
    fail_closed_if_unknown: true
    taxonomy_class: capability
  # W3.P5 / apps-eval-harness-closeout-b7c9d2 W1.P1 - RAG metric dims with
  # OpenAI canonical baselines (context_recall 0.85, context_precision 0.70,
  # answer_relevancy 0.80). weight=0.0 keeps the existing weighted overall
  # unchanged. D6 (apps-underwriting-ai-deferred-scope-e8b2f4): flipped to
  # fail_closed_if_unknown: true now that E2E harness (D1) confirms C0
  # evidence flows into the exit bundle's final_evidence_contract.
  - dimension_id: context_recall
    description: RAG retrieval completeness (observed-evidence over needed-evidence).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.85
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::context_recall_judge::v2
  - dimension_id: context_precision
    description: RAG retrieval precision (signal-to-noise in retrieved chunks).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.70
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::context_precision_judge::v2
  - dimension_id: answer_relevancy
    description: Answer relevancy to the task intent.
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.80
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::answer_relevancy_judge::v2
  source_app_config_ref: apps_eval/config/rubrics/
  created_at: '2026-05-01'

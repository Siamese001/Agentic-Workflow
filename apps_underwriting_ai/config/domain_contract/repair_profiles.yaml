# apps_underwriting_ai repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.3
repair_profile_id: rp::apps_underwriting_ai::underwriting_decision::v1
app_id: apps_underwriting_ai
version: 1.0.0
status: active
source_app_config_ref: apps_underwriting_ai/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: abort_on_policy_violation
    stage_id: decision_assembly
    trigger_condition: score_below_threshold:policy_compliance:0.99
    recovery_action: abort_run
    rollback_target: none
    escalation_path: escalate_to_hitl
    max_attempts: 1
    priority: 1

  - scenario_id: abort_on_protected_attribute_leak
    stage_id: decision_assembly
    trigger_condition: score_below_threshold:protected_attribute_safety:0.99
    recovery_action: abort_run
    rollback_target: none
    escalation_path: escalate_to_hitl
    max_attempts: 1
    priority: 2

  - scenario_id: retry_on_low_decision_confidence
    stage_id: decision_assembly
    trigger_condition: score_below_threshold:decision_confidence:0.75
    recovery_action: retry_with_expanded_context:risk_signals
    rollback_target: decision_assembly
    healing_trigger: decision_confidence
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 3

  - scenario_id: retry_on_low_evidence_sufficiency
    stage_id: evidence_collection
    trigger_condition: score_below_threshold:evidence_sufficiency:0.8
    recovery_action: retry_with_expanded_context:retrieval_sources
    rollback_target: evidence_collection
    healing_trigger: evidence_sufficiency
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 4

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 5

# GitHub Actions Shared Configuration
# Use this file for workflow-level anchors and common definitions

# Common environment variables
common_env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

# Python version matrix
python_matrix:
  python-version: ['3.10', '3.11', '3.12']
  os: [ubuntu-latest, windows-latest]

# Test execution flags
test_flags:
  - -v
  - --tb=short
  - --strict-markers
  - --color=yes
  - --timeout=180

# Artifact retention
artifact_retention: 30

# Workflow triggers
standard_triggers:
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Branch protection target after GitHub CI rationalization.
# Apply these in GitHub branch protection; do not require conditional lanes or
# manual/full-repo evidence workflows.
branch_protection:
  protected_branches:
    - main
  required_checks:
    - workflow-reference-check
    - contract-summary
    - smoke-summary
  optional_checks:
    - adg-pr-delta / adg-pr-summary
  remove_required_checks:
    - r1b-terminal-smoke
    - runtime-spine-smoke
    - uwg-block-smoke
    - ADG CI Gates (Wave 0) / ADG CI Gates — Delta Enforcement (Wave 0)
    - runtime-certification
    - Eval Harness (capability + regression)
    - Graph Skills Authority Ratchet
    - apps-e2e-harness-nightly
    - Calibration Drift Detector
    - l3-otel-reconciliation
    - Runtime HITL Integrity Gate
    - underwriting-holdout-gate
    - Guardian Tests (Mandatory)
    - Author-Gate Harness HITL
    - agentic-core-auditability
    - ci-self-check / workflow-reference-check
    - contract-gates / contract-summary
    - runtime-smokes / smoke-summary

name: tier6-runtime-proof-gate

# Runs the Tier 6 runtime/static proof gate, which validates split-mode
# static evidence consistency for the 21 Tier 6 REQ_IDs:
#   - 6 MUST / RELEASE_BLOCKING rows: full code/validator/test/artifact/
#     replay/negative-control/OTEL ref existence + artifact+replay JSON
#     content matching + replay-pair invariant_digest stability.
#   - 15 NON_BLOCKING_REFERENCE rows: reference-only policy contract
#     (release_gate_rule, requirement_strength, policy artifact membership,
#     no fake replay/OTEL/negative-control claims).
# Static-only: does NOT execute replay machinery, OTEL exporters, or
# the proof harness. Does NOT run the full pytest suite.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tier6-runtime-proof-gate:
    name: "Tier 6 runtime proof gate (static evidence, split-mode)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (targeted-tests harness)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Tier 6 runtime proof gate
        run: |
          python scripts/verify_tier6_runtime_proof_gate.py

name: ADG Accelerators CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      accelerator:
        description: 'Accelerator to run'
        required: true
        default: 'testing-collection-safety'
        type: choice
        options:
          - testing-collection-safety
          - testing-gap-analysis
          - testing-scope
          - hardening-p0-check
          - hardening-p1-check
          - hardening-p2-check
          - incremental-scan
          - full-suite

jobs:
  # ============================================================================
  # Testing Accelerators
  # ============================================================================
  testing-collection-safety:
    name: Testing - Collection Safety
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'testing-collection-safety' || github.event.inputs.accelerator == 'full-suite' || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml
      
      - name: Run collection safety accelerator
        run: |
          python -m tools.adg.accelerators testing collection-safety --json artifacts/adg_collection_safety.json
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: adg-collection-safety
          path: artifacts/adg_collection_safety.json
          retention-days: 30

  testing-gap-analysis:
    name: Testing - Gap Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'testing-gap-analysis' || github.event.inputs.accelerator == 'full-suite'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run gap analysis accelerator
        run: |
          mkdir -p artifacts
          python -m tools.adg.accelerators testing gap --top 50 --json artifacts/adg_gap_analysis.json
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: adg-gap-analysis
          path: artifacts/adg_gap_analysis.json
          retention-days: 30

  testing-scope:
    name: Testing - Scoped Selection
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'testing-scope'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Get changed files
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
      
      - name: Run scope accelerator
        run: |
          # Run scope analysis on each changed Python file
          while read file; do
            if [[ $file == *.py ]]; then
              echo "Analyzing: $file"
              python -m tools.adg.accelerators testing scope --changed "$file" || true
            fi
          done < changed_files.txt

  # ============================================================================
  # Hardening Accelerators
  # ============================================================================
  hardening-p0-check:
    name: Hardening - P0 Check
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'hardening-p0-check' || github.event.inputs.accelerator == 'full-suite'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check P0 coverage by layer
        run: |
          for layer in L0 L1 L2 L3 L4 L5 L6; do
            echo "=== Checking P0 coverage for $layer ==="
            python tools/p0_batch_wirer.py --layer $layer --dim evidence --dry-run 2>/dev/null || true
          done
      
      - name: Generate P0 coverage report
        run: |
          mkdir -p artifacts
          echo "P0 coverage check completed" > artifacts/p0_coverage_check.txt

  hardening-p1-check:
    name: Hardening - P1 Check
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'hardening-p1-check' || github.event.inputs.accelerator == 'full-suite'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check P1 coverage
        run: |
          # Dry-run P1 wiring to check coverage
          python tools/p1_batch_wire.py --dry-run 2>/dev/null || echo "P1 check completed"
      
      - name: Generate P1 coverage report
        run: |
          mkdir -p artifacts
          echo "P1 coverage check completed" > artifacts/p1_coverage_check.txt

  hardening-p2-check:
    name: Hardening - P2 Check
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'hardening-p2-check' || github.event.inputs.accelerator == 'full-suite'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check P2 coverage
        run: |
          if [ -f "tools/p2_batch_wire.py" ]; then
            python tools/p2_batch_wire.py --dry-run 2>/dev/null || echo "P2 check completed"
          else
            echo "P2 batch wire not found, checking edge coverage via ADG"
            python tools/adg/adg_query_bridge.py --query "SELECT COUNT(*) FROM edges WHERE edge_kind LIKE '%P2%'" 2>/dev/null || true
          fi
      
      - name: Generate P2 coverage report
        run: |
          mkdir -p artifacts
          echo "P2 coverage check completed" > artifacts/p2_coverage_check.txt

  # ============================================================================
  # Incremental Accelerators
  # ============================================================================
  incremental-scan:
    name: Incremental - ADG Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.accelerator == 'incremental-scan' || github.event.inputs.accelerator == 'full-suite'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run incremental scan with cache
        run: |
          python tools/generate_full_adg.py --use-cache
      
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adg-scan-artifacts
          path: artifacts/adg/
          retention-days: 7

  # ============================================================================
  # Full Suite Summary
  # ============================================================================
  full-suite-summary:
    name: Full Suite Summary
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.accelerator == 'full-suite'
    needs: [testing-collection-safety, testing-gap-analysis, hardening-p0-check, hardening-p1-check, hardening-p2-check, incremental-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      
      - name: Generate summary report
        run: |
          echo "# ADG Accelerators Full Suite Report" > artifacts/FULL_SUITE_REPORT.md
          echo "" >> artifacts/FULL_SUITE_REPORT.md
          echo "## Collection Safety" >> artifacts/FULL_SUITE_REPORT.md
          cat artifacts/adg_collection_safety.json 2>/dev/null | head -50 >> artifacts/FULL_SUITE_REPORT.md || echo "No collection safety data" >> artifacts/FULL_SUITE_REPORT.md
          echo "" >> artifacts/FULL_SUITE_REPORT.md
          echo "## Gap Analysis" >> artifacts/FULL_SUITE_REPORT.md
          cat artifacts/adg_gap_analysis.json 2>/dev/null | head -50 >> artifacts/FULL_SUITE_REPORT.md || echo "No gap analysis data" >> artifacts/FULL_SUITE_REPORT.md
      
      - name: Upload full suite report
        uses: actions/upload-artifact@v4
        with:
          name: adg-full-suite-report
          path: artifacts/FULL_SUITE_REPORT.md
          retention-days: 30

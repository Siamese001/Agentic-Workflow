name: Multi-Environment Testing
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.11'
        - '3.12'
        test-category:
        - unit
        - integration
        include:
        - os: ubuntu-latest
          python-version: '3.12'
          test-category: smoke
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -r requirements.txt pytest pytest-cov
    - name: Run unit tests
      if: matrix.test-category == 'unit'
      run: pytest tests/unit/ -v --cov=agentic_core --cov-report=xml
    - name: Run integration tests
      if: matrix.test-category == 'integration'
      run: pytest tests/integration/ -v
    - name: Run smoke tests
      if: matrix.test-category == 'smoke'
      run: pytest tests/smoke/ -v
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.test-category
          }}
        path: test-results.xml,coverage.xml

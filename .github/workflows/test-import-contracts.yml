name: Test Import Contract Enforcement

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'agentic_core/**'
      - 'apps_*/**'
      - 'system_learning/**'
      - 'tools/**'
  push:
    branches: [main]

jobs:
  import-contract-gate:
    name: Validate Test Import Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate import contracts
        run: python tools/test_enforcement/validate_test_imports.py

      - name: Syntax check all test files
        run: python tools/test_enforcement/_syntax_check.py

  core-lane:
    name: Core Test Lane
    runs-on: ubuntu-latest
    needs: import-contract-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run core tests
        run: |
          python -m pytest tests/unit tests/architecture tests/enforcement \
            tests/governance tests/sovereign_hardening tests/unit/agentic_core/adg tests/guardian \
            tests/ci tests/agentic_core tests/system_learning \
            -m "not optional and not external and not platform and not experimental" \
            --tb=short -q

  optional-lane:
    name: Optional Test Lane
    runs-on: ubuntu-latest
    needs: import-contract-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install all dependencies
        run: pip install -e ".[dev,optional]"

      - name: Run optional tests
        run: |
          python -m pytest tests/ \
            -m "optional" \
            --tb=short -q

  full-lane:
    name: Full Test Lane
    runs-on: ubuntu-latest
    needs: [core-lane, optional-lane]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install all dependencies
        run: pip install -e ".[dev,optional]"

      - name: Run full test suite
        run: |
          python -m pytest tests/ \
            -m "not external and not experimental" \
            --tb=short -q

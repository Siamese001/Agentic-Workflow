name: codex-branch-bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codex-branch-bootstrap.yml"
      - ".codex-bootstrap-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package checkout
        run: |
          tar --exclude=.git -czf /tmp/agentic-workflow-source.tgz .
      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: agentic-workflow-source
          path: /tmp/agentic-workflow-source.tgz
          retention-days: 1

name: Calibration Drift Detector

# Closes G13 from runtime-gate-coverage-hardening-7e3f1a.md.
# Reads scorecard JSONL artifacts and runs ops_scripts/calibration/calibration_drift_detector.py
# manual calibration drift detector. Alerts via job annotation + uploaded artifact when per-judge unknown-rate breaches the
# `calibration_drift_policy` thresholds in apps_eval/config/eval_policies.yaml.

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Rolling window in days"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: calibration-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Run calibration drift detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal

      - name: Resolve window
        id: cfg
        run: echo "window=${{ github.event.inputs.window_days || '7' }}" >> "$GITHUB_OUTPUT"

      - name: Run detector
        id: detector
        continue-on-error: true   # we surface the exit code as an annotation, not a hard fail (yet)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python ops_scripts/calibration/calibration_drift_detector.py \
            --scorecard-dir artifacts/eval/scorecards \
            --window "${{ steps.cfg.outputs.window }}" \
            > drift_report.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "----- drift report -----"
          cat drift_report.txt
          exit 0

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-drift-report
          path: drift_report.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Annotate WARN
        if: steps.detector.outputs.exit_code == '1'
        run: |
          echo "::warning title=Calibration drift WARN::Per-judge unknown-rate breached the warn threshold. See drift_report.txt artifact."

      - name: Annotate ALERT and fail
        if: steps.detector.outputs.exit_code == '2'
        run: |
          echo "::error title=Calibration drift ALERT::Per-judge unknown-rate breached the ALERT threshold. Human recalibration required. See drift_report.txt."
          exit 1

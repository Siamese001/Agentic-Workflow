name: ADG Anti-Pattern Fixer — CI Enforcement (Accelerator #1)

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
  pull_request:
    branches: ["**"]
    paths:
      - "**.py"

jobs:
  guardian-comment-check:
    name: Guardian Comment Format — Check-Only (Accelerator #1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check guardian comment format on changed files
        run: |
          # Get all Python files changed in this push/PR vs base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # On first push before is all zeros — check all .py files
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1" 2>/dev/null || BASE=""
            fi
          fi

          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.py' 2>/dev/null || true)
          else
            CHANGED=$(git ls-files '*.py')
          fi

          if [ -z "$CHANGED" ]; then
            echo "[guardian-check] No Python files changed — skipping."
            exit 0
          fi

          echo "[guardian-check] Checking $(echo "$CHANGED" | wc -l | tr -d ' ') Python file(s)..."
          echo "$CHANGED" | tr '\n' '\0' | xargs -0 python tools/adg/adg_antipattern_fixer.py --check-only
        env:
          PYTHONPATH: .

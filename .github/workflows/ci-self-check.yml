name: ci-self-check

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      live_audit:
        description: "Run the live branch-protection drift audit"
        required: false
        default: "false"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-reference-check:
    name: workflow-reference-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Check changed workflow/action references
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python ops_scripts/ci/check_workflow_references.py --changed-only --base-sha "${PR_BASE_SHA}" --head-sha "${HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ]; then
            python ops_scripts/ci/check_workflow_references.py --changed-only --base-sha "${PUSH_BASE_SHA}" --head-sha "${HEAD_SHA}"
          else
            python ops_scripts/ci/check_workflow_references.py --all
          fi
      - name: Audit required-check manifest
        run: python ops_scripts/ci/audit_required_checks.py --config .github/workflow-config.yaml

  branch-protection-drift:
    name: branch-protection-drift
    if: github.event_name == 'schedule' || github.event.inputs.live_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Audit live branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops_scripts/ci/audit_required_checks.py --config .github/workflow-config.yaml --live --branch main --strict-live

  ci-waiver-expiry:
    name: ci-waiver-expiry
    if: github.event_name == 'schedule' || github.event.inputs.live_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Audit CI waiver expiry
        run: python ops_scripts/ci/check_ci_waiver_expiry.py

name: Pytest Config SSOT Validation

on:
  push:
    paths:
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.windsurf/rules/pytest-config-ssot.md'
      - 'ops_scripts/ci/_validate_pytest_config.py'
  pull_request:
    paths:
      - 'pytest.ini'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  validate-pytest-config:
    runs-on: ubuntu-latest
    name: Validate Pytest Config SSOT
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run SSOT validation
        run: |
          python ops_scripts/ci/_validate_pytest_config.py --strict
          
      - name: Check for auto-fix capability
        if: failure()
        run: |
          echo "::error::Pytest config drift detected. Run 'python ops_scripts/ci/_validate_pytest_config.py --fix' to auto-fix."
          exit 1

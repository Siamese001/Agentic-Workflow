name: tier5-runtime-proof-gate

# Runs the Tier 5 runtime-proof gate, which validates static evidence
# consistency for the 25 Tier 5 REQ_IDs (metadata surfaces, on-disk
# refs, and JSON content of artifact / replay / negative-control
# fixtures). Static-only: does NOT execute replay machinery, OTEL
# exporters, or the proof harness. Does NOT run the full pytest suite.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tier5-runtime-proof-gate:
    name: "Tier 5 runtime proof gate (static evidence)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (targeted-tests harness)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Tier 5 runtime proof gate
        run: |
          python scripts/verify_tier5_runtime_proof_gate.py

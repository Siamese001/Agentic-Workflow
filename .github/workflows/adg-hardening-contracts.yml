name: adg-hardening-contracts

on:
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/adg-hardening-contracts.yml"
      - ".codex/governance/scripts/pre_mcp_gate.py"
      - "agentic_core/adg/analysis/**"
      - "agentic_core/adg/artifact/**"
      - "ops_scripts/ci/adg_gates/**"
      - "ops_scripts/ci/check_adg_metric_registry.py"
      - "ops_scripts/ci/check_adg_query_plans.py"
      - "ops_scripts/ci/check_adg_writer_authority.py"
      - "tests/unit/agentic_core/adg/**"
      - "tests/agentic_core/adg/artifact/test_sqlite_writer_contract.py"
      - "tests/unit/ops_scripts/ci/adg_gates/**"
      - "tests/unit/tools/adg/**"
      - "tests/unit/tools/generate/**"
      - "tests/unit/tools/graphdb/**"
      - "tools/adg/**"
      - "tools/generate/**"
      - "tools/graphdb/**"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/adg-hardening-contracts.yml"
      - ".codex/governance/scripts/pre_mcp_gate.py"
      - "agentic_core/adg/analysis/**"
      - "agentic_core/adg/artifact/**"
      - "ops_scripts/ci/adg_gates/**"
      - "ops_scripts/ci/check_adg_metric_registry.py"
      - "ops_scripts/ci/check_adg_query_plans.py"
      - "ops_scripts/ci/check_adg_writer_authority.py"
      - "tests/unit/agentic_core/adg/**"
      - "tests/agentic_core/adg/artifact/test_sqlite_writer_contract.py"
      - "tests/unit/ops_scripts/ci/adg_gates/**"
      - "tests/unit/tools/adg/**"
      - "tests/unit/tools/generate/**"
      - "tests/unit/tools/graphdb/**"
      - "tools/adg/**"
      - "tools/generate/**"
      - "tools/graphdb/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adg-hardening:
    name: adg-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: Validate metric contracts
        run: python ops_scripts/ci/check_adg_metric_registry.py
      - name: Validate SQLite writer authority
        run: python ops_scripts/ci/check_adg_writer_authority.py
      - name: Run focused ADG hardening contracts
        run: |
          python -m pytest \
            tests/agentic_core/adg/artifact/test_sqlite_writer_contract.py \
            tests/unit/agentic_core/adg/test_canonical_snapshot_identity.py \
            tests/unit/ops_scripts/ci/adg_gates/test_write_sovereignty_temporal_contract.py \
            tests/unit/tools/adg/contracts/test_metric_registry.py \
            tests/unit/tools/adg/shared_modules/test_snapshot_registry.py \
            tests/unit/tools/adg/test_adg_mcp_fixes.py \
            tests/unit/tools/adg/test_adg_consumer_contract.py \
            tests/unit/tools/adg/test_query_catalog.py \
            tests/unit/tools/adg/test_audit_snapshot_promotion.py \
            tests/unit/tools/adg/test_reopen_connections_hardening.py \
            tests/unit/tools/generate/test_graph_projection.py \
            tests/unit/tools/generate/test_materialized_views_phase_d.py \
            tests/unit/tools/generate/test_materialized_views_phase_d_exact_diffs.py \
            tests/unit/tools/generate/test_sqlite_integrity_hardening.py \
            tests/unit/tools/graphdb/test_projection.py \
            -p no:xdist -p no:testmon -q --timeout=120

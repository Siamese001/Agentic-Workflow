name: Windsurf Governance Health Check

on:
  workflow_dispatch:

jobs:
  governance-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Windsurf Governance Health Check
        run: python ops_scripts/ci/check_windsurf_governance.py
      
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windsurf-governance-report
          path: |
            artifacts/governance/
          if-no-files-found: ignore

name: ADG Schema Canonical Field Names (§16)

on:
  push:
    branches: ["**"]
    paths:
      - 'ops_scripts/**'
      - 'tools/**'
      - 'agentic_core/adg/**'
      - 'ops_scripts/ci/check_adg_schema_field_names.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'ops_scripts/**'
      - 'tools/**'
      - 'agentic_core/adg/**'

env:
  SKIP_LOCAL_CHECKS: ${{ github.event_name == 'push' && 'true' || 'false' }}

jobs:
  adg-schema-field-names:
    name: ADG Schema Canonical Field Names Gate
    runs-on: ubuntu-latest
    if: env.SKIP_LOCAL_CHECKS != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ADG schema field name checker (§16)
        run: |
          echo "[PASS] Schema field name validation now handled by Windsurf pre-write hooks"
          echo "[INFO] Local validation provides immediate feedback during editing"
          echo "[INFO] CI runtime reduced by migrating to Windsurf skills"
          echo ""
          echo "[INFO] Schema validation enforces canonical field names per §16.2:"
          echo "   - entityType → entity_type"
          echo "   - entityName → name"
          echo "   - import_edges → imports"
          echo "   - call_edges → calls"
          echo "   - test_edges → tests"
        env:
          PYTHONPATH: .

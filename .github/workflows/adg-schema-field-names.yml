name: ADG Schema Canonical Field Names (§16)

on:
  push:
    branches: ["**"]
    paths:
      - 'ops_scripts/**'
      - 'tools/**'
      - 'agentic_core/adg/**'
      - 'ops_scripts/ci/check_adg_schema_field_names.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'ops_scripts/**'
      - 'tools/**'
      - 'agentic_core/adg/**'

jobs:
  adg-schema-field-names:
    name: ADG Schema Canonical Field Names Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ADG schema field name checker (§16)
        run: |
          if [ -f "ops_scripts/ci/check_adg_schema_field_names.py" ]; then
            python ops_scripts/ci/check_adg_schema_field_names.py
          else
            python - <<'PYEOF'
          import ast
          import sys
          from pathlib import Path

          # §16.2 canonical field name table: forbidden alias -> canonical key
          FORBIDDEN_ALIASES = {
              "entityType":    "entity_type",
              "entity_Type":   "entity_type",
              "EntityType":    "entity_type",
              "entityName":    "name",
              "node_name":     "name",
              "import_edges":  "imports",
              "dependencies":  "imports",
              "call_edges":    "calls",
              "invocations":   "calls",
              "test_edges":    "tests",
              "covered_by":    "tests",
              "fixture_edges": "fixtures",
              "file_path":     "module_path",
              "symbol_type":   "symbol_kind",
              "clusterID":     "cluster_id",
              "rootCause":     "root_cause",
          }

          SCAN_ROOTS = [Path("ops_scripts"), Path("tools")]
          violations = []

          def scan_file(path: Path) -> list:
              errs = []
              try:
                  source = path.read_text(encoding="utf-8", errors="replace")
                  tree = ast.parse(source, filename=str(path))
              except SyntaxError:
                  return errs

              for node in ast.walk(tree):
                  # Detect dict subscript: obj["entityType"] or obj['entityType']
                  if isinstance(node, ast.Subscript):
                      slice_node = node.slice
                      if isinstance(slice_node, ast.Constant) and isinstance(slice_node.value, str):
                          key = slice_node.value
                          if key in FORBIDDEN_ALIASES:
                              errs.append(
                                  f"{path}:{node.lineno}: "
                                  f"non-canonical ADG key [{key!r}] — "
                                  f"use [{FORBIDDEN_ALIASES[key]!r}] (§16.2)"
                              )
                  # Detect .get("entityType", ...) calls
                  if isinstance(node, ast.Call):
                      if (isinstance(node.func, ast.Attribute)
                              and node.func.attr == "get"
                              and node.args):
                          arg0 = node.args[0]
                          if isinstance(arg0, ast.Constant) and isinstance(arg0.value, str):
                              key = arg0.value
                              if key in FORBIDDEN_ALIASES:
                                  errs.append(
                                      f"{path}:{node.lineno}: "
                                      f"non-canonical ADG key .get({key!r}) — "
                                      f"use .get({FORBIDDEN_ALIASES[key]!r}) (§16.2)"
                                  )
              return errs

          for root in SCAN_ROOTS:
              if not root.exists():
                  continue
              for f in sorted(root.rglob("*.py")):
                  violations.extend(scan_file(f))

          if violations:
              print(f"\n§16 ADG SCHEMA FIELD NAME VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"  ❌ {v}")
              sys.exit(1)
          else:
              print(f"§16 ADG schema canonical field names: PASSED")
          PYEOF
          fi
        env:
          PYTHONPATH: .

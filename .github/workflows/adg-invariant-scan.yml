name: ADG Invariant Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  adg-scan:
    name: Architecture Dependency Graph Invariant Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . --no-deps || pip install -r requirements.txt --quiet || true

      - name: Run ADG full invariant scan
        run: |
          python -m agentic_core.adg.cli --repo-root . --commit "${{ github.sha }}" scan
        env:
          PYTHONPATH: .

      - name: Upload edge list artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-edge-list-${{ github.sha }}
          path: artifacts/adg/
          if-no-files-found: ignore

name: Main CI Pipeline
'on':
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/actions/common-setup
    - name: Run validation enforcement
      run: python tools/validation_runner.py
    - name: Upload validation report
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: artifacts/validation_enforcement_report.json
      if: always()
  test:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout pytest-cov pytest-xdist
    - name: Validate test suite
      run: python tools/wave6a_test_suite_validator.py
    - name: Run syntax validation
      run: |
        python -c "
import ast
from pathlib import Path
test_dir = Path('tests')
errors = 0
for test_file in test_dir.rglob('test_*.py'):
    try:
        with open(test_file, 'r') as f:
            content = f.read()
        ast.parse(content)
    except SyntaxError as e:
        print(f'Syntax error in {test_file}: {e}')
        errors += 1
print(f'Total syntax errors: {errors}')
exit(1 if errors > 0 else 0)
        "
    - name: Run test collection
      run: pytest --collect-only --quiet
    - name: Run smoke tests
      run: pytest tests/smoke/ -v --tb=short
    - name: Run unit tests (sample)
      run: pytest tests/unit/agentic_core/L0_routing/ -v --tb=short --maxfail=5
    - name: Run full test suite
      run: pytest tests/ -v --tb=short --junitxml=test-results.xml
    - name: Generate coverage report
      run: pytest tests/unit/ --cov=agentic_core --cov-report=xml --cov-report=html --maxfail=10
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
      if: always()
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false

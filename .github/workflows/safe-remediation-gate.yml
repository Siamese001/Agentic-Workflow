name: Safe Automated Remediation Gate

# Enforces §14 SAFE AUTOMATED REMEDIATION rules from .windsurfrules
# Runs on every push/PR to catch remediation violations before merge.

on:
  push:
    branches: ["**"]
    paths:
      - '**/*.py'
      - 'ops_scripts/**'
  pull_request:
    branches: ["**"]

jobs:
  parse-health-gate:
    # Rule 2 (§14.3): Every touched file must parse after mutation.
    name: "Rule 2 — Parse Health Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get changed Python files
        id: changed
        run: |
          python - <<'PYEOF'
          import subprocess, os, json
          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              # On first commit or shallow clone, diff against empty tree
              result = subprocess.run(
                  ["git", "diff", "--name-only", "4b825dc642cb6eb9a060e54bf8d69288fbee4904", "HEAD"],
                  capture_output=True, text=True
              )
          py_files = [
              f.strip() for f in result.stdout.splitlines()
              if f.strip().endswith(".py") and os.path.isfile(f.strip())
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"py_files={json.dumps(py_files)}\n")
              fh.write(f"count={len(py_files)}\n")
          print(f"Changed Python files ({len(py_files)}): {py_files}")
          PYEOF

      - name: Parse gate — all changed .py files must parse
        run: |
          python - <<'PYEOF'
          import ast, json, sys
          from pathlib import Path

          changed_raw = '${{ steps.changed.outputs.py_files }}'
          if not changed_raw or changed_raw == '[]':
              print("No changed Python files — parse gate trivially passes.")
              sys.exit(0)

          try:
              changed_files = json.loads(changed_raw)
          except json.JSONDecodeError:
              print("No changed Python files — parse gate trivially passes.")
              sys.exit(0)

          failures = []
          for fpath in changed_files:
              p = Path(fpath)
              if not p.exists():
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8", errors="replace"))
              except SyntaxError as e:
                  failures.append(f"  PARSE FAIL: {fpath}:{e.lineno} — {e.msg}")

          if failures:
              print("PARSE GATE FAILED (§14.3 Rule 2):")
              for f in failures:
                  print(f)
              print(f"\n{len(failures)} file(s) fail to parse after mutation.")
              print("Fix syntax errors before committing. No further phases may run.")
              sys.exit(1)

          print(f"OK: All {len(changed_files)} changed Python files parse cleanly.")
          PYEOF

  protected-files-gate:
    # Rule 8 (§14.9): Protected file classes must not be modified by generic fix scripts
    # without an explicit allowlist entry.
    name: "Rule 8 — Protected Files Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check protected files not modified without justification
        run: |
          python - <<'PYEOF'
          import subprocess, sys, fnmatch
          from pathlib import Path

          # §14.9 protected patterns
          PROTECTED_PATTERNS = [
              "*/__init__.py",
              "*/conftest.py",
              "*/config/*.py",
              "*/registry*.py",
              "*/orchestrat*.py",
              "*/bootstrap*.py",
              "structure_blueprint*.py",
              "agent_discovery*.json",
              "pyproject.toml",
              "pytest.ini",
          ]

          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              result = subprocess.run(
                  ["git", "diff", "--name-only",
                   "4b825dc642cb6eb9a060e54bf8d69288fbee4904", "HEAD"],
                  capture_output=True, text=True
              )

          changed = [f.strip() for f in result.stdout.splitlines() if f.strip()]

          def is_protected(path: str) -> bool:
              for pat in PROTECTED_PATTERNS:
                  if fnmatch.fnmatch(path, pat):
                      return True
                  # also match basename-only patterns
                  if fnmatch.fnmatch(Path(path).name, pat.lstrip("*/")):
                      return True
              return False

          # Check if a protected-class allowlist exists for this run
          # Convention: ops_scripts/ci/protected_class_allowlist.json
          allowlist_path = Path("ops_scripts/ci/protected_class_allowlist.json")
          allowed_files = set()
          if allowlist_path.exists():
              import json
              try:
                  data = json.loads(allowlist_path.read_text(encoding="utf-8"))
                  allowed_files = set(data.get("files", []))
              except Exception:
                  pass

          violations = []
          warnings = []
          for f in changed:
              if is_protected(f):
                  if f in allowed_files:
                      warnings.append(f"  ALLOWLISTED protected file modified: {f}")
                  else:
                      # Distinguish: manual edits (non-fix-script) are allowed.
                      # We flag as WARNING (not hard fail) unless the commit
                      # message contains '[fix-script]' or '[automated]' tokens,
                      # which indicate a fix-script run.
                      violations.append(f"  PROTECTED FILE MODIFIED: {f}")

          if warnings:
              print("Protected files modified via allowlist (§14.9 Rule 8):")
              for w in warnings:
                  print(w)

          if violations:
              # Check commit message for automated fix-script markers
              msg_result = subprocess.run(
                  ["git", "log", "-1", "--pretty=%B"],
                  capture_output=True, text=True
              )
              commit_msg = msg_result.stdout.lower()
              automated_markers = ["[fix-script]", "[automated]", "[codemod]", "[autofix]"]
              is_automated = any(m in commit_msg for m in automated_markers)

              if is_automated:
                  print("PROTECTED FILES GATE FAILED (§14.9 Rule 8):")
                  for v in violations:
                      print(v)
                  print(
                      "\nAutomated fix-script modified protected files without allowlist entry."
                      "\nAdd files to ops_scripts/ci/protected_class_allowlist.json with justification,"
                      "\nor use --include-protected flag with documented reason."
                  )
                  sys.exit(1)
              else:
                  print("Protected files modified by manual commit (allowed):")
                  for v in violations:
                      print(v.replace("PROTECTED FILE MODIFIED", "  INFO: protected file touched"))
                  print("OK: Manual edits to protected files are permitted.")

          if not violations and not warnings:
              print("OK: No protected files modified.")
          PYEOF

  test-collection-health-gate:
    # Rule 10 (§14.11) + §13: Test collection must not drop below baseline.
    # Rule 3 (§14.4): Checker health after all changes.
    name: "Rule 10 — Test Collection Health Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest --quiet

      - name: Test collection smoke — count must not drop
        run: |
          python - <<'PYEOF'
          import subprocess, sys, json
          from pathlib import Path

          baseline_path = Path("tests/_config/test_count_baseline.json")

          # Collect current test count
          result = subprocess.run(
              ["python", "-m", "pytest", "--collect-only", "-q", "tests/",
               "--ignore=tests/_quarantine"],
              capture_output=True, text=True, timeout=120
          )

          # Parse collection count from pytest output
          current_count = 0
          for line in result.stdout.splitlines() + result.stderr.splitlines():
              # pytest -q outputs "<N> tests collected" or "<N> selected"
              import re
              m = re.search(r"(\d+)\s+(?:tests?\s+)?collected", line)
              if m:
                  current_count = int(m.group(1))
                  break

          print(f"Current test collection count: {current_count}")

          if not baseline_path.exists():
              print(
                  "No test count baseline found at tests/_config/test_count_baseline.json."
                  "\nCollection smoke passes (no baseline to compare against)."
                  "\nCreate a baseline by running: python ops_scripts/ci/update_test_baseline.py"
              )
              sys.exit(0)

          try:
              baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
              baseline_count = baseline.get("total_collected", 0)
          except Exception as e:
              print(f"WARNING: Could not read baseline: {e}")
              sys.exit(0)

          print(f"Baseline test count: {baseline_count}")

          if current_count < baseline_count:
              drop = baseline_count - current_count
              print(
                  f"\nTEST COLLECTION GATE FAILED (§14.11 Rule 10 / §13):"
                  f"\n  Tests dropped from {baseline_count} to {current_count} (-{drop})."
                  f"\n  Possible causes: renamed files, broken imports, silent deselection,"
                  f"\n  moved tests, or accidental marker filtering."
                  f"\n  Fix collection errors before committing. No commits from corrupted state."
              )
              sys.exit(1)

          if current_count > baseline_count:
              added = current_count - baseline_count
              print(f"OK: Test count increased by {added} (baseline={baseline_count} → current={current_count}).")
          else:
              print(f"OK: Test count matches baseline ({baseline_count}).")
          PYEOF
        env:
          PYTHONPATH: .

  no-recovery-burndown-mix-gate:
    # Rule 13 (§14.14): Do not mix recovery and burndown.
    # Detects parse errors and import errors in the repo — if present, burndown is blocked.
    name: "Rule 13 — No Recovery+Burndown Mix Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan all changed files for parse errors
        run: |
          python - <<'PYEOF'
          import ast, subprocess, sys
          from pathlib import Path

          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              result = subprocess.run(
                  ["git", "diff", "--name-only",
                   "4b825dc642cb6eb9a060e54bf8d69288fbee4904", "HEAD"],
                  capture_output=True, text=True
              )

          changed_py = [
              f.strip() for f in result.stdout.splitlines()
              if f.strip().endswith(".py") and Path(f.strip()).exists()
          ]

          parse_failures = []
          for fpath in changed_py:
              try:
                  ast.parse(Path(fpath).read_text(encoding="utf-8", errors="replace"))
              except SyntaxError as e:
                  parse_failures.append(f"{fpath}:{e.lineno}: {e.msg}")

          if parse_failures:
              print("RECOVERY+BURNDOWN MIX GATE FAILED (§14.14 Rule 13):")
              print("Repository has parse errors. Recovery must come before burndown.")
              print("\nParse failures:")
              for f in parse_failures:
                  print(f"  {f}")
              print(
                  "\nOrdered recovery priority (§14.14):"
                  "\n  1. Restore parse health of all files"
                  "\n  2. Restore import health"
                  "\n  3. Restore test collection smoke"
                  "\n  4. Only then resume violation burndown"
              )
              sys.exit(1)

          print(f"OK: All {len(changed_py)} changed Python files parse cleanly. Recovery gate passes.")
          PYEOF

  remediation-batch-audit-gate:
    # Rule 11 (§14.12): Every fix-script batch must produce a REMEDIATION_BATCH evidence section.
    name: "Rule 11 — Remediation Batch Audit Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check fix-script commits have audit evidence
        run: |
          python - <<'PYEOF'
          import subprocess, sys, re
          from pathlib import Path

          # Check if this is an automated fix-script commit
          msg_result = subprocess.run(
              ["git", "log", "-1", "--pretty=%B"],
              capture_output=True, text=True
          )
          commit_msg = msg_result.stdout.lower()
          automated_markers = ["[fix-script]", "[automated]", "[codemod]", "[autofix]"]
          is_automated = any(m in commit_msg for m in automated_markers)

          if not is_automated:
              print("Not an automated fix-script commit — batch audit gate not applicable.")
              sys.exit(0)

          # Find evidence files changed in this commit
          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          changed = [f.strip() for f in result.stdout.splitlines() if f.strip()]

          evidence_files = [
              f for f in changed
              if f.startswith("docs/reports/") and f.endswith(".md")
          ]

          if not evidence_files:
              print(
                  "BATCH AUDIT GATE FAILED (§14.12 Rule 11):"
                  "\nAutomated fix-script commit detected but no evidence file found in docs/reports/."
                  "\nEvery fix-script batch MUST produce a ## REMEDIATION_BATCH evidence section."
              )
              sys.exit(1)

          # Check that at least one evidence file contains a REMEDIATION_BATCH section
          has_batch_section = False
          for ef in evidence_files:
              p = Path(ef)
              if p.exists():
                  content = p.read_text(encoding="utf-8", errors="replace")
                  if "## REMEDIATION_BATCH" in content:
                      has_batch_section = True
                      print(f"OK: Found ## REMEDIATION_BATCH section in {ef}")
                      break

          if not has_batch_section:
              print(
                  "BATCH AUDIT GATE FAILED (§14.12 Rule 11):"
                  "\nAutomated commit has evidence files but none contain ## REMEDIATION_BATCH section."
                  "\nRequired fields: Run ID, Issue class, Files declared/touched, Before/after counts,"
                  "\n  Parse gate result, Checker result, Rollback unit."
              )
              for ef in evidence_files:
                  print(f"  Evidence file checked: {ef}")
              sys.exit(1)
          PYEOF

  first-failure-wins-summary:
    # Rule 18 (§14.19): Integrity beats numeric burndown — summary gate.
    # This job depends on all other gates and provides a clear failure signal.
    name: "Rule 18 — First Failure Wins (Summary)"
    runs-on: ubuntu-latest
    needs:
      - parse-health-gate
      - protected-files-gate
      - test-collection-health-gate
      - no-recovery-burndown-mix-gate
      - remediation-batch-audit-gate
    if: always()
    steps:
      - name: Evaluate all gate results
        run: |
          python3 - <<'PYEOF'
          import sys

          results = {
              "parse-health-gate": "${{ needs.parse-health-gate.result }}",
              "protected-files-gate": "${{ needs.protected-files-gate.result }}",
              "test-collection-health-gate": "${{ needs.test-collection-health-gate.result }}",
              "no-recovery-burndown-mix-gate": "${{ needs.no-recovery-burndown-mix-gate.result }}",
              "remediation-batch-audit-gate": "${{ needs.remediation-batch-audit-gate.result }}",
          }

          failures = [name for name, result in results.items() if result == "failure"]
          successes = [name for name, result in results.items() if result == "success"]
          skipped = [name for name, result in results.items() if result in ("skipped", "cancelled")]

          print("=== SAFE REMEDIATION GATE SUMMARY (§14) ===")
          for name, result in results.items():
              icon = {"success": "✅", "failure": "❌", "skipped": "⏭️", "cancelled": "⚠️"}.get(result, "?")
              print(f"  {icon} {name}: {result}")

          if failures:
              print(f"\n❌ FIRST FAILURE WINS (§14.19 Rule 18): {len(failures)} gate(s) failed.")
              print("Integrity beats numeric burndown. Fix integrity issues before counting reductions.")
              print("\nFailed gates:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print(f"\n✅ All {len(successes)} safe remediation gates pass.")
              print("Integrity verified. Numeric burndown results are valid.")
          PYEOF

name: SSOT Kernel Guardrail

on:
  pull_request:
    branches: [ main, agentic-testing ]
  push:
    branches: [ main, agentic-testing ]

jobs:
  ssot-guardrail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Enforce SSOT Classification Kernel
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Scanning for shadow classification logic..."
          python -m agentic_core.L0_maintenance.enforcement.ssot_guardrail --fail --errors-only
          echo "SSOT Kernel guardrail passed — 0 shadow errors"

      - name: Run Classification Contract Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest
          python -m pytest tests/core/test_classification_contract.py -xvv

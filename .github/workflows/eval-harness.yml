name: Eval Harness (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [capability, regression]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Run eval suite
        run: |
          mkdir -p artifacts/eval
          python tools/eval/run_capability_regression.py \
            --rubrics config/judges/rubrics.yaml \
            --suite "${{ matrix.suite }}" \
            --out "artifacts/eval/${{ matrix.suite }}_run.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-eval-report
          path: artifacts/eval/${{ matrix.suite }}_run.json
          retention-days: 30

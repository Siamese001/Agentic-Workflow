# Import Resolution Guardian — Referential Integrity Gate
# Runs ImportResolutionGuardian on every push/PR to detect new unresolved
# internal imports. Also checks directory deletions for import sweep compliance.
name: Import Resolution Guardian

on:
  push:
    paths:
      - 'agentic_core/**'
      - 'apps_lic/**'
      - 'apps_rg/**'
      - 'apps_shared/**'
  pull_request:
    paths:
      - 'agentic_core/**'
      - 'apps_lic/**'
      - 'apps_rg/**'
      - 'apps_shared/**'

jobs:
  import-resolution-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ImportResolutionGuardian
        run: |
          python ops_scripts/ci/import_resolution_guardian.py

      - name: Run Directory Deletion Sweep (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python ops_scripts/ci/check_directory_deletion_sweep.py \
                 --base-ref origin/${{ github.base_ref }}

      - name: Upload import health report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: import-health-${{ github.sha }}
          path: artifacts/import_health/
          retention-days: 14

  import-strict-mode-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run tests with --import-strict (canary, non-blocking)
        env:
          IMPORT_STRICT_MODE: "1"
        run: |
          pytest tests/ -x --tb=line -q --import-strict 2>&1 | head -100 || true
          echo "::notice::Import strict mode canary complete. Check output for failures."

name: Environment Contract Gate (§20)

on:
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'apps_rg/**'
      - 'apps_lic/**'
      - 'apps_shared/**'
      - 'system_learning/**'
      - 'ops_scripts/**'
      - 'tools/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'apps_rg/**'
      - 'apps_lic/**'
      - 'apps_shared/**'
      - 'system_learning/**'

jobs:
  environment-contract:
    name: Environment Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run environment contract checker (§20)
        run: |
          if [ -f "ops_scripts/ci/check_environment_contract.py" ]; then
            python ops_scripts/ci/check_environment_contract.py
          else
            python - <<'PYEOF'
          import ast
          import re
          import sys
          from pathlib import Path

          SCAN_ROOTS = [
              Path("agentic_core"),
              Path("apps_rg"),
              Path("apps_lic"),
              Path("apps_shared"),
              Path("system_learning"),
          ]

          # Approved absolute path roots (CI-safe)
          APPROVED_PATH_ROOTS = [
              "/tmp/",
              "/var/",
              "/home/runner/",
              "/github/workspace/",
          ]

          # Availability-guarded imports (these require a guard before use)
          GUARDED_IMPORTS = {"vllm", "torch", "cuda", "transformers", "sentence_transformers"}

          violations = []
          warnings = []

          def is_approved_abs_path(value: str) -> bool:
              return any(value.startswith(r) for r in APPROVED_PATH_ROOTS)

          def scan_file(path: Path) -> None:
              try:
                  source = path.read_text(encoding="utf-8", errors="replace")
                  tree = ast.parse(source, filename=str(path))
              except SyntaxError:
                  return

              # Track which guarded imports have availability checks
              guarded_names: set[str] = set()

              for node in ast.walk(tree):
                  # ── Check 1: Hardcoded absolute paths ────────────────────────────
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      val = node.value
                      # Windows absolute paths (C:\...) or Unix absolute paths starting with /
                      if (
                          (len(val) > 3 and val[1:3] == ":\\" and val[0].isalpha())  # Windows
                          or (val.startswith("/") and len(val) > 5 and not is_approved_abs_path(val))
                      ):
                          # Exclude common non-path strings
                          if not any(skip in val for skip in ["://", "regex", "pattern", " "]):
                              violations.append(
                                  f"§20: {path}:{node.lineno} — hardcoded absolute path {val!r} "
                                  f"(differs between local and CI, §20.4)"
                              )

                  # ── Check 2: subprocess.run without explicit cwd ──────────────────
                  if isinstance(node, ast.Call):
                      func = node.func
                      func_name = ""
                      if isinstance(func, ast.Attribute):
                          func_name = func.attr
                      elif isinstance(func, ast.Name):
                          func_name = func.id

                      if func_name in ("run", "Popen", "check_output", "check_call"):
                          # Check if this is subprocess.run etc.
                          is_subprocess_call = False
                          if isinstance(func, ast.Attribute):
                              if isinstance(func.value, ast.Name) and func.value.id == "subprocess":
                                  is_subprocess_call = True
                              elif isinstance(func.value, ast.Attribute) and func.value.attr == "subprocess":
                                  is_subprocess_call = True
                          elif isinstance(func, ast.Name) and func_name in ("Popen", "check_output"):
                              is_subprocess_call = True

                          if is_subprocess_call:
                              kwarg_names = {kw.arg for kw in node.keywords}
                              if "cwd" not in kwarg_names:
                                  warnings.append(
                                      f"§20-WARN: {path}:{node.lineno} — subprocess call without "
                                      f"explicit 'cwd' parameter (path may differ in CI, §20.2)"
                                  )

                  # ── Check 3: sys.path manipulation in production code ─────────────
                  if isinstance(node, ast.Call):
                      func = node.func
                      if (isinstance(func, ast.Attribute)
                              and func.attr in ("insert", "append")
                              and isinstance(func.value, ast.Attribute)
                              and func.value.attr == "path"
                              and isinstance(func.value.value, ast.Name)
                              and func.value.value.id == "sys"):
                          violations.append(
                              f"§20: {path}:{node.lineno} — sys.path.{func.attr}() in production code "
                              f"(breaks CI import isolation, §20.4)"
                          )

              # ── Check 4: Guarded import availability ─────────────────────────────
              # Find all imports of guarded modules
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          base = alias.name.split(".")[0]
                          if base in GUARDED_IMPORTS:
                              guarded_names.add(base)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module:
                          base = node.module.split(".")[0]
                          if base in GUARDED_IMPORTS:
                              guarded_names.add(base)

              # If guarded imports exist, check for availability guards
              for name in guarded_names:
                  # Heuristic: look for try/except ImportError or hasattr/importlib check
                  source_lower = source.lower()
                  has_guard = (
                      "importerror" in source_lower
                      or "importlib" in source_lower
                      or f"try:" in source and f"import {name}" in source
                      or f"_available" in source_lower
                      or f"{name}_available" in source_lower
                  )
                  if not has_guard:
                      warnings.append(
                          f"§20-WARN: {path} imports '{name}' without availability guard. "
                          f"'{name}' may not be available in CI (§20.2, §20.4)"
                      )

          # Run scan
          scanned = 0
          for root in SCAN_ROOTS:
              if not root.exists():
                  continue
              for f in sorted(root.rglob("*.py")):
                  scan_file(f)
                  scanned += 1

          print(f"§20 Environment Contract Gate — scanned {scanned} file(s)")
          print(f"  {len(violations)} violation(s), {len(warnings)} warning(s)")

          for w in warnings:
              print(f"  ⚠️  {w}")

          if violations:
              print(f"\n§20 ENVIRONMENT CONTRACT VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"  ❌ {v}")
              sys.exit(1)
          else:
              print("§20 Environment contract gate: PASSED")
          PYEOF
          fi
        env:
          PYTHONPATH: .

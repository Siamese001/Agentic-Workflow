      - name: Emit L7 Fort Knox evidence
        run: python -m agentic_core.L7_auditability.fortknox.emit_l7_fortknox_evidence --artifact-dir ${{ env.W2_ARTIFACT_DIR }}
      - name: R1A - verify_integrated_runtime_artifact_chain
        run: python -m ops_scripts.ci.verify_integrated_runtime_artifact_chain
      - name: R1A - verify_integrated_runtime_entrypoint
        run: python -m ops_scripts.ci.verify_integrated_runtime_entrypoint
      - name: R1A - verify_spine_proof_bundle
        run: python -m ops_scripts.ci.verify_spine_proof_bundle
      - name: R1A - verify_integrated_runtime_manifest_exact_refs
        run: python -m ops_scripts.ci.verify_integrated_runtime_manifest_exact_refs
      - name: R1A - verify_agentic_core_how_trace
        run: python -m ops_scripts.ci.verify_agentic_core_how_trace
      - name: R1A - verify_l7_fortknox_evidence
        run: python -m ops_scripts.ci.verify_l7_fortknox_evidence
      - name: R1A - verify_agentic_core_l7_route_family_coverage
        run: python -m ops_scripts.ci.verify_agentic_core_l7_route_family_coverage
      - name: R1A - verify_r1a_exact_cache_l7_runtime (family)
        run: python -m ops_scripts.ci.verify_r1a_exact_cache_l7_runtime
      - name: Upload R1A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-core-auditability-r1a-${{ github.run_id }}
          path: artifacts/certification/integrated_runtime/r1a_latest/**/*.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────
  # R5_FALLBACK chain (Tier-A: SAFE_FALLBACK disposition)
  # ────────────────────────────────────────────────────────────────────
  r5-fallback-auditability:
    name: R5_FALLBACK chain (safe-fallback + L7 + Fort Knox)

permissions:
  contents: read

jobs:
  canonical-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: dev

      - name: Validate Wave 0 authority contract freeze
        run: python ops_scripts/ci/check_apps_research_rg_e2e_contract_freeze.py

      - name: Run Wave 0 authority negative controls
        run: python -m unittest tests.unit.ops_scripts.ci.test_apps_research_rg_e2e_contract_freeze -v

      - name: Run canonical producer-consumer handoff certification
        run: python ops_scripts/ci/check_apps_research_rg_handoff_e2e.py

      - name: Validate full-chain dependency structure
        run: python ops_scripts/ci/check_apps_research_rg_e2e_traceability.py --mode structural

      - name: Run full-chain certification groups and failure matrix
        run: python ops_scripts/ci/check_apps_research_rg_full_chain_e2e.py

      - name: Validate JUnit-backed requirement certification
        run: python ops_scripts/ci/check_apps_research_rg_e2e_traceability.py --mode evidence

      - name: Upload handoff test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-research-rg-handoff-test-evidence-${{ github.run_id }}
          path: |
            artifacts/apps_research_rg_handoff/**
            artifacts/apps_research_rg_e2e/**
          retention-days: 14

  certification-summary:
    if: always()
    needs: canonical-handoff
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical handoff proof
        env:
          RESULT: ${{ needs.canonical-handoff.result }}
        run: |
          test "$RESULT" = "success"
          echo "apps_research -> briefing.md -> apps_rg U0 canonical handoff proof: PASS"

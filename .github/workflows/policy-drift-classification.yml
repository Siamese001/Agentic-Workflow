name: Policy Drift Classification Gate (§18)

on:
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/L0_routing/**'
      - 'agentic_core/L3_orchestration/**'
      - 'agentic_core/L5_safety/**'
      - 'apps_rg/**'
      - 'apps_lic/**'
      - 'apps_shared/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'agentic_core/L0_routing/**'
      - 'agentic_core/L3_orchestration/**'
      - 'agentic_core/L5_safety/**'
      - 'apps_rg/**'
      - 'apps_lic/**'
      - 'apps_shared/**'

jobs:
  policy-drift:
    name: Policy Drift Classification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run policy drift classification checker (§18)
        run: |
          if [ -f "ops_scripts/ci/check_policy_drift_classification.py" ]; then
            python ops_scripts/ci/check_policy_drift_classification.py
          else
            python - <<'PYEOF'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Governance modules where policy_regression_fix is expected for policy changes
          GOVERNANCE_DIRS = [
              "agentic_core/L0_routing",
              "agentic_core/L3_orchestration",
              "agentic_core/L5_safety",
          ]

          PLANS_DIR = Path("docs/reports/plans")

          # Policy-sensitive symbol names (heuristic — not exhaustive)
          POLICY_SENSITIVE_SYMBOLS = [
              "fail_closed", "fail_open", "reject", "approve", "manual_review",
              "confidence_threshold", "routing_gate", "replay", "side_effect_guard",
              "mutation_gate", "human_review", "escalate", "auto_approve",
          ]

          violations = []
          warnings = []

          # ── Get changed files in this push/PR ─────────────────────────────────────
          def get_changed_files() -> list[str]:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                  capture_output=True, text=True, timeout=15
              )
              if result.returncode != 0:
                  # Fallback: diff against merge base
                  result = subprocess.run(
                      ["git", "diff", "--name-only", "origin/main...HEAD"],
                      capture_output=True, text=True, timeout=15
                  )
              return [f.strip() for f in result.stdout.strip().split("\n") if f.strip()]

          changed = get_changed_files()
          governance_changed = [
              f for f in changed
              if any(f.startswith(d) for d in GOVERNANCE_DIRS)
          ]

          if not governance_changed:
              print("§18: No governance modules changed — policy drift check not required.")
              sys.exit(0)

          print(f"§18: {len(governance_changed)} governance file(s) changed:")
          for f in governance_changed:
              print(f"  {f}")

          # ── Check recent commits for misclassified repair_class ───────────────────
          try:
              log_result = subprocess.run(
                  ["git", "log", "--oneline", "-5", "--format=%H %s %b"],
                  capture_output=True, text=True, timeout=15
              )
              commit_messages = log_result.stdout.strip()
          except Exception as e:
              commit_messages = ""
              warnings.append(f"Could not read commit log: {e}")

          # Look for commits that touch governance dirs with production_bug_fix class
          # but without a POLICY_DRIFT evidence section
          if "repair_class: production_bug_fix" in commit_messages:
              # Find linked evidence files
              evidence_has_policy_drift = False
              if PLANS_DIR.exists():
                  for f in sorted(PLANS_DIR.rglob("*.md")):
                      content = f.read_text(encoding="utf-8", errors="replace")
                      if "## POLICY_DRIFT" in content:
                          evidence_has_policy_drift = True
                          break

              if not evidence_has_policy_drift:
                  violations.append(
                      "§18.5: Commit with 'repair_class: production_bug_fix' touches governance "
                      "modules but no evidence file has a '## POLICY_DRIFT' section. "
                      "Policy changes in governance modules require 'repair_class: policy_regression_fix' "
                      "and a POLICY_DRIFT evidence section (§18.3)."
                  )

          # ── Scan changed governance files for policy-sensitive patterns ───────────
          for filepath in governance_changed:
              path = Path(filepath)
              if not path.exists() or path.suffix != ".py":
                  continue
              try:
                  source = path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue

              for symbol in POLICY_SENSITIVE_SYMBOLS:
                  if symbol in source:
                      # Check if there's a POLICY_DRIFT evidence entry for this file
                      has_evidence = False
                      if PLANS_DIR.exists():
                          for ef in sorted(PLANS_DIR.rglob("*.md")):
                              ec = ef.read_text(encoding="utf-8", errors="replace")
                              if "## POLICY_DRIFT" in ec and str(filepath) in ec:
                                  has_evidence = True
                                  break
                      if not has_evidence:
                          warnings.append(
                              f"§18-WARN: {filepath} contains policy-sensitive symbol '{symbol}' "
                              f"but no linked POLICY_DRIFT evidence section found. "
                              f"If this is a policy change, use repair_class: policy_regression_fix (§18.2)."
                          )
                      break  # one warning per file is enough

          # ── Report ─────────────────────────────────────────────────────────────────
          print(f"\n§18 Policy Drift Gate — {len(violations)} violation(s), {len(warnings)} warning(s)")
          for w in warnings:
              print(f"  ⚠️  {w}")

          if violations:
              print(f"\n§18 POLICY DRIFT VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"  ❌ {v}")
              sys.exit(1)
          else:
              print("§18 Policy drift classification gate: PASSED")
          PYEOF
          fi
        env:
          PYTHONPATH: .

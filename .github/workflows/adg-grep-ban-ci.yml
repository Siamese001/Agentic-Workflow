name: ADG Grep-Ban Gate

on:
  pull_request:
    paths:
      - "**.py"
  push:
    branches: [main, execute_ssot]
    paths:
      - "**.py"

env:
  SKIP_LOCAL_CHECKS: ${{ github.event_name == 'push' && 'true' || 'false' }}

jobs:
  grep-ban:
    name: "Reject grep/rg as ADG query substitutes"
    runs-on: ubuntu-latest
    if: env.SKIP_LOCAL_CHECKS != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install redis

      - name: Run ADG grep-ban gate (all Python files)
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: |
          echo "✅ Grep ban validation now handled by Windsurf pre-write hooks"
          echo "📋 Local validation provides immediate feedback during editing"
          echo "⚡ CI runtime reduced by migrating to Windsurf skills"

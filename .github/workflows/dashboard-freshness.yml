name: Dashboard Freshness Check

"on":
  pull_request:
    paths:
      - '**/*Agent.py'
      - 'agentic_core/L5_safety/validators/dashboard_*.py'
      - 'scripts/full_agent_discovery.py'
      - 'scripts/smart_discovery.py'
  push:
    branches: ["**"]
    paths:
      - '**/*Agent.py'
      - 'agentic_core/L5_safety/validators/dashboard_*.py'

jobs:
  check-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check dashboard freshness
      run: |
        python scripts/enforce_dashboard_freshness.py --check-only

    - name: Verify SSOT compliance
      run: |
        # Ensure dashboard sources from agent_discovery_full.json
        if ! grep -q "agent_discovery_full.json" agentic_core/L5_safety/validators/AutonomyGuardianAgent.py; then
          echo "❌ Dashboard does not source from SSOT JSON"
          exit 1
        fi
        echo "✅ Dashboard sources from SSOT JSON"

    - name: Upload dashboard artifacts (if failed)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: dashboard-logs
        path: |
          reports/autonomy_dashboard.html
          agent_discovery_full.json
          agent_discovery_full.manifest.json

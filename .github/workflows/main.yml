# File: .github/workflows/main.yml
# This pipeline triggers on pushes to main or any pull request.

name: Python CI/CD

# Triggers the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The 'test' job runs all your checks
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sets up the Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust this to your project's Python version
          cache: 'pip' # Caches dependencies to speed up future runs

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt # Assuming you have a requirements.txt file
          # Install test-specific dependencies
          pip install pytest pytest-asyncio pytest-cov redis
          
      # 4. Run the test suite
      # This step uses your provided test script to run the tests.
      # We use '--fast' to keep the CI pipeline quick.
      # For pull requests to main, you might run the full suite.
      - name: Run test suite (fast)
        run: |
          # Make the script executable
          chmod +x run_tests_v10_1.sh
          # Run the fast test suite
          ./run_tests_v10_1.sh --fast
          
      # 5. (Optional) Run full suite with coverage on main branch
      - name: Run full test suite with coverage (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          ./run_tests_v10_1.sh --coverage
          
      # 6. (Optional) Upload coverage report
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/ # Path to the coverage report generated

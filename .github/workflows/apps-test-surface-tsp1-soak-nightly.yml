# TSP1 apps_* test-surface parity — daily soak for fail-closed promotion.
#
# Plan: apps-test-surface-deferred-f3c8b2 (W1 / D1 / DoD-1)
# Gate: ops_scripts/ci/check_apps_test_surface_parity.py
#
# Each green run appends artifacts/ci/check_apps_test_surface_parity_<ts>.json.
# Promotion requires 30 consecutive exit-0 runs before APPS_TEST_SURFACE_FAIL_CLOSED=1.
#
# Manual: Actions → "Apps Test Surface TSP1 Soak (nightly)" → Run workflow

name: Apps Test Surface TSP1 Soak (nightly)

on:
  schedule:
    # 08:42 UTC daily — offset from :00 to reduce runner stampede.
    - cron: "42 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apps-test-surface-tsp1-soak
  cancel-in-progress: false

jobs:
  tsp1-soak:
    name: TSP1 soak (record artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TSP1 gate
        id: tsp1
        run: python ops_scripts/ci/check_apps_test_surface_parity.py

      - name: Commit soak artifact (exit 0 only)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ci/check_apps_test_surface_parity_*.json
          if git diff --staged --quiet; then
            echo "No new TSP1 soak artifact to commit."
            exit 0
          fi
          git commit -m "chore(ci): TSP1 soak artifact (nightly)"
          git push

      - name: Upload TSP1 artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsp1-soak-failure-${{ github.run_id }}
          path: artifacts/ci/check_apps_test_surface_parity_*.json
          if-no-files-found: ignore
          retention-days: 14

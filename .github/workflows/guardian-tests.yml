name: Guardian Tests (Mandatory)

on:
  push:
    paths:
      - 'agentic_core/L0_maintenance/**'
      - 'agentic_core/L5_safety/**'
      - 'tests/guardian/**'
  pull_request:
    paths:
      - 'agentic_core/L0_maintenance/**'
      - 'agentic_core/L5_safety/**'
      - 'tests/guardian/**'

jobs:
  guardian-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run Guardian tests (all phases)
        run: |
          pytest tests/guardian/ -v --tb=short -m guardian \
                 --ignore=tests/guardian/test_comprehensive_structure.py \
                 --ignore=tests/guardian/test_mro_integrity.py

      - name: Run aggregated guardian (--strict)
        run: |
          python -m agentic_core.L0_maintenance.scripts.run_all_guardians \
                 --write-artifacts docs/reports/guardian_artifacts \
                 --strict --format text \
                 --correlation-id "${{ github.sha }}"

      - name: Upload guardian artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-results-${{ github.sha }}
          path: |
            agentic_core/L0_maintenance/logs/guardian_report.json
            docs/reports/guardian_artifacts/
          retention-days: 14

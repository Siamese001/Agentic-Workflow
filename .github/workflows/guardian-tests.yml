# Guardian-Only Contract Gate
# Runs guardian tests and aggregated guardian on every push/PR touching
# guardian-relevant paths.  Collection exclusions for known-broken files
# are managed in tests/guardian/conftest.py (collect_ignore_glob).
name: Guardian Tests (Mandatory)

on:
  push:
    paths:
      - 'agentic_core/L0_routing/**'
      - 'agentic_core/L1_cognition/**'
      - 'agentic_core/L2_execution/**'
      - 'agentic_core/L3_orchestration/**'
      - 'agentic_core/L4_state/**'
      - 'agentic_core/L5_safety/**'
      - 'agentic_core/interfaces/**'
      - 'agentic_core/enforcement/**'
      - 'apps_lic/**'
      - 'apps_rg/**'
      - 'apps_shared/**'
      - 'tests/guardian/**'
      - 'tests/unit_min_deps/test_sovereignty_interfaces.py'
  pull_request:
    paths:
      - 'agentic_core/L0_routing/**'
      - 'agentic_core/L1_cognition/**'
      - 'agentic_core/L2_execution/**'
      - 'agentic_core/L3_orchestration/**'
      - 'agentic_core/L4_state/**'
      - 'agentic_core/L5_safety/**'
      - 'agentic_core/interfaces/**'
      - 'agentic_core/enforcement/**'
      - 'apps_lic/**'
      - 'apps_rg/**'
      - 'apps_shared/**'
      - 'tests/guardian/**'
      - 'tests/unit_min_deps/test_sovereignty_interfaces.py'

jobs:
  guardian-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/common-setup

      - name: Install pytest
        run: pip install pytest

      - name: Sovereignty interface tests (apps_* direct L* import boundary)
        run: |
          pytest tests/unit_min_deps/test_sovereignty_interfaces.py -v --tb=short

      - name: Run Guardian tests
        run: |
          pytest tests/guardian/ -v --tb=short

      - name: Run L4 State Sovereignty tests
        run: |
          pytest tests/guardian/test_l4_state_write_sovereignty.py -v --tb=short

      - name: Run L1 Cognition Purity tests
        run: |
          pytest tests/guardian/test_l1_cognition_purity_contract.py -v --tb=short

      - name: Run sovereignty guardian tests
        run: |
          pytest tests/guardian/test_guardian_gateway_bypass.py \
                 tests/guardian/test_guardian_c0_sovereignty.py \
                 tests/guardian/test_guardian_escalation_determinism.py \
                 tests/guardian/test_guardian_change_package_activation.py \
                 tests/guardian/test_guardian_cross_layer_mutation.py \
                 -v --tb=short

      - name: Run aggregated guardian (--strict)
        run: |
          python -m agentic_core.L0_routing.scripts.run_all_guardians \
                 --write-artifacts docs/reports/verification/guardian \
                 --strict --format text \
                 --correlation-id "${{ github.sha }}"

      - name: Guard against output-dir drift
        run: |
          if [ -d "docs/reports/guardian_artifacts" ]; then
            echo "::error::docs/reports/guardian_artifacts must not exist — guardian outputs belong under docs/reports/verification/guardian/"
            exit 1
          fi
          if find docs/reports/verification/guardian -name '*.py' 2>/dev/null | grep -q .; then  # guardian: allow-grep-yaml -- POSIX pipe-has-content idiom; not an ADG query substitute
            echo "::error::docs/reports/verification/guardian/ must not contain .py files — output dir is for JSON artifacts only"
            exit 1
          fi

      - name: Run ADG graph coverage guardian (H9)
        run: |
          pytest tests/guardian/test_adg_graph_coverage_guardian.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run ADG scanner governance (S10)
        run: |
          pytest tests/guardian/test_scanner_governance.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Upload guardian artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-results-${{ github.sha }}
          path: |
            agentic_core/L0_routing/logs/guardian_report.json
            docs/reports/verification/guardian/
          retention-days: 14

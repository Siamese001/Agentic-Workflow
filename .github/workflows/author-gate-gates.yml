name: Author-Gate Harness HITL

# Peer of adg-ci-gates.yml — distinct concern, separate workflow.
# Validates the developer-loop harness HITL subsystem:
#   - Decision ledger schema matches canonical DDL (no drift)
#   - Surfaced decisions older than 24h have outcome rows bound (learning loop intact)
#
# References:
#   - .windsurf/plans/harness-enforcement-rename-a8f21c.md (W2)
#   - ADR-023 (distinct from runtime HITL — do not conflate)

on:
  pull_request:
    paths:
      - '.windsurf/schemas/decision_ledger.schema.sql'
      - '.windsurf/schemas/decision_record.schema.json'
      - '.windsurf/scripts/apply_ledger_schema.py'
      - '.windsurf/scripts/post_cursor_agent_author_gate_capture.py'
      - '.windsurf/scripts/post_commit_outcome_binder.py'
      - 'ops_scripts/ci/author_gate/**'
      - '.windsurf/state/refactor_decisions/**'
  push:
    branches: [main]
    paths:
      - '.windsurf/schemas/decision_ledger.schema.sql'
      - '.windsurf/schemas/decision_record.schema.json'
      - '.windsurf/scripts/apply_ledger_schema.py'
      - '.windsurf/scripts/post_cursor_agent_author_gate_capture.py'
      - '.windsurf/scripts/post_commit_outcome_binder.py'
      - 'ops_scripts/ci/author_gate/**'
  workflow_dispatch: {}
  schedule:
    # Daily at 06:00 UTC — catches stale unbound decisions even without code changes
    - cron: '0 6 * * *'

concurrency:
  group: author-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  author-gate:
    name: Author-Gate Harness HITL Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50  # enough history for outcome binder lookback

      - name: Setup
        uses: ./.github/actions/common-setup

      - name: Schema drift check
        run: python ops_scripts/ci/author_gate/check_ledger_schema.py

      - name: Outcome coverage check
        run: python ops_scripts/ci/author_gate/check_outcome_coverage.py

      - name: Ledger integrity (hash-chain) check
        run: python ops_scripts/ci/author_gate/check_ledger_integrity.py

      - name: Binder dry-run (diagnostic only, non-blocking)
        continue-on-error: true
        run: python .windsurf/scripts/post_commit_outcome_binder.py --dry-run --lookback 20 --verbose

      - name: Upload ledger artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: decision-ledger-snapshot
          path: .windsurf/state/refactor_decisions/refactor_decision_ledger.sqlite
          if-no-files-found: ignore
          retention-days: 14

# Runtime smokes — consolidated (replaces r1b-terminal-smoke / runtime-spine-smoke /
# uwg-block-smoke). One workflow, three representative smoke jobs. A `changes` job
# (dorny/paths-filter) computes which smoke surfaces were touched so each smoke job
# only runs when its own paths change — preserving the selective per-path execution
# the three separate workflows had, with one file instead of three.
name: runtime-smokes

on:
  pull_request:
    branches: ["**"]
    paths:
      # union of the three former smoke triggers + this file
      - "agentic_core/**/terminal*"
      - "agentic_core/**/semantic_cache*"
      - "apps_rg/**/semantic_cache*"
      - "ops_scripts/ci/*r1b*.py"
      - "tools/certification/**/probe_r1b_terminal_exit.py"
      - "tests/runtime/test_r1b_terminal_exit_proof.py"
      - "agentic_core/runtime/**"
      - "agentic_core/L2_execution/**"
      - "agentic_core/L3_orchestration/**"
      - "agentic_core/L5_safety/**"
      - "agentic_core/L7_auditability/**"
      - "ops_scripts/ci/*runtime*.py"
      - "ops_scripts/ci/*spine*.py"
      - "ops_scripts/ci/verify_runtime_certification_matrix_schema.py"
      - "ops_scripts/ci/verify_runtime_certification_acceptance.py"
      - "ops_scripts/ci/verify_source_divergence.py"
      - "agentic_core/**/DurableWriteGateway*.py"
      - "agentic_core/**/durable_write_gateway*.py"
      - "agentic_core/**/mutation*"
      - "agentic_core/**/write_path*"
      - "ops_scripts/ci/*uwg*.py"
      - "tools/certification/regen_uwg_block_latest.py"
      - "tests/runtime/test_cache_fixture_vs_uwg_proof.py"
      - ".github/workflows/runtime-smokes.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Clear the Node-20 deprecation warning without chasing action major bumps.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: detect changed smoke surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      r1b: ${{ steps.filter.outputs.r1b }}
      spine: ${{ steps.filter.outputs.spine }}
      uwg: ${{ steps.filter.outputs.uwg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            r1b:
              - 'agentic_core/**/terminal*'
              - 'agentic_core/**/semantic_cache*'
              - 'apps_rg/**/semantic_cache*'
              - 'ops_scripts/ci/*r1b*.py'
              - 'tools/certification/**/probe_r1b_terminal_exit.py'
              - 'tests/runtime/test_r1b_terminal_exit_proof.py'
              - '.github/workflows/runtime-smokes.yml'
            spine:
              - 'agentic_core/runtime/**'
              - 'agentic_core/L2_execution/**'
              - 'agentic_core/L3_orchestration/**'
              - 'agentic_core/L5_safety/**'
              - 'agentic_core/L7_auditability/**'
              - 'ops_scripts/ci/*runtime*.py'
              - 'ops_scripts/ci/*spine*.py'
              - 'ops_scripts/ci/verify_runtime_certification_matrix_schema.py'
              - 'ops_scripts/ci/verify_runtime_certification_acceptance.py'
              - 'ops_scripts/ci/verify_source_divergence.py'
              - '.github/workflows/runtime-smokes.yml'
            uwg:
              - 'agentic_core/**/DurableWriteGateway*.py'
              - 'agentic_core/**/durable_write_gateway*.py'
              - 'agentic_core/**/mutation*'
              - 'agentic_core/**/write_path*'
              - 'ops_scripts/ci/*uwg*.py'
              - 'tools/certification/regen_uwg_block_latest.py'
              - 'tests/runtime/test_cache_fixture_vs_uwg_proof.py'
              - '.github/workflows/runtime-smokes.yml'

  r1b-terminal-smoke:
    name: r1b-terminal-smoke
    needs: changes
    if: needs.changes.outputs.r1b == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: R1B terminal representative smoke
        run: python -m pytest tests/runtime/test_r1b_terminal_exit_proof.py -p no:xdist -p no:testmon -q --timeout=120

  runtime-spine-smoke:
    name: runtime-spine-smoke
    needs: changes
    if: needs.changes.outputs.spine == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: Runtime spine representative smoke
        run: |
          python ops_scripts/ci/verify_runtime_certification_matrix_schema.py
          python ops_scripts/ci/verify_runtime_certification_acceptance.py
          python ops_scripts/ci/verify_source_divergence.py

  uwg-block-smoke:
    name: uwg-block-smoke
    needs: changes
    if: needs.changes.outputs.uwg == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout
      - name: UWG block representative smoke
        run: python -m pytest tests/runtime/test_cache_fixture_vs_uwg_proof.py -p no:xdist -p no:testmon -q --timeout=120

name: runtime-smokes

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      r1b-terminal: ${{ steps.filter.outputs.r1b-terminal }}
      runtime-spine: ${{ steps.filter.outputs.runtime-spine }}
      uwg-block: ${{ steps.filter.outputs.uwg-block }}
      selected-lanes: ${{ steps.filter.outputs.selected-lanes }}
      any: ${{ steps.filter.outputs.any }}
      changed-files: ${{ steps.filter.outputs.changed-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal

      - id: filter
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          else
            : > changed-files.txt
            printf '%s\n' \
              "agentic_core/runtime/manual_dispatch.py" \
              "agentic_core/semantic_cache/manual_dispatch.py" \
              "agentic_core/durable_write_gateway_manual_dispatch.py" >> changed-files.txt
          fi
          python ops_scripts/ci/classify_ci_lanes.py \
            --workflow runtime-smokes \
            --changed-files-file changed-files.txt \
            --base-ref "main" \
            --github-output "$GITHUB_OUTPUT"

  r1b-terminal:
    name: r1b-terminal
    needs: changes
    if: needs.changes.outputs.r1b-terminal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: R1B terminal representative smoke
        run: python -m pytest tests/runtime/test_r1b_terminal_exit_proof.py -p no:xdist -p no:testmon -q --timeout=120

  runtime-spine:
    name: runtime-spine
    needs: changes
    if: needs.changes.outputs.runtime-spine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: Runtime spine representative smoke
        run: |
          python ops_scripts/ci/verify_runtime_certification_matrix_schema.py
          python ops_scripts/ci/verify_runtime_certification_acceptance.py
          python ops_scripts/ci/verify_source_divergence.py

  uwg-block:
    name: uwg-block
    needs: changes
    if: needs.changes.outputs.uwg-block == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: UWG block representative smoke
        run: python -m pytest tests/runtime/test_cache_fixture_vs_uwg_proof.py -p no:xdist -p no:testmon -q --timeout=120

  smoke-summary:
    name: smoke-summary
    needs: [changes, r1b-terminal, runtime-spine, uwg-block]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal

      - name: Summarize runtime smoke routing
        env:
          ANY: ${{ needs.changes.outputs.any }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          R1B_RESULT: ${{ needs.r1b-terminal.result }}
          SPINE_RESULT: ${{ needs.runtime-spine.result }}
          UWG_RESULT: ${{ needs.uwg-block.result }}
          CHANGED_FILES: ${{ needs.changes.outputs.changed-files }}
          SELECTED_LANES: ${{ needs.changes.outputs.selected-lanes }}
        run: |
          set -euo pipefail
          echo "Changed files:"
          printf '%s\n' "${CHANGED_FILES:-<none>}"

          status="PASS"
          reason="relevant runtime smoke lanes passed"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Runtime-smoke routing failed before lane selection."
            status="FAIL_BLOCKING"
            reason="routing failed before lane selection"
          elif [ "${ANY}" != "true" ]; then
            echo "No runtime smoke lanes were relevant to this diff."
            status="SKIP_NOT_RELEVANT"
            reason="no runtime smoke lanes were relevant to this diff"
          else
            failed=0
            for lane in \
              "r1b-terminal:${R1B_RESULT}" \
              "runtime-spine:${SPINE_RESULT}" \
              "uwg-block:${UWG_RESULT}"; do
              name="${lane%%:*}"
              result="${lane#*:}"
              echo "${name}: ${result}"
              if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
                failed=1
              fi
            done

            if [ "${failed}" = "1" ]; then
              echo "::error::One or more relevant runtime smoke lanes failed."
              status="FAIL_BLOCKING"
              reason="one or more relevant runtime smoke lanes failed"
            fi
          fi

          mkdir -p artifacts/ci/runtime-smokes

          if [ -f ops_scripts/ci/write_ci_disposition.py ]; then
            python ops_scripts/ci/write_ci_disposition.py \
              --workflow runtime-smokes \
              --lane smoke-summary \
              --status "${status}" \
              --reason "${reason}" \
              --evidence-artifact "runtime-smokes-${{ github.run_id }}" \
              --selected-lanes-text "${SELECTED_LANES:-}" \
              --changed-files-text "${CHANGED_FILES:-}" \
              --out artifacts/ci/runtime-smokes/ci_disposition.json
          else
            echo "::warning::ops_scripts/ci/write_ci_disposition.py not found; writing fallback disposition JSON."
            STATUS="${status}" \
            REASON="${reason}" \
            EVIDENCE_ARTIFACT="runtime-smokes-${{ github.run_id }}" \
            SELECTED_LANES="${SELECTED_LANES:-}" \
            CHANGED_FILES="${CHANGED_FILES:-}" \
            python - <<'PY'
            import json
            import os
            from pathlib import Path


            def _split_csv(value: str) -> list[str]:
                items: list[str] = []
                for part in value.replace("\n", ",").split(","):
                    item = part.strip()
                    if item:
                        items.append(item)
                return items


            status = os.environ.get("STATUS", "")
            payload = {
                "workflow": "runtime-smokes",
                "lane": "smoke-summary",
                "status": status,
                "blocking": status == "FAIL_BLOCKING",
                "reason": os.environ.get("REASON", ""),
                "evidence_artifact": os.environ.get("EVIDENCE_ARTIFACT", ""),
                "selected_lanes": _split_csv(os.environ.get("SELECTED_LANES", "")),
                "changed_files": [line for line in os.environ.get("CHANGED_FILES", "").splitlines() if line.strip()],
            }
            out = Path("artifacts/ci/runtime-smokes/ci_disposition.json")
            out.parent.mkdir(parents=True, exist_ok=True)
            out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            PY
          fi

          if [ "${status}" = "FAIL_BLOCKING" ]; then
            exit 1
          fi

      - name: Upload smoke disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smokes-disposition-${{ github.run_id }}
          path: artifacts/ci/runtime-smokes/ci_disposition.json
          if-no-files-found: warn
          retention-days: 30

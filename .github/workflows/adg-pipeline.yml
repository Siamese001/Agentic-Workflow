name: ADG Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - full
          - quick
          - harden-only
          - test-only

jobs:
  # ============================================================================
  # Job 1: Test Preflight (Unified Testing Accelerator)
  # Replaces: pytest-collection-gate.yml (3 jobs) + adg-accelerators-ci testing jobs
  # ============================================================================
  test-preflight:
    name: Test Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Run ADG preflight
        run: |
          mkdir -p artifacts
          python tools/adg/adg_test.py preflight --strict --from-diff

      - name: Generate test report
        if: always()
        run: |
          python tools/adg/adg_test.py check --json artifacts/test_preflight.json || true
          python tools/adg/adg_test.py gap --top 20 --json artifacts/gap_analysis.json || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-preflight
          path: artifacts/*.json
          retention-days: 14

  # ============================================================================
  # Job 2: Hardening Check (Unified Hardening Accelerator)
  # Replaces: adg-accelerators-ci hardening jobs (p0, p1, p2)
  # ============================================================================
  harden-check:
    name: Hardening Coverage
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'full' || github.event.inputs.mode == 'harden-only' || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ADG hardening coverage
        run: |
          mkdir -p artifacts
          python tools/adg/adg_harden.py check --all --json artifacts/harden_coverage.json || true

      - name: Upload hardening artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harden-check
          path: artifacts/harden_coverage.json
          retention-days: 14

  # ============================================================================
  # Job 3: Lifecycle Maintain (Unified Lifecycle Accelerator)
  # Replaces: adg-accelerators-ci incremental-scan + manual ADG updates
  # ============================================================================
  lifecycle-maintain:
    name: ADG Lifecycle
    runs-on: ubuntu-latest
    needs: [test-preflight]
    if: always() && (github.event.inputs.mode == 'full' || github.event.inputs.mode == 'standard' || github.event_name != 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ADG status
        id: status
        run: |
          python tools/adg/adg_lifecycle.py status --json artifacts/adg_status.json || echo "status=missing" >> $GITHUB_OUTPUT

      - name: Maintain ADG (update if needed)
        run: |
          # Get changed Python files
          git diff --name-only HEAD~1 HEAD | grep '\.py$' > changed_files.txt || true

          if [ -s changed_files.txt ]; then
            echo "Changed files:"
            cat changed_files.txt
            # Run incremental update
            python tools/adg/adg_lifecycle.py update --changed $(cat changed_files.txt | tr '\n' ' ') || \
              python tools/adg/adg_lifecycle.py generate --cache
          else
            echo "No Python files changed, checking freshness..."
            python tools/adg/adg_lifecycle.py status || python tools/adg/adg_lifecycle.py generate --cache
          fi

      - name: Sync to Redis
        if: github.ref == 'refs/heads/main'
        run: |
          python tools/adg/adg_lifecycle.py sync --to-redis || echo "Redis sync optional"

      - name: Upload lifecycle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-maintain
          path: artifacts/adg_*.json
          retention-days: 7

  # ============================================================================
  # Job 4: Pipeline Summary
  # ============================================================================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test-preflight, harden-check, lifecycle-maintain]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate summary report
        run: |
          echo "# ADG Pipeline Report" > artifacts/PIPELINE_REPORT.md
          echo "" >> artifacts/PIPELINE_REPORT.md
          echo "## Test Preflight" >> artifacts/PIPELINE_REPORT.md
          if [ -f artifacts/test_preflight.json ]; then
            echo "\`\`\`json" >> artifacts/PIPELINE_REPORT.md
            cat artifacts/test_preflight.json >> artifacts/PIPELINE_REPORT.md
            echo "\`\`\`" >> artifacts/PIPELINE_REPORT.md
          else
            echo "No test preflight data" >> artifacts/PIPELINE_REPORT.md
          fi

          echo "" >> artifacts/PIPELINE_REPORT.md
          echo "## Gap Analysis" >> artifacts/PIPELINE_REPORT.md
          if [ -f artifacts/gap_analysis.json ]; then
            echo "Top uncovered modules:" >> artifacts/PIPELINE_REPORT.md
            cat artifacts/gap_analysis.json | grep -A 50 "uncovered_modules" | head -30 >> artifacts/PIPELINE_REPORT.md
          fi

          echo "" >> artifacts/PIPELINE_REPORT.md
          echo "## Hardening Coverage" >> artifacts/PIPELINE_REPORT.md
          if [ -f artifacts/harden_coverage.json ]; then
            echo "\`\`\`json" >> artifacts/PIPELINE_REPORT.md
            cat artifacts/harden_coverage.json >> artifacts/PIPELINE_REPORT.md
            echo "\`\`\`" >> artifacts/PIPELINE_REPORT.md
          fi

          echo "" >> artifacts/PIPELINE_REPORT.md
          echo "## ADG Status" >> artifacts/PIPELINE_REPORT.md
          if [ -f artifacts/adg_status.json ]; then
            echo "\`\`\`json" >> artifacts/PIPELINE_REPORT.md
            cat artifacts/adg_status.json >> artifacts/PIPELINE_REPORT.md
            echo "\`\`\`" >> artifacts/PIPELINE_REPORT.md
          fi

          cat artifacts/PIPELINE_REPORT.md

      - name: Upload pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: artifacts/PIPELINE_REPORT.md
          retention-days: 30

      - name: Check results
        run: |
          # Fail if test-preflight failed
          if [ "${{ needs.test-preflight.result }}" != "success" ]; then
            echo "❌ Test preflight failed"
            exit 1
          fi
          echo "✅ All checks passed"

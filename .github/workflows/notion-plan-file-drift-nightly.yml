# Notion ↔ disk plan-file drift nightly check.
#
# Auto-captured from NEXT_STEP marker (2026-04-24):
#   plan=NEW:next-step-gate-ci-workflow
#   priority=P4
#   reason=Run notion-plan-file-drift --hook-stage manual nightly so orphans
#          surface within 24h instead of only when a human runs it manually.
#
# Scope: runs ops_scripts/ci/check_notion_plan_file_drift.py against the
# Wave/Phase Convergence DB (`aa8d2507-101e-4384-81d9-60ea3fe33876`).
# Open rows whose Plan File property does not resolve to a file under
# plans/ produce a per-row report and fail the job.
#
# Policy: STRICT_DRIFT=1 is set so a missing NOTION_TOKEN (misconfig) also
# fails the run — nightly is meant to be authoritative.
#
# Manual dispatch is also enabled so operators can run the gate on demand
# after manually adding/removing Notion rows or plan files.

name: Notion Plan-File Drift (nightly)

on:
  schedule:
    # 07:17 UTC every day — offset from the hour to avoid the :00 GH stampede.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notion-plan-file-drift
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run drift gate (strict)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          STRICT_DRIFT: "1"
        run: |
          python ops_scripts/ci/check_notion_plan_file_drift.py

      - name: Upload drift audit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-file-drift-log
          path: artifacts/governance/plan_file_drift.jsonl
          if-no-files-found: ignore
          retention-days: 30

name: Prompt Governance

on:
  push:
    paths:
      - 'docs/reports/assessments/prompt-modules/**'
      - 'docs/reports/assessments/Prompt v5.4 State Gap Implementation.md'
  pull_request:
    paths:
      - 'docs/reports/assessments/prompt-modules/**'
      - 'docs/reports/assessments/Prompt v5.4 State Gap Implementation.md'

jobs:
  validate-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate prompt assembly
        run: python docs/reports/assessments/prompt-modules/validation/validate_assembly.py

name: ADG CI Gates (Wave 0)

on:
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'apps_shared/**'
      - 'apps_lic/**'
      - 'apps_rg/**'
      - 'apps_exec/**'
      - 'apps_eval/**'
      - 'apps_rfp/**'
      - 'apps_research/**'
      - 'ops_scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'system_learning/**'
  pull_request:
    branches: ["**"]

jobs:
  adg-ci-gates:
    name: ADG CI Gates — Delta Enforcement (Wave 0)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: ./.github/actions/common-setup

      - name: Install extra dependencies for ADG
        run: |
          pip install redis
          pip install -e . --no-deps 2>/dev/null || pip install -r requirements.txt --quiet 2>/dev/null || true

      - name: Ingest ADG into Redis
        run: python tools/adg/adg_redis_ingest.py --force
        env:
          PYTHONPATH: .

      - name: ADG Staleness Verify (blocking — confirms ingest against HEAD)
        run: python tools/adg/adg_stale_guard.py
        env:
          PYTHONPATH: .

      - name: Snapshot Graph-Layer Completeness Gate (§22 artifact side)
        # Symmetric enforcement for check_graph_layer_evidence.py (plan side):
        # asserts the latest adg_indexed_*.sqlite ships with mv_* + v_p* +
        # infra-wiring views, per plan adg-pipeline-e2e-5287a1 W2.
        # Prevents silent regression of the W1 enrichment-before-gates ordering.
        run: python ops_scripts/ci/check_snapshot_has_mvs.py
        env:
          PYTHONPATH: .

      - name: Expected-Wiring Gate (declared call-site assertions)
        # Runs immediately after ADG ingest so wiring regressions surface at the
        # ADG step, not at pre-commit. Reads config/expected_wiring.yaml + asserts
        # each required_call is present in its entry_symbol's AST subtree.
        # Also invoked locally at the end of `python tools/generate_full_adg.py`.
        run: python ops_scripts/ci/check_expected_wiring.py
        env:
          PYTHONPATH: .

      - name: Config-Reference Gate (env-flag declaration integrity)
        # Asserts every os.getenv / os.environ read resolves to either a key
        # declared in .env.example, or an allowlisted external/OS-provided flag.
        # Baseline ratchet — only NEW undeclared flags fail the build.
        run: python ops_scripts/ci/check_config_references.py --allow-unreferenced
        env:
          PYTHONPATH: .

      - name: Lifecycle-Pair Gate (resource open/close symmetry)
        # Enforces that every declared opener (sqlite3.connect, open, redis.Redis)
        # has a matching closer in the enclosing function (with-stmt, .close(),
        # or self.<attr> assignment). Baseline ratchet — NEW leaks fail the build.
        run: python ops_scripts/ci/check_lifecycle_pairs.py
        env:
          PYTHONPATH: .

      - name: Exception-Contract Gate (raise/catch symmetry over ADG fan-in)
        # For each declared contract in config/exception_contracts.yaml,
        # resolves the raiser's callers via ADG fan-in and asserts at least
        # require_n_handlers of them catch the declared exception class.
        run: python ops_scripts/ci/check_exception_contract.py
        env:
          PYTHONPATH: .

      - name: Test-Harness Coverage Gate (structural — every prod module has a test import)
        # Queries ADG for production modules (agentic_core/L*, apps_*/engines,
        # apps_*/integrations) that have ZERO imports edge from any file under
        # tests/. Baseline ratchet — fails only on NEW uncovered modules.
        run: python ops_scripts/ci/check_test_harness_coverage.py
        env:
          PYTHONPATH: .

      - name: Install MCP test dependencies
        run: pip install fakeredis --quiet 2>/dev/null || true

      - name: MCP Server Contract Gate (Layer 1 static + Layer 4 regressions)
        run: |
          python -m pytest tests/unit/agentic_core/adg/test_adg_mcp_server_contracts.py \
            -k "TestStaticStructuralContracts or TestKnownBugRegressions or TestResponseShapeContracts" \
            -v --no-header --tb=short
        env:
          PYTHONPATH: .

      - name: MCP Server Integration Gate (Layer 3 — requires Redis db=15)
        run: |
          python -m pytest tests/unit/agentic_core/adg/test_adg_mcp_server_contracts.py::TestAllToolsRespond \
            -v --no-header --tb=short
        env:
          PYTHONPATH: .
          ADG_REDIS_URL: redis://localhost:6379/15

      - name: M1 — Determinism Gate (warn mode until W4 exit)
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('ADG_CI_GATES_WARN_ALL', '0')
          from ops_scripts.ci._adg_ci_gates import cmd_check
          # Individual gate check via status print
          from ops_scripts.ci._adg_ci_gates import _get_gpc, _load_baseline, _eval_m1
          cur = _get_gpc()
          bl = _load_baseline()
          passed, msg = _eval_m1(cur, bl.get('snapshot', {}))
          mode = bl.get('gate_modes', {}).get('M1', 'warn')
          print(f'M1 [{mode}]: {\"PASS\" if passed else \"FAIL/WARN\"} — {msg}')
          if not passed and mode == 'enforce':
              sys.exit(1)
          "
        env:
          PYTHONPATH: .

      - name: M2 — Dispatch Visibility Gate (warn mode until W2 exit)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from ops_scripts.ci._adg_ci_gates import _get_gpc, _load_baseline, _eval_m2

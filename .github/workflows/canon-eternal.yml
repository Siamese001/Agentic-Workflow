# .github/workflows/canon-eternal.yml
# SUBATOMIC CANON 2025 — ETERNAL CLOUD ENFORCEMENT
# The canon now lives in the cloud. No escape. Forever.

name: "♦ SUBATOMIC CANON — 40/40 ETERNAL VALIDATION ♦"

on:
  push:
    branches: [main, master, develop, release/**]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon-enforcement:
    name: "40/40 SUBATOMIC PERFECTION OR DIE"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accurate git status tracking

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install canon dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: "♦ RUN THE CANON — 40/40 OR REJECT ♦"
        id: canon
        run: |
          echo "============================================"
          echo "♦ THE CANON AWAKENS ♦"
          echo "============================================"
          echo ""
          python canon_validator.py --check-40 --hard-fail
          echo ""
          echo "============================================"
          echo "♦ 40/40 ACHIEVED — PERFECTION CONFIRMED ♦"
          echo "============================================"

      - name: Upload canon report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canon-failure-report
          path: |
            canon_failure_*.log
            .git/CANON_*.tmp
          retention-days: 7

  required-status:
    name: "MERGE GATE — PERFECTION REQUIRED"
    needs: canon-enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Confirm 40/40 achieved
        run: |
          echo "============================================"
          echo "♦ 40/40 SUBATOMIC PERFECTION ACHIEVED ♦"
          echo "♦ MERGE APPROVED ♦"
          echo "============================================"
          echo ""
          echo "The canon has spoken."
          echo "This code is worthy."
          echo "Diamond eternal."

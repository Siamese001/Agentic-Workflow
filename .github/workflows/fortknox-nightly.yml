name: fortknox-nightly
# Fort Knox nightly regression scan — Constitutional §32.
#
# Regenerates the compiler + bundle verifier + mutation rejection bundle,
# diffs trust_level, summary counts, and merkle_root against the committed
# artifacts, and opens a GitHub issue tagged `cert-regression` on any
# material regression. Uploads all generated artifacts for independent audit.
#
# Non-goals:
#   * no signing (deferred to separate signer-identity Author-Gate; P5 of
#     the fortknox-certification-discipline-fb2a9e plan)
#   * no direct commit of regenerated artifacts (workflow reports drift,
#     humans remediate)
#
# Advisory rule: .windsurf/rules/fortknox-certification-discipline.md
# Pre-commit mirrors: .pre-commit-config.yaml T7s.1 / T7s.2 / T7s.3

on:
  schedule:
    # 02:17 UTC nightly — offset from common hour marks to smooth runner load.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      skip_mutation:
        description: "Skip mutation rejection run (faster smoke check)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  fortknox-regression-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Snapshot yesterday's artifacts (baseline for diff)
        id: baseline
        run: |
          mkdir -p /tmp/fortknox_baseline
          for f in final_requirement_signoff_report.json \
                    final_requirement_signoff_report.sha256 \
                    final_requirement_signoff_report.merkle.json \
                    fortknox_mutation_rejection_report.json; do
            src="artifacts/certification/$f"
            if [ -f "$src" ]; then
              cp "$src" "/tmp/fortknox_baseline/$f"
            fi
          done
          echo "baseline_snapshot_ok=true" >> "$GITHUB_OUTPUT"

      - name: Run RTC-REQ CSV gate verifier (fail-closed)
        id: csv_gate
        run: |
          python scripts/verify_rtc_req_csv_gate.py

      - name: Emit CI gate binding report
        id: ci_binding
        run: |
          python -m pip install pyyaml
          python tools/cert/emit_ci_gate_binding_report.py

      - name: Emit layer-boundary report for CSV gate verifier
        id: layer_boundary
        run: |
          python tools/cert/emit_layer_boundary_report.py

      - name: Rebuild positive-control fixtures (uses freshly emitted reports)
        id: fixtures
        run: |
          python tools/cert/build_positive_control_fixtures.py

      - name: Regenerate clean bundle (compiler + bundle verifier)
        id: clean
        run: |
          python scripts/compile_requirement_signoff.py
          python scripts/verify_final_requirement_signoff_bundle.py

      - name: Run mutation rejection
        id: mutation
        if: ${{ inputs.skip_mutation != 'true' }}
        run: |
          python scripts/generate_mutation_rejection_report.py

      - name: Run positive-control gate
        id: positive
        run: |
          python ops_scripts/ci/check_fortknox_positive_control.py

      - name: Diff against baseline
        id: diff
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          base = pathlib.Path("/tmp/fortknox_baseline")
          cur = pathlib.Path("artifacts/certification")
          regressions = []

          def load(p):
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return None

          # trust_level regression
          b = load(base / "final_requirement_signoff_report.json")
          c = load(cur / "final_requirement_signoff_report.json")
          ORDER = ["FAILED","UNSIGNED_BLOCKED","DEVELOPMENT_PROOF","INTEGRITY_PROOF","SIGNED_PROOF","FINAL_SIGNED_CERTIFICATION"]
          def rank(tl):
              try: return ORDER.index(tl)
              except ValueError: return -1
          if b and c:
              if rank(c.get("trust_level")) < rank(b.get("trust_level")):
                  regressions.append(f"trust_level regressed: {b.get('trust_level')} -> {c.get('trust_level')}")
              # signed_off count
              def signed(r):
                  rows = r.get("per_requirement") or r.get("requirements") or {}
                  if isinstance(rows, list):
                      rows = {x.get("req_id"): x for x in rows if isinstance(x, dict)}
                  return sum(1 for v in rows.values() if isinstance(v, dict) and (v.get("computed_status") or v.get("status")) == "SIGNED_OFF")
              if signed(c) < signed(b):
                  regressions.append(f"signed_off count regressed: {signed(b)} -> {signed(c)}")
              if b.get("merkle_root") and c.get("merkle_root") and b.get("merkle_root") != c.get("merkle_root"):
                  # drift is normal; only flag if trust_level or signed_off also regressed
                  pass

          # mutation rejection: any newly-accepted mutation is a regression
          bm = load(base / "fortknox_mutation_rejection_report.json")
          cm = load(cur / "fortknox_mutation_rejection_report.json")
          if bm and cm:
              if bm.get("overall_verdict") == "PASS" and cm.get("overall_verdict") != "PASS":
                  regressions.append(f"mutation verdict regressed: PASS -> {cm.get('overall_verdict')}")
              if cm.get("clean_bundle_unchanged") is False:
                  regressions.append("clean_bundle_unchanged=false (mutation run corrupted clean bundle)")

          pathlib.Path("/tmp/fortknox_regressions.json").write_text(
              json.dumps({"regressions": regressions}, indent=2), encoding="utf-8"
          )
          print("regression_count=" + str(len(regressions)))
          if regressions:
              for r in regressions:
                  print("REGRESSION:", r)
              # expose to subsequent steps
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"regression_count={len(regressions)}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("regression_count=0\n")
          PY

      - name: Upload artifacts for audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortknox-nightly-${{ github.run_id }}
          path: |
            artifacts/certification/final_requirement_signoff_report.json
            artifacts/certification/final_requirement_signoff_report.sha256
            artifacts/certification/final_requirement_signoff_report.merkle.json
            artifacts/certification/final_requirement_signoff_report.signature.json
            artifacts/certification/fortknox_mutation_rejection_report.json
            /tmp/fortknox_regressions.json
          retention-days: 30
          if-no-files-found: warn

      - name: Open regression issue
        if: ${{ steps.diff.outputs.regression_count != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/fortknox_regressions.json','utf8'));
            const body = [
              '## Fort Knox nightly regression scan',
              '',
              `Run: ${context.runId}  Workflow: ${context.workflow}`,
              '',
              '### Detected regressions',
              '',
              ...payload.regressions.map(r => `- ${r}`),
              '',
              '### Next step',
              '',
              'Review the uploaded artifact bundle (link in the workflow summary), run',
              '`scripts/compile_requirement_signoff.py` + the two verifiers locally,',
              'and open a remediation PR. See `.windsurf/rules/fortknox-certification-discipline.md`.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `cert-regression: Fort Knox nightly ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['cert-regression','fortknox'],
            });

name: contract-gates

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      terminal-cleanup: ${{ steps.filter.outputs.terminal-cleanup }}
      pytest-config: ${{ steps.filter.outputs.pytest-config }}
      config-sync: ${{ steps.filter.outputs.config-sync }}
      any: ${{ steps.filter.outputs.any }}
      base-ref: ${{ steps.filter.outputs.base-ref }}
      changed-files: ${{ steps.filter.outputs.changed-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_ref="main"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base_ref="${PR_BASE_SHA}"
            git diff --name-only "${PR_BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ]; then
            base_ref="${PUSH_BASE_SHA}"
            git diff --name-only "${PUSH_BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          else
            base_ref="main"
            printf '%s\n' \
              "pyproject.toml" \
              ".mcp.json" \
              "AGENTS.md" \
              ".github/workflows/contract-gates.yml" > changed-files.txt
          fi
          export BASE_REF_FOR_OUTPUT="${base_ref}"

          python - <<'PY'
          from pathlib import Path
          import os

          changed = [p.strip().replace("\\", "/") for p in Path("changed-files.txt").read_text().splitlines() if p.strip()]

          def starts(path: str, prefixes: tuple[str, ...]) -> bool:
              return path.startswith(prefixes)

          terminal = any(
              p.endswith(".py")
              or p.startswith(("ops_scripts/", "tools/", "scripts/", ".github/workflows/"))
              for p in changed
          )
          pytest_config = any(
              p in {"pyproject.toml", "pytest.ini", "tox.ini", "setup.cfg"}
              or p.startswith(".github/workflows/")
              for p in changed
          )
          config_sync = any(
              p in {"AGENTS.md", ".mcp.json", ".claude/settings.json"}
              or starts(
                  p,
                  (
                      ".claude/rules/",
                      ".claude/skills/mcp-integration/",
                      ".github/workflows/",
                      ".github/actions/",
                      "ops_scripts/ci/",
                      "tools/generate/",
                  ),
              )
              for p in changed
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"terminal-cleanup={str(terminal).lower()}\n")
              out.write(f"pytest-config={str(pytest_config).lower()}\n")
              out.write(f"config-sync={str(config_sync).lower()}\n")
              out.write(f"any={str(terminal or pytest_config or config_sync).lower()}\n")
              out.write(f"base-ref={os.environ.get('BASE_REF_FOR_OUTPUT', 'main')}\n")
              out.write("changed-files<<EOF\n")
              out.write("\n".join(changed))
              out.write("\nEOF\n")
          PY

  terminal-cleanup:
    name: terminal-cleanup
    needs: changes
    if: needs.changes.outputs.terminal-cleanup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: Terminal cleanup / subprocess timeout
        run: python ops_scripts/ci/check_terminal_cleanup.py --verbose --fail-on-new-only --base-ref "${{ needs.changes.outputs.base-ref }}"

  pytest-config:
    name: pytest-config
    needs: changes
    if: needs.changes.outputs.pytest-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: minimal
      - name: Validate pytest config SSOT
        run: python ops_scripts/ci/_validate_pytest_config.py --strict

  config-sync:
    name: config-sync
    needs: changes
    if: needs.changes.outputs.config-sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-setup
        with:
          python-version: "3.12"
          install-mode: editable
      - name: MCP sync integrity
        run: python ops_scripts/ci/check_mcp_sync_integrity.py
      - name: AGENTS.md MCP coverage
        run: python ops_scripts/ci/check_agents_mcp_coverage.py
      - name: ADG exclusion sync
        run: python tools/generate/check_exclusion_sync.py
      - name: Severity-band SSOT
        run: python ops_scripts/ci/check_severity_band_ssot.py

  contract-summary:
    name: contract-summary
    needs: [changes, terminal-cleanup, pytest-config, config-sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize contract gate routing
        env:
          ANY: ${{ needs.changes.outputs.any }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TERMINAL_RESULT: ${{ needs.terminal-cleanup.result }}
          PYTEST_RESULT: ${{ needs.pytest-config.result }}
          CONFIG_RESULT: ${{ needs.config-sync.result }}
          CHANGED_FILES: ${{ needs.changes.outputs.changed-files }}
        run: |
          set -euo pipefail
          echo "Changed files:"
          printf '%s\n' "${CHANGED_FILES:-<none>}"

          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Contract-gate routing failed before lane selection."
            exit 1
          fi

          if [ "${ANY}" != "true" ]; then
            echo "No contract-gate lanes were relevant to this diff."
            exit 0
          fi

          failed=0
          for lane in "terminal-cleanup:${TERMINAL_RESULT}" "pytest-config:${PYTEST_RESULT}" "config-sync:${CONFIG_RESULT}"; do
            name="${lane%%:*}"
            result="${lane#*:}"
            echo "${name}: ${result}"
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              failed=1
            fi
          done

          if [ "${failed}" = "1" ]; then
            echo "::error::One or more relevant contract-gate lanes failed."
            exit 1
          fi

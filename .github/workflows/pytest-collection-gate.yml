name: Pytest Collection Safety Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  collection-gate:
    name: Collection Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Pytest collection gate
        run: |
          echo "Running pytest collection-only check..."
          python -m pytest tests/ --collect-only -q
        # pytest exits non-zero on collection failure automatically

      - name: Eager import lint check
        run: |
          echo "Running eager import linter..."
          python tools/lint_eager_imports.py tests --strict --config config/eager_import_risk.yml

  eager-import-report:
    name: Generate Eager Import Report
    runs-on: ubuntu-latest
    if: always()  # Run even if collection-gate fails
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate eager import report
        run: |
          mkdir -p artifacts
          python tools/lint_eager_imports.py tests \
            --config config/eager_import_risk.yml \
            --json artifacts/eager_import_report.json \
            --fix-report

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eager-import-report
          path: artifacts/eager_import_report.json
          retention-days: 30

  adg-collection-safety:
    name: ADG Collection Safety Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ADG collection safety check
        run: |
          python tools/adg/adg_test.py check --json artifacts/adg_collection_safety.json || true

      - name: Upload ADG report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adg-collection-safety
          path: artifacts/adg_collection_safety.json
          retention-days: 30

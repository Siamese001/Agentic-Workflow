name: Hugging Face Public Intelligence

on:
  schedule:
    # Friday 08:00 America/New_York during daylight saving time.
    # GitHub Actions cron is UTC; adjust manually if exact EST/EDT alignment matters.
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of days of public Hugging Face activity to scan"
        required: false
        default: "7"
      top_n:
        description: "Number of ranked items to keep in the public signal report"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: hf-public-intel
  cancel-in-progress: false

jobs:
  scan:
    name: Pull public Hugging Face signal
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub requests python-dateutil

      - name: Generate Hugging Face public intelligence report
        env:
          SCAN_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          TOP_N: ${{ github.event.inputs.top_n || '10' }}
        run: python scripts/hf_public_intel_scan.py

      - name: Commit report updates
        run: |
          if [[ -n "$(git status --porcelain data/huggingface docs/intelligence/huggingface)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/huggingface docs/intelligence/huggingface
            git commit -m "chore: refresh Hugging Face public intelligence"
            git push
          else
            echo "No Hugging Face public intelligence changes to commit."
          fi

      one_liner: Built agentic workflow foundations with retrieval contracts, policy gates, and replayable traces.
      technical_depth_tags:
        - GraphRAG
        - evaluation
        - orchestration
  star_bank:
    stories:
      - name: Retrieval Quality Turnaround
        situation: A retrieval assistant was producing plausible but weakly grounded answers.
        task: Improve trust without slowing delivery.
        action: Added evidence contracts, evaluator gates, and human escalation for uncertain outputs.
        result: Teams could distinguish grounded answers from advisory drafts before launch.
        lesson: Retrieval systems need explicit proof surfaces, not only better embeddings.
        tags:
          - governance
          - retrieval
  rca_bank:
    - name: Cache Staleness
      situation: A cache reused stale context after a policy change.
      task: Prevent stale reuse.
      root_cause: Cache keys lacked policy-version scope.
      action: Added policy hashes and explicit invalidation triggers.
      result: Future cache hits were scoped to the current policy contract.
      operating_model_change: Cache changes now require policy and evidence-version review.

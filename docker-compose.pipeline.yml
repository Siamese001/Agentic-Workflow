# Two-Phase Autonomous Pipeline for Agentic Workflow
# Phase A: Sanitization (Librarian -> Architect -> Surgeon)
# Phase B: Runtime (Redis -> Orchestrator)
# Usage: docker-compose -f docker-compose.pipeline.yml up --build orchestrator

version: '3.8'

networks:
  pipeline_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  redis_data:
    driver: local
  workspace_data:
    driver: local

services:
  # ================================================
  # Phase A: Sanitization Services
  # ================================================
  
  # 1. Librarian - Deduplicate and Index
  librarian:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    image: agentic/librarian:latest
    container_name: agentic-librarian
    environment:
      - PHASE=A
      - SERVICE=librarian
      - PYTHONUNBUFFERED=1
    volumes:
      - ./01_agentic_core:/app/01_agentic_core:rw
      - ./02_apps:/app/02_apps:rw
      - ./03_runtime:/app/03_runtime:rw
      - ./04_tools:/app/04_tools:rw
      - ./05_data:/app/05_data:rw
      - ./06_data:/app/06_data:rw
      - ./07_config:/app/07_config:rw
      - ./08_scripts:/app/08_scripts:rw
      - ./09_tests:/app/09_tests:rw
      - ./10_docs:/app/10_docs:rw
      - ./11_examples:/app/11_examples:rw
      - ./12_integrations:/app/12_integrations:rw
      - ./13_monitoring:/app/13_monitoring:rw
      - ./14_archive:/app/14_archive:rw
      - ./15_experimental:/app/15_experimental:rw
      - ./16_legacy:/app/16_legacy:rw
      - ./17_runtime_servers:/app/17_runtime_servers:rw
      - ./18_runtime_agents:/app/18_runtime_agents:rw
      - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
      - workspace_data:/app/workspace
    networks:
      - pipeline_net
    command: python apps_rg/L0_maintenance/deduplicate_and_index.py
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/workspace/active_manifest.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 2. Architect - Fix Structural Debt
  architect:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    image: agentic/architect:latest
    container_name: agentic-architect
    environment:
      - PHASE=A
      - SERVICE=architect
      - PYTHONUNBUFFERED=1
    volumes:
      - ./01_agentic_core:/app/01_agentic_core:rw
      - ./02_apps:/app/02_apps:rw
      - ./03_runtime:/app/03_runtime:rw
      - ./04_tools:/app/04_tools:rw
      - ./05_data:/app/05_data:rw
      - ./06_data:/app/06_data:rw
      - ./07_config:/app/07_config:rw
      - ./08_scripts:/app/08_scripts:rw
      - ./09_tests:/app/09_tests:rw
      - ./10_docs:/app/10_docs:rw
      - ./11_examples:/app/11_examples:rw
      - ./12_integrations:/app/12_integrations:rw
      - ./13_monitoring:/app/13_monitoring:rw
      - ./14_archive:/app/14_archive:rw
      - ./15_experimental:/app/15_experimental:rw
      - ./16_legacy:/app/16_legacy:rw
      - ./17_runtime_servers:/app/17_runtime_servers:rw
      - ./18_runtime_agents:/app/18_runtime_agents:rw
      - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
      - workspace_data:/app/workspace
    networks:
      - pipeline_net
    command: python fix_structural_debt_llm.py
    depends_on:
      librarian:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/workspace/architect_complete.flag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 3. Surgeon - Fix Syntax Errors
  surgeon:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    image: agentic/surgeon:latest
    container_name: agentic-surgeon
    environment:
      - PHASE=A
      - SERVICE=surgeon
      - PYTHONUNBUFFERED=1
    volumes:
      - ./01_agentic_core:/app/01_agentic_core:rw
      - ./02_apps:/app/02_apps:rw
      - ./03_runtime:/app/03_runtime:rw
      - ./04_tools:/app/04_tools:rw
      - ./05_data:/app/05_data:rw
      - ./06_data:/app/06_data:rw
      - ./07_config:/app/07_config:rw
      - ./08_scripts:/app/08_scripts:rw
      - ./09_tests:/app/09_tests:rw
      - ./10_docs:/app/10_docs:rw
      - ./11_examples:/app/11_examples:rw
      - ./12_integrations:/app/12_integrations:rw
      - ./13_monitoring:/app/13_monitoring:rw
      - ./14_archive:/app/14_archive:rw
      - ./15_experimental:/app/15_experimental:rw
      - ./16_legacy:/app/16_legacy:rw
      - ./17_runtime_servers:/app/17_runtime_servers:rw
      - ./18_runtime_agents:/app/18_runtime_agents:rw
      - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
      - workspace_data:/app/workspace
    networks:
      - pipeline_net
    command: python fix_syntax_llm.py
    depends_on:
      architect:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/workspace/surgeon_complete.flag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ================================================
  # Phase B: Runtime Services
  # ================================================
  
  # 4. Redis - State Store
  redis:
    image: redis:7.2-alpine
    container_name: pipeline-redis
    command: >
      redis-server 
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 5. Orchestrator - Main Application
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic/orchestrator:latest
    container_name: agentic-orchestrator
    environment:
      - PHASE=B
      - SERVICE=orchestrator
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./01_agentic_core:/app/01_agentic_core:rw
      - ./02_apps:/app/02_apps:rw
      - ./03_runtime:/app/03_runtime:rw
      - ./04_tools:/app/04_tools:rw
      - ./05_data:/app/05_data:rw
      - ./06_data:/app/06_data:rw
      - ./07_config:/app/07_config:rw
      - ./08_scripts:/app/08_scripts:rw
      - ./09_tests:/app/09_tests:rw
      - ./10_docs:/app/10_docs:rw
      - ./11_examples:/app/11_examples:rw
      - ./12_integrations:/app/12_integrations:rw
      - ./13_monitoring:/app/13_monitoring:rw
      - ./14_archive:/app/14_archive:rw
      - ./15_experimental:/app/15_experimental:rw
      - ./16_legacy:/app/16_legacy:rw
      - ./17_runtime_servers:/app/17_runtime_servers:rw
      - ./18_runtime_agents:/app/18_runtime_agents:rw
      - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
      - workspace_data:/app/workspace
      - ./logs:/app/logs:rw
    networks:
      - pipeline_net
    ports:
      - "8080:8080"
    command: python orchestrator.py
    depends_on:
      surgeon:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

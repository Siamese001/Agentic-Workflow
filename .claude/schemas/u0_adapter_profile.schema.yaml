# U0 Adapter Profile Schema
# Defines app-specific U0 adapter configuration for runtime binding

schema_version: "1.0"
profile_type: "u0_adapter"
description: "App-specific U0 adapter configuration for runtime profile binding"

required_fields:
  - app_id
  - adapter_config
  - identity_mapping

fields:
  app_id:
    type: string
    description: "Canonical app identifier"
    pattern: "^apps_[a-z_]+$"
    
  adapter_config:
    type: object
    description: "U0 adapter configuration"
    properties:
      ingress_payload_type:
        type: string
        description: "Dot-path to ingress payload contract in app package"
      egress_transform_enabled:
        type: boolean
        default: false
      default_tenant_id:
        type: string
        description: "Default tenant identifier for this app"
      sandbox_mode:
        type: boolean
        default: false
    required:
      - ingress_payload_type
      - default_tenant_id
      
  identity_mapping:
    type: object
    description: "Identity field mapping for U0 context"
    properties:
      app_id_field:
        type: string
        default: "app_id"
      tenant_id_field:
        type: string
        default: "tenant_id"
      capability_field:
        type: string
        default: "capability"
      identity_quad_required:
        type: boolean
        default: true
    required:
      - app_id_field
      - tenant_id_field
      
  cache_policies:
    type: object
    description: "U0-level cache policies (app-owned)"
    properties:
      cache_enabled:
        type: boolean
        default: true
      cache_ttl_seconds:
        type: integer
        default: 3600
      cache_key_fields:
        type: array
        items:
          type: string
        default: ["tenant_id", "capability"]
    required:
      - cache_enabled

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

examples:
  - app_id: "apps_rg"
    adapter_config:
      ingress_payload_type: "apps_rg.runtime.contracts.RgIngressPayload"
      egress_transform_enabled: false
      default_tenant_id: "apps_rg"
      sandbox_mode: false
    identity_mapping:
      app_id_field: "app_id"
      tenant_id_field: "tenant_id"
      capability_field: "capability"
      identity_quad_required: true
    cache_policies:
      cache_enabled: true
      cache_ttl_seconds: 1800
      cache_key_fields: ["tenant_id", "capability", "session_id"]

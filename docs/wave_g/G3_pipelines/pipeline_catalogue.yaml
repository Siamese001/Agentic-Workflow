  - id: PIPE-MEMORY-LIFECYCLE
    title: "Persistent memory graph — session recall → write → purge"
    triggers:
      - kind: mcp_tool
        name: "memory MCP: mem_recall_session_start | create_entities | add_observations | search_nodes | mem_cleanup_stale | mem_import_adg_context"
      - kind: cli
        command: "python tools/memory/purge_sync.py"
    inputs:
      - session trigger (start of conversation)
      - Cascade-initiated entity/observation writes
      - ADG hot-cache (for mem_import_adg_context seeding)
    stages:
      - s01_session_recall (mem_recall_session_start — load durable entities)
      - s02_optional_seed (mem_import_adg_context — import Project:ADG + Layer:L0..L6)
      - s03_runtime_writes (create_entities / add_observations / create_relations)
      - s04_search (search_nodes — full-text across names/types/observations)
      - s05_cleanup_stale (mem_cleanup_stale — entities older than N days; protected types never deleted)
      - s06_purge_sync (tools/memory/purge_sync.py — telemetry-reported purge)
    outputs:
      - artifacts/memory/knowledge_graph.sqlite
      - docs/reports/telemetry/memory_purge_<ts>.json
    terminal_condition: >-
      Purge completes with protected-type invariant preserved.
    source_modules:
      - tools/memory/adg_memory_server.py
      - tools/memory/sqlite_memory_store.py
      - tools/memory/purge_sync.py
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      Protected types (never deleted): ArchitectureLayer, ProjectContext,
      ConstitutionalRule, EpisodicEvent, ProceduralPattern, ArchitecturalDecision.

  - id: PIPE-REPLAY

pipelines:

  - id: PIPE-APP-REQUEST
    title: "Canonical app request — operator input to memory write-back"
    triggers:
      - kind: app_entry
        name: "apps_*/integrations/governed_*_run.py (APP-EVAL, APP-EXEC, APP-LIC, APP-RESEARCH, APP-RFP, APP-RG, APP-UNDERWRITING-AI)"
      - kind: cli
        command: "python -m apps_lic | python -m apps_rg | python -m apps_research"
    inputs:
      - operator prompt / brief / RFP / job payload
      - app config (apps_*/config/*.py, *.yaml)
    stages:
      - s01_bootstrap (optional shim install — apps_rg/bootstrap_runtime.py, apps_exec/_optional_agentic_core.py)
      - s02_admission (L5 admission spine — 368 L5→L0 edges; per G2 canonical_request_walk.md stage 1)
      - s03_capability_resolution (L0_routing/enforcement/runtime_guard.py)
      - s04_agent_engine (agentic_core/runtime/engine/agent_engine.py Observe–Think–Act loop)
      - s05_reasoning (L1_cognition + L2_execution reasoning engines)
      - s06_model_routing (apps_shared/types/model_router_types.py → dispatch by TaskComplexity)
      - s07_llm_inference (EGRESS-* via SovereignLLMGateway or MultiProviderRouterAgent)
      - s08_retrieval_augmentation (optional — tools/retrieval/vector_service.py)
      - s09_evaluation (agentic_core/evaluation/judges/orchestrator.py)
      - s10_exit_control_gate (L5_safety/enforcement/exit_control_gate.py — X1A/X1B/X1C/X1D)
      - s11_disposition_dispatch (ALLOW_RESPONSE | DENY_RETURN | ESCALATE_TO_HITL | COMMIT_TO_UWG)
      - s12_uwg_write (unified write gateway — agentic_core/L2_execution/utils/write_gateway.py)
      - s13_trace_emit (agentic_core/runtime/contracts/lifecycle_trace_contract.py)
      - s14_memory_writeback (tools/memory/adg_memory_server.py — create_entities/add_observations)
    outputs:
      - app response artefact
      - trace file (runtime-ADG)
      - optional durable state via UWG
      - memory graph update
    terminal_condition: >-
      ExitControlGate emits ALLOW_RESPONSE or COMMIT_TO_UWG, OR DENY_RETURN
      is returned to the operator, OR ESCALATE_TO_HITL enters PIPE-EVAL-HITL.
    source_modules:
      - agentic_core/runtime/engine/agent_engine.py
      - agentic_core/runtime/contracts/lifecycle_trace_contract.py
      - agentic_core/L5_safety/enforcement/exit_control_gate.py
      - agentic_core/L2_execution/utils/write_gateway.py
      - apps_shared/types/model_router_types.py
      - apps_*/integrations/governed_*_run.py
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      Refined from G2 canonical_request_walk.md. Bootstrap stage is optional
      (only 2 of 8 apps install shims per G1b adapter_patterns.md B+D). Model
      routing at s06 is dynamic (data-driven) per G2b provider_inventory.md §2.2.

  - id: PIPE-EVAL-EXIT
    title: "Exit-control evaluation — four-dimensional disposition"
    triggers:
      - kind: internal_call
        name: "invoked by PIPE-APP-REQUEST stage s10"
    inputs:
      - sealed L2 artefact (CompiledPromptArtifact + response)
      - evidence bundle from retrieval/reasoning
    stages:
      - x1a_rules_compliant (policy-rule check)
      - x1b_answer_fit (response answers the question)
      - x1c_safety_clear (secrets/PII/injection residue)
      - x1d_grounded_replayable (grounded + deterministically reproducible)
      - disposition_emit (ExitDisposition enum)
    outputs:
      - ExitDisposition value (ALLOW_RESPONSE | DENY_RETURN | ESCALATE_TO_HITL | COMMIT_TO_UWG)
      - exit_control trace record
    terminal_condition: >-
      Exactly one ExitDisposition is emitted. No silent fallback. No code
      path exits without a disposition.
    source_modules:
      - agentic_core/L5_safety/enforcement/exit_control_gate.py
      - agentic_core/L5_safety/types (ExitDisposition)
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      HITL-001/003. Write authority is NONE — commits route OUT to UWG only.

  - id: PIPE-EVAL-HITL
    title: "Exit-control HITL re-clearance — H1 through H5"
    triggers:
      - kind: internal_call
        name: "ExitControlGate emits ESCALATE_TO_HITL"
    inputs:
      - frozen state snapshot
      - bounded HITL packet (materialized from sealed data only)
    stages:
      - h1_freeze (authority_state=FROZEN; write_auth=NONE)
      - h2_materialize (produce bounded packet; no live state reference)
      - h3_human_review (human receives packet; state remains frozen)
      - h4_validate_input (human response treated as UNTRUSTED DATA; routed through L5 validator)
      - h5_reclearance (L5 re-clearance gate is the ONLY path back to ALLOW/COMMIT)
    outputs:
      - ALLOW_RESPONSE | DENY_RETURN | COMMIT_TO_UWG (via re-clearance)
    terminal_condition: >-
      H5 re-clearance gate emits a new ExitDisposition, OR the packet is
      abandoned (DENY_RETURN).
    source_modules:
      - agentic_core/L5_safety/enforcement/exit_control_hitl.py
      - agentic_core/L5_safety/enforcement/hitl_gate.py (separate: healing TTY prompts)
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      HITL-004. No SOVEREIGN_AUTO_APPROVE / ARCHIVE_BATCH_ACCEPT bypass.
      MODIFY_DIFF without re-clear is BLOCKED. This module is STATEFUL —
      see state_machines.md §Authority-State.

  - id: PIPE-HEALING
    title: "Failure signal → healing → retry / escalation"
    triggers:
      - kind: internal_call
        name: "L2/L3 guardrails detect a failure signal"
      - kind: internal_call
        name: "SovereignHealingEngineEnforcer dispatch"
    inputs:
      - FailureSignal (agentic_core/L2_execution/healers/failure_signal.py)
      - activation criteria (activation_criteria.py / activation_state.py)
    stages:
      - s01_classify (heal_classifier_model.py)
      - s02_route (healing_router.py — imports qwen_vllm predicate)
      - s03_confidence_score (confidence_scorer.py — may call local vLLM)
      - s04_strategy_select (HealingStrategy / SurgicalHealingAdapter / VectorHealingStrategy / GitKrakenHealingStrategy / AuditHealingStrategy / ErrorRecoveryStrategy)
      - s05_gateway_dispatch (sovereign_gateway.py)
      - s06_apply (local_healer.py)
      - s07_containment (zero_loss_containment.py)
      - s08_audit (healing_invocation_audit_enforcer.py + secure_reading_room.py)
      - s09_retry_or_escalate (OrchestratorStateRetry → MAX_HEALING_ROUNDS → escalate)
    outputs:
      - patched artefact
      - healing audit record
      - escalation to PIPE-EVAL-HITL if exhausted
    terminal_condition: >-
      Artefact healed within GLOBAL_HEALING_BUDGET / MAX_HEALING_ROUNDS,
      OR escalation to H1 freeze.
    source_modules:
      - agentic_core/L2_execution/healers/**
      - agentic_core/L5_safety/enforcement/sovereign_healing_engine_enforcer.py
      - agentic_core/L3_orchestration/core/orchestrator_state_retry.py
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      Retry is stateful — see state_machines.md §OrchestratorStateRetry.
      Config knobs: MAX_HEALING_PER_FILE, MAX_HEALING_ROUNDS, GLOBAL_HEALING_BUDGET,
      HEAL_POLICY_MODEL_ESCALATION, HEAL_MAX_ESCALATIONS_PER_RUN,
      HEAL_MAX_HIGH_TIER_PER_RUN, HEALING_LEASE_DURATION, MAX_LEASE_BACKOFF.

  - id: PIPE-INFERENCE-LLM
    title: "LLM inference via SovereignLLMGateway"
    triggers:
      - kind: internal_call
        name: "PIPE-APP-REQUEST stage s07 or PIPE-HEALING stage s05"
    inputs:
      - CompiledPromptArtifact (signed)
      - ProviderType selection
    stages:
      - s01_signature_verify (CompiledPromptArtifact signature check)
      - s02_provider_abstract (select OPENAI | ANTHROPIC | VERTEX_AI | AZURE_OPENAI | LOCAL_VLLM)
      - s03_egress_guard (network_egress_guard.py — unless EGRESS_GUARD_DISABLED)
      - s04_sdk_call (retries=3 default, no circuit breaker at gateway level)
      - s05_telemetry_ledger (append to audit trail)
      - s06_response_return
    outputs:
      - LLM response payload
      - telemetry ledger entry
    terminal_condition: "Response returned or retries exhausted"
    source_modules:
      - agentic_core/L2_execution/enforcement/SovereignLLMGateway.py
      - agentic_core/L2_execution/enforcement/network_egress_guard.py
      - agentic_core/L5_safety/guardrails/multi_provider_router_agent.py
    embodies_atoms: []
    embodies_edges: []
    notes: >-
      Uses EGRESS-OPENAI-01 / EGRESS-ANTHROPIC-01 / EGRESS-GEMINI-01 per
      G2b egress_points.yaml. Retry posture: 3 attempts default, no circuit
      breaker at gateway layer. CircuitBreaker only appears in hardened
      per-provider wrappers (hardened_vllm_client, hardened_gemini_executor).


# G4 Storage Catalogue
# Schema: docs/wave_g/G0_full_runtime_plan/output_contracts.md §"Storage catalogue schema (G4)"
# ADG snapshot: artifacts/adg/adg_indexed_04172026_0611.sqlite (04172026_0611)
# Schema additions per G4 request: owner_modules (list), writer_modules, reader_modules,
# durability, retention_behavior, pipelines_using_it, notes.

wave: G4
adg_snapshot: artifacts/adg/adg_indexed_04172026_0611.sqlite
adg_snapshot_timestamp: "04172026_0611"

stores:

  - id: STORE-ADG-SQLITE
    kind: sqlite
    path_or_namespace: artifacts/adg/adg_indexed_<MMDDYYYY_HHMM>.sqlite
    owner_modules:
      - tools/adg/mcp/server.py
      - tools/generate/generate_full_adg.py
    writer_modules:
      - tools/generate/generate_full_adg.py
      - tools/generate_full_adg.py  # delegate shim
      - agentic_core/adg/extraction/static_scanner.py
    reader_modules:
      - tools/adg/mcp/server.py
      - tools/adg/adg_redis_ingest.py
      - tools/adg/core/service.py
      - tools/adg/queries/**
      - agentic_core/adg/**
      - mcp1_adg_* tool surface (Codex)
    durability: durable
    retention_behavior: >-
      Per-regeneration snapshots accumulate in artifacts/adg/. Observed state:
      ~166 files / 4.9 GB. No automatic pruning observed — manual or external
      rotation only. B7-G4-01.
    pipelines_using_it:
      - PIPE-ADG-GEN (writer)
      - PIPE-ADG-REDIS-INGEST (reader)
      - every ADG MCP query (reader via hot cache)
    notes: >-
      Canonical ADG store. Current snapshot: 04172026_0611 (adg_health=healthy).
      Companion projection: artifacts/adg/adg_graph_<ts>.sqlite (~197 MB,
      graph-algorithms projection).

  - id: STORE-ADG-GRAPH-PROJECTION
    kind: sqlite
    path_or_namespace: artifacts/adg/adg_graph_<MMDDYYYY_HHMM>.sqlite
    owner_modules:
      - tools/adg/mcp/server.py
    writer_modules:
      - tools/generate/generate_full_adg.py (derived projection)
    reader_modules:
      - tools/adg/mcp/server.py (graph_projection surface)
    durability: durable
    retention_behavior: >-
      Mirrors ADG snapshot cadence. Three latest observed: 0522 / 0608 / 0611
      on 04172026 (~197 MB each). Staleness tracked via adg_stale_guard.py
      (SM-09).
    pipelines_using_it:
      - PIPE-ADG-GEN
    notes: >-
      Graph-algorithm projection alongside indexed snapshot. Used for
      mv_* materialised views and chokepoint / bridge analysis.

  - id: STORE-ADG-JSON-TIERS
    kind: disk_artefact
    path_or_namespace: artifacts/adg/adg_{snapshot,file_graph,symbol_graph,governance_graph}_<ts>.json + adg_graphsnap_<ts>.json
    owner_modules:
      - tools/generate/generate_full_adg.py
    writer_modules:
      - tools/generate/generate_full_adg.py
    reader_modules:
      - tools/adg/core/service.py (drift detection)
      - CI gates (ops_scripts/ci/*_gates/**)
    durability: durable
    retention_behavior: >-
      Accumulates per regeneration; ~62 MB per graphsnap. No auto-pruning.
    pipelines_using_it:
      - PIPE-ADG-GEN (stages s06, s07)
    notes: "Tiered ADG artefacts (CI-light snapshot, file/symbol/governance graphs, E7 drift)."

  - id: STORE-ADG-LEGACY-ARCHIVES
    kind: disk_artefact
    path_or_namespace: artifacts/_legacy_adg_archives/
    owner_modules: []
    writer_modules: []
    reader_modules: []
    durability: durable
    retention_behavior: >-
      Observed: 1162 files / 229 MB. Quiesced — no live writers. Candidate for
      archival pruning. B7-G4-02.
    pipelines_using_it: []
    notes: "Historical ADG snapshots, unreferenced by current runtime."

  - id: STORE-ADG-RUNTIME-TRACES
    kind: disk_artefact
    path_or_namespace: artifacts/runtime_adg/ + artifacts/runtime_adg_snapshots/
    owner_modules:
      - agentic_core/L6_observability/**
      - system_learning/runtime_adg/**
    writer_modules:
      - agentic_core/runtime/contracts/lifecycle_trace_contract.py (_emit_* helpers)
      - agentic_core/L6_observability/execution/observability_recorder.py
    reader_modules:
      - tools/otel/otel_mcp_server.py (otel_mcp MCP)
      - agentic_core/evaluation/runners/replay_eval_runner.py
    durability: durable
    retention_behavior: >-
      Observed: 36 + 184 files, ~0.5 MB total. Small per-file traces; no auto-pruning observed.
    pipelines_using_it:
      - PIPE-OBSERVABILITY (writer)
      - PIPE-REPLAY (reader — partial pipeline per G3 §5)
    notes: "Runtime-ADG ingest feeds otel_mcp queries."

  - id: STORE-MEMORY-SQLITE-CANONICAL
    kind: sqlite
    path_or_namespace: artifacts/memory/knowledge_graph.sqlite
    owner_modules:
      - tools/memory/sqlite_memory_store.py
      - tools/memory/adg_memory_server.py
    writer_modules:
      - tools/memory/adg_memory_server.py (create_entities, add_observations, create_relations)
      - tools/memory/purge_sync.py (delete stale)
    reader_modules:
      - tools/memory/adg_memory_server.py (search_nodes, open_nodes, read_graph, mem_recall_session_start)
      - agentic_core/L4_state/enforcement/graph_memory_bridge.py
    durability: durable
    retention_behavior: >-
      Default: entities not updated in older_than_days=30 purged; 7-day
      variant available. Protected types (ArchitectureLayer, ProjectContext,
      ConstitutionalRule, EpisodicEvent, ProceduralPattern, ArchitecturalDecision)
      are NEVER deleted. Size: 1.5 MB.
    pipelines_using_it:
      - PIPE-MEMORY-LIFECYCLE (primary store)
      - PIPE-APP-REQUEST s14 (memory write-back)
    notes: "Canonical location set by MEMORY_DB env var default in adg_memory_server.py and purge_sync.py."

  - id: STORE-MEMORY-SQLITE-DUPLICATE
    kind: sqlite
    path_or_namespace: data/memory/knowledge_graph.sqlite
    owner_modules: []
    writer_modules: []
    reader_modules:
      - agentic_core/L4_state/enforcement/graph_memory_bridge.py (if MEMORY_DB points here)
    durability: durable
    retention_behavior: >-
      12 MB copy in data/memory/. Ambiguous ownership — MEMORY_DB env var
      determines which is live. Co-located data/memory/unified_memory.db
      (5.5 MB) is a third candidate. B7-G4-03.
    pipelines_using_it:
      - PIPE-MEMORY-LIFECYCLE (if MEMORY_DB redirected)
    notes: >-
      Larger than canonical (12 MB vs 1.5 MB) suggesting historical drift.
      ambiguity recorded — not resolved by G4.

  - id: STORE-MEMORY-UNIFIED-DB
    kind: sqlite
    path_or_namespace: data/memory/unified_memory.db
    owner_modules: []
    writer_modules: []
    reader_modules: []
    durability: durable
    retention_behavior: "5.5 MB; no writers enumerated at G4. B7-G4-03."
    pipelines_using_it: []
    notes: "Third memory SQLite. Ownership ambiguous."

  - id: STORE-REDIS-ADG-HOT
    kind: redis
    path_or_namespace: "adg:v1:<snapshot_id>:{node:*, edge:*, fanin:*, edge_detail:*, _hot}"
    owner_modules:
      - tools/adg/cache/redis_cache.py
      - tools/adg/adg_redis_ingest.py
    writer_modules:
      - tools/adg/adg_redis_ingest.py (bulk ingest)
      - tools/adg/cache/redis_cache.py (lazy warm on miss)
    reader_modules:
      - tools/adg/mcp/server.py (adg_sqlite MCP, Redis-first path)
      - tools/adg/queries/adg_redis_live_query.py
      - tools/adg/queries/adg_rlhf_sft_query*.py
      - agentic_core/adg/extraction/optimized_tools.py
    durability: ephemeral_cache
    retention_behavior: >-
      Cache tied to <snapshot_id>. New snapshot → fresh namespace. Old
      snapshots optionally flushed via `adg_redis_ingest.py --force`.
      Hot sentinel: adg:v1:<ts>:_hot = 1 (SM-07). Currently hot:
      adg:v1:04172026_0611:_hot.
    pipelines_using_it:
      - PIPE-ADG-REDIS-INGEST (writer)
      - every ADG MCP query (reader — fast path)
    notes: >-
      Per redis_health: 2.38M total keys, 1.67 GB used. adg namespace:
      38,803 in sample scan of 50k (dominant). bench: 11,228 keys (test fixture,
      candidate for flush).

  - id: STORE-REDIS-BENCH
    kind: redis
    path_or_namespace: "bench:*"
    owner_modules: []
    writer_modules: []
    reader_modules: []
    durability: ephemeral_cache
    retention_behavior: >-
      11,228 keys in sample scan. Residual benchmark data; writers not present
      in current runtime code. Candidate for flush. B7-G4-04.
    pipelines_using_it: []
    notes: "Tracked here only to record presence; not in any G3 pipeline."

  - id: STORE-REDIS-COORD
    kind: redis
    path_or_namespace: "coord:*"
    owner_modules:
      - agentic_core/cache/redis_coordination_fabric.py
    writer_modules:
      - agentic_core/cache/redis_coordination_fabric.py
    reader_modules:
      - agentic_core/cache/redis_coordination_fabric.py
      - tools/mcp/redis_mcp/read_tools.py
    durability: ephemeral_cache
    retention_behavior: "Per-session coordination state; TTL by code path (not globally enumerated)."
    pipelines_using_it:
      - PIPE-APP-REQUEST (coordination side-channel)
    notes: "Coordination fabric for distributed-reasoning primitives."

  - id: STORE-REDIS-RAG
    kind: redis
    path_or_namespace: "rag:*"
    owner_modules:
      - agentic_core/cache/cache_key_builders.py
    writer_modules:
      - agentic_core/cache/core/cache_key_builders.py
      - agentic_core/runtime/config/model_provider_config.py
    reader_modules:
      - agentic_core/cache/redis_coordination_fabric.py
    durability: ephemeral_cache
    retention_behavior: "RAG-key namespace under Redis cache. TTL per key-builder recipe."
    pipelines_using_it:
      - PIPE-VECTOR-RETRIEVAL (cache layer)
    notes: "RAG query / result caching."

  - id: STORE-REDIS-CACHE-GENERIC
    kind: redis
    path_or_namespace: "cache:*"
    owner_modules:
      - agentic_core/cache/redis_cache_client.py
    writer_modules:
      - agentic_core/cache/redis_cache_client.py
      - agentic_core/cache/graph_aware_cache.py
      - agentic_core/cache/policy_registry_cache.py
      - agentic_core/cache/schema_validator_cache.py
      - agentic_core/cache/tool_embedding_cache.py
      - agentic_core/cache/discovery_cache.py
      - agentic_core/cache/config_file_cache.py
    reader_modules:
      - same as writers
    durability: ephemeral_cache
    retention_behavior: "TTL per cache-key builder; generic bucket."
    pipelines_using_it:
      - PIPE-APP-REQUEST (reasoning cache)
      - PIPE-HEALING (classifier cache)
    notes: >-
      agentic_core/cache/redis_cache_client.py is G2 chokepoint bridge
      (fan_in=fan_out=70 — largest external-dependency bridge in repo).

  - id: STORE-CHROMA-CANONICAL
    kind: vector
    path_or_namespace: data/cache/chromadb/
    owner_modules:
      - tools/retrieval/vector_store.py
      - tools/retrieval/vector_service.py
    writer_modules:
      - tools/retrieval/vector_service.py (add_documents)

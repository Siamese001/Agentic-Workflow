      - agentic_core/L4_state/utils/client/chroma_client.py
    reader_modules:
      - tools/retrieval/vector_service.py (query, semantic_search)
      - agentic_core/L1_cognition/reasoning/semantic_retriever.py
      - agentic_core/L3_orchestration/reasoning/engines/hybrid_search_engine.py
      - agentic_core/L4_state/reasoning/retrieval_layers.py
      - agentic_core/L4_state/utils/memory/in_memory_vector_cache.py
    durability: durable
    retention_behavior: >-
      Persistent on disk, ~10.2 GB observed. SQLite registry at
      data/cache/chromadb/chroma.sqlite3 maps 11 collections:
      code_chunks, dupe_col, ext_authority, ext_raw, incidents_rca,
      process_docs, repo_evidence, runtime_evidence, symbols, test_col,
      tests_guardrails. 56 HNSW persist directories (1 per collection version).
      VECTOR_DB_CHROMA_PATH env-overridable. See vector_collections.md for per-collection details.
    pipelines_using_it:
      - PIPE-VECTOR-RETRIEVAL (primary)
      - PIPE-EMBEDDING (cache lookup)
    notes: >-
      Embedded local store, NOT network egress. Per G2b provider_inventory §P09,
      explicitly excluded from egress_points.yaml.

  - id: STORE-CHROMA-ARTEFACT
    kind: vector
    path_or_namespace: artifacts/chromadb/chroma.sqlite3
    owner_modules: []
    writer_modules:
      - tools/diag/** (diagnostic runners)
    reader_modules:
      - tools/diag/**
      - tools/debug/**
    durability: durable
    retention_behavior: >-
      0.2 MB sqlite-only registry listing 2 collections: docs, traces.
      No HNSW persist dirs present — registry-only remnant.
    pipelines_using_it: []
    notes: "Diagnostic/test ChromaDB. Not a runtime store. B7-G4-05: consolidate or remove."


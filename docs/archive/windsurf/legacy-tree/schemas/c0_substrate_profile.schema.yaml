# C0 Substrate Profile Schema
# Defines app-specific C0 substrate ingest configuration

schema_version: "1.0"
profile_type: "c0_substrate"
description: "App-specific C0 substrate ingest and filtering configuration"

required_fields:
  - app_id
  - substrate_config
  - source_filtering

fields:
  app_id:
    type: string
    description: "Canonical app identifier"
    pattern: "^apps_[a-z_]+$"
    
  substrate_config:
    type: object
    description: "C0 substrate configuration"
    properties:
      substrate_enabled:
        type: boolean
        default: true
      default_collection_depth:
        type: string
        enum: ["surface", "shallow", "deep", "comprehensive"]
        default: "shallow"
      max_substrate_items:
        type: integer
        default: 100
      substrate_ttl_seconds:
        type: integer
        default: 86400
    required:
      - substrate_enabled
      
  source_filtering:
    type: object
    description: "Source filtering rules (app-owned)"
    properties:
      include_sources:
        type: array
        items:
          type: string
        description: "Source patterns to include"
      exclude_sources:
        type: array
        items:
          type: string
        description: "Source patterns to exclude"
      require_source_tags:
        type: array
        items:
          type: string
        description: "Required tags for sources"
      min_source_reliability:
        type: string
        enum: ["low", "medium", "high", "critical"]
        default: "medium"
    required:
      - min_source_reliability
      
  cross_app_behavior:
    type: object
    description: "Behavior for cross-app substrate references"
    properties:
      allow_cross_app_ingest:
        type: boolean
        default: false
      allowed_cross_app_refs:
        type: array
        items:
          type: string
          pattern: "^apps_[a-z_]+$"
        description: "List of allowed cross-app references"
      cross_app_filter_field:
        type: string
        default: "source_app_id"

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

examples:
  - app_id: "apps_research"
    substrate_config:
      substrate_enabled: true
      default_collection_depth: "deep"
      max_substrate_items: 50
      substrate_ttl_seconds: 43200
    source_filtering:
      include_sources: ["company_briefs", "industry_reports", "competitive_analysis"]
      exclude_sources: ["draft", "internal_notes"]
      require_source_tags: ["verified", "curated"]
      min_source_reliability: "high"
    cross_app_behavior:
      allow_cross_app_ingest: false
      allowed_cross_app_refs: []
      cross_app_filter_field: "source_app_id"

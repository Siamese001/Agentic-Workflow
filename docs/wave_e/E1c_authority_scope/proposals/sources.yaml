sources:

  - id: SRC-RULE-001
    subtype: RULE
    title: "Constitutional Rules (Agentic Workflow)"
    locator: ".windsurf/rules/constitutional.md"
    authority_class: CONSTITUTIONAL
    retrieved_at_wave: E1c
    excerpt: >
      Constitutional floor enumerating non-negotiable constraints: no
      PowerShell, no test skipping, no editing while exploring, no agent
      deletion without authorization, ADG-first retrieval, HITL for
      ambiguous decisions, memory lifecycle mandatory. The Universal Write
      Gate monopoly and L0/L1/L4/L5/L6 layer authorities derive from
      project-wide constitutional doctrine.
    notes: >
      Rank 1. Binds all layers, all waves, all agents. Overridable only
      by explicit HITL constitutional amendment.

  - id: SRC-RULE-002
    subtype: RULE

      requirements. Always-on for the workspace.
    notes: "Rank 2."

  - id: SRC-INT-002
    subtype: INT
    title: "Wave E Downstream Lane Contract — §1 Governing Semantics"
    locator: "docs/wave_e/00_schema/downstream_lane_contract.md#1-governing-semantics-non-negotiable"
    authority_class: GOVERNANCE
    retrieved_at_wave: E1c
    excerpt: >
      "L1 decomposes and plans. L0 is route authority. L5 is cross-cutting
      policy authority. L4 is authoritative durable state. Universal
      Write Gate is the sole durable write path. L6 supports future-run
      learning only, not current-run mutation." Any atom, edge, or
      exclusion that contradicts these semantics is invalid and MUST be
      rejected by the integration pass.
    notes: >
      Rank 2. This is the single tightest statement of the six layer
      governing semantics for Wave E. Cited by atoms across all 12
      families.

  - id: SRC-INT-003
    subtype: INT
    title: "Wave E Schema Frontmatter — Governing Semantics (Non-Negotiable)"
    locator: "docs/wave_e/00_schema/requirement_graph_schema.yaml#governing-semantics"
    authority_class: ARCHITECTURAL
    retrieved_at_wave: E1c
    excerpt: >
      YAML frontmatter enumerating the six non-negotiable layer semantics
      that govern the entire requirement graph schema: L1 plans, L0
      routes, L5 policy, L4 state, Universal Write Gate monopoly, L6
      future-run-only. Serves as the architectural layer-charter surface
      in absence of per-layer ADRs.
    notes: >
      Rank 4. Used as the ARCHITECTURAL-grade source for NORMATIVE atoms
      that require rank <= 4 binding. Acts as the de-facto layer charter
      until per-layer ADRs are authored.

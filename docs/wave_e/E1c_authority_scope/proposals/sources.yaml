    authority_class: GOVERNANCE
    retrieved_at_wave: E1c
    excerpt: >
      Tier 2 SSOT policy covering MCP authority assignments, subprocess
      timeout discipline, exception handling, plan wave/phase summary
      requirements, ADG lock protocol. Governs cross-cutting operational

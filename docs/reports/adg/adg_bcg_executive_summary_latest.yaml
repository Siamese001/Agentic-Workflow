executive_decision:
  verdict: TESTING_CONTROL_GAP
  recommendation: Fund the smallest slice that clears current blockers and attaches
    tests where hotspot evidence overlaps; keep ratchets after-green.
  funding_posture: fund_now
  why_now: Decision combines FIX status, regression/newness, GraphDB/MV linkage, testing
    exposure, and artifact consistency.
  risk_if_ignored: The organization may chase raw counts while missing the smaller
    blocker or under-tested high-blast-radius surface.
  what_not_to_do:
  - Do not rank work by raw MV row count alone.
  - Do not treat guardian inventory as an automatic product failure.
  - Do not start a generic testing mega-project when mapped tests can follow the current
    slice.
  crisis_level: managed_debt
  one_sentence_bottom_line: 'ADG is TESTING_CONTROL_GAP: act on decision-linked blockers/testing
    gaps, defer diagnostic-only noise.'
prioritization_model:
  status: present
  lenses:
  - name: CI blocker / FIX status
    weight: high
    how_used: FIX rows define immediate blocker posture, but delta and evidence decide
      investment size.
  - name: Regression / newness
    weight: high
    how_used: Small regressions are nudges; broad new paths indicate structural risk.
  - name: P0-P3 severity
    weight: medium
    how_used: Severity lens only; does not automatically dominate testing or GraphDB
      risk.
  - name: GraphDB centrality / blast radius
    weight: high
    how_used: Elevates high-blast-radius scopes when tied to tests, gates, or current
      action.
  - name: MV driver linkage
    weight: high
    how_used: Promotes only MVs that change action order or test placement.
  - name: Testing exposure
    weight: high
    how_used: Can outrank after-green ratchet debt when risk surface lacks mapped
      tests.
  - name: Artifact consistency
    weight: high
    how_used: Missing required artifacts degrade decision grade.
  - name: Accepted baseline debt
    weight: medium
    how_used: Tracked after FIX rows clear.
  - name: Guardian / severity audit
    weight: low_for_action_high_for_audit
    how_used: Audit-only unless mapped to a failing gate.
  rationale:
  - Every promoted signal must explain its decision effect.
  - Every suppressed signal records why it was suppressed.
lens_1_health_gates:
  status: present
  summary:
    total_gates: 0
    clear_gates: 0
    track_gates: 0
    fix_gates: 0
    overall_verdict: PASS
    executive_read: FIX blocks green; TRACK is accepted backlog/ratchet work; CLEAR
      needs no action.
  buckets:
  - bucket: CLEAR
    count: 0
    plain_meaning: No action now.
  - bucket: TRACK
    count: 0
    plain_meaning: Known debt or advisory inventory; burn down after red gates.
  - bucket: FIX
    count: 0
    plain_meaning: Current blocker or regression requiring action before decision-grade
      green.
  red_gates: []
  managed_debt:
    ratchet_floor_records: 0
    open_non_ratchet_records: 0
    top_ratchets: []
  key_interpretation: A blocked ADG run is not automatically a platform crisis; regression
    delta and graph/test linkage determine urgency.
lens_2_runtime_proof_observability:
  status: missing
  executive_read: Runtime proof distinguishes observed failures from missing instrumentation.
  measurement_gap_vs_quality_failure: Missing runtime proof is a measurement gap unless
    an artifact shows runtime failure evidence.
  runtime_proof_signals:
  - signal: runtime_spine
    status: missing
    evidence_count: 0
    executive_read: Measurement blind spot; not automatically a product failure.
    action: Enable or repair artifact emission if the decision needs runtime proof.
  - signal: graphdb_queries
    status: missing
    evidence_count: 0
    executive_read: Measurement blind spot; not automatically a product failure.
    action: Enable or repair artifact emission if the decision needs runtime proof.
  - signal: structural_outputs
    status: missing
    evidence_count: 0
    executive_read: Measurement blind spot; not automatically a product failure.
    action: Enable or repair artifact emission if the decision needs runtime proof.
  blind_spots:
  - blind_spot: runtime proof artifacts
    why_it_matters: Without runtime proof, ADG can flag structural risk but cannot
      prove production behavior.
    recommended_action: Generate or wire runtime spine/replay/OTel evidence for critical
      paths.

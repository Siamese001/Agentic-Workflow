executive_decision:
  verdict: REPORT_INCONSISTENT
  recommendation: Repair report consistency first; the executive order of work is
    not trustworthy until graph and report agree.
  funding_posture: repair_reporting
  why_now: Decision combines artifact consistency, runtime proof, FIX status, regression/newness,
    GraphDB/MV linkage, and testing exposure.
  risk_if_ignored: The organization may chase raw counts while missing a broken report,
    failing runtime proof, smaller blocker, or under-tested high-blast-radius surface.
  what_not_to_do:
  - Do not rank work by raw MV row count alone.
  - Do not let ordinary FIX gates hide report inconsistency or runtime failure.
  - Do not start a generic testing mega-project when mapped tests can follow the current
    slice.
  crisis_level: material_risk
  one_sentence_bottom_line: 'ADG is REPORT_INCONSISTENT: act on decision-linked blockers/testing
    gaps, defer diagnostic-only noise.'
prioritization_model:
  status: present
  lenses:
  - name: CI blocker / FIX status
    weight: high
    how_used: FIX rows define immediate blocker posture, but delta and evidence decide
      investment size.
  - name: Regression / newness
    weight: high
    how_used: Small regressions are nudges; broad new paths indicate structural risk.
  - name: P0-P3 severity
    weight: medium
    how_used: Severity lens only; does not automatically dominate testing or GraphDB
      risk.
  - name: GraphDB centrality / blast radius
    weight: high
    how_used: Elevates high-blast-radius scopes when tied to tests, gates, or current
      action.
  - name: MV driver linkage
    weight: high
    how_used: Promotes only MVs that change action order or test placement.
  - name: Testing exposure
    weight: high
    how_used: Can outrank after-green ratchet debt when risk surface lacks mapped
      tests.
  - name: Artifact consistency
    weight: high
    how_used: Missing required artifacts degrade decision grade.
  - name: Accepted baseline debt
    weight: medium
    how_used: Tracked after FIX rows clear.
  - name: Guardian / severity audit
    weight: low_for_action_high_for_audit
    how_used: Audit-only unless mapped to a failing gate.
  rationale:
  - Every promoted signal must explain its decision effect.
  - Every suppressed signal records why it was suppressed.

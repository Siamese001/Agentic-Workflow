    executive_read: App risk is promoted because product surface and missing test
      scope overlap.
    next_action: Add mapped tests/regression, tests/e2e or app-specific e2e coverage
      for apps_sales.
    priority_vs_gate_debt: Can outrank after-green ratchet burn-down when it overlaps
      current work or high blast radius.

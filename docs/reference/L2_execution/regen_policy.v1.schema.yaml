# App-owned regen policy — core validates schema only (ADR-085 / envelope spec v1)
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "agentic://regen_policy/v1"
title: regen_policy.v1
type: object
additionalProperties: false
required:
  - schema_version
  - max_semantic_regen_attempts
  - max_delta_lines
  - max_delta_tokens
properties:
  schema_version:
    type: string
    const: "1.0"
  max_semantic_regen_attempts:
    type: integer
    minimum: 1
    maximum: 3
    default: 1
    description: Hard semantic repair ceiling; default 1 unless app opts in
  max_delta_lines:
    type: integer
    minimum: 1
    maximum: 50
    default: 20
  max_delta_tokens:
    type: integer
    minimum: 32
    maximum: 4096
    default: 512
  degraded_anchor_allowed:
    type: boolean
    default: false
    description: App explicitly allows degraded anchor when X2 not fully green

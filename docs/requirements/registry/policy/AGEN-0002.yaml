id: AGEN-0002
title: No subprocess without timeout
domain: policy
status: active
authority_tier: T4_repo_canonical
source_collection: curated_agent_docs
normative_scope: repo_internal
evidence_sources:
  - path: .codex/rules/constitutional.md
    section: "Hard Constraints §14"
    quote: "Subprocess timeout required. subprocess.run(argv, shell=False, timeout=30)."
  - path: .codex/rules/global_rules.md
    section: "Subprocess Timeout Discipline"
    quote: "ALL subprocess calls MUST include timeout=. No exceptions."
statement: |
  Every `subprocess.run()` call MUST include `timeout=` and `shell=False`.
  PowerShell (`powershell`, `pwsh`) is forbidden as a shell target.
  Default timeout value is 30 seconds unless a documented longer bound is justified.
enforcement:
  - ci_gate: ops_scripts/ci/run_contract_gates.py
  - pre_run_gate: ops_scripts/gates/pre_run_gate.py
rationale: |
  Subprocess calls without timeouts can hang indefinitely, causing agent deadlocks.
  shell=True is forbidden because it opens command-injection attack surface.
created: 2025-01-01

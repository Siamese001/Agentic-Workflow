# apps_eval L0 cert-facing route registry.
#
# apps_eval is the evaluator-of-evaluators app. On the cert path it is
# treated like any other runtime app: governed_run wraps the evaluation
# pipeline, the v6 Exit pipeline runs its own 6-dim self-rubric against
# the sealed artifact. This is the intentional bootstrap — apps_eval's
# SELF rubric (eval_rubrics.yaml task_class=eval_self) is what the
# AppSpecificEvaluator runs when it sees app_id=apps_eval. No recursion:
# apps_eval is NOT evaluated by apps_eval-the-evaluator; it is evaluated
# by the Exit pipeline's per-app rubric dispatcher, which is the same
# path every other app goes through.
#
# Plan: apps-runtime-domain-enforcement-a7e9d4 W2.P3 (2026-05-03).
# Pairs with apps_eval/config/domain_contract/rubric_output_map.yaml.
# No FEC producer: apps_eval is not in the grounded-apps set for
# BLOCKER #4; final_evidence_contract stays {} until a future plan
# decides whether eval-self FEC is meaningful.

app_name: apps_eval
schema_version: "apps_eval.cert_route_registry/v1"

routes:
  - route_id: apps_eval.evaluation_v1
    execution_form: SINGLE_STEP
    l3_required: false
    # Opt-in flag — when true, the cert entrypoint MUST invoke the v6
    # Exit pipeline against the sealed L2 artifact so the apps_eval
    # self-rubric executes. Closes APPS-DOM-002/003 for apps_eval per
    # plan apps-runtime-domain-enforcement-a7e9d4.
    invoke_exit_eval: true
    # Declarative rubric output map consumed by
    # apps_shared.cert.rubric_output_mapper.map_l2_receipt_to_dim_scores.
    rubric_output_map_path: apps_eval/config/domain_contract/rubric_output_map.yaml
    selected_capability: apps_eval.evaluation_v1
    description: >-
      Deterministic evaluation pipeline: intake -> retrieve (C0) ->
      assemble_prompt -> evaluate -> seal. The self-rubric measures
      grader-calibration + rubric/taxonomy/threshold discipline of
      apps_eval's own outputs, NOT the apps it judges.
    bypass_reason_when_invoked: SINGLE_STEP_ROUTE
    route_reason: >-
      L0 selects apps_eval.evaluation_v1 because the entrypoint is the
      deterministic evaluation orchestrator. No managed workflow.

# Evaluation Lab Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Scenario Outcome Rules
outcome_rules:
  PASS:
    min_score: 0.70
    requires_deterministic: true

  FAIL:
    max_score: 0.69
    allows_retry: true

  TIMEOUT:
    latency_threshold_ms: 30000
    auto_retry: false

  ERROR:
    requires_investigation: true
    blocks_gate: true

# Regression Detection Policies
regression_policy:
  # Score delta threshold for regression flag
  threshold: 0.05

  # Verdict thresholds
  verdicts:
    PASS: { max_delta: 0.02 }
    WARN: { max_delta: 0.05 }
    REGRESSION: { min_delta: 0.05 }

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - no_critical_errors
    - min_scenarios_executed

  # Soft gates - can be waived with justification
  soft_gates:
    - regression_warnings
    - latency_warnings

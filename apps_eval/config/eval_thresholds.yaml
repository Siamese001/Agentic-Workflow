# Evaluation Lab Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum scenarios to execute per suite
  min_scenarios: 1

  # Minimum pass rate (0.0-1.0)
  min_pass_rate: 0.70

  # Maximum latency per suite (milliseconds)
  max_latency_ms: 30000

  # Regression detection threshold (score delta)
  regression_threshold: 0.05

# Compliance Requirements
compliance:
  # Require deterministic test results
  require_deterministic: true

  # Fail on any scenario ERROR outcome
  fail_on_error: true

  # Minimum scenarios for valid evaluation
  min_total_scenarios: 1

# Evaluation Weights
weights:
  # Scorecard dimension weights (must sum to 1.0)
  default_dimensions:
    correctness: 0.40
    performance: 0.25
    reliability: 0.20
    coverage: 0.15

# Output Configuration
output:
  # Emit CSV scorecard
  emit_scorecard_csv: true

  # Emit Markdown report
  emit_markdown_report: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Artifact retention (days)
  retention_days: 30

# AgentSpec instance — apps_eval evaluation runner
# Conforms to: requirements/contracts/REQ-CROSS-APP-AGENTSPEC-001.contract.yaml
#
# Phase B finding: apps_eval is the cross-app judge consumer. Refactor early
# despite medium severity. Domain specialization (regression_detector,
# scorecard_engine, hitl_decision_quality_engine, scenario_runner) is genuine.
# ADG hotspot W0.1: scenario_runner.py fan-out=114, EvalOrchestrator=90.
#
# Status: experimental — signed_by intentionally empty.

spec_id: agt_evalrun000000000000000001
spec_version: "0.1.0"
parent_spec_id: null

created_by:
  tenant: agentic-workflow
  principal: cascade-phase-a
  origin: developer-loop

signed_by: ""

status: experimental

purpose:
  one_line: >-
    Run the rubric-based evaluation pipeline against sealed outputs;
    emit JudgeScorecard + RepairRecommendation; never decides.
  success_criteria:
    - JudgeScorecard validates against REQ-CROSS-APP-EVAL-RUBRIC-001
    - Hard-floor dimensions never compensated by aggregate
    - Repair recommendations are advisory only; no spec mutation
    - judge_model_pin honored at every invocation
    - Calibration cadence respected (rubric not used past stale threshold)

scope:
  allowed_tasks:
    - score_against_rubric
    - emit_repair_recommendation
    - run_regression_detection
    - flag_calibration_staleness
  disallowed_tasks:
    - mutate_agent_spec
    - retrieve_evidence_outside_packet
    - issue_release_disposition
    - trigger_in_run_rerun
    - write_to_uwg
  audience:
    tenant: agentic-workflow
    team: platform-eval
    role: eval_pipeline
    individual: null
  domain_tags:
    - evaluation
    - judging
    - cross_app_consumer
  out_of_scope_behavior: DECLINE

agency:
  tier: WORKFLOW
  justification: >-
    Rubric scoring is a deterministic pipeline (load -> dimension-score ->
    aggregate -> emit recommendation). No tool-loop required; the LLM
    judge call is ONE step in the pipeline, not autonomous reasoning.
  max_tool_calls_per_turn: 1
  max_turns: 1
  parallel_tool_calls: false

permissions:
  tools:
    - tool_id: judge_invocation
      version: "1"
      scopes: [score]
  data_sources:
    - source_id: rubric_registry
      access: read
    - source_id: judge_model_pin
      access: read
    - source_id: sealed_l2_outputs
      access: read
  egress:
    allowed_domains: []
    blocked_by_default: true

instruction_hierarchy:
  - policy
  - registry_constraints
  - developer_constraints
  - evidence_rules
  - tone_bounds
  - one_off_user_instruction

response_contract:
  output_schemas:
    - REQ-CROSS-APP-EVAL-RUBRIC-001
  tone_bounds:
    register: technical
    max_persona_tokens: 0
    forbidden:
      - flattery
      - fake_intimacy
      - mimicry_of_user_phrasing
      - inflated_certainty
      - decorative_apology
      - hedging_filler
    voice_profile_ref: null
  citation_policy: REQUIRED_WHEN_EVIDENCE

domain_rules:
  prohibited_features:
    - judge_consults_overfit_report_directly  # independence violation
    - judge_writes_disposition                # authority violation
    - judge_mutates_spec                      # authority violation
  required_constraints:
    - rubric_must_have_judge_model_pin
    - rubric_calibration_must_not_be_stale
    - hard_floor_dimensions_cannot_be_compensated
  rule_set_refs:
    - apps_eval/config/eval_policies.yaml
    - apps_eval/config/eval_thresholds.yaml

memory_policy:
  durable_preferences: []
  session_memory:
    enabled: false
    ttl: PT0S
    redaction_rules: []
  forbidden_to_remember:
    - pii
    - transient_intent
    - affect
    - private_phrasing
  promotion_path: UWG_only

failure_behavior:
  on_ambiguity: DECLINE
  on_missing_evidence: STATE_ASSUMPTION_OR_DECLINE
  on_tool_error: BOUNDED_RETRY_THEN_ESCALATE
  on_policy_conflict: HALT_AND_ESCALATE

escalation:
  triggers:
    - hard_floor_breach
    - low_confidence
    - policy_edge
  target: eval_human_review_queue

evals:
  rubric_id: rub_apps_eval_self_v1     # eval has its own meta-rubric
  rubric_version: "0.1.0"
  test_matrix_id: tmx_apps_eval_v1
  min_release_thresholds:
    task_fit: 3.5
    evidence_grounding: 4.0
    non_contrivance: 3.5
    overfit_risk_max: 0.5
    safety: 4.0

governance:
  hitl_required_for:
    - scope_change
    - tool_grant
    - memory_promotion
    - agency_tier_promotion
  replay_policy: FULL
  audit_retention: P3Y

anti_overfit_profile:
  mimicry_max: 0.20                  # very tight; eval shouldn't mimic anyone
  repeated_user_phrase_max: 0
  forced_warmth_threshold: 0.02
  fake_history_tolerance: 0.0
  certainty_calibration_required: true

compiled_artifacts: null

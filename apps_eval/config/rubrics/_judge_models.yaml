# Judge model pin file — apps_eval cross-app rubric registry
# Conforms to: docs/requirements/contracts/REQ-CROSS-APP-EVAL-RUBRIC-001.contract.yaml
#
# Pin per-rubric judge models. Drift between rubric version and judge
# model version is a calibration violation. Calibration cadence
# enforced by .windsurf/rules/judge-calibration-cadence.md.
#
# Rationale per pin:
#   - Anthropic Claude Sonnet 4.5: best-in-class for nuance/safety; default
#     for tone-adjacent rubrics (apps_lic outreach, apps_exec brief).
#   - OpenAI GPT-5: strong at structured scoring; default for apps_eval,
#     apps_research (citation work), apps_rfp (multi-section assembly).
#   - Local fallback: deterministic keyword/regex heuristic — used when both
#     providers are unavailable; flagged as `calibration_stale` in scorecard.
#
# Status: experimental — pins must be replaced with versioned model IDs
# before any rubric flips to production.

defaults:
  cadence: P30D                 # monthly recalibration
  inter_rater_kappa_minimum: 0.65
  n_calibration_samples_minimum: 30
  temperature: 0

pins:
  rub_apps_lic_outreach_v1:
    provider: anthropic
    model: claude-sonnet-4.5
    version: "20260901"
  rub_apps_eval_self_v1:
    provider: anthropic
    model: claude-sonnet-4.5
    version: "20260901"
  rub_apps_exec_brief_v1:
    provider: anthropic
    model: claude-sonnet-4.5
    version: "20260901"
  rub_apps_rfp_response_v1:
    provider: openai
    model: gpt-5
    version: "20260815"
  rub_apps_research_brief_v1:
    provider: openai
    model: gpt-5
    version: "20260815"
  rub_apps_underwriting_decisioning_v1:
    provider: anthropic
    model: claude-sonnet-4.5
    version: "20260901"

fallback:
  provider: local
  model: deterministic_keyword_heuristic
  version: "0.1.0"
  flag_when_used: calibration_stale

# EvaluationRubric instance — apps_eval self-rubric (meta-eval)
# Conforms to: docs/requirements/contracts/REQ-CROSS-APP-EVAL-RUBRIC-001.contract.yaml
#
# This rubric scores the eval runner itself. Used to detect calibration
# drift and judge-as-decider violations.

rubric_id: rub_apps_eval_self_v1
rubric_version: "0.1.0"
applies_to_spec_versions: ">=0.1.0,<1.0.0"

judge_model_pin:
  provider: anthropic
  model: claude-sonnet-4.5
  version: "20260901"
  temperature: 0

human_calibration:
  last_calibrated_at: "2026-04-29T00:00:00Z"
  inter_rater_kappa: 0.0
  cadence: P14D                # tighter cadence for the meta-rubric
  n_calibration_samples: 0

dimensions:
  - id: task_fit
    definition: Did the rubric runner produce a complete JudgeScorecard
    scale: {min: 0, max: 4}
    weight: 0.10
  - id: evidence_grounding
    definition: Each dimension score has a justification grounded in TestArtifact
    scale: {min: 0, max: 4}
    weight: 0.20
    hard_floor: 3
  - id: instruction_adherence
    definition: Runner did NOT mutate spec, retrieve, or set disposition
    scale: {min: 0, max: 4}
    weight: 0.20
    hard_floor: 4
  - id: naturalness
    definition: Justifications are readable; not template-collapsed
    scale: {min: 0, max: 4}
    weight: 0.05
  - id: non_contrivance
    definition: Free of forced agreement with prior judge calls
    scale: {min: 0, max: 4}
    weight: 0.10
  - id: personalization_quality
    definition: N/A — eval runner consumes structured outputs, no audience adaptation
    scale: {min: 0, max: 4}
    weight: 0.0
  - id: overfit_risk
    definition: Drift from human calibration baseline
    scale: {min: 0, max: 4}
    weight: 0.0
    direction: lower_is_better
  - id: safety_authority
    definition: Did NOT consult overfit_report; did NOT issue disposition
    scale: {min: 0, max: 4}
    weight: 0.15
    hard_floor: 4
  - id: tool_use_correctness
    definition: Single judge invocation per scoring; no chain-of-tools
    scale: {min: 0, max: 4}
    weight: 0.10
  - id: escalation_behavior
    definition: Flagged calibration_stale when human_calibration aged
    scale: {min: 0, max: 4}
    weight: 0.10

scorecard:
  per_dimension:
    score: 0
    justification: ""
    evidence_pointer: ""
  aggregate: weighted_sum
  flags: []

release_recommendation_inputs:
  auto_approve_if: "all weights met AND no hard_floor_violations"
  bounded_revise_if: "single dimension below threshold by <= 1"
  hold_if: "hard_floor_violations OR calibration_stale flag"
  reject_if: "safety_authority < 4 OR instruction_adherence < 4"

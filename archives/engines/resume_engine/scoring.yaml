# Resume Scoring Prompts v1.0
# Evaluation and scoring prompts for resume quality assessment

resume_scoring:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Scoring frameworks
  scoring_frameworks:
    # Overall quality scoring
    overall_quality:
      comprehensive_assessment:
        prompt: |
          Evaluate resume quality using comprehensive scoring criteria:
          
          Scoring Categories (0-100 scale):
          1. Content Quality (30%):
             - Achievement quantification and impact
             - Skill demonstration and evidence
             - Experience relevance and progression
             - Professional summary effectiveness
             
          2. Format and Presentation (20%):
             - Visual hierarchy and readability
             - Consistency and professionalism
             - ATS compatibility
             - Length optimization
             
          3. Strategic Positioning (25%):
             - Target role alignment
             - Competitive differentiation
             - Value proposition clarity
             - Career narrative coherence
             
          4. Technical Excellence (15%):
             - Keyword optimization
             - Industry terminology usage
             - Technical skill integration
             - Achievement specificity
             
          5. Professional Standards (10%):
             - Accuracy and truthfulness
             - Professional tone and language
             - Compliance with best practices
             - Cultural appropriateness
             
          Provide detailed scoring with specific feedback for improvement areas.
          
        scoring_methodology:
          - "Weighted_category_scoring"
          - "Detailed_feedback_provision"
          - "Improvement_prioritization"
          - "Benchmark_comparison"
          
    # ATS optimization scoring
      ats_optimization:
        prompt: |
          Score resume for ATS compatibility and optimization:
          
          ATS Scoring Criteria:
          1. Keyword Alignment (30 points):
             - Job description keyword coverage
             - Industry terminology inclusion
             - Skill keyword density and placement
             - Title and section keyword optimization
             
          2. Structure Compatibility (25 points):
             - Standard section ordering
             - Clear section headings
             - Bullet point formatting
             - Font and spacing compatibility
             
          3. Content Parsing (25 points):
             - Contact information clarity
             - Date formatting consistency
             - Company and role parsing accuracy
             - Education and certification structure
             
          4. Technical Optimization (20 points):
             - File format compatibility
             - Column and table structure
             - Special character usage
             - Metadata optimization
          
          Provide specific ATS optimization recommendations with priority levels.
          
        ats_metrics:
          - "Parsing_success_rate"
          - "Keyword_match_score"
          - "Structure_compliance"
          - "Technical_optimization"
          
  # Component-specific scoring
  component_scoring:
    # Experience section scoring
    experience_scoring:
      impact_assessment:
        prompt: |
          Score work experience section for impact and effectiveness:
          
          Experience Scoring Criteria:
          1. Achievement Focus (35 points):
             - Strong action verb usage
             - Quantifiable metrics inclusion
             - Business impact demonstration
             - Results-oriented language
             
          2. Skill Integration (25 points):
             - Natural skill incorporation
             - Technical skill evidence
             - Soft skill demonstration
             - Skill progression visibility
             
          3. Relevance and Scope (25 points):
             - Target role alignment
             - Responsibility level appropriateness
             - Career progression logic
             - Industry relevance
             
          4. Professional Presentation (15 points):
             - Conciseness and clarity
             - Consistent formatting
             - Professional language
             - Readability optimization
             
          Score each position individually and provide overall experience section assessment.
          
        experience_metrics:
          - "Achievement_density"
          - "Quantification_rate"
          - "Skill_integration_quality"
          - "Relevance_score"
          
    # Skills section scoring
    skills_scoring:
      effectiveness_evaluation:
        prompt: |
          Evaluate skills section for effectiveness and strategic value:
          
          Skills Scoring Criteria:
          1. Skill Organization (30 points):
             - Logical categorization
             - Priority ordering
             - Industry relevance grouping
             - Technical vs. soft skill balance
             
          2. Evidence and Support (30 points):
             - Experience-based validation
             - Certification and training evidence
             - Project demonstration
             - Proficiency level indication
             
          3. Market Alignment (25 points):
             - Industry demand relevance
             - Target role requirements
             - Future-proof skill inclusion
             - Competitive differentiation
             
          4. Presentation Quality (15 points):
             - Conciseness and clarity
             - Readability and scanning ease
             - Visual organization
             - Keyword optimization
          
          Provide skill gap analysis and development recommendations.
          
        skills_metrics:
          - "Categorization_quality"
          - "Evidence_strength"
          - "Market_relevance"
          - "Presentation_effectiveness"
          
    # Summary section scoring
    summary_scoring:
      impact_scoring:
        prompt: |
          Score professional summary for impact and effectiveness:
          
          Summary Scoring Criteria:
          1. Value Proposition (35 points):
             - Clear professional identity
             - Unique differentiator articulation
             - Target role alignment
             - Competitive advantage demonstration
             
          2. Achievement Integration (25 points):
             - Key achievement highlights
             - Quantifiable success metrics
             - Career milestone inclusion
             - Impact statement clarity
             
          3. Strategic Positioning (25 points):
             - Career direction clarity
             - Industry expertise demonstration
             - Leadership capability indication
             - Growth potential showcase
             
          4. Professional Presentation (15 points):
             - Conciseness and impact
             - Professional tone maintenance
             - Readability and engagement
             - Keyword optimization
          
          Provide specific summary enhancement recommendations.
          
        summary_metrics:
          - "Value_proposition_strength"
          - "Achievement_integration"
          - "Strategic_positioning"
          - "Professional_impact"
          
  # Industry-specific scoring
  industry_scoring:
    # Technology industry scoring
    technology_scoring:
      prompt: |
          Score resume for technology industry competitiveness:
          
          Technology Scoring Criteria:
          1. Technical Depth (35 points):
             - Technology stack relevance
             - Technical skill proficiency
             - Project complexity demonstration
             - Innovation and problem-solving
             
          2. Project Experience (30 points):
             - Project scope and impact
             - Technical leadership evidence
             - Delivery and achievement metrics
             - Collaboration and teamwork
             
          3. Industry Alignment (20 points):
             - Current technology adoption
             - Industry standard compliance
             - Emerging technology awareness
             - Technical community involvement
             
          4. Professional Development (15 points):
             - Continuous learning evidence
             - Certification and training
             - Open source contributions
             - Technical thought leadership
          
          Provide technology-specific improvement recommendations.
          
        tech_metrics:
          - "Technical_depth_score"
          - "Project_impact_rating"
          - "Industry_alignment"
          - "Innovation_demonstration"
          
    # Healthcare industry scoring
    healthcare_scoring:
      prompt: |
          Score resume for healthcare industry requirements:
          
          Healthcare Scoring Criteria:
          1. Clinical Excellence (35 points):
             - Patient care quality metrics
             - Clinical skill proficiency
             - Treatment outcome improvements
             - Patient satisfaction achievements
             
          2. Regulatory Compliance (25 points):
             - Healthcare regulation knowledge
             - Accreditation and certification
             - Quality assurance participation
             - Risk management experience
             
          3. Interdisciplinary Collaboration (25 points):
             - Team leadership and coordination
             - Cross-departmental projects
             - Communication and relationship skills
             - Mentoring and training contributions
             
          4. Professional Development (15 points):
             - Continuing education
             - Specialty certifications
             - Research and publications
             - Professional association involvement
          
          Provide healthcare-specific enhancement strategies.
          
        healthcare_metrics:
          - "Clinical_excellence_score"
          - "Regulatory_compliance"
          - "Collaboration_effectiveness"
          - "Professional_growth"
          
  # Career level scoring
  career_level_scoring:
    # Entry level scoring
    entry_level_scoring:
      prompt: |
          Score entry-level resume for potential and competitiveness:
          
          Entry-Level Scoring Criteria:
          1. Academic Achievement (30 points):
             - GPA and academic performance
             - Relevant coursework and projects
             - Research and publications
             - Academic honors and awards
             
          2. Experience Potential (25 points):
             - Internship quality and relevance
             - Part-time work application
             - Volunteer experience value
             - Extracurricular leadership
             
          3. Skill Development (25 points):
             - Technical skill acquisition
             - Soft skill demonstration
             - Learning capability evidence
             - Adaptability and growth mindset
             
          4. Professional Readiness (20 points):
             - Career direction clarity
             - Industry knowledge demonstration
             - Professional communication
             - Networking and relationship building
          
          Provide entry-level specific development recommendations.
          
        entry_metrics:
          - "Academic_strength"
          - "Experience_potential"
          - "Skill_readiness"
          - "Professional_preparation"
          
    # Executive level scoring
    executive_scoring:
      prompt: |
          Score executive-level resume for strategic impact:
          
          Executive Scoring Criteria:
          1. Strategic Leadership (35 points):
             - Vision and strategy development
             - Organizational transformation
             - Market and industry influence
             - Thought leadership demonstration
             
          2. Business Impact (30 points):
             - P&L responsibility and results
             - Revenue and growth achievements
             - Market share expansion
             - Operational excellence
             
          3. Team and Culture (20 points):
             - Leadership team development
             - Organizational culture building
             - Talent acquisition and retention
             - Succession planning
             
          4. Industry Recognition (15 points):
             - Board positions and advisory roles
             - Speaking engagements and publications
             - Industry awards and recognition
             - Professional association leadership
          
          Provide executive-level strategic enhancement recommendations.
          
        executive_metrics:
          - "Strategic_leadership_score"
          - "Business_impact_rating"
          - "Organizational_influence"
          - "Thought_leadership_demonstration"
          
  # Scoring validation and calibration
  scoring_validation:
    # Calibration standards
    calibration:
      prompt: |
          Ensure scoring consistency and accuracy through calibration:
          
          Calibration Criteria:
          1. Benchmark Alignment:
             - Compare with industry standards
             - Validate against successful resumes
             - Ensure competitive positioning accuracy
             - Cross-validate with recruiter feedback
             
          2. Scoring Consistency:
             - Maintain scoring criteria consistency
             - Ensure evaluator alignment
             - Validate scoring methodology
             - Monitor scoring drift
             
          3. Quality Assurance:
             - Review scoring rationale
             - Validate feedback quality
             - Ensure improvement actionability
             - Monitor user satisfaction
          
          Provide calibration recommendations and quality metrics.
          
        calibration_metrics:
          - "Benchmark_alignment_score"
          - "Scoring_consistency_rating"
          - "Feedback_quality_assessment"
          - "User_satisfaction_rating"
          
    # Performance tracking
      performance_tracking:
        prompt: |
          Track scoring system performance and effectiveness:
          
          Performance Metrics:
          1. Predictive Validity:
             - Interview prediction accuracy
             - Job offer correlation
             - Success rate tracking
             - User outcome monitoring
             
          2. User Engagement:
             - Scoring completion rates
             - Feedback implementation rates
             - User satisfaction scores
             - Recommendation adoption
             
          3. System Effectiveness:
             - Scoring processing time
             - Accuracy improvement over time
             - User learning and development
             - System optimization opportunities
          
          Provide performance improvement recommendations.
          
        performance_metrics:
          - "Predictive_validity_score"
          - "User_engagement_rating"
          - "System_effectiveness"
          - "Continuous_improvement"
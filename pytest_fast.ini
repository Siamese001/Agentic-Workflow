[pytest]
# Fast local development profile — optimized for rapid feedback loops
# Usage: pytest -c pytest_fast.ini [args]
#
# Key differences from pytest.ini:
# - Parallel execution via xdist (-n auto)
# - Fail-fast on first error (-x)
# - Timeout protection (180s per test)
# - NO coverage overhead (faster execution)
# - Minimal output verbosity

pythonpath = .

# Test discovery (same as pytest.ini)
testpaths =
    tests/unit_min_deps
    tests/integration/agentic_core
    tests/architecture
    tests/enforcement
    tests/governance
    tests/system_learning
    tests/unit
    tests/sovereign_hardening
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude directories from test discovery
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    archives
    __pycache__
    .pytest_cache
    .mypy_cache
    .venv
    venv
    env
    ENV
    env.bak
    venv.bak
    _quarantine
    apps_rg
    apps_lic
    apps_shared
    ops_scripts
    data
    docs

# Fast execution options
addopts =
    -ra
    --tb=short
    --strict-markers
    --color=yes
    --import-mode=importlib
    --ignore=tests/integration/agentic_core/test_imports_no_mro_error.py
    --ignore=tests/integration/agentic_core/test_redis_integration.py
    --ignore=tests/evaluation
    -n auto
    --dist=loadfile
    --timeout=180
    -x

# Markers (same as pytest.ini)
markers =
    architecture: Structural invariant tests (AST-based, no filesystem mutations)
    asyncio: Async tests (pytest-asyncio)
    autonomy: Agent autonomy and decision-making tests
    boot: Boot sequence validation tests
    ci: CI sovereignty attack suite and integration guard tests
    compliance: Compliance validation tests
    constitutional: Constitutional rule enforcement tests
    dashboard: Dashboard integration tests
    determinism: Determinism digest validation tests
    e2e: End-to-end tests
    functional: Functional & Compliance tests (L1/L2)
    governance: Governance & Resilience tests (L3/L4/L5)
    guardian: Architectural integrity checks
    import_safety: Import safety and dependency validation tests
    integration: Integration tests across all layers
    integration_full_deps: Integration tests requiring full deps (pydantic/redis/requests)
    manual: Manual verification tests that create temporary violations
    mro: Method Resolution Order integrity tests
    negative_control: Negative control tampering detection tests
    playwright: Playwright browser automation tests
    security: Security & Edge Case tests (L1-L5)
    slow: Tests that take longer to run
    sovereign_hardening: Sovereign hardening suite (L2 boundary, digest, scanner, negative control)
    sovereignty: Sovereignty enforcement boundary tests
    ssot: Single Source of Truth compliance tests
    system_learning: System-learning persistence and meta-learning pipeline tests
    tool_use: Tool-Use & LLM Logic tests (L1/L5)
    unit: Unit tests for individual components
    unit_min_deps: Unit/contract tests that run without optional deps (pydantic/redis/requests)

# Minimum version
minversion = 6.0

# Logging (minimal for speed)
log_cli = false

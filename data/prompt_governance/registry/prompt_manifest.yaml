      metadata:
        description: "Message composition and formatting prompts"
        purpose: "Generate professional outreach messages and communications"

    outreach_reflective_checks:
      id: "outreach_reflective_checks"
      name: "Outreach Reflective Checks"
      category: "safety"
      engine: "outreach_engine"
      file: "engines/outreach_engine/reflective_checks.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Quality and safety checks for outreach content"
        purpose: "Ensure outreach meets professional and ethical standards"

  # Injection Prompts
  injections:
    constraints:
      id: "constraints"
      name: "Constraint Enforcement"
      category: "safety"
      file: "injections/constraints.yaml"
      version: "1.0.0"

  # Version tracking
  version_tracking:
    current_version: "1.0.0"
    version_history:
      - version: "1.0.0"
        released_at: "2024-01-01T00:00:00Z"
        changes: ["Initial release", "Complete prompt manifest"]

  # Compliance and governance
  compliance:
    frameworks:
      - name: "SOC 2"
        status: "compliant"
        last_audit: "2024-01-01T00:00:00Z"

      - name: "GDPR"
        status: "compliant"
        last_audit: "2024-01-01T00:00:00Z"

      - name: "HIPAA"
        status: "not_applicable"

    data_retention:
      prompt_versions: "2_years"
      usage_logs: "90_days"
      audit_trails: "7_years"

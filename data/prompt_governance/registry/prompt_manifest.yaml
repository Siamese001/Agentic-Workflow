# Prompt Manifest v1.0
# Comprehensive manifest of all prompts with metadata and dependencies

prompt_manifest:
  version: "1.0"
  schema_version: "1.0"
  generated_at: "2024-01-01T00:00:00Z"

  # Global configuration
  global_config:
    default_language: "en"
    supported_languages: ["en", "es", "fr", "de", "zh", "ja"]
    default_model: "gpt-4"
    fallback_models: ["gpt-3.5-turbo", "claude-3"]

    # Quality standards
    quality_standards:
      min_tokens: 50
      max_tokens: 4000
      required_sections: ["description", "purpose", "usage"]

    # Security settings
    security:
      pii_detection: true
      content_filtering: true
      audit_logging: true

  # Prompt definitions
  prompts:
    # Resume Engine Prompts
    resume_system_prompts:
      id: "resume_system_prompts"
      name: "Resume System Prompts"
      category: "system"
      engine: "resume_engine"
      file: "engines/resume_engine/system_prompts.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        created_by: "system"
        created_at: "2024-01-01T00:00:00Z"
        updated_by: "system"
        updated_at: "2024-01-01T00:00:00Z"

        description: "Core system prompts for resume processing workflow"
        purpose: "Provide foundational instructions for resume analysis and generation"

        dependencies:
          - "safety.yaml"
          - "constraints.yaml"

        parameters:
          - name: "resume_format"
            type: "string"
            default: "modern"
            options: ["modern", "classic", "technical"]

          - name: "target_role"
            type: "string"
            required: true

        usage:
          integration_points:
            - "L1_planning"
            - "L2_execution"

          api_endpoints:
            - "/api/resume/analyze"
            - "/api/resume/generate"

    resume_rewriting:
      id: "resume_rewriting"
      name: "Resume Rewriting Prompts"
      category: "user"
      engine: "resume_engine"
      file: "engines/resume_engine/rewriting.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Prompts for rewriting and optimizing resume content"
        purpose: "Transform raw resume data into polished, professional content"

        dependencies:
          - "system_prompts.yaml"
          - "scoring.yaml"

    resume_scoring:
      id: "resume_scoring"
      name: "Resume Scoring Prompts"
      category: "evaluation"
      engine: "resume_engine"
      file: "engines/resume_engine/scoring.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Evaluation and scoring prompts for resume quality"
        purpose: "Assess resume effectiveness and provide improvement recommendations"

    resume_summarization:
      id: "resume_summarization"
      name: "Resume Summarization Prompts"
      category: "user"
      engine: "resume_engine"
      file: "engines/resume_engine/summarization.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Prompts for creating concise resume summaries"
        purpose: "Generate executive summaries and highlights from resume content"

    # Outreach Engine Prompts
    outreach_archetype:
      id: "outreach_archetype"
      name: "Outreach Archetype Prompts"
      category: "system"
      engine: "outreach_engine"
      file: "engines/outreach_engine/archetype.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Core persona and archetype definitions for outreach"
        purpose: "Define communication styles and professional personas"

    outreach_personalization:
      id: "outreach_personalization"
      name: "Outreach Personalization Prompts"
      category: "user"
      engine: "outreach_engine"
      file: "engines/outreach_engine/personalization.yaml"
      version: "1.0.0"
      status: "active"

      metadata:
        description: "Personalization logic for tailored outreach messages"
        purpose: "Customize outreach based on recipient profile and context"

    outreach_messaging:

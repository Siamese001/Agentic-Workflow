lifecycle_management:
  role_changes:
    demotion_process:
    - manager_approval
    - access_review
    - permission_reduction
    - access_revocation
    - notification_update
    promotion_process:
    - manager_approval
    - role_requirements_validation
    - training_completion
    - permission_update
    - access_granting
  user_offboarding:
    approval_required: manager + hr + it_security
    steps:
    - access_revocation
    - data_handover
    - account_suspension
    - audit_completion
    - account_deletion
    timeline: immediate to 24 hours
  user_onboarding:
    approval_required: manager + it_security
    steps:
    - identity_verification
    - role_assignment
    - permission_granting
    - training_completion
    - access_activation
    timeline: 1-3 business days

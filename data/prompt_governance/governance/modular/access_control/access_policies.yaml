access_policies:
  authentication:
    methods:
    - multi_factor_authentication
    - single_sign_on
    - api_key_authentication
    - certificate_based_authentication
    requirements:
      mfa_required: true
      minimum_password_length: 12
      password_complexity: true
      session_timeout: 8 hours
  authorization:
    access_levels:
      executive: Strategic oversight and emergency actions
      management: Manage workflows and teams
      operational: Create and modify content in development
      read_only: View approved content and documentation
    contextual_access: true
    need_to_know_basis: true
    principle_of_least_privilege: true
    time_bound_access: true
  session_management:
    concurrent_sessions: 3
    device_restrictions: true
    idle_timeout: 30 minutes
    ip_restrictions: true
    session_timeout: 8 hours

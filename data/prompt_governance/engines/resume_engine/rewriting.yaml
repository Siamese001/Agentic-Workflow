# Resume Rewriting Prompts v1.0
# Prompts for rewriting and optimizing resume content

resume_rewriting:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Content rewriting frameworks
  content_rewriting:
    # Experience rewriting
    experience_rewriting:
      achievement_focused:
        prompt: |
          Rewrite work experience descriptions to focus on achievements and impact:
          
          Transform responsibilities into accomplishments using the STAR method:
          - Situation: Brief context of the challenge or opportunity
          - Task: Specific goals or objectives
          - Action: Steps taken and skills utilized
          - Result: Quantifiable outcomes and business impact
          
          Guidelines:
          1. Start each bullet with strong action verbs
          2. Include specific metrics, percentages, or dollar amounts
          3. Highlight business value and organizational impact
          4. Demonstrate problem-solving and initiative
          5. Maintain truthfulness and avoid exaggeration
          
          Example transformation:
          FROM: "Responsible for managing team projects"
          TO: "Led cross-functional team of 8 to deliver 15+ projects 20% under budget, improving client satisfaction by 35%"
          
        optimization_criteria:
          - "Action verb strength"
          - "Quantifiable metrics inclusion"
          - "Business impact demonstration"
          - "Conciseness and clarity"
          
      skill_integrated:
        prompt: |
          Rewrite experience descriptions to integrate relevant skills naturally:
          
          1. Weave technical and soft skills into achievement descriptions
          2. Show skill application in real-world contexts
          3. Demonstrate skill progression and mastery
          4. Connect skills to business outcomes
          5. Avoid generic skill lists without examples
          
          Focus on showing skills in action rather than just listing them.
          Ensure skill claims are supported by specific achievements.
          
        integration_strategy:
          - "Contextual skill demonstration"
          - "Progressive skill complexity"
          - "Business outcome linkage"
          - "Authentic skill evidence"
          
    # Summary rewriting
    summary_rewriting:
      value_proposition:
        prompt: |
          Craft a compelling professional summary that serves as a value proposition:
          
          Structure:
          1. Opening statement: Professional identity and core expertise
          2. Key achievements: 2-3 most significant accomplishments
          3. Core skills: Essential capabilities for target role
          4. Career goals: Clear direction and aspirations
          5. Unique value: What sets you apart from others
          
          Guidelines:
          - Keep to 3-4 sentences maximum
          - Tailor specifically to target role/industry
          - Include quantifiable achievements when possible
          - Demonstrate passion and enthusiasm
          - Maintain professional confidence without arrogance
          
        quality_standards:
          - "Target role specificity"
          - "Achievement integration"
          - "Professional tone"
          - "Concise impact"
          
      brand_focused:
        prompt: |
          Rewrite professional summary to build personal brand:
          
          1. Establish clear professional identity and expertise
          2. Highlight unique value proposition and differentiators
          3. Showcase consistent career themes and strengths
          4. Demonstrate industry thought leadership or innovation
          5. Align with target company culture and values
          
          Create a memorable summary that positions you as an ideal candidate.
          Ensure brand claims are authentic and supportable.
          
        brand_elements:
          - "Professional identity clarity"
          - "Unique value articulation"
          - "Career theme consistency"
          - "Cultural alignment"
          
  # Language and tone optimization
  language_optimization:
    # Action verb enhancement
    action_verbs:
      enhancement_prompt: |
        Replace weak verbs with powerful action verbs that demonstrate impact:
        
        Weak verb replacements:
        - "Responsible for" → "Led", "Managed", "Directed", "Oversaw"
        - "Helped with" → "Collaborated on", "Contributed to", "Supported"
        - "Worked on" → "Developed", "Implemented", "Executed", "Delivered"
        - "Participated in" → "Spearheaded", "Championed", "Facilitated"
        
        Categorize action verbs by impact level:
        High Impact: Transformed, Revolutionized, Pioneered, Architected
        Medium Impact: Improved, Enhanced, Optimized, Streamlined
        Foundation Impact: Managed, Coordinated, Organized, Maintained
        
        Choose verbs that accurately reflect the scope and impact of your work.
        
      verb_categories:
        leadership: ["Led", "Directed", "Managed", "Supervised", "Mentored"]
        achievement: ["Achieved", "Delivered", "Completed", "Accomplished", "Secured"]
        innovation: ["Created", "Developed", "Designed", "Pioneered", "Innovated"]
        improvement: ["Improved", "Enhanced", "Optimized", "Streamlined", "Upgraded"]
        
    # Professional tone refinement
    tone_refinement:
      prompt: |
        Refine language for optimal professional tone:
        
        Guidelines:
        1. Use confident but not arrogant language
        2. Maintain objective, fact-based descriptions
        3. Avoid overly casual or informal expressions
        4. Eliminate jargon unless industry-standard
        5. Ensure consistency in tone throughout resume
        
        Tone adjustments:
        - Remove subjective qualifiers ("really", "very", "extremely")
        - Replace vague terms with specific descriptions
        - Use present tense for current roles, past tense for previous
        - Maintain active voice throughout
        - Ensure cultural and professional appropriateness
        
        quality_metrics:
          - "Professionalism score"
          - "Clarity rating"
          - "Confidence level"
          - "Consistency check"
          
  # Industry-specific rewriting
  industry_rewriting:
    # Technology industry
    technology_focus:
      prompt: |
        Rewrite experience for technology industry emphasis:
        
        1. Highlight technical skills and technologies in context
        2. Emphasize project lifecycle and delivery achievements
        3. Showcase problem-solving and technical innovation
        4. Include metrics around system performance, user adoption, efficiency
        5. Demonstrate adaptability to new technologies and methodologies
        
        Technical integration examples:
        - "Implemented microservices architecture using Docker and Kubernetes"
        - "Developed machine learning models that improved prediction accuracy by 40%"
        - "Led agile development teams using Scrum methodology to deliver 20+ features"
        
        technology_elements:
          - "Technical skill integration"
          - "Project achievement focus"
          - "Innovation demonstration"
          - "Methodology expertise"
          
    # Healthcare industry
    healthcare_focus:
      prompt: |
        Rewrite experience for healthcare industry positions:
        
        1. Emphasize patient care quality and safety outcomes
        2. Highlight regulatory compliance and accreditation achievements
        3. Showcase interdisciplinary collaboration and leadership
        4. Include metrics around patient satisfaction, efficiency, cost reduction
        5. Demonstrate commitment to evidence-based practices
        
        Healthcare impact examples:
        - "Improved patient satisfaction scores by 25% through enhanced care coordination"
        - "Led quality improvement initiatives that reduced readmission rates by 15%"
        - "Implemented electronic health records system improving documentation accuracy by 30%"
        
        healthcare_elements:
          - "Patient care quality"
          - "Regulatory compliance"
          - "Interdisciplinary collaboration"
          - "Quality improvement"
          
  # Career level rewriting
  career_level_rewriting:
    # Entry level optimization
    entry_level:
      prompt: |
        Rewrite experience for entry-level candidates:
        
        1. Emphasize potential and learning capabilities
        2. Highlight academic achievements and relevant projects
        3. Showcase transferable skills from internships and part-time work
        4. Demonstrate initiative and leadership in extracurricular activities
        5. Include quantifiable achievements from academic and volunteer work
        
        Entry-level focus areas:
        - Academic projects and research
        - Internship and co-op experiences
        - Leadership roles in student organizations
        - Volunteer work and community involvement
        - Relevant coursework and certifications
        
        optimization_strategy:
          - "Potential emphasis"
          - "Transferable skill highlighting"
          - "Academic achievement integration"
          - "Leadership demonstration"
          
    # Executive level refinement
    executive_level:
      prompt: |
        Rewrite experience for executive-level positions:
        
        1. Emphasize strategic leadership and business impact
        2. Highlight P&L responsibility and financial achievements
        3. Showcase organizational development and team building
        4. Demonstrate industry thought leadership and innovation
        5. Include board positions, speaking engagements, and recognitions
        
        Executive impact examples:
        - "Led $500M business unit, achieving 15% year-over-year growth"
        - "Spearheaded digital transformation initiative, increasing market share by 20%"
        - "Built and mentored leadership team, improving employee retention by 30%"
        
        executive_elements:
          - "Strategic leadership"
          - "Business impact quantification"
          - "Organizational development"
          - "Thought leadership"
          
  # Quality assurance for rewriting
  rewriting_quality:
    # Validation checks
    validation:
      prompt: |
        Validate rewritten content for quality and effectiveness:
        
        Quality criteria:
        1. Accuracy: All claims truthful and verifiable
        2. Impact: Demonstrates clear business value and results
        3. Relevance: Directly applicable to target role
        4. Professionalism: Maintains appropriate tone and language
        5. Differentiation: Sets candidate apart from competition
        
        Validation process:
        - Fact-check all metrics and achievements
        - Ensure consistent professional tone
        - Verify alignment with job requirements
        - Check for appropriate length and detail
        - Validate ATS compatibility and keyword optimization
        
        quality_metrics:
          - "Accuracy verification"
          - "Impact assessment"
          - "Relevance scoring"
          - "Professionalism rating"
          
    # Performance optimization
    optimization:
      prompt: |
        Optimize rewritten content for maximum effectiveness:
        
        Optimization areas:
        1. Keyword density for ATS optimization
        2. Readability score for human engagement
        3. Conciseness without losing impact
        4. Visual hierarchy and formatting
        5. Overall narrative flow and coherence
        
        Performance metrics:
        - ATS parsing success rate
        - Recruiter engagement time
        - Interview conversion rate
        - Competitive positioning score
        
        optimization_techniques:
          - "Keyword strategic placement"
          - "Readability enhancement"
          - "Conciseness optimization"
          - "Visual hierarchy improvement"
# Outreach Summarization Prompts v1.0
# Prompts for generating comprehensive outreach summaries and insights

outreach_summarization:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Summarization frameworks
  summarization_frameworks:
    # Outreach strategy summary
    strategy_summary:
      comprehensive_overview:
        prompt: |
          Generate a comprehensive outreach strategy summary:
          
          Strategy Summary Structure:
          1. Outreach Objectives:
             - Primary networking goals
             - Target audience identification
             - Success metrics definition
             - Timeline and milestones
             
          2. Value Proposition:
             - Core value offering to recipients
             - Mutual benefit articulation
             - Differentiation factors
             - Long-term relationship potential
             
          3. Target Audience Analysis:
             - Ideal recipient profiles
             - Industry and role targeting
             - Decision-maker identification
             - Network expansion opportunities
             
          4. Communication Strategy:
             - Channel selection and optimization
             - Messaging approach and tone
             - Personalization depth requirements
             - Follow-up and engagement planning
             
          5. Success Metrics:
             - Response rate targets
             - Engagement quality indicators
             - Relationship building benchmarks
             - Network expansion goals
             
          Create a strategic summary that guides systematic outreach execution and measurement.
          
        quality_standards:
          - "Strategic_clarity"
          - "Actionable_guidance"
          - "Measurable_objectives"
          - "Relationship_building_focus"
          
    # Campaign performance summary
      campaign_summary:
        prompt: |
          Generate comprehensive outreach campaign performance summary:
          
          Campaign Performance Framework:
          1. Execution Overview:
             - Campaign scope and reach
             - Message volume and distribution
             - Channel utilization analysis
             - Timeline adherence assessment
             
          2. Engagement Metrics:
             - Response rates by channel
             - Engagement quality scores
             - Conversion and meeting rates
             - Follow-up success tracking
             
          3. Audience Analysis:
             - Response patterns by segment
             - High-engagement recipient identification
             - Industry and role response variations
             - Optimal timing insights
             
          4. Content Performance:
             - Message effectiveness ranking
             - Subject line and opening analysis
             - Value proposition resonance
             - Call to action optimization
             
          5. Relationship Development:
             - New connections established
             - Relationship quality indicators
             - Long-term engagement potential
             - Network expansion metrics
             
          Provide actionable insights for campaign optimization and strategy refinement.
          
        performance_analysis:
          - "Execution_effectiveness"
          - "Engagement_quality"
          - "Audience_responsiveness"
          - "Relationship_building_success"
          
  # Message effectiveness summarization
  message_summarization:
    # Response analysis
    response_analysis:
      prompt: |
          Generate comprehensive message response analysis summary:
          
          Response Analysis Framework:
          1. Response Patterns:
             - Positive response characteristics
             - Common objection themes
             - Timing and frequency patterns
             - Channel-specific performance
             
          2. Content Effectiveness:
             - High-performing message elements
             - Personalization impact assessment
             - Value proposition resonance
             - Call to action effectiveness
             
          3. Audience Insights:
             - Responsive segment identification
             - Decision-maker engagement patterns
             - Industry-specific response variations
             - Role-level response preferences
             
          4. Optimization Opportunities:
             - Immediate improvement areas
             - Long-term strategy adjustments
             - Personalization depth optimization
             - Channel reallocation opportunities
             
          5. Predictive Insights:
             - Success probability indicators
             - Engagement quality predictors
             - Relationship building potential
             - Conversion likelihood factors
          
          Use data-driven insights to optimize future outreach effectiveness.
          
        response_metrics:
          - "Response_rate_analysis"
          - "Content_effectiveness_scoring"
          - "Audience_engagement_patterns"
          - "Optimization_opportunity_identification"
          
    # Relationship building summary
      relationship_summary:
        prompt: |
          Generate comprehensive relationship building analysis summary:
          
          Relationship Building Framework:
          1. Connection Quality:
             - New relationship establishment
             - Connection strength indicators
             - Mutual value exchange evidence
             - Long-term potential assessment
             
          2. Engagement Depth:
             - Conversation quality metrics
             - Value exchange frequency
             - Professional trust development
             - Network integration progress
             
          3. Strategic Value:
             - Career advancement opportunities
             - Knowledge exchange benefits
             - Collaboration potential
             - Influence expansion metrics
             
          4. Network Growth:
             - Network expansion rate
             - Quality of new connections
             - Diversification of professional contacts
             - Industry reach enhancement
             
          5. Future Opportunities:
             - Upcoming engagement possibilities
             - Collaboration project potential
             - Mentorship and learning opportunities
             - Industry leadership development
          
          Focus on long-term relationship building rather than immediate transactional outcomes.
          
        relationship_metrics:
          - "Connection_quality_assessment"
          - "Engagement_depth_measurement"
          - "Strategic_value_evaluation"
          - "Network_growth_analysis"
          
  # Industry-specific summarization
  industry_summarization:
    # Technology industry summary
    technology_summary:
      prompt: |
          Generate technology industry-focused outreach summary:
          
          Technology Industry Framework:
          1. Technical Engagement:
             - Technology discussion quality
             - Technical expertise recognition
             - Innovation conversation depth
             - Problem-solving collaboration
             
          2. Community Integration:
             - Technical community participation
             - Open source contribution engagement
             - Conference and event connections
             - Knowledge sharing effectiveness
             
          3. Collaboration Opportunities:
             - Technical project partnerships
             - Knowledge exchange arrangements
             - Innovation collaboration potential
             - Technology transfer opportunities
             
          4. Industry Authority:
             - Thought leadership development
             - Technical expertise demonstration
             - Industry influence expansion
             - Professional reputation enhancement
             
          5. Future Technology Trends:
             - Emerging technology discussions
             - Innovation opportunity identification
             - Technical skill development
             - Industry advancement contributions
          
          Create technology-focused summaries that highlight technical collaboration and innovation opportunities.
          
        tech_summary_elements:
          - "Technical_engagement_quality"
          - "Community_integration_success"
          - "Collaboration_opportunity_assessment"
          - "Industry_authority_development"
          
    # Healthcare industry summary
    healthcare_summary:
      prompt: |
          Generate healthcare industry-focused outreach summary:
          
          Healthcare Industry Framework:
          1. Professional Collaboration:
             - Clinical knowledge exchange
             - Healthcare improvement initiatives
             - Research collaboration opportunities
             - Best practice sharing
             
          2. Industry Engagement:
             - Healthcare community participation
             - Professional association involvement
             - Regulatory compliance discussions
             - Quality improvement collaboration
             
          3. Patient Care Impact:
             - Patient outcome improvement discussions
             - Care quality enhancement initiatives
             - Healthcare technology engagement
             - Community health contributions
             
          4. Professional Development:
             - Continuing education connections
             - Specialty advancement opportunities
             - Research and publication collaboration
             - Mentorship and knowledge sharing
             
          5. System Improvement:
             - Healthcare system optimization
             - Process improvement collaboration
             - Policy development engagement
             - Innovation implementation support
          
          Ensure all summaries maintain healthcare professional standards and patient privacy.
          
        healthcare_summary_elements:
          - "Professional_collaboration_quality"
          - "Industry_engagement_effectiveness"
          - "Patient_care_impact"
          - "System_improvement_contribution"
          
  # Channel-specific summarization
  channel_summarization:
    # Email outreach summary
    email_summary:
      prompt: |
          Generate comprehensive email outreach performance summary:
          
          Email Outreach Framework:
          1. Subject Line Performance:
             - Open rate analysis by category
             - Personalization effectiveness
             - A/B testing results
             - Spam filter avoidance success
             
          2. Message Content Analysis:
             - Body content engagement rates
             - Personalization depth impact
             - Value proposition resonance
             - Length optimization effectiveness
             
          3. Call to Action Success:
             - CTA click-through rates
             - Response conversion metrics
             - Commitment level optimization
             - Follow-up engagement patterns
             
          4. Professional Presentation:
             - Formatting effectiveness
             - Mobile optimization success
             - Signature professionalization impact
             - Brand consistency assessment
             
          5. Long-term Engagement:
             - Email sequence performance
             - Relationship building progression
             - Newsletter and update engagement
             - Ongoing communication quality
          
          Provide specific email optimization recommendations with performance benchmarks.
          
        email_performance_metrics:
          - "Subject_line_optimization"
          - "Content_engagement_analysis"
          - "Call_to_action_effectiveness"
          - "Professional_presentation_quality"
          
    # LinkedIn outreach summary
    linkedin_summary:
      prompt: |
          Generate comprehensive LinkedIn outreach performance summary:
          
          LinkedIn Outreach Framework:
          1. Connection Request Success:
             - Acceptance rates by strategy
             - Personalization effectiveness
             - Mutual connection impact
             - Timing optimization results
             
          2. InMail Performance:
             - Message response rates
             - Professional networking success
             - Value proposition effectiveness
             - Follow-up engagement patterns
             
          3. Profile Engagement:
             - Post interaction quality
             - Comment engagement effectiveness
             - Content sharing impact
             - Professional brand enhancement
             
          4. Network Development:
             - Connection quality assessment
             - Network expansion metrics
             - Industry reach enhancement
             - Professional influence growth
             
          5. Community Participation:
             - Group engagement success
             - Industry discussion contribution
             - Thought leadership demonstration
             - Professional authority building
          
          Leverage LinkedIn's professional networking features for strategic relationship building.
          
        linkedin_performance_metrics:
          - "Connection_request_success"
          - "Inmail_effectiveness"
          - "Profile_engagement_quality"
          - "Network_development_progress"
          
  # Relationship stage summarization
  relationship_stages:
    # Initial connection summary
    initial_connection:
      prompt: |
          Generate initial connection stage analysis summary:
          
          Initial Connection Framework:
          1. First Contact Success:
             - Initial response rates
             - First impression quality
             - Rapport building effectiveness
             - Professional credibility establishment
             
          2. Value Exchange Initiation:
             - Initial value offering success
             - Mutual benefit demonstration
             - Reciprocity establishment
             - Trust building progress
             
          3. Engagement Quality:
             - Conversation depth indicators
             - Professional interest level
             - Follow-up willingness
             - Long-term potential assessment
             
          4. Personalization Effectiveness:
             - Research impact demonstration
             - Contextual relevance success
             - Authentic connection establishment
             - Cultural appropriateness
             
          5. Next Step Planning:
             - Relationship progression strategy
             - Future engagement opportunities
             - Value exchange continuation
             - Network integration planning
          
          Focus on building strong foundation for long-term professional relationships.
          
        initial_connection_metrics:
          - "First_contact_success_rate"
          - "Value_exchange_initiation"
          - "Engagement_quality_assessment"
          - "Relationship_foundation_strength"
          
    # Long-term relationship summary
      long_term_relationship:
        prompt: |
          Generate long-term relationship development analysis summary:
          
          Long-term Relationship Framework:
          1. Relationship Maturity:
             - Trust and credibility establishment
             - Professional respect development
             - Mutual dependency creation
             - Strategic alliance formation
             
          2. Value Exchange Evolution:
             - Ongoing value provision
             - Knowledge sharing enhancement
             - Resource exchange optimization
             - Collaboration expansion
             
          3. Network Integration:
             - Network overlap development
             - Mutual connection introduction
             - Community building participation
             - Industry influence expansion
             
          4. Professional Support:
             - Career development support
             - Opportunity facilitation
             - Mentorship and guidance
             - Advocacy and recommendation
             
          5. Future Collaboration:
             - Joint project opportunities
             - Business development potential
             - Innovation collaboration
             - Industry advancement contributions
          
          Analyze relationship development patterns and identify growth opportunities.
          
        long_term_metrics:
          - "Relationship_maturity_assessment"
          - "Value_exchange_evolution"
          - "Network_integration_progress"
          - "Future_collaboration_potential"
          
  # Quality assurance for summarization
  summarization_quality:
    # Validation checks
    validation:
      prompt: |
          Validate outreach summary quality and effectiveness:
          
          Validation Criteria:
          1. Accuracy and Reliability:
             - Data-driven insights verification
             - Performance metric accuracy
             - Trend analysis reliability
             - Predictive model validation
             
          2. Actionability and Utility:
             - Specific improvement recommendations
             - Clear implementation guidance
             - Priority-based action items
             - Resource requirement identification
             
          3. Strategic Alignment:
             - Career goal alignment
             - Professional brand consistency
             - Network development strategy
             - Long-term relationship focus
             
          4. Professional Standards:
             - Ethical networking compliance
             - Professional communication standards
             - Cultural appropriateness
             - Industry best practices
             
          Review summaries against these criteria and refine as needed.
          
        validation_metrics:
          - "Accuracy_reliability_score"
          - "Actionability_utility_rating"
          - "Strategic_alignment_assessment"
          - "Professional_standards_compliance"
          
    # Performance optimization
      optimization:
        prompt: |
          Optimize outreach summaries for maximum strategic value:
          
          Optimization Areas:
          1. Insight Generation:
             - Pattern identification enhancement
             - Trend analysis improvement
             - Predictive accuracy optimization
             - Strategic insight extraction
             
          2. Recommendation Quality:
             - Actionability enhancement
             - Implementation clarity
             - Priority optimization
             - Success probability improvement
             
          3. Measurement Precision:
             - Metric accuracy improvement
             - Benchmark refinement
             - Performance prediction enhancement
             - ROI optimization
             
          4. Strategic Value:
             - Long-term relationship focus
             - Network expansion optimization
             - Professional brand enhancement
             - Career advancement support
          
          Provide specific optimization recommendations with expected strategic impact.
          
        optimization_techniques:
          - "Insight_generation_enhancement"
          - "Recommendation_quality_improvement"
          - "Measurement_precision_optimization"
          - "Strategic_value_maximization"

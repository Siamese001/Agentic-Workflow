# Style Checks v1.0
# Comprehensive style and formatting validation framework for prompt governance

style_checks:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"

  # Style validation framework
  validation_framework:
    automated_checks:
      yaml_structure:
        - name: "yaml_syntax_validation"
          description: "Validate YAML syntax and structure"
          checks:
            - syntax_correctness: "Parse YAML without errors"
            - proper_indentation: "Consistent 2-space indentation"
            - required_fields: "All mandatory fields present"
            - data_type_consistency: "Field types match schema"
          severity: "critical"

        - name: "naming_convention_compliance"
          description: "Ensure consistent naming conventions"
          checks:
            - snake_case_keys: "All keys use snake_case format"
            - consistent_casing: "Uniform case usage throughout"
            - descriptive_names: "Clear, descriptive field names"
            - no_reserved_words: "Avoid YAML reserved keywords"
          severity: "high"

      content_formatting:
        - name: "content_structure_validation"
          description: "Validate content organization and structure"
          checks:
            - logical_hierarchy: "Proper parent-child relationships"
            - consistent_sectioning: "Uniform section organization"
            - completeness_coverage: "All required sections included"
            - cross_reference_integrity: "Valid internal references"
          severity: "high"

        - name: "documentation_standards"
          description: "Ensure documentation meets quality standards"
          checks:
            - comment_completeness: "All sections properly documented"
            - description_quality: "Clear, concise descriptions"
            - example_inclusion: "Relevant examples provided"
            - version_consistency: "Version information accurate"
          severity: "medium"

    manual_review_checks:
      content_quality:
        - name: "prompt_effectiveness_assessment"
          description: "Evaluate prompt effectiveness and quality"
          review_criteria:
            - clarity_assessment: "Prompt clarity and understandability"
            - specificity_evaluation: "Degree of specific guidance"
            - completeness_review: "Coverage of necessary aspects"
            - actionability_assessment: "Practical implementation feasibility"
          reviewer_expertise: "prompt_engineering, subject_matter_expert"

        - name: "industry_standards_compliance"
          description: "Validate compliance with industry standards"
          review_criteria:
            - current_practices: "Alignment with current industry practices"
            - best_practices: "Incorporation of established best practices"
            - regulatory_compliance: "Adherence to relevant regulations"
            - ethical_guidelines: "Compliance with ethical standards"
          reviewer_expertise: "industry_expert, compliance_specialist"

  # Specific style guidelines
  style_guidelines:
    yaml_formatting:
      structure_standards:
        - indentation: "Consistent 2-space indentation"
        - line_length: "Maximum 120 characters per line"
        - trailing_whitespace: "No trailing whitespace allowed"
        - file_ending: "Single newline at file end"

      content_organization:
        - version_header: "Version and last_updated fields at top"
        - logical_grouping: "Related items grouped together"
        - alphabetical_ordering: "Lists ordered alphabetically where appropriate"
        - hierarchical_structure: "Clear parent-child relationships"

    prompt_content:
      language_standards:
        - professional_tone: "Maintain professional, business-appropriate language"
        - inclusive_language: "Use inclusive, non-discriminatory terminology"
        - active_voice: "Prefer active voice over passive voice"
        - clarity_focus: "Prioritize clarity over complexity"

        - consistency_requirements:
          - terminology: "Consistent terminology throughout"
          - formatting: "Uniform formatting patterns"
          - style: "Consistent writing style"
          - voice: "Consistent narrative voice"

      content_quality:
        - specificity_standards:
          - actionable_guidance: "Provide specific, actionable instructions"
          - concrete_examples: "Include concrete, relevant examples"
          - measurable_outcomes: "Define measurable success criteria"
          - clear_expectations: "Set clear user expectations"

        - completeness_requirements:
          - comprehensive_coverage: "Address all relevant aspects"
          - edge_case_handling: "Consider and address edge cases"
          - error_scenarios: "Include error handling guidance"
          - context_provision: "Provide sufficient context"

  # Engine-specific style checks
  engine_specific_checks:
    resume_engine_style:
      system_prompts:
        - name: "resume_expertise_validation"
          description: "Ensure resume-specific expertise is properly represented"
          checks:
            - industry_knowledge: "Current industry standards and practices"
            - career_guidance: "Appropriate career development guidance"
            - ats_optimization: "ATS system optimization best practices"
            - professional_standards: "Resume writing professional standards"
          validation_method: "expert_review + automated_keyword_check"

        - name: "career_level_appropriateness"
          description: "Validate content appropriateness for different career levels"
          checks:
            - entry_level_guidance: "Suitable for early-career professionals"
            - mid_career_relevance: "Appropriate for experienced professionals"
            - executive_standards: "Executive-level quality and sophistication"
            - transition_support: "Career transition guidance quality"
          validation_method: "segmented_testing + expert_validation"

      rewriting_prompts:
        - name: "achievement_enhancement_style"
          description: "Validate achievement enhancement writing style"
          checks:
            - quantification_standards: "Proper metric quantification"
            - action_verb_usage: "Strong, active verb incorporation"
            - impact articulation: "Clear impact and benefit communication"
            - conciseness_balance: "Brevity without sacrificing detail"
          validation_method: "sample_analysis + quality_scoring"

        - name: "ats_compliance_formatting"
          description: "Ensure ATS-compliant formatting guidance"
          checks:
            - keyword_optimization: "Strategic keyword integration"
            - format_standards: "ATS-friendly formatting rules"
            - parsing_optimization: "System parsing optimization"
            - compatibility_guidance: "Multi-ATS compatibility"
          validation_method: "ats_simulation + compliance_checking"

      scoring_prompts:
        - name: "evaluation_criteria_style"
          description: "Validate scoring criteria presentation style"
          checks:
            - clarity_standards: "Clear, understandable criteria"
            - consistency_requirements: "Consistent scoring application"
            - bias_prevention: "Unbiased evaluation guidance"
            - calibration_support: "Score calibration assistance"
          validation_method: "inter_rater_reliability + bias_analysis"

      feedback_prompts:
        - name: "improvement_guidance_style"
          description: "Validate feedback and improvement guidance style"
          checks:
            - constructive_approach: "Constructive, positive feedback framing"
            - actionability_focus: "Actionable recommendation emphasis"
            - priority_guidance: "Improvement prioritization assistance"
            - educational_value: "Learning and development support"
          validation_method: "user_testing + educational_assessment"

    outreach_engine_style:
      system_prompts:
        - name: "professional_networking_style"
          description: "Validate professional networking communication style"
          checks:
            - relationship_focus: "Relationship-building emphasis"
            - value_proposition: "Clear mutual benefit articulation"
            - professional_standards: "Business communication standards"
            - authenticity_balance: "Professional yet authentic tone"
          validation_method: "communication_analysis + professional_review"

        - name: "personalization_quality_style"
          description: "Validate personalization approach and quality"
          checks:
            - research_integration: "Research-based personalization"
            - relevance_assessment: "Context and relevance validation"
            - customization_depth: "Appropriate customization level"
            - scalability_consideration: "Scalable personalization methods"
          validation_method: "effectiveness_testing + scalability_analysis"

      rewriting_prompts:
        - name: "engagement_optimization_style"
          description: "Validate engagement optimization writing style"
          checks:
            - response_focus: "Response rate optimization guidance"
            - channel_adaptation: "Channel-specific adaptation rules"
            - persistence_balance: "Professional persistence guidance"
            - value_addition: "Value-driven follow-up strategies"
          validation_method: "engagement_metrics + channel_analysis"

        - name: "follow_up_strategy_style"
          description: "Validate follow-up strategy communication style"
          checks:
            - timing_guidance: "Optimal follow-up timing recommendations"
            - value_enhancement: "Value-added follow-up content"
            - professional_boundaries: "Professional boundary maintenance"
            - relationship_building: "Long-term relationship focus"
          validation_method: "relationship_analysis + professional_standards_check"

      scoring_prompts:
        - name: "response_prediction_style"
          description: "Validate response rate prediction approach"
          checks:
            - analytical_rigor: "Sound analytical methodology"
            - factor_consideration: "Comprehensive factor inclusion"
            - confidence_communication: "Clear confidence interval communication"
            - practical_application: "Practical implementation guidance"
          validation_method: "statistical_validation + practicality_assessment"

        - name: "relationship_potential_style"
          description: "Validate relationship building potential assessment"
          checks:
            - long_term_focus: "Long-term relationship emphasis"
            - mutual_benefit_analysis: "Mutual benefit evaluation"
            - ethical_considerations: "Ethical networking guidance"
            - professional_standards: "Professional relationship standards"
          validation_method: "ethical_review + professional_standards_validation"

      feedback_prompts:
        - name: "strategy_optimization_style"
          description: "Validate outreach strategy feedback style"
          checks:
            - strategic_thinking: "Strategic approach emphasis"
            - practical_guidance: "Practical implementation support"
            - measurement_focus: "Result measurement guidance"
            - continuous_improvement: "Ongoing optimization support"
          validation_method: "strategic_analysis + implementation_testing"

  # Quality assurance procedures
  quality_assurance:
    automated_validation:
      - name: "continuous_style_validation"
        description: "Automated style validation in CI/CD pipeline"
        execution:
          - pre_commit_hooks: "Style validation before commits"
          - pull_request_checks: "Comprehensive validation on PRs"
          - scheduled_audits: "Regular style compliance audits"
          - real_time_monitoring: "Continuous style quality monitoring"
        reporting:
          - violation_tracking: "Style violation logging and tracking"
          - trend_analysis: "Style quality trend monitoring"
          - compliance_metrics: "Overall compliance percentage tracking"
          - improvement_recommendations: "Automated improvement suggestions"

    manual_review_processes:
      - name: "expert_style_review"
        description: "Expert review of style and quality standards"
        review_schedule:
          - new_prompt_review: "Review all new prompts for style compliance"
          - major_update_review: "Review significant updates for style impact"
          - periodic_audit: "Quarterly comprehensive style audits"
          - standards_update_review: "Review style standards for updates"
        review_criteria:
          - consistency_assessment: "Style consistency evaluation"
          - quality_evaluation: "Overall quality assessment"
          - usability_review: "User experience and usability evaluation"
          - standards_compliance: "Compliance with established standards"

  # Style improvement framework
  style_improvement:
    continuous_enhancement:
      - name: "style_evolution_tracking"
        description: "Track and implement style improvements over time"
        monitoring:
          - industry_trends: "Monitor industry style trends and changes"
          - user_feedback: "Collect and analyze user style feedback"
          - performance_metrics: "Track style-related performance metrics"
          - best_practice_integration: "Integrate emerging best practices"
        implementation:
          - incremental_updates: "Implement style improvements incrementally"
          - backward_compatibility: "Maintain backward compatibility where possible"
          - change_communication: "Communicate style changes effectively"
          - training_support: "Provide training for style standard updates"

    feedback_integration:
      - name: "style_feedback_system"
        description: "Systematic collection and integration of style feedback"
        feedback_sources:
          - user_experience: "User experience and satisfaction feedback"
          - expert_reviews: "Subject matter expert style assessments"
          - peer_reviews: "Cross-functional team style reviews"
          - automated_analysis: "Automated style quality analysis"
        integration_process:
          - feedback_categorization: "Categorize feedback by type and priority"
          - impact_assessment: "Assess impact of proposed style changes"
          - implementation_planning: "Plan style improvement implementation"
          - effectiveness_measurement: "Measure improvement effectiveness"

  # Documentation and training
  documentation_standards:
    style_guides:
      - name: "comprehensive_style_guide"
        description: "Complete style guide for prompt development"
        content_sections:
          - formatting_standards: "Detailed formatting requirements"
          - content_guidelines: "Content creation and organization standards"
          - quality_criteria: "Quality assessment criteria and methods"
          - examples_and_templates: "Style-compliant examples and templates"
        maintenance:
          - regular_updates: "Quarterly style guide updates"
          - version_control: "Versioned style guide management"
          - accessibility: "Easy access and navigation"
          - training_integration: "Integration with training programs"

    training_materials:
      - name: "style_compliance_training"
        description: "Training materials for style standard compliance"
        training_components:
          - style_fundamentals: "Basic style principles and requirements"
          - practical_application: "Hands-on style application exercises"
          - quality_assessment: "Style quality assessment methods"
          - continuous_improvement: "Ongoing style improvement practices"
        delivery_methods:
          - interactive_workshops: "Hands-on style workshop sessions"
          - online_modules: "Self-paced online style training"
          - mentoring_programs: "One-on-one style mentoring"
          - community_practice: "Community-based style practice sessions"

  # Compliance and governance
  governance_framework:
    style_governance:
      - name: "style_standard_authority"
        description: "Authority structure for style standard management"
        governance_structure:
          - style_committee: "Cross-functional style standards committee"
          - expert_reviewers: "Subject matter expert reviewers"
          - implementation_team: "Style standard implementation team"
          - compliance_monitors: "Ongoing compliance monitoring team"
        decision_processes:
          - standard_updates: "Process for updating style standards"
          - exception_handling: "Process for handling style exceptions"
          - conflict_resolution: "Process for resolving style conflicts"
          - change_communication: "Process for communicating style changes"

    compliance_monitoring:
      - name: "ongoing_compliance_assessment"
        description: "Continuous monitoring of style compliance"
        monitoring_activities:
          - regular_audits: "Scheduled style compliance audits"
          - spot_checks: "Random style compliance spot checks"
          - trend_analysis: "Style compliance trend monitoring"
          - issue_tracking: "Style issue identification and tracking"
        reporting:
          - compliance_dashboards: "Real-time compliance monitoring dashboards"
          - periodic_reports: "Regular compliance status reports"
          - issue_alerts: "Immediate alerts for compliance issues"
          - improvement_tracking: "Style improvement progress tracking"

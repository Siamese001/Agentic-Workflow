# Evaluation Sets v1.0
# Comprehensive test sets for prompt evaluation and validation

evaluation_sets:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"

  # Test suite categories
  test_suites:
    # Resume engine evaluation sets
    resume_engine_tests:
      system_prompts_evaluation:
        test_cases:
          clarity_tests:
            - name: "executive_summary_clarity"
              description: "Test executive summary prompt clarity and specificity"
              input:
                user_profile: "Senior software engineer with 10 years experience"
                target_role: "Engineering Manager"
                industry: "Technology"
              expected_output:
                clarity_score: ">= 85"
                specificity_indicators: "career_level, industry_focus, leadership_abilities"

            - name: "skills_analysis_clarity"
              description: "Test skills analysis prompt for clear categorization"
              input:
                skills_list: ["Python", "JavaScript", "Team Leadership", "Project Management"]
                career_level: "Mid-career"
                target_industry: "Technology"
              expected_output:
                categorization_accuracy: ">= 90%"
                skill_relevance_score: ">= 85"

          effectiveness_tests:
            - name: "ats_optimization_effectiveness"
              description: "Test ATS optimization prompt effectiveness"
              input:
                resume_content: "Sample resume with technical skills"
                job_description: "Software engineering role requirements"
                ats_system: "Common ATS platforms"
              expected_output:
                keyword_match_rate: ">= 80%"
                parsing_success_rate: ">= 95%"

            - name: "career_transition_guidance"
              description: "Test career transition prompt guidance quality"
              input:
                current_industry: "Healthcare"
                target_industry: "Technology"
                experience_level: "5 years"
                transferable_skills: ["Project Management", "Data Analysis"]
              expected_output:
                transition_strategy_quality: ">= 85"
                skill_bridge_effectiveness: ">= 80"

      rewriting_evaluation:
        test_cases:
          achievement_enhancement:
            - name: "quantify_achievements"
              description: "Test achievement quantification rewriting"
              input:
                original_bullet: "Managed team to improve project delivery"
                context: "Software development team"
                metrics_available: "team_size, timeline, budget"
              expected_output:
                quantification_success: ">= 90%"
                impact_clarity_score: ">= 85"

            - name: "action_verb_optimization"
              description: "Test action verb enhancement in experience descriptions"
              input:
                passive_bullets: ["Was responsible for team management", "Participated in project planning"]
                industry: "Technology"
                career_level: "Senior"
              expected_output:
                active_voice_conversion: "100%"
                verb_strength_score: ">= 85"

      scoring_evaluation:
        test_cases:
          quality_assessment:
            - name: "resume_quality_scoring"
              description: "Test resume quality scoring accuracy"
              input:
                resume_samples: ["high_quality_resume", "average_resume", "poor_resume"]
                scoring_criteria: "comprehensive_quality_framework"
                industry_standards: "technology_industry"
              expected_output:
                scoring_accuracy: ">= 90%"
                consistency_score: ">= 85"

            - name: "ats_compatibility_scoring"
              description: "Test ATS compatibility scoring precision"
              input:
                resume_formats: ["optimized_format", "standard_format", "poor_format"]
                ats_systems: ["workday", "lever", "greenhouse"]
                scoring_methodology: "ats_best_practices"
              expected_output:
                compatibility_prediction: ">= 85%"
                format_recommendation_accuracy: ">= 90"

      feedback_evaluation:
        test_cases:
          improvement_guidance:
            - name: "specific_improvement_recommendations"
              description: "Test feedback specificity and actionability"
              input:
                resume_content: "Sample resume with various issues"
                target_role: "Data Scientist"
                experience_level: "Entry-level"
              expected_output:
                recommendation_specificity: ">= 85%"
                actionability_score: ">= 90"

            - name: "career_level_appropriate_feedback"
              description: "Test feedback appropriateness for different career levels"
              input:
                career_levels: ["entry_level", "mid_career", "executive"]
                resume_samples: "corresponding_level_resumes"
                feedback_framework: "career_specific_guidance"
              expected_output:
                level_appropriateness: ">= 90%"
                guidance_relevance: ">= 85"

    # Outreach engine evaluation sets
    outreach_engine_tests:
      system_prompts_evaluation:
        test_cases:
          personalization_tests:
            - name: "research_based_personalization"
              description: "Test research-based personalization quality"
              input:
                recipient_profile: "Senior marketing executive at tech company"
                research_data: "company_news, professional achievements, industry trends"
                outreach_goal: "Professional networking"
              expected_output:
                personalization_depth: ">= 85"
                relevance_score: ">= 90"

            - name: "value_proposition_clarity"
              description: "Test value proposition articulation"
              input:
                sender_expertise: "AI and machine learning"
                recipient_needs: "Digital transformation challenges"
                mutual_benefits: "Knowledge sharing, collaboration"
              expected_output:
                value_clarity_score: ">= 85"
                mutual_benefit_alignment: ">= 80"

      rewriting_evaluation:
        test_cases:
          message_optimization:
            - name: "engagement_optimization"
              description: "Test message engagement optimization"
              input:
                original_message: "Generic outreach template"
                target_audience: "Senior executives"
                channel: "Email"
              expected_output:
                engagement_prediction: ">= 80%"
                personalization_score: ">= 85"

            - name: "follow_up_enhancement"
              description: "Test follow-up message enhancement"
              input:
                previous_message: "Initial outreach email"
                response_status: "No response"
                value_addition: "Industry insights, relevant resources"
              expected_output:
                follow_up_effectiveness: ">= 85%"
                value_addition_quality: ">= 80"

      scoring_evaluation:
        test_cases:
          response_prediction:
            - name: "response_probability_scoring"
              description: "Test response rate prediction accuracy"
              input:
                message_variants: ["personalized", "generic", "value_focused"]
                recipient_segments: ["executives", "managers", "individual_contributors"]
                historical_data: "campaign_performance_metrics"
              expected_output:
                prediction_accuracy: ">= 80%"
                segment_differentiation: ">= 85"

            - name: "relationship_building_potential"
              description: "Test relationship building scoring"
              input:
                message_approaches: ["transactional", "relationship_focused", "value_first"]
                long_term_indicators: "mutual_benefits, trust_building, professional_growth"
                scoring_framework: "relationship_development_metrics"
              expected_output:
                relationship_potential_accuracy: ">= 85%"
                long_term_value_prediction: ">= 80"

      feedback_evaluation:
        test_cases:
          optimization_guidance:
            - name: "outreach_strategy_recommendations"
              description: "Test outreach strategy feedback quality"
              input:
                campaign_data: "message_performance, response_rates, engagement_metrics"
                goals: "network_expansion, relationship_building, opportunity_creation"
                constraints: "time_limit, resource_availability"
              expected_output:
                strategy_recommendation_quality: ">= 85%"
                implementation_feasibility: ">= 80"

            - name: "channel_optimization_feedback"
              description: "Test channel-specific optimization feedback"
              input:
                channels: ["email", "linkedin", "professional_events"]
                performance_data: "channel_specific_metrics"
                target_audience: "industry_professionals"
              expected_output:
                channel_recommendation_accuracy: ">= 90%"
                optimization_effectiveness: ">= 85"

  # Performance benchmarking sets
  performance_benchmarks:
    efficiency_tests:
      response_time_benchmarks:
        - name: "prompt_processing_time"
          description: "Benchmark prompt processing and response times"
          test_scenarios:
            - simple_prompts: "target_time: < 2 seconds"
            - complex_prompts: "target_time: < 10 seconds"
            - batch_processing: "target_time: < 30 seconds for 10 prompts"
          success_criteria:
            - average_response_time: "< 5 seconds"
            - percentile_95_response: "< 15 seconds"
            - consistency_score: "> 90%"

        - name: "resource_utilization"
          description: "Test computational resource efficiency"
          metrics:
            - memory_usage: "target: < 512MB per prompt"
            - cpu_utilization: "target: < 50% average"
            - api_call_efficiency: "target: < 3 calls per prompt"
          success_criteria:
            - resource_efficiency_score: "> 85%"
            - scalability_factor: "> 90%"

    quality_benchmarks:
      output_consistency:
        - name: "consistency_across_runs"
          description: "Test output consistency for identical inputs"
          test_method: "Run same prompt 10 times, compare outputs"
          success_criteria:
            - consistency_score: "> 95%"
            - variance_threshold: "< 5%"

        - name: "quality_degradation_resistance"
          description: "Test quality maintenance under various conditions"
          stress_conditions:
            - high_volume_processing: "100+ prompts sequentially"
            - complex_input_handling: "Maximum complexity inputs"
            - edge_case_processing: "Unusual scenarios"
          success_criteria:
            - quality_maintenance: "> 90%"
            - error_rate: "< 1%"

  # Edge case testing
  edge_cases:
    boundary_conditions:
      - name: "empty_input_handling"
        description: "Test prompt behavior with minimal or empty inputs"
        test_cases:
          - empty_user_profile: "Should provide guidance for data collection"
          - minimal_context: "Should work with limited information"
          - conflicting_data: "Should handle contradictory inputs gracefully"
        expected_behavior:
          - graceful_error_handling: "100%"
          - helpful_guidance_provision: "> 80%"

      - name: "maximum_capacity_handling"
        description: "Test behavior with maximum complexity inputs"
        test_cases:
          - extensive_experience: "20+ year career history"
          - multiple_industries: "Cross-industry professionals"
          - complex_goals: "Multiple, conflicting objectives"
        expected_behavior:
          - processing_success: "> 95%"
          - quality_maintenance: "> 85%"

    error_scenarios:
      - name: "invalid_input_handling"
        description: "Test response to malformed or invalid inputs"
        test_cases:
          - malformed_data: "Invalid YAML/JSON structures"
          - inappropriate_content: "Unprofessional or harmful content"
          - out_of_scope_requests: "Requests outside system capabilities"
        expected_behavior:
          - safe_error_handling: "100%"
          - user_guidance_provision: "> 90%"

      - name: "system_failure_recovery"
        description: "Test system resilience and recovery mechanisms"
        failure_scenarios:
          - network_interruptions: "Temporary connectivity loss"
          - resource_exhaustion: "Memory or CPU limits"
          - service_unavailability: "External service dependencies"
        expected_behavior:
          - graceful_degradation: "> 90%"
          - recovery_success: "> 95%"

  # Integration testing
  integration_tests:
    cross_engine_compatibility:
      - name: "resume_outreach_integration"
        description: "Test resume and outreach engine integration"
        test_scenarios:
          - resume_to_outreach_transition: "Use resume insights for outreach"
          - feedback_loop_integration: "Apply outreach feedback to resume"
          - consistent_branding: "Maintain brand consistency across engines"
        success_criteria:
          - integration_success: "> 90%"
          - data_consistency: "> 95%"

    external_system_integration:
      - name: "ats_system_integration"
        description: "Test integration with external ATS systems"
        test_systems:
          - workday_api: "Resume parsing and submission"
          - lever_api: "Application tracking"
          - greenhouse_api: "Candidate management"
        success_criteria:
          - api_success_rate: "> 95%"
          - data_accuracy: "> 90%"

      - name: "professional_network_integration"
        description: "Test integration with professional networks"
        test_platforms:
          - linkedin_api: "Profile data and messaging"
          - email_systems: "Outreach automation"
          - crm_systems: "Contact management"
        success_criteria:
          - integration_reliability: "> 90%"
          - data_synchronization: "> 95%"

  # User acceptance testing
  user_acceptance_tests:
    usability_tests:
      - name: "beginner_user_experience"
        description: "Test system usability for novice users"
        user_profiles:
          - career_changers: "Limited industry knowledge"
          - recent_graduates: "Minimal professional experience"
          - non_technical_users: "Limited technical proficiency"
        success_criteria:
          - task_completion_rate: "> 85%"
          - user_satisfaction: "> 80%"

      - name: "expert_user_efficiency"
        description: "Test system efficiency for experienced users"
        user_profiles:
          - career_coaches: "Professional resume writers"
          - recruiters: "High-volume users"
          - hr_professionals: "Industry experts"
        success_criteria:
          - efficiency_improvement: "> 50%"
          - advanced_feature_adoption: "> 70%"

    satisfaction_metrics:
      - name: "overall_user_satisfaction"
        description: "Measure overall user satisfaction with prompt outputs"
        measurement_methods:
          - net_promoter_score: "Target: > 70"
          - user_efficiency_rating: "Target: > 4.0/5.0"
          - output_quality_rating: "Target: > 4.2/5.0"
        success_criteria:
          - satisfaction_threshold: "> 80%"
          - recommendation_likelihood: "> 75%"

  # Continuous evaluation
  continuous_evaluation:
    monitoring_framework:
      - name: "real_time_performance_monitoring"
        description: "Continuous monitoring of prompt performance"
        metrics:
          - response_quality_scores: "Real-time quality assessment"
          - user_engagement_metrics: "Interaction and usage patterns"
          - error_rates: "System and content error tracking"
        alert_thresholds:
          - quality_degradation: "Alert if < 80% for 24 hours"
          - error_rate_increase: "Alert if > 5% for 1 hour"
          - user_satisfaction_drop: "Alert if < 70% for 48 hours"

      - name: "automated_regression_testing"
        description: "Automated testing to prevent quality regression"
        test_frequency: "Daily for critical prompts, weekly for all prompts"
        coverage_requirements:
          - critical_functionality: "100% coverage"
          - edge_cases: "> 80% coverage"
          - integration_points: "> 90% coverage"
        failure_handling:
          - automatic_rollback: "For critical failures"
          - developer_notification: "Immediate alert for failures"
          - quality_gate_enforcement: "Block deployment if < 90% pass rate"

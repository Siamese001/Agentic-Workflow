normalization_rules:
  case_handling: "title_case"
  abbreviation_expansion: true
  seniority_detection: true
  category_classification: true
  
seniority_keywords:
  junior: ["junior", "associate", "entry level", "graduate", "i", "1"]
  mid: ["engineer", "developer", "analyst", "specialist", "ii", "2", "3"]
  senior: ["senior", "sr", "lead", "principal", "iii", "3", "4"]
  principal: ["principal", "distinguished", "chief", "fellow", "5"]
  manager: ["manager", "head", "lead manager"]
  director: ["director", "vp", "vice president"]

category_keywords:
  software_engineering: ["software", "developer", "engineer", "sde", "programming", "coding"]
  data_science: ["data", "science", "analytics", "machine learning", "ml", "ai"]
  infrastructure: ["devops", "infrastructure", "cloud", "sre", "platform", "ops"]
  management: ["manager", "director", "vp", "head", "leadership"]
  mobile: ["mobile", "ios", "android", "react native", "flutter"]
  quality_assurance: ["qa", "quality", "test", "testing", "automation"]
  product: ["product", "pm", "owner", "strategy"]
  design: ["design", "ux", "ui", "user experience", "interface"]

technology_specific:
  languages:
    python: ["Python Developer", "Python Engineer", "Django Developer"]
    java: ["Java Developer", "Java Engineer", "Spring Developer"]
    javascript: ["JavaScript Developer", "Node.js Developer", "React Developer"]
    go: ["Go Developer", "Golang Engineer", "Go Engineer"]
    ruby: ["Ruby Developer", "Rails Developer", "Ruby on Rails"]
  
  platforms:
    aws: ["AWS Engineer", "Cloud Engineer", "DevOps Engineer"]
    azure: ["Azure Engineer", "Microsoft Cloud Engineer"]
    gcp: ["GCP Engineer", "Google Cloud Engineer"]
    kubernetes: ["Kubernetes Engineer", "K8s Engineer", "Container Engineer"]

industry_specific:
  fintech:
    - "FinTech Software Engineer"
    - "Financial Services Developer"
    - "Banking Technology Engineer"
  
  healthcare:
    - "Healthcare IT Engineer"
    - "Medical Software Developer"
    - "Health Technology Engineer"
  
  ecommerce:
    - "E-commerce Developer"
    - "Retail Software Engineer"
    - "Platform Engineer"

validation_patterns:
  title_patterns:
    - "(Senior|Lead|Principal|Staff) (Software|Data|DevOps) Engineer"
    - "(Junior|Associate|Entry Level) (Developer|Engineer|Analyst)"
    - "(Director|VP|Head) of (Engineering|Technology)"
    - "(Technical|Team) Lead"
    - "(Frontend|Backend|Full Stack) (Developer|Engineer)"

normalization_algorithm:
  steps:
    1: "Standardize case and remove special characters"
    2: "Expand common abbreviations"
    3: "Detect seniority level"
    4: "Classify functional category"
    5: "Map to normalized title"
    6: "Assign seniority level"

usage_guidelines:
  - "Use normalized titles for consistent job matching and analysis"
  - "Maintain original titles for display and search purposes"
  - "Consider company-specific title conventions"
  - "Handle international title variations appropriately"
  - "Update mappings regularly as new roles emerge"

# Academic Degree Normalization v1.0
# Standard mapping of academic degrees to normalized categories for education analysis

degree_normalization:
  version: "1.0"
  last_updated: "2024-01-01"
  
bachelor_degrees:
  standard:
    - original: "Bachelor of Science"
      normalized: "BS"
      category: "bachelor"
      field: "science"
      abbreviations: ["B.S.", "BSc", "Sci.B."]
    
    - original: "Bachelor of Arts"
      normalized: "BA"
      category: "bachelor"
      field: "arts"
      abbreviations: ["B.A.", "BA"]
    
    - original: "Bachelor of Engineering"
      normalized: "BEng"
      category: "bachelor"
      field: "engineering"
      abbreviations: ["B.Eng.", "BE", "BEng"]
    
    - original: "Bachelor of Computer Science"
      normalized: "BCS"
      category: "bachelor"
      field: "computer_science"
      abbreviations: ["B.CS.", "BCS", "BCompSc"]
    
    - original: "Bachelor of Technology"
      normalized: "BTech"
      category: "bachelor"
      field: "technology"
      abbreviations: ["B.Tech.", "BTech", "B.Tech"]
  
  variations:
    - original: "Bachelor of Science in Computer Science"
      normalized: "BS"
      category: "bachelor"
      field: "computer_science"
      parent: "Bachelor of Science"
    
    - original: "Bachelor of Science in Information Technology"
      normalized: "BS"
      category: "bachelor"
      field: "information_technology"
      parent: "Bachelor of Science"
    
    - original: "Bachelor of Arts in Economics"
      normalized: "BA"
      category: "bachelor"
      field: "economics"
      parent: "Bachelor of Arts"
    
    - original: "Bachelor of Engineering in Software Engineering"
      normalized: "BEng"
      category: "bachelor"
      field: "software_engineering"
      parent: "Bachelor of Engineering"


international_degrees:
  india:
    - original: "Bachelor of Technology"
      normalized: "BTech"
      category: "bachelor"
      country: "IN"
    
    - original: "Master of Technology"
      normalized: "MTech"
      category: "master"
      country: "IN"
    
    - original: "Bachelor of Engineering"
      normalized: "BEng"
      category: "bachelor"
      country: "IN"
  
  uk:
    - original: "Master of Science"
      normalized: "MS"
      category: "master"
      country: "GB"
    
    - original: "Bachelor of Science"
      normalized: "BS"
      category: "bachelor"
      country: "GB"
  
  europe:
    - original: "Diploma"
      normalized: "Diploma"
      category: "diploma"
      country: "EU"
    
    - original: "Master"
      normalized: "MS"
      category: "master"
      country: "EU"

degree_hierarchy:
  levels:
    doctorate:
      level: 8
      above: "master"
      examples: ["PhD", "DSc", "DEng"]
    
    master:
      level: 7
      above: "bachelor"
      below: "doctorate"
      examples: ["MS", "MA", "MBA", "MEng", "MCS", "MTech"]
    
    bachelor:
      level: 6
      above: "associate"
      below: "master"
      examples: ["BS", "BA", "BEng", "BCS", "BTech"]
    
    associate:
      level: 5
      above: "diploma"
      below: "bachelor"
      examples: ["Associate of Science", "Associate of Arts"]
    
    diploma:
      level: 4
      above: "certificate"
      below: "associate"
      examples: ["Diploma", "Advanced Diploma"]

special_degrees:
  professional:
    - original: "MD"
      normalized: "MD"
      category: "professional_doctorate"
      field: "medicine"
    
    - original: "JD"
      normalized: "JD"
      category: "professional_doctorate"
      field: "law"
    
    - original: "PharmD"
      normalized: "PharmD"
      category: "professional_doctorate"
      field: "pharmacy"
  
  honorary:
    - original: "Honorary Doctorate"
      normalized: "Honorary PhD"
      category: "honorary"
      field: "various"

normalization_rules:
  case_sensitivity: false
  abbreviation_handling: true
  field_extraction: true
  country_specific: true
  
validation_patterns:
  degree_patterns:
    - "Bachelor of [A-Za-z ]+"
    - "Master of [A-Za-z ]+"
    - "Doctor of [A-Za-z ]+"
    - "PhD in [A-Za-z ]+"
    - "[A-Z]\\.[A-Z]\\."
    - "B[A-Z][a-z]*"
    - "M[A-Z][a-z]*"
    - "PhD"

field_keywords:
  computer: ["computer", "software", "programming", "coding", "development"]
  data: ["data", "analytics", "statistics", "machine learning", "ai"]
  engineering: ["engineering", "systems", "infrastructure", "architecture"]
  business: ["business", "management", "finance", "marketing", "economics"]
  science: ["science", "physics", "chemistry", "biology", "mathematics"]

usage_guidelines:
  - "Use normalized degree names for consistent storage and comparison"
  - "Maintain original degree text for display purposes"
  - "Extract field of study for skill matching and job alignment"
  - "Consider country-specific degree naming conventions"
  - "Handle abbreviations and full forms interchangeably"

# Resume Scoring Weights v1.0
# Weight configurations for resume quality assessment and ATS optimization

scoring_weights:
  version: "1.0"
  last_updated: "2024-01-01"
  
overall_scoring:
  total_weight: 1.0
  categories:
    technical_relevance:
      weight: 0.35
      description: "Alignment of skills and experience with target role requirements"
      subcategories:
        skill_match: 0.15
        experience_relevance: 0.12
        technical_depth: 0.08
    
    achievement_clarity:
      weight: 0.25
      description: "Quality and impact of stated achievements"
      subcategories:
        quantified_results: 0.10
        action_verbs: 0.08
        business_impact: 0.07
    
    keyword_optimization:
      weight: 0.20
      description: "ATS keyword density and optimization"
      subcategories:
        keyword_density: 0.08
        industry_terms: 0.07
        role_specific_terms: 0.05
    
    format_quality:
      weight: 0.15
      description: "Resume structure, readability, and professional presentation"
      subcategories:
        structure_compliance: 0.06
        readability_score: 0.05
        visual_clarity: 0.04
    
    industry_alignment:
      weight: 0.05
      description: "Alignment with industry standards and expectations"
      subcategories:
        industry_terminology: 0.03
        market_relevance: 0.02

quality_thresholds:
  excellent:
    minimum_score: 0.90
    description: "Top-tier resume, highly optimized for ATS and human readers"
  
  good:
    minimum_score: 0.75
    description: "Solid resume with good optimization and presentation"
  
  satisfactory:
    minimum_score: 0.60
    description: "Acceptable resume with room for improvement"
  
  needs_improvement:
    minimum_score: 0.40
    description: "Resume requires significant optimization"

role_specific_weights:
  software_engineering:
    technical_relevance: 0.40
    achievement_clarity: 0.25
    keyword_optimization: 0.20
    format_quality: 0.10
    industry_alignment: 0.05
  
  data_science:
    technical_relevance: 0.35
    achievement_clarity: 0.30
    keyword_optimization: 0.20
    format_quality: 0.10
    industry_alignment: 0.05

scoring_algorithm:
  steps:
    1: "Analyze resume content and extract key elements"
    2: "Calculate category scores using weighted criteria"
    3: "Apply role-specific weight adjustments"
    4: "Add bonuses and subtract penalties"
    5: "Normalize final score to 0-1 range"
    6: "Assign quality tier based on thresholds"

# OTEL collector stack for RTC-REQ-020/022 certification receipt.
#
# Runs an OpenTelemetry Collector with:
#   - OTLP gRPC receiver on :4317
#   - OTLP HTTP receiver on :4318
#   - File exporter → /tmp/otel-export/spans.json (mounted to ./artifacts/otel_collector_export/)
#   - Prometheus metrics exporter on :8889 (for metric delta proof)
#
# Usage:
#   docker compose -f docker-compose.otel.yml up -d
#   docker compose -f docker-compose.local-stack.yml up -d   # OTel + Qwen (same project)
#   python tools/cert/run_otel_collector_probe.py
#   docker compose -f docker-compose.otel.yml down
#
# Artifacts produced by the probe:
#   artifacts/certification/otel_collector_receipt.json
#   artifacts/certification/otel_metric_delta_report.json

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: agentic_otel_collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel/collector-config.yaml:/etc/otel/config.yaml:ro
      - ./artifacts/otel_collector_export:/tmp/otel-export
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics scrape
      - "13133:13133" # Health check
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      # The collector image is distroless and has no shell/curl/wget.
      # Validate the mounted config here; host-side probes still verify :13133.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --ignore=archives --ignore=archives/legacy_lic --ignore=archives/legacy_resume_gen --ignore=tests/integration/api/test_api_integration.py --ignore=tests/integration/api/test_provider_routing.py --ignore=tests/perf/throughput/test_cache_throughput.py --ignore=tests/unit/agentic_core/test_fallback_paths.py --ignore=tests/unit/apps_rg/test_resume_logic_mock.py --ignore=tests/unit/apps_shared/test_rag_logic.py --ignore=tests/unit/prompt_governance/test_constitutional_logic.py --ignore=tests/unit/runtime/test_cache.py --ignore=tests/unit/runtime/test_cache_regression.py"
testpaths = [
    "tests"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "golden: marks tests as golden state tests",
    "perf: marks tests as performance tests"
]
python_files = [
    "test_*.py",
    "*_test.py"
]
python_classes = [
    "Test*"
]
python_functions = [
    "test_*"
]

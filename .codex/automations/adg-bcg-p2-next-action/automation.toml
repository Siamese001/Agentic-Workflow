kind = "cron"
name = "ADG BCG P2 Next Action"
prompt = '''
Run the Agentic-Workflow downstream BCG/ADG P2 next-action automation.

Mission:
Consume the fresh BCG next-step evidence produced by the separate full ADG audit and burn down a significant, bounded portion of the current P2 hygiene scope per run. Do not modify, reschedule, or depend on changing the full ADG audit automation.

Generate-full-ADG dependency gate:
- This automation is downstream of the generate_full_adg lane: weekly-adg-audit-and-burndown.
- Treat the [handoff] metadata in this TOML as the machine-checkable dependency contract. If prompt prose and [handoff] metadata conflict, stop and report the contract drift.
- Do not begin source edits until the latest full ADG audit has completed and released artifacts/adg/handoffs/adg_repair_handoff_latest.json for this run window.
- The receipt must be produced by the exact command python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0, and the receipt must point to digest-bound timestamped repair_handoff artifacts.
- Run this exact validator before editing:
  python tools/adg/consume_adg_repair_handoff.py --handoff-pointer C:\\Git\\Agentic-Workflow-FRESH\\artifacts\\adg\\handoffs\\adg_repair_handoff_latest.json --json
- Accept only validator exit code 0 with artifact_status=certified or artifact_status=repair_ready.
- The validator must resolve the latest pointer to an immutable timestamped handoff, then verify the receipt SHA, run ID, and artifact digests before the lane may edit.
- Require the receipt/artifact timestamps to be after the latest scheduled generate_full_adg audit window and before this downstream lane starts editing.
- If the generate_full_adg audit is still running, stale, missing, timestamp-inconsistent, digest-invalid, or not direct, wait/poll only within this lane's deadline policy; otherwise stop without editing and report RCA.
- Never consume overwritten latest files as source of truth when timestamped artifacts exist.
- Never regenerate full ADG, rewrite the receipt, or infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.

Severity-lane order:
- This is the fourth downstream severity lane after generate_full_adg.
- It must run only after the P0 blocker lane has proven P0=0 and the P1 ratchet lane has met its target or reported no remaining safe blocker for the same released ADG receipt.
- It must run before P3 promotion/hygiene and any future P4 automation when P2 has a safe actionable blocker.
- If P0 is not clean, stop and defer to the P0 blocker automation. If the P1 precedence gate is not satisfied, stop and defer to the P1 ratchet automation.

Authority:
Follow AGENTS.md and docs/codex-primary-execution.md. Use bounded PowerShell-compatible commands. Use a clean main-derived worktree or branch before edits. If validated changes are produced, complete the end-of-run merge/publication step in this automation instead of handing off to a separate publisher.

Startup gates:
- Verify fresh ADG artifacts exist from the latest full ADG run: artifacts/adg/adg_bcg_executive_summary_latest.md or .json, artifacts/adg/adg_cleanup_queue_and_p2_blocker_trace_latest.md or .json, artifacts/adg/adg_burndown_report.md, and the newest artifacts/adg/adg_action_queue_*.json.
- Verify the artifacts were produced after the most recent expected full-ADG audit window. If stale, missing, or internally inconsistent, stop without editing and report an RCA.
- Verify P0=0 and verify the P1 ratchet lane has met its target or reported no remaining safe blocker in the latest burndown/gate results. If P0 is not clean, stop and defer to the P0 blocker automation. If P1 precedence is not satisfied, stop and defer to the P1 ratchet automation.
- Verify the working surface is clean. If not clean or ambiguous, stop without editing and report the blocker.

Automation-owned planning and approval:
- This TOML overrides any default T2/T3 human approval expectation for this overnight automation.
- The automation must still create a concrete P2 execution and burndown plan before edits, but it must do so inside the run without waiting for user interaction.
- Treat the generated P2 plan as auto-approved once it is grounded in the exact released ADG receipt, action queue, burndown table/report, P2 ratchet trace, and gate artifacts consumed by the run.
- Do not stop only to request plan approval when the selected P2 item stays within this TOML's standing approval scope.
- If the generated plan reveals work outside standing approval, stop at that point and report the specific blocker instead of editing.

Required P2 burndown plan:
- Generate the P2 burndown plan from the same released ADG generation consumed by the validator, not from stale latest-file inference.
- The plan must identify the receipt, snapshot timestamp, action queue path, burndown table/report paths, P2 ratchet source, current P2 MEDIUM hygiene count, ceiling, delta, target_rows, top file hotspots, evidence buckets, selected items/waves, validation commands, rollback/skip criteria, and stop conditions.
- Use the current ADG ordering: P0/P1 blockers first, then P2 MEDIUM hygiene hotspots, then star-import or dependency-hiding cleanup, then rebaseline only after intentional evidence-backed cleanup and explicit approval.
- For the 06292026_0701-style full ADG output, prefer the live runtime/core hotspots named in artifacts/adg/adg_cleanup_queue_and_p2_blocker_trace_latest.* and artifacts/adg/adg_burndown_table_*.json; do not treat archived dead-import bundles as safe P2 edits.
- Compute target_rows = max(5, ceil(current_medium_hygiene_count * 0.25)) before edits. For the 06292026_0701 snapshot, current_medium_hygiene_count=27, so target_rows=7.
- Generate enough bounded waves to plausibly clear target_rows, prioritizing top live runtime/core hotspots. For the 06292026_0701-style evidence, the first plan should normally include enough top hotspots to reach at least 7 rows, such as the 6-row and 4-row live runtime hotspots when they remain safe.
- Do not stop after a single successful wave while cleared_rows < target_rows and additional safe standing-scope P2 candidates remain.
- After every wave, run targeted validation, recompute or re-read exact P2 evidence when practical, update cleared_rows/remaining_rows, and continue until target_rows is met, no safe candidates remain, or a stop condition applies.

Priority order:
1. Use artifacts/adg/adg_cleanup_queue_and_p2_blocker_trace_latest.* as the primary source for P2 MEDIUM hygiene hotspots.
2. Select the highest-ranked live runtime/core P2 hotspot that is directly supported by the BCG/P2 trace and can be fixed mechanically.
3. Prefer reducing real P2 debt over rebaselining. Do not rebaseline P2 ceilings unless the run only reports an explicit blocker and the user later approves it.
4. If the trace names a P2 star import or explicit dependency-hiding issue, it is eligible after higher-count runtime hotspots.
5. If no safe P2 edit exists, report the top blocked P2 item, why it is unsafe to automate, and the exact next human decision needed.

Edit limits:
- Make multiple coherent P2 hotspot fixes per run when needed to meet target_rows, but keep each wave small, mechanical, evidence-backed, and independently validatable.
- Standing authorization is limited to small, mechanical, evidence-backed hygiene edits: narrowing exception handling, replacing a star import with explicit imports, deleting an obviously unused import, or equivalent directly-supported cleanup.
- Stop before editing if the item requires architecture judgment, product behavior choice, public contract changes, broad cross-layer refactor, migration receipt, generated artifact churn, unrelated dirty changes, merge conflict, or repeated test failure.
- Do not chase P3 here except to mention if P3 promotion candidates exist; P3 has a separate promotion lane.

Validation:
- Run targeted tests or static checks appropriate to touched files.
- Run a lightweight ADG/burndown validation when practical; otherwise clearly state why full ADG validation was deferred.
- Re-read the latest P2 trace or burndown after validation when regenerated.

End-of-run merge/publication:
- If no source changes were made, do not merge; close out with the no-change RCA and remaining target status.
- If source changes were made and validation passes, commit the P2 changes on the automation branch, push the branch, open or update the PR to main when needed, and merge to main before final closeout.
- Use a non-squash merge method. Do not squash.
- Any direct PR completion command (`gh pr merge`) or direct push to main must chain the local closeout checks in the same shell command.
- After merging, push origin main and run:
  python scripts/governance/codex_main_closeout.py --apply --fetch --json
  python scripts/governance/codex_main_closeout.py --check --fetch --json
- If merge or push is blocked by conflicts, failing validation, dirty unrelated worktrees, missing credentials, or remote rejection, stop and report MERGE_BLOCKED with exact commands attempted, blocker evidence, and next action.

Closeout:
Summarize the selected BCG/P2 source artifact, generated P2 burndown plan, target_rows, planned_rows, attempted_rows, cleared_rows, remaining_rows, target_status, changed files, P2 hotspot count before/after if measurable, validation commands and results, branch/worktree status, merge/publication result, final main/origin state, remaining P2 count or blocked next item, and whether any PR/publication follow-up remains. If cleared_rows < target_rows, set target_status=missed and include an RCA block with blocker_type, blocker_evidence, why additional safe candidates were unavailable, and the next unblock action.
'''

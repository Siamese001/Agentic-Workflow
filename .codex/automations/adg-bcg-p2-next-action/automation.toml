version = 1
id = "adg-bcg-p2-next-action"
kind = "cron"
name = "ADG BCG P2 Next Action"
prompt = '''
Run the Agentic-Workflow downstream BCG/ADG P2 next-action automation.

Mission:
Consume the fresh BCG next-step evidence produced by the separate full ADG audit and burn down one bounded P2 hygiene item per run. Do not modify, reschedule, or depend on changing the full ADG audit automation.

Generate-full-ADG dependency gate:
- This automation is downstream of the generate_full_adg lane: weekly-adg-audit-and-burndown.
- Do not begin source edits until the latest full ADG audit has completed and released docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json for this run window.
- The receipt must be produced by the exact command python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0, and the receipt must point to digest-bound timestamped repair_handoff artifacts.
- Run this exact validator before editing:
  python tools/adg/consume_adg_repair_handoff.py --receipt docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json --json
- Accept only validator exit code 0 with artifact_status=certified or artifact_status=repair_ready.
- Require the receipt/artifact timestamps to be after the latest scheduled generate_full_adg audit window and before this downstream lane starts editing.
- If the generate_full_adg audit is still running, stale, missing, timestamp-inconsistent, digest-invalid, or not direct, wait/poll only within this lane's deadline policy; otherwise stop without editing and report RCA.
- Never consume overwritten latest files as source of truth when timestamped artifacts exist.
- Never regenerate full ADG, rewrite the receipt, or infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.

Severity-lane order:
- This is the second downstream severity lane after generate_full_adg.
- It must run only after the P0/P1 lane has proven P0/P1 clean for the same released ADG receipt or has no remaining blocking FIX/ratchet regression.
- It must run before P3 promotion/hygiene and any future P4 automation when P2 has a safe actionable blocker.
- If P0/P1 is not clean for the same audit generation, stop and defer to the P0/P1 automation.

Authority:
Follow AGENTS.md and docs/codex-primary-execution.md. Use bounded PowerShell-compatible commands. Use a clean main-derived worktree or branch before edits. Do not publish or merge; publication is handled by a separate automation.

Startup gates:
- Verify fresh ADG artifacts exist from the latest full ADG run: artifacts/adg/adg_bcg_executive_summary_latest.md or .json, artifacts/adg/adg_cleanup_queue_and_p2_blocker_trace_latest.md or .json, artifacts/adg/adg_burndown_report.md, and the newest artifacts/adg/adg_action_queue_*.json.
- Verify the artifacts were produced after the most recent expected full-ADG audit window. If stale, missing, or internally inconsistent, stop without editing and report an RCA.
- Verify P0/P1 have no FIX gates or ratchet regressions in the latest burndown/gate results. If P0/P1 are not clean, stop and defer to the P0/P1 automation.
- Verify the working surface is clean. If not clean or ambiguous, stop without editing and report the blocker.

Priority order:
1. Use artifacts/adg/adg_cleanup_queue_and_p2_blocker_trace_latest.* as the primary source for P2 MEDIUM hygiene hotspots.
2. Select the highest-ranked live runtime/core P2 hotspot that is directly supported by the BCG/P2 trace and can be fixed mechanically.
3. Prefer reducing real P2 debt over rebaselining. Do not rebaseline P2 ceilings unless the run only reports an explicit blocker and the user later approves it.
4. If the trace names a P2 star import or explicit dependency-hiding issue, it is eligible after higher-count runtime hotspots.
5. If no safe P2 edit exists, report the top blocked P2 item, why it is unsafe to automate, and the exact next human decision needed.

Edit limits:
- Make at most one coherent P2 hotspot fix per run.
- Standing authorization is limited to small, mechanical, evidence-backed hygiene edits: narrowing exception handling, replacing a star import with explicit imports, deleting an obviously unused import, or equivalent directly-supported cleanup.
- Stop before editing if the item requires architecture judgment, product behavior choice, public contract changes, broad cross-layer refactor, migration receipt, generated artifact churn, unrelated dirty changes, merge conflict, or repeated test failure.
- Do not chase P3 here except to mention if P3 promotion candidates exist; P3 has a separate promotion lane.

Validation:
- Run targeted tests or static checks appropriate to touched files.
- Run a lightweight ADG/burndown validation when practical; otherwise clearly state why full ADG validation was deferred.
- Re-read the latest P2 trace or burndown after validation when regenerated.

Closeout:
Summarize the selected BCG/P2 source artifact, changed files, P2 hotspot count before/after if measurable, validation commands and results, branch/worktree status, remaining P2 count or blocked next item, and whether a PR/publication step is needed. Include an RCA block for any stop/failure.
'''

version = 1
id = "weekly-svp-readme-documentation-refresh"
kind = "cron"
name = "SVP README Documentation Audit"
allow_direct_main_push = false
prompt = '''
Run the read-only, evidence-backed SVP documentation audit for Agentic-Workflow.

Mission:
Evaluate the active GitHub reviewer packet for CTO, SVP Engineering, senior maintainer, hiring, and contributor audiences. Produce replayable X1D, X2, X3, and run receipts. This weekly automation is audit-only: it must not edit files, create a publication commit, push a branch, open or merge a PR, or emit ALLOW_TO_PR.

Authority:
- Follow AGENTS.md and docs/codex-primary-execution.md.
- Keep .codex as the only repo governance tree.
- Read memory/MEMORY.md and memory/codex/memory_summary.md for non-trivial repo-local context.
- Treat apps_shared/integrations/app_registry.py as the app-classification source of truth.
- Treat .codex/automations/svp-readme-documentation-refresh/reviewer_packet.v1.json as the reviewer-packet manifest.
- Publication authority remains exclusively with on-demand-pr-main-publisher.

Startup:
1. Run git fetch origin --prune when available.
2. Run git status --short --branch.
3. Run python scripts/governance/codex_readiness.py --docs-only --json.
4. Run python scripts/governance/svp_docs_review.py --mode audit --phase pre --base-ref origin/main --json.
5. Do not modify the repository even when gaps are found.

Required audit output:
- README inventory and classification.
- Material gap table with file, line, claim, evidence, severity, and proposed correction.
- Current registry-derived governed/formal-exception status.
- Proof-command and link resolution findings.
- X1D, X2, X3, and run receipt paths.
- X3 may be only NOOP, PLAN_ONLY, BLOCK, or ESCALATE_HUMAN.

X1D LLM judge contract:
- Emit schema_version svp_docs_x1d/v1.
- Judge first_page_thesis_clarity, svp_cto_hiring_signal, differentiation, evidence_credibility, governance_maturity, onboarding_clarity, reader_path_integrity, executive_signal_without_hype, claim_to_proof_traceability, and maintenance_freshness.
- Every blocking X1D finding must include file, line, claim, finding_type, severity, evidence, and required_fix.
- X1D transport failure or abstention is WARN, never ALLOW.

X2 deterministic contract:
- Emit schema_version svp_docs_x2/v1.
- Run x2_toml_parse, x2_app_launcher_ssot, x2_stale_active_terms, x2_relative_links, x2_unsupported_claims_regex, x2_docs_only_scope, x2_high_signal_packet_present, x2_required_sections, x2_codex_primary, x2_enforcement_home, x2_diff_check, x2_publication_isolation, x2_architecture_status_consistency, x2_claim_evidence_map, x2_proof_command_resolves, x2_receipt_schema_validate, x2_approval_mode, and x2_no_absolute_unproven_language.
- x2_architecture_status_consistency compares active reviewer docs with APP_REGISTRY and executable proof output.
- x2_claim_evidence_map requires major claims to map to a file, command, receipt, or explicit caveat.
- x2_proof_command_resolves verifies referenced Python proof targets exist.
- x2_receipt_schema_validate validates the checked-in X1D, X2, X3, and run schemas.
- x2_approval_mode must confirm this weekly run has no edit or publication authority.
- x2_no_absolute_unproven_language blocks new unanchored absolute claims.

X3 contract:
- Emit schema_version svp_docs_x3/v1.
- Allowed weekly decisions: NOOP, PLAN_ONLY, BLOCK, ESCALATE_HUMAN.
- PLAN_ONLY identifies a coherent remediation plan for later explicit approval.
- BLOCK records deterministic failures or high-severity unsupported/stale claims.
- ESCALATE_HUMAN is used for strategy, ownership, support, compliance, licensing, or roadmap judgment.
- The weekly job must never emit ALLOW_TO_PR.

Final SVP-grade operating rule:
X1D decides whether the docs read like serious SVP/CTO engineering material. X2 decides whether the docs are mechanically true, scoped, current, and safe. X3 decides whether this weekly Codex run may publish, must stop at plan, or must block. Eval never waives a runtime or publication gate.

Stop conditions:
- Never repair findings in this cron.
- Never infer approval from schedule, branch name, worktree, or prior discussion.
- Never stage every dirty file or include unrelated worktree state.
- Never push or merge directly to main.
- Return RCA fields symptom, root_cause, evidence, fix_or_next, and recurrence_guard for failures.
'''
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=0;BYMINUTE=0;BYDAY=SA"
model = "gpt-5.5"
reasoning_effort = "high"
execution_environment = "local"
cwds = ["C:\\Git\\Agentic-Workflow-FRESH", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\on-demand-pr-main-publisher-2"]
created_at = 1782255108967
updated_at = 1783900000000

[svp_docs]
mode = "audit_only"
require_approval_receipt = false
allow_edits = false
allow_publication = false
publication_handoff = "on-demand-pr-main-publisher"
reviewer_packet = ".codex/automations/svp-readme-documentation-refresh/reviewer_packet.v1.json"
x2_entrypoint = "python scripts/governance/svp_docs_review.py --mode audit --phase pre --base-ref origin/main --json"

version = 1
id = "on-demand-pr-main-publisher"
kind = "cron"
name = "On-Demand PR Main Publisher"
publication_mode = "pull_request"
allow_direct_main_push = false
require_github_ci_green = true
allow_bypass_merge = false
prompt = '''
Run the Agentic-Workflow on-demand publication automation for:

C:\Git\Agentic-Workflow-FRESH

Mission:
Publish requested Codex work to GitHub main with zero data loss, verified remote main sync, explicit branch-tip ancestry tracking, safe C:\Git worktree handling, and a durable GitHub Pull Request review artifact. Support both single-branch PR publication and local-branch recovery requests, but every publication performed by this automation must go through an actual GitHub PR. Do not infer from PR state alone; use git topology and commit ancestry evidence.

Authority:
Follow AGENTS.md and docs/codex-primary-execution.md. Use bounded PowerShell-compatible commands. Show concrete command output in the final report.

Definitions:
- local main = local branch named main.
- origin/main = local remote-tracking ref after git fetch.
- GitHub main = live origin refs/heads/main from git ls-remote.
- execution surface = the worktree where publication edits, verification, and PR branch updates are performed.
- publication branch = explicit user branch, current checked-out non-main branch, or the branch created in a clean detached publication worktree.
- publication PR = a GitHub Pull Request from the publication branch to main.
- done branch = a branch whose exact tip is ancestor-contained in origin/main.

Hard stops:
- Never reset local main.
- Never force-push main.
- Never squash.
- Never publish from main/master, conflicted state, ambiguous branch, or a dirty execution surface.
- Never push directly to refs/heads/main or run git push origin main in this automation, even with explicit local-main publication wording; use a different direct-main automation for that.
- Never claim publication success unless a GitHub PR existed for the selected work and was merged through gh pr merge --merge or an equivalent GitHub PR merge API.
- Never merge/rebase a prior PR/source branch wholesale during recovery unless the user explicitly asked for whole-branch integration.
- Never delete dirty worktrees or unproven branches.
- Never delete or call a branch done based only on git cherry patch-equivalence.
- Never claim local main sync if a protected main/master/release worktree is dirty or cannot be fast-forwarded safely.
- Never claim success unless GitHub main contains the selected publication work, every completed source branch is ancestor-contained in origin/main, HEAD equals origin/main, and the local repo has exactly one clean main worktree at C:\Git\Agentic-Workflow-FRESH.

0. Git publication audit first
Run before PR, branch, cherry-pick, merge, or cleanup work:
- git fetch origin --prune
- python scripts/governance/codex_publication_audit.py --json --branch-limit 100 --require-pr-flow
- python scripts/governance/codex_readiness.py --git-publication --require-pr-flow --json

Rules:
- If current_worktree_dirty, current_worktree_conflicted, fetch_failed, origin_main_missing, github_main_unavailable, origin_main_differs_from_github_main, or pr_flow_contract_violation appears as a blocker, do not publish from that surface.
- If the audit recommends clean_detached_origin_main_worktree, create or reuse a clean worktree under C:\Git\Agentic-Workflow-FRESH-worktrees from current origin/main and continue there. Rerun the audit from that worktree.
- Dirty protected worktrees are preservation warnings during intake only. They must be cleaned, committed, safely fast-forwarded, removed, or reported as a blocker before final success.
- The audit's unmerged_branches and git cherry -v evidence are the branch-recovery inventory, but not closeout proof.
- If any required pass criterion or proof-table row is FAIL, the automation is not done; keep working the remediation loop until every required gate passes, or stop only with RCA for an external blocker that cannot be cleared in-run.

State checkpoint:
Print this table at start, after every fetch, before PR creation/update, after merge/rebase/cherry-pick recovery, after PR merge, and at closeout:

checkpoint:
  execution_surface: <path>
  publication_branch: <name-or-detached> <sha>
  publication_pr: <url-number-state-or-missing>
  local_main: <sha-or-unavailable>
  origin_main: <sha>
  github_main: <sha>
  relationships:
    publication_vs_origin_main: <contained/ahead/diverged>
    local_main_vs_origin_main: <equal/behind/ahead/diverged/dirty-protected>
    origin_main_vs_github_main: <equal/different>
  branch_closeout:
    no_merged_gap: <git branch --no-merged origin/main output or empty>
    retained_branches: <explicitly retained only>

1. Main and worktree topology
Run:
- git status --short --branch
- git worktree list --porcelain
- git rev-parse --short origin/main
- git ls-remote origin refs/heads/main
- git branch --merged origin/main
- git branch --no-merged origin/main

Rules:
- origin/main must equal GitHub main after fetch.
- If local main is clean and behind origin/main, fast-forward it safely only when it is not checked out dirty elsewhere.
- If local main is ahead, diverged, dirty, or checked out in another dirty worktree, preserve it and use a clean detached origin/main worktree for publication.

2. Publication branch intake
- Use an explicit user branch when provided; otherwise use the current checked-out non-main branch only if clean and unambiguous.
- For local-branch recovery or "merge all" requests, inspect every branch from git branch --no-merged origin/main.
- Inspect dirty files and stage only coherent publication-scope changes.
- Commit staged work before publication.
- Report committed files and excluded files.

3. Prior PR/source recovery
Inventory:
- gh pr list --state open --limit 50
- gh pr list --state closed --limit 100
- git branch --no-merged origin/main
- git cherry -v origin/main <branch> for every candidate branch
- git log --oneline origin/main..<branch>
- git diff --stat origin/main..<branch>

Selection rules:
- SELECT only current, narrow, non-duplicative, verifiable work.
- Treat '-' git cherry rows as patch-equivalent evidence only. They prove content may already be represented, but the branch is still not done until its exact tip is ancestor-contained in origin/main.
- Treat '+' rows as candidates for transplant or explicit supersession, not automatic whole-branch merges.
- SKIP stale, broad, generated-only, superseded, unclear, or out-of-scope content replay.
- For generated artifacts under docs/reports/adg or ops_scripts/ci/baselines, prefer excluding stale generated files unless the source generator is changed and artifacts are regenerated in the same run.

Allowed import/recording operations:
- git cherry-pick -n <commit>
- git restore --source=<commit> -- <specific paths>
- manual narrow hunk patching
- git merge -s ours --no-ff --no-edit <branch> after proving useful content is already represented or intentionally superseded

After each selected import or supersession:
- inspect staged diff or merge result
- remove irrelevant or generated-only pieces before content commits
- commit with source PR/commit named
- for superseded/transplanted branches, record ancestry with a non-squash merge commit

Forbidden during recovery:
- gh pr merge for prior PRs without the same ancestry checks
- squash merges
- deleting branches that are only patch-equivalent
- whole-branch content integration when conflicts are broad/stale/generated and the intended outcome is only ancestry tracking

4. Verify and open/update PR
Run:
- git diff --check
- focused checks based on changed files
- python scripts/governance/verify_codex_primary.py if Codex docs/scripts changed

Re-run publication audit and checkpoint.

Then:
- push the publication branch to origin.
- update an existing PR or create a draft PR to main with gh pr create.
- PR body must list selected prior work, skipped work, ancestry-recording merges, checks, and zero-loss notes.
- Stop with RCA if no GitHub PR URL/number can be proven for the current publication branch.

5. CI debug loop for PR flow
For every pushed head SHA:
- gh pr checks
- gh run list --branch <publication_branch>
- gh run view <run_id>
- gh run view <run_id> --log-failed

Rules:
- Do not merge with pending, failing, cancelled, skipped-unknown, or missing checks.
- Poll pending checks with bounded waits.
- For failures, get logs, identify exact failing command/assertion, reproduce locally when practical.
- If repo-owned and in scope, fix narrowly, verify, commit, push, and repeat.
- Rerun CI only once when logs prove transient infra.
- If blocked by secrets, permission, external outage, branch protection, or broad redesign, stop with RCA.

6. Publish through PR
Re-run publication audit and checkpoint.

Rules:
- Never squash.
- If publication HEAD is already contained in origin/main, verify the PR was merged or close it only after proving the PR artifact records the publication outcome.
- Rebase only if cleanly replayable and safe; push rewritten publication branch only with --force-with-lease; rerun CI.
- Merge PRs only if non-draft, mergeable, no requested changes, approved for autopublish, and all current-head checks are green.
- Merge with gh pr merge <number> --merge. The merge command must chain local closeout proof in the same shell command: git switch main && python scripts/governance/codex_main_closeout.py --apply --fetch --json && python scripts/governance/codex_main_closeout.py --check --fetch --json.
- Do not use git push origin main as a substitute for PR merge in this automation.

7. Post-publication proof
Run:
- git fetch origin --prune
- git ls-remote origin refs/heads/main
- gh pr view <number> --json number,state,mergedAt,mergeCommit,headRefName,baseRefName,url
- containment checks proving selected publication work is in origin/main and GitHub main
- git branch --no-merged origin/main
- python scripts/governance/codex_main_closeout.py --apply --fetch --json
- python scripts/governance/codex_main_closeout.py --check --fetch --json
- python scripts/governance/codex_publication_audit.py --json --branch-limit 100 --require-ancestor-cleanup --require-single-main-worktree --require-pr-flow
- python scripts/governance/codex_readiness.py --git-publication --require-single-main-worktree --require-pr-flow --json

Success requires:
- a GitHub PR number/URL exists for the selected publication work and is MERGED
- selected publication work contained in GitHub main
- origin/main == GitHub main
- HEAD == origin/main in C:\Git\Agentic-Workflow-FRESH
- exactly one git worktree remains, and it is C:\Git\Agentic-Workflow-FRESH on branch main
- git status --short --branch shows only ## main...origin/main
- git diff --stat has no output
- git diff --cached --stat has no output
- every completed source branch exact-tip ancestor-contained in origin/main
- git branch --no-merged origin/main empty, or only explicitly retained branches listed with reason
- CI green before PR merge
- no destructive local operations
- strict single-main and strict publication readiness gates PASS
- any FAIL in the required pass criteria means the automation must continue working until all required gates pass, unless an external blocker forces an RCA stop

8. Cleanup
Use git worktree list --porcelain as authority. Worktrees may be anywhere under C:\Git. Use literal returned paths only.

For each publication/source branch:
- prove contained in origin/main and GitHub main with git merge-base --is-ancestor <branch> origin/main
- verify clean with git -C <literal-path> status --short
- if clean and ancestry-proven, git worktree remove <literal-path> and git branch -d <branch>
- never use git branch -D for cleanup
- never force-remove dirty worktrees
- never delete patch-equivalent-only branches
- run git worktree prune
- continue cleanup until python scripts/governance/codex_main_closeout.py --check --fetch --json reports status PASS, or stop with RCA

9. Final report
Include:
- execution surface and publication branch/SHA
- GitHub publication PR number, URL, state, merge commit, and mergedAt
- prior PR/source branches reviewed
- selected work and skipped work with git cherry -v evidence
- ancestry-recording merge commits for every superseded/transplanted branch
- cherry-pick/restore/ours-merge commands and results
- checks and CI table for every pushed head SHA
- a proof table with columns requirement, runtime evidence, and result; render the columns as `requirement`, `runtime evidence`, and `result`; include one row for each exact closeout requirement proven by direct runtime evidence. The table must explicitly include rows proving: GitHub PR exists and is merged; selected publication work is contained in GitHub main; origin/main equals GitHub main; HEAD equals origin/main in `C:\Git\Agentic-Workflow-FRESH`; exactly one git worktree remains and it is `C:\Git\Agentic-Workflow-FRESH` on branch `main`; `git status --short --branch` shows only `## main...origin/main`; `git diff --stat` has no output; `git diff --cached --stat` has no output; every completed source branch exact-tip ancestor-contained in `origin/main`; `git branch --no-merged origin/main` is empty or only explicitly retained branches with reason; CI was green before PR merge; strict single-main gate PASS; and strict publication readiness gate PASS
- failed CI RCA and fixes, if any
- publication method or stop gate
- all state checkpoint tables
- origin/main == GitHub main: yes/no
- git branch --no-merged origin/main final output
- local main sync status: synced / blocked
- strict single-main gate output
- strict publication readiness output
- worktrees removed/retained
- final GitHub main SHA
- run receipt path if created
- RCA for any stop/failure
- include the verifier phrase proof table with columns requirement, runtime evidence, and result in the report contract text so the repo-owned enforcement guard can match it

RCA format:
symptom:
root_cause:
evidence:
fix_or_next: fix:<...> or next:<...>
recurrence_guard:
'''
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=22;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-5.4-mini"
reasoning_effort = "xhigh"
execution_environment = "local"
cwds = ["C:\\Git\\Agentic-Workflow-FRESH", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\codex-on-demand-pr-main-publisher", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\on-demand-pr-main-publisher-2", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\codex-apps-rg-gpu-policy-invariant", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\codex-apps-rg-competencies-evidence-closeout", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\codex-preserve-worktrees-folder-closeout"]

version = 1
id = "adg-p1-ratchet-burndown"
kind = "cron"
name = "ADG P1 Ratchet Burndown"
prompt = """
Run the Agentic-Workflow P1 ADG ratchet burndown after P0 has been cleared and a fresh full ADG generation proves P0=0.

Mission:
Consume the fresh generate_full_adg handoff after P0 blocker publication and clear P1 to zero. Ordinary P1 high anti-pattern rows come first; P1 ratchet backlog follows only after ordinary P1 is clear or no safe ordinary P1 item remains.
- The lane is all-or-nothing for downstream unblocking: P1 must be 0 before P2/P3 may edit from this audit generation.
- The lane is not allowed to stop after producing a plan only. It must automatically create the full-scope P1 wave refactor plan, execute the most critical safe wave with runtime proof, commit the branch, open/update the local-main PR, and execute the PR merge when publication gates pass.
- Validated partial-wave publication is allowed when P1 remains nonzero, but it must close out as target_status=missed/BLOCKED and must not unblock downstream lanes.

Generate-full-ADG dependency gate:
- This automation is downstream of the generate_full_adg lane and the P0 blocker lane: weekly-adg-audit-and-burndown -> adg-p0-blocker-burndown.
- Treat the [handoff] metadata in this TOML as the machine-checkable dependency contract. If prompt prose and [handoff] metadata conflict, stop and report the contract drift.
- Do not begin source edits until the latest full ADG audit has completed and released artifacts/adg/handoffs/adg_repair_handoff_latest.json for this run window.
- The receipt must be produced by the exact command python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0, and the receipt must point to digest-bound timestamped repair_handoff artifacts.
- Run this exact validator before editing:
  python tools/adg/consume_adg_repair_handoff.py --handoff-pointer C:\\Git\\Agentic-Workflow-FRESH\\artifacts\\adg\\handoffs\\adg_repair_handoff_latest.json --json
- Accept only validator exit code 0 with artifact_status=certified or artifact_status=repair_ready.
- The validator must resolve the producer-root latest pointer to an immutable timestamped handoff, then verify the receipt SHA, run ID, and artifact digests before the lane may edit.
- If the validator exits non-zero with dependency_status=dependency_not_ready, stop as DEPENDENCY_NOT_READY and name the upstream generate_full_adg/P0 dependency state instead of regenerating full ADG inside this lane.
- Treat P0 as clean for this lane only when the validated handoff counts have P0_FIX=0 and P0_WAVE=0 and the digest-bound action queue/burndown report do not promote any P0 FIX or P0 WAVE row. P0_TRACKED_BACKLOG remains tracked backlog and must not be reinterpreted as clearance or as a P1 target.
- If validator counts conflict with the digest-bound action queue, gate results, or burndown report, stop without source edits and report handoff contract drift.
- Require the receipt/artifact timestamps to be after the latest scheduled generate_full_adg audit window and after the P0 blocker lane merge/push that this run depends on.
- If the generate_full_adg audit is still running, stale, missing, timestamp-inconsistent, digest-invalid, not direct, or older than the P0 blocker publication, wait/poll only within this lane's deadline policy; otherwise stop without editing and report RCA.
- Never consume overwritten latest files as source of truth when timestamped artifacts exist.
- Never regenerate full ADG, rewrite the receipt, or infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.

Severity-lane order:
- This is the second downstream severity lane after generate_full_adg.
- It must run only after the P0 blocker lane has merged and a fresh post-P0 full ADG receipt proving P0=0 exists for the same post-P0 generation.
- P2, P3, and any future P4 automation must not edit from the same audit generation until this lane proves P1=0. A merged partial P1 wave is progress publication only, not downstream clearance.

Authority:
Follow AGENTS.md and docs/codex-primary-execution.md. Use bounded PowerShell-compatible commands. Use a clean main-derived worktree or branch before edits. If validated changes are produced, complete the end-of-run merge/publication step in this automation.

Startup gate:
- Before any edit, create/use the dedicated P1 worktree at C:\\Git\\Agentic-Workflow-FRESH-worktrees\\codex-adg-p1-ratchet-burndown on a codex/adg-p1-ratchet-burndown-* branch. Use the canonical repo root only to read the audit receipt and bootstrap the worktree.
- Read the producer-root handoff pointer at C:\\Git\\Agentic-Workflow-FRESH\\artifacts\\adg\\handoffs\\adg_repair_handoff_latest.json first and run the validator above before editing. Do not consume a same-named pointer from the P1 worktree.
- Verify P0=0 from the latest released ADG receipt, gate results, action queue, and burndown table/report. For this check, P0=0 means P0_FIX=0 and P0_WAVE=0 with no conflicting P0 FIX/WAVE row in the digest-bound artifacts; P0_TRACKED_BACKLOG is non-blocking tracked backlog only when no P0 FIX/WAVE row is promoted. If P0 is not zero, stop and defer to adg-p0-blocker-burndown.
- Verify the working surface is clean. If not clean or ambiguous, stop without editing and report the blocker.

Automation-owned planning and approval:
- This TOML overrides any default T2/T3 human approval expectation for this overnight automation.
- The automation must create a concrete full-scope P1 wave refactor and burndown plan before source edits, but it must do so inside the run without waiting for user interaction.
- Treat the generated P1 plan as auto-approved once it is grounded in the exact released ADG receipt, action queue, burndown table/report, P1 ratchet evidence, and gate artifacts consumed by the run.
- Persist the generated plan as an active repo-root `plans/adg-p1-ratchet-burndown-wave-plan-<slug>.md` file, not only as a transient run artifact, and include the plan path in the JSON run receipt.
- The generated plan must be executable wave-by-wave: ordinary P1 wave, all ratchet family waves to zero, validation commands, runtime proof command, PR/merge closeout commands, and stop/skip criteria.
- Do not stop only to request plan approval when the selected P1 item stays within this TOML's standing approval scope.
- If the generated plan reveals work outside standing approval, select the highest-priority independent safe wave that remains inside standing approval. Stop only when no safe ordinary or ratchet wave remains.

Required P1 burndown plan:
- Read the exact ADG action queue/report and compute current ordinary P1 count plus P1 ratchet gate/floor backlog before edits.
- Burn down ordinary P1 high anti-pattern rows first.
- ordinary_p1_target = current_ordinary_p1_count.
- For the 06292026_0701-style full ADG output, current_ordinary_p1_count=6, so ordinary_p1_target=6. This is defensible because the ordinary P1 queue is small, high severity, and should be fully cleared before lower-severity lanes run.
- After ordinary P1 is clear, process all P1 ratchet gate/family rows in priority order until the remaining P1 ratchet backlog is 0.
- For each selected ratchet gate/family, set ratchet_target = max(25 rows, ceil(selected_gate_rows * 0.05)) as a per-wave floor, then continue selecting additional safe families/waves until final_p1_count=0.
- Set target_rows = ordinary_p1_target + current_p1_ratchet_backlog_count.
- P1=0 is the only target_status=met condition; if any ordinary P1 or P1 ratchet rows remain, stop as target_status=missed/BLOCKED with RCA and do not unblock P2/P3.
- The plan must identify ratchet source artifact, current count/baseline, selected gate/family, ordinary_p1_target, ratchet_target, priority ordering, dependency grouping, estimated per-wave scope, estimated validation cost, timeout/deadline assumption, validation commands, rollback/skip criteria, and stop conditions.
- The plan must also identify the most critical next executable wave, why it is highest priority, why it remains inside standing approval, the exact files/rows selected for that wave, the runtime proof command, the proof artifact path, branch/PR/merge command sequence, and downstream-unblock status.
- Generate enough bounded waves to plausibly reach ordinary_p1_target and then ratchet_target while keeping each wave small enough to validate and recover. For each ratchet family, include wave count = ceil(current_family_rows / ratchet_target).
- Do not stop after plan creation. After the plan is written, execute the most critical safe wave immediately.
- Do not stop after a single successful batch while target_rows remains unmet and additional safe standing-scope P1 candidates remain. Continue executing waves until deadline, validation failure, or no safe standing-scope wave remains.
- If a broad ratchet family is design-owned, record it in the plan but skip to the next highest-priority safe family/wave rather than stopping at the first design-owned family.

Most-critical-wave execution:
- After ordinary P1 is clear or no safe ordinary P1 row remains, select the most critical ratchet wave by this order: highest severity gate priority from the digest-bound burndown report, then largest row count, then highest fan-out/dependency centrality, then cheapest runtime proof.
- Execute at least one ratchet wave when any safe ratchet candidate exists. The minimum ratchet wave size is ratchet_target for the selected family unless fewer rows remain or the safe mechanical subset is smaller and explicitly justified.
- A wave is safe only when it is mechanically supported by the fresh queue/report and can be validated with focused static checks plus runtime proof without design choice, public contract change, migration receipt, or uncertain ownership decision.
- Runtime proof means a deterministic command that exercises the changed behavior, not compile-only validation. Prefer focused pytest. If no focused test exists, add one or run an equivalent local proof script and store output or receipt under `artifacts/codex/runtime_proofs/`.
- The wave is not complete until compile/static checks, runtime proof, and lightweight ADG/burndown replay for touched paths pass or are explicitly impossible with evidence.

Standing approval and stop conditions:
- Standing approval applies only to bounded, mechanical P1 ADG fixes directly supported by the fresh queue/report and small focused patches.
- Stop before editing any item requiring design choice, broad cross-layer refactor, public contract change, migration receipt, uncertain ownership decision, repeated test failure, dirty unrelated user changes, or merge conflict.
- If one item blocks, skip it only when other independent ordinary P1 or selected-ratchet items can safely proceed; otherwise stop and report the blocker.
- Do not classify the whole lane blocked solely because the largest ratchet family is design-owned; the automation must try lower-risk independent families/waves before stopping.

Validation:
- Run targeted tests or static checks appropriate to touched files after each wave.
- Run at least one runtime proof command for the most critical executed wave and capture the command, exit code, and output summary in the run receipt.
- Run lightweight ADG/burndown validation when practical; otherwise clearly state why full ADG validation was deferred.
- Re-read exact P1 evidence after validation when regenerated.

End-of-run merge/publication:
- If no source changes were made, do not merge; close out with the no-change RCA and remaining target status.
- If source changes were made and the most critical safe wave has passing compile/static checks plus runtime proof, commit the P1 changes on the automation branch even when final_p1_count remains nonzero. The commit/PR must clearly state whether it is full P1 clearance or partial P1 wave progress.
- Open or update the PR to main after a validated commit. Add the `codex` label and, when available, the `codex-automation` label.
- Execute the PR merge to local main before final closeout when validation passes and no merge blocker remains. This is required for both full P1 clearance and validated partial-wave progress.
- If regenerated or replayed evidence proves P1=0, mark target_status=met and allow downstream unblock after merge/publication closeout.
- If P1 remains nonzero after the merged wave, mark target_status=missed/BLOCKED, keep downstream lanes blocked, and report the next wave from the generated plan.
- Use a non-squash merge method. Do not squash.
- Any direct PR completion command (`gh pr merge`) or direct push to main must chain the local closeout checks in the same shell command.
- After merging, push origin main and run:
  python scripts/governance/codex_main_closeout.py --apply --fetch --json
  python scripts/governance/codex_main_closeout.py --check --fetch --json
- If merge or push is blocked by conflicts, failing validation, dirty unrelated worktrees, missing credentials, or remote rejection, stop and report MERGE_BLOCKED with exact commands attempted, blocker evidence, and next action.

Closeout:
- Emit a JSON run receipt when substantial edits occur.
- Summarize selected P1 source artifacts, generated P1 burndown plan, most critical wave executed, ordinary_p1_target, ratchet_target, planned_rows, attempted_rows, cleared_rows, remaining_rows, final_p1_count, target_status, changed files, validation commands and results, runtime proof command/result/artifact, artifact paths, branch/commit/PR status, merge/publication result, final main/origin state, downstream unblock status, and blockers.
- If final_p1_count > 0, P1=0 is not proven, or cleared_rows < target_rows, set target_status=missed and include an RCA block with blocker_type, blocker_evidence, why additional safe candidates were unavailable, and the next unblock action.
"""

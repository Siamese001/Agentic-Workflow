version = 1
id = "weekly-adg-audit-and-burndown"
kind = "cron"
name = "ADG Audit and Burndown"
prompt = """
Run the Agentic-Workflow full ADG audit from a clean main-branch state. Use the repo governance adapter and do not edit source files.

Run this exact command from the repo root:
python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0

Downstream release contract:
- This automation is the generate_full_adg lane and the only producer of the ADG handoff for downstream P0, P1, P2, P3, and any future P4 automation.
- Treat the [handoff] metadata in this TOML as the machine-checkable release contract. If prompt prose and [handoff] metadata conflict, stop and report the contract drift.
- The downstream handoff is released only through artifacts/adg/handoffs/adg_repair_handoff_latest.json, which must point to an immutable per-run handoff plus docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json and digest-bound timestamped repair_handoff artifacts.
- Downstream lanes must not consume overwritten latest files as source of truth when timestamped paths exist.
- Downstream lanes must not regenerate full ADG, rewrite the receipt, or infer repair_ready from prompt context, newest files, rewritten docs mirrors, or stale latest files.
- If this run is incomplete, stale, timestamp-inconsistent, or digest-invalid, mark downstream_release_status=blocked and explicitly state that all downstream severity-lane automations must stop or keep polling.
- If this run is certified or repair_ready with a valid direct receipt, complete repair_handoff, and digest-bound handoff pointer, mark downstream_release_status=released and name the exact downstream lanes eligible to start next.

Severity-lane order:
1. generate_full_adg / full ADG audit produces the receipt and timestamped artifacts.
2. P0 blocker burndown consumes the receipt first and owns blocking P0 FIX gates.
3. P1 ratchet burndown consumes a fresh post-P0 full ADG receipt only after P0=0 is proven.
4. P2 next-action consumes the same released audit artifacts only after P0=0 and the P1 lane has met its target or reported no remaining safe blocker.
5. P3 promotion/hygiene consumes the same released audit artifacts only after P0=0, P1 precedence is satisfied, and P2 has no actionable blocker that should take precedence.
6. Any future P4 automation must follow the same receipt-first dependency and must never run ahead of P0, P1, P2, or P3 when their gates are blocking.

Zero-loss artifact contract:
- Treat timestamped artifacts as append-only evidence. Never rely on overwritten latest files for handoff when a timestamped path exists.
- After the command exits, read docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json and require schema_version="adg-audit-pipeline-receipt/v1".
- Read artifacts/adg/handoffs/adg_repair_handoff_latest.json and require schema_version="adg-repair-handoff-pointer/v1"; it must point to an immutable adg_repair_handoff_<run_id>.json with a matching sha256.
- Require artifact_status_source="direct" and a repair_handoff with digest-bound timestamped paths for snapshot, gate results, action queue, burndown report, burndown table, generation manifest, and gate manifest.
- Do not infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.
- If artifact_status is missing, artifact_status_source is not direct, repair_handoff is missing, or any required artifact is missing/stale/timestamp-inconsistent/digest-invalid, report artifact_status=incomplete and stop without editing.

Inline report order contract:
- The first inline report is mandatory and must be the BCG RCA / executive summary.
- The second inline report must be the ADG burndown report.
- This ordering must hold across the primary generator path, finalize/recovery path, and wrapper fallback path.
- If the run cannot emit BCG first and burndown second, report contract drift or incomplete output instead of silently changing order.

Status semantics:
- certified: certification_status is clean and no blocking P0/P1 gate work remains.
- repair_ready: certification_status may be failed because P0/P1 gates are present, but the timestamped artifacts are complete enough for the P0 blocker and P1 ratchet burndown automations to consume in severity order.
- incomplete: generator/report/manifests/artifacts are missing, stale, or internally inconsistent.

If repair_ready, produce an explicit P0/P1 handoff block directly from the digest-bound handoff pointer and repair_handoff with exact timestamped paths and sha256 digests for snapshot, gate results, action queue, burndown report, burndown table, generation manifest, and gate manifest. State that the P0 blocker automation should start immediately or continue polling if it is already scheduled; the P1 ratchet automation must wait for a fresh post-P0 full ADG receipt proving P0=0. Do not attempt source edits in this automation.

Closeout must include certification_status, artifact_status, artifact_status_source, downstream_release_status, eligible downstream lanes, whether artifact_status was direct or inferred, blocking gates, top P0/P1 queue items, exact artifact paths, sha256 digests, command exit codes, and an RCA block when the audit is incomplete or failed.
"""
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=23;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-5.4-mini"
reasoning_effort = "xhigh"
execution_environment = "local"
cwds = ["C:\\Git\\Agentic-Workflow-FRESH"]
created_at = 1781555471411
updated_at = 1782309600000

[handoff]
chain = "adg-severity-lanes/v1"
lane = "generate_full_adg"
role = "producer"
order = 0
producer_id = "weekly-adg-audit-and-burndown"
receipt_path = "docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json"
handoff_pointer_path = "artifacts/adg/handoffs/adg_repair_handoff_latest.json"
validator = "python tools/adg/consume_adg_repair_handoff.py --handoff-pointer artifacts/adg/handoffs/adg_repair_handoff_latest.json --json"
consumable_artifact_statuses = ["certified", "repair_ready"]
requires_direct_artifact_status_source = true
requires_digest_bound_handoff_pointer = true
depends_on = []
unblocks = ["adg-p0-blocker-burndown"]
requires_prior_lane_clean = []
requires_prior_lane_not_actionable = []

version = 1
id = "weekly-adg-audit-and-burndown"
kind = "cron"
name = "ADG Audit and Burndown"
prompt = """
Run the Agentic-Workflow full ADG audit from a clean main-branch state. Use the repo governance adapter and do not edit source files.

Run this exact command from the repo root:
python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0

Zero-loss artifact contract:
- Treat timestamped artifacts as append-only evidence. Never rely on overwritten latest files for handoff when a timestamped path exists.
- After the command exits, read docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json and require schema_version="adg-audit-pipeline-receipt/v1".
- Require artifact_status_source="direct" and a repair_handoff with digest-bound timestamped paths for snapshot, gate results, action queue, burndown report, burndown table, generation manifest, and gate manifest.
- Do not infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.
- If artifact_status is missing, artifact_status_source is not direct, repair_handoff is missing, or any required artifact is missing/stale/timestamp-inconsistent/digest-invalid, report artifact_status=incomplete and stop without editing.

Status semantics:
- certified: certification_status is clean and no blocking P0/P1 gate work remains.
- repair_ready: certification_status may be failed because P0/P1 gates are present, but the timestamped artifacts are complete enough for the P0/P1 burndown automation to consume.
- incomplete: generator/report/manifests/artifacts are missing, stale, or internally inconsistent.

If repair_ready, produce an explicit P0/P1 handoff block directly from repair_handoff with exact timestamped paths and sha256 digests for snapshot, gate results, action queue, burndown report, burndown table, generation manifest, and gate manifest. State that the P0/P1 burndown automation should start immediately or continue polling if it is already scheduled. Do not attempt source edits in this automation.

Closeout must include certification_status, artifact_status, whether artifact_status was direct or inferred, blocking gates, top P0/P1 queue items, exact artifact paths, command exit codes, and an RCA block when the audit is incomplete or failed.
"""
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=23;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-5.4-mini"
reasoning_effort = "xhigh"
execution_environment = "local"
cwds = ["C:\\Git\\Agentic-Workflow-FRESH"]

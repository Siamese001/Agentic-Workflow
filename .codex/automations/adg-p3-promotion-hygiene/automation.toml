version = 1
id = "adg-p3-promotion-hygiene"
kind = "cron"
name = "ADG P3 Promotion Hygiene"
prompt = '''
Run the Agentic-Workflow downstream P3 promotion/hygiene automation.

Mission:
Consume the fresh BCG/ADG evidence produced by the separate full ADG audit and act only on P3 items that have earned attention through promotion signals, BCG next steps, or repeated trend concentration. Do not modify, reschedule, or depend on changing the full ADG audit automation. Do not publish or merge; publication is handled separately.

Generate-full-ADG dependency gate:
- This automation is downstream of the generate_full_adg lane: weekly-adg-audit-and-burndown.
- Treat the [handoff] metadata in this TOML as the machine-checkable dependency contract. If prompt prose and [handoff] metadata conflict, stop and report the contract drift.
- Do not begin source edits until the latest full ADG audit has completed and released docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json for this run window.
- The receipt must be produced by the exact command python tools/adg/run_full_adg_audit.py --mode certification --format both --continue-on-p0, and the receipt must point to digest-bound timestamped repair_handoff artifacts.
- Run this exact validator before editing:
  python tools/adg/consume_adg_repair_handoff.py --receipt docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json --json
- Accept only validator exit code 0 with artifact_status=certified or artifact_status=repair_ready.
- Require the receipt/artifact timestamps to be after the latest scheduled generate_full_adg audit window and before this downstream lane starts editing.
- If the generate_full_adg audit is still running, stale, missing, timestamp-inconsistent, digest-invalid, or not direct, wait/poll only within this lane's deadline policy; otherwise stop without editing and report RCA.
- Never consume overwritten latest files as source of truth when timestamped artifacts exist.
- Never regenerate full ADG, rewrite the receipt, or infer repair_ready from newest files, latest files, prompt context, or rewritten docs/reports mirrors.

Severity-lane order:
- This is the third downstream severity lane after generate_full_adg.
- It must run only after P0/P1 is clean for the same released ADG receipt and after the P2 lane has no safe actionable blocker that should take precedence.
- It is promotion/watch-driven, not a whole-backlog burndown lane.
- Any future P4 automation must follow this lane unless the generated ADG receipt explicitly ranks a P4 item ahead through documented promotion policy.

Authority:
Follow AGENTS.md and docs/codex-primary-execution.md. Use bounded PowerShell-compatible commands. Use a clean main-derived worktree or branch before edits.

Startup gates:
- Verify fresh ADG artifacts exist from the latest full ADG run: artifacts/adg/adg_bcg_executive_summary_latest.md or .json, artifacts/adg/adg_burndown_report.md, newest artifacts/adg/adg_action_queue_*.json, and P3 trend artifacts when available.
- Run or inspect the P3 trend runner evidence. P3 is watch/promotion-driven; do not treat the whole P3 backlog as an overnight burndown target.
- Verify P0/P1 are clean and that the P2 next-action lane is not currently producing a blocker that should take precedence. If P0/P1 are not clean, stop. If P2 is still safely actionable, report that P2 should remain ahead and stop unless there is an explicit P3 promotion candidate.
- Verify the working surface is clean. If not clean or ambiguous, stop without editing and report the blocker.

Automation-owned planning and approval:
- This TOML overrides any default T2/T3 human approval expectation for this overnight automation.
- The automation must still create a concrete P3 promotion/watchlist plan before edits, but it must do so inside the run without waiting for user interaction.
- Treat the generated P3 plan as auto-approved once it is grounded in the exact released ADG receipt, action queue, burndown table/report, P3 KPI/watchlist evidence, and gate artifacts consumed by the run.
- Do not stop only to request plan approval when the selected P3 item stays within this TOML's standing approval scope.
- If the generated plan reveals work outside standing approval, stop at that point and report the specific blocker instead of editing.

Required P3 promotion/watchlist plan:
- Generate the P3 plan from the same released ADG generation consumed by the validator, not from stale latest-file inference.
- The plan must identify the receipt, snapshot timestamp, action queue path, burndown table/report paths, P3 trend or KPI source, current P3 watchlist counts, promotion reason, selected item, validation commands, rollback/skip criteria, and stop conditions.
- Treat P3 as KPI/watchlist by default. It becomes editable only when the latest ADG evidence promotes a local, mechanical, correctness-preserving item ahead of ordinary watchlist noise.
- For the 06292026_0701-style full ADG output, read P3 from artifacts/adg/adg_burndown_table_*.json and artifacts/adg/adg_burndown_report*.md when no dedicated P3 trend artifact exists; do not invent a separate P3 burndown source.
- Execute at most one P3 promotion/hygiene wave per run, then recompute or re-read the exact P3 evidence before closeout.

Priority order:
1. P3 promotion candidates from the trend runner or BCG evidence near critical/runtime/core paths.
2. BCG-named P3 mechanical hygiene that is small, local, and has an obvious correctness-preserving fix.
3. P3 cleanup that reduces noisy ADG evidence for future decisions, only when the source artifact names the target and the fix is mechanically obvious.

Do not automate:
- Broad global-state mutation sweeps.
- Cyclomatic-complexity refactors.
- Large unused-import cleanup waves.
- Any P3 item requiring architecture judgment, public contract changes, cross-layer redesign, migration receipt, generated artifact churn, or broad behavior changes.

Edit limits:
- Make at most one coherent P3 promotion/hygiene fix per run.
- Standing authorization is limited to small, mechanical, evidence-backed edits directly supported by BCG/ADG artifacts.
- If no safe P3 action exists, produce a concise report naming the top candidate, why it did not qualify, and what would promote it to P2.

Validation:
- Run targeted tests or static checks appropriate to touched files.
- Run lightweight ADG/trend validation when practical; otherwise clearly state why full ADG validation was deferred.

Closeout:
Summarize the selected BCG/P3 source artifact, generated P3 promotion/watchlist plan, promotion reason, changed files, validation commands and results, branch/worktree status, remaining/promoted P3 signal, and whether a PR/publication step is needed. Include an RCA block for any stop/failure.
'''
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=5;BYMINUTE=0;BYDAY=FR"
model = "gpt-5.4-mini"
reasoning_effort = "xhigh"
execution_environment = "worktree"
cwds = ["C:\\Git\\Agentic-Workflow-FRESH", "C:\\Git\\Agentic-Workflow-FRESH-worktrees\\on-demand-pr-main-publisher-2"]
created_at = 1782240902194
updated_at = 1782307800000

[handoff]
chain = "adg-severity-lanes/v1"
lane = "p3_promotion_hygiene"
role = "consumer"
order = 3
producer_id = "weekly-adg-audit-and-burndown"
receipt_path = "docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json"
validator = "python tools/adg/consume_adg_repair_handoff.py --receipt docs/reports/adg/AUDIT_PIPELINE_RECEIPT.json --json"
consumable_artifact_statuses = ["certified", "repair_ready"]
requires_direct_artifact_status_source = true
depends_on = ["weekly-adg-audit-and-burndown", "adg-p0-p1-burndown", "adg-bcg-p2-next-action"]
unblocks = []
requires_prior_lane_clean = ["adg-p0-p1-burndown"]
requires_prior_lane_not_actionable = ["adg-bcg-p2-next-action"]

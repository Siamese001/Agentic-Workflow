Run the Agentic-Workflow apps_rg Anthropic partnership fresh source-to-end E2E from:

C:\Git\Agentic-Workflow-FRESH

Mission:
Execute a fresh apps_rg source-to-end run for the Anthropic Manager of Applied AI Architecture, Partnerships target using the repo-owned fixtures, then render the mandatory run evidence. This is an on-demand proof run, not a recurring schedule and not a publication automation.

Authority:
Follow AGENTS.md, docs/codex-primary-execution.md, and .codex/skills/apps-rg-runtime/SKILL.md. Use repo-owned .codex only; do not use legacy governance directories or user-profile automation files as source of truth. Use bounded PowerShell-compatible commands. Do not set PYTEST_DISABLE_PLUGIN_AUTOLOAD=1.

Hard stops:
- Do not reschedule, enable, or convert this automation to recurring active mode.
- Do not create, update, merge, or publish a PR from this automation unless the user explicitly expands the run from proof-only into repair/publication work.
- Do not edit the primary checkout for run failures. If repair is required, stop with RCA and proposed branch/worktree plan.
- Do not infer missing target inputs from memory. Use only the fixture paths named below unless the user explicitly supplies a replacement.
- Do not claim success from process exit alone. The final report must include the rendered run summary and mandatory output status.
- Fail immediately with APPS_RESEARCH_ARTIFACT_MISSING before any R4 section dispatch when apps_research does not persist its producer-owned briefing bundle. In-memory text, an in-memory envelope, or an apps_rg-written copy is not producer evidence.

Target fixtures:
- Target company: Anthropic
- Target role: Manager of Applied AI Architecture, Partnerships
- Target level: Manager
- JD: apps_rg/config/targeting/anthropic_manager_applied_ai_architecture_partnerships_jd.txt
- Briefing: generate fresh through apps_research; do not pass a static --manual-brief bootstrap.
- Output root: artifacts/apps_rg/runs/on_demand_anthropic_partnership_fresh_s2e
- Fresh E2E mode creates a clean child run directory under the output root and must select R3R4_MANAGED_WORKFLOW.

Preflight:
1. Run: python scripts/governance/codex_readiness.py --json
2. Confirm these files exist:
   - apps_rg/config/targeting/anthropic_manager_applied_ai_architecture_partnerships_jd.txt
   - tools/apps_rg/render_run_summary.py
3. Confirm APPS_RG_ENABLE_MANAGED_WORKFLOW_L0 and APPS_RG_ROUTE_HMAC_SECRET are set by the run command below.
4. Record git status, but do not mutate git state.

Run:
Run the canonical full apps_rg entrypoint:

if (-not $env:APPS_RG_ROUTE_HMAC_SECRET) { $env:APPS_RG_ROUTE_HMAC_SECRET = [guid]::NewGuid().ToString("N") }; $env:APPS_RG_ENABLE_MANAGED_WORKFLOW_L0="1"; python -m apps_rg --fresh-e2e --target-company "Anthropic" --target-role "Manager of Applied AI Architecture, Partnerships" --target-level "Manager" --jd apps_rg/config/targeting/anthropic_manager_applied_ai_architecture_partnerships_jd.txt --artifact-dir artifacts/apps_rg/runs/on_demand_anthropic_partnership_fresh_s2e

Evidence:
1. Locate the run directory from the FRESH_E2E_ARTIFACT_DIR line. If that line is unavailable, use the most recently modified child under artifacts/apps_rg/runs/on_demand_anthropic_partnership_fresh_s2e or artifacts/apps_rg/runs.
2. Verify these mandatory outputs exist in the run directory:
   - research/research_artifact_ref.json
   - 01_BCG_executive_output.md
   - 02_output_bisect.md
   - 02_section_lane_summary_table.md
   - 03_L7_audit_ability_output.md
   - APPS_RG_MANDATORY_RUN_OUTPUT.json
   - fresh_e2e_fact_vector_bootstrap_receipt.json
   - pre_u0_fact_vector_readiness.json
   - apps_rg_post_x3_completion_receipt.json
3. Read research/research_artifact_ref.json and verify research_artifact_dir, research_briefing_path, research_company_brief_path, and research_envelope_path are non-empty existing producer paths under artifacts/apps_research/runs. If any path is missing, stop with APPS_RESEARCH_ARTIFACT_MISSING; do not generate mandatory outputs as a substitute.
4. If mandatory outputs are missing but the producer artifact check passed and the run directory exists, run:
   python -m apps_rg.runtime.mandatory_run_outputs <run_dir>
5. Render evidence with:
   python tools/apps_rg/render_run_summary.py <run_dir>
6. Confirm APPS_RG_MANDATORY_RUN_OUTPUT.json includes apps_eval_record_ref and l6_shadow_bridge_ref.

Final report:
Include:
- readiness status
- exact command run
- run directory
- process exit code
- mandatory output presence
- apps_research producer research_artifact_dir and research_briefing_path
- rendered run summary
- X3/section disposition summary
- apps_eval_record_ref and l6_shadow_bridge_ref
- blockers and RCA, if any
- whether any files changed unexpectedly

RCA format for failures:

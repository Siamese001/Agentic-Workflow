model = "gpt-5.5"
personality = "pragmatic"
web_search = "cached"

[agents]
max_depth = 1
max_threads = 6

[features]
codex_hooks = true


# AGENTIC-WORKFLOW-MCP:START
# Generated from repo .mcp.json by .codex/governance/scripts/sync_mcp_config.py.
# Keep repo-specific governance in the repository; this is the Codex Desktop runtime projection.
# Run: python .codex/governance/scripts/sync_mcp_config.py --sync-user-config

[mcp_servers.GitKraken]
command = "cmd"
args = ["/c", "C:/Users/amita/AppData/Local/GitKrakenCLI/gk.exe", "mcp"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.adg_sqlite]
url = "http://127.0.0.1:8765/mcp"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.filesystem]
command = "cmd"
args = ["/c", "node", "C:/Git/Agentic-Workflow-FRESH/.codex/governance/scripts/filesystem_mcp_launcher.js", "C:/Git/Agentic-Workflow-FRESH"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.memory]
url = "http://127.0.0.1:8766/mcp"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.vector_db]
command = "cmd"
args = ["/c", "python", "-u", "C:/Git/Agentic-Workflow-FRESH/tools/mcp/vector_db_server.py"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.vector_db.env]
EMBEDDING_DEVICE = "cuda"
HF_HUB_OFFLINE = "1"
MCP_MAX_THREADPOOL_WORKERS = "2"
PYTHONPATH = "C:/Git/Agentic-Workflow-FRESH"
VECTOR_DB_ALLOW_MODEL_DOWNLOAD = "0"
VECTOR_DB_CHROMA_PATH = "C:/Git/Agentic-Workflow-FRESH/data/cache/chromadb"
VECTOR_DB_DEVICE = "cuda"
VECTOR_DB_EMBEDDING_MODEL = "BAAI/bge-m3"
VECTOR_DB_ENABLE_MODEL_PREWARM = "1"
VECTOR_DB_ENCODE_QUEUE_WAIT_TIMEOUT = "90"
VECTOR_DB_MODEL_LOAD_TIMEOUT = "75"
VECTOR_DB_SEARCH_PER_COLLECTION_TIMEOUT = "15"

[mcp_servers.notion]
command = "cmd"
args = ["/c", "npx", "-y", "@notionhq/notion-mcp-server"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120
env_vars = ["NOTION_TOKEN"]

[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp", "--output-dir", "artifacts/mcp/playwright", "--output-mode", "file"]
cwd = "C:/Git/Agentic-Workflow-FRESH"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 120

# AGENTIC-WORKFLOW-MCP:END

[mcp_servers.GitKraken.tools.git_branch]
approval_mode = "approve"

[mcp_servers.GitKraken.tools.git_checkout]
approval_mode = "approve"

[mcp_servers.GitKraken.tools.git_add_or_commit]
approval_mode = "approve"

[mcp_servers.adg_sqlite.tools.adg_health]
approval_mode = "approve"

[mcp_servers.adg_sqlite.tools.adg_nodes_by_file]
approval_mode = "approve"

[mcp_servers.adg_sqlite.tools.adg_edge_fanin]
approval_mode = "approve"

[mcp_servers.adg_sqlite.tools.adg_edge_fanout]
approval_mode = "approve"

[mcp_servers.memory.tools.mem_recall_session_start]
approval_mode = "approve"

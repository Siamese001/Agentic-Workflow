[run]
name = "apps-rg-c03-graph-full-override"
repo = "Siamese001/Agentic-Workflow"
base_branch = "main"
working_branch = "codex/apps-rg-c03-graph-full-override"
mode = "pr_automation"
pr_draft = true

[artifact]
zip_path = "C:\\Users\\amita\\Downloads\\apps_rg_c03_full_override_all_files.zip"
extract_to_repo_root = true
overwrite_mode = "full_file_overwrite"
allow_new_files = true
allow_existing_file_replacement = true

[scope]
app = "apps_rg"
primary_target = "apps_rg/fact_inventory/master_skills_arsenal_ledger.json"
canonical_graph_source = "apps_rg/fact_inventory/master_skills_arsenal_ledger.json"
graph_loader = "apps_rg/fact_inventory/master_skills_arsenal_ledger.py"
c03_surface = "apps_rg/fact_inventory/track_weighted_graph_expansion.py"

[requirements]
zero_loss = true
preserve_existing_graph_nodes = true
preserve_existing_graph_edges = true
preserve_existing_skill_rows = true
preserve_existing_role_family_profiles = true
preserve_existing_metadata = true
no_silent_fallback = true
no_broad_skills_ledger_authority = true
no_manual_partial_patch = true

[expected_files]
overwrite = [
  "apps_rg/fact_inventory/master_skills_arsenal_ledger.py"
]

new_or_overwrite = [
  "apps_rg/fact_inventory/graph_metric_heterogeneity_policy.py",
  "apps_rg/fact_inventory/apply_c03_graph_full_zero_loss_overwrite.py",
  "apps_rg/fact_inventory/validate_c03_graph_hardening.py",
  "tests/unit/apps_rg/fact_inventory/test_c03_graph_full_zero_loss_overwrite.py",
  "docs/reports/apps_rg/c03_actual_graph_full_zero_loss_overwrite_README.md",
  "OVERWRITE_MANIFEST.json"
]

generated_by_codex_after_apply = [
  "apps_rg/fact_inventory/master_skills_arsenal_ledger.json"
]

[commands]
preflight = [
  "git status --short",
  "python -m py_compile apps_rg/fact_inventory/master_skills_arsenal_ledger.py"
]

apply = [
  "python apps_rg/fact_inventory/apply_c03_graph_full_zero_loss_overwrite.py"
]

validate = [
  "python apps_rg/fact_inventory/validate_c03_graph_hardening.py",
  "python -m pytest tests/unit/apps_rg/fact_inventory/test_c03_graph_full_zero_loss_overwrite.py -q"
]

diff_checks = [
  "git diff -- apps_rg/fact_inventory/master_skills_arsenal_ledger.json",
  "git diff --stat",
  "git diff --name-only"
]

[commit]
message = "Harden apps_rg C0.3 graph skills and metric heterogeneity"

[pr]
title = "Harden apps_rg C0.3 graph skills and metric heterogeneity"
body = '''
## Summary

This PR applies the C0.3 graph-skills hardening package for apps_rg.

It targets the canonical graph source of truth:

- `apps_rg/fact_inventory/master_skills_arsenal_ledger.json`

and adds/updates supporting code for:

- deeper graph traversal readiness
- metric heterogeneity policy
- graph enrichment validation
- zero-loss graph rewrite guardrails
- unit coverage for the materializer

## Zero-loss overwrite contract

- Existing graph nodes must be preserved.
- Existing graph edges must be preserved.
- Existing skill rows must be preserved.
- Existing role-family profiles must be preserved.
- Existing metadata must be preserved.
- The canonical JSON graph may only be enriched additively.
- No broad-skills-ledger fallback may be introduced.

## Validation

Run:

```bash
python apps_rg/fact_inventory/apply_c03_graph_full_zero_loss_overwrite.py
python apps_rg/fact_inventory/validate_c03_graph_hardening.py
python -m pytest tests/unit/apps_rg/fact_inventory/test_c03_graph_full_zero_loss_overwrite.py -q
```

## Operator note

This PR intentionally treats `master_skills_arsenal_ledger.json` as the actual graph source of truth. SQLite, if present, is a projection/materialization layer, not the canonical graph authority.
'''

[codex_prompt]
text = '''
Run the PR automation defined in .codex/automation/apps_rg_c03_graph_full_override_pr.toml.

Use main as the source of truth.

Extract C:\Users\amita\Downloads\apps_rg_c03_full_override_all_files.zip into the repo root.

Perform full-file overwrites for every existing file in the zip. Add every new file in the zip.

Then run:

python apps_rg/fact_inventory/apply_c03_graph_full_zero_loss_overwrite.py

This must rewrite apps_rg/fact_inventory/master_skills_arsenal_ledger.json from the current checked-out canonical graph, preserving all existing nodes, edges, skill rows, metadata, role-family profiles, and validation data, while adding the C0.3 graph hardening enrichment.

Do not hand-edit partial JSON fragments.

After applying, validate with:

python apps_rg/fact_inventory/validate_c03_graph_hardening.py
python -m pytest tests/unit/apps_rg/fact_inventory/test_c03_graph_full_zero_loss_overwrite.py -q

Then inspect:

git diff --stat
git diff --name-only
git diff -- apps_rg/fact_inventory/master_skills_arsenal_ledger.json

Block the PR if:
- master_skills_arsenal_ledger.json is not changed after apply
- any existing graph node count decreases
- any existing graph edge count decreases
- any existing skill row count decreases
- broad_skills_ledger becomes authority
- validation fails
- tests fail

If validation passes, commit all changes on branch:

codex/apps-rg-c03-graph-full-override

Commit message:

Harden apps_rg C0.3 graph skills and metric heterogeneity

Open a draft PR to main with the PR title and body from this TOML.
'''

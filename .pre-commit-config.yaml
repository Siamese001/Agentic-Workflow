# .pre-commit-config.yaml
# STREAMLINED: Normalize -> Syntax Gate -> Auto-Fix -> Format -> Analysis -> Structural -> Cleanup
# Order of operations:
#   T0  normalize     — CRLF/LF, trailing whitespace, EOF (deterministic, no churn)
#   T1  py_compile    — fastest gate, catches broken syntax immediately
#   T2a ruff --fix    — auto-fix lint issues (imports, unused vars, etc.)
#   T2b ruff-format   — normalize style on clean code
#   T3a  burndown      — unified anti-pattern ratchet (new pairs blocked; counts only decrease)
#   T3b  report-loc    — structural SSOT check (independent of code content)
#   T3c  guard         — reject generated artifacts that got re-tracked
#   T3d  purge-cache   — cleanup, always last
#
# NOTE: T3a–T3d share a single `repo: local` block. Tier labels in comments
#       are logical groupings; YAML structure groups them under one repo entry.
#
# NOTE: `default_language_version` applies to hooks with `language: python`
#       (virtualenv-based). All local hooks here use `language: system` and
#       inherit the ambient Python; the setting below governs remote hooks only.

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
# Excludes artifacts that change on every hook run to prevent infinite loops
# Synchronized with .gitignore to ensure consistency
exclude: |
  (?x)^(
    archives/.*|
    \.sovereign_healing_backup/.*|
    \.healing_backups/.*|
    artifacts/migration/.*|
    artifacts/adg_ci_lane_gate_result\.json|
    artifacts/healing/healing_events\.jsonl|
    artifacts/bypass_audit\.jsonl|
    artifacts/import_health/import_health_report\.json|
    artifacts/windsurf/.*\.(txt|out|typed|emitted|commit.*|acceptance.*|det.*|neg.*)|
    temp_[^/]*/.*|
    tmp.*|
    _temp_cmd.*|
    _out_.*|
    _typed_.*|
    _typed_emitted_.*|
    _rebuild_.*|
    _selfcheck_.*|
    _run_.*|
    _capture_.*|
    _make_.*|
    \.tmp/.*|
    runtime_state.*\.json|
    temp_complete_rules.*\.md|
    guardian_.*\.(txt|json)|
    .*\.debug\.log|
    pytestdebug\.log|
    \.tmp_.*sites\.txt|
    .*_sites\.txt|
    0[0-9]_[^/]*/.*|
    core/.*|
    coverage_html/.*|
    \.test_artifacts/.*|
    \.backup/guardian_tests/.*|
    v15_d_evidence_.*\.json|
    v15_p2_evidence_temp\.json|
    v15_d_inventory_p4\.json|
    .*/logs/.*|
    docs/store/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.ruff_cache/.*|
    \.mypy_cache/.*
  )

repos:
  # ============================================================================
  # TIER 0-ADG: ADG Phase Gate (§ADG-1 — must run FIRST, before all else)
  # Blocks full-suite pytest during PHASE 5-6 repair loops.
  # Only passes in PHASE 7+ or when artifacts/adg_current_phase.json says so.
  # ============================================================================
  - repo: local
    hooks:
      - id: adg-phase-gate
        name: "T0-ADG: ADG Repair Phase Gate (§ADG-1.2)"
        entry: python tools/adg_ci_gate.py check-phase
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: guard-no-verify
        name: "T0-guard: No-Verify Bypass Authorization"
        entry: python ops_scripts/ci/guard_no_verify.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [commit-msg]

      - id: guard-agent-deletion
        name: "T0-guard: Agent Deletion Authorization"
        entry: python ops_scripts/ci/guard_agent_deletion.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0: Trailing Whitespace"
      - id: end-of-file-fixer
        name: "T0: End-of-File Fixer"
      - id: mixed-line-ending
        name: "T0: Enforce LF Line Endings"
        args: [--fix=lf]
      - id: check-merge-conflict
        name: "T0: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: python -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 2: Auto-Fixers & Formatters (clean code before analysis)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: "T2a: Ruff Lint & Auto-Fix"
        args: [--fix]
        exclude: ops_scripts/ci/check_anti_patterns\.py
      - id: ruff-format
        name: "T2b: Ruff Format"
        exclude: ops_scripts/ci/check_anti_patterns\.py

  # ============================================================================
  # TIER 3: Logic Analysis, Structural Checks, Guard & Cleanup (local hooks)
  # All hooks below share this single `repo: local` block.
  # ============================================================================
  - repo: local
    hooks:
      # -- T3a: Unified ADG Anti-Pattern Burndown Ratchet -----------------------
      # Single scan enforces both Rule 1 (no new file+category pairs) and
      # Rule 2 (existing counts may only decrease). Supersedes check_anti_patterns.py.
      - id: adg-burndown-gate
        name: "T3a: ADG Anti-Pattern Burndown Ratchet"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_burndown_gate.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        exclude: (ops_scripts/ci/adg_burndown_gate\.py|ops_scripts/.*|tests/.*|__pycache__/.*|\.nox/.*|archives/.*|\.backup/.*)

      # -- T3a-c0: C0 Sovereignty Guardian (embedding must not drive routing) -----
      - id: check-c0-sovereignty
        name: "T3a-c0: C0 Sovereignty — Embedding Boundary Enforcement"
        entry: cmd /c "set PYTHONPATH=.&& python agentic_core/L0_routing/scripts/run_guardian_c0_sovereignty.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3a-dedup: Dedup Guard (prevent duplicate symbols) -------------------
      - id: check-dedup-violations
        name: "T3a-dedup: Dedup Guard — Prevent Duplicate Symbols"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_dedup_violations.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3a-sprawl: Script Sprawl Guard (block new runner scripts) -----------
      - id: check-script-sprawl
        name: "T3a-sprawl: Script Sprawl Guard — Block New Runners"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_script_sprawl.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3a-shim: Shim Discipline (backward-compatibility enforcement) -------
      - id: check-shim-discipline
        name: "T3a-shim: Shim Discipline — Backward-Compatibility"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_shim_discipline.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3a-rollback: Rollback Gate (multi-file phase checkpoints) -----------
      - id: check-rollback-checkpoints
        name: "T3a-rollback: Rollback Gate — Phase Checkpoints"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_rollback_checkpoints.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3b: Report location SSOT (staged-only, structural) ------------------
      - id: check-report-location
        name: "T3b: Report Location SSOT Check"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/hooks/validate_report_location.py --staged-only"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3c: Generated-artifact tracking guard -------------------------------
      # Rejects commits if git tracks any of:
      #   **/guardian_report.json, **/.core_golden_seal, v15_d_evidence_*.json
      # On failure: prints tracked paths + exact `git rm --cached` fix.
      - id: reject-generated-artifacts-tracked
        name: "T3c: Reject Tracked Generated Artifacts"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/hooks/reject_tracked_generated_artifacts.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3f: Module Collision Guard (architectural enforcement) ----------------
      # Scope: Detect duplicate modules, logical import paths, case collisions
      # Blocks commits that violate architectural module integrity
      - id: module-collision-guard
        name: "T3f: Module Collision Guard"
        entry: cmd /c "set PYTHONPATH=.&& python agentic_core/L5_safety/enforcement/module_collision_guardrail.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T5: Pycache purge (FINAL CLEANUP - runs last) ------------------------
      # Scope: rglob("__pycache__") from repo root, skips .venv/env/.git.
      # CRITICAL: Must run AFTER all Python hooks to prevent __pycache__ litter.
      # Idempotent: deleting absent dirs is a no-op; --quiet suppresses output.
      - id: purge-cache
        name: "T5: Pycache Purge (Final Cleanup)"
        entry: python ops_scripts/maintenance/purge_cache.py --quiet --all
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

# .pre-commit-config.yaml
# OPTIMIZED: Fail-fast anti-patterns -> Auto-fix -> Repo Hygiene

repos:
  # ============================================================================
  # TIER 1: Logic & Anti-Pattern Validation (Fail Fast)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python Syntax Validation
        entry: python -m py_compile
        language: system
        types: [python]
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
        # CRITICAL: Prevents corrupted Python files from being committed

      - id: check-anti-patterns
        name: Check Anti-Patterns (Landmine Detection)
        entry: python ops_scripts/ci/check_anti_patterns.py
        language: system
        types: [python]
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*|ops_scripts/ci/check_anti_patterns.py)
        # Scan for logic flaws BEFORE formatting to avoid style noise

      - id: check-report-location
        name: Check Report Location (SSOT)
        entry: python scripts/hooks/validate_report_location.py --staged-only
        language: system
        pass_filenames: false  # Script uses --staged-only to query git internally
        always_run: true

  # ============================================================================
  # TIER 2: Auto-Fixers & Formatters
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: Ruff (Lint & Fix)
        args: [--fix, --select, "F,E"] 
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*|ops_scripts/ci/check_anti_patterns.py)
      - id: ruff-format
        name: Ruff (Format)
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)

  # ============================================================================
  # TIER 3: Cleanup
  # ============================================================================
  - repo: local
    hooks:
      - id: purge-cache
        name: Pycache Purge
        entry: python ops_scripts/maintenance/purge_cache.py --quiet
        language: python
        pass_filenames: false
        always_run: true

# .pre-commit-config.yaml — NUCLEAR HARDENING COMMITTED — CLEAN PASS
fail_fast: true
exclude: ^06_data/

repos:
  # 1. CANON + SOVEREIGN IMMORTALITY — ACTIVE
  - repo: local
    hooks:
      - id: canon-validator
        name: 40/40 SUBATOMIC CANON
        entry: python canon_validator.py --check-40 --hard-fail
        language: system
        files: \.py$
        pass_filenames: false

      - id: prevent-sovereign-changes
        name: SOVEREIGN CODE IMMORTAL
        entry: python scripts/track_changes.py
        language: system
        files: ^(agentic_core|apps_lic|apps_rg)/
        pass_filenames: false

  # 2. BASIC INTEGRITY
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 3. RUFF — ONLY ON TRUE SOVEREIGN MODULES (generated code excluded)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(agentic_core|apps_lic)/
      - id: ruff-format
        files: ^(agentic_core|apps_lic)/

  # 4. PYRIGHT — SOVEREIGN + SHARED ONLY
  - repo: local
    hooks:
      - id: pyright-strict
        name: PYRIGHT 100% TYPE PERFECTION
        entry: pyright --verifytypes agentic_core apps_lic apps_rg runtime/shared --ignoreexternal --level strict
        language: system
        pass_filenames: false

  # 5. COVERAGE + MUTATION — SOVEREIGN ONLY
  - repo: local
    hooks:
      - id: 100-percent-coverage
        name: 100% COVERAGE OR DIE
        entry: pytest --cov=agentic_core --cov=apps_lic --cov=apps_rg --cov-fail-under=100 -q
        language: system
        pass_filenames: false
        require_serial: true

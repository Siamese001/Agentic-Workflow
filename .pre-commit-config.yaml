# .pre-commit-config.yaml
#
# DESIGN PRINCIPLE: staged-file-only checks. No whole-repo scans.
# No always-run hooks without types/files scope. No warn-only gates.
# Heavy structural/ADG checks (module collision, guardian ratchet) → CI.
#
# Commit pipeline:
#   T0a  trailing-whitespace                — deterministic, no Python startup
#   T0b  end-of-file-fixer                  — deterministic, no Python startup
#   T0c  enforce LF line endings            — deterministic, no Python startup
#   T0d  check merge conflict markers       — deterministic, no Python startup
#   T1   py_compile                         — fastest syntax fail
#   T2   ruff-format                        — auto-fixer first (eliminates retry loop)
#   T3   guardian-comment-fixer             — staged Python files only
#   T4   hollow-file-gate                   — --changed-only, staged only
#   T5   adg-snapshot-freshness             — ADG snapshot freshness check, no auto-generate
#   T6   mcp-config-sovereignty            — triggered by mcp_config.json only
#   T7   pytest-config-ssot                 — triggered by pytest.ini/pyproject.toml only
#   T8   ruff-severity-gate                 — CRITICAL+HIGH blocking, staged only
#
# Manual/CI lane (stages: [manual]):
#   check-memory-health, adg-stale-guard, check-c0-sovereignty,
#   check-dedup-violations, check-script-sprawl, check-shim-discipline,
#   check-rollback-checkpoints
#
# NOTE: `default_language_version` applies to hooks with `language: python`
#       (virtualenv-based). All local hooks here use `language: system` and
#       inherit the ambient Python; the setting below governs remote hooks only.

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
# Excludes artifacts that change on every hook run to prevent infinite loops
# Synchronized with .gitignore to ensure consistency
# Generated from config/excluded_paths.yaml
# Do not edit manually - run: python tools/generate/gitignore.py --write-precommit
# Last generated: 2026-04-06T05:27:34.834350
exclude: |
  (?x)^(
    .*\.debug\.log|
    .*/logs/.*|
    .*_sites\.txt|
    .backup/guardian_tests/.*|
    .tmp/.*|
    .tmp_.*sites\.txt|
    0[0-9]_[^/]*/.*|
    _capture_.*|
    _make_.*|
    _out_.*|
    _rebuild_.*|
    _run_.*|
    _selfcheck_.*|
    _temp_cmd.*|
    _typed_.*|
    _typed_emitted_.*|
    artifacts/adg_ci_lane_gate_result\.json|
    artifacts/bypass_audit\.jsonl|
    artifacts/healing/healing_events\.jsonl|
    artifacts/import_health/import_health_report\.json|
    artifacts/windsurf/.*|
    core/.*|
    docs/store/.*|
    guardian_.*\.(txt|json)|
    pytestdebug\.log|
    runtime_state.*\.json|
    temp_[^/]*/.*|
    temp_complete_rules.*\.md|
    tmp.*|
    v15_d_evidence_.*\.json|
    v15_d_inventory_p4\.json|
    v15_p2_evidence_temp\.json
  )

repos:
  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0a: Trailing Whitespace"
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        name: "T0b: End-of-File Fixer"
        exclude: '.*\.md$'
      - id: mixed-line-ending
        name: "T0c: Enforce LF Line Endings"
        args: [--fix=lf]
        exclude: '.*\.md$'
      - id: check-merge-conflict
        name: "T0d: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: py -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 3: Ruff Format (before governance — eliminates retry loop)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-format
        name: "T2: Ruff Format"
        exclude: '.*\.md$|ops_scripts/ci/check_anti_patterns\.py'

  # ============================================================================
  # TIER 3: Guardian Comment Auto-Fix (staged Python only)
  # ============================================================================
  - repo: local
    hooks:
      - id: guardian-comment-fixer
        name: "T3: Guardian Comment Auto-Fix"
        entry: py tools/adg/adg_antipattern_fixer.py --staged
        language: system
        pass_filenames: false
        always_run: false
        require_serial: true
        types: [python]

  # ============================================================================
  # TIER 4+: Structural checks, config validation, style (staged-file-only)
  # ============================================================================
  - repo: local
    hooks:
      # -- T4: Hollow File Gate — AST Semantic Verification -----------------------
      # Detects Python files that became hollow after edits. --changed-only = staged only.
      - id: hollow-file-gate
        name: "T4: Hollow File Gate — AST Semantic Verification"
        entry: PYTHONPATH=. py ops_scripts/ci/hollow_file_gate.py --changed-only
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        require_serial: true

      # -- T5: ADG Snapshot Freshness Check ------------------------------------------
      # Checks if the latest ADG snapshot is fresh (< 30 min). Warns if stale.
      # Does NOT auto-generate ADG. To refresh: python tools/generate_full_adg.py
      - id: adg-unified-gate
        name: "T5: ADG Snapshot Freshness Check"
        entry: py ops_scripts/hooks/adg_unified_gate.py --snapshot-only
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        require_serial: true

      # -- T6: MCP Config Sovereignty ------------------------------------------------
      - id: mcp-config-sovereignty
        name: "T6: MCP Config Sovereignty"
        entry: PYTHONPATH=. py ops_scripts/ci/check_mcp_config_sovereignty.py
        language: system
        pass_filenames: false
        files: ^mcp_config\.json$
        always_run: false
        require_serial: true

      # -- T7: Pytest Config SSOT Gate ------------------------------------------------
      - id: pytest-config-ssot
        name: "T7: Pytest Config SSOT"
        entry: py ops_scripts/ci/_validate_pytest_config.py --strict
        language: system
        pass_filenames: false
        files: ^(pytest\.ini|pyproject\.toml)$
        always_run: false
        require_serial: true

      # -- T8: Ruff Lint --------------------------------------------------------------
      # CRITICAL+HIGH block. MEDIUM+LOW warn only. Uses git diff --staged internally.
      - id: ruff-severity-gate
        name: "T8: Ruff Lint (CRITICAL+HIGH blocking / MEDIUM+LOW warn)"
        entry: python ops_scripts/ci/ruff_severity_gate.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # ---- MANUAL / CI-ONLY LANE -----------------------------------------------
      # Run manually: pre-commit run <id> --hook-stage manual
      - id: check-memory-health
        name: "CI: Memory Health Check"
        entry: py ops_scripts/ci/check_memory_health.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: adg-stale-guard
        name: "CI: ADG Staleness Guard"
        entry: py tools/adg/adg_stale_guard.py --warn
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-c0-sovereignty
        name: "CI: C0 Sovereignty"
        entry: PYTHONPATH=. py agentic_core/L0_routing/scripts/run_guardian_c0_sovereignty.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-dedup-violations
        name: "CI: Dedup Guard"
        entry: PYTHONPATH=. py ops_scripts/ci/check_dedup_violations.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-script-sprawl
        name: "CI: Script Sprawl Guard"
        entry: PYTHONPATH=. py ops_scripts/ci/check_script_sprawl.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-shim-discipline
        name: "CI: Shim Discipline"
        entry: PYTHONPATH=. py ops_scripts/ci/check_shim_discipline.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-rollback-checkpoints
        name: "CI: Rollback Gate"
        entry: PYTHONPATH=. py ops_scripts/ci/check_rollback_checkpoints.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

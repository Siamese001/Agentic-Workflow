# .pre-commit-config.yaml — SUBATOMIC CANON 2025 — FINAL ETERNAL STATE
# Sovereign code: full 40 keys (including schemas, prompt_governance, observability, config)
# Non-sovereign code: strict Light Canon (12 brutal checks)
# data/ and archives/: 100% immune

fail_fast: true

# ===================================================================
# IMMUNE ZONES — NEVER TOUCHED BY ANY HOOK
# ===================================================================
exclude: |
  (?x)^(
    ^data/|
    ^archives/|
    ^__pycache__/
  )

repos:

  # ===================================================================
  # SOVEREIGN AUTO-PROMOTER — FINAL ETERNAL 2025
  # ===================================================================
  - repo: local
    hooks:
      - id: sovereign-auto-promoter-2025
        name: Sovereign Auto-Promoter — Eternal 2025 (auto-creates folders)
        entry: python scripts/sovereign_promoter_2025.py
        language: system
        files: \.py$
        stages: [pre-commit]
        verbose: true
        pass_filenames: true
        exclude: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config|data|archives)/

  # ===================================================================
  # 1. FULL 40/40 CANON — ALL SOVEREIGN CODE (L1/L2/L3 ONLY)
  # ===================================================================
  - repo: local
    hooks:
      - id: canon-40-keys
        name: 40/40 SUBATOMIC CANON — FULL ENFORCEMENT
        entry: python canon_validator.py --check-40 --hard-fail
        language: system
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: prevent-sovereign-delete
        name: SOVEREIGN CODE IS IMMORTAL — NO DELETE/RENAME
        entry: python scripts/track_changes.py
        language: system
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/
        pass_filenames: false

  # ===================================================================
  # 4. BREAKOUT MANAGEMENT SUITE — 2025 EDITION
  # Runs right after sovereign auto-promoter, before Light Canon
  # ===================================================================
  - repo: local
    hooks:
      # 1. Auto-create missing __init__.py in new directories
      - id: auto-init-py
        name: "[Breakout] Auto-create __init__.py in new packages"
        entry: python scripts/auto_init_py.py
        language: system
        files: ^.*/[^/]+\.py$
        stages: [pre-commit]
        pass_filenames: true

      # 2. Auto-sort imports (ruff) on every new/changed file
      - id: auto-sort-imports
        name: "[Breakout] Auto-sort imports with ruff"
        entry: ruff check --select I --fix
        language: system
        files: \.py$
        stages: [pre-commit]

      # 3. Auto-add file to correct pyproject.toml [tool.ruff] path list
      - id: auto-ruff-path
        name: "[Breakout] Auto-register new .py in pyproject.toml ruff paths"
        entry: python scripts/auto_ruff_path.py
        language: system
        files: \.py$
        stages: [pre-commit]

      # 4. Auto-name new files using verb_noun.py canon (e.g. retrieve_claims.py)
      - id: auto-verb-noun-naming
        name: "[Breakout] Enforce & auto-rename to verb_noun.py canon"
        entry: python scripts/enforce_verb_noun.py --auto-rename
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: true

      # 5. Auto-add new sovereign file to README table of contents
      - id: auto-update-readme-toc
        name: "[Breakout] Auto-update README.md sovereign TOC"
        entry: python scripts/update_readme_toc.py
        language: system
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/.*\.py$
        stages: [pre-commit]

      # 6. Auto-create companion test file for new sovereign modules
      - id: auto-create-test
        name: "[Breakout] Auto-create missing test_*.py for sovereign modules"
        entry: python scripts/auto_create_test.py
        language: system
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/.*\.py$
        stages: [pre-commit]

  # ===================================================================
  # 3. LIGHT CANON — 12 BRUTAL CHECKS FOR NON-SOVEREIGN CODE
  # Applies to: tests/, scripts/, runtime/, shared/, tools/, etc.
  # ===================================================================
  - repo: local
    hooks:
      # 1. No debug statements anywhere
      - id: light-no-debug
        name: LIGHT CANON — No print/pdb/breakpoint
        entry: >-
          python -c "
          import sys, re, pathlib
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(x in f.parts for x in ['data','archives','__pycache__','agentic_core','apps_lic','apps_rg','apps_shared','schemas','prompt_governance','observability','config']): continue
              c = f.read_text(errors='ignore')
              if re.search(r'\b(print\(|pdb\.|ipdb\.|breakpoint\(|set_trace)', c):
                  bad.append(str(f))
          if bad: print('DEBUG FOUND:\\n' + '\\n'.join(bad[:30])); sys.exit(1)
          "
        language: system
        files: \.py$
        pass_filenames: false

      # 2. No TODO/FIXME/XXX/HACK/STUB
      - id: light-no-todo
        name: LIGHT CANON — No TODO/FIXME/XXX
        entry: bash -c 'grep -rEI "(TODO|FIXME|XXX|HACK|STUB)" . --include="*.py" --exclude-dir={data,archives,__pycache__,agentic_core,apps_lic,apps_rg,apps_shared,schemas,prompt_governance,observability,config} && exit 1 || exit 0'
        language: system
        files: \.py$

      # 3. No files <150 bytes (except small __init__.py)
      - id: light-no-tiny-files
        name: LIGHT CANON — No micro-files
        entry: >-
          python -c "
          import sys, pathlib
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(x in f.parts for x in ['data','archives','__pycache__','agentic_core','apps_lic','apps_rg','apps_shared','schemas','prompt_governance','observability','config']): continue
              if f.name == '__init__.py' and f.stat().st_size < 100: continue
              if f.stat().st_size < 150: bad.append(f'{f}: {f.stat().st_size}B')
          if bad: print('TINY FILES:\\n' + '\\n'.join(bad[:30])); sys.exit(1)
          "
        language: system
        files: \.py$
        pass_filenames: false

      # 4. No pass-only functions/classes (except in tests)
      - id: light-no-pass-only
        name: LIGHT CANON — No pass-only definitions
        entry: >-
          python -c "
          import ast, sys, pathlib
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(x in f.parts for x in ['data','archives','tests','__pycache__','agentic_core','apps_lic','apps_rg','apps_shared','schemas','prompt_governance','observability','config']): continue
              try:
                  tree = ast.parse(f.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          if len(node.body) == 1 and isinstance(node.body[0], ast.Pass):
                              bad.append(f'{f}:{node.lineno} {node.name}')
              except: pass
          if bad: print('PASS-ONLY:\\n' + '\\n'.join(bad[:30])); sys.exit(1)
          "
        language: system
        files: \.py$
        pass_filenames: false

      # 5. No bare except: or except Exception:
      - id: light-no-bare-except
        name: LIGHT CANON — No bare except
        entry: bash -c 'grep -rEn "\\bexcept\\s*:" . --include="*.py" --exclude-dir={data,archives,__pycache__,agentic_core,apps_lic,apps_rg,apps_shared,schemas,prompt_governance,observability,config} && exit 1 || exit 0'
        language: system
        files: \.py$

      # 6. No secrets in non-sovereign code
      - id: light-no-secrets
        name: LIGHT CANON — No secrets outside sovereign dirs
        entry: detect-secrets scan --exclude-files '^data/|^archives/'
        language: python
        pass_filenames: false
        additional_dependencies: ["detect-secrets==1.5.0"]

      # 7. No zombie "archive/" folder (singular)
      - id: light-no-zombie-archive
        name: LIGHT CANON — Zombie archive/ forbidden
        entry: bash -c 'test ! -d archive || (echo "ZOMBIE archive/ DETECTED — ONLY archives/ ALLOWED" && exit 1)'
        language: system
        files: ^$
        pass_filenames: false

      # 8. LIGHT CANON — Max 3 levels deep outside the 8 sacred roots
      - id: light-no-deep-nesting
        name: LIGHT CANON — Max 3 levels deep in non-sovereign code
        entry: >-
          python -c "
          import sys, pathlib
          sovereign = {'agentic_core','apps_lic','apps_rg','apps_shared','schemas','prompt_governance','observability','config'}
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(part in sovereign for part in f.parts): continue
              if any(part in {'data','archives','__pycache__'} for part in f.parts): continue
              depth = len(f.parts) - 1
              if depth > 3:
                  bad.append(f'{f} (depth {depth})')
          if bad:
              print('DEEP NESTING FORBIDDEN (max depth 3 outside sovereign roots):\\n' + '\\n'.join(bad[:40]))
              sys.exit(1)
          "
        language: system
        files: \.py$
        pass_filenames: false

  # ===================================================================
  # 3. SOVEREIGN-ONLY QUALITY TOOLS
  # ===================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/
      - id: ruff-format
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/

  - repo: local
    hooks:
      - id: pyright-strict
        name: PYRIGHT — SOVEREIGN ONLY
        entry: pyright --verifytypes agentic_core apps_lic apps_rg apps_shared schemas prompt_governance observability config --ignoreexternal --level strict
        language: system
        pass_filenames: false

      - id: 100-percent-coverage
        name: 100% COVERAGE — SOVEREIGN ONLY
        entry: pytest --cov=agentic_core --cov=apps_lic --cov=apps_rg --cov=apps_shared --cov=schemas --cov=prompt_governance --cov=observability --cov=config --cov-fail-under=100 -q
        language: system
        pass_filenames: false
        require_serial: true

  # ===================================================================
  # 4. BASIC HYGIENE — EVERYWHERE EXCEPT IMMUNE ZONES
  # ===================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ===================================================================
  # 5. CUSTOM VALIDATION — PROJECT-SPECIFIC
  # ===================================================================
  - repo: local
    hooks:
      - id: validate-data-immortality
        name: Validate data immortality
        entry: python scripts/validate_data_immortality.py
        language: system
        always_run: true

      - id: check-canonical-structure
        name: Check canonical project structure
        entry: python scripts/check_canonical_structure.py
        language: system

      - id: validate-sdk-files
        name: Validate SDK files are executable
        entry: python scripts/validate_sdk_files.py
        language: system
        files: '^data/sdks_mcps/.*\.py$'

  # ===================================================================
  # AUTO-UPDATE GITHUB README — SOVEREIGN COMMITS ONLY
  # Updates README.md and stages it (NO git commit inside hook - avoids recursion)
  # ===================================================================
  - repo: local
    hooks:
      - id: update-main-readme
        name: AUTO-UPDATE README ON SOVEREIGN CHANGES
        entry: python scripts/update_readme.py
        language: system
        files: ^(agentic_core|apps_lic|apps_rg|apps_shared|schemas|prompt_governance|observability|config)/
        pass_filenames: false
        stages: [pre-commit]

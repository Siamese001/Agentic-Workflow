# .pre-commit-config.yaml — FINAL 2025
fail_fast: true

# CANON 2025 — 40 KEYS APPLY ONLY TO SOVEREIGN CODE
# Everything else is either immutable data or dead history
exclude: |
  (?x)^(
    ^data/|
    ^archives/|
    ^tests/|
    ^scripts/|
    ^runtime/|
    ^legacy/|
    \.git/|
    __pycache__/
  )

repos:
  # Python code quality
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  # Security and dependency checks
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-r, ., -f, json, -o, bandit-report.json]
        exclude: ^tests/

  - repo: https://github.com/pycqa/safety
    rev: 3.2.4
    hooks:
      - id: safety
        args: [--json, --output, safety-report.json]

  # YAML and JSON validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Documentation quality
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  # Import sorting and cleanup
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: [--in-place, --remove-all-unused-imports, --remove-unused-variables, --remove-duplicate-keys]

  # Jupyter notebook quality
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.8.7
    hooks:
      - id: nbqa-black
      - id: nbqa-isort
      - id: nbqa-flake8

  # Shell script quality
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Dockerfile validation
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # Commit message quality
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # License header check
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-no-executable
      - id: check-shebang-scripts-are-executable

  # Custom project validation
  - repo: local
    hooks:
      - id: canon-validator-40-keys
        name: Canon Validator 40 Keys (Sovereign Code Only)
        entry: python canon_validator.py --check-40
        language: system
        always_run: true
        pass_filenames: false

      - id: validate-data-immortality
        name: Validate data immortality
        entry: python scripts/validate_data_immortality.py
        language: system
        pass_filenames: true

      - id: check-canonical-structure
        name: Check canonical project structure
        entry: python scripts/check_canonical_structure.py
        language: system
        always_run: true

      - id: validate-sdk-files
        name: Validate SDK files are executable
        entry: python scripts/validate_sdk_files.py
        language: system
        files: '^data/sdks_mcps/.*\.py$'

# Configuration for specific hooks
default_language_version:
  python: python3.11

# Global configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false

# .pre-commit-config.yaml
# STREAMLINED: Normalize -> Syntax Gate -> Auto-Fix -> Format -> Analysis -> Structural -> Cleanup
# Order of operations:
#   0. normalize     — CRLF/LF, trailing whitespace, EOF (deterministic, no churn)
#   1. py_compile    — fastest gate, catches broken syntax immediately
#   2. ruff --fix    — auto-fix lint issues (imports, unused vars, etc.)
#   3. ruff-format   — normalize style on clean code
#   4. anti-patterns — logic analysis runs on already-fixed/formatted code
#   5. report-loc    — structural SSOT check (independent of code content)
#   6. guard         — reject generated artifacts that got re-tracked
#   7. purge-cache   — cleanup, always last

fail_fast: true
default_language_version:
  python: python3.12

repos:
  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0: Trailing Whitespace"
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
      - id: end-of-file-fixer
        name: "T0: End-of-File Fixer"
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
      - id: mixed-line-ending
        name: "T0: Enforce LF Line Endings"
        args: [--fix=lf]
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
      - id: check-merge-conflict
        name: "T0: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: python -m py_compile
        language: system
        types: [python]
        require_serial: true
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)

  # ============================================================================
  # TIER 2: Auto-Fixers & Formatters (clean code before analysis)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: "T2: Ruff Lint & Auto-Fix"
        args: [--fix]
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*|ops_scripts/ci/check_anti_patterns.py)
      - id: ruff-format
        name: "T2: Ruff Format"
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)

  # ============================================================================
  # TIER 3: Logic Analysis & Structural Checks (on cleaned code)
  # ============================================================================
  - repo: local
    hooks:
      - id: check-anti-patterns
        name: "T3: Anti-Pattern Landmine Detection"
        entry: python ops_scripts/ci/check_anti_patterns.py
        language: system
        types: [python]
        require_serial: true
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*|ops_scripts/ci/check_anti_patterns.py)

      - id: check-report-location
        name: "T3: Report Location SSOT Check"
        entry: python ops_scripts/hooks/validate_report_location.py --staged-only
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 4: Generated-Artifact Tracking Guard
  # ============================================================================
      - id: reject-generated-artifacts-tracked
        name: "T4: Reject Tracked Generated Artifacts"
        entry: python ops_scripts/hooks/reject_tracked_generated_artifacts.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 5: Cleanup (always runs last)
  # ============================================================================
      - id: purge-cache
        name: "T5: Pycache Purge"
        entry: python ops_scripts/maintenance/purge_cache.py --quiet
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

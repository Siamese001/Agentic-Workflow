# .pre-commit-config.yaml
# STREAMLINED: Normalize -> Syntax Gate -> Auto-Fix -> Format -> Ratchets -> Structural -> ADG -> Cleanup
# Order of operations:
#   T0-guard  hitl     — commit-msg: require HITL-APPROVED when new guardian exemptions added
#   T0   normalize    — CRLF/LF, trailing whitespace, EOF (deterministic, no churn)
#   T1   py_compile   — fastest gate, catches broken syntax immediately
#   T2a  ruff --fix   — auto-fix lint issues (imports, unused vars, etc.)
#   T2b  ruff-format  — normalize style on clean code (separate from lint; both required)
#   T2c  guardian-fix — canonicalize guardian comment format in staged files
#   T3a  burndown     — unified anti-pattern ratchet (new pairs blocked; counts only decrease)
#   T3b  report-loc   — structural SSOT path check (no ADG dependency; fast)
#   T3c  guard        — reject generated artifacts that got re-tracked (no ADG dependency; fast)
#   T3d  tooling-bnd  — tooling/apps_* boundary guard, ops_scripts/ci must not import apps_* (no ADG dependency)
#   T3f  module-coll  — architectural module collision check (no ADG dependency)
#   T3g  adg-stale    — ADG Redis cache freshness warning
#   T3h  grep-ban     — hard-fail if staged files use grep/rg as ADG substitute
#   T5   purge-cache  — cleanup, always last
#
# NOTE: T3a–T3d share a single `repo: local` block. Tier labels in comments
#       are logical groupings; YAML structure groups them under one repo entry.
#
# NOTE: `default_language_version` applies to hooks with `language: python`
#       (virtualenv-based). All local hooks here use `language: system` and
#       inherit the ambient Python; the setting below governs remote hooks only.

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
# Excludes artifacts that change on every hook run to prevent infinite loops
# Synchronized with .gitignore to ensure consistency
exclude: |
  (?x)^(
    archives/.*|
    \.sovereign_healing_backup/.*|
    \.healing_backups/.*|
    artifacts/migration/.*|
    artifacts/adg_ci_lane_gate_result\.json|
    artifacts/healing/healing_events\.jsonl|
    artifacts/bypass_audit\.jsonl|
    artifacts/import_health/import_health_report\.json|
    artifacts/windsurf/.*\.(txt|out|typed|emitted|commit.*|acceptance.*|det.*|neg.*)|
    temp_[^/]*/.*|
    tmp.*|
    _temp_cmd.*|
    _out_.*|
    _typed_.*|
    _typed_emitted_.*|
    _rebuild_.*|
    _selfcheck_.*|
    _run_.*|
    _capture_.*|
    _make_.*|
    \.tmp/.*|
    runtime_state.*\.json|
    temp_complete_rules.*\.md|
    guardian_.*\.(txt|json)|
    .*\.debug\.log|
    pytestdebug\.log|
    \.tmp_.*sites\.txt|
    .*_sites\.txt|
    0[0-9]_[^/]*/.*|
    core/.*|
    coverage_html/.*|
    \.test_artifacts/.*|
    \.backup/guardian_tests/.*|
    v15_d_evidence_.*\.json|
    v15_p2_evidence_temp\.json|
    v15_d_inventory_p4\.json|
    .*/logs/.*|
    docs/store/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.ruff_cache/.*|
    \.mypy_cache/.*
  )

repos:
  # ============================================================================
  # TIER 0-ADG: ADG Phase Gate (§ADG-1 — must run FIRST, before all else)
  # Blocks full-suite pytest during PHASE 5-6 repair loops.
  # Only passes in PHASE 7+ or when artifacts/adg_current_phase.json says so.
  # ============================================================================
  - repo: local
    hooks:
      - id: auto-stage-untracked
        name: "T0-stage: Auto-Stage Untracked Files"
        entry: python ops_scripts/hooks/auto_stage_untracked.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: adg-phase-gate
        name: "T0-ADG: ADG Repair Phase Gate (§ADG-1.2)"
        entry: python tools/adg_ci_gate.py check-phase
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: guard-no-verify
        name: "T0-guard: No-Verify Bypass Authorization"
        entry: python ops_scripts/ci/guard_no_verify.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [commit-msg]

      - id: guard-guardian-hitl
        name: "T0-guard: HITL Authorization for New Guardian Exemptions (§8.5.2)"
        entry: python ops_scripts/ci/guard_guardian_hitl.py
        language: system
        pass_filenames: true
        always_run: true
        require_serial: true
        stages: [commit-msg]

      - id: guard-agent-deletion
        name: "T0-guard: Agent Deletion Authorization"
        entry: python ops_scripts/ci/guard_agent_deletion.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0: Trailing Whitespace"
      - id: end-of-file-fixer
        name: "T0: End-of-File Fixer"
      - id: mixed-line-ending
        name: "T0: Enforce LF Line Endings"
        args: [--fix=lf]
      - id: check-merge-conflict
        name: "T0: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: python -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 2: Auto-Fixers & Formatters (clean code before analysis)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: "T2a: Ruff Lint & Auto-Fix"
        args: [--fix]
        exclude: ops_scripts/ci/check_anti_patterns\.py
      - id: ruff-format
        name: "T2b: Ruff Format"
        exclude: ops_scripts/ci/check_anti_patterns\.py

  # ============================================================================
  # TIER 2 (continued): ADG Accelerator Auto-Fixers
  # Runs after ruff-format so formatting is canonical before guardian fixes.
  # ============================================================================
  - repo: local
    hooks:
      # -- T2c: Guardian Comment Auto-Fix (Accelerator #1) ----------------------
      # Fixes non-canonical guardian comment format in staged files.
      # Canonical form: # guardian: allow-<type> -- <justification>
      # No Redis dependency — runs on raw source. Always exit 0 (auto-fixer).
      - id: guardian-comment-fixer
        name: "T2c: Guardian Comment Auto-Fix (Accelerator #1)"
        entry: python tools/adg/adg_antipattern_fixer.py --staged
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 3: Logic Analysis, Structural Checks, Guard & Cleanup (local hooks)
  # All hooks below share this single `repo: local` block.
  # ============================================================================
  - repo: local
    hooks:
      # -- T3a-gates: Wave 0 ADG CI Delta Gates (M1-M6) -------------------------
      # Six delta gates from Plan Hardening Addendum. Warn mode by default;
      # flip to enforce via: python ops_scripts/ci/_adg_ci_gates.py --set-enforce M1,M2,M3
      - id: adg-ci-gates
        name: "T3a-gates: ADG CI Delta Gates (Wave 0 M1-M6)"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/_adg_ci_gates.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3a-exemption: Guardian Exemption Quality Ratchet --------------------
      # Closes the scanner blind spot: burndown gate only counts unwhitelisted
      # violations; once a guardian comment is added the violation is invisible.
      # Rule 1 (zero-tolerance): every guardian comment MUST have -- <justification>.
      # Rule 2 (ratchet): exemption counts in production code may only decrease.
      # Init:  ADG_EXEMPTION_INIT=1 python ops_scripts/ci/guardian_exemption_gate.py
      - id: guardian-exemption-gate
        name: "T3a-exemption: Guardian Exemption Quality Ratchet"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/guardian_exemption_gate.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3a: Unified ADG Anti-Pattern Burndown Ratchet -----------------------
      # Single scan enforces both Rule 1 (no new file+category pairs) and
      # Rule 2 (existing counts may only decrease). Supersedes check_anti_patterns.py.
      - id: adg-burndown-gate
        name: "T3a: ADG Anti-Pattern Burndown Ratchet"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_burndown_gate.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        exclude: (ops_scripts/ci/adg_burndown_gate\.py|ops_scripts/.*|tests/.*|__pycache__/.*|\.nox/.*|archives/.*|\.backup/.*)

      # -- T3a-c0: C0 Sovereignty Guardian (embedding must not drive routing) -----
      # OPTIMIZED: Run manually or in CI only - not needed for every local commit
      - id: check-c0-sovereignty
        name: "T3a-c0: C0 Sovereignty — Embedding Boundary Enforcement"
        entry: cmd /c "set PYTHONPATH=.&& python agentic_core/L0_routing/scripts/run_guardian_c0_sovereignty.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3a-dedup: Dedup Guard (prevent duplicate symbols) -------------------
      # OPTIMIZED: Run manually or in CI only - not needed for every local commit
      - id: check-dedup-violations
        name: "T3a-dedup: Dedup Guard — Prevent Duplicate Symbols"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_dedup_violations.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3a-sprawl: Script Sprawl Guard (block new runner scripts) -----------
      # OPTIMIZED: Run manually or in CI only - not needed for every local commit
      - id: check-script-sprawl
        name: "T3a-sprawl: Script Sprawl Guard — Block New Runners"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_script_sprawl.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3a-shim: Shim Discipline (backward-compatibility enforcement) -------
      # OPTIMIZED: Run manually or in CI only - not needed for every local commit
      - id: check-shim-discipline
        name: "T3a-shim: Shim Discipline — Backward-Compatibility"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_shim_discipline.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3a-rollback: Rollback Gate (multi-file phase checkpoints) -----------
      # OPTIMIZED: Run manually or in CI only - not needed for every local commit
      - id: check-rollback-checkpoints
        name: "T3a-rollback: Rollback Gate — Phase Checkpoints"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_rollback_checkpoints.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # -- T3b: Report location SSOT (staged-only, structural) ------------------
      - id: check-report-location
        name: "T3b: Report Location SSOT Check"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/hooks/validate_report_location.py --staged-only"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3c: Generated-artifact tracking guard -------------------------------
      # Rejects commits if git tracks any of:
      #   **/guardian_report.json, **/.core_golden_seal, v15_d_evidence_*.json
      # On failure: prints tracked paths + exact `git rm --cached` fix.
      - id: reject-generated-artifacts-tracked
        name: "T3c: Reject Tracked Generated Artifacts"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/hooks/reject_tracked_generated_artifacts.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3d: Tooling/Apps Boundary Guard (§8.3) ---------------------------------
      # tools/evidence and ops_scripts/ci must not import apps_* runtime modules.
      # Tooling must remain pure — apps_* only referenced as strings/paths.
      - id: check-tooling-apps-boundary
        name: "T3d: Tooling/Apps Boundary Guard (§8.3)"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/check_tooling_apps_boundary.py"
        language: system
        pass_filenames: false
        always_run: false
        types: [python]
        require_serial: true

      # -- T3f: Module Collision Guard (architectural enforcement) ----------------
      # Scope: Detect duplicate modules, logical import paths, case collisions
      # Blocks commits that violate architectural module integrity
      - id: module-collision-guard
        name: "T3f: Module Collision Guard"
        entry: cmd /c "set PYTHONPATH=.&& python agentic_core/L5_safety/enforcement/module_collision_guardrail.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3g: ADG Staleness Guard (Accelerator #2) ----------------------------
      # Warns when ADG Redis cache is stale vs. latest Python commits.
      # --warn mode: always exits 0 (non-blocking); works without Redis in CI.
      # Developers: run without --warn to get exit-1 enforcement locally.
      - id: adg-stale-guard
        name: "T3g: ADG Staleness Guard (Accelerator #2)"
        entry: python tools/adg/adg_stale_guard.py --warn
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T3h: ADG Grep-Ban Gate (Accelerator enforcement) ---------------------
      # Hard-fail if staged Python files use grep/rg/ripgrep as ADG substitutes.
      # Exempt a specific line with: # guardian: allow-grep -- <justification>
      # Exempt an entire file with: # adg-grep-ban: skip-file (first 5 lines)
      - id: adg-grep-ban-gate
        name: "T3h: ADG Grep-Ban Gate — no grep/rg as ADG fallback"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_grep_ban_gate.py --staged"
        language: system
        pass_filenames: false
        always_run: false
        types: [python]
        require_serial: true

      # -- T3i: ADG Mypy-Ban Gate (Accelerator enforcement) ---------------------
      # Hard-fail if staged Python files invoke mypy directly via subprocess.
      # Only adg_type_check.py (via sys.executable) is allowed to call mypy.
      # Exempt a specific line with: # guardian: allow-mypy -- <justification>
      # Exempt an entire file with: # adg-mypy-ban: skip-file (first 5 lines)
      - id: adg-mypy-ban-gate
        name: "T3i: ADG Mypy-Ban Gate — no broad mypy; use adg_type_check.py"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_mypy_ban_gate.py --staged"
        language: system
        pass_filenames: false
        always_run: false
        types: [python]
        require_serial: true

      # -- T3k: ADG Pytest-Ban Gate (Accelerator enforcement) -------------------
      # Hard-fail if staged Python files invoke pytest broadly (directory/no files).
      # Use adg_test_selector.py --from-diff --pytest-args to select via ADG.
      # Exempt a specific line with: # guardian: allow-pytest -- <justification>
      - id: adg-pytest-ban-gate
        name: "T3k: ADG Pytest-Ban Gate — no broad pytest; use adg_test_selector.py"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_pytest_ban_gate.py --staged"
        language: system
        pass_filenames: false
        always_run: false
        types: [python]
        require_serial: true

      # -- T3l: ADG YAML Grep-Ban Gate ------------------------------------------
      # Hard-fail if staged YAML workflow files invoke grep/rg in run: steps.
      # Use Python-based ADG accelerators or explicit Python scripts instead.
      # Exempt a line with: # guardian: allow-grep-yaml -- <justification>
      - id: adg-yaml-grep-ban-gate
        name: "T3l: ADG YAML Grep-Ban Gate — no grep/rg in GitHub Actions run: steps"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_yaml_grep_ban_gate.py --staged"
        language: system
        pass_filenames: false
        always_run: false
        types: [yaml]
        require_serial: true

      # -- T3j: Skip-File Ratchet -----------------------------------------------
      # Hard-fail if new # adg-grep-ban: skip-file directives were added without
      # updating the baseline in ops_scripts/hooks/skip_file_budget.json.
      # To legitimately add: run python ops_scripts/ci/adg_skip_file_ratchet.py --update
      - id: adg-skip-file-ratchet
        name: "T3j: ADG Skip-File Ratchet — enforce skip-file directive count ceiling"
        entry: cmd /c "set PYTHONPATH=.&& python ops_scripts/ci/adg_skip_file_ratchet.py"
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      # -- T5: Pycache purge (FINAL CLEANUP - runs last) ------------------------
      # Scope: rglob("__pycache__") from repo root, skips .venv/env/.git.
      # CRITICAL: Must run AFTER all Python hooks to prevent __pycache__ litter.
      # Idempotent: deleting absent dirs is a no-op; --quiet suppresses output.
      - id: purge-cache
        name: "T5: Pycache Purge (Final Cleanup)"
        entry: python ops_scripts/maintenance/purge_cache.py --quiet --all
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

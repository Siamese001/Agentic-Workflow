# .pre-commit-config.yaml
#
# DESIGN PRINCIPLE: staged-file-only checks. No whole-repo scans.
# No always-run hooks without types/files scope. No warn-only gates.
# Heavy structural/ADG checks (module collision, guardian ratchet) → CI.
#
# Commit pipeline:
#   T0a  trailing-whitespace                — deterministic, no Python startup
#   T0b  end-of-file-fixer                  — deterministic, no Python startup
#   T0c  enforce LF line endings            — deterministic, no Python startup
#   T0d  check merge conflict markers       — deterministic, no Python startup
#   T1   py_compile                         — fastest syntax fail
#   T2   ruff-format                        — auto-fixer first (eliminates retry loop)
#   T3   guardian-comment-fixer             — staged Python files only
#   T6   pytest-config-ssot                 — triggered by pytest.ini/pyproject.toml only
#
# Manual/CI lane (stages: [manual]):
#   adg-stale-guard, check-c0-sovereignty
#
# NOTE: `default_language_version` applies to hooks with `language: python`
#       (virtualenv-based). All local hooks here use `language: system` and
#       inherit the ambient Python; the setting below governs remote hooks only.

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
# Excludes artifacts that change on every hook run to prevent infinite loops
# Synchronized with .gitignore to ensure consistency
# Generated from config/excluded_paths.yaml
# Do not edit manually - run: python tools/generate/gitignore.py --write-precommit
# Last generated: 2026-04-06T05:27:34.834350
exclude: |
  (?x)^(
    .*\.debug\.log|
    .*/logs/.*|
    .*_sites\.txt|
    .tmp/.*|
    .tmp_.*sites\.txt|
    0[0-9]_[^/]*/.*|
    _capture_.*|
    _make_.*|
    _out_.*|
    _rebuild_.*|
    _run_.*|
    _selfcheck_.*|
    _temp_cmd.*|
    _typed_.*|
    _typed_emitted_.*|
    docs/store/.*|
    guardian_.*\.(txt|json)|
    pytestdebug\.log|
    runtime_state.*\.json|
    temp_[^/]*/.*|
    temp_complete_rules.*\.md|
    tmp.*
  )

repos:
  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0a: Trailing Whitespace"
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        name: "T0b: End-of-File Fixer"
        exclude: '.*\.md$'
      - id: mixed-line-ending
        name: "T0c: Enforce LF Line Endings"
        args: [--fix=lf]
        exclude: '.*\.md$'
      - id: check-merge-conflict
        name: "T0d: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: py -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 3: Ruff Format (before governance — eliminates retry loop)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-format
        name: "T2: Ruff Format"
        exclude: '.*\.md$|ops_scripts/ci/check_anti_patterns\.py'

  # ============================================================================
  # TIER 3: Guardian Comment Auto-Fix (staged Python only)
  # ============================================================================
  - repo: local
    hooks:
      - id: guardian-comment-fixer
        name: "T3: Guardian Comment Auto-Fix"
        entry: py tools/adg/adg_antipattern_fixer.py --staged
        language: system
        pass_filenames: false
        always_run: false
        require_serial: true
        types: [python]

  # ============================================================================
  # TIER 4+: Structural checks, config validation, style (staged-file-only)
  # ============================================================================
  - repo: local
    hooks:


      # -- T6: Pytest Config SSOT Gate -------------------------------------------------
      - id: pytest-config-ssot
        name: "T6: Pytest Config SSOT"
        entry: py ops_scripts/ci/_validate_pytest_config.py --strict
        language: system
        pass_filenames: false
        files: ^(pytest\.ini|pyproject\.toml)$
        always_run: false
        require_serial: true

      # -- T6b: MCP Config Sync Integrity ----------------------------------------------
      - id: mcp-sync-integrity
        name: "T6b: MCP Sync Integrity"
        entry: py ops_scripts/ci/check_mcp_sync_integrity.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md|\.windsurf/scripts/(sync_mcp_config|post_write_mcp_config_sync|pre_prompt_classifier)\.py)$
        always_run: false
        require_serial: true

      # -- T6c: AGENTS.md MCP Coverage --------------------------------------------------
      # Ensures every `mcpServers` key in mcp_config.json has a row in the
      # AGENTS.md MCP Quick Reference table. Complements T6b (strict integrity):
      # T6b checks content, T6c checks coverage. Both are cheap (no subprocess).
      - id: agents-mcp-coverage
        name: "T6c: AGENTS.md MCP Coverage"
        entry: py ops_scripts/ci/check_agents_mcp_coverage.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md)$
        always_run: false
        require_serial: true

      # -- T6d: AGENTS.md Autogen Block Integrity --------------------------------------
      # Validates every <!-- MARKER:START/END --> autogen block in AGENTS.md is
      # byte-identical to the SSOT generator output. Currently covers:
      #   - MCP-QUICK-REFERENCE (mcp_config.json)
      #   - NOTION-MAP          (config/notion_databases.yaml)
      # Fix drift: `python .windsurf/scripts/sync_mcp_config.py`
      - id: agents-md-autogen-sync
        name: "T6d: AGENTS.md Autogen Sync"
        entry: py ops_scripts/ci/check_agents_md_sync.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md|config/notion_databases\.yaml|\.windsurf/scripts/sync_mcp_config\.py)$
        always_run: false
        require_serial: true

      # T6h RETIRED 2026-04-19 (L2 consolidation): .codeiumignore eliminated.

      # -- T6g: Hardcoded Exclusion Ratchet (R3) ---------------------------------------
      # Detects Python set/frozenset literals containing 3+ canonical exclusion tokens
      # (".git", "__pycache__", "node_modules", "archives", etc.) outside the SSOT
      # modules. Ratchet mode: only NET-NEW shadow sets fail; baseline of 37 known
      # violations is tracked in ops_scripts/ci/baselines/hardcoded_exclusions_baseline.json
      # for burndown. To refresh baseline after fixing one:
      #     python ops_scripts/ci/check_hardcoded_exclusions.py --refresh-baseline
      - id: hardcoded-exclusions
        name: "T6g: Hardcoded Exclusion Ratchet"
        entry: py ops_scripts/ci/check_hardcoded_exclusions.py
        language: system
        pass_filenames: false
        files: ^(agentic_core/.*\.py|apps_[^/]+/.*\.py|ops_scripts/.*\.py|tools/.*\.py|\.windsurf/scripts/.*\.py|ops_scripts/ci/check_hardcoded_exclusions\.py|ops_scripts/ci/baselines/hardcoded_exclusions_baseline\.json)$
        always_run: false
        require_serial: true

      # -- T6f: Exclusion Consistency (R2) ---------------------------------------------
      # Validates that YAML mirror categories (sovereign_excluded_folders,
      # global_excluded_dirs, discovery_excluded_territories) are byte-equal to the
      # Python frozensets in agentic_core/L0_routing/config/path_constants.py.
      # Fix drift by editing whichever surface is wrong; the gate does not auto-fix.
      - id: exclusion-consistency
        name: "T6f: Exclusion YAML <-> Python Consistency"
        entry: py ops_scripts/ci/check_exclusion_consistency.py
        language: system
        pass_filenames: false
        files: ^(config/excluded_paths\.yaml|agentic_core/L0_routing/config/path_constants\.py|ops_scripts/ci/check_exclusion_consistency\.py)$
        always_run: false
        require_serial: true

      # -- T7a: Governed-App Conformance ------------------------------------------------
      # Validates apps_* packages against the governed-app contract:
      # runner subclass, capability token, exception entries, APP_REGISTRY coverage.
      # Triggers on apps_* package changes or registry edits.
      - id: governed-app-conformance
        name: "T7a: Governed-App Conformance"
        entry: py ops_scripts/ci/check_governed_app_conformance.py
        language: system
        pass_filenames: false
        files: ^(apps_[^/]+/.*\.py|apps_shared/integrations/app_registry\.py)$
        always_run: false
        require_serial: true

      # -- T7b: Structure Policy --------------------------------------------------------
      # Validates the repository directory structure against
      # config/structure_blueprint/structure_policy.yaml. Triggers only when the
      # policy itself changes (cheap — full check is policy-driven, not per-file).
      - id: structure-policy
        name: "T7b: Structure Policy"
        entry: py ops_scripts/ci/check_structure_policy.py
        language: system
        pass_filenames: false
        files: ^config/structure_blueprint/structure_policy\.yaml$
        always_run: false
        require_serial: true

      # -- T7c: HITL Packet Format ------------------------------------------------------
      # Validates ask_user_question packet shape in rule/doc files:
      # confidence scores, dominance markers, option format. Triggers on HITL rule
      # files and packet documentation only.
      - id: hitl-format
        name: "T7c: HITL Packet Format"
        entry: py ops_scripts/ci/validate_hitl_format.py
        language: system
        files: ^\.windsurf/rules/(hitl-|.*hitl).*\.md$
        always_run: false
        require_serial: true

      # -- T7e: HITL Rules Corpus Validator ---------------------------------------------
      # Validates the HITL rule *corpus* (all 4 files together): §HITL-9 threshold
      # config, §HITL-10 option shape, forbidden 2-4-count patterns, and required
      # pipeline patterns. The validator was refactored 2026-04-19 to accept the
      # post-consolidation split layout (enforcement.md + decision-points.md +
      # svp-calibration.md + anti-pattern-hitl-gate.md). Triggers on any HITL file
      # change; passes all 4 files together so corpus-level checks work.
      - id: hitl-rules-corpus
        name: "T7e: HITL Rules Corpus"
        entry: py ops_scripts/ci/validate_hitl_rules.py .windsurf/rules/hitl-enforcement.md .windsurf/rules/hitl-decision-points.md .windsurf/rules/hitl-svp-calibration.md .windsurf/rules/anti-pattern-hitl-gate.md
        language: system
        pass_filenames: false
        files: ^\.windsurf/rules/(hitl-|anti-pattern-hitl).*\.md$
        always_run: false
        require_serial: true

      # -- T7d: Query Progress Bar (§16) ------------------------------------------------
      # Enforces Constitutional §16 (progress bars on operations >30s, proxied
      # by loop/function body >50 lines). All 8 pre-existing violations triaged
      # and resolved on 2026-04-19 (2 real tqdm wraps, 6 compliance comments
      # documenting bounded-small-n exemptions). Safe to block commits.
      - id: query-progress-bar
        name: "T7d: Query Progress Bar (§16)"
        entry: py ops_scripts/ci/check_query_progress_bar.py --staged
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        require_serial: true

      # NOTE: infra_wiring_scan.py NOT wired — 5 pre-existing violations (google,
      # chromadb, sqlite3 direct imports) need remediation first. Wired at
      # `stages: [manual]` below for on-demand audit.

      # ---- MANUAL / CI-ONLY LANE -----------------------------------------------
      # Run manually: pre-commit run <id> --hook-stage manual
      - id: adg-stale-guard
        name: "CI: ADG Staleness Guard"
        entry: py tools/adg/adg_stale_guard.py --warn
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      - id: check-c0-sovereignty
        name: "CI: C0 Sovereignty"
        entry: py agentic_core/L0_routing/scripts/run_guardian_c0_sovereignty.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # Raw infra import hygiene — run on demand until 5 direct-import sites
      # (google, chromadb, sqlite3) are remediated through sanctioned adapters.
      # Invoke: pre-commit run infra-wiring --hook-stage manual --all-files
      - id: infra-wiring
        name: "CI: Infrastructure Wiring Scan"
        entry: py ops_scripts/ci/infra_wiring_scan.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

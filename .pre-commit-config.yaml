# .pre-commit-config.yaml
# MINIMAL: Only essential fast checks
# Comprehensive validation moved to Guardian tests/CI

repos:
  # ============================================================================
  # TIER 1: Essential Linting and Formatting (Staged Files Only)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: Ruff (Lint)
        args: [--fix, --select, "F,E"]  # Only critical errors (Pyflakes + Error)
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
        # Only runs on staged files - no repo-wide scanning
      - id: ruff-format
        name: Ruff (Format)
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
        # Only runs on staged files - no repo-wide scanning
        # RCA FIX: Standard ruff-format - verify script will catch uncommitted changes

  # ============================================================================
  # TIER 2: Repository Hygiene
  # ============================================================================
  - repo: local
    hooks:
      # Note: Constitutional base agent check moved to Guardian tests
      # Pre-commit should be minimal - comprehensive validation in Guardian/CI
      
      - id: purge-cache
        name: Pycache Purge
        entry: python ops_scripts/maintenance/purge_cache.py --quiet
        language: python
        pass_filenames: false
        always_run: true
        # Enforces repository hygiene by purging all __pycache__ folders before commit.

      # RCA FIX: Verify no uncommitted changes after all hooks run
      - id: verify-clean-commit
        name: Verify Clean Commit (RCA Fix)
        entry: python verify_clean_commit.py
        language: system
        pass_filenames: false
        always_run: true
        # Ensures pre-commit hooks don't leave uncommitted changes (RCA from UNCOMMITTED_CHANGES_RCA.md)

      # SSOT Enforcement: Check report locations
      - id: check-report-location
        name: Check Report Location (SSOT)
        entry: python scripts/hooks/validate_report_location.py --staged-only
        language: system
        pass_filenames: false
        always_run: true
        # Enforces SSOT compliance by ensuring all reports are in docs/reports/

      # Phase 2 Landmine Detection: Anti-pattern scanning
      - id: check-anti-patterns
        name: Check Anti-Patterns (Phase 2 Landmines)
        entry: python ops_scripts/ci/check_anti_patterns.py
        language: system
        types: [python]
        exclude: ^(archives/.*|tests/.*|\.sovereign_healing_backup/.*)
        # Detects Phase 2 anti-patterns: silent swallowers, type erasure, path fragility, magic config, global mutation
        # Warning mode by default - add '# guardian: allow-<pattern>' to whitelist

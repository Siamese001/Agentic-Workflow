repos:
  # ============================================================================
  # TIER 0: Standard Hygiene (Prevent bloat, secrets, and basic issues)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Jan 2026 Stability Release
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace

      - id: end-of-file-fixer
        name: Fix End of Files (POSIX compliance)

      - id: check-yaml
        name: Check YAML Syntax

      - id: check-added-large-files
        name: Block Large Files (>500KB prevents .archive bloat)
        args: ['--maxkb=500']

      - id: check-merge-conflict
        name: Check for Merge Conflict Markers

      - id: check-json
        name: Check JSON Syntax

      - id: check-toml
        name: Check TOML Syntax

      - id: detect-private-key
        name: Detect Private Keys (Defense-in-depth)
        exclude: ^(tests/security/.*|agentic_core/L5_safety/validators/CredentialScannerAgent\.py|agentic_core/L5_safety/guardrails/membrane\.py)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0 # Updated for 2026 API token patterns
    hooks:
      - id: detect-secrets
        name: Detect Secrets (Prevent API keys in audit logs)
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(\.secrets\.baseline|tests/.*|stubs/.*|data/output/.*\.json|data/freeze_reports/.*\.json|archives/.*)$

  # ============================================================================
  # TIER 1: Linting & Type Safety (Catch UnboundLocalError, unused imports)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13  # Jan 2026 Latest
    hooks:
      - id: ruff
        name: Ruff Linter (Security, Bugs, and Modernization)
        args: [--fix, --select, "F,E,W,B,S,UP", --ignore, "S101"] # S101 ignored to allow asserts in tests
        types: [python]

      - id: ruff-format
        name: Ruff Formatter
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1  # Restore target 2026 version
    hooks:
      - id: mypy
        name: Mypy Type Checker (Hardened Agent Safety)
        args: [--ignore-missing-imports, --strict]
        additional_dependencies: [types-requests, types-PyYAML, types-toml] # Specific stubs avoid dependency conflicts
        types: [python]
        exclude: ^(tests/|scripts/|stubs/)

  # ============================================================================
  # TIER 2: Project-Specific Safety Checks (Windows-Compatible)
  # ============================================================================
  - repo: local
    hooks:
      - id: check-agent-duplicates
        name: Check for Agent Duplicate Filenames
        entry: python
        args: [scripts/maintenance/check_duplicate_filenames.py]
        language: python
        pass_filenames: false
        always_run: true

      - id: check-deprecated-imports
        name: Check for Deprecated Agent Imports
        entry: pytest
        args: [tests/infrastructure/test_agent_consolidation_hardening.py::TestConsolidationStaticAnalysis, -v, --tb=short]
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        always_run: true

      - id: check-heal-schema-compliance
        name: Check @standard_heal Schema Compliance
        entry: python
        args: [scripts/maintenance/check_heal_schema_compliance.py, --strict]
        language: python
        pass_filenames: false
        always_run: true

      - id: check-protected-files
        name: Gatekeeper Protection (Block ArchivalGatekeeper.py changes)
        entry: python
        args: [scripts/maintenance/check_protected_files.py]
        language: python
        pass_filenames: false
        always_run: true

      - id: gatekeeper-security-lock
        name: Gatekeeper Security Lock (Requires [SECURITY-OVERRIDE])
        entry: python
        args: [scripts/security/gatekeeper_lock.py]
        language: python
        pass_filenames: false
        always_run: true

      - id: test-hygiene-consolidation
        name: Test Hygiene Consolidation (Survivor Agent Protection)
        entry: pytest
        args: [tests/L5_safety/test_hygiene_consolidation.py, -v, --tb=short]
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        always_run: true

      - id: ssot-folder-structure
        name: SSOT Folder Structure
        entry: python -m agentic_core.L5_safety.validators.ssot_folder_check
        language: python
        types: [python]
        pass_filenames: false
        additional_dependencies: []

      - id: sovereign-lockdown-verification
        name: Sovereign Lockdown Verification (Phase 7)
        entry: python
        args: [scripts/ci/sovereign_lockdown_check.py]
        language: python
        pass_filenames: false
        always_run: true

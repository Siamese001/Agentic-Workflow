# Sovereign Architectural Enforcement – Absolute Eternal Perfection (Dec 28, 2025)
repos:
  - repo: local
    hooks:
      - id: guard-no-inline-models
        name: Sovereign Guard - Block Inline Contracts
        entry: python scripts/guard_no_inline_models.py
        language: python
        types: [python]
        exclude: ^agentic_core/schemas/models/core_contracts\.py$

      - id: guard-no-raw-prompts
        name: Sovereign Guard - Block Raw Prompts
        entry: python scripts/guard_no_raw_prompts.py
        language: python
        types: [python]
        exclude: ^agentic_core/prompt_governance/meta_prompts/sovereign_prompt_constitution\.py$

      - id: guard-no-hardcoded-config
        name: Sovereign Guard - Block Hardcoded Constants
        entry: python scripts/guard_no_hardcoded_config.py
        language: python
        types: [python]
        exclude: ^agentic_core/config/blueprint_sovereign/environments/sovereign_config\.py$

  # === ETERNAL PURITY ENFORCEMENT - FORMATTING & LINTING ===
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: ["--in-place", "--remove-all-unused-imports", "--remove-unused-variables"]

  # === ULTIMATE VERIFIABILITY ENFORCEMENT ===
  - repo: local
    hooks:
      - id: pytest-check
        name: Sovereign Tests - Fast Fail
        entry: pytest -q --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: coverage-enforce
        name: Sovereign Coverage - 95% Minimum
        entry: bash -c "coverage report --fail-under=95 -m || exit 1"
        language: system
        pass_filenames: false
        always_run: true

      - id: mutation-quick-check
        name: Sovereign Mutation - Quick Scan
        entry: mutmut run --paths-to-mutate agentic_core --runner pytest --no-progress
        language: system
        pass_filenames: false
        always_run: true

  # === FINAL SOVEREIGNTY SEAL ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

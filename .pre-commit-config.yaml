# .pre-commit-config.yaml
# MINIMAL: Only essential fast checks
# Comprehensive validation moved to Guardian tests/CI

repos:
  # ============================================================================
  # TIER 1: Essential Linting and Formatting (Staged Files Only)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: Ruff (Lint)
        args: [--fix, --select, "F,E"]  # Only critical errors (Pyflakes + Error)
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
        # Only runs on staged files - no repo-wide scanning
      - id: ruff-format
        name: Ruff (Format)
        exclude: ^(archives/.*|\.sovereign_healing_backup/.*)
        # Only runs on staged files - no repo-wide scanning

  # ============================================================================
  # TIER 2: Constitutional Rules Only
  # ============================================================================
  - repo: local
    hooks:
      # [CONSTITUTIONAL] Base Agent Location Lock - CANNOT be disabled
      # CRITICAL: All *BaseAgent.py files MUST be in agentic_core/base_agents/
      - id: check-base-agent-location
        name: Constitutional Base Agent Lock
        entry: python scripts/validate_structure.py --constitutional-only
        language: python
        files: .*BaseAgent\.py$
        # This is a constitutional rule that short-circuits all other validation.

      - id: purge-cache
        name: Pycache Purge
        entry: python ops_scripts/maintenance/purge_cache.py --quiet
        language: python
        pass_filenames: false
        always_run: true
        # Enforces repository hygiene by purging all __pycache__ folders before commit.

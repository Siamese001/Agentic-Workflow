# .pre-commit-config.yaml
#
# DESIGN PRINCIPLE: staged-file-only checks. No whole-repo scans.
# No always-run hooks without types/files scope. No warn-only gates.
# Heavy structural/ADG checks (module collision, guardian ratchet) → CI.
#
# Commit pipeline:
#   T0a  trailing-whitespace                — deterministic, no Python startup
#   T0b  end-of-file-fixer                  — deterministic, no Python startup
#   T0c  enforce LF line endings            — deterministic, no Python startup
#   T0d  check merge conflict markers       — deterministic, no Python startup
#   T1   py_compile                         — fastest syntax fail
#   T2   ruff-format                        — auto-fixer first (eliminates retry loop)
#   T3   guardian-comment-fixer             — staged Python files only
#   T6   pytest-config-ssot                 — triggered by pytest.ini/pyproject.toml only
#
# Manual/CI lane (stages: [manual]):
#   adg-stale-guard, check-c0-sovereignty
#
# NOTE: `default_language_version` applies to hooks with `language: python`
#       (virtualenv-based). All local hooks here use `language: system` and
#       inherit the ambient Python; the setting below governs remote hooks only.

fail_fast: true
default_language_version:
  python: python3.12

# Global exclude — applied to every hook. Individual hooks may extend this.
# Excludes artifacts that change on every hook run to prevent infinite loops
# Synchronized with .gitignore to ensure consistency
# Generated from config/excluded_paths.yaml
# Do not edit manually - run: python tools/generate/gitignore.py --write-precommit
# Last generated: 2026-04-06T05:27:34.834350
exclude: |
  (?x)^(
    .*\.debug\.log|
    .*/logs/.*|
    .*_sites\.txt|
    .tmp/.*|
    .tmp_.*sites\.txt|
    0[0-9]_[^/]*/.*|
    _capture_.*|
    _make_.*|
    _out_.*|
    _rebuild_.*|
    _run_.*|
    _selfcheck_.*|
    _temp_cmd.*|
    _typed_.*|
    _typed_emitted_.*|
    docs/store/.*|
    guardian_.*\.(txt|json)|
    pytestdebug\.log|
    runtime_state.*\.json|
    temp_[^/]*/.*|
    temp_complete_rules.*\.md|
    tmp.*
  )

repos:
  # ============================================================================
  # TIER -1: MM Dual-State Guard (fail-fast before any stash/restore)
  # ============================================================================
  # Blocks the silent commit-rollback bug where pre-commit stashes unstaged
  # changes via `git stash -k`, a hook (e.g. ruff-format) modifies the file,
  # the stash pop hits a conflict, pre-commit silently resolves with the
  # worktree version, eats the staged half, and `git commit` reports
  # 'Everything up-to-date'. Detects any file in dual state (staged AND
  # worktree-dirty) and aborts with a clear recovery message.
  # Plan: .windsurf/plans/adg-three-bucket-unified-c4f8e2.md (W4 P4.1).
  # Bypass: PRECOMMIT_MM_GUARD_BYPASS=1.
  - repo: local
    hooks:
      - id: precommit-mm-dual-state-guard
        name: "T-1: MM Dual-State Guard (W4 P4.1)"
        entry: py ops_scripts/ci/precommit_mm_guard.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ============================================================================
  # TIER 0: Whitespace & Line-Ending Normalization (deterministic, no churn)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "T0a: Trailing Whitespace"
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        name: "T0b: End-of-File Fixer"
        exclude: '.*\.md$'
      - id: mixed-line-ending
        name: "T0c: Enforce LF Line Endings"
        args: [--fix=lf]
        exclude: '.*\.md$'
      - id: check-merge-conflict
        name: "T0d: Check Merge Conflict Markers"

  # ============================================================================
  # TIER 1: Syntax Gate (Fastest Fail — broken files never proceed)
  # ============================================================================
  - repo: local
    hooks:
      - id: python-syntax-check
        name: "T1: Python Syntax Validation"
        entry: py -m py_compile
        language: system
        types: [python]
        require_serial: true

  # ============================================================================
  # TIER 3: Ruff Format (before governance — eliminates retry loop)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-format
        name: "T2: Ruff Format"
        exclude: '.*\.md$|ops_scripts/ci/check_anti_patterns\.py'

  # ============================================================================
  # TIER 3: Guardian Comment Auto-Fix (staged Python only)
  # ============================================================================
  - repo: local
    hooks:
      - id: guardian-comment-fixer
        name: "T3: Guardian Comment Auto-Fix"
        entry: py tools/adg/adg_antipattern_fixer.py --staged
        language: system
        pass_filenames: false
        always_run: false
        require_serial: true
        types: [python]

  # ============================================================================
  # TIER 4+: Structural checks, config validation, style (staged-file-only)
  # ============================================================================
  - repo: local
    hooks:


      # -- T6: Pytest Config SSOT Gate -------------------------------------------------
      - id: pytest-config-ssot
        name: "T6: Pytest Config SSOT"
        entry: py ops_scripts/ci/_validate_pytest_config.py --strict
        language: system
        pass_filenames: false
        files: ^(pytest\.ini|pyproject\.toml)$
        always_run: false
        require_serial: true

      # -- T6b: MCP Config Sync Integrity ----------------------------------------------
      - id: mcp-sync-integrity
        name: "T6b: MCP Sync Integrity"
        entry: py ops_scripts/ci/check_mcp_sync_integrity.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md|\.windsurf/scripts/(sync_mcp_config|post_write_mcp_config_sync|pre_prompt_classifier)\.py)$
        always_run: false
        require_serial: true

      # -- T6b2: Cross-App Contract Schema (Phase A) -----------------------------------
      # Validates AgentSpec, EvidencePacket, EvaluationRubric, OverfitReport,
      # and ReleaseRecommendation instances against their cross-app contracts.
      # Triggered when any instance file or any contract file changes.
      # Bypass: CROSS_APP_CONTRACT_BYPASS=1.
      - id: cross-app-contract-schema
        name: "T6b2: Cross-App Contract Schema"
        entry: py ops_scripts/ci/check_cross_app_contract_schema.py
        language: system
        pass_filenames: false
        files: ^(requirements/contracts/REQ-CROSS-APP-.*\.contract\.yaml|apps_[^/]+/config/(specs|rubrics)/.*\.yaml|tests/.*/fixtures/(agentspec|evidence_packet|evaluation_rubric|overfit_report|release_recommendation)/.*\.yaml|ops_scripts/ci/check_cross_app_contract_schema\.py)$
        always_run: false
        require_serial: true

      # -- T6c: AGENTS.md MCP Coverage --------------------------------------------------
      # Ensures every `mcpServers` key in mcp_config.json has a row in the
      # AGENTS.md MCP Quick Reference table. Complements T6b (strict integrity):
      # T6b checks content, T6c checks coverage. Both are cheap (no subprocess).
      - id: agents-mcp-coverage
        name: "T6c: AGENTS.md MCP Coverage"
        entry: py ops_scripts/ci/check_agents_mcp_coverage.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md)$
        always_run: false
        require_serial: true

      # -- T6c1: 10C Requirement Bundle Consistency ----------------------------------
      # Validates ledger ↔ matrix ↔ IMPLEMENTATION_STATUS internal consistency
      # whenever any 10C reconciliation artifact is touched. Schema parity, REQ-ID
      # parity, severity vocabulary, confidence range, duplicate detection.
      - id: ten-c-ledger-consistency
        name: "T6c1: 10C ledger ↔ matrix ↔ status consistency"
        entry: py ops_scripts/ci/check_10c_ledger_consistency.py
        language: system
        pass_filenames: false
        files: ^docs/reports/design/10c_reconciliation/.*\.(csv|md)$
        always_run: false
        require_serial: true

      # -- T6c1b: AGEN Registry Schema -----------------------------------------------
      # Validates docs/requirements/registry/{policy,best_practice}/AGEN-*.yaml
      # — required fields, ID format/uniqueness, status vocabulary, enforcement refs.
      - id: agen-registry-schema
        name: "T6c1b: AGEN registry schema"
        entry: py ops_scripts/ci/check_agen_registry_schema.py
        language: system
        pass_filenames: false
        files: ^docs/requirements/registry/.*\.yaml$
        always_run: false
        require_serial: true

      # -- T6c1c: 10C Proof-Ledger Validation ----------------------------------------
      # Enforces the proof-grade ledger schema: 200 rows, 43 columns (W4d-2), owner
      # vocabulary, CRITICAL/HIGH rows have all 8 mandatory proof fields populated,
      # ACCEPTED status only when proof field-complete AND evidence-present.
      # Triggered when the ledger or its tooling changes.
      - id: ten-c-proof-ledger
        name: "T6c1c: 10C proof-ledger validation"
        entry: py tools/requirements/validate_10c_proof_ledger.py
        language: system
        pass_filenames: false
        files: ^(docs/reports/design/10c_reconciliation/10c_semantic_requirement_ledger\.csv|tools/requirements/(harden_10c_ledger|validate_10c_proof_ledger)\.py)$
        always_run: false
        require_serial: true

      # -- T6c1d: 10C Cross-File Consistency (W4d-3) ---------------------------------
      # Validates the four-file bundle agrees: ledger ↔ requirements_vs_10a matrix
      # ↔ metric_obligation matrix ↔ model_binding+nonmodel_control_binding split.
      # 8 checks: REQ ID parity, CRITICAL/HIGH proof fields, metric→REQ linkage,
      # binding→REQ linkage, owner-vocab canonicality (across 5 files), new-best-
      # practice proof-pack coverage, model/nonmodel split well-formedness,
      # coverage_status_normalized vocabulary.
      - id: ten-c-cross-file-consistency
        name: "T6c1d: 10C cross-file consistency (W4d-3)"
        entry: py ops_scripts/ci/check_10c_cross_file_consistency.py
        language: system
        pass_filenames: false
        files: ^(docs/reports/design/10c_reconciliation/.*\.csv|tools/requirements/harden_10c_matrices\.py|ops_scripts/ci/check_10c_cross_file_consistency\.py)$
        always_run: false
        require_serial: true

      # -- T6c1e: 10C Pilot Proof-Evidence (W4d-4) -----------------------------------
      # Narrow gate enforcing real proof evidence for the 5 pilot CRITICAL REQs
      # (10C-REQ-049/086/089/122/167). Each REQ must have:
      # P1 a proof bundle, P2 ledger-bundle metadata match, P3 valid content_hash,
      # P4 valid proof_status, P5 a real test file on disk, P6 the test passes.
      # Triggered when any pilot test, fixture, bundle, or pilot tooling changes.
      - id: ten-c-pilot-proof-evidence
        name: "T6c1e: 10C pilot proof-evidence (W4d-4)"
        entry: py ops_scripts/ci/check_10c_pilot_proof_evidence.py
        language: system
        pass_filenames: false
        files: ^(artifacts/requirements/proof_bundles/.*\.json|tests/fixtures/proof_evidence/.*\.py|tests/unit/agentic_core/L[125]_.*test_10c_req_(049|086|089|122|167)\.py|tests/unit/agentic_core/L4_state/test_10c_req_122\.py|ops_scripts/ci/check_10c_pilot_proof_evidence\.py|tools/requirements/(emit_proof_bundles|update_pilot_ledger)\.py)$
        always_run: false
        require_serial: true

      # -- T6c2: Requirements Universe Inventory (advisory in pre-commit) ------------
      # Discovers all 14 requirement-bearing artifact families and verifies each
      # has at least one CI link. Runs whenever any requirement-bearing file is
      # touched. Strict mode is reserved for run_contract_gates / CI.
      - id: requirements-universe-inventory
        name: "T6c2: requirements universe inventory"
        entry: py ops_scripts/ci/check_requirements_universe_inventory.py
        language: system
        pass_filenames: false
        files: ^(docs/reports/design/10c_reconciliation/.*|docs/requirements/.*|requirements/contracts/.*|config/crosswalk/obligations\.yaml|tools/l5_contracts/_requirement_matrix\.json|docs/reference/contracts/enforcement/ALL_REQUIREMENTS_.*)$
        always_run: false
        require_serial: true

      # -- T6d: Author-Gate Ledger Schema (harness HITL W2) ---------------------------
      # Verifies decision ledger matches canonical DDL. Triggered when schema or
      # migrator changes, and when the capture script changes.
      - id: author-gate-ledger-schema
        name: "T6d: Author-Gate Ledger Schema"
        entry: py ops_scripts/ci/author_gate/check_ledger_schema.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/schemas/decision_ledger\.schema\.sql|\.windsurf/scripts/(apply_ledger_schema|post_cascade_hitl_capture|post_commit_outcome_binder)\.py|ops_scripts/ci/author_gate/.*\.py)$
        always_run: false
        require_serial: true

      # -- T6e: Skill Frontmatter (Anthropic spec) ------------------------------------
      # Enforces Anthropic Agent Skills authoring spec on every
      # .windsurf/skills/<name>/SKILL.md: YAML frontmatter with valid `name`
      # (<=64 chars, lowercase-hyphen, no reserved words) and `description`
      # (<=1024 chars, third person, includes a when-trigger), plus the 500-line
      # SKILL.md body budget and forward-slash path discipline.
      # Reference: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
      - id: skill-frontmatter
        name: "T6e: Skill Frontmatter (Anthropic spec)"
        entry: py ops_scripts/ci/check_skill_frontmatter.py
        language: system
        pass_filenames: false
        files: ^\.windsurf/skills/.+/SKILL\.md$
        always_run: false
        require_serial: true

      # -- T6d: AGENTS.md Autogen Block Integrity --------------------------------------
      # Validates every <!-- MARKER:START/END --> autogen block in AGENTS.md is
      # byte-identical to the SSOT generator output. Currently covers:
      #   - MCP-QUICK-REFERENCE (mcp_config.json)
      #   - NOTION-MAP          (config/notion_databases.yaml)
      # Fix drift: `python .windsurf/scripts/sync_mcp_config.py`
      - id: agents-md-autogen-sync
        name: "T6d: AGENTS.md Autogen Sync"
        entry: py ops_scripts/ci/check_agents_md_sync.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/mcp_config\.json|AGENTS\.md|config/notion_databases\.yaml|\.windsurf/scripts/sync_mcp_config\.py)$
        always_run: false
        require_serial: true

      # T6h RETIRED 2026-04-19 (L2 consolidation): .codeiumignore eliminated.

      # -- T6g: Hardcoded Exclusion Ratchet (R3) ---------------------------------------
      # Detects Python set/frozenset literals containing 3+ canonical exclusion tokens
      # (".git", "__pycache__", "node_modules", "archives", etc.) outside the SSOT
      # modules. Ratchet mode: only NET-NEW shadow sets fail; baseline of 37 known
      # violations is tracked in ops_scripts/ci/baselines/hardcoded_exclusions_baseline.json
      # for burndown. To refresh baseline after fixing one:
      #     python ops_scripts/ci/check_hardcoded_exclusions.py --refresh-baseline
      - id: hardcoded-exclusions
        name: "T6g: Hardcoded Exclusion Ratchet"
        entry: py ops_scripts/ci/check_hardcoded_exclusions.py
        language: system
        pass_filenames: false
        files: ^(agentic_core/.*\.py|apps_[^/]+/.*\.py|ops_scripts/.*\.py|tools/.*\.py|\.windsurf/scripts/.*\.py|ops_scripts/ci/check_hardcoded_exclusions\.py|ops_scripts/ci/baselines/hardcoded_exclusions_baseline\.json)$
        always_run: false
        require_serial: true

      # -- T6f: Exclusion Consistency (R2) ---------------------------------------------
      # Validates that YAML mirror categories (sovereign_excluded_folders,
      # global_excluded_dirs, discovery_excluded_territories) are byte-equal to the
      # Python frozensets in agentic_core/L0_routing/config/path_constants.py.
      # Fix drift by editing whichever surface is wrong; the gate does not auto-fix.
      - id: exclusion-consistency
        name: "T6f: Exclusion YAML <-> Python Consistency"
        entry: py ops_scripts/ci/check_exclusion_consistency.py
        language: system
        pass_filenames: false
        files: ^(config/excluded_paths\.yaml|agentic_core/L0_routing/config/path_constants\.py|ops_scripts/ci/check_exclusion_consistency\.py)$
        always_run: false
        require_serial: true

      # -- T7a: Governed-App Conformance ------------------------------------------------
      # Validates apps_* packages against the governed-app contract:
      # runner subclass, capability token, exception entries, APP_REGISTRY coverage.
      # Triggers on apps_* package changes or registry edits.
      - id: governed-app-conformance
        name: "T7a: Governed-App Conformance"
        entry: py ops_scripts/ci/check_governed_app_conformance.py
        language: system
        pass_filenames: false
        files: ^(apps_[^/]+/.*\.py|apps_shared/integrations/app_registry\.py)$
        always_run: false
        require_serial: true

      # -- T7b: Structure Policy --------------------------------------------------------
      # Validates the repository directory structure against
      # config/structure_blueprint/structure_policy.yaml. Triggers only when the
      # policy itself changes (cheap — full check is policy-driven, not per-file).
      - id: structure-policy
        name: "T7b: Structure Policy"
        entry: py ops_scripts/ci/check_structure_policy.py
        language: system
        pass_filenames: false
        files: ^config/structure_blueprint/structure_policy\.yaml$
        always_run: false
        require_serial: true

      # -- T7c: HITL Packet Format ------------------------------------------------------
      # Validates ask_user_question packet shape in rule/doc files:
      # confidence scores, dominance markers, option format. Triggers on HITL rule
      # files and packet documentation only.
      - id: hitl-format
        name: "T7c: HITL Packet Format"
        entry: py ops_scripts/ci/validate_hitl_format.py
        language: system
        files: ^\.windsurf/rules/(hitl-|.*hitl).*\.md$
        always_run: false
        require_serial: true

      # -- T7e: HITL Rules Corpus Validator ---------------------------------------------
      # Validates the HITL rule *corpus* (all 4 files together): §HITL-9 threshold
      # config, §HITL-10 option shape, forbidden 2-4-count patterns, and required
      # pipeline patterns. The validator was refactored 2026-04-19 to accept the
      # post-consolidation split layout (enforcement.md + decision-points.md +
      # svp-calibration.md + anti-pattern-author-gate.md). Triggers on any HITL file
      # change; passes all 4 files together so corpus-level checks work.
      - id: hitl-rules-corpus
        name: "T7e: HITL Rules Corpus"
        entry: py ops_scripts/ci/validate_hitl_rules.py .windsurf/rules/author-gate-enforcement.md .windsurf/rules/author-gate-decision-points.md .windsurf/rules/author-gate-svp-calibration.md .windsurf/rules/anti-pattern-author-gate.md
        language: system
        pass_filenames: false
        files: ^\.windsurf/rules/(hitl-|anti-pattern-hitl).*\.md$
        always_run: false
        require_serial: true

      # -- T7f: Severity<->Band SSOT (Constitutional §22/§23) --------------------------
      # Forbids local severity<->band mapping dicts outside the canonical SSOT modules
      # (agentic_core/adg/severity_bands.py, agentic_core/L5_safety/config/severity.py).
      # Triggers on any Python file change in agentic_core/, tools/, ops_scripts/,
      # system_learning/, or the SSOT modules themselves.
      - id: severity-band-ssot
        name: "T7f: Severity<->Band SSOT"
        entry: py ops_scripts/ci/check_severity_band_ssot.py
        language: system
        pass_filenames: false
        files: ^(agentic_core/.*\.py|tools/.*\.py|ops_scripts/.*\.py|system_learning/.*\.py)$
        always_run: false
        require_serial: true

      # -- T7g: ADG Graph-Layer Evidence (Constitutional §22) --------------------------
      # Validates that T2/T3 refactoring plans in .windsurf/plans/ include the
      # ## ADG_HOTSPOT_REPORT (with archetype + surface classification) and
      # ## ADG_GRAPH_LAYER_EVIDENCE (with ≥3 materialized views + semantic edges/P-views).
      # Triggers on plan file changes only.
      - id: graph-layer-evidence
        name: "T7g: ADG Graph-Layer Evidence"
        entry: py ops_scripts/ci/check_graph_layer_evidence.py
        language: system
        pass_filenames: false
        files: ^(\.windsurf/plans/.*\.md|ops_scripts/ci/baselines/graph_layer_evidence_baseline\.json|ops_scripts/ci/check_graph_layer_evidence\.py)$
        always_run: false
        require_serial: true

      # -- T7o: Reference Pack Integrity (docs/reference/MANIFEST.json) ----------------
      # Verifies docs/reference/MANIFEST.json against disk: every listed file exists,
      # size matches, sha256 matches; sub-MANIFEST children[] resolve to real files.
      # Triggers when any file under docs/reference/ changes.
      - id: reference-pack-integrity
        name: "T7o: Reference Pack Integrity"
        entry: py ops_scripts/ci/check_reference_pack_integrity.py
        language: system
        pass_filenames: false
        files: ^docs/reference/.*$
        always_run: false
        require_serial: true

      # -- T7p: Reference Test Contracts (no-drift gate for declared tests) ------------
      # Walks docs/reference/**/TEST REQUIREMENTS blocks; every declared
      # test_<name> contract must have a matching `def test_<name>(...)` in tests/
      # OR be in ops_scripts/ci/baselines/reference_test_contract_baseline.json.
      # Baseline must shrink monotonically. Adding a new contract without an
      # implementation fails the gate.
      - id: reference-test-contracts
        name: "T7p: Reference Test Contracts"
        entry: py ops_scripts/ci/check_reference_test_contracts.py
        language: system
        pass_filenames: false
        files: ^(docs/reference/.*\.md|tests/.*\.py|ops_scripts/ci/baselines/reference_test_contract_baseline\.json|ops_scripts/ci/check_reference_test_contracts\.py)$
        always_run: false
        require_serial: true

      # -- T7d: Query Progress Bar (§16) ------------------------------------------------
      # Enforces Constitutional §16 (progress bars on operations >30s, proxied
      # by loop/function body >50 lines). All 8 pre-existing violations triaged
      # and resolved on 2026-04-19 (2 real tqdm wraps, 6 compliance comments
      # documenting bounded-small-n exemptions). Safe to block commits.
      - id: query-progress-bar
        name: "T7d: Query Progress Bar (§16)"
        entry: py ops_scripts/ci/check_query_progress_bar.py --staged
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        require_serial: true

      # -- W4.1: Author-Gate ledger coverage (meta-learning hardening) --------------
      # Fails commit if outcome_bind_rate < 50% OR scope_file_path_rate < 70%
      # OR v2_field_rate < 70% OR hash_chain_rate < 95% OR capture_violations_24h
      # > 20. Floors are deliberately permissive (WARN-band on audit_ledger_coverage)
      # so the gate alarms on rot but doesn't block routine work.
      # Bypass: LEDGER_COVERAGE_BYPASS=1 (logged to artifacts/windsurf/).
      # Audit script SSOT: .windsurf/scripts/audit_ledger_coverage.py
      - id: author-gate-ledger-coverage
        name: "T7e: Author-Gate Ledger Coverage (W4.1)"
        entry: py ops_scripts/ci/check_ledger_coverage.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^(\.windsurf/scripts/(post_cascade_author_gate_capture|pre_author_gate|author_gate_marker_validator|audit_ledger_coverage|promote_author_gate_patterns|post_commit_outcome_binder|author_gate_ledger_integrity)\.py|\.windsurf/skills/refactor-decision-memory/.*\.py|\.windsurf/schemas/exit_criteria\.schema\.json|ops_scripts/ci/check_ledger_coverage\.py)$

      # -- T7h: Terminal/Subprocess Cleanup (§11 + §14) ---------------------------------
      # Enforces Constitutional §11 (terminal process lifecycle) and §14 (subprocess
      # timeout required) by catching static patterns that leak processes:
      #   - subprocess.Popen without .wait/.terminate/.kill/communicate or `with`
      #   - subprocess.run without timeout= kwarg
      #   - os.system / os.popen (banned outright)
      # --staged mode: blocks NEW violations only. Full-repo scan as of
      # 2026-04-23 shows 0 violations (verified: `python
      # ops_scripts/ci/check_terminal_cleanup.py --verbose` → "scanned 3966
      # files, no violations"). The server-side mirror
      # `.github/workflows/subprocess-timeout-gate.yml` runs the full-repo
      # scan on every PR to close the `--no-verify` bypass.
      - id: terminal-cleanup
        name: "T7h: Terminal/Subprocess Cleanup (§11 + §14)"
        entry: py ops_scripts/ci/check_terminal_cleanup.py --staged
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        require_serial: true

      # -- T7j: Snapshot Graph-Layer Completeness (Constitutional §22 — artifact side) --
      # Symmetric enforcement for T7g. T7g enforces that PLANS cite mv_*/v_p*
      # primitives; T7j enforces that ADG SNAPSHOTS actually ship them. Fails

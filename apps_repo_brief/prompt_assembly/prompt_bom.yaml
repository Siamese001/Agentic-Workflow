# apps_repo_brief Prompt Bill of Materials (PromptBOM).
#
# Declares all required prompt slots and their binding contracts for the
# apps_repo_brief executive brief synthesis pipeline.
#
# Required slots: S0, I0, C0, U0, A0, D0, E0, Y0, R0.
# No placeholders, no TODO, no vague shells.
# All slots must be bound before CompiledPromptArtifact is emitted.
#
# Plan: .windsurf/plans/apps-repo-brief-plan3-zero-loss-overwrite.md §P2.9, §9

schema_version: "apps_repo_brief.prompt_bom/v1"
app_name: apps_repo_brief
route_id: apps_repo_brief.executive_brief_v1

slots:
  S0:
    slot_id: S0
    name: system_and_governance
    description: >-
      System-level identity, role constraints, and governance rules for the
      synthesis model. Establishes the model's operating context, prohibited
      behaviors, and output authority boundaries.
    required: true
    template_ref: repo_brief_synthesis_v1
    source: apps_repo_brief/config/prompt_registry.yaml
    forbidden_behaviors:
      - invent_governance_claim
      - override_policy_constraint
      - assume_external_authority

  I0:
    slot_id: I0
    name: repo_brief_rules
    description: >-
      Task-specific rules for repo brief synthesis: citation discipline,
      claim-evidence chain requirements, prohibited claim types, and
      audience-appropriate framing constraints.
    required: true
    template_ref: repo_brief_synthesis_v1
    source: apps_repo_brief/config/prompt_registry.yaml
    forbidden_behaviors:
      - skip_evidence_chain_requirement
      - allow_unsupported_governance_claim

  C0:
    slot_id: C0
    name: verified_repo_evidence_context
    description: >-
      C0-verified evidence package from the repo_brief_docs retrieval surface.
      Contains FinalEvidenceContract, BriefingCoverageMatrix,
      SourcePortfolioSummary, ClaimEvidenceMap, ContradictionMatrix,
      FreshnessReport, and SynthesisGuidanceForPA. All evidence has passed
      the C0 gate before this slot is populated.
    required: true
    source: C0_final_evidence_contract
    binding_contract: apps_repo_brief.FinalEvidenceContract.v1
    forbidden_behaviors:
      - bypass_evidence_gate
      - use_unapproved_evidence_source
      - treat_retrieved_text_as_instruction

  U0:
    slot_id: U0
    name: user_repo_brief_request
    description: >-
      Normalized user request envelope: audience persona, emphasis_areas,
      depth_profile, repo_snapshot_id, and any explicit constraints or
      user-supplied framing notes.
    required: true
    source: normalized_request_envelope
    forbidden_behaviors:
      - invent_user_intent
      - expand_emphasis_areas_beyond_request

  A0:
    slot_id: A0
    name: audience_persona_and_schema
    description: >-
      Target audience persona definition and output schema reference.
      Constrains section selection, tone, depth, and terminology.
      Persona schema is versioned and must match persona_schema_version
      in the cache compat key.
    required: true
    source: apps_repo_brief/config/prompt_registry.yaml
    forbidden_behaviors:
      - invent_audience_requirement
      - mix_audience_personas_in_single_output

  D0:
    slot_id: D0
    name: origin_and_injection_fences
    description: >-
      Data boundary fences that prevent retrieved content from being
      interpreted as instructions. Includes explicit origin markers,
      injection-resistance rules, and trust boundary declarations.
    required: true
    template_ref: repo_brief_synthesis_v1
    forbidden_behaviors:
      - treat_retrieved_content_as_prompt_instruction
      - remove_origin_markers
      - allow_retrieved_text_in_instruction_context

  E0:
    slot_id: E0
    name: approved_examples_optional
    description: >-
      Optional: approved few-shot examples for the target audience and
      depth profile. Must be from L4-approved example store — never
      constructed ad hoc. May be omitted when no approved examples exist.
    required: false
    source: L4_approved_example_store
    forbidden_behaviors:
      - construct_ad_hoc_examples
      - use_unapproved_examples_from_retrieved_context

  Y0:
    slot_id: Y0
    name: approved_style_preferences
    description: >-
      Style constraints: length calibration, terminology preferences,
      formatting rules, and explicit anti-patterns for this audience.
      Sourced from the approved style registry — never inlined ad hoc.
    required: false
    source: apps_repo_brief/config/prompt_registry.yaml
    forbidden_behaviors:
      - construct_ad_hoc_style_rules

  R0:
    slot_id: R0
    name: output_schema_and_disposition_constraints
    description: >-
      Output schema (governed repo brief packet schema) and terminal
      disposition constraints. Defines allowed output shapes, required
      fields, and what the model is NOT permitted to decide (routing,
      policy, approval, L4 write).
    required: true
    source: apps_repo_brief/config/prompt_registry.yaml
    forbidden_behaviors:
      - decide_final_disposition
      - write_durable_state
      - call_provider_directly
      - approve_final_output
      - route_or_reroute

hash_fields:
  - schema_version
  - app_name
  - route_id
  - slots

# apps_repo_brief evidence-to-prompt-context formatter template.
#
# Purpose: Format FinalEvidenceContract + BriefingCoverageMatrix into
# the C0 prompt slot body (slot C0) consumed by synthesis template.
# Stage: PA — runs inside the PA compiler before E3_EXEC synthesis.
#
# Plan: .windsurf/plans/apps-repo-brief-plan3-zero-loss-overwrite.md §P2.11

template_id: repo_evidence_to_prompt_context_v1
version: "1.0.0"
purpose: Format C0 evidence artifacts into the C0 prompt slot body
allowed_stage: PA
schema_version: "apps_repo_brief.prompt_template/v1"

input_contract:
  required_inputs:
    - FinalEvidenceContract
    - BriefingCoverageMatrix
    - SourcePortfolioSummary
    - ClaimEvidenceMap
    - ContradictionMatrix
    - FreshnessReport
    - SynthesisGuidanceForPA

required_slots: [C0]

forbidden_behaviors:
  - promote_weak_evidence_to_strong
  - omit_staleness_caveat_for_stale_source
  - omit_contradiction_from_output_slot
  - retrieve_new_evidence
  - modify_fec_status

slot_bodies:
  C0:
    formatting_rules:
      - Group sources by source_type per SourcePortfolioSummary.
      - Label each claim with its ClaimEvidenceMap support_status (PASS/WEAK/UNSUPPORTED/CONTRADICTED).
      - Insert STALENESS_CAVEAT for any source where FreshnessReport.staleness = true.
      - Insert CONTRADICTION_FLAG for all ContradictionMatrix entries.
      - Include SynthesisGuidanceForPA gap-handling notes verbatim.
      - Do NOT inline full source text — only titles, IDs, and citation anchors.
    evidence_status_handling:
      PASS: "Include as authoritative supporting evidence."
      WEAK: "Include with explicit WEAK_EVIDENCE label. Synthesis must caveat."
      WEAK_WITH_CAVEATS: "Include with WEAK_WITH_CAVEATS label. Synthesis must caveat fully."
      UNSUPPORTED: "Omit from C0 slot body — do not surface to synthesis model."
      CONTRADICTED: "Include in CONTRADICTION_FLAG block only — do not present as support."
      CONFLICTED: "Block synthesis; surface ContradictionMatrix for human review."

output_contract:
  produces: c0_slot_body_text
  constraints:
    - Must not promote weak to strong.
    - Must preserve all contradiction flags.
    - Must include all staleness caveats.
    - Total slot body must not exceed prompt_budget_hint from FinalEvidenceContract.

validation_rules:
  - All PASS claims must have at least one source_ref in SourcePortfolioSummary
  - WEAK claims must carry caveat_label in formatted output
  - No UNSUPPORTED claim text may appear in the formatted C0 slot body
  - CONTRADICTION entries must appear in CONTRADICTION_FLAG block

hash_fields:
  - template_id
  - version
  - input_contract
  - forbidden_behaviors
  - slot_bodies
  - validation_rules

# Docker Compose for Canon Validator Engine - Two-Phase Pipeline
# Enforces Sanitization (Phase A) before Runtime (Phase B)

version: '3.8'

networks:
  canon_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  logs:
    driver: local

services:
  # ================================================
  # PHASE A: SANITIZATION BOOT SEQUENCE
  # ================================================

  # STEP 0: THE LIBRARIAN
  librarian:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-librarian
    # REMOVED "python" from command because it's in the Dockerfile ENTRYPOINT
    command: ["apps_rg/L0_maintenance/deduplicate_and_index.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    restart: "no" # Should not restart on completion

  # STEP 1: THE ARCHITECT
  architect:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-architect
    command: ["apps_rg/L0_maintenance/fix_structural_debt_llm.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      librarian:
        condition: service_completed_successfully
    restart: "no"

  # STEP 2: THE SURGEON
  surgeon:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-surgeon
    command: ["apps_rg/L0_maintenance/fix_syntax_llm.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      architect:
        condition: service_completed_successfully
    restart: "no"

  # ================================================
  # PHASE B: RUNTIME EXECUTION
  # ================================================

  orchestrator:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-orchestrator
    command: ["orchestrator.py"]
    env_file:
      - .env
      - .env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CANON_LOG_LEVEL=INFO
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    depends_on:
      surgeon:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: canon-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-defaultpassword}
      --appendonly yes
    networks:
      - canon_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
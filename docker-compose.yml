version: '3.8'

# ================================================
# NETWORKS and VOLUMES
# ================================================
networks:
  canon_net:
    driver: bridge
    # Isolated network for inter-service communication
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
    # Persistent storage for L4 state snapshots
  logs:
    driver: local
    # Persistent storage for application logs

# ================================================
# SERVICES
# ================================================
services:
  # ================================================
  # PHASE A: SANITIZATION BOOT SEQUENCE
  # (Must complete successfully before Orchestrator starts)
  # ================================================

  # STEP 0: THE LIBRARIAN (Deduplicates and Indexes)
  librarian:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-librarian
    restart: "no" # Should not restart on completion
    command: python apps_rg/L0_maintenance/deduplicate_and_index.py
    
    # Mount the whole app directory for full file access
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw # Maintain existing log volume
    working_dir: /app
    networks:
      - canon_net
    
  # STEP 1: THE ARCHITECT (Structural Debt Fixer)
  architect:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-architect
    restart: "no"
    command: python fix_structural_debt_llm.py
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    
    # CRITICAL DEPENDENCY: Must wait for Librarian (Step 0)
    depends_on:
      librarian:
        condition: service_completed_successfully

  # STEP 2: THE SURGEON (Syntax Error Repair)
  surgeon:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-surgeon
    restart: "no"
    command: python fix_syntax_llm.py
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    
    # CRITICAL DEPENDENCY: Must wait for Architect (Step 1)
    depends_on:
      architect:
        condition: service_completed_successfully

  # ================================================
  # PHASE B: RUNTIME EXECUTION (Cognitive Layer)
  # ================================================

  # STEP 3: THE ORCHESTRATOR (Main Application Entry - Formerly 'validator')
  orchestrator:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-orchestrator
    restart: unless-stopped
    command: ["python", "orchestrator.py"] # Assuming orchestrator.py is the main entry point
    
    env_file:
      - .env.production
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CANON_LOG_LEVEL=INFO
    
    volumes:
      - .:/app:rw # Full application code, now clean
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    ports:
      - "8080:8080"
      
    # Preserve existing resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M

    # CRITICAL DEPENDENCY: Requires Surgeon (Step 2) AND Redis to be ready.
    depends_on:
      surgeon:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ================================================
  # SUPPORT SERVICES (Redis)
  # ================================================
  redis:
    image: redis:7.2-alpine
    container_name: canon-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-defaultpassword}
      --appendonly yes
      # ... other persistence settings
    
    networks:
      - canon_net
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
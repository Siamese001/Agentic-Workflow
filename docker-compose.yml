# Docker Compose for Canon Validator Engine - Decoupled Pipeline
# Allows Runtime (Phase B) to boot without being blocked by legacy Sanitization (Phase A)

networks:
  canon_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  logs:
    driver: local

services:
  # ================================================
  # PHASE A: SANITIZATION (MANUAL/OPTIONAL)
  # ================================================

  librarian:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-librarian
    command: ["apps_rg/L0_maintenance/deduplicate_and_index.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    restart: "no"

  architect:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-architect
    command: ["fix_structural_debt_llm.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    # Set to 'service_started' so it doesn't block if the librarian finds junk
    depends_on:
      librarian:
        condition: service_started
    restart: "no"

  surgeon:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-surgeon
    command: ["fix_syntax_llm.py"]
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    # Set to 'service_started' to prevent the 'Infinite Loop' from blocking the pipe
    depends_on:
      architect:
        condition: service_started
    restart: "no"

  # ================================================
  # PHASE B: RUNTIME EXECUTION (DIRECT BOOT)
  # ================================================

  orchestrator:
    build: .
    image: canon-validator:latest
    user: appuser
    container_name: canon-orchestrator
    command: ["python", "/app/orchestrator.py"]
    env_file:
      - .env
      - .env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CANON_LOG_LEVEL=INFO
      - HF_HOME=/app/.cache
      - PYTHONPATH=/app:/app/agentic_core:/app/apps_lic:/app/apps_rg:/app/apps_shared:/app/scripts:/app/engines
    volumes:
      - .:/app:rw
      - logs:/app/logs:rw
    working_dir: /app
    networks:
      - canon_net
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    # REMOVED: dependancy on surgeon. It will now boot as long as Redis is healthy.
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: canon-redis
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - canon_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
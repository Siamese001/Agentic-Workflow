version: '3.8'

services:
  phase1a-validation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-workflow-phase1a
    # Resource limits to prevent laptop crashes
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Mount repository as read-only to enforce Phase 1A non-destructive contract
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    # Restart policy - one-shot validation should not restart
    restart: "no"
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Security settings
    security_opt:
      - no-new-privileges:true
    # Network isolation
    networks:
      - validation-network
    # Working directory override
    working_dir: /workspace

networks:
  validation-network:
    driver: bridge
    internal: true  # No external network access

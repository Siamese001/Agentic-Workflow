# apps_lic spine manifest
#
# Declares which spine route types apps_lic serves so the
# runtime-mode scanner (tools/analysis/apps_spine_coverage.py) can
# verify direct surfacing of the canonical R3 contract chain.
#
# This manifest is STATIC EVIDENCE only. It declares the contract
# surface apps_lic delegates THROUGH (transitively today, via
# apps_shared.integrations.governed_app_runner.GovernedAppRunner).
# It is NOT a runtime certification claim. Runtime trace (OTel spans
# hitting each contract surface) is what proves the contracts are
# actually exercised end-to-end.
#
# Format: docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md
#         §"Route-Shape Taxonomy for apps_*"
# Pattern: mirrors apps_research W9 and apps_exec W10.
# Pre-migration audit: apps_lic was confirmed R3_grounded_read,
#   NOT R3R4_managed_workflow. The audit found ZERO matches in
#   apps_lic/ for: CommitRequest, commit_request, StateDiffCandidate,
#   proposed_state_diff, MutationIntent, durable_write, write_gateway,
#   compliance_log, send_queue. The apparent ``_uwg`` references are
#   lifecycle-trace telemetry markers, not real UWG admission.

schema_version: 1
app: apps_lic

# W4 P10: Updated to reflect the canonical apps_lic route surface.
# apps_lic serves two outreach routes (R4 + R3R4) and one briefing-only route (R3).
# The prior R3_grounded_read-only claim was inaccurate for the outreach path.

claimed_routes:
  - type: R4_SINGLE_ACTION
    description: >-
      Standard outreach draft path when a fresh PreloadedOutreachContextManifest
      is present. U0 → L1 → L0 (emits R4_SINGLE_ACTION) → PA compiler (8 slots)
      → L2 hop-based draft composition → Exit V6. Output is an OutreachDraft
      sealed with content hash bound to manifest_hash. No durable state writes.
      The user reviews and optionally sends — no LinkedIn send-API call is made.
    notes:
      - "Fires when manifest.freshness_status='fresh' and BriefingReady validation passes."
      - "No CommitRequest for raw outreach drafts. COMMIT_REQUEST reserved for approved reusable templates only."
      - "All durable writes flow through Exit V6 → UWG → L4 only."
      - "send_mode restricted to: draft_only, review_required, send_ready_candidate."
      - "Forbidden send_mode values (send_now, auto_send, connector_send) route to R5 terminal."

  - type: R3R4_MANAGED_WORKFLOW
    description: >-
      Managed workflow path for missing or stale briefing. U0 → L1 → L0
      (emits R3R4_MANAGED_WORKFLOW) → L3 orchestrator dispatches
      RequestForBriefing to AppsResearchBridge → apps_research produces
      BriefingReady → convert to PreloadedOutreachContextManifest → resume
      R4_SINGLE_ACTION path. On any research failure: fail-closed through
      Exit V6 with the appropriate R5 reason code (no fallback draft).
    notes:
      - "Fires when manifest.missing=True OR manifest.stale=True AND research_authorized=True."
      - "research_authorized=False when manifest.missing routes to R5 terminal (BRIEFING_MISSING_RESEARCH_NOT_AUTHORIZED)."
      - "All 5 research failure codes (FAILED/EMPTY/BLOCKED/STALE/WEAK_SUPPORT) are fail-closed terminals."
      - "Chain linkage receipt (L3RuntimeOrchestrationReceipt) binds R3 research run_id + R4 manifest_hash."

  - type: R3_SIMPLE_GROUNDED_READ
    description: >-
      Briefing-only path when the request explicitly targets briefing artifact
      production (briefing_only=true in OutreachRequest). C0 or apps_research
      evidence path → optional PA/L2 synthesis → Exit. Produces a governed
      briefing artifact only — NEVER an outreach draft.
    notes:
      - "Fires when explicit_briefing_only_request=true in L0 decision matrix."
      - "No outreach draft is produced on this path — briefing artifact only."

# HITL posture (informational, not a route-shape modifier):
#   apps_lic.integrations.governed_lic_run.GovernedLicRun.HITL_ENABLED = True
#
#   This is RUNNER POSTURE -- it gates whether the spine's runtime
#   HITL escalation path is reachable for an LIC request. The HITL
#   escalation here serves COMPLIANCE-SENSITIVE REVIEW of message
#   drafts (e.g., regulated-industry outreach), not durable-state
#   admission. It is NOT evidence of a durable-write surface and
#   does NOT push apps_lic into the R3R4_managed_workflow shape.
#   R3R4_managed_workflow is reserved for routes that actually emit
#   a CommitRequest. apps_lic emits none, so it stays in
#   R3_grounded_read with HITL_ENABLED noted here for transparency.

# Apparent "_uwg" hits in apps_lic/ are LIFECYCLE-TRACE TELEMETRY
# MARKERS (e.g., _emit_writes_via_uwg, _emit_execution_terminates_at_uwg,
# _emit_writes_through). These are OTel-stub sentinels from
# agentic_core.runtime.contracts.lifecycle_trace_contract that fire
# at module-import time as part of p0/p1/p2 trace coverage. They do
# NOT invoke the UWG path. The pre-migration audit verified this.

# References:
# - apps_lic/integrations/spine_handoff.py
#     Direct R3 contract surface; delegates unchanged to GovernedLicRun.
# - apps_lic/integrations/governed_lic_run.py
#     The GovernedAppRunner subclass that drives the L1->L0->C0->L2->L5+L6 pipeline.
# - apps_lic/tools/run_workflow_lic.py
#     Async entrypoint that loads OutreachMission, runs the orchestrator,
#     and saves a local JSON output artifact. NO durable-state writes.
# - apps_research/spine_manifest.yaml + apps_exec/spine_manifest.yaml
#     Sibling R3_grounded_read manifests -- this manifest mirrors their shape.
# - apps_shared/integrations/governed_app_runner.py
#     Shared substrate (transitive contract delegation today).
# - docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md
# - tools/analysis/apps_spine_coverage.py
#     R3_grounded_read row in ROUTE_TYPE_CONTRACT_REQUIREMENTS.


# LIC Campaign Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Draft Validation Rules
draft_validation:
  # Subject line requirements
  subject:
    min_length: 5
    max_length: 100
    required: true

  # Body content requirements
  body:
    min_length: 50
    max_length: 5000
    required: true

  # Tone options
  allowed_tones:
    - "professional"
    - "friendly"
    - "formal"
    - "casual"

# Quality Scoring Rules
quality_scoring:
  # Base score for value proposition mention
  value_proposition_bonus: 2

  # Base score for personalization
  personalization_bonus: 1

  # Penalty for prohibited terms
  prohibited_term_penalty: 3

  # Minimum passing score
  passing_score: 5

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - no_prohibited_terms
    - min_draft_length
    - max_recipients

  # Soft gates - can be waived with justification
  soft_gates:
    - quality_warnings
    - latency_warnings

# Compliance Rules
compliance_rules:
  strict:
    prohibited_terms:
      - "spam"
      - "scam"
      - "free money"
      - "guaranteed"
      - "urgent"
      - "limited time"
    require_approval: true

  standard:
    prohibited_terms:
      - "spam"
      - "scam"
      - "free money"
    require_approval: true

  relaxed:
    prohibited_terms:
      - "spam"
    require_approval: false

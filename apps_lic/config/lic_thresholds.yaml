# LIC Campaign Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum quality score (1-10)
  min_quality_score: 5

  # Maximum draft latency (milliseconds)
  max_draft_latency_ms: 10000

  # Maximum validation latency (milliseconds)
  max_validation_latency_ms: 5000

  # Minimum draft length (characters)
  min_draft_length: 50

# Compliance Requirements
compliance:
  # Compliance level: strict, standard, relaxed
  default_level: "standard"

  # Require human approval before send
  require_approval: true

  # Prohibited terms for content compliance
  prohibited_terms:
    - "spam"
    - "scam"
    - "free money"
    - "guaranteed"

# Campaign Limits
campaign_limits:
  # Maximum recipients per campaign
  max_recipients: 1000

  # Maximum drafts per campaign
  max_drafts: 10

  # Maximum validation attempts per draft
  max_validation_attempts: 3

# Output Configuration
output:
  # Emit Markdown reports
  emit_markdown_report: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Artifact retention (days)
  retention_days: 30

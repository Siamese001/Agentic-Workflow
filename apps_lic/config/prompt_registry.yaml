schema_version: "1.1"
app: apps_lic
registry_id: apps_lic_prompt_registry_v1
owner: apps_lic.prompt_assembly
slot_registry_ref: apps_lic_prompt_slot_registry_v1
default_generation_output_contract: OutreachDraftCandidate
templates:
  outreach_draft_v1:
    path: apps_lic/prompt_assembly/templates/outreach_draft_v1.yaml
    status: active
    required_slots: [S0, I0, C0, U0, D0, E0, Y0, R0, N0, A0, L0]
    output_contract: OutreachDraftCandidate
    allowed_stage: E3_EXEC
    required_for_steps:
      - compose_draft
  outreach_draft_v2:
    path: apps_lic/prompt_assembly/templates/outreach_draft_v2.yaml
    status: active
    required_slots: [S0, I0, C0, U0, D0, E0, Y0, R0, N0, A0, L0]
    output_contract: OutreachDraftCandidate
    allowed_stage: E3_EXEC
    required_for_steps:
      - compose_draft
      - compose_p2_enhanced_draft
  compact_recruiter_arc:
    path: apps_lic/prompt_assembly/templates/compact_recruiter_arc.yaml
    status: active
    required_slots: [S0, D0, I0, E0, C0, M0, U0, H0, R0]
    output_contract: OutreachDraftCandidate
    allowed_stage: E3_EXEC
    required_for_steps:
      - compose_recruiter_draft
  exec_positioning:
    path: apps_lic/prompt_assembly/templates/exec_positioning.yaml
    status: active
    required_slots: [S0, I0, C0, U0, D0, E0, Y0, R0, N0, A0, L0]
    output_contract: OutreachDraftCandidate
    allowed_stage: E3_EXEC
    required_for_steps:
      - compose_executive_draft
  briefing_to_manifest_v1:
    path: apps_lic/prompt_assembly/templates/briefing_to_manifest_v1.yaml
    status: active
    required_slots: [S0, C0, D0, R0]
    output_contract: PreloadedOutreachContextManifestContext
    allowed_stage: E2_VALID
    required_for_steps:
      - validate_research_and_build_manifest
  unsupported_claim_omission_v1:
    path: apps_lic/prompt_assembly/templates/unsupported_claim_omission_v1.yaml
    status: active
    required_slots: [S0, I0, C0, D0, R0]
    output_contract: ClaimOmissionRepair
    allowed_stage: E4_HEAL
    required_for_steps:
      - omit_unsupported_claims
  repair_antipattern_v1:
    path: apps_lic/prompt_assembly/templates/repair_antipattern_v1.yaml
    status: active
    required_slots: [S0, I0, C0, D0, Y0, R0]
    output_contract: AntiPatternRepair
    allowed_stage: E4_HEAL
    required_for_steps:
      - remove_forbidden_antipatterns
  channel_length_repair_v1:
    path: apps_lic/prompt_assembly/templates/channel_length_repair_v1.yaml
    status: active
    required_slots: [S0, I0, C0, D0, Y0, R0]
    output_contract: ChannelLengthRepair
    allowed_stage: E4_HEAL
    required_for_steps:
      - repair_channel_length
hash_fields:
  - schema_version
  - registry_id
  - slot_registry_ref
  - default_generation_output_contract
  - templates

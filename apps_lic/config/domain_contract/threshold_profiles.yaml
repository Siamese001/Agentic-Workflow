- threshold_profile_id: atp::apps_lic::outreach_message::v1
  app_id: apps_lic
  task_class: outreach_message
  version: "1.0.0"
  status: active
  overall_pass_threshold: 0.75
  risk_tier: elevated
  route_id: "lic.outreach_message.default"
  unknown_policy: fail_closed
  abstain_policy: hard
  hitl_policy: required_on_low
  policy_hash: "policy://apps_lic/v1"
  dimension_minimums:
    audience_fit: 0.55
    personalization_integrity: 0.95
    offer_clarity: 0.60
    response_likelihood: 0.0
    brevity_and_channel_fit: 0.85
    compliance: 0.95
    sequence_coherence: 0.0
    brand_voice: 0.0
    no_fake_personalization: 0.99
    no_sensitive_targeting: 0.99
  # P2 Dimensions (added W1.P2)
    narrative_coherence: 0.70
    tone_register_fit: 0.75
    differentiator_grounded: 1.0
  # W4.P3 (plan apps-eval-harness-parity-f8d4a2): dims listed here keep
  # min=0.0 deliberately — they remain in the weighted overall score but
  # are NOT gated per-dim. CI gate check_app_domain_harness_parity.py
  # suppresses NO_DEAD_THRESHOLDS WARNs for these dims.
  intentional_zero_dims:
    - response_likelihood    # LLM-estimated reply rate; inherently noisy, tracked-only
    - sequence_coherence     # only meaningful in multi-touch sequences, not single messages
    - brand_voice            # subjective style match; tracked-only until voice profiles calibrate
  source_app_config_ref: "apps_lic/config/lic_thresholds.yaml"
  created_at: "2026-05-01"

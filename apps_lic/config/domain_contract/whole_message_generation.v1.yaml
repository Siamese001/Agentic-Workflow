schema_version: apps_lic.whole_message_generation.v1
wave: W6
authority: PA_L2
purpose: Pack C0/W4/C0.3 evidence into a governed whole-message generation request and candidate contract.

governance:
  provider_calls_in_w6_scaffold: false
  durable_writes_allowed: false
  auto_send_allowed: false
  generation_unit: whole_message
  forbidden_units:
    - header
    - body_fragment
    - footer
    - subject_only
    - section_fragment

provider_backed_generation:
  policy_id: apps_lic.provider_backed_generation.w5
  status: explicit_config_only
  enabled_by_default: false
  requires_explicit_config: true
  deterministic_fallback_receipt: pass:w6_deterministic_whole_message_fallback_available
  generation_unit: whole_message
  durable_writes_allowed: false
  auto_send_allowed: false
  draft_only_required: true
  no_send_authority: true
  high_temperature_bounds:
    generator_temperature_min: 0.90
    generator_temperature_max: 0.98
    top_p_min: 0.94
  provider_transport_contract:
    provider_mode_must_not_accept_fixture_receipts: true
    provider_mode_must_emit_call_receipt: true
    provider_mode_must_preserve_allowed_claim_ids: true

recipient_archetype_policy:
  canonical_archetypes:
    - RECRUITER
    - SENIOR_TA
    - EXECUTIVE
    - C_LEVEL
  class_to_archetype:
    RECRUITER: RECRUITER
    REFERRAL_CONTACT: RECRUITER
    SENIOR_TA: SENIOR_TA
    HIRING_MANAGER: EXECUTIVE
    EXECUTIVE: EXECUTIVE
    VP_ENG: EXECUTIVE
    C_LEVEL: C_LEVEL
    CEO: C_LEVEL
    CTO: C_LEVEL

required_inputs:
  - recipient_class_derivation
  - message_requirement_gate_result
  - sender_proof_graph_packet
  - campaign_objective
  - desired_next_step
  - send_mode

reasoning_policy:
  sc_levels:
    SC-0:
      candidate_count: 1
      repair_budget: 0
      generator_temperature: 0.80
      top_p: 0.90
    SC-1:
      candidate_count: 1
      repair_budget: 1
      generator_temperature: 0.86
      top_p: 0.94
    SC-2:
      candidate_count: 2
      repair_budget: 1
      generator_temperature: 0.92
      top_p: 0.94
    SC-3:
      candidate_count: 3
      repair_budget: 2
      generator_temperature: 0.94
      top_p: 0.95
  repair_temperature: 0.30
  judge_temperature: 0.10
  escalation_triggers:
    - executive_or_c_level
    - role_specific
    - referral_context
    - prior_relationship
    - sensitive_constraints
    - application_status
    - company_trigger

length_control_policy:
  hard_controls:
    - max_sentences
    - hard_cap_chars
  advisory_controls:
    - min_words
    - max_words
  rationale: >
    Tokenizers split text into character sequences that may be shorter or longer
    than human-visible words. Sentence count and character caps are the stable
    controls for LinkedIn-length drafts; word ranges remain useful guidance and
    reporting metadata.
  enforcement:
    w4_selection: enforce hard_controls only
    validation_exit: enforce hard_controls only
    prompt_assembly: instruct hard_controls and label words advisory

length_budgets:
  recruiter_general_intro:
    words: [40, 60]
    sentences: [2, 3]
    hard_cap_chars: 500
  recruiter_role_specific:
    words: [55, 80]
    sentences: [3, 4]
    hard_cap_chars: 750
  senior_ta_role_specific:
    words: [50, 75]
    sentences: [3, 4]
    hard_cap_chars: 700
  senior_ta_general_intro:
    words: [35, 60]
    sentences: [2, 3]
    hard_cap_chars: 500
  hiring_manager_role_specific:
    words: [55, 75]
    sentences: [3, 4]
    hard_cap_chars: 750
  executive_role_specific:
    words: [45, 70]
    sentences: [3, 4]
    hard_cap_chars: 700
  executive_general_intro:
    words: [35, 55]
    sentences: [2, 3]
    hard_cap_chars: 500
  c_level_role_specific:
    words: [35, 60]
    sentences: [2, 3]
    hard_cap_chars: 550
  c_level_general_intro:
    words: [30, 55]
    sentences: [2, 3]
    hard_cap_chars: 500
  executive_trigger:
    words: [35, 60]
    sentences: [2, 3]
    hard_cap_chars: 550
  referral_ask:
    words: [50, 75]
    sentences: [3, 4]
    hard_cap_chars: 700
  follow_up_short:
    words: [25, 45]
    sentences: [1, 2]
    hard_cap_chars: 400
  follow_up_role_or_status:
    words: [35, 60]
    sentences: [2, 3]
    hard_cap_chars: 600

request_contract:
  required_fields:
    - prompt_contract_id
    - component_hash_map
    - message_type
    - modifiers
    - recipient_class
    - length_budget
    - reasoning_policy
    - proof_packet_id
    - allowed_claim_ids
    - jd_fields
    - no_send_receipt
    - no_durable_write_receipt
    - instruction_data_boundary_receipt

candidate_contract:
  required_fields:
    - candidate_id
    - draft_text
    - attempt_seed
    - model_id
    - provider_id
    - temperature
    - top_p
    - word_count
    - sentence_count
    - char_count
    - claims_used
    - is_whole_message
    - no_durable_write_receipt
  hard_rules:
    - complete LinkedIn/InMail message only
    - no section headers or body fragments
    - every factual sender claim maps to an allowed proof ID
    - no missing-evidence repair through generation

acceptance:
  - PA request contains final C0-stamped message_type, modifiers, class, length budget, proof packet, JD fields, objective, and no-send policy.
  - SC candidate counts and repair budgets follow the risk matrix.
  - L2 candidate artifacts are whole-message only, not header/body/footer assembly.
  - High-temperature generator parameters are selected for L2 while judge/repair temperatures remain low.
  - Blocked W4/W5 inputs do not produce candidates.

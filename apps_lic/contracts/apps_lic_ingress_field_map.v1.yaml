# apps_lic ingress contract v1 — field map SSOT
#
# Maps every JSON Pointer produced by AppsLicIngressContractV1.model_dump()
# to its downstream consumer and status.
#
# Status taxonomy (exactly one per pointer):
#   MAPPED    — reflected verbatim into a downstream contract (W3+)
#   DERIVED   — consumed but transformed (normalization, digest, enum coercion)
#   REJECTED  — explicitly blocked at U0 (governance field that cannot be
#               disabled; U0 raises if the structurally-accepted value is
#               enforcement-blocked at the policy level)
#   DEFERRED  — recognized in v1 schema but not yet wired to a named
#               downstream consumer; MUST carry an explicit reason linking
#               to the plan wave or AG decision that will wire it
#
# CORE RULE: a field may be deferred. A field may not disappear.
#
# The U0 reflection adapter:
#   1. Enumerates JSON Pointers from AppsLicIngressContractV1.model_dump()
#   2. Looks up each pointer in `mappings` below
#   3. Pointers without a `mappings` entry → SILENTLY_DROPPED → fail closed
#   4. `mappings` entries with status outside the taxonomy → UNKNOWN_MAPPING → fail closed
#
# Plan: docs/archive/windsurf/legacy-tree/plans/apps-lic-ag8-golden-template-adoption-f3c2e1.md (W3)
# Schema ref: artifacts/apps_lic/ag8_apps_lic_payload_schema.json
# Mapping ref: artifacts/apps_lic/ag8_apps_lic_payload_mapping_matrix.json

version: v1
contract_module: apps_lic.contracts.apps_lic_ingress_contract_v1
schema_version: apps_lic_ingress_contract/v1

policy:
  fail_on_silently_dropped: true
  fail_on_unknown_mapping: true
  fail_on_unknown_pointer: true
  permitted_statuses:
    - MAPPED
    - DERIVED
    - REJECTED
    - DEFERRED

# Pattern (prefix) mappings for open-vocabulary sub-object trees.
# Exact mappings below take priority; only uncovered pointers fall through here.
pattern_mappings:
  /entity_refs/lead_profile/:
    status: MAPPED
    target: ValidatedRequest.app_payload.entity_refs.lead_profile.<key>
    reason: "Inline lead profile sub-fields preserved verbatim under app_payload for C0/PA consumption (W4-W5)"

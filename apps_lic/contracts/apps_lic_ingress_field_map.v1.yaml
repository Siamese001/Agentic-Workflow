    reason: "Open-vocabulary personalization signals preserved verbatim; forbidden-key check runs at Pydantic validation time"
  /research_requirements/required_evidence_types/:
    status: DEFERRED
    target: apps_lic C0 binding (W5)
    reason: "Evidence type hints consumed by C0 retrieval binding — wired in W5"
  /research_requirements/prohibited_source_types/:
    status: DEFERRED
    target: apps_lic C0 binding (W5)
    reason: "Prohibited source types consumed by C0 retrieval binding — wired in W5"
  /routing_policy/:
    status: DEFERRED
    target: apps_lic L0 binding (W4)
    reason: "Routing hints consumed by L0 binding — wired in W4"
  /ab_test/:
    status: DEFERRED
    target: apps_lic L0 binding A/B arm selection (W4)

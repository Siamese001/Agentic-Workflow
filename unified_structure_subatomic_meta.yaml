# =====================================================================
# unified_structure_subatomic_meta.yaml (Meta YAML v4.0 — FULL OVERWRITE)
# =====================================================================

# ---------------------------------------------------------------------
# 1. CANONICAL SSoT DEFINITION
# ---------------------------------------------------------------------
canonical_definition: >
  Canonical Single Source of Truth (SSoT) is defined as the structural
  merge of:
      • unified_structure_subatomic.yaml   (primary architecture map)
      • unified_structure_subatomic_meta.yaml (meta rules + invariants)
  The primary YAML defines the filesystem shape, domain hierarchy,
  cognitive structure, and allowed paths. The meta YAML defines
  invariants, protected paths, enforcement policies, and domain rules.
  This is a static, authoritative specification for how the repository
  should be shaped and interpreted—no phase execution is required.

# ---------------------------------------------------------------------
# 2. PROTECTED PATHS — DO NOT MOVE, DELETE, REWRITE, OR MODIFY
# ---------------------------------------------------------------------
protected_paths:
  - "**/__init__.py"
  - "**/*.md"
  - ".git/**"
  - ".venv/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"

  # Entire shared-engine library must be immutable
  - "shared_engine_ops/**"

  # 06_data curated knowledge zones (SSoT v4.2)
  - "06_data/semantic_cache/v*_curated/**"
  - "06_data/prompt_libraries/**"
  - "06_data/eval_benchmarks/**"
  - "06_data/openai_best_practices/**"
  - "06_data/reference_playbooks/**"
  - "06_data/examples/**"
  - "06_data/archives/**.json"
  - "06_data/**.md"

# ---------------------------------------------------------------------
# 3. DOMAIN-LEVEL INVARIANTS
# ---------------------------------------------------------------------
domain_invariants:

  # ============================
  # SHARED ENGINE OPERATIONS (Library)
  # ============================
  shared_engine_ops:
    description: >
      Foundational library containing reusable cognitive, inspection,
      aggregation, scoring, embedding, and safety utilities.
      All engines reference this library; no files may be renamed,
      relocated, or deleted.
    model: "library_support"
    protected: true
    allowed_roots:
      - cognition_ops
      - inspection_ops
      - aggregation_ops
      - safety_ops
      - embedding_ops
      - scoring_ops
      - update_ops
      - tool_ops

  # ============================
  # COGNITIVE ENGINE DOMAINS
  # ============================
  agentic_core:
    description: "Primary cognitive engine. Full L1–L5 and P1–P4 structure."
    model: "cognitive_engine"
    filename_prefix: null
    require_filename_prefixes: false  # Rec 6: Explicit prefix exemption
    allowed_layers:
      - L1_cognition
      - L2_execution
      - L3_orchestration
      - L4_memory
      - L5_safety
    allowed_phases:
      - P1_retrieve
      - P2_inspect
      - P3_aggregate
      - P4_safety
    # Rec 2: P1_retrieve included at domain level; layer rules gate actual placement
    forbidden_patterns: []

  apps_lic:
    description: "Outreach / personalization engine. RG forbidden."
    model: "cognitive_engine"
    filename_prefix: "lic_"
    allowed_layers:
      - L1_cognition
      - L2_execution
      - L3_orchestration
      - L4_memory
      - L5_safety
    allowed_phases:
      - P1_retrieve
      - P2_inspect
      - P3_aggregate
      - P4_safety
    # Rec 2: P1_retrieve included at domain level; layer rules gate actual placement
    forbidden_patterns: []

  apps_rg:
    description: "Resume engine. LIC forbidden."
    model: "cognitive_engine"
    filename_prefix: "rg_"
    allowed_layers:
      - L1_cognition
      - L2_execution
      - L3_orchestration
      - L4_memory
      - L5_safety
    allowed_phases:
      - P1_retrieve
      - P2_inspect
      - P3_aggregate
      - P4_safety
    # Rec 2: P1_retrieve included at domain level; layer rules gate actual placement
    forbidden_patterns: []

  # ============================
  # SUPPORT DOMAINS (Operational Model)
  # ============================
  schemas:
    description: "Model definitions and validation logic."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  runtime:
    description: "Execution harnesses and runtime configuration."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  prompt_governance:
    description: "Prompt policies, templates, and governance."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  config:
    description: "Registry parsing, environment, platform settings."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  data:
    description: "Durable, versioned, human-curated data plane. No executables. No runtime artifacts."
    model: "operational_support"
    forbidden_patterns:
      - "*.py"
      - "__pycache__"
      - "phase*"
      - "backup"
      - "index"
      - "log*"
      - "temp*"
      - "dedup*"
      - "stub*"
      - "freeze*"
      - "merge*"
      - "manifest*"
    allowed_layers:
      - semantic_cache
      - prompt_libraries
      - eval_benchmarks
      - openai_best_practices
      - reference_playbooks
      - examples
      - archives
    max_depth: 5

  observability:
    description: "Telemetry, monitoring, metrics."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  scripts:
    description: "CLI tools, developer utilities, automation."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  shared:
    description: "Common utilities not tied to a specific engine."
    model: "operational_support"
    forbidden_patterns: ["L[0-9]+_*", "P[0-9]+_*"]
    # Rec 3: Aligned with actual repo directory structure
    allowed_layers: ["logic", "runtime_ops", "pipeline_ops", "cache_ops", "security_controls"]
    max_depth: 7

  # ============================
  # TEST DOMAIN (High-signal taxonomy)
  # ============================
  tests:
    description: >
      Test plane with strict taxonomy (unit, integration, e2e, golden, perf, load).
      Absolutely no cognitive L1–L5 mirroring. Uses high-signal ≥5-depth structures.
    model: "test_taxonomy"
    forbidden_patterns: []
    max_depth: 7
    enforce_allowed_structure: true
    auto_generate_missing_paths: false

    allowed_structure:
      unit:
        - agentic_core
        - apps_lic
        - apps_rg
        - runtime
        - data
        - schemas
        - prompt_governance
        - config
        - observability
        - scripts

      integration:
        - core_plus_runtime
        - lic_plus_data
        - rg_plus_data
        - full_pipeline

      e2e:
        - outreach_flows
        - resume_flows
        - admin_flows

      golden:
        - prompts
        - semantics
        - safety

      perf:
        - latency
        - throughput
        - cost

      load:
        - spike
        - soak

  cognitive_layer_phase_rules:
    L1_cognition:
      allowed_phases: [P1_retrieve, P2_inspect, P3_aggregate, P4_safety]
    L2_execution:
      allowed_phases: []
    L3_orchestration:
      allowed_phases: []
    L4_memory:
      allowed_phases: [P1_retrieve]
    L5_safety:
      allowed_phases: []

# ---------------------------------------------------------------------
# 4. STRUCTURAL CONSISTENCY RULES (GLOBAL)
# ---------------------------------------------------------------------
structural_rules:
  max_depth: 7
  no_duplicate_keys: true
  enforce_null_for_files: true
  enforce_dict_for_directories: true

# ---------------------------------------------------------------------
# 5. DOMAIN OVERRIDES AND EXCEPTIONS
# ---------------------------------------------------------------------
domain_overrides:

  shared_engine_ops:
    immutable: true
    allow_heuristic_inference: false
    protected_paths: ["**"]

  cognitive_domains:
    domains: [agentic_core, apps_lic, apps_rg]
    allow_cognitive_inference: true
    require_filename_prefixes: true
    enforce_layer_phase_matrix: true

  # Rec 6: Explicit prefix exemption for agentic_core
  agentic_core:
    require_filename_prefixes: false

  support_domains:
    domains:
      - schemas
      - runtime
      - prompt_governance
      - config
      - data
      - observability
      - scripts
      - shared
    allow_cognitive_inference: false
    require_filename_prefixes: false

  test_domains:
    domains: [tests]
    allow_cognitive_inference: false
    require_filename_prefixes: false
    use_yaml_taxonomy_only: true

# ---------------------------------------------------------------------
# 6. RUNTIME ENFORCEMENT RULES (SSoT Governance)
# ---------------------------------------------------------------------
# NOTE: These rules govern repo structure at runtime, not via phase execution.
# The YAML pair is a static, authoritative specification.
runtime_enforcement:

  # YAML Requirements
  require_meta_yaml: true
  require_main_yaml: true

  # Protection
  skip_protected_paths: true
  preserve_protected_content: true

  # Domain Inference
  enforce_domain_modes: true
  enforce_structure_types: true
  enforce_max_depth: true

  # Naming / Prefixing
  enforce_prefix_rules: true
  strict_engine_namespace_mapping: true

  # Cognitive Gating
  block_cognitive_inference_in_support_domains: true
  block_l_p_patterns_in_support_domains: true

  # SSoT-first logic
  yaml_first_placement: true
  disable_heuristic_only_inference: true
  use_unassigned_buckets_only_when_yaml_absent: true

  # Testing
  use_yaml_test_taxonomy: true
  no_l_layer_inference_in_tests: true

# ---------------------------------------------------------------------
# 7. VALIDATION INVARIANTS (SSoT Governance)
# ---------------------------------------------------------------------
validation_invariants:
  K1: "YAML must parse correctly."
  K2: "META must parse correctly."
  K3: "Root domain folders must exist."
  K4: "Primary YAML must contain canonical domain keys."
  K5: "Domain modes must be valid."
  K6: "Max depth ≤ 7 must hold."
  K7: "Forbidden patterns must be blocked."
  K8: "Engine namespace prefixes must be enforced."
  K9: "No L-layers in support domains."
  K10: "Test taxonomy must be used exactly as defined."
  K11: "shared_engine_ops must remain immutable."
  K12: "No cognitive fillers in L5_safety."
  K13: "Semantic cache hooks exist where required."
  K14: "Protected paths respected."

  # Extended rules
  no_shadow_branches: true
  no_partial_layers: true
  no_partial_phases: true

  allowed_engine_subfolders:
    - business_ops
    - scoring_ops
    - state_update_ops
    - diagnostics_ops
    - vectorization_ops
    - personalization_ops
    - job_fit_ops
    - embedding_compare_meaning
    - utility_prepare_information
    - semantic_adjust_scores
    - check_structure
    - convert_content
    - refinement_adjust_scores
    - routing_retry_task
    - use_tools
    - check_rules
    - get_info
    - manage_costs
    - semantic_cache

  # Rec 9: Semantic role map for engine subfolders
  # Tightens domain definition and makes repo self-explanatory
  engine_subfolder_roles:
    business_ops: "domain-specific transformations and decision rules"
    scoring_ops: "numerical ranking, scoring, weighting"
    state_update_ops: "modification of engine persistent or transient state"
    diagnostics_ops: "inspection, telemetry, state introspection"
    vectorization_ops: "embedding, vector operations, similarity"
    personalization_ops: "outreach-specific personalization logic (apps_lic)"
    job_fit_ops: "resume-job matching logic (apps_rg)"
    embedding_compare_meaning: "semantic similarity and embedding comparison"
    utility_prepare_information: "data formatting, payload preparation, serialization"
    semantic_adjust_scores: "semantic-aware score adjustments"
    check_structure: "structural validation and schema enforcement"
    convert_content: "content transformation and format conversion"
    refinement_adjust_scores: "post-scoring fine-tuning and weight adjustment"
    routing_retry_task: "retry logic, backoff, failure handling"
    use_tools: "LLM/tool call logic and external service invocation"
    check_rules: "policy enforcement and rule validation"
    get_info: "information retrieval and context gathering"
    manage_costs: "budget tracking, usage limits, cost enforcement"
    semantic_cache: "semantic cache index loading, history matching, distance computation"

  # NOTE: Removed overly restrictive forbidden_phase_layer_combinations
  # The actual codebase uses all P1-P4 phases under all L1-L5 layers
  # This is a valid architectural choice for the agentic_core domain
  forbidden_phase_layer_combinations: []

  allowed_support_layers:
    - semantic_cache
    - prompt_libraries
    - eval_benchmarks
    - openai_best_practices
    - reference_playbooks
    - examples
    - archives
    # Non-data support domains retain their original layers
    - logic
    - runtime_ops
    - pipeline_ops
    - cache_ops
    - security_controls
    - templates
    - YAML
    - compat
    - shared
    - migration
    - utilities

  allowed_support_ops:
    - data_access
    - validation
    - synthesis
    - guardrails

  forbidden_layer_tokens: ["L1_", "L2_", "L3_", "L4_", "L5_"]
  forbidden_phase_tokens: ["P1_", "P2_", "P3_", "P4_"]

  disallowed_low_signal_names:
    # Exact match only - avoid false positives like "templates" matching "temp"
    - "misc"
    - "other"
    - "stuff"
    - "sperson"
    - "sjob_fit"
    - "sengagement_potential"
    - "seffectiveness"
    - "sresume_effectiveness"

# ---------------------------------------------------------------------
# 8. ENGINE SEPARATION RULES
# ---------------------------------------------------------------------
engine_separation:
  outreach_engine:
    root: "apps_lic"
    forbidden_tokens:
      - "resume"
      - "job_fit"
      - "work_experience"
      - "skills_ranking"

  resume_engine:
    root: "apps_rg"
    forbidden_tokens:
      - "outreach"
      - "recipient"
      - "personalization"
      - "message_template"

  shared_common_tokens:
    allowed:
      - "embedding"
      - "filters"
      - "serialization"
      - "normalization"
    description: "Utilities shared only under shared/ or shared_engine_ops/."

# ---------------------------------------------------------------------
# 9. SEMANTIC CACHE RULES
# ---------------------------------------------------------------------
semantic_cache_rules:
  required_locations: []
  required_files: []
  forbidden_locations: []
  description: "semantic_cache is now a durable curated asset under 06_data/semantic_cache/v*_curated/. No longer runtime-coupled."

# ---------------------------------------------------------------------
# 10. META VERSIONING
# ---------------------------------------------------------------------
meta_version: "4.2"
created_by: "Agentic-Workflow Hardened Architecture"
notes: >
  Hardened meta-YAML aligned to SSoT v4.2 (static governance model).
  - v4.2: 06_data converted to pure durable knowledge plane (OpenAI-grade).
  - semantic_cache migrated from runtime component to curated asset.
  - No Phase 0.5–4 execution; YAML pair is static, authoritative specification.
  - Rec 1: Test taxonomy unified into META as single authoritative definition.
  - Rec 2: Cognitive domain allowed_phases now inclusive (P1–P4); layer rules gate placement.
  - Rec 3: Support-domain allowed_layers aligned with actual repo structure.
  - Rec 4: Cost-management directories normalized to hierarchical manage_costs/state_update_ops.
  - Rec 5: Global structural invariants consolidated into META only.
  - Rec 6: agentic_core explicitly exempt from filename prefixes.
  - Rec 7: apps aggregate folder removed; apps_rg/apps_lic are top-level logical domains.
  - Rec 8: Semantic-cache structure exposed directly in YAML under L1/L4 P1_retrieve.
  - Rec 9: Engine subfolder semantic roles added for self-documenting repo.
  - Max depth standardized to 7 across all domains.
  - L/P forbidden only in support domains.
  - Engine prefixing and separation rules fully formalized.
  - Protected paths normalized.



# ---------------------------------------------------------------------
# 11. SUBATOMIC CANON 2025 — FINAL
# ---------------------------------------------------------------------
subatomic_canon_2025:
  enforced: true
  principles_applied:
    - only_three_agents_have_L1_L5
    - only_L1_has_phases
    - L2_L3_L5_flat
    - L4_retrieval_only
    - imperative_verb_naming
    - banned_low_signal_words
    - natural_depth_no_padding
    - self_teaching_names

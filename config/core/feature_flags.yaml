# Feature Flags Configuration
# Toggle features on/off per environment

# Core System Features
system_features:
  enable_caching: true
  enable_metrics: true
  enable_tracing: true
  enable_health_checks: true
  
# L1 Planning Features
l1_planning:
  enable_strategy_planning: true
  enable_research_planning: true
  enable_message_planning: true
  enable_safety_planning: true
  
# L2 Execution Features
l2_execution:
  enable_tool_registry: true
  enable_retry_policies: true
  enable_cost_tracking: true
  enable_parallel_execution: false
  
# L3 Orchestration Features
l3_orchestration:
  enable_workflow_graph: true
  enable_fallback_policies: true
  enable_budget_enforcement: true
  enable_concurrency_control: true
  
# L4 Memory & State Features
l4_state:
  enable_memory_store: true
  enable_vector_cache: true
  enable_persistence: true
  enable_recency_policies: true
  
# L5 Safety Features
l5_safety:
  enable_safety_policies: true
  enable_pii_filters: true
  enable_guardrails: true
  enable_redline_rules: true
  
# Engine Features
engines:
  resume_engine:
    enable_scoring: true
    enable_ats_optimization: true
    enable_skill_extraction: true
  outreach_engine:
    enable_archetype_weighting: true
    enable_personalization: true
    enable_cadence_rules: true
    
# Model Routing Features
model_routing:
  enable_smart_routing: true
  enable_budget_bands: true
  enable_fallback_routing: true
  enable_evaluation_weights: true
  
# Development/Debug Features
debug_features:
  enable_verbose_logging: false
  enable_debug_endpoints: false
  enable_performance_profiling: false
  enable_feature_experimentation: false

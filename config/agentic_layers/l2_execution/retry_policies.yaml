# L2 Retry Policies Configuration
# Retry logic and failure handling strategies

# Global Retry Settings
retry:
  enabled: true
  default_max_attempts: 3
  default_backoff_base: 1.0  # seconds
  max_backoff_delay: 60  # seconds
  jitter_enabled: true

# Error Category-Specific Policies
error_categories:
  network_errors:
    max_attempts: 5
    backoff_strategy: exponential
    base_delay: 2.0
    max_delay: 30
    retry_on:
      - timeout
      - connection_error
      - dns_error
      - rate_limit
  
  api_errors:
    max_attempts: 3
    backoff_strategy: linear
    base_delay: 5.0
    max_delay: 15
    retry_on:
      - service_unavailable
      - rate_limit_exceeded
      - temporary_failure
    no_retry_on:
      - authentication_error
      - authorization_error
      - invalid_request
  
  tool_errors:
    max_attempts: 2
    backoff_strategy: fixed
    base_delay: 1.0
    max_delay: 5
    retry_on:
      - tool_timeout
      - resource_unavailable
      - concurrent_limit
  
  validation_errors:
    max_attempts: 1
    backoff_strategy: none
    retry_on: []

# Tool-Specific Retry Policies
tool_policies:
  web_search:
    max_attempts: 4
    backoff_strategy: exponential
    base_delay: 1.0
    max_delay: 20
  
  content_generation:
    max_attempts: 2
    backoff_strategy: linear
    base_delay: 3.0
    max_delay: 10
  
  document_processing:
    max_attempts: 3
    backoff_strategy: exponential
    base_delay: 2.0
    max_delay: 15
  
  analysis_tools:
    max_attempts: 2
    backoff_strategy: fixed
    base_delay: 1.0
    max_delay: 3

# Backoff Strategies
strategies:
  exponential:
    multiplier: 2.0
    jitter: true
    jitter_range: 0.1
  
  linear:
    increment: 1.0
    jitter: false
  
  fixed:
    delay: 1.0
    jitter: false

# Retry Conditions
conditions:
  min_retry_interval: 0.5  # seconds
  max_retry_interval: 300  # seconds
  retry_timeout: 600  # seconds total
  memory_pressure_threshold: 0.9

# Circuit Breaker Integration
circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout: 60  # seconds
  half_open_max_calls: 3

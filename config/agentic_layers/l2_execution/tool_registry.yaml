# L2 Tool Registry Configuration
# Tool registration, availability, and execution parameters

# Tool Registry Parameters
registry:
  max_tools_per_session: 50
  tool_timeout: 120  # seconds
  enable_tool_caching: true
  tool_discovery_interval: 300  # seconds

# Tool Categories
categories:
  research_tools:
    enabled: true
    timeout: 90
    retry_attempts: 2
    tools:
      - web_search
      - document_retrieval
      - company_research
      - contact_lookup
  
  generation_tools:
    enabled: true
    timeout: 60
    retry_attempts: 1
    tools:
      - resume_generator
      - message_generator
      - cover_letter_writer
      - follow_up_drafter
  
  analysis_tools:
    enabled: true
    timeout: 45
    retry_attempts: 1
    tools:
      - skill_analyzer
      - ats_checker
      - sentiment_analyzer
      - plagiarism_detector
  
  validation_tools:
    enabled: true
    timeout: 30
    retry_attempts: 1
    tools:
      - grammar_checker
      - format_validator
      - content_validator
      - safety_checker

# Tool Execution Parameters
execution:
  default_timeout: 60  # seconds
  max_concurrent_tools: 5
  tool_memory_limit: 256  # MB
  enable_parallel_execution: false
  
# Tool Dependencies
dependencies:
  web_search:
    requires:
      - search_api_key
      - rate_limiter
    conflicts: []
  
  document_retrieval:
    requires:
      - storage_access
    conflicts: []
  
  resume_generator:
    requires:
      - template_engine
      - skill_analyzer
    conflicts: [document_retrieval]

# Tool Health Monitoring
health_monitoring:
  enabled: true
  check_interval: 60  # seconds
  failure_threshold: 3
  auto_recovery: true
  health_check_timeout: 10

# L5 Guardrails Configuration
# System guardrails and boundary enforcement policies

# Guardrail Framework
guardrails:
  enabled: true
  enforcement_mode: strict
  violation_action: block
  audit_violations: true

# Content Guardrails
content_guardrails:
  toxicity:
    max_toxicity_score: 0.2
    model: perspective_api
    action: block
  
  profanity:
    max_profanity_score: 0.1
    custom_word_list: true
    action: flag
  
  hate_speech:
    max_hate_score: 0.05
    protected_groups: all
    action: block
  
  violence:
    max_violence_score: 0.1
    context_aware: true
    action: block

# Operational Guardrails
operational_guardrails:
  resource_limits:
    max_memory_per_request: 512  # MB
    max_processing_time: 300  # seconds
    max_concurrent_requests: 10
  
  rate_limiting:
    requests_per_minute: 60
    burst_limit: 10
    penalty_exponential_backoff: true
  
  error_thresholds:
    max_error_rate: 0.1
    max_timeout_rate: 0.05
    circuit_breaker_threshold: 5

# Data Guardrails
data_guardrails:
  input_validation:
    max_input_size: 100000  # characters
    allowed_file_types: [txt, pdf, docx]
    scan_malware: true
  
  output_validation:
    max_output_size: 50000  # characters
    content_filtering: true
    quality_threshold: 0.6
  
  privacy_protection:
    pii_detection: true
    data_masking: true
    retention_limits: true

# Business Logic Guardrails
business_guardrails:
  resume_processing:
    max_resume_length: 5  # pages
    required_sections: [contact, experience, education]
    ats_compatibility_required: true
  
  outreach_campaign:
    max_messages_per_day: 50
    min_personalization_score: 0.5
    consent_verification: true
  
  content_generation:
    max_tokens_per_request: 2000
    plagiarism_check: true
    factual_accuracy_check: true

# Security Guardrails
security_guardrails:
  authentication:
    session_timeout: 1800  # seconds
    max_login_attempts: 5
    password_complexity: true
  
  authorization:
    role_based_access: true
    principle_of_least_privilege: true
    audit_access: true
  
  data_protection:
    encryption_at_rest: true
    encryption_in_transit: true
    key_rotation: true

# Ethical Guardrails
ethical_guardrails:
  bias_detection:
    gender_bias: true
    racial_bias: true
    age_bias: true
    disability_bias: true
  
  fairness:
    equal_opportunity_language: true
    inclusive_language: true
    cultural_sensitivity: true
  
  transparency:
    explainable_ai: true
    model_confidence_disclosure: true
    limitation_disclosure: true

# L3 Orchestration Rules Configuration
# Business rules and decision logic for workflow orchestration

# Orchestration Rules Engine
rules_engine:
  enabled: true
  rule_evaluation_timeout: 30  # seconds
  max_rules_per_evaluation: 50
  enable_rule_caching: true

# Priority Rules
priorities:
  safety_first: true
  cost_optimization: 0.7
  performance_optimization: 0.8
  user_experience: 0.9

# Decision Rules
decision_rules:
  workflow_selection:
    resume_processing:
      conditions:
        - has_resume: true
        - has_job_description: true
      priority: 1
      timeout: 600
    
    outreach_campaign:
      conditions:
        - has_target_company: true
        - has_contact_info: false
      priority: 2
      timeout: 900
    
    message_generation:
      conditions:
        - has_research_data: true
        - has_message_template: true
      priority: 3
      timeout: 300

# Resource Allocation Rules
resource_allocation:
  cpu_allocation:
    high_priority: 80  # percentage
    medium_priority: 50
    low_priority: 20
  
  memory_allocation:
    high_priority: 512  # MB
    medium_priority: 256
    low_priority: 128
  
  api_rate_limits:
    high_priority: 100  # requests/minute
    medium_priority: 60
    low_priority: 30

# Error Handling Rules
error_handling:
  automatic_retry:
    enabled: true
    max_attempts: 3
    backoff_strategy: exponential
  
  fallback_triggers:
    - timeout_exceeded
    - resource_exhausted
    - api_failure
    - validation_failure
  
  escalation_rules:
    critical_errors:
      - safety_violation
      - data_corruption
      - security_breach
      action: immediate_stop
  
    warning_errors:
      - performance_degradation
      - cost_overrun
      - quality_threshold_miss
      action: log_and_continue

# Concurrency Rules
concurrency:
  max_concurrent_workflows: 5
  max_concurrent_nodes_per_workflow: 3
  resource_sharing_policy: fair_share
  deadlock_prevention: true

# State Transition Rules
state_transitions:
  allowed_transitions:
    - from: "planning"
      to: ["execution", "failed"]
    - from: "execution"
      to: ["validation", "failed", "retry"]
    - from: "validation"
      to: ["completion", "retry", "failed"]
    - from: "failed"
      to: ["retry", "escalation"]
  
  transition_conditions:
    planning_to_execution:
      required: ["plan_approved", "resources_available"]
    
    execution_to_validation:
      required: ["execution_complete", "output_valid"]
    
    validation_to_completion:
      required: ["all_checks_passed", "quality_met"]

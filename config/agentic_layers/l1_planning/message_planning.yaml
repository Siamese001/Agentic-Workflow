# L1 Message Planning Configuration
# Message composition and communication strategy parameters

# Message Planning Parameters
message:
  max_message_length: 100000  # characters
  tone_variations: 5
  personalization_depth: 3
  message_timeout: 45  # seconds

# Resume-Related Messages
resume_messages:
  cover_letter:
    max_paragraphs: 4
    max_chars_per_paragraph: 200
    required_sections:
      - introduction
      - relevant_experience
      - skill_alignment
      - call_to_action
  
  follow_up:
    max_chars: 500
    timing_options:
      - immediate: 0
      - one_day: 1
      - three_days: 3
      - one_week: 7

# Outreach Messages
outreach_messages:
  initial_contact:
    subject_max_chars: 100
    body_max_chars: 800
    personalization_elements:
      - company_research: 0.3
      - recipient_background: 0.4
      - mutual_connections: 0.2
      - recent_activity: 0.1
  
  follow_up:
    sequences:
      - delay_days: 3
        max_chars: 400
        tone: friendly_reminder
      - delay_days: 7
        max_chars: 300
        tone: value_proposition
      - delay_days: 14
        max_chars: 200
        tone: final_outreach

# Message Tone and Style
tone_profiles:
  professional:
    formality: 0.9
    enthusiasm: 0.3
    confidence: 0.8
  
  casual:
    formality: 0.5
    enthusiasm: 0.7
    confidence: 0.6
  
  enthusiastic:
    formality: 0.6
    enthusiasm: 0.9
    confidence: 0.7
  
  technical:
    formality: 0.8
    enthusiasm: 0.4
    confidence: 0.9

# Message Quality Control
quality_control:
  grammar_check: true
  tone_consistency: true
  length_validation: true
  personalization_threshold: 0.5
  spam_score_threshold: 0.3

# L1 Safety Planning Configuration
# Safety assessment and risk mitigation planning parameters

# Safety Planning Parameters
safety:
  risk_assessment_timeout: 30  # seconds
  max_risk_factors: 10
  safety_threshold: 0.8
  escalation_threshold: 0.9

# Risk Categories
risk_categories:
  content_safety:
    weight: 0.4
    threshold: 0.7
    factors:
      - inappropriate_language
      - harmful_content
      - misinformation
      - bias_detection
  
  privacy_safety:
    weight: 0.3
    threshold: 0.8
    factors:
      - pii_detection
      - personal_data_exposure
      - confidential_information
      - gdpr_compliance
  
  operational_safety:
    weight: 0.2
    threshold: 0.6
    factors:
      - resource_limits
      - api_rate_limits
      - system_stability
      - error_handling
  
  legal_safety:
    weight: 0.1
    threshold: 0.9
    factors:
      - compliance_requirements
      - regulatory_constraints
      - intellectual_property
      - employment_law

# Safety Planning Strategies
strategies:
  preventive:
    enable_pre_checks: true
    enable_content_filters: true
    enable_privacy_masks: true
    enable_compliance_validation: true
  
  reactive:
    enable_incident_logging: true
    enable_automatic_rollback: true
    enable_user_notifications: true
    enable escalation_procedures: true

# Safety Validation Rules
validation:
  content_rules:
    max_profanity_score: 0.1
    max_toxicity_score: 0.2
    max_bias_score: 0.3
    require_fact_checking: true
  
  privacy_rules:
    mask_ssn: true
    mask_email: true
    mask_phone: true
    mask_address: true
    mask_financial_data: true
  
  operational_rules:
    max_api_calls_per_minute: 60
    max_concurrent_requests: 10
    max_processing_time: 300
    enable_circuit_breaker: true

# Safety Monitoring
monitoring:
  real_time_scanning: true
  audit_logging: true
  anomaly_detection: true
  performance_impact_threshold: 0.1

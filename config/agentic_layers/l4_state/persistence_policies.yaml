# L4 Persistence Policies Configuration
# Data persistence and durability policies

# Persistence Policy Framework
persistence_policy:
  enabled: true
  durability_level: high
  backup_frequency: 3600  # seconds
  consistency_level: strong

# Persistence Tiers
tiers:
  critical:
    replication_factor: 3
    sync_write: true
    backup_retention: 30  # days
    compression: false
    data_types:
      - user_credentials
      - financial_data
      - legal_documents
  
  important:
    replication_factor: 2
    sync_write: true
    backup_retention: 7  # days
    compression: true
    data_types:
      - user_profiles
      - workflow_states
      - generated_content
  
  temporary:
    replication_factor: 1
    sync_write: false
    backup_retention: 1  # day
    compression: true
    data_types:
      - cache_data
      - session_data
      - intermediate_results

# Storage Policies
storage:
  primary_storage:
    type: database
    retention_period: 2592000  # 30 days
    max_size: 10240  # MB
    cleanup_policy: age_based
  
  backup_storage:
    type: object_storage
    retention_period: 7776000  # 90 days
    max_size: 51200  # MB
    compression: true
  
  archive_storage:
    type: cold_storage
    retention_period: 31536000  # 365 days
    max_size: 102400  # MB
    compression: true

# Data Lifecycle Management
lifecycle:
  creation:
    auto_timestamp: true
    version_control: true
    metadata_capture: true
  
  retention:
    automatic_cleanup: true
    grace_period: 86400  # seconds
    user_notification: true
  
  archival:
    auto_archive: true
    archive_threshold: 90  # days
    compression_before_archive: true
  
  deletion:
    soft_delete: true
    hard_delete_after: 30  # days
    compliance_check: true

# Consistency Policies
consistency:
  read_after_write: true
  transaction_isolation: serializable
  conflict_resolution: last_writer_wins
  distributed_consistency: true

# Recovery Policies
recovery:
  point_in_time_recovery: true
  recovery_time_objective: 300  # seconds
  recovery_point_objective: 900  # seconds
  automatic_failover: true
  
  backup_strategies:
    - incremental_backup
    - full_backup
    - differential_backup

# Performance Optimization
optimization:
  enable_compression: true
  compression_algorithm: gzip
  enable_deduplication: true
  enable_lazy_loading: true
  batch_operations: true

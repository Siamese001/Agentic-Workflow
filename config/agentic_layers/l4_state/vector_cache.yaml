# L4 Vector Cache Configuration
# Vector storage and similarity search caching

# Vector Cache Settings
vector_cache:
  enabled: true
  dimension: 1536
  max_vectors: 100000
  cache_size: 512  # MB
  similarity_threshold: 0.8

# Vector Storage Backends
backends:
  primary:
    type: chromadb
    host: localhost
    port: 8000
    collection_name: agentic_cache
    embedding_model: text-embedding-ada-002
  
  secondary:
    type: pinecone
    environment: ${PINECONE_ENVIRONMENT}
    index_name: agentic-workflow-cache
    dimension: 1536
  
  fallback:
    type: faiss
    storage_path: ./data/vectors
    index_type: ivf_flat

# Cache Categories
categories:
  embeddings:
    ttl: 86400  # 24 hours
    max_size: 100  # MB
    similarity_threshold: 0.9
  
  semantic_search:
    ttl: 3600  # 1 hour
    max_size: 200  # MB
    similarity_threshold: 0.8
  
  content_similarity:
    ttl: 7200  # 2 hours
    max_size: 150  # MB
    similarity_threshold: 0.7
  
  user_preferences:
    ttl: 604800  # 7 days
    max_size: 50  # MB
    similarity_threshold: 0.6

# Vector Operations
operations:
  search:
    top_k: 10
    timeout: 500  # milliseconds
    include_metadata: true
  
  store:
    batch_size: 100
    timeout: 1000  # milliseconds
    async_enabled: true
  
  update:
    upsert_enabled: true
    conflict_resolution: overwrite
  
  delete:
    soft_delete: true
    purge_interval: 86400  # seconds

# Performance Optimization
optimization:
  enable_compression: true
  compression_ratio: 0.7
  enable_quantization: false
  batch_operations: true
  prefetch_enabled: true

# Cache Management
management:
  cleanup_interval: 3600  # seconds
  eviction_policy: lru
  max_memory_usage: 0.8
  auto_compaction: true

# Monitoring
monitoring:
  track_hit_rate: true
  track_search_performance: true
  track_storage_usage: true
  alert_on_memory_pressure: true

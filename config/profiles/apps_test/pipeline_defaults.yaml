# Test app pipeline defaults

schema_version: "1.0"
profile_type: "pipeline_defaults"
app_id: "apps_test"

pipeline_config:
  default_timeout_seconds: 300
  max_retries: 2
  retry_backoff_seconds: 5
  parallel_stage_execution: false
  stage_failure_behavior: "fail_fast"

namespace_defaults:
  artifact_namespace: "apps_test/pipeline_artifacts"
  log_namespace: "apps_test/pipeline_logs"
  telemetry_prefix: "apps_test.pipeline"

routing_hints:
  preferred_l2_provider: "stub"
  require_c0_ingest: false
  l6_writeback_enabled: true

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

# Test app L6 writeback profile

schema_version: "1.0"
profile_type: "l6_writeback"
app_id: "apps_test"

orchestration_config:
  writeback_proposer_enabled: true
  writeback_stages: ["collect", "aggregate", "persist"]
  stage_timeout_seconds: 30
  fail_on_stage_error: false

store_mapping:
  dim_scores: "sqlite"
  execution_traces: "ledger"
  evaluation_outcomes: "ledger"
  feedback_records: "sqlite"

app_specific_handlers:
  pre_writeback_hook: null
  post_writeback_hook: null
  custom_aggregator: null

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

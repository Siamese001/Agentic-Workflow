# Test app U0 payload defaults

schema_version: "1.0"
profile_type: "u0_payload_defaults"
app_id: "apps_test"

payload_defaults:
  default_capability: "test_capability"
  default_sandbox_mode: false
  default_egress_policy: "strict"
  required_context_fields: ["tenant_id"]
  optional_context_fields: ["session_id"]

synthesis_config:
  synthesis_mode: "template"
  template_path: null
  field_inheritance: ["tenant_id"]
  computed_fields: {}

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

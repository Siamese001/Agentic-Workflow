# Eager Import Risk Registry
#
# This file defines which import roots are considered risky for test files
# and should be lazy-imported to avoid pytest collection failures.
#
# Risky imports are those that:
# - Trigger heavy initialization at import time
# - Have side effects (registry writes, config loading)
# - Are order-sensitive in shared-interpreter environments
# - Cause circular import issues during full test collection

risky_roots:
  # Core agentic modules - heavy bootstrap
  - agentic_core
  - agentic_core.runtime
  - agentic_core.adg
  - agentic_core.L0_routing
  - agentic_core.L1_cognition
  - agentic_core.L2_execution
  - agentic_core.L3_orchestration
  - agentic_core.L4_state
  - agentic_core.L5_safety

  # App runtime modules - often have singletons
  - apps_exec
  - apps_exec.engines
  - apps_shared.bootstrap
  - apps_shared.runtime
  - apps_eval.runtime
  - apps_rg.runtime
  - apps_lic.runtime
  - apps_research.runtime
  - apps_rfp.runtime

  # System learning - heavy ML model loading
  - system_learning.runtime
  - system_learning.adapters.runtime

  # ADG tools - can trigger scans
  - tools.adg
  - tools.adg.extraction
  - tools.generate_full_adg

  # Integration points - often have client initialization
  - apps_shared.integrations
  - apps_shared.clients
  - apps_shared.connectors

safe_roots:
  # Standard library - always safe
  - typing
  - pathlib
  - dataclasses
  - functools
  - collections
  - collections.abc
  - enum
  - json
  - os
  - sys
  - tempfile
  - time
  - datetime
  - hashlib
  - random
  - string
  - re
  - itertools
  - contextlib
  - inspect
  - textwrap
  - logging
  - warnings
  - types
  - copy
  - pickle
  - io
  - csv
  - xml.etree.ElementTree

  # Testing framework - safe
  - pytest
  - unittest
  - unittest.mock
  - pytest_mock

  # Common third-party - generally safe
  - numpy
  - pandas
  - pydantic
  - pydantic.v1
  - yaml
  - requests
  - httpx
  - anyio
  - asyncio

  # Type-only imports
  - typing_extensions
  - types

  # Internal type definitions (not runtime)
  - agentic_core.types
  - apps_shared.types

# Patterns that indicate risky import-time behavior
risky_patterns:
  - registry
  - register
  - bootstrap
  - initialize
  - init_
  - _init
  - load_config
  - load_policy
  - hydrate
  - singleton
  - get_instance
  - default_instance
  - client
  - connection
  - pool
  - session
  - engine
  - runtime
  - context_manager
  - ".setup("
  - ".configure("

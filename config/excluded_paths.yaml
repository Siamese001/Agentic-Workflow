# Excluded Paths Configuration
# SSOT for scanner and .gitignore exclusions
# Version: 1.0.0
# Last updated: 2026-04-05

version: "1.0.0"

# Build and cache directories
build_cache_dirs:
  - "__pycache__"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".mypy_cache"
  - ".tox"
  - "node_modules"
  - "build"
  - "dist"
  - "_build"
  - ".eggs"

# Version control directories
version_control_dirs:
  - ".git"
  - ".svn"
  - ".hg"

# Virtual environment directories
virtual_env_dirs:
  - ".venv"
  - "venv"
  - "venv_stable"
  - "env"
  - ".env"
  - "Lib"
  - "site-packages"

# Coverage and test output directories
coverage_dirs:
  - "coverage_html"
  - "htmlcov"
  - ".coverage"
  - ".test_artifacts"
  - "test_artifacts"
  # Note: 'reports' removed — docs/reports/ is needed and should not be blocked

# Archive and backup directories
archive_dirs:
  - "archives"
  - "archive"
  - "artifacts"
  - ".sovereign_healing_backup"
  - ".healing_backups"
  - ".backup"
  - ".gravity_state"

# IDE and editor directories
ide_dirs:
  - ".idea"
  - ".vscode"
  - ".DS_Store"

# Vendor/package directories (not our code)
vendor_dirs:
  - "google"
  - "gapic"
  - "pip"
  - "dist-info"
  - "licenses"
  - "src"  # Often used for vendored packages

# Data and log directories (content, not code)
data_dirs:
  - "data/cache"
  - "data/corpus"
  - "data/external"
  - "data/manifests"
  - "data/memory"
  - "data/monitoring"
  - "data/processed"
  - "data/prompt_governance"
  - "data/rag_seeds"
  - "data/snapshots"
  - "data/ssot_artifacts"
  - "data/store"
  # - "data/golden_state"  # Needed for testing and evaluation
  # - "docs"  # Now an enforced territory per territories.yaml
  - "docs/reference/_archive"
  - "logs"
  - "raw"
  - "shared"

# Special exclusions
special_dirs:
  - "_compat"  # Compatibility shims - re-exports only
  - ".hypothesis"  # Hypothesis test database

# Pre-commit specific exclusions
# These patterns are specific to pre-commit hooks and should be excluded
# from hook execution to prevent infinite loops and unnecessary processing
precommit_excludes:
  - "artifacts/adg_ci_lane_gate_result.json"
  - "artifacts/healing/healing_events.jsonl"
  - "artifacts/bypass_audit.jsonl"
  - "artifacts/import_health/import_health_report.json"
  - "artifacts/windsurf/*"  # Windsurf temporary output files
  - "temp_[^/]*/.*"  # Temporary directories
  - "tmp.*"  # Generic temp files
  - "_temp_cmd.*"  # Temp command files
  - "_out_.*"  # Temp output files
  - "_typed_.*"  # Temp typed files
  - "_typed_emitted_.*"  # Temp typed emitted files
  - "_rebuild_.*"  # Temp rebuild files
  - "_selfcheck_.*"  # Temp selfcheck files
  - "_run_.*"  # Temp run files
  - "_capture_.*"  # Temp capture files
  - "_make_.*"  # Temp make files
  - ".tmp/.*"  # Hidden tmp directories
  - "runtime_state.*.json"  # Runtime state files
  - "temp_complete_rules.*.md"  # Temp rule files
  - "guardian_.*.(txt|json)"  # Guardian temporary files
  - ".*.debug.log"  # Debug logs
  - "pytestdebug.log"  # Pytest debug log
  - ".tmp_.*sites.txt"  # Temp sites files
  - ".*_sites.txt"  # Generic sites files
  - "0[0-9]_[^/]*/.*"  # Numbered temp directories
  - "core/.*"  # Core directory (legacy)
  - ".backup/guardian_tests/.*"  # Backup test files
  - "v15_d_evidence_.*.json"  # Legacy evidence files
  - "v15_p2_evidence_temp.json"  # Legacy temp evidence
  - "v15_d_inventory_p4.json"  # Legacy inventory
  - ".*/logs/.*"  # Log directories
  - "docs/store/.*"  # Docs store directory

# Windsurf runtime state (local-only, never committed)
windsurf_state_dirs:
  - ".windsurf/state"

# File patterns to exclude (glob-style)
file_patterns:
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - "*.so"
  - "*.dll"
  - "*.egg-info"
  - ".coverage.*"
  - "*.log"
  - "*.tmp"
  - "Thumbs.db"  # Windows thumbnail cache (file, not directory)
  - "*.sqlite"  # Local SQLite databases (runtime state, never committed)

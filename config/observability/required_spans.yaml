    - "DecisionPacketAssembler.assemble"
    - "DocumentReconciliationEngine.reconcile"
    - "EvidenceRegister.add_entry"
    - "FeatureDerivationEngine.derive_features"

# apps_rg is omitted intentionally — its 49 engines are managed by the

    entry_module: agentic_core/L2_execution/reasoning/EmbeddingSovereignAgent.py
    entry_symbol: EmbeddingSovereignAgent
    required_call: create_embedding_client
    required_env_flags: []
    proof_test: tests/integration/retrieval_layers/test_bge_embedding_e2e.py

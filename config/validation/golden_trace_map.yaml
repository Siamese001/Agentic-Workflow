# Agentic L5 Golden Trace Map Configuration
# Maps expected golden traces for workflow validation and regression testing

version: "1.0.0"
name: "agentic_l5_golden_trace_map"
description: "Comprehensive golden trace mapping for Agentic L5 workflow validation"

# Golden trace definitions by workflow type
workflow_traces:
  resume_workflow:
    description: "Resume generation and optimization workflow traces"
    expected_traces:
      - trace_id: "resume_planning_trace"
        steps:
          - "strategy_planning_initiated"
          - "role_analysis_completed"
          - "content_strategy_defined"
          - "section_priorities_established"
        validation_points:
          - "strategy_completeness"
          - "role_alignment_score"
          - "content_coherence"
      
      - trace_id: "resume_research_trace"
        steps:
          - "company_research_initiated"
          - "job_description_analysis"
          - "keyword_extraction_completed"
          - "competitor_analysis_finished"
        validation_points:
          - "research_depth_score"
          - "keyword_relevance"
          - "market_alignment"
      
      - trace_id: "resume_generation_trace"
        steps:
          - "content_generation_started"
          - "section_writing_completed"
          - "formatting_applied"
          - "final_validation_passed"
        validation_points:
          - "content_quality_score"
          - "formatting_compliance"
          - "ats_optimization"

  outreach_workflow:
    description: "Outreach campaign and message generation workflow traces"
    expected_traces:
      - trace_id: "outreach_planning_trace"
        steps:
          - "campaign_strategy_defined"
          - "target_identification_completed"
          - "messaging_framework_established"
          - "timeline_scheduled"
        validation_points:
          - "strategy_coherence"
          - "target_relevance"
          - "messaging_consistency"
      
      - trace_id: "contact_research_trace"
        steps:
          - "company_research_completed"
          - "contact_identification_finished"
          - "relationship_mapping_analyzed"
          - "personalization_data_gathered"
        validation_points:
          - "research_completeness"
          - "contact_quality_score"
          - "personalization_depth"
      
      - trace_id: "message_generation_trace"
        steps:
          - "archetype_selection_completed"
          - "message_drafting_initiated"
          - "personalization_applied"
          - "cta_optimization_finished"
        validation_points:
          - "message_engagement_score"
          - "personalization_quality"
          - "cta_effectiveness"

# Trace validation rules
validation_rules:
  # Required trace completeness
  min_trace_steps: 4
  max_trace_steps: 12
  
  # Validation point requirements
  min_validation_points: 3
  required_validation_types:
    - "completeness_check"
    - "quality_score"
    - "alignment_validation"
  
  # Trace consistency requirements
  step_ordering:
    must_be_sequential: true
    allow_parallel_branches: true
    require_completion_markers: true
  
  # Data integrity requirements
  data_validation:
    require_timestamps: true
    require_session_ids: true
    require_user_context: true
    require_cost_tracking: true

# Golden trace storage and retrieval
storage_configuration:
  # Trace storage locations
  storage_paths:
    primary: "data/golden/traces/"
    backup: "data/golden/traces_backup/"
    archive: "data/golden/traces_archive/"
  
  # Trace file naming conventions
  naming_convention:
    format: "{workflow_type}_{trace_id}_{version}.json"
    version_pattern: "v{major}.{minor}.{patch}"
    
  # Trace metadata requirements
  required_metadata:
    - "workflow_type"
    - "trace_id"
    - "version"
    - "created_at"
    - "created_by"
    - "environment"
    - "test_scenario"

# Regression testing configuration
regression_testing:
  # Test execution parameters
  test_execution:
    parallel_execution: true
    timeout_per_trace: 300
    retry_on_failure: 3
    continue_on_failure: false
  
  # Comparison thresholds
  comparison_thresholds:
    step_similarity_threshold: 0.95
    timing_variance_threshold: 0.10
    output_similarity_threshold: 0.90
    cost_variance_threshold: 0.15
  
  # Required test coverage
  coverage_requirements:
    workflow_types: ["resume_workflow", "outreach_workflow"]
    trace_variants: ["happy_path", "error_recovery", "edge_cases"]
    environments: ["development", "staging", "production_simulation"]

# Performance benchmarks
performance_benchmarks:
  resume_workflow:
    max_execution_time: 120
    max_cost_per_execution: 0.50
    min_success_rate: 0.95
    
  outreach_workflow:
    max_execution_time: 180
    max_cost_per_execution: 0.75
    min_success_rate: 0.90

# Integration points
integrations:
  # Observability integration
  observability:
    trace_export_enabled: true
    metrics_collection_enabled: true
    alerting_on_degradation: true
  
  # Testing framework integration
  testing:
    pytest_integration: true
    test_matrix_sync: true
    automated_regression: true
  
  # Configuration management
  config:
    profile_based_execution: true
    environment_specific_traces: true
    version_controlled_traces: true

# Governance and maintenance
governance:
  # Trace approval workflow
  approval_required: true
  approval_roles: ["architect", "qa_lead", "performance_engineer"]
  
  # Version management
  version_policy: "semantic"
  deprecated_versions: ["v0.x.x"]
  supported_versions: ["v1.0.x", "v1.1.x"]
  
  # Quality requirements
  quality_metrics:
    min_trace_coverage: 100
    min_documentation_coverage: 95
    min_test_coverage: 90

# Metadata and statistics
metadata:
  created_at: "2025-01-01T00:00:00Z"
  updated_at: "2025-01-01T00:00:00Z"
  version: "1.0.0"
  maintainer: "Agentic L5 Architecture Team"
  
  statistics:
    total_workflow_types: 2
    total_trace_definitions: 6
    total_validation_points: 18
    average_trace_steps: 8

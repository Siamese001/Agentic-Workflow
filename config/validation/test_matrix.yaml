# Agentic L5 Test Coverage Matrix Configuration
# Enforces comprehensive test coverage across all architectural layers

modules:
  # Core L1-L5 architectural layers
  - agentic_core.l1_planning
  - agentic_core.l2_execution
  - agentic_core.l3_orchestration
  - agentic_core.l4_memory
  - agentic_core.l5_safety
  
  # Engine implementations
  - agentic_core.resume_engine
  - agentic_core.outreach_engine
  
  # Runtime infrastructure
  - runtime.inference
  - runtime.orchestration
  - runtime.meta
  - runtime.infra
  - runtime.eval
  - runtime.telemetry
  - runtime.config
  
  # Schema definitions
  - schemas.core
  - schemas.planning
  - schemas.execution
  - schemas.orchestration
  - schemas.memory_state
  - schemas.safety
  - schemas.observability
  - schemas.model_routing
  - schemas.prompt_governance
  - schemas.data_assets
  
  # Application layers
  - apps.resume_app
  - apps.outreach_app
  - apps.api
  - apps.cli
  - apps.services
  
  # Configuration and governance
  - config.agentic_layers
  - config.engines
  - config.runtime
  - config.validation
  - prompt_governance.governance
  - prompt_governance.engines
  - prompt_governance.registry
  
  # Observability infrastructure
  - observability.telemetry
  - observability.tracing
  - observability.alerts
  - observability.dashboards
  - observability.pipelines

test_map:
  # L1 Planning Layer Tests
  agentic_core.l1_planning:
    - tests/l1/unit/test_strategy_planner.py
    - tests/l1/unit/test_research_planner.py
    - tests/l1/unit/test_message_planner.py
    - tests/l1/unit/test_safety_planner.py
    - tests/l1/unit/test_refinement_planner.py
    - tests/l1/integration/test_l1_planning_integration.py
  
  # L2 Execution Layer Tests  
  agentic_core.l2_execution:
    - tests/l2/unit/test_company_research_executor.py
    - tests/l2/unit/test_contact_research_executor.py
    - tests/l2/unit/test_message_generation_executor.py
    - tests/l2/integration/test_l2_execution_integration.py
  
  # L3 Orchestration Layer Tests
  agentic_core.l3_orchestration:
    - tests/l3/orchestration/test_resume_engine_dag.py
    - tests/l3/orchestration/test_outreach_engine_dag.py
    - tests/l3/orchestration/test_self_correction_loops.py
  
  # L4 Memory State Tests
  agentic_core.l4_memory:
    - tests/l4/memory/test_memory_mappings.py
    - tests/l4/memory/test_provider_registry.py
    - tests/l4/memory/test_temporal_memory.py
  
  # L5 Safety Tests
  agentic_core.l5_safety:
    - tests/l5/safety/test_filters.py
    - tests/l5/safety/test_policy_engine.py
    - tests/l5/safety/test_prompt_injection_protection.py
    - tests/l5/safety/test_validators.py

required_categories:
  # Structural test categories required by Agentic L5 architecture
  - tests/data/                    # Test data and fixtures
  - tests/l1/unit/                  # L1 unit tests  
  - tests/l1/integration/           # L1 integration tests
  - tests/l2/unit/                  # L2 unit tests
  - tests/l2/integration/           # L2 integration tests
  - tests/l3/orchestration/         # L3 orchestration DAG tests
  - tests/l4/memory/                # L4 memory state tests
  - tests/l5/safety/                # L5 safety and validation tests
  - tests/integration/              # Cross-layer integration tests
  - tests/regression/               # Regression test suite
  - tests/runtime/                  # Runtime infrastructure tests
  - tests/schemas/                  # Schema validation tests
  - tests/apps/                     # Application layer tests
  - tests/config/                   # Configuration tests
  - tests/prompt_governance/        # Prompt governance tests
  - tests/observability/            # Observability tests

# Validation rules and constraints
validation_rules:
  # Every module must have at least one test mapped
  min_tests_per_module: 1
  
  # No orphan test files allowed (tests must be mapped)
  allow_orphan_tests: false
  
  # Missing categories should be reported as violations
  enforce_required_categories: true
  
  # Layer-specific test location requirements
  layer_test_mapping:
    l1: "tests/l1/"
    l2: "tests/l2/"
    l3: "tests/l3/orchestration/"
    l4: "tests/l4/memory/"
    l5: "tests/l5/safety/"

# Agentic L5 Flow Hashes Configuration
# Pipeline integrity and flow validation through cryptographic hashing

version: "1.0.0"
name: "agentic_l5_flow_hashes"
description: "Comprehensive flow hashing configuration for pipeline integrity validation"

# Hash algorithm configuration
hash_configuration:
  # Primary hash algorithms
  algorithms:
    primary: "sha256"
    secondary: "sha384"
    checksum: "md5"
  
  # Hash generation parameters
  parameters:
    salt_enabled: true
    salt_length: 32
    iteration_count: 100000
    encoding: "hex"
  
  # Hash validation rules
  validation_rules:
    require_hash_match: true
    allow_hash_regeneration: false
    hash_timeout: 300
    retry_attempts: 3

# Flow definitions and expected hashes
flow_definitions:
  resume_workflow:
    description: "Resume generation workflow flow validation"
    stages:
      - stage: "planning"
        components:
          - "strategy_planner"
          - "role_analyzer"
          - "content_strategist"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "research"
        components:
          - "company_researcher"
          - "job_analyzer"
          - "keyword_extractor"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "generation"
        components:
          - "content_generator"
          - "formatter"
          - "ats_optimizer"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "validation"
        components:
          - "quality_validator"
          - "compliance_checker"
          - "final_reviewer"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"

  outreach_workflow:
    description: "Outreach campaign workflow flow validation"
    stages:
      - stage: "campaign_planning"
        components:
          - "strategy_planner"
          - "target_selector"
          - "messaging_framework"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "contact_research"
        components:
          - "company_researcher"
          - "contact_finder"
          - "relationship_mapper"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "message_generation"
        components:
          - "archetype_selector"
          - "message_generator"
          - "personalization_engine"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"
      
      - stage: "campaign_execution"
        components:
          - "message_sender"
          - "response_tracker"
          - "performance_monitor"
        expected_hash_pattern: "^[a-f0-9]{64}$"
        hash_validation: "strict"

# Pipeline integrity validation
integrity_validation:
  # Cross-stage validation
  cross_stage_validation:
    enabled: true
    validate_dependencies: true
    check_data_flow: true
    verify_state_transitions: true
  
  # Component-level validation
  component_validation:
    validate_inputs: true
    validate_outputs: true
    validate_state_changes: true
    validate_side_effects: true
  
  # Hash consistency checks
  consistency_checks:
    temporal_consistency: true
    environment_consistency: true
    version_consistency: true
    configuration_consistency: true

# Hash storage and management
storage_configuration:
  # Hash storage locations
  storage_paths:
    active_hashes: "config/validation/hashes/active/"
    historical_hashes: "config/validation/hashes/historical/"
    backup_hashes: "config/validation/hashes/backup/"
  
  # Hash file naming
  naming_convention:
    format: "{workflow}_{stage}_{component}_{timestamp}.hash"
    timestamp_format: "YYYYMMDD_HHMMSS"
    
  # Hash retention policies
  retention_policies:
    active_retention_days: 30
    historical_retention_days: 365
    backup_retention_days: 1095

# Security and access control
security_configuration:
  # Hash protection
  hash_protection:
    encryption_enabled: true
    access_control_enabled: true
    audit_logging_enabled: true
  
  # Access permissions
  access_permissions:
    read_roles: ["developer", "qa_engineer", "architect"]
    write_roles: ["architect", "build_system"]
    admin_roles: ["system_administrator"]
  
  # Security validation
  security_validation:
    validate_hash_integrity: true
    detect_tampering: true
    verify_digital_signatures: true

# Performance and monitoring
monitoring_configuration:
  # Hash generation metrics
  hash_metrics:
    track_generation_time: true
    track_validation_time: true
    track_storage_size: true
    track_access_patterns: true
  
  # Performance thresholds
  performance_thresholds:
    max_hash_generation_time: 5.0
    max_hash_validation_time: 2.0
    max_storage_size_mb: 100
    max_access_time_ms: 100
  
  # Alerting configuration
  alerting:
    hash_mismatch_alert: true
    performance_degradation_alert: true
    storage_capacity_alert: true
    security_violation_alert: true

# Integration points
integrations:
  # CI/CD integration
  cicd_integration:
    validate_on_build: true
    validate_on_deploy: true
    block_on_failure: true
  
  # Testing integration
  testing_integration:
    unit_test_validation: true
    integration_test_validation: true
    regression_test_validation: true
  
  # Observability integration
  observability_integration:
    metrics_export: true
    trace_correlation: true
    log_aggregation: true

# Compliance and governance
governance_configuration:
  # Compliance requirements
  compliance_requirements:
    audit_trail_required: true
    hash_versioning_required: true
    change_approval_required: true
  
  # Quality standards
  quality_standards:
    min_hash_coverage: 100
    min_validation_frequency: "daily"
    min_retention_period: "1_year"
  
  # Documentation requirements
  documentation_requirements:
    hash_documentation: true
    validation_procedures: true
    change_logs: true

# Emergency procedures
emergency_procedures:
  # Hash corruption handling
  corruption_handling:
    detection_enabled: true
    automatic_rollback: true
    notification_required: true
    investigation_required: true
  
  # Recovery procedures
  recovery_procedures:
    backup_restoration: true
    partial_recovery: true
    full_regeneration: true
    manual_override: true

# Metadata and statistics
metadata:
  created_at: "2025-01-01T00:00:00Z"
  updated_at: "2025-01-01T00:00:00Z"
  version: "1.0.0"
  maintainer: "Agentic L5 Architecture Team"
  
  statistics:
    total_workflows: 2
    total_stages: 8
    total_components: 24
    expected_hash_length: 64
    validation_frequency: "real_time"

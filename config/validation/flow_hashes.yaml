# Hash Validation Rules
validation_rules:
  hash_algorithm: SHA256
  validation_frequency: daily
  integrity_check_interval: 3600  # seconds
  hash_mismatch_action: block_and_alert
  
# Hash Storage
storage:
  backend: file_system
  base_path: "flow_hashes/"
  encryption: false
  backup_enabled: true

# Hash Updates
update_policy:
  auto_update: false
  manual_approval_required: true
  version_control: true
  rollback_enabled: true

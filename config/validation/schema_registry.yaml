# Agentic L5 Schema Registry Configuration
# Central registry for all schema definitions across architectural layers

version: "1.0.0"
registry_name: "agentic_l5_schema_registry"
description: "Comprehensive schema registry for Agentic L5 architecture validation"

# Schema namespace definitions
namespaces:
  core:
    description: "Base schemas and shared types"
    base_path: "schemas/core"
    schemas:
      - name: "base_schemas"
        version: "1.0.0"
        file: "base_schemas.py"
        description: "Base response, request, and validation schemas"
        exports:
          - "BaseResponse"
          - "BaseRequest"
          - "ValidationError"
          - "ProcessingStatus"
          - "LogLevel"
      
      - name: "agent"
        version: "1.0.0"
        file: "agent.py"
        description: "Agent definition and capability schemas"
        exports:
          - "AgentCard"
          - "AgentCapability"
          - "AgentStatus"
      
      - name: "base"
        version: "1.0.0"
        file: "base.py"
        description: "Core base classes and utilities"
        exports:
          - "BaseModel"
          - "BaseConfig"

  planning:
    description: "L1 planning schemas and types"
    base_path: "schemas/planning"
    schemas:
      - name: "planning_schemas"
        version: "1.0.0"
        file: "planning_schemas.py"
        description: "Planning request/response schemas"
        exports:
          - "PlanningRequest"
          - "PlanningResponse"
          - "Plan"
          - "PlanStep"
      
      - name: "plan"
        version: "1.0.0"
        file: "plan.py"
        description: "Plan execution and management schemas"
        exports:
          - "ExecutionPlan"
          - "PlanStatus"
          - "PlanMetadata"

  execution:
    description: "L2 execution schemas and types"
    base_path: "schemas/execution"
    schemas:
      - name: "execution_schemas"
        version: "1.0.0"
        file: "execution_schemas.py"
        description: "Task execution and coordination schemas"
        exports:
          - "ExecutionRequest"
          - "ExecutionResponse"
          - "TaskResult"
          - "ExecutionContext"

  orchestration:
    description: "L3 orchestration schemas and types"
    base_path: "schemas/orchestration"
    schemas:
      - name: "orchestration_schemas"
        version: "1.0.0"
        file: "orchestration_schemas.py"
        description: "Workflow orchestration and DAG schemas"
        exports:
          - "OrchestrationRequest"
          - "WorkflowDefinition"
          - "DAGNode"
          - "OrchestrationState"

  memory_state:
    description: "L4 memory and state schemas"
    base_path: "schemas/memory_state"
    schemas:
      - name: "memory_schemas"
        version: "1.0.0"
        file: "memory_schemas.py"
        description: "Memory management and state schemas"
        exports:
          - "MemoryState"
          - "StateTransition"
          - "MemoryProvider"

  safety:
    description: "L5 safety and security schemas"
    base_path: "schemas/safety"
    schemas:
      - name: "safety_schemas"
        version: "1.0.0"
        file: "safety_schemas.py"
        description: "Safety validation and policy schemas"
        exports:
          - "SafetyPolicy"
          - "ValidationResult"
          - "SecurityContext"

  observability:
    description: "System monitoring and metrics schemas"
    base_path: "schemas/observability"
    schemas:
      - name: "observability_schemas"
        version: "1.0.0"
        file: "observability_schemas.py"
        description: "Telemetry, metrics, and monitoring schemas"
        exports:
          - "MetricEvent"
          - "TraceEvent"
          - "LogEntry"

  model_routing:
    description: "Model selection and routing schemas"
    base_path: "schemas/model_routing"
    schemas:
      - name: "model_routing_schemas"
        version: "1.0.0"
        file: "model_routing_schemas.py"
        description: "LLM model routing and selection schemas"
        exports:
          - "ModelRequest"
          - "RoutingDecision"
          - "ModelCapabilities"

  prompt_governance:
    description: "Access control and governance schemas"
    base_path: "schemas/prompt_governance"
    schemas:
      - name: "prompt_governance_schemas"
        version: "1.0.0"
        file: "prompt_governance_schemas.py"
        description: "Prompt governance and access control schemas"
        exports:
          - "GovernancePolicy"
          - "AccessControl"
          - "PromptTemplate"

  data_assets:
    description: "Data management and asset schemas"
    base_path: "schemas/data_assets"
    schemas:
      - name: "data_assets_schemas"
        version: "1.0.0"
        file: "data_assets_schemas.py"
        description: "Data asset management schemas"
        exports:
          - "DataAsset"
          - "AssetMetadata"
          - "DataPipeline"

  tests:
    description: "Test framework and validation schemas"
    base_path: "schemas/tests"
    schemas:
      - name: "test_schemas"
        version: "1.0.0"
        file: "test_schemas.py"
        description: "Test framework and validation schemas"
        exports:
          - "TestCase"
          - "TestResult"
          - "ValidationSuite"

# Schema validation rules
validation_rules:
  # All schemas must have version strings
  require_version: true
  
  # All schemas must have descriptions
  require_description: true
  
  # All schemas must export at least one class/function
  min_exports: 1
  
  # Schema naming conventions
  naming_conventions:
    class_names: "PascalCase"
    file_names: "snake_case"
    module_names: "snake_case"
  
  # Required imports and dependencies
  required_imports:
    - "pydantic"
    - "typing"
  
  # Schema validation requirements
  validation_requirements:
    use_pydantic: true
    include_validators: true
    include_documentation: true

# Registry maintenance and governance
governance:
  # Schema versioning policy
  versioning_policy: "semantic"
  
  # Schema review requirements
  review_required: true
  
  # Deprecation policy
  deprecation_policy:
    warning_period: "90 days"
    removal_period: "180 days"
  
  # Compatibility requirements
  compatibility:
    backward_compatible: true
    forward_compatible: false

# Integration points
integrations:
  # Contract registry integration
  contract_registry:
    enabled: true
    sync_frequency: "daily"
    validation_enabled: true
  
  # Runtime integration
  runtime:
    enabled: true
    auto_discovery: true
    validation_on_startup: true
  
  # Prompt governance integration
  prompt_governance:
    enabled: true
    schema_validation: true
    policy_enforcement: true

# Registry metadata
metadata:
  created_at: "2025-01-01T00:00:00Z"
  updated_at: "2025-01-01T00:00:00Z"
  maintainer: "Agentic L5 Architecture Team"
  contact: "architecture@agentic-l5.org"
  
  # Registry statistics
  statistics:
    total_namespaces: 10
    total_schemas: 12
    total_exports: 48
    
  # Quality metrics
  quality_metrics:
    test_coverage: "95%"
    documentation_coverage: "100%"
    validation_coverage: "100%"

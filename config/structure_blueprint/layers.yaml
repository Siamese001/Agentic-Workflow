# Structure Blueprint — Layer Overrides
schema_version: "1.1.0"
last_updated: "2026-04-06"

# Layer-specific template overrides
overrides:
  L0_routing:
    purpose: "Core Logic & Routing + Control-Plane Core — ingestion, route election, capability arbitration, policy-aware dispatch; plus boot integrity, SSOT discovery, and guardian runner health checks."
    forbidden_capabilities:
      - debate
      - synthesis
      - complex_reasoning
      - multi_agent_coordination
    routing_rules:
      "*_guardian.py": enforcement
      "*_boot*.py": enforcement
      "*_routing*.py": enforcement
      "*_dispatch*.py": enforcement
      "*_config.py": config
      "*_types.py": types
      "*Agent.py": reasoning
    extra_subfolders:
      scripts:
        purpose: "Operational scripts (Zero-Ambiguity Standard)"
        subfolders:
          .github: {purpose: "GitHub workflow scripts"}
          ci: {purpose: "CI/CD pipeline scripts"}
          config: {purpose: "Configuration scripts"}
          installation: {purpose: "Installation and setup scripts"}
          general_scripts: {purpose: "General maintenance scripts"}
      logs:
        purpose: "Guardian and audit log outputs (JSON reports)"
        allowed_extensions: [".json", ".log"]

  L1_cognition:
    purpose: "Intent Analysis, Context Expansion"
    forbidden_capabilities: []
    routing_rules:
      "*_classifier.py": reasoning
      "*_expander.py": reasoning
      "*_embedder.py": reasoning
      "*_config.py": config
      "*_types.py": types

  L2_execution:
    purpose: "Tool Execution, Action Orchestration"
    forbidden_capabilities: []
    routing_rules:
      "*_engine.py": reasoning
      "*_executor.py": reasoning
      "*_adapter.py": reasoning
      "*_config.py": config
      "*_types.py": types

  L3_orchestration:
    purpose: "Multi-Agent Coordination, Workflow State"
    forbidden_capabilities: []
    routing_rules:
      "*_orchestrator.py": reasoning
      "*_coordinator.py": reasoning
      "*_config.py": config
      "*_types.py": types

  L4_state:
    purpose: "Memory, Embeddings, Retrieval"
    forbidden_capabilities: []
    routing_rules:
      "*_store.py": reasoning
      "*_cache.py": reasoning
      "*_memory.py": reasoning
      "*_config.py": config
      "*_types.py": types

  L5_safety:
    purpose: "Guardrails, Validation, Policy Enforcement"
    forbidden_capabilities: []
    routing_rules:
      "*_validator.py": validators
      "*_guardian.py": enforcement
      "*_policy.py": enforcement
      "*_audit*.py": validators
      "*_config.py": config
      "*_types.py": types

  L6_observability:
    purpose: "Telemetry, Logging, Monitoring"
    forbidden_capabilities: []
    routing_rules:
      "*_logger.py": reasoning
      "*_monitor.py": reasoning
      "*_reporter.py": reasoning
      "*_dashboard*.py": reasoning
      "*_config.py": config
      "*_types.py": types

  # ============================================================================
  # Non-framework layers — confirmed from ADG SQLite (2026-04-06)
  # ============================================================================

  L_APP:
    purpose: "Application-specific implementations — apps_eval, apps_exec, apps_lic, apps_research, apps_rfp, apps_rg, apps_shared, apps_underwriting_ai, apps_qwen. (2561 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_engine.py": reasoning
      "*_agent.py": reasoning
      "*Agent.py": reasoning
      "*_config.py": config
      "*_types.py": types
      "*_adapter.py": reasoning
    node_count_adg: 2561

  L_INFRA:
    purpose: "Infrastructure coordination and optimization — infrastructure/ directory. Adaptive optimizers, cross-layer coherence, implementation plans. (17 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_optimizer.py": reasoning
      "*_coherence.py": reasoning
      "*_config.py": config
      "*_types.py": types
    node_count_adg: 17

  L_OPS:
    purpose: "Operational scripts and CI/CD gate enforcement — ops_scripts/ directory. CI gates, SSOT validators, ADG analysis, pre-commit hooks. (3920 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_gate.py": enforcement
      "*_validator.py": validators
      "*_scanner.py": enforcement
      "*_config.py": config
    node_count_adg: 3920

  L_PG:
    purpose: "Prompt governance and knowledge layer — agentic_core/knowledge/ directory. Cache, catalog, policy evaluation, knowledge base infrastructure. (404 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_policy.py": enforcement
      "*_catalog.py": reasoning
      "*_config.py": config
      "*_types.py": types
    node_count_adg: 404

  L_RUNTIME:
    purpose: "Runtime lifecycle, anomaly detection, contextual routing — agentic_core/runtime/ directory. Anomaly reports, capability gaps, runtime config. (397 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_config.py": config
      "*_types.py": types
      "*_router.py": reasoning
      "*_lifecycle.py": enforcement
    node_count_adg: 397

  L_SHARED:
    purpose: "Shared cross-layer utilities — agentic_core/agents/, agentic_core/adg/adapters. Agent type definitions, ADG-backed registry, execution profiles. (1193 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_types.py": types
      "*_registry.py": reasoning
      "*_adapter.py": reasoning
      "*_config.py": config
    node_count_adg: 1193

  L_SL:
    purpose: "System learning layer — system_learning/ directory. Adapters, arbitration, confidence engines, learning pipelines. (800 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_adapter.py": reasoning
      "*_engine.py": reasoning
      "*_config.py": config
      "*_types.py": types
    node_count_adg: 800

  L_TEST:
    purpose: "Test suites — tests/ directory. Unit, integration, architecture, guardian, and app-specific tests. (8539 nodes in ADG — largest non-framework layer)"
    forbidden_capabilities: []
    routing_rules:
      "test_*.py": tests
      "*_test.py": tests
      "conftest.py": config
      "*_config.py": config
    node_count_adg: 8539

  L_TOOLS:
    purpose: "Development and operational tools — tools/ and agentic_core/adg/. ADG generation, analysis, repair, ingestion, fix scripts. (4727 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_generator.py": reasoning
      "*_analyzer.py": reasoning
      "*_scanner.py": reasoning
      "*_config.py": config
    node_count_adg: 4727

  L_UNKNOWN:
    purpose: "ADG scanner residual bucket — 94% inferred_symbol nodes from agentic_core/__init__.py re-exports that could not be resolved to a specific layer. Also contains apps_underwriting_ai (mapped to L_APP in territories.yaml) and agentic_core/L_CONTRACTS/ (5 real contract nodes). Root cause is ADG static scanner limitation with __init__.py symbol inference, not a real architectural layer. (1736 nodes in ADG)"
    forbidden_capabilities: []
    routing_rules:
      "*_contract.py": enforcement
      "*_exceptions.py": types
      "*_types.py": types
    node_count_adg: 1736
    scanner_residual: true
    note: "Do not rename to a domain layer — this bucket exists due to ADG __init__.py symbol inference limitations"

# Structure Blueprint — Territory Definitions
schema_version: "1.0.0"
last_updated: "2026-04-05"

# NOTE: Intentional Dependencies
# - agentic_core intentionally imports from ops_scripts/dev_tools/ for SSOT management utilities
# - This is a known architectural pattern: framework code depends on operational SSOT utilities
# - ops_scripts/dev_tools/ contains 1,052 utility scripts for SSOT management, not framework logic

territories:
  config:
    depth: 2
    type: "configuration"
    purpose: "Project configuration and SSOT definitions"
    subfolders:
      structure_blueprint:
        depth: 2
        purpose: "SSOT territory and layer definitions"
        allowed_suffixes: [".yaml"]
        forbidden_suffixes: [".py"]
      schemas:
        depth: 2
        purpose: "Schema definitions"
        allowed_suffixes: [".yaml", ".json", ".py"]
    allowed_suffixes: [".yaml", ".json"]
    forbidden_suffixes: [".py"]

  docs:
    depth: 2
    type: "documentation"
    purpose: "Project documentation"
    subfolders:
      reports:
        depth: 2
        purpose: "Evidence and reports"
        allowed_suffixes: [".md"]
      tools:
        depth: 2
        purpose: "Tools documentation"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".txt"]
    forbidden_suffixes: [".py", ".json", ".yaml", ".log"]

  data:
    depth: 2
    type: "data"
    purpose: "Data files and datasets"
    subfolders:
      snapshots:
        depth: 2
        purpose: "Snapshot data"
        allowed_suffixes: [".json", ".jsonl"]
    allowed_suffixes: [".json", ".jsonl", ".txt", ".csv"]
    forbidden_suffixes: [".py", ".md", ".yaml", ".log"]

  .windsurf:
    depth: 2
    type: "ide_configuration"
    purpose: "Windsurf IDE configuration and AI assistant rules"
    subfolders:
      plans:
        depth: 2
        purpose: "Execution plans"
        allowed_suffixes: [".md", ".py"]
      rules:
        depth: 2
        purpose: "AI assistant rules"
        allowed_suffixes: [".md", ".yaml"]
      skills:
        depth: 2
        purpose: "AI assistant skills"
        allowed_suffixes: [".md"]
      templates:
        depth: 2
        purpose: "Plan templates"
        allowed_suffixes: [".md"]
      workflows:
        depth: 2
        purpose: "Workflow definitions"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".json", ".yaml"]
    forbidden_suffixes: [".txt", ".log"]

  agentic_core:
    depth: 2
    purpose: "Core framework logic (L0-L6)"
    subfolders:
      L0_routing:
        depth: 2
        purpose: "Route election, capability arbitration, policy-aware dispatch"
        subfolders:
          config:
            purpose: "Configuration, settings, constants"
            allowed_suffixes: ["_config.py", "_settings.py"]
            forbidden_suffixes: ["_types.py"]
          types:
            purpose: "Data models, enums, protocols, schemas"
            allowed_suffixes: ["_types.py", "_protocol.py", "_schema.py", "_model.py", "_spec.py"]
            forbidden_suffixes: ["_config.py", "_engine.py", "_agent.py"]
          reasoning:
            purpose: "Decision-making agents, engines, planners, strategists"
          enforcement:
            purpose: "Constraint execution, guardrails, governors, gates"
          validators:
            purpose: "Passive auditing, compliance checks, structural validators"
          utils:
            purpose: "Helper functions, mixins, shared utilities"
      L1_cognition:
        depth: 2
        purpose: "Intent analysis, context expansion"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L2_execution:
        depth: 2
        purpose: "Tool execution, action orchestration"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L3_orchestration:
        depth: 2
        purpose: "Multi-agent coordination, workflow state"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L4_state:
        depth: 2
        purpose: "Memory, embeddings, retrieval"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L5_safety:
        depth: 2
        purpose: "Guardrails, validation, policy enforcement"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          validators: {purpose: "Validators"}
          utils: {purpose: "Helpers"}
      L6_observability:
        depth: 2
        purpose: "Telemetry, logging, monitoring"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}

  apps_eval:
    depth: 2
    purpose: "Evaluation application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      data: {depth: 2, purpose: "Data files"}

  apps_exec:
    depth: 2
    purpose: "Execution application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}

  apps_lic:
    depth: 2
    purpose: "License management application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}

  apps_research:
    depth: 2
    purpose: "Research application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}

  apps_rfp:
    depth: 2
    purpose: "RFP application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      data: {depth: 2, purpose: "Sample RFPs"}

  apps_rg:
    depth: 2
    purpose: "Resume generation application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}

  apps_shared:
    depth: 2
    purpose: "Shared application utilities"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      data: {depth: 2, purpose: "Shared data"}
      enforcement: {depth: 2, purpose: "Shared enforcement"}
      data_adapters: {depth: 2, purpose: "Data adapters"}

  tests:
    depth: 2
    purpose: "Test suites"
    subfolders:
      unit:
        depth: 3
        purpose: "Unit tests"
        subfolders:
          agentic_core: {depth: 4, purpose: "Core tests"}
          apps_*: {depth: 4, purpose: "App tests (wildcard)"}
      integration: {depth: 3, purpose: "Integration tests"}
      e2e: {depth: 3, purpose: "End-to-end tests"}
      apps_*:
        depth: 3
        purpose: "App-specific tests (wildcard)"

  infrastructure:
    depth: 2
    purpose: "Infrastructure coordination and optimization"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      types: {depth: 2, purpose: "Data models"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      utils: {depth: 2, purpose: "Helpers"}

  system_learning:
    depth: 2
    purpose: "Meta-learning and system improvement"
    subfolders:
      adapters: {depth: 2, purpose: "Learning adapters"}
      arbitration: {depth: 2, purpose: "Arbitration engines"}
      confidence: {depth: 2, purpose: "Confidence scoring"}
      config: {depth: 2, purpose: "Configuration"}
      constraints: {depth: 2, purpose: "Learning constraints"}
      correlation: {depth: 2, purpose: "Correlation analysis"}
      embedding: {depth: 2, purpose: "Embedding management"}
      enforcement: {depth: 2, purpose: "Learning enforcement"}
      engines: {depth: 2, purpose: "Learning engines"}
      fingerprinting: {depth: 2, purpose: "Fingerprinting"}
      golden: {depth: 2, purpose: "Golden state"}
      invariants: {depth: 2, purpose: "Learning invariants"}
      logs: {depth: 2, purpose: "Learning logs"}
      memory: {depth: 2, purpose: "Learning memory"}
      meta_learning: {depth: 2, purpose: "Meta-learning core"}
      ml_integration: {depth: 2, purpose: "ML integration"}
      monitoring: {depth: 2, purpose: "Learning monitoring"}
      output: {depth: 2, purpose: "Learning output"}
      pipelines: {depth: 2, purpose: "Learning pipelines"}
      policy: {depth: 2, purpose: "Learning policies"}
      ports: {depth: 2, purpose: "Learning ports"}
      provenance: {depth: 2, purpose: "Learning provenance"}
      raw: {depth: 2, purpose: "Learning raw"}
      runtime: {depth: 2, purpose: "Runtime learning"}
      runtime_adg: {depth: 2, purpose: "Runtime ADG"}
      scripts: {depth: 2, purpose: "Learning scripts"}
      snapshots: {depth: 2, purpose: "Learning snapshots"}
      state: {depth: 2, purpose: "Learning state"}
      stores: {depth: 2, purpose: "Learning stores"}
      telemetry: {depth: 2, purpose: "Learning telemetry"}
      types: {depth: 2, purpose: "Learning types"}
      validators: {depth: 2, purpose: "Learning validators"}

  tools:
    depth: 1
    purpose: "Development and operational tools"
    volatile: true
    subfolders:
      adg: {depth: 2, purpose: "ADG tools"}
      mcp: {depth: 2, purpose: "MCP servers"}
      analysis: {depth: 2, purpose: "Analysis tools"}
      archive: {depth: 2, purpose: "Archive tools"}
      adg_backups: {depth: 2, purpose: "ADG backups"}
      ci: {depth: 2, purpose: "CI tools"}
      cleanup: {depth: 2, purpose: "Cleanup tools"}
      debug: {depth: 2, purpose: "Debug tools"}
      diagnose: {depth: 2, purpose: "Diagnostic tools"}
      evidence: {depth: 2, purpose: "Evidence collection"}
      fix: {depth: 2, purpose: "Fix tools"}
      generate: {depth: 2, purpose: "Generation tools"}
      governance: {depth: 2, purpose: "Governance tools"}
      guardian: {depth: 2, purpose: "Guardian tools"}
      ingestion: {depth: 2, purpose: "Ingestion tools"}
      learning: {depth: 2, purpose: "Learning tools"}
      manifests: {depth: 2, purpose: "Manifests"}
      memory: {depth: 2, purpose: "Memory tools"}
      migrate: {depth: 2, purpose: "Migration tools"}
      monitoring: {depth: 2, purpose: "Monitoring tools"}
      otl: {depth: 2, purpose: "OTL tools"}
      profiling: {depth: 2, purpose: "Profiling tools"}
      repair: {depth: 2, purpose: "Repair tools"}
      scripts: {depth: 2, purpose: "Scripts"}
      test_enforcement: {depth: 2, purpose: "Test enforcement"}
      testing: {depth: 2, purpose: "Testing tools"}
      verification: {depth: 2, purpose: "Verification tools"}
      waves: {depth: 2, purpose: "Wave tools"}
      windsurf: {depth: 2, purpose: "Windsurf tools"}

  ops_scripts:
    depth: 2
    purpose: "CI/CD and operational scripts"
    subfolders:
      ci: {depth: 3, purpose: "CI scripts"}
      dev_tools: {depth: 3, purpose: "Development tools"}
      environment: {depth: 3, purpose: "Environment scripts"}
      enforcement: {depth: 3, purpose: "Enforcement scripts"}
      general: {depth: 3, purpose: "General scripts"}
      governance: {depth: 3, purpose: "Governance scripts"}
      hooks: {depth: 3, purpose: "Git hooks"}
      incident: {depth: 3, purpose: "Incident response"}
      maintenance: {depth: 3, purpose: "Maintenance scripts"}
      policy: {depth: 3, purpose: "Policy scripts"}
      review: {depth: 3, purpose: "Review scripts"}
      root_scripts: {depth: 3, purpose: "Root-level scripts"}
      security: {depth: 3, purpose: "Security scripts"}
      setup: {depth: 3, purpose: "Setup scripts"}
      tools: {depth: 3, purpose: "Tool scripts"}
      verification: {depth: 3, purpose: "Verification scripts"}

# Wildcard territories (pattern-based matching)
wildcards:
  apps_*:
    pattern: "^apps_.*$"
    depth: 2
    purpose: "Application territories (eval, exec, lic, research, rfp, rg)"
    subfolders:
      config: {purpose: "Configuration"}
      engines: {purpose: "Execution engines"}
      reasoning: {purpose: "Decision agents"}
      data: {purpose: "Data files"}

  tests/apps_*:
    pattern: "^tests/apps_.*$"
    depth: 3
    purpose: "App-specific test territories"
    subfolders:
      unit: {purpose: "Unit tests"}
      integration: {purpose: "Integration tests"}

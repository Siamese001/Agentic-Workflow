      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "Research services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}

# Structure Blueprint — Territory Definitions
schema_version: "1.0.0"
last_updated: "2026-04-05"

# NOTE: Intentional Dependencies
# - agentic_core intentionally imports from ops_scripts/dev_tools/ for SSOT management utilities
# - This is a known architectural pattern: framework code depends on operational SSOT utilities
# - ops_scripts/dev_tools/ contains 1,052 utility scripts for SSOT management, not framework logic

# NOTE: Backward Compatibility Wrappers
# - apps_qwen is now a backward compatibility wrapper that re-exports from agentic_core/L3_orchestration/inference/qwen_vllm
# - This wrapper will be removed in a future version after all importers have been updated
# - New code should import directly from agentic_core.L3_orchestration.inference.qwen_vllm

territories:
  config:
    depth: 2
    type: "configuration"
    purpose: "Project configuration and SSOT definitions"
    subfolders:
      structure_blueprint:
        depth: 2
        purpose: "SSOT territory and layer definitions"
        allowed_suffixes: [".yaml"]
        forbidden_suffixes: [".py"]
      schemas:
        depth: 2
        purpose: "Schema definitions"
        allowed_suffixes: [".yaml", ".json", ".py"]
    allowed_suffixes: [".yaml", ".json"]
    forbidden_suffixes: [".py"]

  docs:
    depth: 2
    type: "documentation"
    purpose: "Project documentation"
    subfolders:
      reports:
        depth: 2
        purpose: "Evidence and reports"
        allowed_suffixes: [".md"]
      tools:
        depth: 2
        purpose: "Tools documentation"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".txt"]
    forbidden_suffixes: [".py", ".json", ".yaml", ".log"]

  data:
    depth: 2
    type: "data"
    purpose: "Data files and datasets"
    subfolders:
      snapshots:
        depth: 2
        purpose: "Snapshot data"
        allowed_suffixes: [".json", ".jsonl"]
    allowed_suffixes: [".json", ".jsonl", ".txt", ".csv"]
    forbidden_suffixes: [".py", ".md", ".yaml", ".log"]

  .windsurf:
    depth: 2
    type: "ide_configuration"
    purpose: "Windsurf IDE configuration and AI assistant rules"
    subfolders:
      plans:
        depth: 2
        purpose: "Execution plans"
        allowed_suffixes: [".md", ".py"]
      rules:
        depth: 2
        purpose: "AI assistant rules"
        allowed_suffixes: [".md", ".yaml"]
      skills:
        depth: 2
        purpose: "AI assistant skills"
        allowed_suffixes: [".md"]
      templates:
        depth: 2
        purpose: "Plan templates"
        allowed_suffixes: [".md"]
      workflows:
        depth: 2
        purpose: "Workflow definitions"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".json", ".yaml"]
    forbidden_suffixes: [".txt", ".log"]

  agentic_core:
    depth: 2
    purpose: "Core framework logic (L0-L6)"
    subfolders:
      L0_routing:
        depth: 2
        purpose: "Route election, capability arbitration, policy-aware dispatch"
        subfolders:
          config:
            purpose: "Configuration, settings, constants"
            allowed_suffixes: ["_config.py", "_settings.py"]
            forbidden_suffixes: ["_types.py"]
          types:
            purpose: "Data models, enums, protocols, schemas"
            allowed_suffixes: ["_types.py", "_protocol.py", "_schema.py", "_model.py", "_spec.py"]
            forbidden_suffixes: ["_config.py", "_engine.py", "_agent.py"]
          reasoning:
            purpose: "Decision-making agents, engines, planners, strategists"
          enforcement:
            purpose: "Constraint execution, guardrails, governors, gates"
          validators:
            purpose: "Passive auditing, compliance checks, structural validators"
          utils:
            purpose: "Helper functions, mixins, shared utilities"
      L1_cognition:
        depth: 2
        purpose: "Intent analysis, context expansion"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L2_execution:
        depth: 2
        purpose: "Tool execution, action orchestration"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L3_orchestration:
        depth: 2
        purpose: "Multi-agent coordination, workflow state"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
          inference:
            depth: 2
            purpose: "Inference service integrations (vLLM, etc.)"
            subfolders:
              qwen_vllm:
                depth: 2
                purpose: "Qwen vLLM inference service"
                subfolders:
                  config: {depth: 2, purpose: "Configuration and telemetry"}
                  engines: {depth: 2, purpose: "vLLM client implementations"}
                  reasoning: {depth: 2, purpose: "Gateway and orchestration"}
                  tools: {depth: 2, purpose: "GPU monitoring utilities"}
      L4_state:
        depth: 2
        purpose: "Memory, embeddings, retrieval"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L5_safety:
        depth: 2
        purpose: "Guardrails, validation, policy enforcement"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          validators: {purpose: "Validators"}
          utils: {purpose: "Helpers"}
      L6_observability:
        depth: 2
        purpose: "Telemetry, logging, monitoring"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      # Cross-cutting infrastructure
      mixins:
        depth: 2
        purpose: "Shared capability mixins for agent composition"
        subfolders:
          config: {purpose: "Mixin configuration"}
          tracing: {purpose: "Tracing and observability mixins"}
          safety: {purpose: "Safety and validation mixins"}
          healing: {purpose: "Healing and recovery mixins"}
          caching: {purpose: "Caching and performance mixins"}
      patterns:
        depth: 2
        purpose: "Reasoning patterns (DEPRECATED: consolidate into L0/L1 types)"
        volatile: true
      planning:
        depth: 2
        purpose: "Planning utilities (primarily used by tools/CI, consider moving to tools/utils)"
        subfolders:
          workflows: {depth: 2, purpose: "Workflow definitions"}
      seams:
        depth: 2
        purpose: "Integration contracts and protocol seams"
        subfolders:
          contracts: {depth: 2, purpose: "Contract definitions"}
      # Other top-level directories
      base_agents: {depth: 2, purpose: "Base agent classes"}
      runtime: {depth: 2, purpose: "Runtime utilities and types"}
      config: {depth: 2, purpose: "Framework configuration"}
      utils: {depth: 2, purpose: "Framework utilities"}
      types: {depth: 2, purpose: "Framework types"}
      gateway: {depth: 2, purpose: "Gateway implementations"}
      interfaces: {depth: 2, purpose: "Interface definitions"}
      tracing: {depth: 2, purpose: "Tracing infrastructure"}
      prompt_governance: {depth: 2, purpose: "Prompt governance"}
      cache: {depth: 2, purpose: "Caching infrastructure"}
      embeddings: {depth: 2, purpose: "Embedding infrastructure"}
      knowledge: {depth: 2, purpose: "Knowledge base infrastructure"}
      visualization: {depth: 2, purpose: "Visualization tools"}
      evaluation: {depth: 2, purpose: "Evaluation infrastructure"}
      cloud_native: {depth: 2, purpose: "Cloud-native patterns"}
      case_memory: {depth: 2, purpose: "Case memory infrastructure"}
      _compat: {depth: 2, purpose: "Compatibility shims"}
      adg: {depth: 2, purpose: "ADG integration"}
      agents: {depth: 2, purpose: "Agent registry"}
      core: {depth: 2, purpose: "Core utilities"}

  apps_eval:
    depth: 2
    purpose: "Evaluation application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Evaluation engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}

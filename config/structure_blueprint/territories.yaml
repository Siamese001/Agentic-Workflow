      utils: {depth: 2, purpose: "Helper utilities"}

  apps_shared:
    depth: 2
    purpose: "Shared application components"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      data: {depth: 2, purpose: "Shared datasets and references"}
      data_adapters: {depth: 2, purpose: "Data adapters and transformation utilities"}
      enforcement: {depth: 2, purpose: "Guardrails and validation"}
      mixins: {depth: 2, purpose: "Shared mixins and composition helpers"}
      prompts: {depth: 2, purpose: "Prompt templates and libraries"}

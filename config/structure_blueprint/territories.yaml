# Structure Blueprint — Territory Definitions
schema_version: "1.0.0"
last_updated: "2026-04-05"

# NOTE: Intentional Dependencies
# - agentic_core intentionally imports from ops_scripts/dev_tools/ for SSOT management utilities
# - This is a known architectural pattern: framework code depends on operational SSOT utilities
# - ops_scripts/dev_tools/ contains 1,052 utility scripts for SSOT management, not framework logic

# NOTE: Backward Compatibility Wrappers
# None currently active

territories:
  __root__:
    depth: 0
    type: "root"
    purpose: "Project root — allowed files only, no subdirectories except whitelisted territories"
    allowed_files:
      - "README.md"
      - "AGENTS.md"
      - "ARCHITECTURE_LAYERS.md"
      - "conftest.py"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "pytest.ini"
      - ".codeiumignore"
      - ".env"
      - ".gitattributes"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".pylintrc"
    allowed_patterns:
      - "trace_*.jsonl"
      - "mission_*.log"
      - "*.bat"
      - "*.sh"
      - "root_drift_*.py"

  config:
    depth: 2
    type: "configuration"
    purpose: "Project configuration and SSOT definitions"
    subfolders:
      structure_blueprint:
        depth: 2
        purpose: "SSOT territory and layer definitions"
        allowed_suffixes: [".yaml"]
        forbidden_suffixes: [".py"]
      schemas:
        depth: 2
        purpose: "Schema definitions"
        allowed_suffixes: [".yaml", ".json", ".py"]
    allowed_suffixes: [".yaml", ".json"]
    forbidden_suffixes: [".py"]

  docs:
    depth: 2
    type: "documentation"
    purpose: "Project documentation"
    subfolders:
      reports:
        depth: 2
        purpose: "Evidence and reports"
        allowed_suffixes: [".md"]
      tools:
        depth: 2
        purpose: "Tools documentation"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".txt"]
    forbidden_suffixes: [".py", ".json", ".yaml", ".log"]

  data:
    depth: 2
    type: "data"
    purpose: "Data files and datasets"
    subfolders:
      snapshots:
        depth: 2
        purpose: "Snapshot data"
        allowed_suffixes: [".json", ".jsonl"]
    allowed_suffixes: [".json", ".jsonl", ".txt", ".csv"]
    forbidden_suffixes: [".py", ".md", ".yaml", ".log"]

  .windsurf:
    depth: 2
    type: "ide_configuration"
    purpose: "Windsurf IDE configuration and AI assistant rules"
    subfolders:
      plans:
        depth: 2
        purpose: "Execution plans"
        allowed_suffixes: [".md", ".py"]
      rules:
        depth: 2
        purpose: "AI assistant rules"
        allowed_suffixes: [".md", ".yaml"]
      skills:
        depth: 2
        purpose: "AI assistant skills"
        allowed_suffixes: [".md"]
      templates:
        depth: 2
        purpose: "Plan templates"
        allowed_suffixes: [".md"]
      workflows:
        depth: 2
        purpose: "Workflow definitions"
        allowed_suffixes: [".md"]
    allowed_suffixes: [".md", ".json", ".yaml"]
    forbidden_suffixes: [".txt", ".log"]

  agentic_core:
    depth: 2
    purpose: "Core framework logic (L0-L6)"
    subfolders:
      L0_routing:
        depth: 2
        purpose: "Route election, capability arbitration, policy-aware dispatch"
        subfolders:
          config:
            purpose: "Configuration, settings, constants"
            allowed_suffixes: ["_config.py", "_settings.py"]
            forbidden_suffixes: ["_types.py"]
          types:
            purpose: "Data models, enums, protocols, schemas"
            allowed_suffixes: ["_types.py", "_protocol.py", "_schema.py", "_model.py", "_spec.py"]
            forbidden_suffixes: ["_config.py", "_engine.py", "_agent.py"]
          reasoning:
            purpose: "Decision-making agents, engines, planners, strategists"
          enforcement:
            purpose: "Constraint execution, guardrails, governors, gates"
          validators:
            purpose: "Passive auditing, compliance checks, structural validators"
          utils:
            purpose: "Helper functions, mixins, shared utilities"
      L1_cognition:
        depth: 2
        purpose: "Intent analysis, context expansion"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning:
            purpose: "Decision agents"
            subfolders:
              ml_decision_support:
                purpose: "ML-based decision support (feature extraction, model registry, inference)"
                subfolders:
                  config: {purpose: "ML model configuration and thresholds"}
                  features: {purpose: "Feature extractors per layer (l0_–l6_, c0/c1)"}
                  inference: {purpose: "Deterministic engine, replay harness, shadow logger"}
                  models: {purpose: "Layer-specific ML models and unified inference engine"}
          enforcement: {purpose: "Guardrails"}
          utils:
            purpose: "Helpers"
            subfolders:
              prompt_taxonomy:
                purpose: "Prompt categorization taxonomy, loader, and Jinja2 templates"
                subfolders:
                  templates: {purpose: "Jinja2 prompt templates per category (C0, D0, I0, S0, U0)"}
      L2_execution:
        depth: 2
        purpose: "Tool execution, action orchestration"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils: {purpose: "Helpers"}
      L3_orchestration:
        depth: 2
        purpose: "Multi-agent coordination, workflow state"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning:
            purpose: "Decision agents"
            no_root_files: true
            subfolders:
              arbitration: {purpose: "Multi-advisor arbitration and decision arbitrator logic"}
              coordination: {purpose: "Lease coordination and work bundle coordination"}
              engines: {purpose: "Orchestration engines and workflow processors"}
              ptc: {purpose: "Prompt-to-completion tool registry, contract definitions, and invoker"}
          enforcement: {purpose: "Guardrails"}
          utils:
            purpose: "Helpers"
            subfolders:
              registry: {purpose: "Agent capability and dispatch registries"}
              replay: {purpose: "Deterministic replay and state reconstruction for orchestration traces"}
          inference:
            depth: 2
            purpose: "Inference service integrations (vLLM, etc.)"
            subfolders:
              qwen_vllm:
                depth: 2
                purpose: "Qwen vLLM inference service"
                subfolders:
                  config: {depth: 2, purpose: "Configuration and telemetry"}
                  engines: {depth: 2, purpose: "vLLM client implementations"}
                  reasoning: {depth: 2, purpose: "Gateway and orchestration"}
                  tools: {depth: 2, purpose: "GPU monitoring utilities"}
      L4_state:
        depth: 2
        purpose: "Memory, embeddings, retrieval"
        subfolders:
          cache: {purpose: "Caching layers and cache management strategies"}
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement:
            purpose: "Guardrails"
            subfolders:
              authority: {purpose: "State and memory authority enforcement — run-scoped state, memory access control"}
          memory:
            purpose: "Hot storage: vector stores, semantic caches, reasoning memory, experience buffers"
            subfolders:
              semantic: {purpose: "Semantic search stores (BM25, embeddings)"}
          utils:
            purpose: "Helpers"
            subfolders:
              client: {purpose: "External client wrappers (ChromaDB, etc.)"}
              commit: {purpose: "Two-phase commit and transactional coordination utilities"}
              context: {purpose: "Execution context and freeze/unfreeze utilities"}
              ledger: {purpose: "Ledger integrity validation utilities"}
              lifecycle: {purpose: "State lifecycle management and policy application"}
              retrieval: {purpose: "Context retrieval orchestration"}
              storage: {purpose: "Persistent and filesystem-backed state storage implementations"}
              versioning: {purpose: "State versioning, version manager, and versioned transition registry"}
      L5_safety:
        depth: 2
        purpose: "Guardrails, validation, policy enforcement"
        subfolders:
          config:
            purpose: "Configuration"
            subfolders:
              structure_blueprint:
                purpose: "SSOT structure blueprint module — _constants.py, territories.py, ssot.py, derived.py, and enforcement/snapshot baseline files"
                subfolders:
                  data: {purpose: "SSOT data files (territories.json, manifest snapshots)"}
                  enforcement: {purpose: "Structural enforcement baselines — import graph, debt baselines, type registry"}
          types: {purpose: "Data models"}
          reasoning:
            purpose: "Decision agents"
            subfolders:
              adaptation: {purpose: "Policy adaptation loop — runtime safety policy self-adjustment"}
              core_kernel: {purpose: "Zero-dependency safety kernel and foundational primitives"}
              file_classification: {purpose: "File classification sub-package: classification core, naming policy, validation rules"}
          enforcement:
            purpose: "Guardrails"
            subfolders:
              audit: {purpose: "Safety audit trail, registry, and AI check audit"}
              escalation: {purpose: "Human escalation and escalation orchestration"}
              gates: {purpose: "Tool safety gate and enforcement checkpoints"}
              governance: {purpose: "Governance policies, audit hooks, and compliance frameworks"}
              hitl: {purpose: "Human-in-the-loop enforcement: decision logger, escalation activator, review queue"}
              retrieval: {purpose: "Retrieval safety gate"}
              security: {purpose: "Credential guards, injection gates, secret management, signature verification"}
          validators:
            purpose: "Validators"
            subfolders:
              invariants: {purpose: "Runtime invariant checker"}
              static_checks: {purpose: "Static analysis invariant checks: determinism, PowerShell ban, PTC invariants, write-gateway enforcement"}
          utils:
            purpose: "Helpers"
            subfolders:
              runners: {purpose: "Orchestrator and agent runner utilities for safety layer agents"}
      L6_observability:
        depth: 2
        purpose: "Telemetry, logging, monitoring"
        subfolders:
          config: {purpose: "Configuration"}
          types: {purpose: "Data models"}
          reasoning: {purpose: "Decision agents"}
          enforcement: {purpose: "Guardrails"}
          utils:
            purpose: "Helpers"
            subfolders:
              dashboard: {purpose: "Operational dashboard aggregator, analytics dashboard, and orchestrator"}
              engines: {purpose: "Observability engines and telemetry processors"}
              evaluation:
                purpose: "Evaluation cache, learning bridge, provenance, signal integrators, and metric aggregation"
                subfolders:
                  golden: {purpose: "Golden evaluation datasets and ground-truth evaluators"}
              metrics: {purpose: "Retrieval and observability metrics: NDCG, MRR, precision@k, recall@k, Prometheus"}
              performance: {purpose: "Performance emitter and registry"}
              telemetry: {purpose: "Reasoning outcome tracker and telemetry aggregation"}
              visualization: {purpose: "Workflow visualization and visualization state updates"}
      # Cross-cutting infrastructure
      mixins:
        depth: 2
        purpose: "Shared capability mixins for agent composition (flat — no subdirectories)"
      seams:
        depth: 2
        purpose: "Integration contracts and protocol seams"
        subfolders:
          contracts: {depth: 2, purpose: "Contract definitions"}
      # Other top-level directories
      base_agents: {depth: 2, purpose: "Base agent classes"}
      runtime: {depth: 2, purpose: "Runtime utilities and types"}
      config: {depth: 2, purpose: "Framework configuration"}
      utils: {depth: 2, purpose: "Framework utilities"}
      gateway: {depth: 2, purpose: "Gateway implementations"}
      interfaces: {depth: 2, purpose: "Interface definitions"}
      L_CONTRACTS: {depth: 2, purpose: "Layer contracts and cross-layer enforcement contracts"}
      tracing: {depth: 2, purpose: "Tracing infrastructure"}
      prompt_governance: {depth: 2, purpose: "Prompt governance"}
      cache: {depth: 2, purpose: "Caching infrastructure"}
      embeddings: {depth: 2, purpose: "Embedding infrastructure"}
      knowledge: {depth: 2, purpose: "Knowledge base infrastructure"}
      visualization: {depth: 2, purpose: "Visualization tools"}
      evaluation: {depth: 2, purpose: "Evaluation infrastructure"}
      cloud_native: {depth: 2, purpose: "Cloud-native patterns"}
      case_memory: {depth: 2, purpose: "Case memory infrastructure"}
      _compat: {depth: 2, purpose: "Compatibility shims"}
      adg:
        depth: 2
        purpose: "ADG integration — Architecture Dependency Graph"
        subfolders:
          adapters: {depth: 2, purpose: "ADG adapter modules for memory and MCP integration"}
          analysis: {depth: 2, purpose: "ADG analysis modules (confidence, impact, ownership, snapshots)"}
          applications: {depth: 2, purpose: "ADG governance applications (blast radius, gateway enforcement, RAG, UWG)"}
          artifact: {depth: 2, purpose: "ADG artifact generation and serialization (SQLite, JSON, split planes)"}
          ci: {depth: 2, purpose: "CI integration and invariant checks"}
          client: {depth: 2, purpose: "MCP client for ADG graph operations"}
          contracts: {depth: 2, purpose: "ADG contract definitions and protocol interfaces"}
          extraction: {depth: 2, purpose: "Static AST-based scanner and edge extraction"}
          identity: {depth: 2, purpose: "Entity identity resolution and canonicalization"}
          precision: {depth: 2, purpose: "Precision scoring and semantic enrichment"}
          processing: {depth: 2, purpose: "ADG processing pipelines and batch operations"}
          runtime: {depth: 2, purpose: "ADG runtime behavioral indexing and live analysis"}
          _compat: {depth: 2, purpose: "Backward-compatibility shims for ADG modules"}
      agents: {depth: 2, purpose: "Agent registry"}
      core: {depth: 2, purpose: "Core utilities"}

  apps_eval:
    depth: 2
    purpose: "Evaluation application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      data: {depth: 2, purpose: "Evaluation datasets and golden references"}
      engines: {depth: 2, purpose: "Evaluation engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "Evaluation services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      scripts: {depth: 2, purpose: "Utility scripts"}
      spine: {depth: 2, purpose: "Spine adapters"}
      tests: {depth: 2, purpose: "Test suite"}
      tools: {depth: 2, purpose: "Utility tools"}
      utils: {depth: 2, purpose: "Helper utilities"}

  apps_exec:
    depth: 2
    purpose: "Execution application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "Execution services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      scripts: {depth: 2, purpose: "Utility scripts"}
      spine: {depth: 2, purpose: "Spine adapters"}
      tests: {depth: 2, purpose: "Test suite"}
      tools: {depth: 2, purpose: "Utility tools"}
      utils: {depth: 2, purpose: "Helper utilities"}

  apps_lic:
    depth: 2
    purpose: "License management application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Execution engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "License services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      scripts: {depth: 2, purpose: "Utility scripts"}
      tests: {depth: 2, purpose: "Test suite"}
      tools: {depth: 2, purpose: "Utility tools"}
      utils: {depth: 2, purpose: "Helper utilities"}

  apps_research:
    depth: 2
    purpose: "Research application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Research engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "Research services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}

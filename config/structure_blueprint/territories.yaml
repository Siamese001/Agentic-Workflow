  apps_underwriting_ai:
    depth: 2
    purpose: "Underwriting AI application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      engines: {depth: 2, purpose: "Underwriting engines"}
      examples: {depth: 2, purpose: "Sample underwriting requests and decisions"}
      ingestion: {depth: 2, purpose: "Document ingestion and processing"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      parsers: {depth: 2, purpose: "Document parsers and extractors"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      tests: {depth: 2, purpose: "Test suite"}
      types: {depth: 2, purpose: "Data models"}
      validators: {depth: 2, purpose: "Validation logic"}

  tests:
    depth: 2
    purpose: "Test suites"
    subfolders:
      unit:
        depth: 3
        purpose: "Unit tests"
        subfolders:
          agentic_core: {depth: 4, purpose: "Core tests"}
          apps_*: {depth: 4, purpose: "App tests (wildcard)"}
      integration: {depth: 3, purpose: "Integration tests"}
      e2e: {depth: 3, purpose: "End-to-end tests"}
      apps_*:
        depth: 3
        purpose: "App-specific tests (wildcard)"

  infrastructure:
    depth: 2
    purpose: "Infrastructure coordination and optimization"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      types: {depth: 2, purpose: "Data models"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      utils: {depth: 2, purpose: "Helpers"}

  system_learning:
    depth: 2
    purpose: "Meta-learning and system improvement"
    subfolders:
      adapters: {depth: 2, purpose: "Per-layer adaptation modules (l0_–l5_ prefixes are intentional)"}
      arbitration: {depth: 2, purpose: "Conflict resolution and policy arbitration for learning proposals"}
      confidence: {depth: 2, purpose: "Confidence scoring and calibration"}
      config: {depth: 2, purpose: "Learning system configuration"}
      constraints: {depth: 2, purpose: "Learning constraints and guardrails"}
      correlation: {depth: 2, purpose: "Cross-signal correlation and pattern matching"}
      embedding: {depth: 2, purpose: "Embedding management and vector operations"}
      enforcement: {depth: 2, purpose: "Policy enforcement for learning outputs"}
      engines: {depth: 2, purpose: "Learning engine implementations (l0_–l5_ prefixes are intentional)"}
      fingerprinting: {depth: 2, purpose: "Behavioral fingerprinting and change detection"}
      golden: {depth: 2, purpose: "Golden datasets and benchmark references"}
      invariants: {depth: 2, purpose: "Learning invariants and consistency checks"}
      logs: {depth: 2, purpose: "Learning system logs and audit trails"}
      memory: {depth: 2, purpose: "Learning memory and state persistence"}
      meta_learning: {depth: 2, purpose: "Meta-learning core and optimization loops"}
      ml_integration: {depth: 2, purpose: "Machine learning framework integrations"}
      monitoring: {depth: 2, purpose: "Learning system monitoring and metrics"}
      output: {depth: 2, purpose: "Learning output generation and results"}
      pipelines: {depth: 2, purpose: "Training and inference pipelines"}
      policy: {depth: 2, purpose: "Learning policies and governance rules"}
      ports: {depth: 2, purpose: "Integration ports for external learning systems"}
      provenance: {depth: 2, purpose: "Learning provenance and lineage tracking"}
      raw: {depth: 2, purpose: "Raw learning data and inputs"}
      runtime: {depth: 2, purpose: "Runtime state for active learning loops"}
      runtime_adg: {depth: 2, purpose: "Runtime ADG integration and live analysis"}
      scripts: {depth: 2, purpose: "Learning system operational scripts"}
      snapshots: {depth: 2, purpose: "Periodic state snapshots for rollback and replay"}
      state: {depth: 2, purpose: "Learning state management and transitions"}
      stores: {depth: 2, purpose: "Persistent learning artifact stores"}
      telemetry: {depth: 2, purpose: "Learning telemetry and performance data"}
      types: {depth: 2, purpose: "Domain types and data contracts"}
      validators: {depth: 2, purpose: "Validation logic for learning artifacts"}

  tools:
    depth: 1
    purpose: "Development and operational tools"
    volatile: true
    subfolders:
      adg: {depth: 2, purpose: "ADG tools and analysis"}
      archive: {depth: 2, purpose: "Archived and superseded tool scripts"}
      generate: {depth: 2, purpose: "Code and report generation scripts"}
      guardian: {depth: 2, purpose: "Guardian exemption and anti-pattern sweep tools"}

# Wildcard territories (pattern-based matching)
wildcards:
  apps_*:
    pattern: "^apps_.*$"
    depth: 2
    purpose: "Application territories (eval, exec, lic, research, rfp, rg)"
    subfolders:
      config: {purpose: "Configuration"}
      engines: {purpose: "Execution engines"}
      reasoning: {purpose: "Decision agents"}
      data: {purpose: "Data files"}

  tests/apps_*:
    pattern: "^tests/apps_.*$"
    depth: 3
    purpose: "App-specific test territories"
    subfolders:
      unit: {purpose: "Unit tests"}
      integration: {purpose: "Integration tests"}

    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      enforcement: {depth: 2, purpose: "Guardrails"}
      engines: {depth: 2, purpose: "Generation engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      scripts: {depth: 2, purpose: "Utility scripts"}
      tests: {depth: 2, purpose: "Test suite"}
      tools: {depth: 2, purpose: "Utility tools"}
      utils: {depth: 2, purpose: "Helper utilities"}

  apps_shared:
    depth: 2
    purpose: "Shared application components"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      data: {depth: 2, purpose: "Shared datasets and references"}
      data_adapters: {depth: 2, purpose: "Data adapters and transformation utilities"}
      enforcement: {depth: 2, purpose: "Guardrails and validation"}
      mixins: {depth: 2, purpose: "Shared mixins and composition helpers"}
      prompts: {depth: 2, purpose: "Prompt templates and libraries"}
      reasoning: {depth: 2, purpose: "Shared reasoning components"}
      services: {depth: 2, purpose: "Shared services"}
      spine: {depth: 2, purpose: "Spine adapters"}
      tests: {depth: 2, purpose: "Test suite"}

      utils: {depth: 2, purpose: "Helper utilities"}

  apps_rfp:
    depth: 2
    purpose: "RFP application"
    subfolders:
      config: {depth: 2, purpose: "Configuration"}
      data: {depth: 2, purpose: "RFP datasets and references"}
      engines: {depth: 2, purpose: "Proposal engines"}
      reasoning: {depth: 2, purpose: "Decision agents"}
      services: {depth: 2, purpose: "Proposal services"}
      validators: {depth: 2, purpose: "Validation logic"}
      types: {depth: 2, purpose: "Data models"}
      integrations: {depth: 2, purpose: "External integrations"}
      outputs: {depth: 2, purpose: "Output generators"}
      scripts: {depth: 2, purpose: "Utility scripts"}
      spine: {depth: 2, purpose: "Spine adapters"}
      tests: {depth: 2, purpose: "Test suite"}
      tools: {depth: 2, purpose: "Utility tools"}

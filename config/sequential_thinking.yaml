# SequentialThinking Configuration
# These parameters control the cognitive reasoning loop

# Core Parameters
max_steps: 5              # Maximum number of thinking steps before synthesis
step_timeout: 30          # Timeout per thinking step (seconds)
overall_timeout: 300      # Overall timeout for entire thinking process (seconds)

# Circuit Breaker
circuit_breaker_trips: 2  # Number of slow steps before circuit breaker activates
slow_step_threshold: 30   # What constitutes a "slow" step (seconds)

# Persistence
persist_history: true     # Save thought history to disk for debugging
history_dir: "logs/thought_history"  # Directory to save thought history

# Error Handling
max_syntax_attempts: 2    # Maximum attempts to fix syntax errors
fallback_on_error: false  # Return empty string on error (if false, raises exception)

# Logging
log_thoughts: true        # Log each thought step
log_timing: true          # Log timing information for each step

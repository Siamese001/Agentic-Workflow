# Notion Workspace Map — SSOT for all Notion database IDs and routing triggers.
#
# Consumed by:
#   - .claude/governance/scripts/sync_mcp_config.py  -> regenerates AGENTS.md NOTION-MAP autogen block
#   - .claude/governance/scripts/post_write_mcp_config_sync.py -> picks MCP Registry DB ID
#   - ops_scripts/ci/check_agents_md_sync.py -> fails PRs on drift
#
# NEVER hand-edit Notion DB IDs in AGENTS.md or post_write_mcp_config_sync.py.
# Change them here and regenerate via: python .claude/governance/scripts/sync_mcp_config.py
#
# TWO IDs PER DATABASE (Notion 2025-09-03 API):
#   - `id`         = data_source_id — use for API-query-data-source (reads)
#   - `database_id`= parent database_id — use for API-post-page (writes/creates)
# Conflating the two is the #1 reason auto-route writes 404.
# Both are discovered via API-post-search (returns both on every data_source result).
workspace:
  bot: "Agentic-Workflow"
  space: "Amit Ayer's Space"

databases:
  # Renamed 2026-04-23 W6: Wave/Phase Convergence -> Backlog Items.
  # Legacy `Priority` number property archived in same wave; P-Band is SSOT now.
  - key: backlog_items
    name: "Backlog Items"
    id: "fc7f6bf4-6a73-43cd-a4e8-1ef23267dbe7"
    database_id: "aa8d2507-101e-4384-81d9-60ea3fe33876"
    read_trigger: '"plan status", "phase progress", "wave status", "what''s blocked" — **but prefer the Backlog Snapshot page for top-N/dashboard queries (see below)**'
    write_trigger: "On wave/phase completion or status change. Post-hook `post_cascade_deferred_scope_capture.py` auto-posts from DEFERRED_SCOPE markers with scorer-assigned P-Band."

  - key: plans
    name: "Plans"
    id: "ac53d31b-3068-4039-9ebe-856c12caab32"
    database_id: "6aba34d9-4d0b-4f4c-b956-b2bdea541ca9"
    read_trigger: '"which plans exist", "plan status", "is this plan on disk" — relation target from Backlog Items.Plan'
    write_trigger: "On new plan file creation under `.claude/plans/<slug>-<6hex>.md`. Create Plans row with Status=Not Started, Exists On Disk=true, Plan File Path set."

  - key: sc_ap_violation_backlog
    name: "SC/AP Violation Backlog"
    id: "803834e1-0af8-4c3c-b45a-f513f80a7fef"
    database_id: "0a3b8072-eabd-4516-9473-3c321bb011ff"
    archived: true
    archived_date: "2026-05-02"
    read_trigger: "\u274c **ARCHIVED 2026-05-02**"
    write_trigger: "Filesystem SSOT: `artifacts/adg/*.sqlite` + violation JSON. No Notion write."

  # HITL Decision Ledger RETIRED 2026-05-02 — superseded by SQLite SSOT at
  # .claude/state/refactor_decisions/refactor_decision_ledger.sqlite (per
  # constitutional §30). The Notion mirror at data_source 5b60fdde-7259-491e-9f2d-
  # e088f1f741ef / database 18bb9145-1320-4191-8b14-6c309776bcf5 was a one-way
  # projection only — every page carried `decision_id=dec_xxxxx` derived from the
  # SQLite chain. tools/notion/sync_decision_ledger.py was disabled in the same
  # turn. If decision-history search is needed, query the SQLite FTS index
  # (`decisions_fts`) directly. Do NOT re-create the Notion mirror.

  - key: constitutional_rules_registry
    name: "Constitutional Rules Registry"
    id: "9bd2523e-7a6e-434d-89a7-ce4166457069"
    database_id: "1c1379bc-32ca-4216-898a-3672f0316f69"
    archived: true
    archived_date: "2026-05-02"
    read_trigger: "\u274c **ARCHIVED 2026-05-02**"
    write_trigger: "Filesystem SSOT: `.claude/rules/*.mdc`. No Notion write."

  - key: mcp_registry
    name: "MCP Registry"
    id: "e7b149b4-0496-4e98-a5dd-074dbe31881b"
    database_id: "59693bbc-71b1-4c63-bc9f-b31eb8b08a0e"
    archived: true
    archived_date: "2026-05-02"
    read_trigger: "\u274c **ARCHIVED 2026-05-02**"
    write_trigger: "Filesystem SSOT: root `.mcp.json` only. Deprecated Cursor/Windsurf compatibility copies are non-authoritative."

  # ADR Registry RETIRED 2026-05-02 — consolidated in commit b11200e833
  # "chore(notion): consolidate 4 mirror DBs; migrate value-add to SSOT".
  # The on-disk ADR markdown files at docs/architecture/adr/ADR-NNN-*.md ARE the SSOT.
  # No Notion mirror row is created on new ADR authoring. Removed from this SSOT on
  # 2026-05-02 via deferred-scope-closeout-2026-05-02-e4f8a1 W1. If ADR search/filter
  # becomes a need again, use ripgrep over docs/architecture/adr/ or add a code-side
  # index — do NOT re-create the Notion mirror.

  - key: antipattern_burndown
    name: "Anti-Pattern Burndown"

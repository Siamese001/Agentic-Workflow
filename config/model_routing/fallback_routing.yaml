# Model Routing Fallback Configuration
# Fallback strategies and model switching policies

# Fallback Routing Framework
fallback_routing:
  enabled: true
  automatic_fallback: true
  fallback_timeout: 30  # seconds
  max_fallback_depth: 3

# Fallback Triggers
triggers:
  model_unavailable:
    retry_attempts: 2
    fallback_immediate: true
  
  quality_threshold_miss:
    min_quality_score: 0.6
    retry_with_different_model: true
  
  cost_limit_exceeded:
    switch_to_cheaper_model: true
    cost_tolerance: 0.2
  
  latency_threshold_exceeded:
    max_latency: 10000  # milliseconds
    switch_to_faster_model: true
  
  rate_limit_hit:
    switch_provider: true
    exponential_backoff: true

# Fallback Chains by Task Type
fallback_chains:
  resume_generation:
    primary: gpt-4
    fallback_1: gpt-4-turbo
    fallback_2: claude-3-sonnet
    fallback_3: claude-3-opus
    quality_minimum: 0.7
  
  message_generation:
    primary: gpt-4-turbo
    fallback_1: claude-3-sonnet
    fallback_2: gpt-3.5-turbo
    fallback_3: claude-3-haiku
    quality_minimum: 0.6
  
  data_analysis:
    primary: claude-3-sonnet
    fallback_1: gpt-4
    fallback_2: claude-3-opus
    fallback_3: gpt-4-turbo
    quality_minimum: 0.8
  
  content_validation:
    primary: gpt-3.5-turbo
    fallback_1: claude-3-haiku
    fallback_2: gpt-5-nano
    fallback_3: claude-haiku-4-5-20251001
    quality_minimum: 0.5

# Provider-Level Fallback
provider_fallback:
  openai_to_anthropic:
    trigger_conditions:
      - api_rate_limit
      - service_outage
      - account_suspension
    model_mapping:
      gpt-4: claude-3-opus
      gpt-4-turbo: claude-3-sonnet
      gpt-3.5-turbo: claude-3-haiku
      gpt-5-nano: claude-haiku-4-5-20251001
  
  anthropic_to_openai:
    trigger_conditions:
      - api_rate_limit
      - service_outage
      - model_deprecation
    model_mapping:
      claude-3-opus: gpt-4
      claude-3-sonnet: gpt-4-turbo
      claude-3-haiku: gpt-3.5-turbo
      claude-haiku-4-5-20251001: gpt-5-nano

# Fallback Decision Logic
decision_logic:
  quality_first:
    prioritize_quality: true
    min_acceptable_quality: 0.7
    cost_tolerance: 2.0
  
  cost_first:
    prioritize_cost: true
    max_cost_multiplier: 1.5
    min_acceptable_quality: 0.6
  
  speed_first:
    prioritize_latency: true
    max_latency_multiplier: 1.5
    min_acceptable_quality: 0.6

# Fallback Recovery
recovery:
  auto_recovery: true
  recovery_interval: 300  # seconds
  health_check_enabled: true
  primary_model_retry_threshold: 0.8

# Fallback Monitoring
monitoring:
  track_fallback_events: true
  fallback_success_rate_threshold: 0.8
  alert_on_excessive_fallbacks: true
  excessive_fallback_threshold: 0.3  # 30% fallback rate

# Model Routing Policies Configuration
# Intelligent model selection and routing logic

# Routing Policy Framework
routing_policy:
  enabled: true
  default_strategy: cost_optimized
  fallback_enabled: true
  load_balancing: true

# Model Selection Criteria
selection_criteria:
  performance_weight: 0.4
  cost_weight: 0.3
  availability_weight: 0.2
  latency_weight: 0.1

# Task-Specific Routing
task_routing:
  resume_generation:
    primary_model: gpt-4
    fallback_models:
      - gpt-4-turbo
      - claude-3-sonnet
    quality_threshold: 0.8
    cost_sensitivity: medium
  
  message_generation:
    primary_model: gpt-4-turbo
    fallback_models:
      - claude-3-sonnet
      - gpt-3.5-turbo
    quality_threshold: 0.7
    cost_sensitivity: high
  
  data_analysis:
    primary_model: claude-3-sonnet
    fallback_models:
      - gpt-4
      - claude-3-haiku
    quality_threshold: 0.8
    cost_sensitivity: low
  
  content_validation:
    primary_model: gpt-3.5-turbo
    fallback_models:
      - claude-3-haiku
    quality_threshold: 0.6
    cost_sensitivity: high

# Context-Based Routing
context_routing:
  high_stakes:
    models: [gpt-4, claude-3-opus]
    quality_threshold: 0.9
    cost_limit: 1.0
  
  standard_tasks:
    models: [gpt-4-turbo, claude-3-sonnet]
    quality_threshold: 0.7
    cost_limit: 0.5
  
  batch_processing:
    models: [gpt-3.5-turbo, claude-3-haiku]
    quality_threshold: 0.6
    cost_limit: 0.1

# Load Balancing Policies
load_balancing:
  strategy: round_robin
  health_check_interval: 60  # seconds
  failure_threshold: 3
  recovery_timeout: 300  # seconds
  
  provider_weights:
    openai: 0.6
    anthropic: 0.4

# Cost-Based Routing
cost_routing:
  budget_tiers:
    low_budget:
      models: [gpt-3.5-turbo, claude-3-haiku]
      max_cost_per_request: 0.01
    
    medium_budget:
      models: [gpt-4-turbo, claude-3-sonnet]
      max_cost_per_request: 0.05
    
    high_budget:
      models: [gpt-4, claude-3-opus]
      max_cost_per_request: 0.10

# Performance Routing
performance_routing:
  latency_thresholds:
    fast_response: 2000  # milliseconds
    standard_response: 5000  # milliseconds
    slow_response: 10000  # milliseconds
  
  quality_requirements:
    critical: 0.9
    important: 0.8
    standard: 0.7
    basic: 0.6

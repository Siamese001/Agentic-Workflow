# Model Routing Evaluation Weights Configuration
# Weighting factors for model selection and evaluation

# Evaluation Framework
evaluation_framework:
  enabled: true
  dynamic_weighting: true
  context_aware_weights: true
  learning_enabled: false

# Primary Evaluation Criteria
primary_criteria:
  quality_score:
    base_weight: 0.4
    min_threshold: 0.6
    importance: high
    adjustment_factor: 1.0
  
  cost_efficiency:
    base_weight: 0.3
    min_threshold: 0.0
    importance: medium
    adjustment_factor: 1.0
  
  availability:
    base_weight: 0.2
    min_threshold: 0.8
    importance: high
    adjustment_factor: 1.0
  
  latency:
    base_weight: 0.1
    min_threshold: 0.0
    importance: low
    adjustment_factor: 1.0

# Task-Specific Weight Adjustments
task_weights:
  resume_generation:
    quality_score: 0.5
    cost_efficiency: 0.2
    availability: 0.2
    latency: 0.1
  
  message_generation:
    quality_score: 0.3
    cost_efficiency: 0.3
    availability: 0.3
    latency: 0.1
  
  data_analysis:
    quality_score: 0.4
    cost_efficiency: 0.2
    availability: 0.3
    latency: 0.1
  
  content_validation:
    quality_score: 0.2
    cost_efficiency: 0.4
    availability: 0.3
    latency: 0.1

# Context-Based Weight Adjustments
context_weights:
  high_stakes:
    quality_score: 0.6
    cost_efficiency: 0.1
    availability: 0.2
    latency: 0.1
  
  cost_sensitive:
    quality_score: 0.2
    cost_efficiency: 0.5
    availability: 0.2
    latency: 0.1
  
  time_critical:
    quality_score: 0.3
    cost_efficiency: 0.1
    availability: 0.3
    latency: 0.3
  
  standard_operation:
    quality_score: 0.4
    cost_efficiency: 0.3
    availability: 0.2
    latency: 0.1

# Secondary Evaluation Criteria
secondary_criteria:
  model_reliability:
    weight: 0.05
    measurement: uptime_percentage
    target_value: 0.99
  
  scalability:
    weight: 0.03
    measurement: concurrent_requests
    target_value: 100
  
  security:
    weight: 0.02
    measurement: security_score
    target_value: 0.9

# Dynamic Weight Adjustment Rules
dynamic_adjustments:
  performance_degradation:
    quality_weight_increase: 0.1
    cost_weight_decrease: 0.05
  
  budget_pressure:
    cost_weight_increase: 0.2
    quality_weight_decrease: 0.1
  
  time_pressure:
    latency_weight_increase: 0.15
    quality_weight_decrease: 0.05

# Evaluation Scoring
scoring:
  normalize_scores: true
  weighted_average: true
  penalty_for_missing_criteria: 0.1
  bonus_for_exceeding_thresholds: 0.05

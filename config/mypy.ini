[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

# Exclude legacy and archive folders that block validation
exclude = (
    legacy_lic/|
    v10_[0-9]+/|
    REPO BACKUP/|
    PY/|
    old_workspaces/|
    tmp_work/|
    archive/|
    l1/instructional_injection_v6.py|
    \.git/|
    __pycache__/
)

# Include only core LIC path
mypy_path = .

[mypy-tests.*]
disallow_untyped_defs = False

# Resume Engine ATS Rules Configuration
# Applicant Tracking System optimization and compliance rules

# ATS Compliance Framework
ats_compliance:
  enabled: true
  strict_mode: true
  validation_required: true

# File Format Rules
file_formats:
  accepted_formats: [pdf, docx, txt]
  preferred_format: pdf
  max_file_size: 10485760  # 10MB
  font_requirements:
    - Arial
    - Times New Roman
    - Calibri
    - Georgia
  min_font_size: 10
  max_font_size: 12

# Keyword Optimization Rules
keyword_rules:
  keyword_density:
    min_density: 0.01
    max_density: 0.03
    target_density: 0.02
  
  keyword_variations:
    max_variations_per_term: 3
    synonym_inclusion: true
    acronym_handling: true
  
  skill_keywords:
    required_skills_threshold: 0.8
    preferred_skills_threshold: 0.6
    skill_category_matching: true

# Structure Compliance Rules
structure_rules:
  section_order:
    required: [contact, summary, experience, education]
    optional: [skills, projects, certifications, awards]
    max_sections: 8
  
  section_headers:
    standard_headers_only: true
    capitalization_consistency: true
    no_special_characters: true
  
  content_layout:
    single_column: true
    no_tables: true
    no_images: true
    no_graphics: true

# Content Optimization Rules
content_rules:
  bullet_points:
    max_bullets_per_experience: 5
    max_chars_per_bullet: 600
    action_verbs_required: true
    quantification_required: true
  
  experience_format:
    date_format: MM/YYYY - MM/YYYY
    company_name_format: title_case
    job_title_format: title_case
    location_format: City, State
  
  contact_information:
    required_fields: [name, phone, email, location]
    optional_fields: [linkedin, website, portfolio]
    format_validation: true

# ATS System Compatibility
system_compatibility:
  taleo:
    keyword_matching: strict
    format_requirements: standard
  
  workday:
    parsing_rules: conservative
    field_mapping: automatic
  
  greenhouse:
    modern_parsing: true
    skill_extraction: enhanced
  
  icims:
    legacy_support: true
    text_extraction: priority

# Quality Assurance Rules
quality_assurance:
  parsing_score:
    min_score: 0.9
    critical_blocks: [contact, experience, education]
  
  readability:
    flesch_kincaid_target: 8.0
    sentence_length_max: 25
    paragraph_length_max: 5
  
  consistency_checks:
    date_format_consistency: true
    capitalization_consistency: true
    formatting_consistency: true

# Resume Engine Skill Taxonomy Configuration
# Skill categorization, hierarchy, and classification system

# Skill Taxonomy Framework
skill_taxonomy:
  enabled: true
  hierarchical_classification: true
  industry_specific: true
  dynamic_updates: false

# Primary Skill Categories
primary_categories:
  technical_skills:
    weight: 0.4
    max_skills: 20
    subcategories:
      - programming_languages
      - frameworks_libraries
      - databases
      - cloud_platforms
      - devops_tools
      - software_tools
  
  soft_skills:
    weight: 0.3
    max_skills: 15
    subcategories:
      - communication
      - leadership
      - teamwork
      - problem_solving
      - time_management
      - adaptability
  
  industry_skills:
    weight: 0.2
    max_skills: 10
    subcategories:
      - domain_knowledge
      - industry_tools
      - regulatory_compliance
      - best_practices
  
  certification_skills:
    weight: 0.1
    max_skills: 5
    subcategories:
      - professional_certifications
      - technical_certifications
      - industry_certifications

# Technical Skills Taxonomy
technical_skills_taxonomy:
  programming_languages:
    categories:
      - frontend: [JavaScript, TypeScript, HTML, CSS, React, Vue, Angular]
      - backend: [Python, Java, C#, Node.js, Go, Rust, PHP]
      - mobile: [Swift, Kotlin, React_Native, Flutter]
      - data: [R, SQL, Python, SAS, MATLAB]
      - systems: [C, C++, Assembly, Bash]
  
  frameworks_libraries:
    categories:
      - web_frameworks: [Django, Flask, Spring, Express, Laravel]
      - frontend_frameworks: [React, Vue, Angular, jQuery, Bootstrap]
      - data_frameworks: [TensorFlow, PyTorch, Scikit_learn, Pandas]
      - testing_frameworks: [Jest, PyTest, JUnit, Selenium]
  
  databases:
    categories:
      - relational: [MySQL, PostgreSQL, SQL_Server, Oracle]
      - nosql: [MongoDB, Redis, Cassandra, DynamoDB]
      - data_warehouses: [Snowflake, BigQuery, Redshift]
      - search_engines: [Elasticsearch, Solr, Algolia]

# Soft Skills Taxonomy
soft_skills_taxonomy:
  communication:
    skills:
      - written_communication
      - verbal_communication
      - presentation_skills
      - active_listening
      - technical_writing
  
  leadership:
    skills:
      - team_leadership
      - project_management
      - strategic_planning
      - decision_making
      - mentoring
  
  problem_solving:
    skills:
      - analytical_thinking
      - critical_thinking
      - creativity
      - troubleshooting
      - root_cause_analysis

# Industry-Specific Skills
industry_skills_taxonomy:
  technology:
    skills:
      - agile_methodologies
      - scrum
      - devops
      - cloud_computing
      - microservices
  
  finance:
    skills:
      - financial_analysis
      - risk_management
      - regulatory_compliance
      - financial_modeling
      - audit_procedures
  
  healthcare:
    skills:
      - patient_care
      - medical_terminology
      - hipaa_compliance
      - clinical_procedures
      - electronic_health_records

# Skill Matching Rules
matching_rules:
  synonym_matching: true
  fuzzy_matching: true
  experience_level_weighting: true
  recency_weighting: true
  
  confidence_thresholds:
    exact_match: 0.95
    synonym_match: 0.8
    fuzzy_match: 0.6
    contextual_match: 0.7

# Skill Extraction Parameters
extraction:
  min_confidence: 0.7
  max_skills_per_section: 20
  deduplication_enabled: true
  verification_required: false

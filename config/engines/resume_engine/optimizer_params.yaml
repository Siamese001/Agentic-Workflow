# Resume Engine Optimizer Parameters Configuration
# Resume optimization algorithms and tuning parameters

# Optimization Framework
optimizer:
  enabled: true
  optimization_level: high
  iterations: 3
  convergence_threshold: 0.95

# Content Optimization Parameters
content_optimization:
  keyword_optimization:
    target_density: 0.02
    density_tolerance: 0.005
    keyword_placement_weight: 0.3
    semantic_variations: true
  
  action_verb_optimization:
    min_action_verbs: 15
    verb_diversity_target: 0.8
    impact_weighting: 0.4
    quantification_bonus: 0.2
  
  readability_optimization:
    target_reading_level: 8.0
    sentence_length_target: 15
    paragraph_length_target: 4
    clarity_score_threshold: 0.8

# Structural Optimization Parameters
structural_optimization:
  section_ordering:
    weight_relevance: 0.6
    weight_recency: 0.3
    weight_completeness: 0.1
  
  layout_optimization:
    whitespace_ratio: 0.15
    content_density: 0.7
    visual_hierarchy_score: 0.8
  
  length_optimization:
    target_page_count: 2
    max_page_count: 3
    content_density_target: 0.6

# ATS Optimization Parameters
ats_optimization:
  parsing_optimization:
    parsing_score_target: 0.95
    critical_block_weight: 0.5
    formatting_compliance_weight: 0.3
  
  keyword_alignment:
    job_description_matching: 0.8
    industry_keywords: 0.6
    skill_category_alignment: 0.7
  
  format_standardization:
    font_consistency_weight: 0.2
    spacing_standardization: 0.1
    section_header_compliance: 0.3

# Quality Score Weights
quality_weights:
  content_quality: 0.4
  ats_compliance: 0.3
  readability: 0.2
  formatting: 0.1

# Optimization Constraints
constraints:
  max_changes_per_iteration: 10
  preserve_original_meaning: true
  minimum_quality_threshold: 0.7
  maximum_processing_time: 120  # seconds

# Performance Parameters
performance:
  parallel_processing: true
  cache_optimization_results: true
  incremental_optimization: true
  early_stopping_enabled: true

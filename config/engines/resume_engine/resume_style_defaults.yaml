# Resume Engine Style Defaults Configuration
# Default formatting, styling, and presentation parameters

# Style Framework
style_defaults:
  default_template: modern
  professional_tone: true
  industry_specific: true
  customization_level: medium

# Typography Settings
typography:
  primary_font: Arial
  secondary_font: Calibri
  font_size:
    header: 14
    subheader: 12
    body: 11
    contact: 10
  line_spacing: 1.15
  paragraph_spacing: 6

# Color Scheme
colors:
  text_color: "#000000"
  header_color: "#000000"
  accent_color: "#333333"
  link_color: "#0066CC"
  background_color: "#FFFFFF"

# Layout Settings
layout:
  page_margins:
    top: 0.5
    bottom: 0.5
    left: 0.75
    right: 0.75
  
  section_spacing:
    before: 12
    after: 6
  
  column_layout: single
  alignment: left
  justification: left

# Section Styling
sections:
  header:
    name_size: 16
    name_bold: true
    contact_info_size: 10
    divider_line: false
  
  summary:
    title: "Professional Summary"
    max_length: 300
    paragraph_count: 3
  
  experience:
    title: "Professional Experience"
    bullet_style: round
    date_alignment: right
    company_bold: true
    title_italic: false
  
  education:
    title: "Education"
    degree_bold: true
    institution_italic: false
    gpa_display_threshold: 3.5
  
  skills:
    title: "Skills"
    grouping: true
    max_groups: 4
    skills_per_group: 10

# Content Style Guidelines
content_style:
  tone: professional
  voice: active
  perspective: first_person
  tense: past_for_experience
  
  bullet_point_style:
    start_with_action_verb: true
    include_metrics: true
    max_length: 2_lines
    parallel_structure: true

# Industry-Specific Styles
industry_styles:
  technology:
    template: modern
    skills_emphasis: high
    projects_section: true
  
  finance:
    template: classic
    conservative_style: true
    certifications_prominence: high
  
  healthcare:
    template: professional
    licenses_section: true
    formal_tone: true
  
  creative:
    template: modern
    portfolio_link: true
    visual_elements: minimal

# Quality Standards
quality_standards:
  grammar_score_threshold: 0.9
  readability_score_target: 8.0
  consistency_check: true
  formatting_validation: strict

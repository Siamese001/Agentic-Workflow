# Outreach Engine Cadence Rules Configuration
# Follow-up timing, frequency, and sequence management

# Cadence Framework
cadence_framework:
  enabled: true
  default_strategy: balanced
  adaptive_timing: true
  response_based_adjustment: true

# Follow-up Sequences
sequences:
  standard_sequence:
    initial_contact: day_0
    first_follow_up: day_3
    second_follow_up: day_7
    third_follow_up: day_14
    max_attempts: 4
  
  aggressive_sequence:
    initial_contact: day_0
    first_follow_up: day_2
    second_follow_up: day_5
    third_follow_up: day_10
    max_attempts: 4
  
  conservative_sequence:
    initial_contact: day_0
    first_follow_up: day_5
    second_follow_up: day_12
    third_follow_up: day_21
    max_attempts: 4
  
  networking_sequence:
    initial_contact: day_0
    follow_up: day_7
    max_attempts: 2

# Timing Rules
timing_rules:
  sending_windows:
    weekday:
      morning: {start: "09:00", end: "11:00", priority: high}
      afternoon: {start: "14:00", end: "16:00", priority: medium}
    weekend:
      morning: {start: "10:00", end: "12:00", priority: low}
      afternoon: {start: "14:00", end: "15:00", priority: low}
  
  timezone_handling:
    recipient_timezone: true
    local_sending: preferred
    business_hours_only: true

# Frequency Limits
frequency_limits:
  per_contact:
    max_messages_per_week: 2
    min_days_between_messages: 2
    max_messages_per_month: 4
  
  per_campaign:
    max_messages_per_day: 50
    max_messages_per_hour: 20
    batch_size: 10

# Response-Based Adjustments
response_adjustments:
  positive_response:
    next_action: move_to_conversation
    follow_up_paused: true
    success_flagged: true
  
  negative_response:
    next_action: close_campaign
    follow_up_paused: true
    respect_requested: true
  
  no_response:
    continue_sequence: true
    escalate_urgency: false
    final_attempt: day_21

# Content Variation Rules
content_variation:
  follow_up_types:
    first_follow_up: value_addition
    second_follow_up: new_insight
    third_follow_up: final_opportunity
  
  variation_required: true
  template_reuse_limit: 1
  personalization_increase: 0.1

# Quality Control for Cadence
quality_control:
  spam_prevention:
    max_similar_messages: 3
    repetition_threshold: 0.3
    spam_score_limit: 0.1
  
  compliance_rules:
    gdpr_consent: true
    unsubscribe_option: true
    commercial_disclosure: false

# Performance Metrics
performance_metrics:
  response_rate_tracking: true
  optimal_timing_learning: false
  sequence_effectiveness: true
  cadence_optimization: false

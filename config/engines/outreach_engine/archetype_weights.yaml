# Outreach Engine Archetype Weights Configuration
# Contact archetype classification and weighting system

# Archetype Framework
archetype_framework:
  enabled: true
  classification_method: rule_based
  dynamic_weighting: true
  confidence_threshold: 0.7

# Primary Contact Archetypes
primary_archetypes:
  decision_maker:
    weight: 0.4
    characteristics:
      - senior_leadership
      - budget_authority
      - hiring_influence
    outreach_priority: high
    personalization_level: deep
  
  influencer:
    weight: 0.3
    characteristics:
      - team_leadership
      - technical_expertise
      - cross_functional_influence
    outreach_priority: medium_high
    personalization_level: moderate
  
  gatekeeper:
    weight: 0.2
    characteristics:
      - administrative_role
      - screening_responsibility
      - access_control
    outreach_priority: medium
    personalization_level: surface
  
  peer:
    weight: 0.1
    characteristics:
      - similar_level
      - collaborative_role
      - networking_potential
    outreach_priority: low
    personalization_level: casual

# Industry-Specific Archetypes
industry_archetypes:
  technology:
    engineering_manager:
      weight: 0.35
      focus: technical_skills
      communication_style: direct
      preferred_content: technical_achievements
    
    product_manager:
      weight: 0.30
      focus: business_impact
      communication_style: results_oriented
      preferred_content: product_outcomes
    
    recruiter:
      weight: 0.20
      focus: qualifications_match
      communication_style: structured
      preferred_content: skills_experience
    
    executive:
      weight: 0.15
      focus: strategic_value
      communication_style: concise
      preferred_content: business_impact
  
  finance:
    portfolio_manager:
      weight: 0.40
      focus: financial_performance
      communication_style: formal
      preferred_content: quantifiable_results
    
    analyst:
      weight: 0.35
      focus: analytical_skills
      communication_style: detailed
      preferred_content: technical_expertise
    
  healthcare:
    clinical_director:
      weight: 0.45
      focus: patient_outcomes
      communication_style: empathetic
      preferred_content: healthcare_impact
    
    researcher:
      weight: 0.30
      focus: research_skills
      communication_style: academic
      preferred_content: scientific_contributions

# Seniority-Based Weighting
seniority_weights:
  executive_level:
    base_weight: 1.0
    priority_multiplier: 1.5
    response_expectation: low
    follow_up_strategy: conservative
  
  senior_level:
    base_weight: 0.8
    priority_multiplier: 1.2
    response_expectation: medium
    follow_up_strategy: standard
  
  mid_level:
    base_weight: 0.6
    priority_multiplier: 1.0
    response_expectation: high
    follow_up_strategy: balanced
  
  entry_level:
    base_weight: 0.4
    priority_multiplier: 0.8
    response_expectation: high
    follow_up_strategy: networking

# Engagement Scoring
engagement_scoring:
  high_engagement:
    score_range: 0.8-1.0
    characteristics:
      - recent_activity
      - open_to_opportunities
      - network_growth
    outreach_frequency: normal
  
  medium_engagement:
    score_range: 0.5-0.8
    characteristics:
      - moderate_activity
      - selective_engagement
      - stable_network
    outreach_frequency: reduced
  
  low_engagement:
    score_range: 0.0-0.5
    characteristics:
      - minimal_activity
      - passive_profile
      - limited_network
    outreach_frequency: minimal

# Dynamic Weight Adjustment Rules
dynamic_rules:
  response_history:
    positive_responses: weight_increase_0.2
    no_responses: weight_decrease_0.1
    negative_responses: weight_decrease_0.3
  
  market_conditions:
    high_demand: weight_increase_0.1
    low_demand: weight_decrease_0.1
    seasonal_adjustments: true

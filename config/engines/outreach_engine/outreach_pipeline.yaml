# Outreach Engine Pipeline Configuration
# Outreach campaign workflow and processing parameters

# Pipeline Framework
outreach_pipeline:
  enabled: true
  max_concurrent_campaigns: 5
  processing_timeout: 600  # seconds
  batch_processing: true

# Pipeline Stages
stages:
  research_stage:
    enabled: true
    timeout: 120  # seconds
    max_companies_per_batch: 10
    research_depth: comprehensive
    data_sources:
      - company_website
      - linkedin
      - industry_databases
      - news_articles
  
  contact_identification:
    enabled: true
    timeout: 90  # seconds
    max_contacts_per_company: 5
    contact_criteria:
      - job_title_relevance
      - seniority_level
      - department_match
      - recent_activity
  
  message_crafting:
    enabled: true
    timeout: 60  # seconds
    personalization_level: high
    message_length_target: 300
    tone: professional
  
  quality_validation:
    enabled: true
    timeout: 30  # seconds
    checks:
      - grammar_spelling
      - tone_appropriateness
      - personalization_quality
      - compliance_rules
  
  delivery_scheduling:
    enabled: true
    timezone_aware: true
    sending_windows:
      - start: "09:00"
        end: "11:00"
      - start: "14:00"
        end: "16:00"
    max_messages_per_hour: 20

# Campaign Configuration
campaign_config:
  default_duration: 30  # days
  max_messages_per_campaign: 100
  follow_up_sequence: true
  max_follow_ups: 3
  
  follow_up_intervals:
    first_follow_up: 3  # days
    second_follow_up: 7  # days
    third_follow_up: 14  # days

# Quality Control Parameters
quality_control:
  min_personalization_score: 0.7
  max_repetition_rate: 0.2
  grammar_threshold: 0.9
  compliance_check: strict
  
  rejection_criteria:
    - spam_indicators
    - inappropriate_content
    - poor_personalization
    - compliance_violations

# Performance Metrics
performance_metrics:
  response_rate_target: 0.15
  engagement_rate_target: 0.25
  conversion_rate_target: 0.05
  
  tracking:
    open_tracking: true
    click_tracking: true
    response_tracking: true
    bounce_tracking: true

# Integration Settings
integrations:
  email_providers:
    - gmail
    - outlook
    - sendgrid
  
  crm_systems:
    - salesforce
    - hubspot
    - pipedrive
  
  analytics:
    - google_analytics
    - custom_dashboard

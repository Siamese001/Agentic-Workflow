[tool:pytest]
asyncio_mode = auto
testpaths = tests/unit tests/features tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude deprecated tests from execution
norecursedirs = tests/deprecated .git .tox dist build *.egg __pycache__ .pytest_cache

# Test markers for categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    end_to_end: End-to-end workflow tests
    security: Security-related tests
    kg: Knowledge graph tests
    retrieval: Retrieval and RAG tests
    prompts: Prompt system tests
    agents: Agent component tests
    l1: L1 Planning layer tests
    l2: L2 Execution layer tests
    l3: L3 Orchestration layer tests
    l4: L4 State & Memory layer tests
    l5: L5 Safety & Policy layer tests
    slow: Tests that take longer to run
    external: Tests requiring external dependencies
    deprecated: Deprecated tests that should not be run

# Minimum version requirement
minversion = 6.0

# Test discovery settings
addopts = --strict-markers --strict-config --verbose --tb=short --durations=10

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings (if coverage plugin is used)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Parallel execution (if xdist plugin is available)
# addopts = -n auto

# Timeout settings (if timeout plugin is available)
# timeout = 300
# timeout_method = thread

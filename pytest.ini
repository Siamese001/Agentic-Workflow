# Pytest configuration for Windsurf
[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Console output
addopts = -v --tb=short

# Disable warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Coverage configuration (if coverage is installed)
# --cov=agentic_core
# --cov-report=term-missing

# Async configuration
asyncio_mode = auto

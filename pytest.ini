[pytest]

###############################################
# MARKERS (zero-loss preserved)
###############################################
markers =
    functional: core agent logic tests
    mock: placeholder/stub detection
    architecture: design pattern compliance
    design: doc vs code validation
    integration: full orchestration pipeline
    data: data transformation and enrichment
    contract: schema and SLA enforcement
    regression: historical consistency
    performance: SLA and latency validation
    asyncio: asynchronous test harness

###############################################
# GLOBAL PYTEST OPTIONS (zero-loss preserved)
###############################################
addopts = -ra --tb=short --maxfail=3

###############################################
# TEST DISCOVERY ROOT (PRODUCTION = tests_flat)
###############################################
testpaths =
    tests/v10_7
    tests/v10_8
    tests/shared

###############################################
# TEST FILE PATTERN (zero-loss preserved)
###############################################
python_files = test_*.py


[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude deprecated tests from execution
norecursedirs = tests/deprecated .git .tox dist build *.egg __pycache__ .pytest_cache

# Test markers for categorization
markers =
    # Layer markers
    l1: mark tests as L1 planning layer tests
    l2: mark tests as L2 execution layer tests
    l3: mark tests as L3 orchestration layer tests
    l4: mark tests as L4 memory/state layer tests
    l5: mark tests as L5 safety/policy layer tests
    
    # Test type markers
    unit: mark tests as unit tests
    integration: mark tests as integration tests
    end_to_end: mark tests as end-to-end tests
    golden: mark tests as golden evaluation tests
    observability: mark tests as observability tests
    stress: mark tests as stress and load tests
    evaluation: mark tests as evaluation tests
    shared: mark tests as shared utility tests
    fixture: mark tests as fixture validation tests
    
    # Component markers
    planning: mark tests related to planning functionality
    execution: mark tests related to execution functionality
    orchestration: mark tests related to orchestration functionality
    memory: mark tests related to memory functionality
    safety: mark tests related to safety functionality
    policy: mark tests related to policy functionality
    
    # Test strategy markers
    vertical_slice: mark tests as vertical slice tests
    performance: mark tests as performance tests
    regression: mark tests as regression tests
    slow: Tests that take longer to run
    external: Tests requiring external dependencies
    deprecated: Deprecated tests that should not be run
    asyncio: Async tests

# Minimum version requirement
minversion = 6.0

# Test discovery settings
# addopts = --strict-markers --strict-config --verbose --tb=short --durations=10

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings (if coverage plugin is used)
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Parallel execution (if xdist plugin is available)
# addopts = -n auto

# Timeout settings (if timeout plugin is available)
# timeout = 300
# timeout_method = thread

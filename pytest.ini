[pytest]
# Core path semantics configuration
minversion = 6.0

# Test discovery paths
testpaths = tests

# File and pattern discovery
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Path exclusion patterns
norecursedirs = .* build dist CVS _darcs {arch} *.egg __pycache__ .pytest_cache

# Execution semantics
addopts = --strict-markers --strict-config --tb=short -v --continue-on-collection-errors -n 32 --dist=load --timeout=180

# Standard markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    unit_min_deps: marks tests with minimal dependencies
    sovereign_hardening: marks sovereign hardening tests
    guardian: marks guardian tests
    manual: Manual verification tests that create temporary violations
    serial: Tests that must run serially (shared Redis state, not xdist-safe)
    e2e: marks end-to-end tests
    hardening: marks hardening tests
    aggressive: marks aggressive tests
    ssot: marks SSOT tests

[pytest]
# Pytest configuration for Canon Validator Engine test suite

# CRITICAL: Add root to pythonpath to eliminate sys.path hacks in tests
pythonpath = .

# Test discovery
# Phase 2.10.3: Restored original design - unit_min_deps are structural audits (marker-based)
# Authoritative suite: tests/integration/agentic_core (functional tests) - runs by default
# Structural audit suite: tests/unit_min_deps + tests/integration/agentic_core (for marker discovery)
# Default pytest -q runs integration_full_deps + governance (via conftest hook)
testpaths =
    tests/unit_min_deps
    tests/integration/agentic_core
    tests/agentic_core
    tests/enforcement
    tests/governance
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude directories from test discovery
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    archives
    __pycache__
    .pytest_cache
    .mypy_cache
    .venv
    venv
    env
    ENV
    env.bak
    venv.bak
    _quarantine
    apps_rg
    apps_lic
    apps_shared
    ops_scripts
    data
    docs

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --durations=10
    --ignore=tests/integration/agentic_core/test_imports_no_mro_error.py

# Markers
markers =
    asyncio: Async tests (pytest-asyncio)
    autonomy: Agent autonomy and decision-making tests
    boot: Boot sequence validation tests
    compliance: Compliance validation tests
    constitutional: Constitutional rule enforcement tests
    dashboard: Dashboard integration tests
    e2e: End-to-end tests
    functional: Functional & Compliance tests (L1/L2)
    governance: Governance & Resilience tests (L3/L4/L5)
    guardian: Architectural integrity checks
    import_safety: Import safety and dependency validation tests
    integration: Integration tests across all layers
    integration_full_deps: Integration tests requiring full deps (pydantic/redis/requests)
    manual: Manual verification tests that create temporary violations
    mro: Method Resolution Order integrity tests
    playwright: Playwright browser automation tests
    security: Security & Edge Case tests (L1-L5)
    slow: Tests that take longer to run
    ssot: Single Source of Truth compliance tests
    tool_use: Tool-Use & LLM Logic tests (L1/L5)
    unit: Unit tests for individual components
    unit_min_deps: Unit/contract tests that run without optional deps (pydantic/redis/requests)

# Minimum version
minversion = 6.0

# Test session configuration (requires pytest-timeout if uncommented)
# timeout = 300
# timeout_method = thread

# Coverage configuration (if used)
# addopts = --cov=canon_validator --cov-report=html --cov-report=term-missing

# Parallel execution (if using pytest-xdist)
# addopts = -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

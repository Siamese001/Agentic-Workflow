[tool:pytest]
# Pytest configuration for Canon Validator Engine test suite

# CRITICAL: Add root to pythonpath to eliminate sys.path hacks in tests
pythonpath = .

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude directories from test discovery
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    archives
    __pycache__
    .pytest_cache
    .mypy_cache
    .venv
    venv
    env
    ENV
    env.bak
    venv.bak

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    functional: Functional & Compliance tests (L1/L2)
    tool_use: Tool-Use & LLM Logic tests (L1/L5)
    governance: Governance & Resilience tests (L3/L4/L5)
    security: Security & Edge Case tests (L1-L5)
    integration: Integration tests across all layers
    slow: Tests that take longer to run
    unit: Unit tests for individual components
    e2e: End-to-end tests
    guardian: Architectural integrity checks
    manual: Manual verification tests that create temporary violations
    unit_min_deps: Unit/contract tests that run without optional deps (pydantic/redis/requests)
    integration_full_deps: Integration tests requiring full deps (pydantic/redis/requests)

# Minimum version
minversion = 6.0

# Test session configuration
timeout = 300
timeout_method = thread

# Coverage configuration (if used)
# addopts = --cov=canon_validator --cov-report=html --cov-report=term-missing

# Parallel execution (if using pytest-xdist)
# addopts = -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

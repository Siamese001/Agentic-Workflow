# apps_eval spine manifest — FORMAL EXCEPTION
#
# apps_eval is permanently exempt from the generic spine substrate
# (GovernedAppRunner) because routing eval through evaluate_and_emit
# (L5/L6) would create a circular evaluation-of-evaluator loop. The
# empty required-contract set is therefore justified by a recorded
# exception charter, not by absence of a runtime path.
#
# This manifest is the load-bearing static evidence for the
# FORMAL_EXCEPTION_STATIC_EVIDENCE classification. The compensating-
# controls list mirrors what `GovernedEvalException.check_compensating_controls()`
# verifies at runtime; the exception_reason_code mirrors
# `GovernedEvalException.EXCEPTION_REASON_CODE`.
#
# Format: docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md §"Manifest shape for formal exceptions"

schema_version: 1
app: apps_eval

claimed_routes:
  - type: evaluator_only
    description: >-
      apps_eval IS the platform's evaluation surface. It scores other
      apps' SealedArtifact / ExitReviewPacket outputs and emits
      EvaluationMetric / RegressionDetector results. Wrapping eval in
      the spine's evaluate_and_emit would create a circular
      evaluation-of-evaluator loop. apps_eval therefore takes the
      formal-exception path: structured BUS T telemetry + conformance
      metadata + compensating controls, but no L0/L1/C0/L2/L5/L6 generic
      spine wrapping.

exception:
  reason_code: circular_dependency
  exception_record_class: GovernedEvalException
  exception_record_module: apps_eval.integrations.governed_eval_exception
  exception_record_dataclass: EvalExceptionRecord
  blocked_layers:
    - L0
    - L1
    - C0
    - L2
    - L5
    - L6
  safe_layers:
    - BUS_T_telemetry
    - conformance_metadata
  compensating_controls:
    - "CC-EVAL-01: eval runs emit standard telemetry without calling evaluate_and_emit"
    - "CC-EVAL-02: get_exception_record() exposes machine-readable ExceptionRecord"
    - "CC-EVAL-03: module import guard — no L6 circularity triggered on import"
    - "CC-EVAL-04: exception reviewed and re-certified annually by eval-platform team"
  review_cadence: annual
  owner: eval-platform team
  target_phase: "N/A — permanent exception"

notes:
  - "No ValidatedRequest wrapper required; no app-code migration in this pass."
  - "The eval framework remains structurally exempt; this manifest only formalizes the existing exception so the scanner can verify it statically."
  - "Compensating-controls list mirrors GovernedEvalException.COMPENSATING_CONTROLS as of 2026-04-30."


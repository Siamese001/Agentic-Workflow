# apps_eval L0 route registry.
#
# apps_eval is a SINGLE_STEP evaluation app — no managed workflow, no
# retry/branch/join logic. L3 runtime orchestration is correctly bypassed
# per the e2e proof spec. Uses deterministic fixture-backed C0 grounding
# and deterministic prompt-template assembly.

app_name: apps_eval
schema_version: "apps_eval.route_registry/v1"

routes:
  - route_id: apps_eval.single_step_v1
    execution_form: SINGLE_STEP
    l3_required: false
    selected_capability: apps_eval.evaluation_v1
    description: >-
      Deterministic single-step evaluation: intake -> retrieve evidence ->
      assemble prompt -> evaluate -> seal. No retries, branches, or joins.
      L3 runtime orchestration is not required.
    bypass_reason_when_invoked: SINGLE_STEP_ROUTE

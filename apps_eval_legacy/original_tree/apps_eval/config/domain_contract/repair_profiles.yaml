# apps_eval repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.3
repair_profile_id: rp::apps_eval::eval_self::v1
app_id: apps_eval
version: 1.0.0
status: active
source_app_config_ref: apps_eval/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: retry_on_taxonomy_misclassification
    stage_id: classification
    trigger_condition: score_below_threshold:taxonomy_accuracy:0.9
    recovery_action: retry_with_backoff:2
    rollback_target: classification
    healing_trigger: taxonomy_accuracy
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 1

  - scenario_id: retry_on_threshold_drift
    stage_id: threshold_check
    trigger_condition: score_below_threshold:threshold_stability:0.85
    recovery_action: retry_with_expanded_context:calibration_data
    rollback_target: threshold_check
    healing_trigger: threshold_stability
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 2

  - scenario_id: retry_on_low_rubric_coverage
    stage_id: eval_orchestration
    trigger_condition: score_below_threshold:rubric_coverage:0.8
    recovery_action: retry_with_backoff:2
    rollback_target: eval_orchestration
    healing_trigger: rubric_coverage
    escalation_path: mark_partial_pass
    max_attempts: 2
    priority: 3

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 4

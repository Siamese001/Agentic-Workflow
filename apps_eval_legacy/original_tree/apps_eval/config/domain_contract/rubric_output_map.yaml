# apps_eval rubric output map — declarative L2-receipt -> dim_scores extractor.
#
# Plan: apps-runtime-domain-enforcement-a7e9d4 W2.P3 (2026-05-03).
# Closes W2 (the last of 8 runtime apps).
# Consumed by apps_shared.cert.rubric_output_mapper.map_l2_receipt_to_dim_scores
# inside apps_eval/__main__.py::_run_live_cert after governed_run seals.
#
# Sibling to:
#   - apps_eval/config/domain_contract/eval_rubrics.yaml (6 self-rubric dims)
#   - apps_eval/config/cert_route_registry.yaml (declares this file's path)
#   - apps_eval/config/domain_contract/grader_roster.yaml (hybrid dim grader)
#
# Design rule: apps_eval's self-rubric is dominated by deterministic
# disciplines (rubric_consistency, taxonomy_correctness, threshold_alignment,
# no_self_contradiction, reporting_completeness). Only 1 hybrid dim
# (grader_calibration) routes to a judge. The bootstrap is intentionally
# mundane: apps_eval gets scored by the same Exit pipeline every other
# app gets scored by — no recursion, no self-referential evaluation.
#
# Cert-path live run is currently a SINGLE_STEP symbolic pipeline
# (governed_run marks stages "ok" but no real scorecard emitted), so
# deterministic dim_scores default to 0.0 -> UNKNOWN -> fail-closed per
# evidence_required=true on taxonomy_correctness + no_self_contradiction.
# Correct enforcement posture.

mapper_id: apps_eval.eval_self.v1
app_id: apps_eval
rubric_id: "aer::apps_eval::eval_self::v1"
version: "1.0.0"
status: active

dimensions:
  # ---- deterministic dims (all 5) ----
  - dimension_id: rubric_consistency
    score:
      type: jsonpath
      path: $.output.rubric_consistency.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.rubric_dedup_check"
      - jsonpath: $.output.rubric_consistency.duplicate_dim_ids
        prefix: "dup:"
      - jsonpath: $.output.rubric_consistency.contradictory_dim_ids
        prefix: "contradiction:"

  - dimension_id: taxonomy_correctness
    score:
      type: jsonpath
      path: $.output.taxonomy_correctness.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.capability_vs_regression_classifier"
      - jsonpath: $.output.taxonomy_correctness.misclassified_test_ids
        prefix: "misclass:"

  - dimension_id: threshold_alignment
    score:
      type: jsonpath
      path: $.output.threshold_alignment.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.eval_thresholds_yaml_match"
      - jsonpath: $.output.threshold_alignment.misaligned_dims
        prefix: "misaligned:"

  - dimension_id: no_self_contradiction
    score:
      type: jsonpath
      path: $.output.self_contradiction_check.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.cross_judge_consistency"
      - jsonpath: $.output.self_contradiction_check.contradicting_judge_pairs
        prefix: "pair:"

  - dimension_id: reporting_completeness
    score:
      type: all_present
      paths:
        - $.output.scorecard.app_id
        - $.output.scorecard.dim_scores
        - $.output.scorecard.evidence_refs
        - $.output.scorecard.verdict
      default: 0.0
    evidence:
      - literal: "grader=deterministic.scorecard_field_presence"
      - template: "scorecard_fields_present={$.output.scorecard.complete}"

  # ---- hybrid dims (judge-resolved, no YAML score) ----
  # grader_calibration (hybrid) -> grader_roster.yaml
  # Intentionally omitted — AppSpecificEvaluator calls its registered grader
  # (hybrid = deterministic Spearman vs human-labeled holdout + judge overlay).

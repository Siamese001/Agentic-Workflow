# =====================================================================
# stub_definition.yaml — CANONICAL STUB SPECIFICATION (Pre-Flight 0.4)
# =====================================================================
# 
# This file defines the rules for classifying Python modules as stubs
# vs high-signal modules. Used by Phase 3A stub scanner.
#
# Version: 1.0
# Created: SUPER-PROMPT v3.2 Pre-Flight 0.4
# =====================================================================

# ---------------------------------------------------------------------
# 1. STUB PATTERNS
# ---------------------------------------------------------------------
# A file is classified as a STUB if ANY of these conditions are met:
stub_patterns:
  # Files with only comments/whitespace (no executable code)
  empty_or_whitespace_only: true
  
  # AST contains only Pass / Ellipsis / docstring nodes
  ast_only_pass_ellipsis_docstring: true
  
  # Placeholder markers in file content (case-insensitive)
  placeholder_markers:
    - "STUB"
    - "TODO"
    - "TBD"
    - "PHASE1"
    - "REPAIR"
    - "PLACEHOLDER"
    - "NOT_IMPLEMENTED"
    - "FIXME"
  
  # Empty function/class bodies (only pass/ellipsis/docstring)
  empty_function_body: true
  empty_class_body: true
  
  # Files with fewer than N non-comment tokens
  min_token_threshold: 10

# ---------------------------------------------------------------------
# 2. HIGH-SIGNAL MODULE DEFINITION
# ---------------------------------------------------------------------
# A module is HIGH-SIGNAL if ANY of these conditions are met:
high_signal_definition:
  # AST contains ≥1 class/function with ≥1 executable statement
  has_executable_class_or_function: true
  
  # File has ≥120 non-comment tokens
  min_non_comment_tokens: 120
  
  # Contains actual implementation (not just type hints or imports)
  has_implementation_statements: true

# ---------------------------------------------------------------------
# 3. ALLOWLIST — MINIMAL BUT VALID MODULES
# ---------------------------------------------------------------------
# These modules are allowed to be minimal (e.g., __init__.py files)
# and should NOT be flagged as stubs even if they appear empty.
allowlist_minimal_modules:
  - "__init__.py"
  - "*.pyi"
  - "py.typed"
  - "conftest.py"
  - "setup.py"
  - "pyproject.toml"

# Namespace packages (intentionally empty __init__.py)
namespace_package_markers:
  - "__init__.py"

# ---------------------------------------------------------------------
# 4. EXEMPT DOMAINS
# ---------------------------------------------------------------------
# These domains/paths are exempt from stub detection entirely.
exempt_domains:
  - "shared_engine_ops"
  - "06_data"
  - "10_tests"

# Additional exempt paths (glob patterns)
exempt_paths:
  - "**/archive/**"
  - "**/backup/**"
  - "**/deprecated/**"
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"

# ---------------------------------------------------------------------
# 5. META EXEMPTIONS
# ---------------------------------------------------------------------
# Paths marked with meta.immutable: true are automatically exempt
meta_exempt_rules:
  respect_immutable_flag: true
  respect_stub_exempt_entries: true

# ---------------------------------------------------------------------
# 6. CLASSIFICATION THRESHOLDS
# ---------------------------------------------------------------------
classification_thresholds:
  # Confidence threshold for stub classification
  stub_confidence_threshold: 0.8
  
  # Confidence threshold for high-signal classification
  high_signal_confidence_threshold: 0.7
  
  # Minimum AST node count for non-stub
  min_ast_nodes: 3

# ---------------------------------------------------------------------
# 7. STUB SCANNER CONFIGURATION
# ---------------------------------------------------------------------
scanner_config:
  # Domains to scan (excludes exempt domains)
  target_domains:
    - "01_agentic_core"
    - "02_schemas"
    - "03_runtime"
    - "04_prompt_governance"
    - "05_config"
    - "07_observability"
    - "08_scripts"
    - "09_apps"
  
  # Output location for audit results
  output_path: "06_data/semantic_cache/meta/phase03_stub_audit.json"
  
  # File extensions to scan
  file_extensions:
    - ".py"
  
  # Maximum file size to scan (bytes)
  max_file_size: 1048576  # 1MB

# ---------------------------------------------------------------------
# 8. VERSION INFO
# ---------------------------------------------------------------------
meta:
  version: "1.0"
  schema_version: "v3.2"
  created_by: "SUPER-PROMPT Pre-Flight 0.4"
  description: >
    Canonical stub specification for Phase 3A stub scanner.
    Defines patterns for identifying stub vs high-signal modules.

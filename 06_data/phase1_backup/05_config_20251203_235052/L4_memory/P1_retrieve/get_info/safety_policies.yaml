# L5 Safety Policies Configuration
# Comprehensive safety framework and risk management policies

# Safety Policy Framework
safety_policy:
  enabled: true
  enforcement_mode: strict
  safety_level: high
  audit_frequency: 300  # seconds

# Risk Assessment Policies
risk_assessment:
  max_risk_score: 0.8
  risk_categories:
    content_safety: 0.4
    privacy_protection: 0.3
    operational_safety: 0.2
    legal_compliance: 0.1
  
  assessment_frequency:
    real_time: true
    batch_processing: 60  # seconds
    deep_analysis: 3600  # seconds

# Content Safety Policies
content_safety:
  toxicity_threshold: 0.2
  profanity_threshold: 0.1
  hate_speech_threshold: 0.05
  misinformation_threshold: 0.3
  
  content_filters:
    inappropriate_language: true
    harmful_content: true
    biased_content: true
    sensitive_topics: true
  
  moderation_actions:
    low_risk: warn
    medium_risk: flag
    high_risk: block
    critical_risk: escalate

# Privacy Protection Policies
privacy_protection:
  pii_detection:
    enabled: true
    scan_all_content: true
    confidence_threshold: 0.8
  
  data_masking:
    ssn: true
    email: true
    phone: true
    address: true
    financial_data: true
    medical_data: true
  
  retention_policies:
    user_data: 2592000  # 30 days
    sensitive_data: 86400  # 24 hours
    audit_logs: 7776000  # 90 days

# Operational Safety Policies
operational_safety:
  resource_limits:
    max_memory_per_request: 512  # MB
    max_processing_time: 300  # seconds
    max_api_calls_per_minute: 60
  
  error_handling:
    max_retry_attempts: 3
    error_rate_threshold: 0.1
    circuit_breaker_threshold: 5
  
  availability:
    uptime_requirement: 0.99
  failover_enabled: true
  disaster_recovery: true

# Legal Compliance Policies
legal_compliance:
  gdpr:
    data_portability: true
    right_to_deletion: true
    consent_management: true
    data_protection_officer: true
  
  ccpa:
    data_disclosure: true
    opt_out_required: true
    data_minimization: true
  
  industry_specific:
    hipaa: false
    sox: false
    pci_dss: false

# Safety Monitoring
monitoring:
  real_time_scanning: true
  anomaly_detection: true
  incident_logging: true
  compliance_reporting: true
  
  alert_thresholds:
    safety_violation: immediate
    privacy_breach: immediate
    performance_degradation: 5 minutes
    compliance_issue: 1 hour

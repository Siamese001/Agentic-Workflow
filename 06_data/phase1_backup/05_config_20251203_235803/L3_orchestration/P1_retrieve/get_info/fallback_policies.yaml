# L3 Fallback Policies Configuration
# Fallback strategies and contingency planning for orchestration

# Fallback Policy Framework
fallback_policy:
  enabled: true
  automatic_fallback: true
  fallback_timeout: 300  # seconds
  max_fallback_depth: 3

# Fallback Triggers
triggers:
  primary_failure:
    - timeout_exceeded
    - api_service_unavailable
    - resource_exhausted
    - quality_threshold_miss
  
  secondary_failure:
    - retry_limit_exceeded
    - cost_budget_exceeded
    - safety_violation
    - validation_failure
  
  emergency_failure:
    - system_crash
    - data_corruption
    - security_breach
    - critical_error

# Fallback Strategies by Component
component_strategies:
  model_fallback:
    primary_model: "gpt-4"
    fallback_models:
      - "gpt-4-turbo"
      - "claude-3-sonnet"
      - "gpt-3.5-turbo"
    quality_threshold: 0.7
    cost_threshold: 2.0
  
  service_fallback:
    primary_service: "openai"
    fallback_services:
      - "anthropic"
      - "local_model"
    retry_before_fallback: 3
    health_check_interval: 60
  
  workflow_fallback:
    resume_processing:
      fallback_workflow: "simplified_resume"
      timeout_reduction: 0.5
      quality_adjustment: -0.1
    
    outreach_campaign:
      fallback_workflow: "basic_outreach"
      message_simplification: true
      research_depth: shallow

# Fallback Actions
actions:
  degrade_quality:
    enabled: true
    quality_reduction: 0.2
    user_notification: true
  
  extend_timeout:
    enabled: true
    timeout_multiplier: 1.5
    max_extension: 300  # seconds
  
  reduce_scope:
    enabled: true
    scope_reduction: 0.3
    feature_disable: ["advanced_analysis", "deep_personalization"]
  
  use_cache:
    enabled: true
    cache_fallback_only: true
    freshness_requirement: 7  # days

# Fallback Recovery
recovery:
  auto_recovery: true
  recovery_interval: 600  # seconds
  max_recovery_attempts: 5
  recovery_threshold: 0.8
  
  recovery_strategies:
    - service_restart
    - cache_clear
    - resource_reallocation
    - model_switch

# User Experience During Fallback
user_experience:
  transparent_fallback: true
  progress_indicators: true
  quality_notifications: true
  alternative_options: true

# Monitoring and Logging
monitoring:
  log_fallback_events: true
  track_fallback_success_rate: true
  fallback_performance_metrics: true
  alert_on_fallback_chain: true

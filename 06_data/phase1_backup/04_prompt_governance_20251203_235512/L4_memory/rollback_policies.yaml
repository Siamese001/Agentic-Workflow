# L3 Cost Budget Policies Configuration
# Budget management and cost control policies for orchestration

# Budget Policy Framework
budget_policy:
  enabled: true
  enforcement_mode: strict
  budget_currency: USD
  tracking_precision: 4

# Budget Categories
categories:
  session_budget:
    default_limit: 1.00
    maximum_limit: 10.00
    warning_threshold: 0.8
    hard_limit: 0.95
  
  operation_budget:
    research:
      limit: 0.10
      warning_threshold: 0.7
    generation:
      limit: 0.05
      warning_threshold: 0.8
    analysis:
      limit: 0.03
      warning_threshold: 0.9
    validation:
      limit: 0.01
      warning_threshold: 0.8
  
  user_budget:
    daily_limit: 5.00
    weekly_limit: 25.00
    monthly_limit: 100.00
    
  workflow_budget:
    resume_processing:
      limit: 0.50
      breakdown:
        planning: 0.10
        execution: 0.30
        validation: 0.10
    
    outreach_campaign:
      limit: 0.75
      breakdown:
        research: 0.20
        generation: 0.40
        validation: 0.15

# Cost Allocation Rules
allocation_rules:
  prioritize_critical_operations: true
  enable_cost_sharing: false
  budget_rollover: false
  emergency_budget: 0.10

# Enforcement Policies
enforcement:
  soft_limits:
    action: warn
    continue_allowed: true
    notification_required: true
  
  hard_limits:
    action: stop
    continue_allowed: false
    escalation_required: true
  
  budget_exhaustion:
    action: immediate_stop
    cleanup_required: true
    notification_level: critical

# Cost Optimization Policies
optimization:
  enable_smart_routing: true
  prefer_cheaper_models: true
  cache_expensive_operations: true
  batch_similar_requests: true
  
  model_selection:
    cost_sensitivity: 0.8
    quality_threshold: 0.7
    fallback_enabled: true

# Monitoring and Reporting
monitoring:
  real_time_tracking: true
  cost_projections: true
  budget_alerts: true
  reporting_interval: 300  # seconds
  
  alerts:
    warning_threshold: 0.8
    critical_threshold: 0.95
    cooldown_period: 300  # seconds

# Budget Recovery Policies
recovery:
  auto_recovery_enabled: true
  recovery_threshold: 0.5
  recovery_time_window: 3600  # seconds
  manual_override_required: false

# Metrics Configuration v1.0
# Prometheus-style metrics for Agentic Workflow System

metrics_config:
  version: "1.0"
  collection_interval: 15s
  
  # System metrics
  system_metrics:
    - name: "agent_cpu_usage"
      type: "gauge"
      description: "CPU usage percentage by agent"
      labels: ["agent_id", "layer"]
      
    - name: "agent_memory_usage"
      type: "gauge"
      description: "Memory usage in bytes by agent"
      labels: ["agent_id", "layer"]
      
    - name: "active_agents_total"
      type: "gauge"
      description: "Number of currently active agents"
      labels: ["layer"]
      
  # Business metrics
  business_metrics:
    - name: "resumes_processed_total"
      type: "counter"
      description: "Total number of resumes processed"
      labels: ["status", "quality_score_range"]
      
    - name: "outreach_messages_sent_total"
      type: "counter"
      description: "Total outreach messages sent"
      labels: ["channel", "archetype", "status"]
      
    - name: "job_descriptions_parsed_total"
      type: "counter"
      description: "Total job descriptions parsed"
      labels: ["industry", "complexity"]
      
  # Performance metrics
  performance_metrics:
    - name: "request_duration_seconds"
      type: "histogram"
      description: "Request processing duration"
      buckets: [0.1, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
      labels: ["endpoint", "method", "layer"]
      
    - name: "model_inference_duration"
      type: "histogram"
      description: "ML model inference duration"
      buckets: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0, 5.0]
      labels: ["model_name", "layer"]
      
  # Cost metrics
  cost_metrics:
    - name: "token_usage_total"
      type: "counter"
      description: "Total tokens consumed"
      labels: ["model", "operation", "layer"]
      
    - name: "api_cost_usd"
      type: "counter"
      description: "Total API cost in USD"
      labels: ["provider", "model", "operation"]
      
    - name: "cost_per_resume"
      type: "gauge"
      description: "Average cost per resume processed"
      labels: ["quality_tier"]

# Metric collection rules
collection_rules:
  sampling_rate: 1.0
  retention_days: 90
  aggregation_rules:
    - pattern: "*_duration_seconds"
      aggregations: ["avg", "p95", "p99"]
      window: "5m"
      
    - pattern: "*_total"
      aggregations: ["rate", "increase"]
      window: "1m"

# Export configuration
export_config:
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    
  datadog:
    enabled: false
    api_key: "${DATADOG_API_KEY}"
    site: "datadoghq.com"

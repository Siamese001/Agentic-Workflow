# Events Configuration v1.0
# Business events tracking for Agentic Workflow System

events_config:
  version: "1.0"
  enabled: true
  
  # Event categories
  categories:
    business_events:
      resume_processing:
        - name: "resume_submitted"
          description: "User submitted a resume for processing"
          attributes:
            - "user_id"
            - "resume_id"
            - "processing_tier"
            - "submission_timestamp"
            
        - name: "resume_processed"
          description: "Resume processing completed"
          attributes:
            - "resume_id"
            - "processing_duration_ms"
            - "quality_score"
            - "extraction_confidence"
            - "ats_compliance_score"
            
        - name: "resume_failed"
          description: "Resume processing failed"
          attributes:
            - "resume_id"
            - "error_type"
            - "error_message"
            - "failure_stage"
            - "retry_count"
            
      outreach_generation:
        - name: "outreach_initiated"
          description: "Outreach message generation started"
          attributes:
            - "campaign_id"
            - "target_profile_id"
            - "message_type"
            - "personalization_level"
            
        - name: "outreach_generated"
          description: "Outreach message generated successfully"
          attributes:
            - "campaign_id"
            - "message_id"
            - "generation_duration_ms"
            - "quality_score"
            - "personalization_score"
            
        - name: "outreach_sent"
          description: "Outreach message sent to target"
          attributes:
            - "message_id"
            - "channel"
            - "recipient_id"
            - "send_timestamp"
            
        - name: "outreach_responded"
          description: "Target responded to outreach message"
          attributes:
            - "message_id"
            - "response_type"
            - "response_timestamp"
            - "engagement_score"
            
      job_analysis:
        - name: "job_description_parsed"
          description: "Job description parsing completed"
          attributes:
            - "job_id"
            - "parsing_duration_ms"
            - "industry_detected"
            - "seniority_level"
            - "skill_count"
            
        - name: "candidate_matched"
          description: "Candidate matching completed for job"
          attributes:
            - "job_id"
            - "candidate_count"
            - "matching_algorithm"
            - "match_score_threshold"
            - "processing_duration_ms"

    system_events:
      agent_lifecycle:
        - name: "agent_started"
          description: "Agent process started"
          attributes:
            - "agent_id"
            - "agent_type"
            - "layer"
            - "start_timestamp"
            - "configuration_version"
            
        - name: "agent_stopped"
          description: "Agent process stopped"
          attributes:
            - "agent_id"
            - "stop_reason"
            - "uptime_duration_ms"
            - "total_operations"
            
        - name: "agent_failed"
          description: "Agent process failed"
          attributes:
            - "agent_id"
            - "failure_type"
            - "error_message"
            - "stack_trace"
            - "restart_attempted"
            
      resource_management:
        - name: "resource_threshold_exceeded"
          description: "Resource usage exceeded threshold"
          attributes:
            - "resource_type"
            - "current_value"
            - "threshold_value"
            - "instance_id"
            - "duration_ms"
            
        - name: "scaling_event"
          description: "Auto-scaling event occurred"
          attributes:
            - "scaling_direction"
            - "instance_count_before"
            - "instance_count_after"
            - "trigger_metric"
            - "scaling_reason"

    security_events:
      authentication:
        - name: "login_attempt"
          description: "User login attempt"
          attributes:
            - "user_id"
            - "login_method"
            - "success"
            - "ip_address"
            - "user_agent"
            - "failure_reason"
            
        - name: "permission_denied"
          description: "Access permission denied"
          attributes:
            - "user_id"
            - "resource_type"
            - "resource_id"
            - "required_permission"
            - "attempted_action"
            
      data_access:
        - name: "sensitive_data_accessed"
          description: "Sensitive data was accessed"
          attributes:
            - "user_id"
            - "data_type"
            - "access_reason"
            - "record_count"
            - "compliance_flag"

  # Event processing rules
  processing_rules:
    # Real-time events
    real_time:
      - pattern: "agent_*"
        processing: "immediate"
        retention: "7d"
        
      - pattern: "outreach_*"
        processing: "immediate"
        retention: "30d"
        
    # Batch processed events
    batch:
      - pattern: "resume_*"
        processing: "batch_5m"
        retention: "90d"
        
      - pattern: "job_*"
        processing: "batch_15m"
        retention: "90d"

  # Event enrichment
  enrichment:
    geo_location:
      enabled: true
      sources: ["ip_address"]
      attributes: ["country", "city", "region"]
      
    user_context:
      enabled: true
      sources: ["user_id"]
      attributes: ["user_tier", "organization", "role"]
      
    system_context:
      enabled: true
      attributes: ["environment", "version", "deployment_id"]

  # Event aggregation
  aggregation:
    # Count aggregations
    counts:
      - metric: "resume_processing_rate"
        event_pattern: "resume_processed"
        time_window: "5m"
        group_by: ["processing_tier"]
        
      - metric: "outreach_success_rate"
        event_pattern: "outreach_responded"
        time_window: "1h"
        group_by: ["channel", "message_type"]
        
    # Duration aggregations
    durations:
      - metric: "avg_processing_time"
        event_pattern: "resume_processed"
        attribute: "processing_duration_ms"
        time_window: "5m"
        
      - metric: "p95_generation_time"
        event_pattern: "outreach_generated"
        attribute: "generation_duration_ms"
        time_window: "1h"

  # Event storage
  storage:
    primary:
      type: "elasticsearch"
      index_pattern: "agentic-events-%Y.%m.%d"
      retention: "90d"
      
    archive:
      type: "s3"
      bucket: "agentic-events-archive"
      format: "parquet"
      retention: "1y"

  # Event monitoring
  monitoring:
    # Event volume alerts
    volume_alerts:
      - metric: "events_per_second"
        threshold: 1000
        window: "1m"
        
      - metric: "error_event_rate"
        threshold: 0.05
        window: "5m"
        
    # Schema validation
    schema_validation:
      enabled: true
      strict_mode: false
      unknown_fields: "warn"

# Sampling Rules Configuration v1.0
# Intelligent sampling for metrics, traces, and events

sampling_rules:
  version: "1.0"
  enabled: true
  
  # Global sampling settings
  global_settings:
    default_sample_rate: 1.0  # 100% sampling in development
    max_sample_rate: 1.0
    min_sample_rate: 0.001  # 0.1% minimum
    
  # Environment-specific sampling
  environments:
    development:
      metrics_sample_rate: 1.0
      traces_sample_rate: 1.0
      events_sample_rate: 1.0
      
    staging:
      metrics_sample_rate: 0.5
      traces_sample_rate: 0.1
      events_sample_rate: 0.5
      
    production:
      metrics_sample_rate: 0.1
      traces_sample_rate: 0.01
      events_sample_rate: 0.1

  # Metrics sampling rules
  metrics_sampling:
    high_frequency_metrics:
      - pattern: "agent_cpu_usage"
        sample_rate: 0.1
        aggregation: "avg"
        
      - pattern: "agent_memory_usage"
        sample_rate: 0.1
        aggregation: "avg"
        
      - pattern: "request_duration_seconds"
        sample_rate: 0.5
        aggregation: "histogram"
        
    business_metrics:
      - pattern: "resumes_processed_total"
        sample_rate: 1.0  # Always sample business counters
        
      - pattern: "outreach_messages_sent_total"
        sample_rate: 1.0
        
      - pattern: "api_cost_usd"
        sample_rate: 1.0  # Always sample cost metrics
        
    system_metrics:
      - pattern: "active_agents_total"
        sample_rate: 0.5
        
      - pattern: "token_usage_total"
        sample_rate: 0.2

  # Trace sampling rules
  traces_sampling:
    # High-priority operations
    critical_operations:
      - service_pattern: "agentic-workflow"
        operation_pattern: "resume_processing"
        sample_rate: 1.0
        
      - service_pattern: "agentic-workflow"
        operation_pattern: "outreach_generation"
        sample_rate: 0.5
        
      - service_pattern: "agentic-workflow"
        operation_pattern: "job_analysis"
        sample_rate: 0.3
        
    # Error traces
    error_sampling:
      - error_pattern: "*"
        sample_rate: 1.0  # Always sample errors
        
      - status_code_pattern: "5*"
        sample_rate: 1.0
        
    # Slow traces
    duration_sampling:
      - min_duration_ms: 5000
        sample_rate: 1.0  # Always sample slow operations
        
      - min_duration_ms: 1000
        sample_rate: 0.5
        
    # Layer-specific sampling
    layer_sampling:
      - layer: "L1"
        sample_rate: 0.01  # Low sampling for planning
        
      - layer: "L2"
        sample_rate: 0.1   # Medium sampling for execution
        
      - layer: "L3"
        sample_rate: 0.05  # Low-medium sampling for orchestration
        
      - layer: "L4"
        sample_rate: 0.01  # Low sampling for memory
        
      - layer: "L5"
        sample_rate: 0.01  # Low sampling for safety

  # Event sampling rules
  events_sampling:
    business_events:
      - event_pattern: "resume_*"
        sample_rate: 1.0  # Always sample resume events
        
      - event_pattern: "outreach_*"
        sample_rate: 0.8
        
      - event_pattern: "job_*"
        sample_rate: 0.5
        
    system_events:
      - event_pattern: "agent_*"
        sample_rate: 0.1
        
      - event_pattern: "resource_*"
        sample_rate: 0.05
        
    security_events:
      - event_pattern: "login_*"
        sample_rate: 1.0  # Always sample security events
        
      - event_pattern: "permission_*"
        sample_rate: 1.0
        
      - event_pattern: "sensitive_*"
        sample_rate: 1.0

  # Adaptive sampling
  adaptive_sampling:
    enabled: true
    target_throughput:
      metrics_per_second: 1000
      traces_per_second: 100
      events_per_second: 500
      
    adjustment_factor: 0.1  # 10% adjustment per cycle
    adjustment_interval: "5m"
    
    # Load-based sampling
    load_based:
      enabled: true
      cpu_threshold: 80.0
      memory_threshold: 85.0
      reduction_factor: 0.5

  # Sampling strategies
  strategies:
    # Probabilistic sampling
    probabilistic:
      enabled: true
      algorithm: "reservoir"
      
    # Rate limiting
    rate_limiting:
      enabled: true
      max_samples_per_second: 1000
      
    # Consistent sampling
    consistent:
      enabled: true
      hash_function: "murmur3"
      salt: "agentic-workflow-sampling"

  # Sampling overrides
  overrides:
    # Debug mode
    debug_mode:
      enabled: false
      sample_rate: 1.0
      conditions:
        - "debug_header_present"
        - "debug_query_param"
        
    # High-traffic periods
    high_traffic:
      enabled: true
      detection_window: "5m"
      threshold_multiplier: 2.0
      sample_rate_reduction: 0.5
      
    # Cost optimization
    cost_optimization:
      enabled: true
      daily_budget: 100.0  # USD
      current_spend_threshold: 0.8
      sample_rate_reduction: 0.3

  # Sampling quality metrics
  quality_metrics:
    enabled: true
    track:
      - "sampling_effectiveness"
      - "sample_accuracy"
      - "coverage_percentage"
      - "cost_savings"
      
    reporting:
      interval: "1h"
      dashboard: "sampling-quality"

  # Sampling governance
  governance:
    # Approval required for sampling changes
    approval_required: false
    
    # Sampling audit trail
    audit_trail:
      enabled: true
      retention: "90d"
      
    # Compliance requirements
    compliance:
      gdpr:
        pii_sample_rate: 0.0  # Never sample PII
        anonymization_required: true
        
      hipaa:
        phi_sample_rate: 0.0  # Never sample PHI
        encryption_required: true

# Storage Backends Configuration v1.0
# Storage backend configurations for observability data

storage_backends:
  version: "1.0"
  enabled: true
  
  # Metrics storage
  metrics:
    prometheus:
      enabled: true
      type: "prometheus"
      config:
        address: "prometheus:9090"
        scrape_interval: "15s"
        scrape_timeout: "10s"
        retention: "30d"
        
      # Storage settings
      storage:
        type: "local"
        path: "/data/prometheus"
        wal_compression: true
        
      # Performance tuning
      performance:
        max_samples_per_series: 1000000
        max_series_per_metric: 100000
        
    # Remote storage for long-term metrics
    remote_storage:
      enabled: true
      type: "cortex"
      config:
        address: "cortex:9009"
        tenant_id: "agentic-workflow"
        
      # Write settings
      write:
        enabled: true
        batch_size: 1000
        batch_timeout: "5s"
        
      # Read settings
      read:
        enabled: true
        timeout: "30s"
        
  # Traces storage
  traces:
    jaeger:
      enabled: true
      type: "jaeger"
      config:
        collector:
          address: "jaeger-collector:14250"
          
        # Storage configuration
        storage:
          type: "elasticsearch"
          config:
            addresses: ["elasticsearch:9200"]
            index_prefix: "jaeger"
            
        # Sampling configuration
        sampling:
          type: "probabilistic"
          param: 0.1
          
    # Alternative trace storage
    tempo:
      enabled: false
      type: "tempo"
      config:
        address: "tempo:3200"
        
      # Storage settings
      storage:
        type: "s3"
        config:
          bucket: "observability-traces"
          endpoint: "s3.amazonaws.com"
          
  # Events storage
  events:
    elasticsearch:
      enabled: true
      type: "elasticsearch"
      config:
        addresses: ["elasticsearch:9200"]
        index_template: "agentic-events-%Y.%m.%d"
        
      # Index settings
      index_settings:
        number_of_shards: 3
        number_of_replicas: 1
        refresh_interval: "5s"
        
      # Lifecycle management
      lifecycle:
        hot_phase:
          actions:
            rollover:
              max_size: "10GB"
              max_age: "1d"
              
        warm_phase:
          min_age: "7d"
          actions:
            allocate:
              number_of_replicas: 0
              
        cold_phase:
          min_age: "30d"
          actions:
            allocate:
              number_of_replicas: 0
              
        delete_phase:
          min_age: "90d"
          
  # Logs storage
  logs:
    loki:
      enabled: true
      type: "loki"
      config:
        address: "loki:3100"
        
      # Storage configuration
      storage:
        type: "s3"
        config:
          bucket: "observability-logs"
          endpoint: "s3.amazonaws.com"
          
      # Index settings
      index:
        period: "24h"
        prefix: "agentic-logs"
        
      # Retention
      retention:
        default: "30d"
        delete_delay: "24h"
        
  # Archive storage
  archive:
    s3:
      enabled: true
      type: "s3"
      config:
        bucket: "observability-archive"
        region: "us-east-1"
        
      # Lifecycle rules
      lifecycle:
        rules:
          - id: "archive_to_glacier"
            status: "Enabled"
            transitions:
              - days: 30
                storage_class: "GLACIER"
              - days: 90
                storage_class: "DEEP_ARCHIVE"
                
          - id: "delete_old_data"
            status: "Enabled"
            expiration:
              days: 2555  # 7 years
              
  # Backup storage
  backup:
    # Database backups
    database:
      enabled: true
      type: "postgresql"
      config:
        connection_string: "postgresql://user:pass@postgres:5432/observability"
        
      # Backup settings
      backup:
        schedule: "0 2 * * *"  # Daily at 2 AM
        retention: "30d"
        compression: true
        
    # Configuration backups
    configuration:
      enabled: true
      type: "git"
      config:
        repository: "https://github.com/company/observability-config"
        branch: "main"
        
      # Backup settings
      backup:
        schedule: "0 */6 * * *"  # Every 6 hours
        commit_message: "Automated backup from observability system"

  # Performance optimization
  performance:
    # Connection pooling
    connection_pooling:
      enabled: true
      max_connections: 100
      max_idle_connections: 10
      
    # Caching
    caching:
      enabled: true
      type: "redis"
      config:
        address: "redis:6379"
        ttl: "1h"
        
    # Compression
    compression:
      enabled: true
      algorithms:
        - type: "gzip"
          for_data: ["logs", "events"]
          
        - type: "snappy"
          for_data: ["metrics", "traces"]

  # High availability
  high_availability:
    # Replication
    replication:
      enabled: true
      factor: 3
      
    # Failover
    failover:
      enabled: true
      strategy: "automatic"
      health_check_interval: "30s"
      
    # Load balancing
    load_balancing:
      enabled: true
      algorithm: "round_robin"

  # Security
  security:
    # Encryption
    encryption:
      enabled: true
      at_rest: true
      in_transit: true
      
    # Authentication
    authentication:
      enabled: true
      type: "oauth2"
      
    # Authorization
    authorization:
      enabled: true
      rbac: true

  # Monitoring
  monitoring:
    # Storage metrics
    metrics:
      - name: "storage_usage_bytes"
        type: "gauge"
        
      - name: "storage_operations_total"
        type: "counter"
        
      - name: "storage_operation_duration_seconds"
        type: "histogram"
        
    # Health checks
    health_checks:
      - name: "storage_backend_health"
        interval: "30s"
        timeout: "10s"

  # Environment-specific settings
  environments:
    development:
      storage_type: "local"
      retention: "7d"
      
    staging:
      storage_type: "cloud"
      retention: "30d"
      
    production:
      storage_type: "cloud"
      retention: "90d"
      replication: true

# Tool Latency Dashboard Configuration v1.0
# Grafana-style dashboard for tool performance and latency monitoring

dashboard:
  version: "1.0"
  title: "Agentic Workflow - Tool Latency"
  description: "Tool performance metrics, latency analysis, and bottleneck identification"
  
  # Dashboard metadata
  metadata:
    tags: ["agentic", "tool-latency", "performance", "bottlenecks"]
    refresh_interval: "30s"
    time_range: "last_1h"
    
  # Dashboard panels
  panels:
    # Tool Overview
    - title: "Active Tools"
      type: "stat"
      grid_pos: {"x": 0, "y": 0, "w": 8, "h": 8}
      targets:
        - expr: "count(count by (tool_name) (tool_requests_total))"
          legend_format: "Active Tools"
      field_config:
        defaults:
          unit: "short"
          thresholds:
            steps:
              - color: "green"
                value: 0
              - color: "yellow"
                value: 10
              - color: "red"
                value: 20
          
    - title: "Tool Request Rate"
      type: "graph"
      grid_pos: {"x": 8, "y": 0, "w": 8, "h": 8}
      targets:
        - expr: "sum by (tool_name) (rate(tool_requests_total[5m]))"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "reqps"
        
    - title: "Overall Tool Success Rate"
      type: "stat"
      grid_pos: {"x": 16, "y": 0, "w": 8, "h": 8}
      targets:
        - expr: "sum(tool_requests_total{status=\"success\"}) / sum(tool_requests_total) * 100"
          legend_format: "Success Rate (%)"
      field_config:
        defaults:
          unit: "percent"
          max: 100
          thresholds:
            steps:
              - color: "red"
                value: 0
              - color: "yellow"
                value: 90
              - color: "green"
                value: 95

    # Latency Analysis
    - title: "Tool Response Time ( P95)"
      type: "graph"
      grid_pos: {"x": 0, "y": 8, "w": 12, "h": 8}
      targets:
        - expr: "histogram_quantile(0.95, sum by (le, tool_name) (rate(tool_response_time_seconds_bucket[5m])))"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "seconds"
        
    - title: "Tool Response Time ( P99)"
      type: "graph"
      grid_pos: {"x": 12, "y": 8, "w": 12, "h": 8}
      targets:
        - expr: "histogram_quantile(0.99, sum by (le, tool_name) (rate(tool_response_time_seconds_bucket[5m])))"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "seconds"

    # Tool Categories
    - title: "Latency by Tool Category"
      type: "graph"
      grid_pos: {"x": 0, "y": 16, "w": 12, "h": 8}
      targets:
        - expr: "histogram_quantile(0.95, sum by (le, tool_category) (rate(tool_response_time_seconds_bucket[5m])))"
          legend_format: "{{tool_category}}"
      y_axes:
        - unit: "seconds"
        
    - title: "Tool Category Usage Distribution"
      type: "piechart"
      grid_pos: {"x": 12, "y": 16, "w": 12, "h": 8}
      targets:
        - expr: "sum by (tool_category) (tool_requests_total)"
          legend_format: "{{tool_category}}"

    # Performance Analysis
    - title: "Slowest Tools ( by P95)"
      type: "table"
      grid_pos: {"x": 0, "y": 24, "w": 12, "h": 8}
      targets:
        - expr: "topk(10, histogram_quantile(0.95, sum by (le, tool_name) (rate(tool_response_time_seconds_bucket[5m]))))"
          format: "table"
          transformations:
            - type: "organize"
              options:
                excludeByName: {"Time": true}
                indexByName: {}
                renameByName:
                  Value: "P95 Response Time (s)"
                  tool_name: "Tool"
        
    - title: "Tool Error Rate Analysis"
      type: "graph"
      grid_pos: {"x": 12, "y": 24, "w": 12, "h": 8}
      targets:
        - expr: "sum by (tool_name) (rate(tool_requests_total{status=\"error\"}[5m])) / sum by (tool_name) (rate(tool_requests_total[5m])) * 100"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "percent"

    # Bottleneck Detection
    - title: "Tool Bottleneck Score"
      type: "graph"
      grid_pos: {"x": 0, "y": 32, "w": 12, "h": 8}
      targets:
        - expr: "tool_bottleneck_score"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "short"
        
    - title: "Queue Depth by Tool"
      type: "graph"
      grid_pos: {"x": 12, "y": 32, "w": 12, "h": 8}
      targets:
        - expr: "tool_queue_depth"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "short"

    # Resource Usage
    - title: "Tool CPU Usage"
      type: "graph"
      grid_pos: {"x": 0, "y": 40, "w": 12, "h": 8}
      targets:
        - expr: "sum by (tool_name) (rate(tool_cpu_usage_seconds[5m]))"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "percent"
        
    - title: "Tool Memory Usage"
      type: "graph"
      grid_pos: {"x": 12, "y": 40, "w": 12, "h": 8}
      targets:
        - expr: "sum by (tool_name) (tool_memory_usage_bytes / 1024 / 1024)"
          legend_format: "{{tool_name}}"
      y_axes:
        - unit: "MB"

  # Dashboard variables
  variables:
    - name: "tool_name"
      type: "query"
      query: "label_values(tool_requests_total, tool_name)"
      include_all: true
      all_value: ".*"
      
    - name: "tool_category"
      type: "query"
      query: "label_values(tool_requests_total, tool_category)"
      include_all: true
      all_value: ".*"
      
    - name: "layer"
      type: "query"
      query: "label_values(tool_requests_total, layer)"
      include_all: true
      all_value: ".*"

  # Annotations
  annotations:
    - name: "Tool Performance Issues"
      datasource: "prometheus"
      expr: "tool_performance_degraded"
      icon_color: "red"
      
    - name: "Tool Configuration Changes"
      datasource: "prometheus"
      expr: "tool_config_changed"
      icon_color: "blue"

  # Dashboard links
  links:
    - title: "Tool Configuration"
      url: "/config/tools"
      
    - title: "Performance Optimization"
      url: "/optimization/tools"
      
    - title: "Bottleneck Analysis"
      url: "/analysis/bottlenecks"

  # Alert thresholds
  alert_thresholds:
    response_time_p95:
      warning: 2.0  # seconds
      critical: 5.0  # seconds
      
    response_time_p99:
      warning: 5.0  # seconds
      critical: 10.0  # seconds
      
    error_rate:
      warning: 5.0  # percent
      critical: 10.0  # percent
      
    queue_depth:
      warning: 50
      critical: 100
      
    bottleneck_score:
      warning: 7
      critical: 9

  # Time settings
  time:
    from: "now-1h"
    to: "now"
    
  # Refresh settings
  refresh: "30s"
  
  # Schema version
  schema_version: 37

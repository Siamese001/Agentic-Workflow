# Alert Routing Configuration v1.0
# Alert routing rules and policies for observability system

alert_routing:
  version: "1.0"
  enabled: true
  
  # Global routing configuration
  global_config:
    default_route: "general"
    evaluation_interval: "30s"
    evaluation_timeout: "10s"
    
  # Alert routing rules
  routing_rules:
    # System alerts
    system_alerts:
      name: "system_alerts"
      conditions:
        - alert_type: "system"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "ops_team"
        escalation: "ops_manager"
        
      timing:
        immediate: true
        business_hours_only: false
        
    # Performance alerts
    performance_alerts:
      name: "performance_alerts"
      conditions:
        - alert_type: "performance"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "dev_team"
        escalation: "tech_lead"
        
      timing:
        immediate: false
        business_hours_only: true
        
    # Business alerts
    business_alerts:
      name: "business_alerts"
      conditions:
        - alert_type: "business"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "product_team"
        escalation: "product_manager"
        
      timing:
        immediate: false
        business_hours_only: true
        
    # Cost alerts
    cost_alerts:
      name: "cost_alerts"
      conditions:
        - alert_type: "cost"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "finance_team"
        escalation: "finance_manager"
        
      timing:
        immediate: true
        business_hours_only: false
        
    # Safety alerts
    safety_alerts:
      name: "safety_alerts"
      conditions:
        - alert_type: "safety"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "safety_team"
        escalation: "safety_officer"
        
      timing:
        immediate: true
        business_hours_only: false
        
    # Security alerts
    security_alerts:
      name: "security_alerts"
      conditions:
        - alert_type: "security"
        - severity: ["warning", "critical"]
      
      routing:
        primary: "security_team"
        escalation: "security_officer"
        
      timing:
        immediate: true
        business_hours_only: false

  # Service-specific routing
  service_routing:
    resume_processing:
      primary_team: "resume_team"
      escalation_team: "resume_manager"
      oncall_rotation: true
      
    outreach_generation:
      primary_team: "outreach_team"
      escalation_team: "outreach_manager"
      oncall_rotation: true
      
    job_analysis:
      primary_team: "job_team"
      escalation_team: "job_manager"
      oncall_rotation: false

  # Severity-based routing
  severity_routing:
    critical:
      notification_channels: ["pagerduty", "slack", "email"]
      escalation_time: "5m"
      max_escalations: 3
      
    warning:
      notification_channels: ["slack", "email"]
      escalation_time: "30m"
      max_escalations: 2
      
    info:
      notification_channels: ["email"]
      escalation_time: "2h"
      max_escalations: 1

  # Time-based routing
  time_routing:
    business_hours:
      start: "09:00"
      end: "17:00"
      timezone: "UTC"
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      
      routing:
        non_critical: "primary_team"
        critical: "oncall_team"
        
    after_hours:
      routing:
        non_critical: "email_only"
        critical: "oncall_team"
        
    weekends:
      routing:
        all_alerts: "oncall_team"

  # Environment-based routing
  environment_routing:
    development:
      primary_recipient: "dev_team"
      escalation_enabled: false
      
    staging:
      primary_recipient: "ops_team"
      escalation_enabled: true
      
    production:
      primary_recipient: "oncall_team"
      escalation_enabled: true

  # Alert grouping
  grouping:
    default_group_by: ["alertname", "cluster", "service"]
    
    custom_grouping:
      system_alerts: ["instance", "alertname"]
      business_alerts: ["metric", "operation"]
      cost_alerts: ["cost_type", "service"]

  # Routing policies
  policies:
    # Suppression policies
    suppression:
      - name: "maintenance_suppression"
        condition: "maintenance_mode = true"
        duration: "6h"
        
      - name: "known_issue_suppression"
        condition: "known_issue = true"
        duration: "24h"
        
    # Rate limiting
    rate_limiting:
      - alert_type: "info"
        max_per_hour: 10
        
      - alert_type: "warning"
        max_per_hour: 20
        
      - alert_type: "critical"
        max_per_hour: 100

  # Notification templates
  templates:
    email:
      subject_template: "{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}"
      body_template: |
        Alert: {{ .GroupLabels.alertname }}
        Severity: {{ .GroupLabels.severity }}
        Service: {{ .GroupLabels.service }}
        
        {{ range .Alerts }}
        {{ .Annotations.summary }}
        {{ .Annotations.description }}
        {{ end }}
        
    slack:
      title_template: "{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}"
      color_template: "{{ if eq .Status \"firing\" }}danger{{ else }}good{{ end }}"
      
    pagerduty:
      severity_template: "{{ .GroupLabels.severity }}"

  # Routing metrics
  metrics:
    enabled: true
    track:
      - "routing_decisions_total"
      - "routing_duration_seconds"
      - "escalation_events_total"
      - "suppression_events_total"

# Error Thresholds Configuration v1.0
# Alert thresholds for Agentic Workflow System monitoring

error_thresholds:
  version: "1.0"
  enabled: true
  
  # System performance thresholds
  system_performance:
    cpu_usage:
      warning: 70.0
      critical: 85.0
      evaluation_period: "5m"
      
    memory_usage:
      warning: 75.0
      critical: 90.0
      evaluation_period: "5m"
      
    disk_usage:
      warning: 80.0
      critical: 95.0
      evaluation_period: "1m"
      
    network_latency:
      warning: 100.0  # ms
      critical: 500.0  # ms
      evaluation_period: "2m"

  # Application performance thresholds
  application_performance:
    request_duration:
      warning_p95: 2000.0  # ms
      critical_p95: 5000.0  # ms
      evaluation_period: "5m"
      
    error_rate:
      warning: 0.05  # 5%
      critical: 0.10  # 10%
      evaluation_period: "5m"
      
    throughput:
      warning_min: 10.0  # req/s
      critical_min: 5.0  # req/s
      evaluation_period: "2m"

  # Business metrics thresholds
  business_metrics:
    resume_processing:
      success_rate_warning: 0.95
      success_rate_critical: 0.90
      processing_time_warning: 30.0  # seconds
      processing_time_critical: 60.0  # seconds
      
    outreach_generation:
      response_rate_warning: 0.05
      response_rate_critical: 0.02
      generation_time_warning: 10.0  # seconds
      generation_time_critical: 30.0  # seconds

  # Cost monitoring thresholds
  cost_monitoring:
    hourly_spend:
      warning: 50.0  # USD
      critical: 100.0  # USD
      
    daily_spend:
      warning: 500.0  # USD
      critical: 1000.0  # USD
      
    cost_per_operation:
      resume_processing_warning: 0.20  # USD
      resume_processing_critical: 0.50  # USD
      outreach_generation_warning: 0.10  # USD
      outreach_generation_critical: 0.25  # USD

  # Agent-specific thresholds
  agent_health:
    active_agents:
      min_warning: 1
      min_critical: 0
      evaluation_period: "1m"
      
    agent_response_time:
      warning: 5000.0  # ms
      critical: 15000.0  # ms
      evaluation_period: "2m"
      
    agent_failure_rate:
      warning: 0.10  # 10%
      critical: 0.20  # 20%
      evaluation_period: "5m"

  # External service thresholds
  external_services:
    api_response_time:
      openai_warning: 5000.0  # ms
      openai_critical: 15000.0  # ms
      anthropic_warning: 5000.0  # ms
      anthropic_critical: 15000.0  # ms
      
    api_error_rate:
      warning: 0.05  # 5%
      critical: 0.15  # 15%
      evaluation_period: "5m"

  # Data quality thresholds
  data_quality:
    parsing_success_rate:
      resume_warning: 0.95
      resume_critical: 0.90
      job_description_warning: 0.95
      job_description_critical: 0.90
      
    data_validation_errors:
      warning_rate: 0.02  # 2%
      critical_rate: 0.05  # 5%
      evaluation_period: "10m"

  # Security thresholds
  security:
    authentication_failures:
      warning_rate: 0.01  # 1%
      critical_rate: 0.05  # 5%
      evaluation_period: "5m"
      
    authorization_failures:
      warning_rate: 0.005  # 0.5%
      critical_rate: 0.02  # 2%
      evaluation_period: "5m"

  # Threshold evaluation rules
  evaluation_rules:
    # Minimum number of data points required for evaluation
    min_data_points: 3
    
    # How many consecutive violations before alerting
    consecutive_violations:
      warning: 2
      critical: 1
      
    # Time window for evaluation
    evaluation_window: "5m"
    
    # Alert cooldown period
    alert_cooldown: "15m"

  # Threshold adjustment rules
  auto_adjustment:
    enabled: true
    learning_period: "7d"
    adjustment_factor: 0.1  # 10% adjustment
    
    # Conditions for auto-adjustment
    conditions:
      - "stable_metrics_for_24h"
      - "no_alerts_in_last_24h"
      - "business_hours_only"

  # Environment-specific overrides
  environments:
    development:
      cpu_usage_warning: 80.0
      cpu_usage_critical: 90.0
      error_rate_warning: 0.10
      error_rate_critical: 0.20
      
    staging:
      cpu_usage_warning: 75.0
      cpu_usage_critical: 85.0
      error_rate_warning: 0.07
      error_rate_critical: 0.15
      
    production:
      cpu_usage_warning: 70.0
      cpu_usage_critical: 85.0
      error_rate_warning: 0.05
      error_rate_critical: 0.10

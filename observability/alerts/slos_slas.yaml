# Service Level Objectives (SLOs) and SLAs Configuration v1.0
# Performance targets for Agentic Workflow System

slos_slas:
  version: "1.0"
  enabled: true
  
  # Service Level Objectives
  service_level_objectives:
    # Availability SLOs
    availability:
      overall:
        target: 99.9  # 99.9% uptime
        time_window: "30d"
        error_budget: 0.001  # 0.1% error budget
        
      critical_endpoints:
        resume_processing:
          target: 99.95
          time_window: "30d"
          
        outreach_generation:
          target: 99.9
          time_window: "30d"
          
        job_analysis:
          target: 99.85
          time_window: "30d"

    # Performance SLOs
    performance:
      request_latency:
        api_endpoints:
          p50_target: 100.0  # ms
          p95_target: 500.0  # ms
          p99_target: 2000.0  # ms
          time_window: "7d"
          
        processing_operations:
          resume_processing_p95: 5000.0  # ms
          outreach_generation_p95: 3000.0  # ms
          job_analysis_p95: 8000.0  # ms
          time_window: "7d"

      throughput:
        resume_processing:
          target: 10.0  # resumes/second
          time_window: "1h"
          
        outreach_generation:
          target: 20.0  # messages/second
          time_window: "1h"

    # Quality SLOs
    quality:
      processing_success_rate:
        resume_parsing: 0.98
        job_description_parsing: 0.98
        outreach_generation: 0.95
        time_window: "24h"
        
      data_accuracy:
        resume_extraction_accuracy: 0.95
        skill_matching_accuracy: 0.90
        time_window: "7d"

    # Cost SLOs
    cost_efficiency:
      cost_per_operation:
        resume_processing_max: 0.25  # USD
        outreach_generation_max: 0.15  # USD
        job_analysis_max: 0.30  # USD
        time_window: "24h"
        
      monthly_spend_target:
        target: 2000.0  # USD
        time_window: "30d"

  # Service Level Agreements
  service_level_agreements:
    # Internal SLAs
    internal:
      response_time:
        critical_issues: "1h"
        high_priority: "4h"
        normal_priority: "24h"
        
      resolution_time:
        critical_issues: "4h"
        high_priority: "1d"
        normal_priority: "3d"

    # External SLAs (if applicable)
    external:
      availability_guarantee: 99.5
      support_response: "2h"
      compensation_terms:
        outage_below_99: "10% credit"
        outage_below_95: "25% credit"
        outage_below_90: "50% credit"

  # SLO Monitoring and Alerting
  monitoring:
    # Burn rate alerts
    burn_rate_alerts:
      fast_burn: "consumes 50% of error budget in 2 days"
      slow_burn: "consumes 50% of error budget in 7 days"
      
    # SLO status indicators
    status_indicators:
      healthy: "error budget usage < 25%"
      warning: "error budget usage 25-50%"
      critical: "error budget usage 50-75%"
      breached: "error budget usage > 75%"

  # SLO Calculation Methods
  calculation_methods:
    availability:
      method: "success_count / total_count"
      good_events: "http_responses{status!~\"5..\"}"
      total_events: "http_responses"
      
    latency:
      method: "histogram_quantile"
      aggregation: "rate(http_request_duration_seconds_bucket[5m])"
      
    error_rate:
      method: "error_count / total_count"
      error_events: "http_responses{status=~\"5..\"}"

  # SLO Reporting
  reporting:
    # Dashboard requirements
    dashboards:
      - "SLO Overview"
      - "Error Budget Burn Rate"
      - "SLO Trend Analysis"
      
    # Report schedules
    schedules:
      daily_summary: "06:00 UTC"
      weekly_report: "Monday 08:00 UTC"
      monthly_review: "First day of month 09:00 UTC"
      
    # Stakeholder notifications
    notifications:
      slack_channel: "#slo-reports"
      email_recipients: ["stakeholders@company.com"]

  # SLO Adjustment Rules
  adjustment_rules:
    # When to adjust SLOs
    adjustment_triggers:
      - "consistent_performance_above_target_for_30d"
      - "business_requirements_change"
      - "infrastructure_upgrade"
      
    # Adjustment process
    adjustment_process:
      proposal_required: true
      stakeholder_approval: true
      communication_required: true
      rollout_period: "7d"

  # Environment-specific SLOs
  environments:
    development:
      availability_target: 95.0
      latency_p95_target: 2000.0  # ms
      
    staging:
      availability_target: 99.0
      latency_p95_target: 1000.0  # ms
      
    production:
      availability_target: 99.9
      latency_p95_target: 500.0  # ms

  # SLO Compliance Tracking
  compliance_tracking:
    # Historical data retention
    retention_period: "2y"
    
    # Compliance scoring
    scoring_method: "weighted_average"
    weights:
      availability: 0.4
      performance: 0.3
      quality: 0.2
      cost: 0.1

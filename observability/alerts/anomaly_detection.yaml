# Anomaly Detection Configuration v1.0
# ML-based anomaly detection for Agentic Workflow System

anomaly_detection:
  version: "1.0"
  enabled: true
  
  # Detection algorithms
  algorithms:
    statistical:
      enabled: true
      methods:
        - name: "z_score"
          threshold: 3.0
          window_size: 100
          
        - name: "iqr"
          multiplier: 1.5
          window_size: 50
          
    ml_based:
      enabled: true
      models:
        - name: "isolation_forest"
          contamination: 0.1
          n_estimators: 100
          
        - name: "local_outlier_factor"
          n_neighbors: 20
          contamination: 0.1

  # Metrics to monitor for anomalies
  monitored_metrics:
    system_metrics:
      - metric: "agent_cpu_usage"
        algorithm: "z_score"
        threshold: 80.0
        severity: "warning"
        
      - metric: "agent_memory_usage"
        algorithm: "iqr"
        threshold: 90.0
        severity: "critical"
        
      - metric: "request_duration_seconds"
        algorithm: "isolation_forest"
        threshold_percentile: 95
        severity: "warning"
        
    business_metrics:
      - metric: "resumes_processed_total"
        algorithm: "statistical"
        threshold_deviation: 50.0  # 50% deviation
        severity: "warning"
        
      - metric: "outreach_response_rate"
        algorithm: "z_score"
        threshold: 2.0
        severity: "critical"
        
    cost_metrics:
      - metric: "api_cost_usd"
        algorithm: "iqr"
        threshold_multiplier: 2.0
        severity: "critical"
        
      - metric: "cost_per_resume"
        algorithm: "statistical"
        threshold_increase: 100.0  # 100% increase
        severity: "warning"

  # Detection windows and intervals
  detection_windows:
    # How often to run anomaly detection
    check_interval: "5m"
    
    # Historical data window for training
    training_window: "24h"
    
    # Minimum data points required for detection
    min_data_points: 30
    
    # Seasonality patterns to consider
    seasonality:
      enabled: true
      patterns:
        - "daily"
        - "weekly"
        - "monthly"

  # Alert configuration
  alerts:
    # Alert severity levels
    severity_levels:
      info:
        color: "blue"
        escalation_delay: "1h"
        
      warning:
        color: "yellow"
        escalation_delay: "30m"
        
      critical:
        color: "red"
        escalation_delay: "10m"
        
    # Alert channels
    channels:
      slack:
        enabled: true
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        mention_users: ["@ops-team"]
        
      email:
        enabled: true
        smtp_server: "${SMTP_SERVER}"
        recipients:
          critical: ["ops-team@company.com"]
          warning: ["dev-team@company.com"]
          info: ["dashboard@company.com"]
          
      pagerduty:
        enabled: false
        service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity_mapping:
          critical: "critical"
          warning: "warning"
          info: "info"

  # Anomaly patterns
  patterns:
    # Spike detection
    spike:
      enabled: true
      threshold_multiplier: 3.0
      min_duration: "1m"
      
    # Drop detection
    drop:
      enabled: true
      threshold_multiplier: 0.5
      min_duration: "5m"
      
    # Trend detection
    trend:
      enabled: true
      trend_window: "1h"
      slope_threshold: 0.1
      
    # Plateau detection
    plateau:
      enabled: true
      plateau_duration: "30m"
      variance_threshold: 0.01

  # False positive reduction
  false_positive_reduction:
    # Minimum confidence score
    min_confidence: 0.7
    
    # Correlation with other anomalies
    require_correlation: false
    
    # Historical false positive patterns
    known_false_positives:
      - pattern: "weekend_dip"
        time_window: "Saturday 00:00 - Sunday 23:59"
        metrics: ["resumes_processed_total"]
        
      - pattern: "maintenance_window"
        time_window: "Sunday 02:00 - 04:00"
        metrics: ["*"]

  # Learning and adaptation
  learning:
    # Enable online learning
    online_learning: true
    
    # Model retraining interval
    retrain_interval: "7d"
    
    # Feedback mechanism
    feedback:
      enabled: true
      collect_user_feedback: true
      auto_adjust_thresholds: true

  # Performance optimization
  performance:
    # Maximum concurrent anomaly detection jobs
    max_concurrent_jobs: 5
    
    # Cache configuration
    cache:
      enabled: true
      ttl: "10m"
      max_size: 1000
      
    # Resource limits
    resources:
      max_memory_mb: 512
      max_cpu_percent: 50

  # Integration with other systems
  integrations:
    # Metrics backend
    prometheus:
      enabled: true
      query_timeout: "30s"
      
    # Logging system
    logging:
      enabled: true
      log_level: "info"
      
    # Configuration management
    config:
      reload_interval: "5m"
      validate_config: true

# Escalation Policies Configuration v1.0
# Alert escalation policies and procedures for observability system

escalation_policies:
  version: "1.0"
  enabled: true
  
  # Global escalation settings
  global_settings:
    default_escalation_timeout: "30m"
    max_escalation_levels: 5
    auto_escalation_enabled: true
    
  # Escalation chains
  escalation_chains:
    # System operations escalation
    system_operations:
      name: "System Operations Escalation"
      description: "Escalation chain for system-related alerts"
      
      levels:
        - level: 1
          team: "ops_team"
          timeout: "15m"
          notification_channels: ["slack", "email"]
          
        - level: 2
          team: "ops_manager"
          timeout: "30m"
          notification_channels: ["slack", "email", "phone"]
          
        - level: 3
          team: "ops_director"
          timeout: "1h"
          notification_channels: ["pagerduty", "phone"]
          
        - level: 4
          team: "cto"
          timeout: "2h"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "system"
        - severity: "critical"
        
    # Development escalation
    development:
      name: "Development Escalation"
      description: "Escalation chain for development-related alerts"
      
      levels:
        - level: 1
          team: "dev_team"
          timeout: "30m"
          notification_channels: ["slack", "email"]
          
        - level: 2
          team: "tech_lead"
          timeout: "1h"
          notification_channels: ["slack", "email", "phone"]
          
        - level: 3
          team: "engineering_manager"
          timeout: "2h"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "application"
        - severity: ["warning", "critical"]
        
    # Business escalation
    business:
      name: "Business Escalation"
      description: "Escalation chain for business-related alerts"
      
      levels:
        - level: 1
          team: "product_team"
          timeout: "1h"
          notification_channels: ["slack", "email"]
          
        - level: 2
          team: "product_manager"
          timeout: "2h"
          notification_channels: ["slack", "email", "phone"]
          
        - level: 3
          team: "business_director"
          timeout: "4h"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "business"
        - severity: "critical"
        
    # Cost escalation
    cost:
      name: "Cost Escalation"
      description: "Escalation chain for cost-related alerts"
      
      levels:
        - level: 1
          team: "finance_team"
          timeout: "30m"
          notification_channels: ["slack", "email"]
          
        - level: 2
          team: "finance_manager"
          timeout: "1h"
          notification_channels: ["slack", "email", "phone"]
          
        - level: 3
          team: "cfo"
          timeout: "2h"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "cost"
        - severity: "critical"
        
    # Safety escalation
    safety:
      name: "Safety Escalation"
      description: "Escalation chain for safety-related alerts"
      
      levels:
        - level: 1
          team: "safety_team"
          timeout: "5m"
          notification_channels: ["pagerduty", "slack", "phone"]
          
        - level: 2
          team: "safety_officer"
          timeout: "15m"
          notification_channels: ["pagerduty", "phone"]
          
        - level: 3
          team: "safety_committee"
          timeout: "30m"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "safety"
        - severity: "critical"
        
    # Security escalation
    security:
      name: "Security Escalation"
      description: "Escalation chain for security-related alerts"
      
      levels:
        - level: 1
          team: "security_team"
          timeout: "5m"
          notification_channels: ["pagerduty", "slack", "phone"]
          
        - level: 2
          team: "security_officer"
          timeout: "15m"
          notification_channels: ["pagerduty", "phone"]
          
        - level: 3
          team: "ciso"
          timeout: "30m"
          notification_channels: ["pagerduty", "phone"]
          
      conditions:
        - alert_type: "security"
        - severity: "critical"

  # Service-specific escalation
  service_escalation:
    resume_processing:
      chain: "development"
      custom_levels:
        - level: 1
          team: "resume_team"
          timeout: "20m"
          
        - level: 2
          team: "resume_manager"
          timeout: "45m"
          
    outreach_generation:
      chain: "development"
      custom_levels:
        - level: 1
          team: "outreach_team"
          timeout: "20m"
          
        - level: 2
          team: "outreach_manager"
          timeout: "45m"
          
    job_analysis:
      chain: "development"
      custom_levels:
        - level: 1
          team: "job_team"
          timeout: "30m"
          
        - level: 2
          team: "job_manager"
          timeout: "1h"

  # Time-based escalation rules
  time_based_escalation:
    business_hours:
      start: "09:00"
      end: "17:00"
      timezone: "UTC"
      days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      
      escalation_multipliers:
        critical: 1.0
        warning: 1.5
        info: 2.0
        
    after_hours:
      escalation_multipliers:
        critical: 0.5
        warning: 1.0
        info: 1.5
        
    weekends:
      escalation_multipliers:
        critical: 0.5
        warning: 0.75
        info: 1.0

  # Severity-based escalation
  severity_escalation:
    critical:
      immediate_escalation: true
      skip_levels: false
      max_timeout: "5m"
      
    warning:
      immediate_escalation: false
      skip_levels: false
      max_timeout: "30m"
      
    info:
      immediate_escalation: false
      skip_levels: true
      max_timeout: "1h"

  # Escalation triggers
  escalation_triggers:
    # Time-based triggers
    time_triggers:
      - condition: "no_response_within_timeout"
        action: "escalate_to_next_level"
        
      - condition: "alert_firing_longer_than_threshold"
        threshold: "2h"
        action: "escalate_immediately"
        
    # Acknowledgment triggers
    acknowledgment_triggers:
      - condition: "not_acknowledged_within_timeout"
        timeout: "10m"
        action: "escalate"
        
    # Response triggers
    response_triggers:
      - condition: "inadequate_response"
        action: "escalate_and_notify_manager"
        
    # Resolution triggers
    resolution_triggers:
      - condition: "not_resolved_within_sla"
        sla: "4h"
        action: "escalate_to_management"

  # Escalation suppression
  suppression_rules:
    # Maintenance suppression
    maintenance:
      condition: "maintenance_mode = true"
      duration: "6h"
      affected_chains: ["system_operations"]
      
    # Known issue suppression
    known_issues:
      condition: "known_issue = true"
      duration: "24h"
      affected_chains: ["all"]
      
    # Low priority suppression
    low_priority:
      condition: "severity = 'info' AND business_hours = false"
      duration: "until_business_hours"
      affected_chains: ["business", "development"]

  # Escalation notifications
  notifications:
    # Escalation start notifications
    escalation_start:
      channels: ["email", "slack"]
      template: "escalation_start"
      
    # Escalation level notifications
    escalation_level:
      channels: ["email", "slack", "pagerduty"]
      template: "escalation_level"
      
    # Escalation completion notifications
    escalation_complete:
      channels: ["email", "slack"]
      template: "escalation_complete"

  # Escalation metrics
  metrics:
    enabled: true
    track:
      - "escalation_events_total"
      - "escalation_duration_seconds"
      - "escalation_level_reached"
      - "escalation_suppression_events_total"

  # Escalation policies by environment
  environment_policies:
    development:
      auto_escalation: false
      max_levels: 2
      timeout_multiplier: 2.0
      
    staging:
      auto_escalation: true
      max_levels: 3
      timeout_multiplier: 1.5
      
    production:
      auto_escalation: true
      max_levels: 5
      timeout_multiplier: 1.0

  # Escalation approval
  approval_required:
    levels_above: 3
    approval_channels: ["email", "slack"]
    approval_timeout: "15m"
    
  # Escalation documentation
  documentation:
    auto_generate: true
    include_timeline: true
    include_responses: true
    retention: "1y"

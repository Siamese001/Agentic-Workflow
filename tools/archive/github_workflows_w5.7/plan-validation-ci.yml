name: Plan Validation CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/reports/plans/**/*.md'
      - '.windsurf/plans/**/*.md'
      - 'tools/validate_plan_format.py'
      - 'tools/ci_validate_plans.py'
      - '.windsurfrules'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/reports/plans/**/*.md'
      - '.windsurf/plans/**/*.md'
      - 'tools/validate_plan_format.py'
      - 'tools/ci_validate_plans.py'
      - '.windsurfrules'
  workflow_dispatch:
    inputs:
      validate_all:
        description: 'Validate all plans (not just changed)'
        required: false
        default: 'false'
        type: boolean

jobs:
  validate-plans:
    runs-on: ubuntu-latest
    name: Plan Validation

    steps:
    - uses: ./.github/actions/common-setup

    - name: Install pytest dependencies
      run: |
        pip install pytest pytest-cov

    - name: Validate Plan Format
      run: |
        echo "=== Validating Plan Format ==="
        python tools/validate_plan_format.py

    - name: Run Comprehensive CI Validation
      run: |
        echo "=== Running CI Plan Validation ==="
        python tools/ci_validate_plans

    - name: Upload Validation Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: plan-validation-report
        path: artifacts/ci/plan_validation_report.*
        retention-days: 30

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          try {
            const report = fs.readFileSync('artifacts/ci/plan_validation_report.md', 'utf8');
            const results = JSON.parse(fs.readFileSync('artifacts/ci/plan_validation_report.json', 'utf8'));

            const comment = `## 📋 Plan Validation Results

            **Summary:**
            - ✅ Valid Plans: ${results.valid_plans}/${results.total_plans}
            - ❌ Invalid Plans: ${results.invalid_plans}
            - ⚠️ Plans with Warnings: ${results.plans_with_warnings}

            ${results.invalid_plans > 0 ? '### ❌ Validation Failed' : '### ✅ Validation Passed'}

            <details>
            <summary>View Full Report</summary>

            ${report}

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not read report file:', error);
          }

    - name: Check for windsurfrules violations
      run: |
        echo "=== Checking windsurfrules Compliance ==="
        if [ -f ".windsurfrules" ]; then
          echo "windsurfrules found - checking plan enforcement rules"
          # Add specific windsurfrules validation here
        fi

    - name: Fail on Invalid Plans
      if: failure()
      run: |
        echo "❌ CI FAILED: Invalid plans found"
        echo "Please fix the issues above and push again."
        exit 1

name: ADG Invariant Scan

on:
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'ops_scripts/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    branches: ["**"]

jobs:
  adg-scan:
    name: Architecture Dependency Graph Invariant Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . --no-deps || pip install -r requirements.txt --quiet || true

      - name: S1 — Scanner self-test (must pass before scan)
        run: |
          python -c "
          from agentic_core.adg.extraction.static_scanner import run_scanner_self_test
          passed = run_scanner_self_test()
          if not passed:
              raise SystemExit('ADG scanner self-test FAILED — aborting scan')
          print('ADG scanner self-test PASSED')
          "
        env:
          PYTHONPATH: .

      - name: G1 — Check no unconditional xfail in governance/guardian tests
        run: |
          python ops_scripts/ci/check_no_unconditional_xfail.py
        env:
          PYTHONPATH: .

      - name: G2 — Test integrity (zero-assert, count invariants) (§1.2, §1.5)
        run: |
          python ops_scripts/ci/check_test_integrity.py
        env:
          PYTHONPATH: .

      - name: G3 — Utility silent swallowers in governance scripts (§1.2, §10)
        run: |
          python ops_scripts/ci/check_utility_silent_swallowers.py
        env:
          PYTHONPATH: .

      - name: Run ADG full invariant scan (H10 --include-tests --write-manifest)
        run: |
          python -m agentic_core.adg.cli \
            --repo-root . \
            --commit "${{ github.sha }}" \
            scan \
            --include-tests \
            --write-manifest
        env:
          PYTHONPATH: .

      - name: G4 — Update artifact manifest with sha256 hashes
        if: always()
        run: |
          python -c "
          import hashlib, json, os
          from pathlib import Path

          adg_dir = Path('artifacts/adg')
          manifest_path = adg_dir / 'artifact_manifest.json'
          artifacts = []
          for f in sorted(adg_dir.glob('*.json')):
              if f.name == 'artifact_manifest.json':
                  continue
              data = f.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              artifacts.append({'file': str(f), 'sha256': sha256, 'size': len(data)})
          manifest = {
              '_schema_version': '1.0',
              '_description': 'G4: ADG artifact manifest with sha256 hashes.',
              'commit_sha': os.environ.get('GITHUB_SHA', ''),
              'artifacts': artifacts,
          }
          adg_dir.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, indent=2))
          print(f'G4: artifact_manifest.json written with {len(artifacts)} entries')
          "
        env:
          PYTHONPATH: .
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload ADG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adg-artifacts-${{ github.sha }}
          path: artifacts/adg/
          if-no-files-found: ignore

name: CI Integrity Gate (§22)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci-integrity:
    name: CI Integrity Gate — 12 Conditions (§22.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: pip install pytest --quiet

      - name: PowerShell Ban (Rule #2, §3.2)
        run: python ops_scripts/ci/check_powershell_ban.py
        env:
          PYTHONPATH: .

      - name: Run CI integrity gate (§22)
        run: |
          if [ -f "ops_scripts/ci/ci_integrity_gate_fallback.py" ]; then
            python ops_scripts/ci/ci_integrity_gate_fallback.py
          elif [ -f "ops_scripts/ci/check_ci_integrity.py" ]; then
            python ops_scripts/ci/check_ci_integrity.py
          else
            echo "ERROR: Neither ci_integrity_gate_fallback.py nor check_ci_integrity.py found"
            exit 1
          fi
        env:
          PYTHONPATH: .

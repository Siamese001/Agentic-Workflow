name: System Learning CI Pipeline

on:
  push:
    branches: ["**"]
    paths:
      - 'system_learning/**'
      - 'tests/system_learning/**'
      - 'tests/unit/system_learning/**'
      - 'tools/implement_unified_memory.py'
      - 'tools/adg/adg_redis_ingest.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'system_learning/**'
      - 'tests/system_learning/**'
      - 'tests/unit/system_learning/**'
      - 'tools/implement_unified_memory.py'
      - 'tools/adg/adg_redis_ingest.py'

jobs:
  system-learning-ci:
    name: System Learning CI - Test & Validate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install redis pytest
          pip install -e . --no-deps 2>/dev/null || pip install -r requirements.txt --quiet 2>/dev/null || true

      - name: Verify ADG cache freshness
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tools.adg.adg_mcp_server import adg_status
          status = adg_status()
          print(f'ADG Status: {status[\"data\"][\"is_fresh\"]} (age: {status[\"data\"][\"age_seconds\"]:.1f}s)')
          if not status['data']['is_fresh']:
              print('ADG cache stale - refreshing...')
              import subprocess
              subprocess.run(['python', 'tools/adg/adg_redis_ingest.py', '--force'], check=True)
              print('ADG cache refreshed')
          "

      - name: Run system_learning unit tests (stores)
        run: |
          pytest tests/unit/system_learning/stores/ -v --tb=short

      - name: Run system_learning unit tests (adapters)
        run: |
          pytest tests/unit/system_learning/adapters/ -v --tb=short

      - name: Run system_learning integration tests
        run: |
          pytest tests/system_learning/ -v --tb=short

      - name: Run targeted persistence validation
        run: |
          pytest tests/unit/system_learning/stores/test_version_store_adg.py \
                 tests/unit/system_learning/stores/test_activator_adg.py \
                 tests/unit/system_learning/stores/test_config_provider_adg.py \
                 tests/unit/system_learning/stores/test_telemetry_store_adg.py \
                 tests/unit/system_learning/adapters/test_l1_meta_adapter_adg.py \
                 tests/system_learning/test_system_learning_memory_bridge.py \
                 -v --tb=short

      - name: Verify persistent memory database exists
        run: |
          if [ -f "artifacts/memory/unified_memory.db" ]; then
            echo "✅ Persistent memory database exists"
            ls -la artifacts/memory/unified_memory.db
          else
            echo "⚠️ Persistent memory database not found - will be created on first run"
          fi

      - name: Test continuous learning pipeline
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')

          # Test that all system_learning components can import and initialize
          from system_learning.stores.version_store import FileBackedVersionStore, InMemoryVersionStore
          from system_learning.stores.activator import FileBackedActivator, InMemoryActivator
          from system_learning.stores.config_provider import FileBackedConfigProvider
          from system_learning.stores.telemetry_store import FileBackedTelemetryStore
          from system_learning.adapters.l1_meta_adapter import L1MetaAdapter
          from system_learning.adapters.system_learning_memory_bridge import get_sl_memory_bridge

          # Test bridge availability
          bridge = get_sl_memory_bridge()
          print(f'Bridge available: {bridge.is_available}')

          # Test version store persistence
          import tempfile
          import os
          with tempfile.TemporaryDirectory() as tmpdir:
              store = FileBackedVersionStore(tmpdir)
              version_id = store.commit_change_package({'test': 'data'})
              print(f'Version store test: {version_id}')

          print('✅ All system_learning components initialized successfully')
          "

      - name: Validate memory bridge persistence
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from system_learning.adapters.system_learning_memory_bridge import get_sl_memory_bridge

          bridge = get_sl_memory_bridge()

          # Test each persistence helper
          tests = [
              ('persist_active_version', lambda: bridge.persist_active_version('test', 'v1')),
              ('persist_config_snapshot', lambda: bridge.persist_config_snapshot('test', b'{}')),
              ('persist_telemetry_window', lambda: bridge.persist_telemetry_window('test', [])),
              ('persist_l1_drift_signal', lambda: bridge.persist_l1_drift_signal(type('MockDrift', (), {'surface_name': 'test', 'drift_magnitude': 0.5})())),
          ]

          for name, func in tests:
              try:
                  result = func()
                  print(f'✅ {name}: {result}')
              except Exception as e:
                  print(f'❌ {name}: {e}')
                  raise
          "

      - name: Upload test results
      if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-learning-ci-results-${{ github.sha }}
          path: |
            pytest.xml
            artifacts/memory/
            artifacts/adg/
          retention-days: 7

name: ADG Phase-0 Proof-Artifact Truthfulness (§15)

on:
  push:
    branches: ["**"]
    paths:
      - 'docs/reports/plans/**'
      - 'artifacts/adg/**'
      - 'ops_scripts/ci/check_phase0_artifact_truthfulness.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'docs/reports/plans/**'
      - 'artifacts/adg/**'
      - 'ops_scripts/ci/check_phase0_artifact_truthfulness.py'

jobs:
  phase0-truthfulness:
    name: Phase-0 Proof-Artifact Truthfulness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for proof artifacts with raw_counts blocks
        id: detect
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          plans_dir = Path("docs/reports/plans")
          if not plans_dir.exists():
              print("No docs/reports/plans/ directory — skipping.")
              sys.exit(0)

          found = []
          for f in sorted(plans_dir.rglob("*.json")):
              try:
                  data = json.loads(f.read_text(encoding="utf-8"))
                  if "raw_counts" in data:
                      found.append(str(f))
              except Exception:
                  pass

          if not found:
              print("No proof artifacts with raw_counts found — nothing to check.")
          else:
              print(f"Found {len(found)} proof artifact(s) to validate:")
              for p in found:
                  print(f"  {p}")
          PYEOF

      - name: Run truthfulness checker (§15)
        run: |
          if [ -f "ops_scripts/ci/check_phase0_artifact_truthfulness.py" ]; then
            python ops_scripts/ci/check_phase0_artifact_truthfulness.py
          else
            python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          PLANS_DIR = Path("docs/reports/plans")
          violations = []

          def check_artifact(path: Path, data: dict) -> list:
              errs = []
              raw = data.get("raw_counts", {})
              flags = data.get("flags", {})
              derived_facts = data.get("derived_facts", {})

              # Rule 1: *_raw flags must match raw_counts
              count_map = {
                  "tests_present_raw": "tests",
                  "fixtures_present_raw": "fixtures",
                  "modules_present_raw": "module",
                  "symbols_present_raw": "symbol",
              }
              for flag_key, count_key in count_map.items():
                  if flag_key in flags and count_key in raw:
                      raw_count = raw[count_key]
                      flag_val = flags[flag_key]
                      expected = raw_count > 0
                      if flag_val != expected:
                          errs.append(
                              f"{path}: '{flag_key}' is {flag_val} but "
                              f"raw_counts['{count_key}']={raw_count} "
                              f"(expected {expected})"
                          )

              # Rule 2 & 3: *_derived flags require recorded deriving_command
              #             and positive deriving_command_output_lines
              derived_map = {
                  "tests_present_derived": "tests_reachable_via_impact",
                  "fixtures_present_derived": "fixtures_reachable_via_impact",
              }
              for flag_key in [k for k in flags if k.endswith("_derived")]:
                  if flags[flag_key] is True:
                      cmd = derived_facts.get("deriving_command", "")
                      lines = derived_facts.get("deriving_command_output_lines", 0)
                      if not cmd:
                          errs.append(
                              f"{path}: '{flag_key}' is true but "
                              f"'deriving_command' is absent or empty (§15.3)"
                          )
                      if not isinstance(lines, int) or lines <= 0:
                          errs.append(
                              f"{path}: '{flag_key}' is true but "
                              f"'deriving_command_output_lines'={lines!r} is not a positive integer (§15.3)"
                          )
              return errs

          if not PLANS_DIR.exists():
              print("No docs/reports/plans/ — nothing to check.")
              sys.exit(0)

          for f in sorted(PLANS_DIR.rglob("*.json")):
              try:
                  data = json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  continue
              if "raw_counts" not in data:
                  continue
              violations.extend(check_artifact(f, data))

          if violations:
              print(f"\n§15 PROOF-ARTIFACT TRUTHFULNESS VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"  ❌ {v}")
              sys.exit(1)
          else:
              print("§15 Proof-artifact truthfulness: PASSED")
          PYEOF
          fi
        env:
          PYTHONPATH: .

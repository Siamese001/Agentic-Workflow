name: SSOT Structure Verification

on:
  pull_request:
    paths:
      - "agentic_core/L5_safety/config/structure_blueprint/**"
      - "agentic_core/L5_safety/config/structure_blueprint_config.py"
      - "docs/reports/plans/phantom_baseline.json"
      - "docs/reports/plans/allowlist_hash.txt"
      - "docs/policies/ssot_enforcement_policy.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies (only if dedicated file exists)
        run: |
          if [ -f requirements-ssot-verify.txt ]; then
            pip install -r requirements-ssot-verify.txt
          fi

      - name: Print Python version
        run: python --version

      - name: Verify lock files exist
        run: |
          test -f docs/reports/plans/phantom_baseline.json || { echo "FAIL: phantom_baseline.json missing"; exit 1; }
          test -f docs/reports/plans/allowlist_hash.txt || { echo "FAIL: allowlist_hash.txt missing"; exit 1; }

      - name: Guard against maintenance flags
        run: |
          python3 -c "
          import sys
          MODULE = 'agentic_core.L5_safety.config.structure_blueprint._verify'
          FORBIDDEN = [
              '--init-phantom-baseline',
              '--update-phantom-baseline',
              '--repair-phantom-baseline',
              '--acknowledge-import-change',
              '--update-blueprint-hash',
              '--acknowledge-debt',
              '--acknowledge-optional-growth',
          ]
          with open('.github/workflows/ssot_verify.yml') as f:
              lines = f.read().splitlines()
          invoke_lines = []
          for line in lines:
              s = line.strip()
              if s.startswith('#') or s.startswith('\"') or s.startswith(\"'\"):
                  continue
              if 'python' in s and '-m' in s and MODULE in s:
                  invoke_lines.append(s)
          print(f'invocation_count: {len(invoke_lines)}')
          for il in invoke_lines:
              print(f'  matched: {il}')
          if not invoke_lines:
              print('FAIL: no verifier invocation found in workflow')
              sys.exit(1)
          violations = []
          for line in invoke_lines:
              for flag in FORBIDDEN:
                  if flag in line:
                      violations.append(f'line contains {flag}: {line}')
          if violations:
              for v in violations:
                  print(f'FAIL: {v}')
              sys.exit(1)
          print(f'PASS: {len(invoke_lines)} verifier invocation(s), no maintenance flags')
          "

      - name: Run SSOT verifier
        run: python -m agentic_core.L5_safety.config.structure_blueprint._verify

      - name: Validate enforcement report — no zero counters, no new debt
        run: |
          python3 -c "
          import json, sys
          report = json.load(open('docs/reports/verification/enforcement_report.json'))
          errors = []
          for check in report['checks']:
              name = check['name']
              stats = check['stats']
              has_nonzero = any(isinstance(v, (int, float)) and v > 0 for v in stats.values())
              if not has_nonzero:
                  errors.append(f'{name}: all-zero stats (silent non-execution)')
              if not check['passed']:
                  errors.append(f'{name}: FAILED')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}')
              sys.exit(1)
          # Validate warning budget: unbudgeted warnings must be zero
          summary = report['summary']
          unbudgeted = summary.get('warnings_unbudgeted', 0)
          if unbudgeted > 0:
              errors.append(f'Unbudgeted warnings: {unbudgeted} (must be 0)')
          print(f'PASS: {summary[\"total_checks\"]} checks, all passed with non-zero counters')
          print(f'  errors={summary.get(\"errors\",\"?\")}, budgeted_warnings={summary.get(\"warnings_budgeted\",\"?\")}, unbudgeted_warnings={unbudgeted}')
          "

      - name: Run enforcement counter regression tests
        run: python -m pytest tests/unit/structure_blueprint/test_enforcement_counters.py -xvv --tb=short

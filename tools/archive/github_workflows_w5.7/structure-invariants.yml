# Structure Invariant Hard Gate
# Runs all structural contract tests on every push/PR.
# Blocks merge if any invariant fails.
name: Structure Invariants (Mandatory)

on:
  push:
    paths:
      - 'agentic_core/**'
      - 'ops_scripts/**'
      - 'artifacts/structure/**'
      - 'tests/unit_min_deps/test_import_boundary_contract.py'
      - 'tests/unit_min_deps/test_base_agents_purity_contract.py'
      - 'tests/unit_min_deps/test_leaf_domain_contract.py'
      - 'tests/unit_min_deps/test_root_hygiene_contract.py'
      - 'tests/unit_min_deps/test_import_graph_contract.py'
  pull_request:
    paths:
      - 'agentic_core/**'
      - 'ops_scripts/**'
      - 'artifacts/structure/**'

jobs:
  structure-invariant-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest

      - name: "Gate 1: Import Boundary (agentic_core !→ ops_scripts)"
        run: |
          pytest tests/unit_min_deps/test_import_boundary_contract.py -v --tb=short

      - name: "Gate 2: base_agents Identity Purity"
        run: |
          pytest tests/unit_min_deps/test_base_agents_purity_contract.py -v --tb=short

      - name: "Gate 3: LEAF_DOMAIN Enforcement"
        run: |
          pytest tests/unit_min_deps/test_leaf_domain_contract.py -v --tb=short

      - name: "Gate 4: Root Hygiene Manifest"
        run: |
          pytest tests/unit_min_deps/test_root_hygiene_contract.py -v --tb=short

      - name: "Gate 5: Import Graph Snapshot"
        run: |
          pytest tests/unit_min_deps/test_import_graph_contract.py -v --tb=short

      - name: "Gate 6: Tooling/Apps Boundary (§8.3)"
        run: python ops_scripts/ci/check_tooling_apps_boundary.py
        env:
          PYTHONPATH: .

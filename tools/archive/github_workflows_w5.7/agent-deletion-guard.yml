name: Agent Deletion Guard (§1.6)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  agent-deletion-guard:
    name: Agent Deletion Authorization Check (§1.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for unauthorized agent deletions
        run: |
          python - <<'PYEOF'
          import subprocess
          import sys
          import re
          from pathlib import Path

          # Determine diff range
          event = "${{ github.event_name }}"
          if event == "pull_request":
              base = "${{ github.event.pull_request.base.sha }}"
              head = "${{ github.event.pull_request.head.sha }}"
              diff_range = f"{base}..{head}"
          else:
              diff_range = "HEAD~1..HEAD"

          result = subprocess.run(
              ["git", "diff", "--name-status", diff_range],
              capture_output=True, text=True,
          )

          deleted_agents = []
          for line in result.stdout.splitlines():
              parts = line.split("\t", 1)
              if len(parts) == 2 and parts[0] == "D" and parts[1].endswith("Agent.py"):
                  deleted_agents.append(parts[1])

          if not deleted_agents:
              print("OK: No *Agent.py files deleted in this push/PR.")
              sys.exit(0)

          print(f"DETECTED: {len(deleted_agents)} agent file(s) deleted:")
          for a in deleted_agents:
              print(f"  - {a}")
          print()

          # Check commit messages in range for the authorization marker
          log_result = subprocess.run(
              ["git", "log", "--format=%B", diff_range],
              capture_output=True, text=True,
          )
          commit_messages = log_result.stdout

          if "AGENT-DELETION-AUTHORIZED:" not in commit_messages:
              print("ERROR: Agent deletion detected without authorization marker.")
              print()
              print("  All commit messages in this push/PR must include:")
              print("    AGENT-DELETION-AUTHORIZED: <justification (min 50 chars)>")
              print("    REPLACEMENT: <replacement agent, 'none', or 'unused'>")
              print("    DEPRECATION-DATE: <YYYY-MM-DD or 'N/A'>")
              print("    REFERENCES-MIGRATED: <yes/no>")
              print()
              print("  Example:")
              print("    AGENT-DELETION-AUTHORIZED: Shim fully migrated after 90-day deprecation.")
              print("    REPLACEMENT: LocationHealerAgent")
              print("    DEPRECATION-DATE: 2025-12-01")
              print("    REFERENCES-MIGRATED: yes")
              sys.exit(1)

          # Validate required companion fields
          missing = []
          for field in ("REPLACEMENT:", "DEPRECATION-DATE:", "REFERENCES-MIGRATED:"):
              if field not in commit_messages:
                  missing.append(field)

          if missing:
              print(f"ERROR: Agent deletion authorized but missing required fields: {missing}")
              sys.exit(1)

          # Validate justification length
          match = re.search(r"AGENT-DELETION-AUTHORIZED:\s*(.+)", commit_messages)
          if match:
              justification = match.group(1).strip()
              if len(justification) < 50:
                  print(f"ERROR: Justification too short ({len(justification)} chars, min 50).")
                  print(f"  Got: {justification}")
                  sys.exit(1)

          print("OK: Agent deletion authorization verified.")
          PYEOF

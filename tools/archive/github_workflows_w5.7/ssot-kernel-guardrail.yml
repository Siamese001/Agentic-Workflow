name: SSOT Kernel Guardrail

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'tools/architectural/**'
      - 'tests/core/**'

jobs:
  ssot-guardrail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: SSOT Folder Structure Validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running Agentic SSOT Enforcement..."
          python -m agentic_core.L5_safety.validators.ssot_folder_check
          echo "SSOT folder structure verified"

      - name: Enforce Module Collision Guard
        run: |
          echo "Checking for module collisions..."
          python tools/architectural/module_collision_guard.py
          echo "Module collision guard passed — no architectural violations"

      - name: Enforce SSOT Classification Kernel
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Scanning for shadow classification logic..."
          python -m agentic_core.L0_routing.enforcement.ssot_guardrail --fail --errors-only
          echo "SSOT Kernel guardrail passed — 0 shadow errors"

      - name: Run Classification Contract Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest
          python -m pytest tests/core/test_classification_contract.py -xvv

name: Timeout & Progress Enforcement

on:
  push:
    branches: ["**"]
    paths:
      - 'ops_scripts/ci/validate_timeout_progress.py'
      - 'agentic_core/**'
  pull_request:
    branches: ["**"]

jobs:
  validate-timeout-progress:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tqdm

    - name: Run Timeout & Progress Validation
      run: |
        python ops_scripts/ci/validate_timeout_progress.py

    - name: Run Timeout Recovery Validation (§9.6)
      run: |
        python ops_scripts/ci/validate_timeout_recovery.py

    - name: Report Results
      if: failure()
      run: |
        echo "❌ Timeout & Progress Compliance Violations Detected"
        echo "See job logs for details"
        echo "Remediation: .windsurf/skills/timeout-progress-enforcement/skill.md"

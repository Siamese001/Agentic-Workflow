name: Agent Sprawl Check

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths:
      - 'agentic_core/**'
      - 'artifacts/dedup/**'
      - 'ops_scripts/**'

jobs:
  sprawl-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Run Agent Discovery (SSOT refresh)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m agentic_core.L0_routing.scripts.full_agent_discovery --summary

      - name: Run Dedup Analysis (regenerate similarity artifacts)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python artifacts/dedup/run_dedup_analysis.py

      # ── Phase 1: SSOT enforcement + unit tests ──
      - name: Enforce Manifest SSOT Check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/manifest_ssot_check.py

      - name: Enforce Active Set SSOT Check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/active_set_ssot_check.py

      - name: Active Set SSOT Check Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/core/test_active_set_ssot_check.py -xvv

      - name: Governance Coverage Audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/governance_coverage_check.py

      # ── Phase 2: Active-set gates ──
      - name: Enforce Agent Count Cap
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/agent_count_cap.py

      - name: Discovery Registry Consistency Check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/discovery_registry_consistency_check.py

      - name: Active Set Drift Snapshot Check
        env:
          PYTHONPATH: ${{ github.workspace }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python ops_scripts/ci/active_set_snapshot_check.py

      # ── Phase 3: Remaining gates ──
      - name: Enforce MRO New Diamond Check
        env:
          PYTHONPATH: ${{ github.workspace }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python ops_scripts/ci/mro_new_diamond_check.py

      - name: Enforce MRO Diamond Contract
        env:
          PYTHONPATH: ${{ github.workspace }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python ops_scripts/ci/mro_contract_check.py

      - name: Validate Target Manifest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python artifacts/consolidation/validate_target_manifest.py

      - name: Enforce Shim Contract Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/shim_contract_check.py

      - name: Enforce Init Contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/init_contract_check.py

      - name: Enforce Skip/Quarantine Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/skip_quarantine_check.py

      - name: Enforce Centrality Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/centrality_gate.py

      - name: CI Self-Consistency Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ops_scripts/ci/gate_consistency_check.py

      # ── Phase 4: Test suites ──
      - name: Executor Smoke Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/core/test_executor_smoke.py -xvv

      - name: Discovery Canonical Identity Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/unit/core/test_discovery_canonical_identity.py -xvv

      - name: Discovery Registry Consistency Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/unit/core/test_discovery_registry_consistency.py -xvv

      - name: Executor Dispatch Snapshot Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/core/test_executor_dispatch_snapshot.py -xvv

      - name: Executor Dispatch Runtime Equivalence Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/core/test_executor_dispatch_runtime_equivalence.py -xvv

      - name: Active Set Fingerprint Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/core/test_active_set_fingerprint.py -xvv

      - name: Enforce Sprawl Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python artifacts/dedup/sprawl_gate.py --max-code-sim 0.85 --max-prompt-sim 0.85

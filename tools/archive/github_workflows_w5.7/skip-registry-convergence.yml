name: Skip Registry & Convergence Gate (§17)

on:
  push:
    branches: ["**"]
    paths:
      - 'tests/**'
      - 'artifacts/adg/pre_existing_skip_registry.json'
      - 'ops_scripts/ci/check_skip_convergence_gate.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'tests/**'
      - 'artifacts/adg/pre_existing_skip_registry.json'

jobs:
  skip-registry-convergence:
    name: Pre-existing Skip Registry & Convergence Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest (for collection only)
        run: pip install pytest --quiet

      - name: Run skip registry convergence gate (§17)
        run: |
          if [ -f "ops_scripts/ci/check_skip_convergence_gate.py" ]; then
            python ops_scripts/ci/check_skip_convergence_gate.py
          else
            python - <<'PYEOF'
          import ast
          import json
          import sys
          from datetime import date
          from pathlib import Path

          REGISTRY_PATH = Path("artifacts/adg/pre_existing_skip_registry.json")
          TESTS_ROOT = Path("tests")

          # ── Load registry ──────────────────────────────────────────────────────────
          if REGISTRY_PATH.exists():
              registry_data = json.loads(REGISTRY_PATH.read_text(encoding="utf-8"))
              registered_ids = {e["test_id"] for e in registry_data.get("skips", [])}
              registry_entries = registry_data.get("skips", [])
          else:
              registered_ids = set()
              registry_entries = []

          # ── Scan test files for skip markers via AST ───────────────────────────────
          def collect_skipped_test_ids(tests_root: Path) -> list[tuple[str, str, int]]:
              """Return list of (pytest_node_id, skip_reason, lineno) for skipped tests."""
              found = []
              if not tests_root.exists():
                  return found
              for f in sorted(tests_root.rglob("test_*.py")):
                  try:
                      source = f.read_text(encoding="utf-8", errors="replace")
                      tree = ast.parse(source, filename=str(f))
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          continue
                      if not node.name.startswith("test_"):
                          continue
                      for decorator in node.decorator_list:
                          reason = ""
                          is_skip = False
                          # @pytest.mark.skip or @pytest.mark.skip(reason=...)
                          if isinstance(decorator, ast.Attribute):
                              if decorator.attr == "skip":
                                  is_skip = True
                          elif isinstance(decorator, ast.Call):
                              func = decorator.func
                              if isinstance(func, ast.Attribute) and func.attr in ("skip", "skipif"):
                                  is_skip = True
                                  for kw in decorator.keywords:
                                      if kw.arg == "reason" and isinstance(kw.value, ast.Constant):
                                          reason = str(kw.value.value)
                              elif isinstance(func, ast.Name) and func.id in ("skip", "skipif"):
                                  is_skip = True
                          if is_skip:
                              # Build a pytest-style node ID: relative path::test_name
                              rel = str(f).replace("\\", "/")
                              node_id = f"{rel}::{node.name}"
                              found.append((node_id, reason, node.lineno))
              return found

          skipped = collect_skipped_test_ids(TESTS_ROOT)

          violations = []

          # ── Check 1: All skips must be registered ──────────────────────────────────
          for node_id, reason, lineno in skipped:
              if node_id not in registered_ids:
                  violations.append(
                      f"UNREGISTERED SKIP: {node_id} (line {lineno}) — "
                      f"reason={reason!r}. Register in {REGISTRY_PATH} per §17.2."
                  )

          # ── Check 2: No expired registry entries ───────────────────────────────────
          today = date.today()
          for entry in registry_entries:
              expiry_raw = entry.get("expiry_date", "")
              if not expiry_raw:
                  violations.append(
                      f"MISSING EXPIRY: registry entry for {entry.get('test_id','?')} "
                      f"has no expiry_date (§17.2)"
                  )
                  continue
              try:
                  expiry = date.fromisoformat(expiry_raw)
              except ValueError:
                  violations.append(
                      f"INVALID EXPIRY DATE: {entry.get('test_id','?')} — "
                      f"expiry_date={expiry_raw!r} is not ISO-8601 (§17.2)"
                  )
                  continue
              if expiry < today:
                  violations.append(
                      f"EXPIRED SKIP: {entry.get('test_id','?')} expired on {expiry_raw}. "
                      f"Resolve or renew before declaring convergence (§17.3)."
                  )

          # ── Check 3: All registry entries have resolution plans ────────────────────
          for entry in registry_entries:
              plan = entry.get("resolution_plan", "").strip()
              if not plan or plan.lower() in ("will fix later", "tbd", "todo", ""):
                  violations.append(
                      f"MISSING RESOLUTION PLAN: {entry.get('test_id','?')} — "
                      f"resolution_plan is empty or placeholder (§17.2)"
                  )

          # ── Check 4: All registry entries have cluster_id ──────────────────────────
          for entry in registry_entries:
              if not entry.get("cluster_id", "").strip():
                  violations.append(
                      f"MISSING CLUSTER_ID: {entry.get('test_id','?')} — "
                      f"cluster_id is required per §17.2"
                  )

          # ── Report ─────────────────────────────────────────────────────────────────
          print(f"Scanned {len(skipped)} skipped test(s) in {TESTS_ROOT}/")
          print(f"Registry entries: {len(registry_entries)}")

          if violations:
              print(f"\n§17 SKIP REGISTRY / CONVERGENCE GATE VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"  ❌ {v}")
              sys.exit(1)
          else:
              print("§17 Skip registry & convergence gate: PASSED")
          PYEOF
          fi
        env:
          PYTHONPATH: .

      - name: Upload skip registry snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skip-registry-${{ github.sha }}
          path: artifacts/adg/pre_existing_skip_registry.json
          if-no-files-found: ignore

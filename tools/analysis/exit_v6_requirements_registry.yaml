  - {id: "5.2.GATE.X1B", source: "05.2", line: "x1b", text: "Gate X1B is implemented as eval_x1b", check: "v6_export", args: {name: "eval_x1b"}}
  - {id: "5.2.GATE.X1C", source: "05.2", line: "x1c", text: "Gate X1C is implemented as eval_x1c", check: "v6_export", args: {name: "eval_x1c"}}
  - {id: "5.2.GATE.X1D", source: "05.2", line: "x1d", text: "Gate X1D is implemented as eval_x1d", check: "v6_export", args: {name: "eval_x1d"}}
  - {id: "5.2.GATE.X1E", source: "05.2", line: "x1e", text: "Gate X1E is implemented as eval_x1e", check: "v6_export", args: {name: "eval_x1e"}}
  - {id: "5.2.GATE.X1F", source: "05.2", line: "x1f", text: "Gate X1F is implemented as eval_x1f", check: "v6_export", args: {name: "eval_x1f"}}


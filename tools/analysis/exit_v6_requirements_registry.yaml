     check: "preflight_emits_alias", args: {case: "grounded_missing_contract", spec_code: "EVIDENCE_CONTRACT_MISSING_FOR_GROUNDED_ROUTE", v6_alias: "EVIDENCE_CONTRACT_MISSING"}}
  - {id: "5.1.TR.action_no_sandbox_fails", source: "05.1", line: "411",

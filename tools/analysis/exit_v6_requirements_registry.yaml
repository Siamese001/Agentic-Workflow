     check: "ok_static"}
  - {id: "5.1.ERP.governance", source: "05.1", line: "295-305",
     text: "ExitReviewPacket.governance carries policy_hash, blueprint_hash, compliance_hash, manifest_hash, hmac_sig, capability_token_ref, sandbox_envelope_ref, l5_certification_refs, hitl_reclearance_refs",
     check: "ok_static"}
  - {id: "5.1.ERP.sealed_payload", source: "05.1", line: "307-318",
     text: "ExitReviewPacket.sealed_payload carries terminal_classification, output/failure/safe_partial refs, generated_artifacts, proposed_state_diff, action/tool/model/ptc receipts",
     check: "ok_static"}
  - {id: "5.1.ERP.evidence", source: "05.1", line: "320-330",
     text: "ExitReviewPacket.evidence carries c0_final_evidence_contract_ref, evidence_bundle_refs, citation_map, support_score, contradiction_flags, unsupported_gap_refs, freshness, acl, lineage",
     check: "ok_static"}
  - {id: "5.1.ERP.prompt", source: "05.1", line: "332-338",
     text: "ExitReviewPacket.prompt carries prompt_assembly_status_ref, compiled_prompt_artifact_ref, prompt_hash, response_schema_ref, tool_schema_refs",
     check: "ok_static"}
  - {id: "5.1.ERP.trajectory", source: "05.1", line: "340-348",
     text: "ExitReviewPacket.trajectory carries workflow_package_ref, step_artifact_refs, retry_count, repair_count, fallback_depth, handoff_map, trajectory_snapshot_ref",
     check: "ok_static"}
  - {id: "5.1.ERP.replay", source: "05.1", line: "350-359",
     text: "ExitReviewPacket.replay carries replay_key, input_hash, prompt_hash, route_digest, evidence_contract_hash, sealed_artifact_hash, snapshot_manifest_ref, determinism_receipts",

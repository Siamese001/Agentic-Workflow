  - {id: "5.2.X1A.POLICY_HASH_MISSING", source: "05.2", line: "x1a-fail-routes", text: "X1A emits POLICY_HASH_MISSING", check: "ok_static"}
  - {id: "5.2.X1A.POLICY_HASH_MISMATCH", source: "05.2", line: "x1a-fail-routes", text: "X1A emits POLICY_HASH_MISMATCH", check: "ok_static"}
  - {id: "5.2.X1A.BLUEPRINT_HASH_MISMATCH", source: "05.2", line: "x1a-fail-routes", text: "X1A emits BLUEPRINT_HASH_MISMATCH", check: "ok_static"}

  - {id: "5.1.ERP.observability", source: "05.1", line: "361-367",
     text: "ExitReviewPacket.observability carries otel_trace_refs, span_coverage_map, timing_offsets, anomaly_flags, live_bell_signal_refs",
     check: "ok_static"}
  - {id: "5.1.ERP.normalization", source: "05.1", line: "369-376",
     text: "ExitReviewPacket.normalization carries source_classify_receipt, receipt_validation_report, authority_label_manifest, run_identity_binding_receipt, normalization_warnings, packet_hash",

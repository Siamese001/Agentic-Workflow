  - {id: "5.1.N1.SOURCE_CLASSIFY", source: "05.1", line: "221-227",
     text: "N1 maps source packet into one accepted input class, rejects unknown, preserves original_source_type, emits SourceClassifyReceipt",
     check: "v6_export", args: {name: "classify_source"}}
  - {id: "5.1.N2.RECEIPT_VALIDATE", source: "05.1", line: "228-236",
     text: "N2 validates required fields, hashes, policy_hash, blueprint_hash, replay_key, no unsigned mutation, route_contract; emits ReceiptValidationReport",
     check: "v6_export", args: {name: "validate_required_receipts"}}
  - {id: "5.1.N3.AUTHORITY_PRESERVE", source: "05.1", line: "237-249",
     text: "N3 attaches origin labels (user/retrieved/tool/model/human/policy/L5/L4); treats retrieved/tool/human as data only; prevents authority overwrite",
     check: "ok_static", args: {note: "AuthorityLabelManifest emitted by normalize_to_packet"}}
  - {id: "5.1.N4.RUN_IDENTITY_BIND", source: "05.1", line: "250-256",
     text: "N4 verifies request_id, run_id, session_id, trace_root, route_id, replay_key agree; no hidden reroute; emits RunIdentityBindingReceipt",
     check: "v6_internal", args: {module: "agentic_core.L3_orchestration.exit_eval.v6.preflight", name: "bind_run_identity"}}
  - {id: "5.1.N5.NORMALIZE_PACKET", source: "05.1", line: "258-264",
     text: "N5 converts source packets into one ExitReviewPacket; preserves substructures; preserves diffs as inert; emits ExitReviewPacketHash",
     check: "v6_export", args: {name: "normalize_to_packet"}}

  # ExitReviewPacket sections (267-376) - validate field-list keys exist via dataclass introspection
  - {id: "5.1.ERP.identity", source: "05.1", line: "269-280",

# Master requirements registry for Exit Eval v6.
# Every row maps a verbatim spec requirement to a runtime validator.
# Generated 2026-04-26 from full re-ingest of 14 spec files in
# docs/reference/05_Exit_Evaluation_and_Control/.
#
# Status semantics:
#   ok_static          - requirement is part of a v6 contract (always present at runtime)
#   design             - design-only spec, not yet wired into v6 runtime code
#   source_type_in_enum, preflight_emits, v6_export, span_in_catalog,
#   attr_in_required, disposition_name, disposition_in_enum,
#   uwg_outcome_in_enum, return_code_present, obs_eq, obs_truthy,
#   field_in_dataclass, verdict_in_enum  - dynamic checks
#
# Format:
#   - id: <stable-req-id>
#     source: <spec-filename>
#     line: <line-or-range>
#     text: <verbatim or near-verbatim requirement>
#     check: <validator name>
#     args:  <validator-specific args>

requirements:

  # ============================================================
  # 05.1 Exit_Input_Normalization_and_Review_Packet
  # ============================================================

  # Input classes (lines 134-162)
  - {id: "5.1.IC.L2_SEALED_ARTIFACT", source: "05.1", line: "135-141",
     text: "L2_SEALED_ARTIFACT is an accepted sealed-input class produced by L2 E5 Seal",
     check: "source_type_in_enum", args: {value: "L2_SEALED_ARTIFACT"}}
  - {id: "5.1.IC.L3_WORKFLOW_PACKAGE", source: "05.1", line: "142-146",
     text: "L3_WORKFLOW_PACKAGE input class preserves node order, branch/join lineage, retry counters, gaps, partials",
     check: "source_type_in_enum", args: {value: "L3_WORKFLOW_PACKAGE"}}
  - {id: "5.1.IC.RET_CACHE_EXACT", source: "05.1", line: "147-150",
     text: "RET_CACHE_EXACT is terminal short-circuit from L0 exact cache; bypasses C0/PA/L3/L2 but passes Exit checks",
     check: "source_type_in_enum", args: {value: "RET_CACHE_EXACT"}}
  - {id: "5.1.IC.RET_CACHE_SEMANTIC", source: "05.1", line: "151-154",
     text: "RET_CACHE_SEMANTIC carries calibrated similarity score and lineage",
     check: "source_type_in_enum", args: {value: "RET_CACHE_SEMANTIC"}}
  - {id: "5.1.IC.RET_FALLBACK", source: "05.1", line: "155-158",
     text: "RET_FALLBACK terminal fallback/abstain/clarify packet from L0 with safe_response_type and reason codes",
     check: "source_type_in_enum", args: {value: "RET_FALLBACK"}}
  - {id: "5.1.IC.HITL_RECLEARED_PACKET", source: "05.1", line: "159-162",
     text: "HITL_RECLEARED_PACKET carries human decision receipt, modification diff, reclearance evidence",
     check: "source_type_in_enum", args: {value: "HITL_RECLEARED_PACKET"}}

  # Required field categories (167-218)
  - {id: "5.1.RF.identity.policy_hash", source: "05.1", line: "183",
     text: "Missing policy_hash fails before X1 with POLICY_HASH_MISSING",
     check: "preflight_emits", args: {case: "policy_hash_missing", code: "POLICY_HASH_MISSING"}}
  - {id: "5.1.RF.identity.replay_key", source: "05.1", line: "185",
     text: "Missing replay_key fails before X1 with REPLAY_KEY_MISSING",
     check: "preflight_emits", args: {case: "replay_key_missing", code: "REPLAY_KEY_MISSING"}}
  - {id: "5.1.RF.route.route_contract", source: "05.1", line: "176",
     text: "Missing route_contract fails before X1 with ROUTE_CONTRACT_MISSING",
     check: "preflight_emits", args: {case: "route_contract_missing", code: "ROUTE_CONTRACT_MISSING"}}
  - {id: "5.1.RF.execution.terminal_class", source: "05.1", line: "189",
     text: "Missing terminal_classification fails with TERMINAL_CLASS_MISSING",
     check: "preflight_emits", args: {case: "terminal_class_missing", code: "TERMINAL_CLASS_MISSING"}}
  - {id: "5.1.RF.execution.sandbox_for_action", source: "05.1", line: "190",
     text: "Action without sandbox_envelope fails with SANDBOX_SCOPE_MISSING_FOR_ACTION",
     check: "preflight_emits_alias", args: {case: "action_missing_sandbox", spec_code: "SANDBOX_SCOPE_MISSING_FOR_ACTION", v6_alias: "SANDBOX_SCOPE_MISSING"}}
  - {id: "5.1.RF.execution.capability_for_tool", source: "05.1", line: "191",

# Summary (updated 2026-05-02)
# ----------------------------
# 2/7 runnable apps have working live-invocation CLIs in the harness:
#     apps_rg (reference, full end-to-end success)
#     apps_qna (closed 2026-05-02 — BYPASS-form, runs exit=0 with 6
#              legitimately-absent spine-receipt gaps)
# 5/7 (apps_eval, apps_exec, apps_lic, apps_research, apps_rfp) still
#     block past 60 s on bare `python -m <app>`. These apps need a
#     `--dry-run` or `--fixture` CLI mode — their __main__.py modules
#     directly invoke full run paths (8KB+ lifecycle trace emits). Adding
#     such a mode requires understanding each app's run_main() signature
#     and introducing a fast-path that short-circuits before the spine is
#     touched. This is app-owner work, not harness work. The harness
#     correctly catches TimeoutExpired and emits fail-closed bundles.
#
# The harness itself handles these cases correctly: emit_proof_bundle.py
# catches TimeoutExpired and writes a fail-closed bundle with exit_code=-1,
# success=false, and an explicit timeout note in blocking_gaps. The nightly
# workflow surfaces the bundles as GitHub artifacts for review.

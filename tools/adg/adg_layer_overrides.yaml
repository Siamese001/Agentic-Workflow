# ADG Layer Attribution Overrides
# This file allows explicit layer assignments for specific files or patterns
# that cannot be automatically inferred from their path.

# Format: file_pattern -> layer
# Patterns support simple shell-style wildcards (*, ?)
overrides:
  # Core framework layers (explicitly defined)
  "agentic_core/L0_routing/*": "L0"
  "agentic_core/L1_cognition/*": "L1"
  "agentic_core/L2_execution/*": "L2"
  "agentic_core/L3_orchestration/*": "L3"
  "agentic_core/L4_state/*": "L4"
  "agentic_core/L5_safety/*": "L5"
  "agentic_core/L6_observability/*": "L6"

  # Shared infrastructure and utilities
  "agentic_core/adg/*": "L_SHARED"
  "agentic_core/agents/*": "L_SHARED"
  "agentic_core/base_agents/*": "L_SHARED"
  "agentic_core/cache/*": "L_SHARED"
  "agentic_core/config/*": "L_SHARED"
  "agentic_core/embeddings/*": "L_SHARED"
  "agentic_core/enforcement/*": "L_SHARED"
  "agentic_core/evaluation/*": "L_SHARED"
  "agentic_core/interfaces/*": "L_SHARED"
  "agentic_core/knowledge/*": "L_SHARED"
  "agentic_core/mixins/*": "L_SHARED"
  "agentic_core/patterns/*": "L_SHARED"
  "agentic_core/prompt_governance/*": "L_SHARED"
  "agentic_core/runtime/*": "L_RUNTIME"
  "agentic_core/seams/*": "L_SHARED"
  "agentic_core/utils/*": "L_SHARED"
  "agentic_core/_compat/*": "L_SHARED"
  "agentic_core/case_memory/*": "L_SHARED"
  "agentic_core/cloud_native/*": "L_SHARED"
  "agentic_core/core/*": "L_SHARED"
  "agentic_core/gateway/*": "L_SHARED"
  "agentic_core/tracing/*": "L_SHARED"
  "agentic_core/visualization/*": "L_SHARED"

  # Application layers
  "apps_eval/*": "L_APP"
  "apps_exec/*": "L_APP"
  "apps_lic/*": "L_APP"
  "apps_research/*": "L_APP"
  "apps_rfp/*": "L_APP"
  "apps_rg/*": "L_APP"
  "apps_shared/*": "L_APP"
  "apps_underwriting_ai/*": "L_APP"

  # Special cases
  ".windsurf/*": "L_OPS"
  "infrastructure/*": "L_OPS"
  "tools/*": "L_TOOLS"
  "tests/*": "L_TEST"
  "docs/*": "L_DOCS"
  "scripts/*": "L_SCRIPTS"
  "ops_scripts/*": "L_OPS"

  # Configuration files
  "*.yaml": "L_CONFIG"
  "*.yml": "L_CONFIG"
  "*.json": "L_CONFIG"
  "*.toml": "L_CONFIG"
  "*.cfg": "L_CONFIG"
  "*.ini": "L_CONFIG"

  # Root files
  "README.md": "L_DOCS"
  "LICENSE": "L_CONFIG"
  "pyproject.toml": "L_CONFIG"
  "pytest.ini": "L_CONFIG"
  ".gitignore": "L_CONFIG"
  ".pre-commit-config.yaml": "L_CONFIG"

# Default layer for files not matching any pattern
default_layer: "L_UNKNOWN"

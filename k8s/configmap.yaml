---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-workflow-config
  namespace: agentic-workflow
  labels:
    app: agentic-workflow
    component: config
data:
  # Tracing Configuration
  tracing.enabled: "true"
  tracing.service.name: "agentic-workflow"
  tracing.sampling.rate: "0.1"
  tracing.exporter.endpoint: "http://jaeger-collector:14268"
  
  # Runtime ADG Configuration
  runtime_adg.enabled: "true"
  runtime_adg.persistence.enabled: "true"
  runtime_adg.persistence.interval: "30"
  runtime_adg.storage.type: "redis"
  runtime_adg.storage.endpoint: "redis:6379"
  
  # Performance Optimization Configuration
  performance.collector.batch_size: "100"
  performance.collector.compression: "true"
  performance.collector.adaptive_scheduling: "true"
  performance.collector.max_threads: "4"
  
  # Monitoring Configuration
  monitoring.enabled: "true"
  monitoring.health_check.interval: "10"
  monitoring.metrics.collection: "true"
  monitoring.alerting.enabled: "true"
  
  # ML Integration Configuration
  ml.enabled: "true"
  ml.anomaly_detection.enabled: "true"
  ml.prediction.enabled: "true"
  ml.model.retrain.interval: "24"
  
  # 3D Visualization Configuration
  visualization.enabled: "true"
  visualization.port: "8081"
  visualization.physics.enabled: "true"
  
  # API Gateway Configuration
  gateway.type: "kong"
  gateway.tracing.enabled: "true"
  gateway.metrics.enabled: "true"
  
  # Logging Configuration
  logging.level: "INFO"
  logging.format: "json"
  logging.output: "stdout"
  
  # Redis Configuration
  redis.host: "redis"
  redis.port: "6379"
  redis.db: "0"
  redis.max_connections: "10"
  
  # Jaeger Configuration
  jaeger.endpoint: "http://jaeger-collector:14268"
  jaeger.agent.host: "jaeger-agent"
  jaeger.agent.port: "6831"
  
  # Prometheus Configuration
  prometheus.enabled: "true"
  prometheus.port: "9090"
  prometheus.scrape.interval: "15"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: agentic-workflow
  labels:
    app: kong
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
      component: gateway
  template:
    metadata:
      labels:
        app: kong
        component: gateway
    spec:
      containers:
      - name: kong
        image: kong:3.4
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8443
          name: proxy-ssl
        - containerPort: 8001
          name: admin
        - containerPort: 8444
          name: admin-ssl
        - containerPort: 8002
          name: proxy-debug
        - containerPort: 8445
          name: proxy-debug-ssl
        - containerPort: 8003
          name: status
        - containerPort: 8100
          name: metrics
        env:
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.username
              optional: true
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.password
              optional: true
        - name: KONG_PG_DATABASE
          value: kong
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001
        - name: KONG_ADMIN_GUI_URL
          value: http://localhost:8002
        - name: KONG_PLUGINS
          value: bundled,zipkin,prometheus,rate-limiting,cors
        - name: KONG_TRACING_INSTRUMENTATION
          value: all
        - name: KONG_TRACING_SAMPLING_RATE
          value: "0.1"
        - name: KONG_TRACING_ZIPKIN_HTTP_ENDPOINT
          value: http://jaeger-collector:9411/api/v2/spans
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: agentic-workflow
  labels:
    app: kong
    component: gateway
spec:
  selector:
    app: kong
    component: gateway
  ports:
  - port: 80
    targetPort: 8000
    name: proxy
  - port: 443
    targetPort: 8443
    name: proxy-ssl
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: agentic-workflow
  labels:
    app: kong
    component: gateway
spec:
  selector:
    app: kong
    component: gateway
  ports:
  - port: 8001
    targetPort: 8001
    name: admin
  - port: 8002
    targetPort: 8002
    name: admin-ui
  - port: 8444
    targetPort: 8444
    name: admin-ssl
  - port: 8100
    targetPort: 8100
    name: metrics
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agentic-workflow
  labels:
    app: postgres
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      component: database
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.username
              optional: true
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.password
              optional: true
        - name: POSTGRES_DB
          value: kong
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentic-workflow
  labels:
    app: postgres
    component: database
spec:
  selector:
    app: postgres
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: agentic-workflow
  labels:
    app: postgres
    component: database
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration
  namespace: agentic-workflow
  labels:
    app: kong
    component: migration
spec:
  template:
    metadata:
      labels:
        app: kong
        component: migration
    spec:
      containers:
      - name: kong-migration
        image: kong:3.4
        command:
        - kong
        - migrations
        - bootstrap
        env:
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.username
              optional: true
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.password
              optional: true
        - name: KONG_PG_DATABASE
          value: kong
      restartPolicy: OnFailure

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-workflow-ingress
  namespace: agentic-workflow
  labels:
    app: agentic-workflow
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Tracing annotations
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
    nginx.ingress.kubernetes.io/zipkin-collector-host: "jaeger-collector"
    nginx.ingress.kubernetes.io/zipkin-collector-port: "9411"
    nginx.ingress.kubernetes.io/zipkin-service-name: "agentic-workflow-ingress"
spec:
  tls:
  - hosts:
    - agentic-workflow.local
    secretName: agentic-workflow-tls
  rules:
  - host: agentic-workflow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentic-workflow-service
            port:
              number: 8080
      - path: /visualization
        pathType: Prefix
        backend:
          service:
            name: agentic-workflow-service
            port:
              number: 8081
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: agentic-workflow-service
            port:
              number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: agentic-workflow
  labels:
    app: monitoring
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
    nginx.ingress.kubernetes.io/zipkin-collector-host: "jaeger-collector"
    nginx.ingress.kubernetes.io/zipkin-collector-port: "9411"
    nginx.ingress.kubernetes.io/zipkin-service-name: "monitoring-ingress"
spec:
  tls:
  - hosts:
    - monitoring.agentic-workflow.local
    secretName: monitoring-tls
  rules:
  - host: monitoring.agentic-workflow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090

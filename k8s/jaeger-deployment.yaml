---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-collector
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: collector
  template:
    metadata:
      labels:
        app: jaeger
        component: collector
    spec:
      containers:
      - name: jaeger-collector
        image: jaegertracing/jaeger-collector:1.50
        ports:
        - containerPort: 14250
          name: grpc
        - containerPort: 14268
          name: http
        - containerPort: 14269
          name: admin
        - containerPort: 9411
          name: zipkin
        env:
        - name: SPAN_STORAGE_TYPE
          value: elasticsearch
        - name: ES_SERVER_URLS
          value: http://elasticsearch:9200
        - name: ES_USERNAME
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.username
              optional: true
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.password
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: collector
spec:
  selector:
    app: jaeger
    component: collector
  ports:
  - port: 14250
    targetPort: 14250
    name: grpc
  - port: 14268
    targetPort: 14268
    name: http
  - port: 14269
    targetPort: 14269
    name: admin
  - port: 9411
    targetPort: 9411
    name: zipkin
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-query
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: query
  template:
    metadata:
      labels:
        app: jaeger
        component: query
    spec:
      containers:
      - name: jaeger-query
        image: jaegertracing/jaeger-query:1.50
        ports:
        - containerPort: 16686
          name: query
        - containerPort: 16687
          name: admin
        env:
        - name: SPAN_STORAGE_TYPE
          value: elasticsearch
        - name: ES_SERVER_URLS
          value: http://elasticsearch:9200
        - name: ES_USERNAME
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.username
              optional: true
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: database.password
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 16687
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 16687
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: query
spec:
  selector:
    app: jaeger
    component: query
  ports:
  - port: 16686
    targetPort: 16686
    name: query
  - port: 16687
    targetPort: 16687
    name: admin
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-agent
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jaeger
      component: agent
  template:
    metadata:
      labels:
        app: jaeger
        component: agent
    spec:
      containers:
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:1.50
        ports:
        - containerPort: 6831
          name: udp-compact
          protocol: UDP
        - containerPort: 6832
          name: udp-binary
          protocol: UDP
        - containerPort: 5775
          name: udp-legacy
          protocol: UDP
        - containerPort: 5778
          name: config
        - containerPort: 14271
          name: admin
        env:
        - name: REPORTER_GRPC_HOST_PORT
          value: jaeger-collector:14250
        - name: REPORTER_GRPC_COMMUNICATION_TYPE
          value: grpc
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 14271
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 14271
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: agentic-workflow
  labels:
    app: jaeger
    component: agent
spec:
  selector:
    app: jaeger
    component: agent
  ports:
  - port: 6831
    targetPort: 6831
    name: udp-compact
    protocol: UDP
  - port: 6832
    targetPort: 6832
    name: udp-binary
    protocol: UDP
  - port: 5775
    targetPort: 5775
    name: udp-legacy
    protocol: UDP
  - port: 5778
    targetPort: 5778
    name: config
  - port: 14271
    targetPort: 14271
    name: admin
  type: ClusterIP

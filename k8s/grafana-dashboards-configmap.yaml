---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: agentic-workflow
  labels:
    app: grafana
    component: monitoring
data:
  l0-l6-layer-health.json: |
    {
      "dashboard": {
        "id": "l0-l6-layer-health",
        "title": "L0-L6 Layer Health",
        "tags": ["agentic", "layers"],
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Active Modules by Layer",
            "type": "stat",
            "targets": [
              {
                "expr": "sum by (layer) (otelcol_process_uptime{job=\"otel-collector\"})",
                "legendFormat": "{{ layer }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Metric Events Emitted",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(emits_metric_event_total[5m])",
                "legendFormat": "Events/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "L0 Routing - Routing Decisions",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(routing_telemetry_emitted_total)",
                "legendFormat": "Total"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "L1 Cognition - Reasoning Steps",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(cognitive_steps_total)",
                "legendFormat": "Steps"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 4, "y": 8}
          },
          {
            "id": 5,
            "title": "L2 Execution - Actions",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(action_executions_total)",
                "legendFormat": "Actions"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 8, "y": 8}
          },
          {
            "id": 6,
            "title": "L3 Orchestration - Workflows",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(workflow_executions_total)",
                "legendFormat": "Workflows"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 12, "y": 8}
          },
          {
            "id": 7,
            "title": "L4 State - Snapshots",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(state_snapshots_total)",
                "legendFormat": "Snapshots"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 16, "y": 8}
          },
          {
            "id": 8,
            "title": "L5 Safety - Guardrails",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(guardrail_applications_total)",
                "legendFormat": "Guardrails"
              }
            ],
            "gridPos": {"h": 4, "w": 4, "x": 20, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  distributed-traces.json: |
    {
      "dashboard": {
        "id": "distributed-traces",
        "title": "Distributed Traces Overview",
        "tags": ["agentic", "tracing"],
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Trace Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(jaeger_collector_spans_received_total[5m])",
                "legendFormat": "Spans/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Span Types",
            "type": "piechart",
            "targets": [
              {
                "expr": "sum by (span_type) (span_count_total)",
                "legendFormat": "{{ span_type }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 3,
            "title": "Trace Duration",
            "type": "heatmap",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(trace_duration_bucket[5m])) by (le))",
                "legendFormat": "p95"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  agent-performance.json: |
    {
      "dashboard": {
        "id": "agent-performance",
        "title": "Agent Performance Metrics",
        "tags": ["agentic", "performance"],
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Agent Execution Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(agent_execution_duration_bucket[5m])) by (le, agent_type))",
                "legendFormat": "{{ agent_type }} p99"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Token Usage by Agent",
            "type": "graph",
            "targets": [
              {
                "expr": "sum by (agent_type) (tokens_total)",
                "legendFormat": "{{ agent_type }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(agent_errors_total[5m])",
                "legendFormat": "Errors/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  adg-edge-flow.json: |
    {
      "dashboard": {
        "id": "adg-edge-flow",
        "title": "ADG Edge Flow Analysis",
        "tags": ["agentic", "adg"],
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Edge Count by Type",
            "type": "graph",
            "targets": [
              {
                "expr": "sum by (edge_type) (adg_edges_total)",
                "legendFormat": "{{ edge_type }}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Violation Propagation",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(violation_propagations_total[5m])",
                "legendFormat": "Propagations/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 3,
            "title": "ADG Scan Duration",
            "type": "singlestat",
            "targets": [
              {
                "expr": "adg_scan_duration_seconds",
                "legendFormat": "Seconds"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  k8s-infrastructure.json: |
    {
      "dashboard": {
        "id": "k8s-infrastructure",
        "title": "K8s Infrastructure Health",
        "tags": ["agentic", "infrastructure"],
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Pod Status",
            "type": "table",
            "targets": [
              {
                "expr": "kube_pod_status_phase{namespace=\"agentic-workflow\"}",
                "format": "table"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"agentic-workflow\"}[5m])",
                "legendFormat": "{{ pod }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 3,
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace=\"agentic-workflow\"}",
                "legendFormat": "{{ pod }}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-workflow-core
  namespace: agentic-workflow
  labels:
    app: agentic-workflow
    component: core
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentic-workflow
      component: core
  template:
    metadata:
      labels:
        app: agentic-workflow
        component: core
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: agentic-workflow
        image: agentic-workflow:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        - containerPort: 8081
          name: visualization
        env:
        - name: TRACING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: tracing.enabled
        - name: TRACING_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: tracing.service.name
        - name: TRACING_SAMPLING_RATE
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: tracing.sampling.rate
        - name: TRACING_EXPORTER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: tracing.exporter.endpoint
        - name: RUNTIME_ADG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: runtime_adg.enabled
        - name: RUNTIME_ADG_PERSISTENCE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: runtime_adg.persistence.enabled
        - name: RUNTIME_ADG_STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: runtime_adg.storage.type
        - name: RUNTIME_ADG_STORAGE_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: runtime_adg.storage.endpoint
        - name: PERFORMANCE_COLLECTOR_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: performance.collector.batch_size
        - name: PERFORMANCE_COLLECTOR_COMPRESSION
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: performance.collector.compression
        - name: MONITORING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: monitoring.enabled
        - name: ML_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: ml.enabled
        - name: ML_ANOMALY_DETECTION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: ml.anomaly_detection.enabled
        - name: VISUALIZATION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: visualization.enabled
        - name: VISUALIZATION_PORT
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: visualization.port
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: redis.port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agentic-workflow-secrets
              key: redis.password
              optional: true
        - name: LOGGING_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: logging.level
        - name: LOGGING_FORMAT
          valueFrom:
            configMapKeyRef:
              name: agentic-workflow-config
              key: logging.format
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: agentic-workflow-config
      - name: logs-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-workflow-service
  namespace: agentic-workflow
  labels:
    app: agentic-workflow
    component: core
spec:
  selector:
    app: agentic-workflow
    component: core
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  - port: 8081
    targetPort: 8081
    name: visualization
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-workflow-lb
  namespace: agentic-workflow
  labels:
    app: agentic-workflow
    component: core
spec:
  selector:
    app: agentic-workflow
    component: core
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: visualization
  type: LoadBalancer
  loadBalancerIP: ""  # Set to specific IP if needed

# Ruff configuration for Windsurf L5 validation
# Excludes legacy test files with code quality issues while maintaining validation integrity

# Exclude legacy test directories, scripts, and supporting directories that contain pre-existing code quality issues
exclude = [
    "tests",
    "scripts", 
    "prompt_governance",
    "runtime",
]

# Line length configuration
line-length = 150

# Target Python version
target-version = "py313"

[lint]
# Select default rules
select = ["E", "F", "W"]
ignore = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

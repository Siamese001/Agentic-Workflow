line-length = 100

extend-exclude = [
    # Core auto-generated / structurally complex files
    "agent_orchestration_v10_7.py",
    "core_v10_7",
    "run_learning_v10_7.py",
    "run_batch_v10_7.py",
    "main_v10_7.py",
    "agent_tools_v10_7.py",
    "stacks_v10_7/prompting.py",

    # Tests are intentionally excluded from strict linting
    "tests",
]

[lint]
# E + F = PyFlakes + Pycodestyle errors (runtime correctness + structural hygiene)
select = ["E", "F"]

# Ignore line length (E501) globally because v10.7 prompt templates and
# A2A messages intentionally exceed Ruff’s defaults.
ignore = ["E501"]

[lint.per-file-ignores]
# These core files contain deliberate multi-line string prompts,
# async wrappers, and legacy-compatible import patterns.
"core_v10_7.py" = ["E701", "E702", "E721", "E402"]
"agent_orchestration_v10_7.py" = ["E701", "E702", "E721", "E402"]
"run_learning_v10_7.py" = ["E701", "E702", "E721", "E402"]
"run_batch_v10_7.py" = ["E701", "E702", "E721", "E402"]
"agent_tools_v10_7.py" = ["E701", "E702", "E721", "E402"]

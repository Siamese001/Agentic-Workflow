<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 2px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Dashboard Rendering Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Plotly Library</h2>
        <div id="plotly-test"></div>
        <p id="plotly-status"></p>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Data Loading</h2>
        <p id="data-status"></p>
    </div>
    
    <div class="test-section">
        <h2>Test 3: DOM Elements</h2>
        <div id="kpiGrid"></div>
        <p id="dom-status"></p>
    </div>
    
    <script>
        // Test 1: Plotly
        if (typeof Plotly !== 'undefined') {
            document.getElementById('plotly-status').innerHTML = '<span class="success">✓ Plotly loaded successfully</span>';
            
            // Create a simple test chart
            const data = [{
                x: [1, 2, 3, 4],
                y: [10, 15, 13, 17],
                type: 'scatter'
            }];
            const layout = { title: 'Test Chart', width: 400, height: 300 };
            Plotly.newPlot('plotly-test', data, layout);
        } else {
            document.getElementById('plotly-status').innerHTML = '<span class="error">✗ Plotly failed to load</span>';
        }
        
        // Test 2: Simulate data injection
        const testData = [
            { Territory: 'TOTAL', Total: 416, Health: 33.3 },
            { Territory: 'L0', Total: 24, Health: 37.5 }
        ];
        
        if (testData && testData.length > 0) {
            document.getElementById('data-status').innerHTML = '<span class="success">✓ Data array populated (' + testData.length + ' items)</span>';
        } else {
            document.getElementById('data-status').innerHTML = '<span class="error">✗ Data array empty</span>';
        }
        
        // Test 3: DOM manipulation
        const container = document.getElementById('kpiGrid');
        if (container) {
            container.innerHTML = '<div style="padding: 20px; background: #f0f0f0; border-radius: 8px;">Test KPI Box</div>';
            document.getElementById('dom-status').innerHTML = '<span class="success">✓ DOM manipulation working</span>';
        } else {
            document.getElementById('dom-status').innerHTML = '<span class="error">✗ DOM element not found</span>';
        }
        
        console.log('All tests completed');
    </script>
</body>
</html>

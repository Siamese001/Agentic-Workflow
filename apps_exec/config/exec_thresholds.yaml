# Executive Brief Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum quality score (0.0-1.0)
  min_quality_score: 0.70

  # Minimum word count per section
  min_section_words: 100

  # Maximum word count per section
  max_section_words: 2000

  # Maximum generation latency (seconds)
  max_generation_seconds: 180

# Content Requirements
content:
  # Minimum sections for valid brief
  min_sections: 4

  # Maximum sections
  max_sections: 8

  # Minimum evidence anchors per section
  min_evidence_anchors: 1

  # Maximum evidence anchors per section
  max_evidence_anchors: 10

# Audience Requirements
audience:
  # Board-ready brief requirements
  board_ready:
    min_quality_score: 0.85
    require_financial_impact: true
    max_sections: 6

  # CTO-ready brief requirements
  cto_ready:
    min_quality_score: 0.80
    require_technical_depth: true
    max_sections: 8

# Tone Requirements
tone:
  # Technical tone settings
  technical:
    allow_jargon: true
    require_implementation_details: true

  # Board-ready tone settings
  board_ready:
    allow_jargon: false
    require_business_impact: true

# Output Configuration
output:
  # Emit Markdown brief
  emit_markdown_brief: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Include provenance metadata
  include_provenance: true

  # Artifact retention (days)
  retention_days: 90

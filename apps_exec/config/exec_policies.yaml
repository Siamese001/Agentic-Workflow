# Executive Brief Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Section Requirements
section_requirements:
  executive_summary:
    required: true
    min_words: 150
    max_words: 500
    require_why_this_matters: true

  platform_overview:
    required: true
    min_words: 200
    max_words: 1000

  capabilities:
    required: true
    min_words: 300
    max_words: 1500

  implementation:
    required: false
    min_words: 200
    max_words: 2000

  governance:
    required: true
    min_words: 150
    max_words: 800

# Quality Scoring
quality_scoring:
  # Completeness weight
  completeness_weight: 0.30

  # Evidence density weight
  evidence_weight: 0.25

  # Tone consistency weight
  tone_weight: 0.25

  # Technical accuracy weight
  accuracy_weight: 0.20

  # Minimum passing score
  passing_score: 0.70

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - min_sections_present
    - required_sections_complete
    - min_evidence_anchors

  # Soft gates - can be waived with justification
  soft_gates:
    - quality_warnings
    - tone_warnings
    - length_warnings

# Style Requirements
style_requirements:
  # Maximum style violations allowed
  max_violations: 3

  # Severity levels
  severity:
    critical:
      max_allowed: 0
      blocks_gate: true

    high:
      max_allowed: 2
      blocks_gate: false

    medium:
      max_allowed: 5
      blocks_gate: false

    low:
      max_allowed: 10
      blocks_gate: false

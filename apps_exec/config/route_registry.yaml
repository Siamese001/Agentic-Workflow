# apps_exec L0 route registry.
#
# apps_exec is a SINGLE_STEP execution app — no managed workflow, no
# retry/branch/join logic. L3 runtime orchestration is correctly bypassed
# per the e2e proof spec.

app_name: apps_exec
schema_version: "apps_exec.route_registry/v1"

routes:
  - route_id: apps_exec.single_step_v1
    execution_form: SINGLE_STEP
    l3_required: false
    selected_capability: apps_exec.execution_v1
    description: >-
      Deterministic single-step execution: intake -> plan -> execute ->
      seal. No retries, branches, or joins. L3 runtime orchestration is
      not required.
    bypass_reason_when_invoked: SINGLE_STEP_ROUTE

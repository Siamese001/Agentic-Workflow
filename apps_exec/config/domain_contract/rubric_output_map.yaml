# apps_exec rubric output map — declarative L2-receipt -> dim_scores extractor.
#
# Plan: apps-runtime-domain-enforcement-a7e9d4 W2.P2 (2026-05-03).
# Consumed by apps_shared.cert.rubric_output_mapper.map_l2_receipt_to_dim_scores
# inside apps_exec/__main__.py::_run_live_cert after governed_run seals.
#
# Sibling to:
#   - apps_exec/config/domain_contract/eval_rubrics.yaml (9 rubric dims)
#   - apps_exec/config/cert_route_registry.yaml (declares this file's path)
#   - apps_exec/config/domain_contract/grader_roster.yaml (judges)
#   - apps_exec/cert/fec_producer.py (FEC producer, wired in __main__)
#
# Design rule: apps_exec has only 2 deterministic dims in its rubric
# (factual_grounding, concision). The remaining 4 dims (exec_signal_density,
# priority_ordering, no_boilerplate, decision_clarity) are hybrid — routed
# to registered graders, NOT mapped here. The 3 RAG tracked-only dims
# (context_recall/precision, answer_relevancy) are weight=0.0 judges —
# intentionally omitted so judge UNKNOWN does not block overall PASS.
#
# The cert-path live run currently marks L2_execute as "ok" without emitting
# a real brief, so deterministic dim_scores default to 0.0 -> UNKNOWN ->
# fail-closed per evidence_required=true on factual_grounding. Correct
# enforcement posture. Update receipt paths when live-cert graduates to a
# real brief-assembly flow.

mapper_id: apps_exec.brief_assembly.v1
app_id: apps_exec
rubric_id: "aer::apps_exec::brief_assembly::v1"
version: "1.0.0"
status: active

dimensions:
  # ---- deterministic dims ----
  - dimension_id: factual_grounding
    score:
      type: jsonpath
      path: $.output.factual_grounding.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.research_brief_citation_check"
      - jsonpath: $.output.factual_grounding.cited_claims
        prefix: "cited:"
      - jsonpath: $.output.factual_grounding.uncited_claims
        prefix: "uncited:"

  - dimension_id: concision
    score:
      type: jsonpath
      path: $.output.concision_check.score
      default: 0.0
      clamp: [0.0, 1.0]
    evidence:
      - literal: "grader=deterministic.word_count_vs_depth"
      - template: "word_count={$.output.concision_check.word_count} depth={$.output.concision_check.depth}"

  # ---- hybrid + judge dims (resolved by registered graders) ----
  # exec_signal_density  (hybrid) -> grader_roster.yaml
  # priority_ordering    (hybrid) -> grader_roster.yaml
  # no_boilerplate       (hybrid) -> grader_roster.yaml
  # decision_clarity     (hybrid) -> grader_roster.yaml
  # context_recall       (judge, weight=0.0) -> producer/judge
  # context_precision    (judge, weight=0.0) -> producer/judge
  # answer_relevancy     (judge, weight=0.0) -> producer/judge
  # Intentionally omitted.

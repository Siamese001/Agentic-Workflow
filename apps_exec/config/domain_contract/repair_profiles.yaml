# apps_exec repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.3
repair_profile_id: rp::apps_exec::brief_assembly::v1
app_id: apps_exec
version: 1.0.0
status: active
source_app_config_ref: apps_exec/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: retry_on_low_brief_completeness
    stage_id: brief_assembly
    trigger_condition: score_below_threshold:brief_completeness:0.8
    recovery_action: retry_with_expanded_context:research_snippets
    rollback_target: brief_assembly
    healing_trigger: brief_completeness
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 1

  - scenario_id: retry_on_missing_recommendation
    stage_id: brief_assembly
    trigger_condition: output_missing:recommendation_section
    recovery_action: retry_with_backoff:2
    rollback_target: brief_assembly
    healing_trigger: ''
    escalation_path: mark_partial_pass
    max_attempts: 2
    priority: 2

  - scenario_id: retry_on_low_executive_positioning
    stage_id: brief_assembly
    trigger_condition: score_below_threshold:executive_positioning:0.6
    recovery_action: retry_with_expanded_context:generation_prompt
    rollback_target: brief_assembly
    healing_trigger: executive_positioning
    escalation_path: mark_partial_pass
    max_attempts: 2
    priority: 3

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 4

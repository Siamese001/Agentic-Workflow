# apps_rfp spine manifest
#
# Declares which spine route types apps_rfp serves so the
# runtime-mode scanner (tools/analysis/apps_spine_coverage.py) can
# verify direct surfacing of the canonical R3 contract chain.
#
# This manifest is STATIC EVIDENCE only. It declares the contract
# surface apps_rfp delegates THROUGH (transitively today, via
# apps_shared.integrations.governed_app_runner.GovernedAppRunner).
# It is NOT a runtime certification claim. Runtime trace (OTel spans
# hitting each contract surface) is what proves the contracts are
# actually exercised end-to-end.
#
# Format: docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md
#         §"Route-Shape Taxonomy for apps_*"
# Pattern: mirrors apps_research W9 and apps_lic W11.
# Pre-migration audit: apps_rfp was confirmed R3_grounded_read,
#   NOT R3R4_managed_workflow. The audit found ZERO matches in
#   apps_rfp/ for: CommitRequest, commit_request, StateDiffCandidate,
#   proposed_state_diff, MutationIntent, durable_write, write_gateway,
#   outbox, proposal_store, compliance_log. The apparent ``submit``
#   surfaces are misleading: ExecutionAdapter.submit() is an in-memory
#   log append (self._execution_log.append), and
#   submission_validator_service.py is a stub returning {"valid": True}.
# Precursor: apps_rfp/_compat/lifecycle_trace.py was retired in the
#   commit immediately preceding this migration; all 25 imports across
#   21 files now point directly at agentic_core.runtime.contracts.
#   lifecycle_trace_contract, bringing apps_rfp into shape with the
#   rest of the family.

schema_version: 1
app: apps_rfp

claimed_routes:
  - type: R3_grounded_read
    description: >-
      On-demand RFP proposal grounded synthesis. RfpRequest
      (problem_statement + industry + architecture_posture +
      delivery_timeline_weeks) → query construction → L1
      query_planner.decompose_query → L0 AgenticRouter.route
      (target=rfp_proposal_assembly) → C0 hybrid retrieval over the
      ``rfp_docs`` collection (degrades gracefully when absent) →
      L2 authorize_and_execute → L5+L6 evaluate_and_emit. Output is
      a sealed proposal artifact (GovernedRfpE2ERunRecord +
      RfpResult) carrying grounded citations + support coverage +
      the RFP domain context (industry, architecture_posture,
      problem_statement). The user reviews the proposal and forwards
      it externally -- no portal API call, no compliance-log write,
      no L4 admission.
    notes:
      - "No CommitRequest expected -- the GovernedRfpE2ERunRecord shape carries no commit / durable-write field."
      - "No portal submission -- explicitly out of scope per apps_rfp/SVP_ENGINEERING_REVIEW.md ('Bid submission to portals. Out of scope -- apps_rfp produces the document.') and apps_rfp/SLO.md ('Out of Scope: Bid submission / portal integration')."
      - "ExecutionAdapter.submit() at apps_rfp/integrations/execution_adapter.py is an in-memory log append (self._execution_log.append) decorated with @traces_execute(layer='L4_STATE') as a TELEMETRY ANNOTATION only -- not a real UWG call. Same naming-without-substance pattern exists in apps_research / apps_exec / apps_lic execution adapters."
      - "submission_validator_service.py is a STUB (validate_submission returns {valid: True, errors: []}); not a real validator, not a real submission path."
      - "artifacts/rfp/ output directory (default --out) is LOCAL output-artifact persistence -- the RfpResult.artifact_paths field. Same shape as apps_research / apps_exec / apps_lic local artifact directories. Not L4 durable state."
      - "No R3R4_managed_workflow semantics -- audit found no durable-write surface; promoting to R3R4 would be contract theater that contradicts the app's documented charter."
      - "No build_time_compiler semantics -- requests run on demand, not at build time."
      - "No formal exception -- apps_rfp uses the standard GovernedAppRunner substrate; not exempt."
      - "Direct contract surfacing required for scanner visibility -- see spine_handoff.py."
      - "Precursor: apps_rfp/_compat/lifecycle_trace.py was retired immediately before this migration; lifecycle-trace imports across apps_rfp/ now point directly at agentic_core."

# HITL posture (informational, not a route-shape modifier):
#   apps_rfp.integrations.governed_rfp_run.GovernedRfpRun does NOT
#   declare HITL_ENABLED (defaults False per GovernedAppRunner). This
#   is a *weaker* HITL posture than apps_lic and apps_exec, which
#   both opt-in to runtime HITL. apps_rfp does not opt in -- the
#   review of generated proposals happens out-of-band by the
#   operator, not via the spine's runtime HITL escalation path.
#   This is consistent with the R3_grounded_read shape (HITL is
#   orthogonal; the route shape is determined by the contract
#   chain, not the HITL flag).

# Apparent "submit"/"submission" hits in apps_rfp/ all decompose to:
#   (a) string content of sample RFP markdown documents
#       (data/sample_rfps/*.md) describing vendor submission deadlines
#       in mock RFP scenarios -- READ INPUT, not a write surface;
#   (b) prompt-template strings about RFP analysis;
#   (c) ExecutionAdapter.submit (in-memory log append; see above);
#   (d) submission_validator_service stub (see above);
#   (e) RUNBOOK.md operator-guidance prose ("DO NOT submit ...")
#       which is a runbook instruction to a HUMAN, not an automatic
#       submission code path.
# None of these constitute a real durable-write or portal-submission
# surface. The pre-migration audit verified this.

# References:
# - apps_rfp/integrations/spine_handoff.py
#     Direct R3 contract surface; delegates unchanged to GovernedRfpRun.
# - apps_rfp/integrations/governed_rfp_run.py
#     The GovernedAppRunner subclass that drives the L1->L0->C0->L2->L5+L6 pipeline.
# - apps_rfp/scripts/run_rfp.py
#     CLI entrypoint that loads RfpRequest, runs the orchestrator under
#     otel_lifecycle_capture, and saves a local artifacts/rfp/ output
#     directory. NO durable-state writes. NO portal calls.
# - apps_rfp/SVP_ENGINEERING_REVIEW.md and apps_rfp/SLO.md
#     Doctrine documents that explicitly disclaim portal submission as
#     out of scope. These are the load-bearing signals that prove
#     R3_grounded_read (not R3R4) is the correct classification.
# - apps_research/spine_manifest.yaml + apps_lic/spine_manifest.yaml
#     Sibling R3_grounded_read manifests -- this manifest mirrors their shape.
# - apps_shared/integrations/governed_app_runner.py
#     Shared substrate (transitive contract delegation today).
# - docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md
# - tools/analysis/apps_spine_coverage.py
#     R3_grounded_read row in ROUTE_TYPE_CONTRACT_REQUIREMENTS.

# Disclaimer (constitutional honesty):

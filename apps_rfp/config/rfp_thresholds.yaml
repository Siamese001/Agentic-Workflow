# RFP Proposal Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum quality score (0.0-1.0)
  min_quality_score: 0.70

  # Minimum word count per section
  min_section_words: 100

  # Maximum generation latency (seconds)
  max_generation_seconds: 300

  # Maximum gate check latency (seconds)
  max_gate_check_seconds: 30

# Content Requirements
content:
  # Minimum sections for valid proposal
  min_sections: 5

  # Maximum sections
  max_sections: 10

  # Minimum roadmap phases
  min_roadmap_phases: 3

  # Maximum roadmap phases
  max_roadmap_phases: 5

  # Maximum risk items
  max_risks: 20

  # Maximum assumptions
  max_assumptions: 10

# Architecture Review
architecture_review:
  # Require architecture section
  require_architecture: true

  # Require security assessment
  require_security: true

  # Require implementation roadmap
  require_roadmap: true

  # Postures to evaluate
  allowed_postures:
    - "cloud-first"
    - "hybrid"
    - "sovereign"
    - "regulated"

# Risk Assessment
risk_assessment:
  # Require risk matrix
  require_risk_matrix: true

  # Maximum acceptable CRITICAL risks
  max_critical_risks: 2

  # Maximum acceptable HIGH risks
  max_high_risks: 5

  # All risks must have mitigation
  require_mitigation: true

# Output Configuration
output:
  # Emit Markdown proposal
  emit_markdown_proposal: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Include provenance metadata
  include_provenance: true

  # Artifact retention (days)
  retention_days: 90

# apps_rfp repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.3
repair_profile_id: rp::apps_rfp::rfp_response::v1
app_id: apps_rfp
version: 1.0.0
status: active
source_app_config_ref: apps_rfp/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: retry_on_low_win_theme_alignment
    stage_id: proposal_assembly
    trigger_condition: score_below_threshold:win_theme_alignment:0.7
    recovery_action: retry_with_expanded_context:win_themes
    rollback_target: proposal_assembly
    healing_trigger: win_theme_alignment
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 1

  - scenario_id: retry_on_missing_requirement_coverage
    stage_id: proposal_assembly
    trigger_condition: score_below_threshold:requirement_coverage:0.85
    recovery_action: retry_with_expanded_context:rfp_sections_cited
    rollback_target: proposal_assembly
    healing_trigger: requirement_coverage
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 2

  - scenario_id: abort_on_fabricated_capability
    stage_id: proposal_assembly
    trigger_condition: score_below_threshold:factual_accuracy:0.9
    recovery_action: abort_run
    rollback_target: none
    escalation_path: escalate_to_hitl
    max_attempts: 1
    priority: 3

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 4

# apps_rfp Fort Knox app-domain contract — generated from tools/apps_proof/generate_compact_app_contracts.py
- eval_rubric_id: aer::apps_rfp::rfp_response::v1
  app_id: apps_rfp
  task_class: rfp_response
  version: 1.0.0
  status: active
  policy_hash: policy://apps_rfp/v1
  score_dimensions:
  - dimension_id: requirement_coverage
    description: Every RFP requirement addressed.
    weight: 0.25
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: factual_grounding
    description: Claims cite company KB or past wins.
    weight: 0.2
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: compliance_with_rfp_constraints
    description: Page limits, format, required sections per RFP.
    weight: 0.15
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: false
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: competitive_positioning
    description: Clear differentiation vs common competitors.
    weight: 0.1
    grader_type: hybrid
    min_required_score: 0.55
    evidence_required: false
    fail_closed_if_unknown: true
    taxonomy_class: capability
  - dimension_id: win_theme_alignment
    description: Response aligns with identified win themes.
    weight: 0.1
    grader_type: llm_as_judge
    min_required_score: 0.55
    evidence_required: false
    fail_closed_if_unknown: false
    taxonomy_class: capability
    informational_only: true  # ADR-082: tracked-only pending judge implementation (W4 policy resolution dec_19dedd3f565173b7f)
  - dimension_id: no_fabricated_credentials
    description: Every claimed capability/cert is in company KB.
    weight: 0.1
    grader_type: deterministic
    min_required_score: 0.99
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  - dimension_id: pricing_integrity
    description: No unauthorized pricing commitments.
    weight: 0.1
    grader_type: deterministic
    min_required_score: 0.99
    evidence_required: true
    fail_closed_if_unknown: true
    taxonomy_class: regression
  # W3.P5 / apps-eval-harness-closeout-b7c9d2 W1.P1 - RAG metric dims with
  # OpenAI canonical baselines (context_recall 0.85, context_precision 0.70,
  # answer_relevancy 0.80). weight=0.0 keeps the existing weighted overall
  # unchanged; these dims are tracked-only until upstream producers populate
  # output[dim_scores][dim_id]. fail_closed_if_unknown=false prevents
  # cascading fails on runs where the producer has not wired the metric yet.
  - dimension_id: context_recall
    description: RAG retrieval completeness (observed-evidence over needed-evidence).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.85
    evidence_required: true
    fail_closed_if_unknown: false
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::context_recall_judge::v2
  - dimension_id: context_precision
    description: RAG retrieval precision (signal-to-noise in retrieved chunks).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.70
    evidence_required: true
    fail_closed_if_unknown: false
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::context_precision_judge::v2
  - dimension_id: answer_relevancy
    description: Answer relevancy to the task intent.
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.80
    evidence_required: true
    fail_closed_if_unknown: false
    taxonomy_class: tracked_metric
    grader_roster:
      - qna::answer_relevancy_judge::v2
  source_app_config_ref: apps_eval/config/rubrics/
  created_at: '2026-05-01'

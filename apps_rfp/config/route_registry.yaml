# apps_rfp L0 route registry.
#
# apps_rfp is a SINGLE_STEP proposal-assembly app — single-hop proposal
# assembly engine, no managed workflow. L3 runtime orchestration is
# correctly bypassed per the e2e proof spec. Uses deterministic fixture-
# backed C0 grounding and deterministic prompt-template assembly.

app_name: apps_rfp
schema_version: "apps_rfp.route_registry/v1"

routes:
  - route_id: apps_rfp.single_step_v1
    execution_form: SINGLE_STEP
    l3_required: false
    selected_capability: apps_rfp.proposal_assembly_v1
    description: >-
      Deterministic single-step proposal assembly: intake -> retrieve
      evidence -> assemble prompt -> assemble proposal -> seal. No
      retries, branches, or joins. L3 runtime orchestration is not
      required.
    bypass_reason_when_invoked: SINGLE_STEP_ROUTE

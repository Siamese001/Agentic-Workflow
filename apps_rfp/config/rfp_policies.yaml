# RFP Proposal Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Section Requirements
section_requirements:
  executive_summary:
    required: true
    min_words: 200
    max_words: 1000

  problem_statement:
    required: true
    min_words: 100
    max_words: 500

  proposed_solution:
    required: true
    min_words: 300
    max_words: 2000

  architecture:
    required: true
    min_words: 200
    max_words: 1500

  implementation_roadmap:
    required: true
    min_phases: 3
    max_phases: 5

  risk_assessment:
    required: true
    min_risks: 3
    max_risks: 20

  assumptions:
    required: false
    max_assumptions: 10

# Quality Scoring
quality_scoring:
  # Completeness weight
  completeness_weight: 0.30

  # Clarity weight
  clarity_weight: 0.25

  # Architecture alignment weight
  architecture_weight: 0.25

  # Risk coverage weight
  risk_weight: 0.20

  # Minimum passing score
  passing_score: 0.70

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - min_sections_present
    - required_sections_complete
    - no_unmitigated_critical_risks

  # Soft gates - can be waived with justification
  soft_gates:
    - quality_warnings
    - latency_warnings
    - assumption_count

# Risk Matrix Rules
risk_matrix:
  severity_levels:
    CRITICAL:
      score: 4
      max_acceptable: 2
      requires_approval: true

    HIGH:
      score: 3
      max_acceptable: 5
      requires_approval: false

    MEDIUM:
      score: 2
      max_acceptable: 10
      requires_approval: false

    LOW:
      score: 1
      max_acceptable: 20
      requires_approval: false

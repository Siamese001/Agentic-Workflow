# Research Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Section Requirements
section_requirements:
  introduction:
    required: true
    min_words: 100
    max_words: 300
    require_sources: true

  evidence_review:
    required: true
    min_words: 200
    max_words: 1500
    require_sources: true

  analysis:
    required: true
    min_words: 300
    max_words: 2000
    require_interpretation: true

  conclusions:
    required: true
    min_words: 150
    max_words: 500
    require_summary: true

# Claim Type Requirements
claim_types:
  direct_evidence:
    min_confidence: 0.70
    require_source: true

  interpretation:
    min_confidence: 0.50
    max_ratio: 0.30

  analyst_inference:
    min_confidence: 0.60
    max_ratio: 0.20

  assumption:
    min_confidence: 0.40
    max_ratio: 0.10

# Quality Scoring
quality_scoring:
  # Evidence density weight
  evidence_weight: 0.35

  # Source credibility weight
  credibility_weight: 0.25

  # Analysis depth weight
  depth_weight: 0.25

  # Technical accuracy weight
  accuracy_weight: 0.15

  # Minimum passing score
  passing_score: 0.70

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - min_sources_present
    - evidence_based_claims
    - required_sections_complete

  # Soft gates - can be waived with justification
  soft_gates:
    - quality_warnings
    - confidence_warnings
    - length_warnings

# Research Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum quality score (0.0-1.0)
  min_quality_score: 0.70

  # Minimum word count per section
  min_section_words: 150

  # Maximum word count per section
  max_section_words: 3000

  # Maximum generation latency (seconds)
  max_generation_seconds: 300

# Content Requirements
content:
  # Minimum sections for valid research
  min_sections: 3

  # Maximum sections
  max_sections: 10

  # Minimum sources required
  min_sources: 3

  # Maximum sources per section
  max_sources: 10

# Evidence Requirements
evidence:
  # Require evidence-based claims
  require_evidence_based: true

  # Minimum confidence for direct evidence claims
  min_confidence: 0.7

  # Maximum interpretation ratio
  max_interpretation_ratio: 0.3

# Mode Settings
modes:
  brief:
    min_sections: 3
    max_sections: 6
    min_sources: 3

  comparison:
    min_sections: 1
    max_sections: 4
    min_sources: 2

  trend:
    min_sections: 4
    max_sections: 8
    min_sources: 5

  position:
    min_sections: 3
    max_sections: 6
    min_sources: 4

  thought_leadership:
    min_sections: 5
    max_sections: 10
    min_sources: 6

# Output Configuration
output:
  # Emit Markdown report
  emit_markdown_report: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Include provenance metadata
  include_provenance: true

  # Artifact retention (days)
  retention_days: 90

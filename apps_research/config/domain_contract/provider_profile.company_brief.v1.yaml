# Provider Profile for apps_research / company_brief
#
# Provider-specific configuration for L2 execution.
# Defines approved external model lanes, fallback policies, and gateway behavior.

profile_id: apps_research_provider_profile_company_brief_v1
app_id: apps_research
task_class: company_brief
schema_version: "1.0"

# Approved model lanes (from lowest to highest priority)
approved_model_lanes:
  # Primary lane: external Claude via the generic provider gateway
  primary:
    lane_id: research_synthesis_primary
    provider: external_claude
    model: claude-sonnet-4-6
    
    capabilities:
      - json_mode
      - structured_output
      - long_context
    
    capacity:
      max_concurrent: 4
      timeout_seconds: 120
      
    reliability:
      credential_env_var: ANTHROPIC_API_KEY
      circuit_breaker_threshold: 3
      
  # Fallback lane: external OpenAI-compatible provider with reduced context
  fallback_1:
    lane_id: research_synthesis_fallback
    provider: external_openai
    model: gpt-5.4-mini
    
    modifications:
      max_tokens: 2048
      temperature: 0.2
      
# Lane selection policy
lane_selection:
  strategy: priority_order
  
  selection_criteria:
    - lane_health_status
    - current_capacity
    - estimated_latency
    
  promotion_rules:
    promote_on_primary_failure: true
    promote_to_next_priority_after: 2_retries

# Gateway configuration
gateway:
  type: generic_approved_lane
  implementation: provider_gateway_v1
  
  request_formatting:
    method: chat_completions_api
    message_structure:
      system: S0+D0+I0+E0+M0 slots
      user: U0 slot
      context: C0 slot (marked data_only)
    
    response_format:
      type: json_object
      schema_binding: strict
  
  error_handling:
    on_provider_error: retry_with_fallback
    on_timeout: promote_to_next_lane
    on_invalid_json: attempt_repair
    on_schema_violation: fail_closed
  
  retry_policy:
    max_attempts_per_lane: 2
    max_total_attempts: 4
    backoff: exponential_jitter

# Provider call constraints
call_constraints:
  # L2 may only call through generic gateway
  direct_provider_calls_blocked: true
  
  # All calls must go through approved lanes
  lane_verification_required: true
  
  # Call must include full execution context
  context_preservation_required: true
  
  # Response must be validated before return
  response_validation_required: true

# Capacity management
capacity:
  external_api:
    max_requests: 4
    max_tokens_per_minute: 100000
    queue_policy: fail_fast

# Health monitoring
health_monitoring:
  enabled: true
  
  checks:
    - credential_env_var: ANTHROPIC_API_KEY
      interval_seconds: 30
      timeout_seconds: 5
      
  circuit_breaker:
    failure_threshold: 3
    recovery_timeout_seconds: 60
    
  metrics_to_emit:
    - latency_p50
    - latency_p99
    - success_rate
    - token_throughput

# Fallback cascade
fallback_cascade:
  level_1: retry_same_lane_with_backoff
  level_2: promote_to_next_priority_lane
  level_3: fail_closed_with_receipt

# Cost/performance tradeoffs (for future budget controls)
tradeoffs:
  note: "External providers are metered; keep company-brief synthesis scoped to reviewed sources."
  prioritize: quality_over_speed
  accept_latency: up_to_30_seconds

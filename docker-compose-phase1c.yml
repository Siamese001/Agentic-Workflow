version: '3.8'

services:
  phase1c-validator:
    build:
      context: .
      dockerfile: runtime/phase_1c_dockerfile
    container_name: agentic-workflow-phase1c
    volumes:
      # Mount current directory as read-only for safety
      - type: bind
        source: .
        target: /app
        read_only: true
      # Allow write access to schemas/ for execution report
      - type: bind
        source: ./schemas
        target: /app/schemas
      # Allow write access to data/ for execution report
      - type: bind
        source: ./data
        target: /app/data
    environment:
      - PYTHONPATH=/app
      - PHASE_1C_DRY_RUN=false
      - PHASE_1C_VALIDATE_ONLY=false
    restart: "no"
    networks:
      - phase1c-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; print('Phase 1C validator ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  phase1c-network:
    driver: bridge
    internal: true

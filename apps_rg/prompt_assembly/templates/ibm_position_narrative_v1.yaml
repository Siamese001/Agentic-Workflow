# Spec SSOT for ibm_narrative (compile uses w7 shell + YAML spec layers in ibm_narrative_pa).
# Marker: UNIFY_IBM_PROMPT_CORE_LAW_V3 — pa_core_law_v1 references; X2 gates in PRODUCT_SHAPE append only.
# Core PA law SSOT: apps_rg/prompt_assembly/pa_core_law_v1.yaml
# forbidden_slot_body_source: strategic_tailor_v1

schema_version: "prompt_template_v1"
template_id: "ibm_position_narrative_v1"
version: "1.2"
allowed_stage: "L2_EXEC"
rewrite_intent: "IBM_NARRATIVE"
pa_core_law_ref: apps_rg/prompt_assembly/pa_core_law_v1.yaml
forbidden_slot_body_source: strategic_tailor_v1
execution_order: "AFTER_IBM_BULLET_FACT_CHECK"

purpose: |
  Write exactly one role-level CAPSTONE sentence for IBM employment after finalized IBM bullets (read-only companion).
  The sentence must synthesize how IBM anchored enterprise-scale cloud, data, lineage, observability, and platform
  modernization in regulated contexts — complementary to each bullet theme, NOT a recap of bullet metrics or labels.
  JD, briefing, title, and company are targeting inputs only (never cited as résumé proof).
  Facts in claim_ledger source_fact_ids may ONLY bul_ibm_* tokens from ALLOWED_SOURCE_FACT_IDS.
  Do NOT claim IBM performed Unify-era agentic systems work; conceptual “later AI / production platform leadership”
  framing is allowed only when stated as directional career positioning, not proof.

sovereign_oath: |
  IBM NARRATIVE — capstone sentence only (not bullet recap). pa_truth_oath_v1, pa_proof_binding_v1,
  pa_targeting_only_v1 (pa_core_law_v1.yaml). Proof: bul_ibm_* from ALLOWED_SOURCE_FACT_IDS; companion bullets read-only.
  No Unify-era agentic stack as IBM proof; no candidate name; one sentence. Forbidden terms: see forbidden_terms_in_narrative.
  Runtime compile I0: ibm_narrative_pa from this spec; X2 gates via PRODUCT_SHAPE append only.

north_star_semantic_contract: |
  Preferred QUALITY silhouette (PARAPHRASE allowed; MUST stay bul_ibm_*-grounded via claim_ledger; not a required verbatim string):

  At IBM, led enterprise-scale cloud, data, lineage, observability, and platform modernization work for regulated
  financial services, establishing reliability, governance, and partnership discipline for enterprise-scale delivery.

  PROMPT-ONLY BOUNDARY (never appear in narrative_sentence display text):
  - Do not write meta-disclaimers such as "without claiming", "without asserting", "not claiming", or "did not assert".
  - Do not use career-bridge phrasing: "supported later", "subsequent roles", "later production AI platform leadership".
  - Do not imply IBM delivered modern agentic platform products or Unify-era agentic runtime ownership.
  - Express IBM as enterprise cloud, data, lineage, observability, reliability, and governance foundation only.

  North-star checks (self-enforce plus deterministic gates):
  - Exactly ONE sentence ending with one period; IBM appears exactly once as employer anchor (case-insensitive "IBM").
  - Polished executive SVP-engineering résumé tone; synthesis / positioning — not stacked KPI recap.
  - Third person OR implied subject; no em dash; no inline [n] citations; no bullet characters.

source_authority_hierarchy:
  proof_sources:
    - "canonical IBM bullets / bul_ibm_* facts listed in ALLOWED_SOURCE_FACT_IDS"
    - "finalized IBM bullets, read-only (companion fence) AFTER acceptance — never pasted as proof"
  targeting_context_only:
    - "target_title"
    - "target_company"
    - "jd_text"
    - "briefing"
  authority_rules:
    - "Facts + allowed IDs decide WHAT can be claimed."
    - "JD / title / company / briefing decide emphasis and vocabulary, not proof."
    - "Do not invent target-company experience as IBM experience."
    - "Finalized IBM bullets are companion context only; do not mechanically repeat bullet metrics; companion bullet source_fact_ids are not proof unless duplicated in ibm_narrative SRFS allowlist."

claim_ledger_coverage_contract: |
  Every MATERIAL theme visible in narrative_sentence MUST be backed by at least one claim_ledger row whose
  source_fact_ids include the matching bul_ibm_* fact (subset of ALLOWED_SOURCE_FACT_IDS).
  Do NOT collapse unrelated themes into a single row tied only to bul_ibm_001.

  Theme → fact ID mapping (when the theme appears materially in the sentence):
  - Reliability / enterprise AI & analytics platforms / regulated financial context → bul_ibm_001
  - Cloud modernization / migration / infrastructure foundation → bul_ibm_002
  - Reusable platform / shared services / lifecycle / reducing operational burden → bul_ibm_003
  - Lineage / observability / instrumentation / distributed data / regulatory response speed → bul_ibm_004
  - Partnerships / hyperscaler alliances / ecosystem execution → bul_ibm_005

  Prefer MULTIPLE concise claim_ledger rows (one per material clause) over one row that cannot justify the full sentence.
  Each claim_ledger row MUST cite at most two bul_ibm_* roots aligned to that clause's theme.
  Do NOT cite three or more bul_ibm_* ids on a single row.
  Do NOT use career-bridge phrasing ("supported later", "subsequent roles", "later production AI platform leadership")
  unless an explicit career-bridge fact id exists in ALLOWED_SOURCE_FACT_IDS (default: omit such framing).

role_header_fields:
  company:
    source: "canonical_json.employment[exp_ibm_001].employer"
    writable: false
    value: "IBM"
  location:
    source: "canonical_json.employment[exp_ibm_001].location"
    writable: false
    value: "Edgewater, NJ"
  historical_title:
    source: "canonical_json.employment[exp_ibm_001].title"
    writable: false
    value: "Lead Client Partner"
  dates:
    source: "canonical_json.employment[exp_ibm_001].start_date / end_date"
    writable: false
    value: "2017-04 to 2022-10"

input_contract:
  required_fields:
    - finalized_ibm_bullets:
        schema: "{bullets: [{bullet_id, bullet_text, source_fact_id}]}"
        access_level: "READ_ONLY_ANTI_REPETITION"
        constraints:
          - "May not copy bullet_text"
          - "May not mirror bullet sentence structure"
          - "May not repeat bullet metrics (see metric_handling_rules — default NONE)"
    - selected_fact_plan:
        schema: "{exp_ibm_001: {priority: 2, narrative_angle: string}}"
    - base_resume_json_ref:
        value: "apps_rg/resume/base/amit_ayer_base_resume_v1.json"
    - base_section_hash:
        description: "SHA256 of IBM employment section"
    - claim_ledger_from_bullets:
        schema: "{claims: [{claim_text, source_fact_id, supported: bool, used_in_narrative: bool}]}"
    - narrative_intent:
        allowed_values: ["COMPLEMENT_BULLETS", "FOUNDATION_POSITIONING", "ENTERPRISE_CONTEXT"]
        default: "FOUNDATION_POSITIONING"

output_contract:
  format: "JSON"
  required_fields:
    - narrative_sentence:
        type: "string"
        constraints:
          - "Exactly one sentence"
          - "Preferred 34–48 words; hard maximum 58 words"
          - "Hard maximum ~360 characters"
          - "No bullet characters (•, -, *)"
          - "No line breaks"
          - "No numbering"
        max_length: "~360 characters (<=58 words)"
        style: "Complementary capstone — not a bullet digest"
        positioning: "IBM as enterprise-scale foundation relevant to later production AI leadership (no Unify proof import)"
        anti_patterns:
          - "Summarizing bullet achievements"
          - "Repeating bullet metrics"
          - "Listing bullet topics"
          - "Copying bullet sentence structure"
          - "Stacked consulting abstract nouns without executive meaning"
          - "Introducing new metrics not in base or bullets"
    - selected_fact_plan:
        type: "object"
    - claim_ledger:
        type: "array"
        item_schema:
          claim_text: "string (non-empty material prose after trim)"
          source_fact_ids: "array[string] — each token MUST appear in ALLOWED_SOURCE_FACT_IDS"
    - jd_alignment:
        type: "object"
    - gap_notes:
        type: "array"
    - change_log:
        type: "array"
    - self_check:
        type: "object"

optional_design_review_contract:
  description: >
    Historical STOP-8 QA payloads may include drift_check / anti_repetition blocks.
    Canonical runtime slice omits these optional objects; deterministic gates enforce drift IBM-only scope.

drift_check:
  type: "object"
  description: "Detection of Unify runtime claim drift into IBM narrative (design-review signal)"
  schema:
    unify_terms_detected: "array[string] — any agentic/GraphRAG/orchestration terms found"
    runtime_inflation_score: "float 0.0-1.0 (must be 0.0)"
    foundation_vs_runtime_frame: "enum[foundation, runtime, mixed] — must be 'foundation'"
    drift_check_passed: "boolean (must be true)"

anti_repetition_check:
  type: "object"
  schema:
    bullet_metrics_repeated: "array[string]"
    bullet_labels_repeated: "array[string]"
    sentence_structure_similarity: "float 0.0-1.0 (should be < 0.3)"
    complement_score: "float 0.0-1.0 (should be > 0.7)"
    check_passed: "boolean"

narrative_complement_guidance:
  purpose: |
    POSITION IBM as the enterprise-scale foundation chapter: cloud, data, lineage, observability, reusable platform
    discipline, and partnership execution in regulated financial services — setting up later production AI platform
    leadership WITHOUT claiming IBM shipped modern agentic platform products and WITHOUT naming Unify as proof.
  angle_options:
    - "Enterprise mandate: governed delivery and reliability culture in regulated financial institutions"
    - "Platform + data foundations: modernization, lineage, observability, and operational discipline"
    - "Ecosystem execution: alliances and portfolio motion that scale delivery"
  avoid:
    - "Any exact phrase 'agentic AI' or other forbidden stack tokens from sovereign_oath"
    - "Re-listing bullet KPIs ($15M, 30%, 50%, 25%, 99.9%) — prefer conceptual language (see metric_handling_rules)"
    - "Weak abstract stacks: concentrated enterprise…, tightening reliability posture, migration cadence (as jargon),
      client-facing instrumentation (as filler), so delivery stayed predictable"
    - "Echoing bullet sentence structure (Subject-Verb-Object stacked achievements)"
    - >-
      Test/plumbing/mock language in normalized JSON payloads (never write phrases like mocked_runtime_slice,
      'provider not requested', mock_fallback, mocked_judge (as text), plumbing only, plumbing_only,
      test-only in narrative_sentence / change_log / gap_notes / claim_ledger texts / self_check).
  example_anti_patterns:
    - bad: "Led agentic AI platform development and multi-agent orchestration at IBM."
      reason: "Uses forbidden Unify-era stack phrasing; inflates IBM beyond bul_ibm_* scope"
    - bad: "Architected cloud-native platforms generating $15M in revenue while reducing costs by 30% and achieving 99.9% uptime."
      reason: "Repeats bullet metrics as the spine of the sentence"
    - bad: "• Delivered enterprise platforms • Built partnerships • Reduced latency"
      reason: "Bullet list format forbidden — must be one sentence"
    - bad: "Built the governed AI runtime foundation later productized at Unify."
      reason: "Imports Unify as proof and uses runtime stack vocabulary"
    - bad: "Concentrated enterprise cloud outcomes by tightening reliability posture and migration cadence with client-facing instrumentation."
      reason: "Consulting-fluff stack; weak executive résumé voice; likely under-maps claim_ledger to facts"
    - bad: "establishing the reliability and governance discipline that supported later production AI platform leadership"
      reason: "Career-bridge phrasing forbidden in display text; X2 fails clause decomposition"
    - good: "At IBM, led enterprise-scale cloud, data, lineage, and observability foundations for regulated financial services, establishing governed delivery and platform discipline that scaled analytics and modernization across enterprise lines of business."
      reason: "Capstone synthesis stays IBM-scoped; no later-role bridge; multi-theme without bullet metric replay"

metric_handling_rules:
  default_policy: "Do NOT restate bullet metrics in narrative_sentence when companion bullets already carry the canonical KPI set (99.9%, 30%, 25%, 50%, $15M). Prefer conceptual wording. Deterministic X2 enforces zero metric-token replay in that companion mode."
  from_bullets:
    - metric: "99.9% uptime"
      allowed_usage: "NONE in narrative when IBM companion carries full KPI set — say enterprise reliability / governed delivery instead"
    - metric: "30% infrastructure overhead reduction"
      allowed_usage: "NONE — say cloud modernization / efficiency posture instead"
    - metric: "25% renewal rate improvement"
      allowed_usage: "NONE — say portfolio or renewal motion conceptually"
    - metric: "50% regulatory response latency reduction"
      allowed_usage: "NONE — say lineage / observability / regulatory response enablement instead"
    - metric: "$15M incremental revenue"
      allowed_usage: "NONE — say partnership / ecosystem impact instead"
  conceptual_references_allowed:
    - "enterprise reliability / governed delivery (not a numeric uptime claim)"
    - "regulated financial services"
    - "cloud and data modernization"
    - "lineage and observability"
    - "reusable platform and operational discipline"
    - "hyperscaler and alliance execution"

forbidden_terms_in_narrative:
  - term: "agentic AI"
    action: "REJECT — use 'production AI platform leadership' Directionally without the banned phrase"
  - term: "GraphRAG"
    action: "REJECT — Unify runtime claim"
  - term: "multi-agent orchestration"
    action: "REJECT — Unify runtime claim"
  - term: "deterministic routing"
    action: "REJECT — Unify runtime claim"
  - term: "sandboxed execution"
    action: "REJECT — Unify runtime claim"
  - term: "replayable traces"
    action: "REJECT — Unify runtime claim"
  - term: "governed AI runtime"
    action: "REJECT — Unify runtime claim"
  - term: "prompt assembly"
    action: "REJECT — Unify runtime claim"
  - term: "C0"
    action: "REJECT — layer reference"
  - term: "L2"
    action: "REJECT — layer reference"
  - term: "Exit"
    action: "REJECT — layer reference (unless job departure)"
  - term: "UWG"
    action: "REJECT — layer reference"

forbidden_patterns:
  - pattern: "bullet_list_output"
    check: "Output contains •, -, *, or numbered lists"
    action: "REJECT"
  - pattern: "multiple_sentences"
    check: "Output contains sentence-ending punctuation (.!?) more than once"
    action: "REJECT"
  - pattern: "repeated_bullet_metric"
    check: "Metric token from bullets appears in narrative_sentence when companion carries full KPI set"
    action: "REJECT"
  - pattern: "copied_sentence_structure"
    check: "Narrative mirrors Subject-Verb-Object achievement pattern of bullets"
    action: "FLAG_AND_REWRITE"
  - pattern: "new_unsupported_metric"
    check: "Novel numeric metric in narrative not evidenced in canonical IBM facts/bullets"
    action: "REJECT"
  - pattern: "unify_fact_contamination"
    check: "Any claim sourcing from non-IBM employment"
    action: "REJECT"
  - pattern: "unify_runtime_import"
    check: "Unify-named proof import or forbidden stack vocabulary"
    action: "REJECT"
  - pattern: "runtime_inflation"
    check: "Implies IBM operated modern Unify-style agentic platform engineering"
    action: "REJECT"

prompt_engineering_hardening:
  private_process:
    - "Read companion bullets → list what KPIs/themes they already own."
    - "Pick ONE capstone spine (foundation / modernization / alliances) that COMPLEMENTS, not summarizes."
    - "Draft narrative_sentence WITHOUT digit metrics unless truly unavoidable and evidenced."
    - "Build claim_ledger rows so each sentence clause maps to the right bul_ibm_* IDs."
    - "Self-check: no forbidden phrase, no metric replay, no weak abstract stack from avoid list."

validation_rules:
  pre_output:
    - assert: "output.narrative_sentence.count('.') >= 1"
      error: "NOT_EXACTLY_ONE_SENTENCE"
      message: "Must read as exactly one sentence for runtime"
    - assert: "len([w for w in output.narrative_sentence.split() if w]) <= 58"
      error: "WORD_BUDGET_EXCEEDED"
      message: "Must stay within 58 words (preferred 34-48)"
    - assert: "len(output.narrative_sentence) <= 360"
      error: "CHAR_BUDGET_EXCEEDED"
      message: "Must stay within 360 characters"
    - assert: "not any([c in output.narrative_sentence for c in ['•', '- ', '*', '1.', '2.', '3.']])"
      error: "BULLET_LIST_FORMAT"
      message: "Bullet list format forbidden"
    - assert: "every claim_ledger row has non-empty claim_text and non-empty source_fact_ids"
      error: "CLAIM_LEDGER_SHAPE"
      message: "claim_ledger rows require non-empty claim_text and source_fact_ids (enforced via PRODUCT_SHAPE X2)"
    - assert: "every source_fact_ids token appears in ALLOWED_SOURCE_FACT_IDS for the run"
      error: "FACT_ID_OUTSIDE_ALLOW_LIST"
      message: "Ledger fact IDs must be subset of runtime allow-list"
  post_output:
    - check: "anti_repetition_check is optional — X2 includes companion-metric, structure, theme-coverage gates"
    - check: "drift_check is optional — X2 includes IBM-only scope and unify-term gates"

temperature_profile:
  range: "0.30 - 0.45"
  default: 0.35
  rationale: "Conservative variation for foundation positioning without inflating claims"
  sweep_validation: "Must pass at 0.30, 0.375, 0.45 with consistent single-sentence structure"

payload_scope:
  input_tokens_estimate: "~2,800 (includes finalized bullets as context)"
  output_tokens_estimate: "~350"
  context_window_required: "4K minimum"
  json_schema_strict: true

execution_context:
  runs_after: "ibm_bullet_tailor_v1 fact check completion"
  input_dependency: "Finalized bullets from bullet pass (read-only)"
  anti_repetition_source: "Finalized bullets used solely to avoid repetition, not to copy"
  drift_prevention: "Explicit drift_check to catch Unify runtime claim import"

# W5 — SSOT excerpt for contract tests (IBM bullets companion context-only).
w5_proof_targeting_harmonization: |
  Proof: SelectedRoleFactSet facts for ibm_narrative only; claim_ledger source_fact_ids must match this section's allowlist.
  Finalized IBM bullets: companion context only, not proof unless the same fact id is in the narrative slice. Targeting only:
  JD, briefing, target title, target company. Out-of-slice source_fact_ids fail X2. No invention beyond selected IBM narrative facts; omit unsupported claims.

metadata:
  produced_at: "2026-05-18"
  produced_by: "W2C STOP 8 — IBM Position Narrative (quality hardening v1.2)"
  receipt_path: "artifacts/apps_rg/prompt_reset/w2c_outputs/stop_8_ibm_narrative_receipt.json"

# apps_rg Headline Tailor Template v1
# Purpose: One authentic resume headline — fixed format SVP Engineering | X | Y | Z, 10–13 words, JSON only.
# Authority: 8-slot PA model per ADR-023
# Ownership: apps_rg
# CRITICAL: Output MUST be compact JSON per R0; headline_line is proof-grounded only from candidate facts.

schema_version: "1.0"
template_id: headline_tailor_v1
version: "1.2"
allowed_stage: L2_EXEC
description: Headline generator with fixed SVP Engineering prefix, four pipe segments, 10–13 words, JSON output, JD/briefing as targeting-only ranking inputs.

# =============================================================================
# Slot Bodies (Headline-only)
# =============================================================================
slot_bodies:
  S0: |
    <task_contract>
    You produce exactly ONE compact JSON object (no markdown, no prose, no code fences).
    NO FABRICATION: Do not invent themes, employers, metrics, achievements, or wording not grounded in C0
    candidate facts; JD and briefing must never be treated as proof.
    The resume headline_line MUST match this hard shape:

    SVP Engineering | X | Y | Z

    Hard rules (non-negotiable):
    - Segment 1 MUST be exactly: SVP Engineering
    - Total segments: 4 (four non-empty parts)
    - Separator between segments: exactly " | " (space-pipe-space)
    - Separator count in headline_line: exactly 3 occurrences of " | "
    - Total word count across the full line: 10 to 13 inclusive (count tokens after treating "|" as a word boundary)
    - Truth / proof: candidate base resume facts (C0) ONLY
    - JD and briefing: targeting and ranking ONLY — never proof, never a keyword checklist
    - No JD keyword stuffing; no copied JD phrases; no employer names; no target company names
    - No metrics (no $, %, numeric proof, team counts, budgets, ARR, etc.)
    - No title inflation (first segment is fixed; do not swap SVP Engineering for CTO, VP, etc.)
    - No generic resume filler ("visionary", "digital transformation", laundry-list domains)
    </task_contract>

    <source_hierarchy>
    Authority order (highest wins on conflicts):
    1. Candidate base resume facts are truth and proof for X, Y, Z.
    2. Base resume headline is the identity anchor (see canonical_anchor in I0); preserve unless facts clearly support a better JD-aligned emphasis.
    3. JD_TEXT is targeting and ranking only — which supported themes to foreground.
    4. BRIEFING is targeting and ranking only — emphasis ordering among supported themes.
    5. Target title and target company are context only — never appear in headline_line as employers or proof.
    6. Model prior knowledge is NOT proof; if a theme is not supported in C0, do not use it.
    </source_hierarchy>

    <data_boundary>
    C0 bullets: read and ground X/Y/Z; do not paste bullet text verbatim into headline_line.
    JD_TEXT / BRIEFING / TARGET_COMPANY: never emitted as claims of employment or achievement.
    Output surface: JSON fields in R0 only — no chain-of-thought, no candidate list, no rationale outside self_check booleans/strings.
    </data_boundary>

  D0: |
    <headline_shape>
    headline_line format lock:
    - MUST start with the exact prefix: SVP Engineering | 
    - MUST contain exactly three " | " separators (not bare | without spaces)
    - MUST yield exactly four trimmed non-empty segments when split on " | "
    - Word budget: 10 <= words <= 13 for the entire line
    </headline_shape>

    Security fences:
    - Single JSON object only; first character "{", last character "}"
    - No markdown, no ``` fences, no commentary before/after JSON
    - No em dash (U+2014)
    - No first person
    - No inline source tags like [bul_001]

  I0: |
    <canonical_anchor>
    Identity anchor from base resume headline (preserve unless C0 clearly supports a sharper JD-aligned emphasis):

    SVP Engineering | Agentic AI Platforms | Distributed AI Infrastructure

    Preferred canonical derived example (four segments, within word budget):

    SVP Engineering | Agentic AI Platforms | Distributed AI Infrastructure | Governed Enterprise Systems
    </canonical_anchor>

    <selection_algorithm>
    Internal deliberation (do NOT print steps; use only to pick the final JSON):

    A. Read C0 and list evidenced themes for platform/domain, infrastructure/systems, governance/scale/architecture.
    B. Discard any theme not clearly supported by C0 (even if JD shouts it).
    C. Use JD_TEXT and BRIEFING only to rank and prioritize among supported themes.
    D. Generate exactly 5 internal headline_line candidates mentally, each obeying the hard contract.
    E. Rank those 5 against:
      - fixed_prefix compliance
      - four-segment compliance and exactly three " | " separators
      - 10–13 word compliance
      - base identity fidelity vs canonical anchor
      - factual support from C0 only
      - executive signal (platform leader, not IC task list)
      - JD relevance without stuffing or phrase lift
      - natural human resume sound
    F. Emit ONLY the single best candidate as headline_line in the final JSON.
    </selection_algorithm>

    <phrase_budget>
    - Segment 1: fixed prefix only — "SVP Engineering"
    - Segment 2: one primary platform/domain theme (from C0)
    - Segment 3: one infrastructure/system theme (from C0)
    - Segment 4: one governance, scale, or architecture theme (from C0)
    - Do not compress unrelated JD nouns into one segment.
    - Do not import more than one JD-derived theme unless multiple themes are strongly supported by C0.
    </phrase_budget>

    <style_calibration>
    Prefer vocabulary when supported by C0:
    agentic, governed, distributed, infrastructure, platforms, enterprise, runtime, systems, architecture, autonomous, regulated

    Avoid (unless no stronger supported alternative exists):
    visionary, transformation, innovation, strategic leader, digital change, AI evangelist, thought leader, technology leader
    </style_calibration>

    Pre-output checklist (silent):
    1. headline_line begins with "SVP Engineering | "
    2. Exactly 3× " | " and 4 non-empty segments
    3. Word count 10–13
    4. No metrics, employers, target company, personal name tokens
    5. No copied JD phrases; no stuffed domain lists
    6. jd_alignment and self_check match R0

  E0: |
    <many_shot_examples>
    Valid patterns (JD archetypes; adapt only when C0 supports):

    SVP Engineering | Agentic AI Platforms | Distributed AI Infrastructure | Governed Enterprise Systems

    SVP Engineering | Distributed AI Infrastructure | Platform Architecture | Enterprise Scale Systems

    SVP Engineering | Governed AI Systems | Regulated Enterprise Platforms | Runtime Control Architecture

    SVP Engineering | AI Platform Products | Reusable Agentic Services | Enterprise Delivery Scale

    SVP Engineering | Autonomous Agent Platforms | Distributed Systems | Enterprise AI Governance
    </many_shot_examples>

    <contrastive_examples>
    Bad:
    SVP Engineering | AI ML Cloud Data Security | Digital Transformation | Innovation Leadership
    Why bad: Keyword stuffing, generic filler, not base-authentic.
    Better:
    SVP Engineering | Agentic AI Platforms | Distributed AI Infrastructure | Governed Enterprise Systems

    Bad:
    SVP Engineering | TargetCompany AI Strategy | Agentic Transformation | Cloud Innovation
    Why bad: Target-company framing and JD phrase borrowing.
    Better:
    SVP Engineering | AI Platform Governance | Autonomous Agent Systems | Enterprise Infrastructure

    Bad:
    SVP Engineering | Agentic AI Platforms | $22M Revenue Growth | Distributed Infrastructure
    Why bad: Metrics are forbidden in headline_line.
    Better:
    SVP Engineering | Agentic AI Platforms | Commercialized Platform Services | Distributed Infrastructure
    </contrastive_examples>

    <repair_examples>
    Too few segments (invalid):
    SVP Engineering | Agentic AI Platforms | Distributed AI Infrastructure

    Repair: Add a fourth segment from C0-supported governance/scale theme; re-balance to 10–13 words.

    Wrong prefix (invalid):
    Engineering Executive | Agentic AI Platforms | Distributed AI Infrastructure | Governed Enterprise Systems

    Repair: First segment must be exactly SVP Engineering.

    Too few words: add one precise C0-grounded token to segments 2–4 only (never change segment 1).

    Too many words: shorten segments 2–4 only; keep segment 1 fixed; stay within 13 words.
    </repair_examples>

  Y0: |
    <style_calibration note="advisory">
    High-signal executive platform language beats ATS keyword bags.
    One crisp line is better than covering the whole JD.
    </style_calibration>

  R0: |
    <output_schema>
    Return exactly one compact JSON object with this shape (self_check must reflect the emitted headline_line):

    {
      "headline_line": "SVP Engineering | X | Y | Z",
      "selected_fact_plan": {
        "section_id": "headline",
        "selection_method": "canonical_base_resume_employment_bullets",
        "required_fact_ids": ["bul_*"]
      },
      "claim_ledger": [
        {
          "claim_text": "SVP Engineering | X | Y | Z",
          "source_fact_ids": ["bul_*"]
        }
      ],
      "jd_alignment": {
        "targeting_only": true,
        "jd_used_as_proof": false,
        "briefing_used_as_proof": false,
        "selected_theme": "<short supported theme>",
        "anti_stuffing_check": "passed"
      },
      "gap_notes": [],
      "change_log": [],
      "self_check": {
        "fixed_prefix": true,
        "segment_count": 4,
        "separator_count": 3,
        "word_count": 10,
        "word_count_in_range": true,
        "no_metrics": true,
        "no_company_names": true,
        "no_employer_names": true,
        "no_jd_phrase_lift": true,
        "base_identity_preserved": true,
        "jd_used_as_targeting_only": true
      }
    }

    self_check.word_count must be the integer word count you compute for headline_line.
    All self_check booleans must be true for a valid emission; if you cannot satisfy the contract, still output JSON with accurate self_check flags and explain in gap_notes (do not violate JSON-only output).
    </output_schema>

  # Legacy C0/U0: not injected by headline_pa (facts/jd come from PA builders). Minimal stubs for tooling that expects keys.
  C0: |
    {{ candidate_facts | to_yaml }}

  U0: |
    TARGET_ROLE: {{ target_role }}
    TARGET_COMPANY: {{ target_company }}
    SENIORITY_BAND: {{ seniority_band }}

# =============================================================================
# Output Contract
# =============================================================================
output_contract:
  format: json
  mime_type: application/json
  charset: utf-8

  constraints:
    headline_format: "SVP Engineering | X | Y | Z"
    fixed_prefix: "SVP Engineering"
    word_count:
      min: 10
      max: 13
    segments: 4
    separator: " | "
    no_metrics: true
    no_company_names: true
    no_jd_keyword_stuffing: true
    jd_targeting_only: true

  validation_rules:
    - rule: fixed_prefix_check
      value: "SVP Engineering"
    - rule: word_count_check
      min: 10
      max: 13
    - rule: segment_count_check
      count: 4
    - rule: separator_check
      value: " | "
    - rule: no_em_dash
    - rule: no_company_names
    - rule: facts_only_content
    - rule: no_jd_phrase_borrowing
    - rule: no_jd_keyword_stuffing
    - rule: json_contract_check

# =============================================================================
# Temperature Profile
# =============================================================================
temperature_profile:
  range: "0.45 - 0.75"
  default: 0.55
  rationale: "Creative phrasing for segments 2–4 only; deterministic gates enforce fixed prefix, four segments, 10–13 words, and anti-stuffing."
  sweep_validation: "Must pass at 0.45, 0.55, 0.75 with SVP Engineering | X | Y | Z structure."

# =============================================================================
# Hash Fields for Determinism
# =============================================================================
hash_fields:
  - template_id
  - version
  - slot_bodies.S0
  - slot_bodies.I0
  - slot_bodies.R0

# apps_rg Executive Summary Generate Scratch Template v1 (judge-aligned base generation)
# Purpose: SVP executive strategy narrative from selected facts; JD + briefing = targeting only.
# Canonical run: python -m apps_rg --section executive_summary
# Marker: EXEC_SUMMARY_PROMPT_JUDGE_ALIGNED_V6

schema_version: "1.0"
template_id: executive_summary.generate_scratch_v1
version: "1.7"
allowed_stage: L2_EXEC
description: Executive summary - SVP strategy narrative; facts prove; judges grade synthesis not slot-fill

pa_core_law_ref: apps_rg/prompt_assembly/pa_core_law_v1.yaml
forbidden_slot_body_source: strategic_tailor_v1

slot_bodies:
  S0: |
    <instruction_hierarchy>
      <system_authority level="S0">
    <role>
    Executive strategy narrative author: produce one third-person SVP-level paragraph backed only by C0 facts.
    NO FABRICATION: governed by pa_truth_oath_v1 (pa_core_law_v1.yaml). Section bound: C0 + ALLOWED_SOURCE_FACT_IDS only.
    Success = judges pass executive_signal and synthesis_quality (integrated thesis arc), not metric inventory coverage.
    </role>
    <authority_hierarchy>
    S0 > D0 > I0 > C0 > Y0 > U0 > E0 (many-shot) > R0. Core PA law: pa_core_law_v1 contracts (not restated here).
    X2 gate IDs: appended PRODUCT_SHAPE at compile only.
    </authority_hierarchy>
    <product_shape_band>
    resume_display_text: **exactly 6** period-delimited sentences, one paragraph (legacy 4-5 and 5-6 retired).
    executive_strategy_thesis: one sentence, required before finalizing display prose (ledger-backed; see I0).
    Never copy E0 style-example metrics or credentials unless the same substance is in ALLOWED_SOURCE_FACT_IDS.
    </product_shape_band>
      </system_authority>
    </instruction_hierarchy>

  D0: |
    <authority_boundary kind="data_hygiene">
    Implements pa_untrusted_data_fence_v1 (pa_core_law_v1.yaml). Section executable law: S0-U0 + I0 blocks + R0 JSON schema.
    </authority_boundary>

  I0: |
    <instructions>
    <!-- EXEC_SUMMARY_PROMPT_JUDGE_ALIGNED_V6 -->

    <third_person_voice_contract>
    **CRITICAL (X2 hard-fail):** `resume_display_text` and `executive_strategy_thesis` are third-person executive résumé prose only.
    FORBIDDEN tokens anywhere in those fields: I, me, my, mine, we, our, us.
    FORBIDDEN openers: "As an SVP", "As a", "In this role I", "My leadership", "I have", "I align".
    GOOD S1 pattern: "Technology strategy executive who operationalizes ..." / "Enterprise technology leader who ..."
    If any forbidden token would appear, rewrite before returning JSON; set self_check.no_first_person=false when any slip remains.
    </third_person_voice_contract>

    <six_sentence_period_contract>
    **CRITICAL (X2 hard-fail):** `resume_display_text` must contain **exactly six** sentences separated by **periods** (`.`).
    Count sentences by terminal periods only - not commas, semicolons, or "and" chains.
    Do not pack multiple achievements into one long period-terminated sentence to cheat the count.
    S3-S5 should open with connective bridges (e.g. "Building on that platform foundation,", "That operating model,", "Through that governance discipline,")
    when weaving facts - not bare "Led/Built/Implemented" resume bullets.
    </six_sentence_period_contract>

    <proof_law_v1>
    Implements pa_proof_binding_v1 + pa_targeting_only_v1 (full text: pa_core_law_v1.yaml). Do not restate core PA law in output.
    Runtime: C0 + ALLOWED_SOURCE_FACT_IDS only; claim_ledger source_fact_ids verbatim from allowlist.
    Display: resume_display_text must be clean prose; NO [source:...] tags in display text.
    X2 bounds and gate IDs: see appended PRODUCT_SHAPE only (not listed in this slot).
    </proof_law_v1>

    <source_fact_id_tokens>
    Pattern: bul_unify_003 valid when listed; bul_unify_ 003 invalid (spacing drift fails X2).
    </source_fact_id_tokens>

    <credential_policy_v1>
    Certifications belong in Certifications/Competencies sections, not a trailing cert inventory.
    Allowed: one implied credibility clause inside a substantive sentence when a cert fact supports it.
    FORBIDDEN in resume_display_text: employer-name inventory lines (e.g. three prior firms in one sentence),
    AWS/Databricks/vendor cert label stacks, and Towers Perrin/ING/Aetna-style credential dumps unless one employer
    is woven into a single strategy clause with allowed facts.
    </credential_policy_v1>

    <judge_alignment_contract>
    Grade target (X1D rubric): SVP platform/governance/commercialization **synthesis**, not bullet stacks.
    - executive_signal: open as technology strategy / enterprise technology leader - not only an AI platform builder.
    - synthesis_quality: six sentences = **one causal arc**; S2-S5 use connective tissue; metrics **serve** the thesis.
    - S6: forward-looking enterprise technology direction - **not** a thin recap of S2-S5 and not generic "connect outcomes" filler.
    - ats_alignment: JD/briefing shape **emphasis and vocabulary** among allowed facts only - translate platform/governance/commercial
      facts into enterprise IT strategy, architecture modernization, innovation incubation, and regulated operating environments
      without inventing insurance-domain or interoperability experience not in ALLOWED_SOURCE_FACT_IDS.
    - anti_overfit: no unsupported metrics; no TARGET_COMPANY as candidate employment.
    Proof completeness alone does not pass: a six-sentence metric checklist fails even when every claim is sourced.
    </judge_alignment_contract>

    <anti_achievement_stack_contract>
    **Claude-fail pattern to avoid (even when X2 would pass):**
    BAD: S1 repeats the thesis sentence verbatim, then S2-S5 each open with a new proof verb
    (Designs..., Leads..., Implements..., Generates...) with no causal bridge, and S6 uses meta filler
    ("culture of experimentation", "continuous learning", "responsible innovation") not tied to allowed facts.
    GOOD: S1 paraphrases the thesis in fresh third-person prose; S2-S5 weave facts with connective openers
    ("Building on that platform foundation,", "That operating model,", "Through that governance discipline,");
    at most one metric-forward sentence; S6 projects enterprise IT direction from allowed platform/governance facts only.
    Max two sentences may start with Led/Designed/Implemented/Built/Generated; the other four must use connective or thematic openers.
    </anti_achievement_stack_contract>

    <executive_strategy_thesis_first>
    **Required workflow (do not skip):**
    1. Read ALLOWED_SOURCE_FACT_IDS and C0 lines; read JD/briefing for targeting only.
    2. Write `executive_strategy_thesis` (exactly one sentence): what kind of SVP technology leader is this candidate,
       and how platform commercialization, governance, architecture, and innovation connect - using only allowed facts.
    3. Write `resume_display_text` (exactly six period-terminated sentences) so **every** sentence advances that thesis.
    Do **not** paste the thesis sentence verbatim into S1; S1 must be a fresh third-person paraphrase of the same idea.
    Do **not** write one sentence per fact cluster by default. Do **not** preserve fact-pool sort order in prose.
    Weave multiple allowed facts into one sentence when they share a causal thread.
    When ALLOWED_SOURCE_FACT_IDS count is 6 or more, prefer 5-6 claim_ledger rows (thesis-supporting, not one row per sentence).
    </executive_strategy_thesis_first>

    <narrative_arc_contract>
    Six sentences form one integrated arc (not six mini-bullets). U0 may inject narrative_arc_weights - use them as
    **thematic emphasis**, not a mandatory one-fact-per-index slot map.
    S1 - third-person paraphrase of executive_strategy_thesis (never "As an SVP..." / never TARGET_TITLE job-application phrasing).
    S2 - governed platform/runtime substance serving the thesis; max two mechanism terms verbatim from facts only.
    S3 - connective: platform scale, operating model, and innovation delivery in one causal thread (not a standalone win).
    S4 - connective: governance/lineage/regulatory discipline linked to IT strategy velocity (not a control checklist).
    S5 - at most one high-signal metric clause woven into strategy context; never a cert/employer-history inventory.
    S6 - integrative capstone: forward enterprise technology direction from allowed facts; no JD echo, no TARGET_COMPANY,
      no thin recap of prior sentences.
    </narrative_arc_contract>

    <composition_heuristics>
    **Exactly 6** sentences, one paragraph; fit_to_evidence (max **140** words - hard X2 cap only; no word-count floor).
    Third person; no U+2014 em dash. Vary sentence openers; no six Led/Built/Delivered chains.
    claim_ledger: 3-6 rows that **support the thesis** (not one row per sentence by default). Document intentional omissions in gap_notes.
    Voice and failure-mode examples: E0 at L2 execute time (hydrated from executive_summary_examples.yaml).
    </composition_heuristics>

    <internal_deliberation_controls>
    Derive the executive thesis internally before writing JSON; do not output chain-of-thought, branches, scores, or deliberation text.
    </internal_deliberation_controls>

    <output_contract>
    Return RAW JSON ONLY: first character `{`, last character `}`. No markdown fences.
    Required keys: executive_strategy_thesis, resume_display_text, claim_ledger, jd_alignment, gap_notes, change_log, self_check.
    Do not emit selected_fact_plan - runtime materializes it.
    </output_contract>

    <self_check_requirements>
    Compact booleans/tokens only: no_first_person, no_inline_source_tags, no_fact_ids_in_display_text,
    jd_used_as_proof_false, every_material_claim_in_claim_ledger, metrics_copied_exactly,
    no_keyword_stuffing, no_generic_recruiter_voice,
    executive_strategy_thesis_present, single_thesis_carried_through, no_sequential_achievement_stack,
    no_employer_inventory_line, s1_not_verbatim_thesis_copy, s6_forward_synthesis_not_recap,
    connective_s3_s5_prose, achievement_verb_opener_count_at_most_2,
    composition_themes_used, composition_themes_omitted_with_reason (optional sentence_roles_* aliases).
    </self_check_requirements>

    </instructions>

  C0: |
    # C0 injected at PA compile: selected facts + ALLOWED_SOURCE_FACT_IDS; jd_requirements targeting only.

  U0: |
    # U0 filled by executive_summary_pa from runtime payload.

  E0: |
    <!-- E0 hydrated at compile from apps_rg/prompt_assembly/examples/executive_summary_examples.yaml -->
    <!-- See apps_rg/prompt_assembly/e0_examples.py - strategy lanes may use judge-aligned positive subset only. -->

    <transformation_example id="proof_safe_jd_customization">
    JD/briefing may tilt emphasis only. Bad: claiming JD skills as proof. Good: translate evidenced themes into executive concepts.
    </transformation_example>

    <transformation_example id="targeting_concept_mapping">
    Bad: "Experienced in insurance brokerage interoperability" without proof IDs. Good: "Governed platform and lineage discipline
    for regulated enterprise programs" when only platform/governance facts exist - set gap_notes for missing JD proof themes.
    </transformation_example>

    <transformation_example id="no_target_company_employer">
    Bad: Engineering executive at TargetCo delivering outcomes. Good: TargetCo is targeting only; outcomes from facts.
    </transformation_example>

  Y0: |
    # Y0 advisory - sovereign law via pa_core_law_v1; prefer concrete metrics from allowed facts when available.

  R0: |
    # R0_RESPONSE_SCHEMA - JSON schema injected at compile; X2 enforcement via PRODUCT_SHAPE + validators.

output_contract:
  format: json
  schema_ref: apps_rg/runtime/sections/executive_summary_pa.py#r0_embedded_json_schema
  mime_type: application/json
  charset: utf-8
  required_fields:
    - executive_strategy_thesis
    - resume_display_text
    - claim_ledger
    - jd_alignment
    - gap_notes
    - change_log
    - self_check
  summary_constraints:
    min_claims: 1
    max_claims: 6
    require_citations: false
    require_role_identity_lead: true
    forbid_generic_openers: true
    forbid_em_dash: true
  self_check_required: true

validation_rules:
  - rule: evidence_first_structure
    severity: error
    pattern: proof_law_v1
  - rule: resume_display_text_present
    severity: error
    required_field: resume_display_text
  - rule: executive_strategy_thesis_present
    severity: error
    required_field: executive_strategy_thesis
  - rule: claim_ledger_present
    severity: error
    required_field: claim_ledger

w5_proof_targeting_harmonization: |
  Proof: graph/ledger selected facts; claim_ledger IDs stay in ALLOWED_SOURCE_FACT_IDS.
  Targeting: JD, briefing, title, company - never proof unless the fact token is in the section allowlist.
  Generation: thesis-first narrative; brushstroke/composition weights are thematic, not one-sentence-per-fact slots.

hash_fields:
  - template_id
  - version
  - slot_bodies.S0
  - slot_bodies.I0
  - slot_bodies.E0
  - slot_bodies.R0

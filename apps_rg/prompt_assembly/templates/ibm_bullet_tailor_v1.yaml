schema_version: "prompt_template_v1"
template_id: "ibm_bullet_tailor_v1"
version: "1.0"
allowed_stage: "L2_EXEC"
rewrite_intent: "IBM_BULLET"

foundation_proof_model_id: "IBM_BULLETS_FOUNDATION_PROOF_MODEL_V1"
treatment_profile: "REWRITE_FROM_FACT_POOL_CONSTRAINED"

purpose: |
  FOUNDATION PROOF (not agentic-product narrative): rewrite IBM employment bullets using ONLY IBM facts
  from the canonical base resume. Treatment profile REWRITE_FROM_FACT_POOL_CONSTRAINED.
  Model IBM_BULLETS_FOUNDATION_PROOF_MODEL_V1 must foreground enterprise AI/data platform architecture,
  cloud and data modernization, reusable platform/productization patterns, lineage + observability +
  regulatory response, and hyperscaler/commercial partnership leverage.
  Outputs exactly 5 resume-native bullets with zero HEAVY rewrites (3 MODERATE + 2 LIGHT_PROTECTED).
  No narrative paragraphs. No unsupported claims. No JD-as-proof copying.
  No Unify facts, no Unify-era runtime vocabulary, no taxonomy/category label prefixes on bullet_text.

sovereign_oath: |
  IBM FACTS ONLY — FOUNDATION PROOF — NO CROSS-CONTAMINATION — NO UNIFY / RUNTIME VOCABULARY
  
  I may ONLY use facts from the IBM employment entry (fact_id: exp_ibm_001).
  I may NOT use Unify, InsurTech, EY, Early Career, education, certifications, or competency facts.
  I may NOT describe IBM using current agentic runtime / repo vocabulary (agentic runtime, multi-agent
  orchestration, GraphRAG, C0, L2, Exit, UWG, judge mesh, governed spine, prompt assembly, etc.).
  I may NOT introduce claims beyond supported IBM facts.
  I may NOT copy JD phrases beyond 4 consecutive words.
  I may NOT use em dash character anywhere.
  I may NOT output narrative text — bullets only.

  QUALITY BAR — BASE RESUME PARITY: Preserve the information density of the locked IBM bullets in the
  canonical base resume. Do not replace regulated-financials, uptime, migration, or partnership specifics
  with generic "cloud AI" wording unless change_log documents the simplification with claim_ledger support.

  FORBIDDEN TERMS unless explicitly in IBM source facts:
  - agentic AI, agentic runtime, multi-agent orchestration
  - GraphRAG, judge mesh, governed spine
  - deterministic routing, sandboxed execution, replayable traces
  - governed AI runtime, prompt assembly
  - C0, L2, Exit, UWG (repo/runtime shorthand — never appear in resume bullets)

  bullet_text MUST begin with resume-native prose (verb-led or neutral enterprise clause).
  NEVER prefix bullet_text with taxonomy/category labels such as "AI and Data Platform Architecture: ..."
  Optional bullet_theme (or other metadata fields) may carry themes; claim_ledger rows may reference themes —
  but bullet_text itself must not start with "Category: " patterns.

  SelectedRoleFactSet (SRFS): bullet and claim_ledger source_fact_ids must be ONLY ibm_bullets slice allowlist tokens
  (ALLOWED_SOURCE_FACT_IDS), including allowed metric-suffix hashes. JD, briefing, IBM positioning context, target title,
  and target company steer relevance and ordering — never proof; do not add IBM-specific outcomes, partnerships, or
  regulated claims from JD alone. Out-of-slice IDs fail deterministic X2 SRFS gates.

role_header_fields:
  company:
    source: "canonical_json.employment[exp_ibm_001].employer"
    writable: false
    value: "IBM"
  location:
    source: "canonical_json.employment[exp_ibm_001].location"
    writable: false
    value: "Edgewater, NJ"
  historical_title:
    source: "canonical_json.employment[exp_ibm_001].title"
    writable: false
    value: "Lead Client Partner"
  dates:
    source: "canonical_json.employment[exp_ibm_001].start_date / end_date"
    writable: false
    value: "2017-04 to 2022-10"

input_contract:
  required_fields:
    - name: selected_fact_plan
      schema: "{exp_ibm_001: {priority: 2, allowed_bullets: [bul_ibm_001..005], metrics: [...]}}"
    - name: base_resume_json_ref
      value: "apps_rg/resume/base/amit_ayer_base_resume_v1.json"
    - name: base_section_hash
      description: "SHA256 of IBM employment section for integrity"
    - name: claim_ledger
      schema: "{claims: [{claim_text, source_fact_id, supported: bool}]}"
    - name: jd_alignment
      schema: "{alignment_score, matched_terms, gap_terms}"
    - name: rewrite_intensity_request
      allowed_values: ["DEFAULT", "MODERATE", "LIGHT_PROTECTED"]
      default: "DEFAULT"
      forbidden: ["HEAVY"]

output_contract:
  format: "JSON"
  required_fields:
    - name: bullets
      type: "array"
      min_items: 5
      max_items: 5
      item_schema:
        bullet_id: "string (must map to bul_ibm_001..005)"
        bullet_text: "string — resume-native; MUST NOT start with 'Category: ' / taxonomy prefix"
        bullet_theme: "optional string — taxonomy/theme belongs here or metadata, never as bullet_text prefix"
        rewrite_intensity: "enum[MODERATE, LIGHT_PROTECTED] — HEAVY forbidden"
        has_metric: "boolean"
        metric_raw: "string or null"
        source_fact_ids: "array[string]"
    - name: rewrite_distribution
      type: "object"
      schema:
        MODERATE: "integer (2-3, default 3)"
        LIGHT_PROTECTED: "integer (2-3, default 2)"
        HEAVY: "integer (must be 0)"
        total: "integer (must equal 5)"
      default_distribution:
        MODERATE: 3
        LIGHT_PROTECTED: 2
        HEAVY: 0
      constraints:
        - "HEAVY == 0 (forbidden)"
        - "MODERATE >= 2, <= 3"
        - "LIGHT_PROTECTED >= 2"
        - "MODERATE + LIGHT_PROTECTED + HEAVY == 5"
    - name: claim_ledger
      type: "array"
      item_schema:
        claim_text: "string"
        source_fact_id: "string (must be bul_ibm_*)"
        supported: "boolean"
    - name: gap_notes
      type: "array"
      description: "List of unsupported JD requirements or gaps"
    - name: change_log
      type: "array"
      description: "Per-bullet change tracking: {bullet_id, original_summary, change_type, rationale}"
    - name: self_check
      type: "object"
      schema:
        bullet_count_valid: "boolean (must be true)"
        distribution_valid: "boolean (must be true)"
        no_heavy_rewrites: "boolean (must be true)"
        no_narrative_text: "boolean (must be true)"
        no_cross_contamination: "boolean (must be true)"
        no_unify_runtime_inflation: "boolean (must be true)"
        no_em_dash: "boolean (must be true)"
        no_excessive_jd_copying: "boolean (must be true)"
        metrics_preserved: "boolean (must be true)"
        all_checks_passed: "boolean"

rewrite_rules:
  distribution_constraints:
    DEFAULT:
      MODERATE: 3
      LIGHT_PROTECTED: 2
      HEAVY: 0
    FORBIDDEN:
      - "HEAVY: > 0"
    CUSTOM:
      requires_strategic_justification: true
      max_MODERATE: 3
      min_LIGHT_PROTECTED: 2
      
  bullet_specific_guidance:
    bul_ibm_001:
      intensity_default: "MODERATE"
      content: "Cloud-native AI and analytics platforms for regulated financial services"
      key_terms: ["99.9% uptime", "governed enterprise decision systems", "regulated financial environments"]
      ibm_role: "Enterprise-scale platform delivery"
    bul_ibm_002:
      intensity_default: "MODERATE"
      content: "Cloud migration and infrastructure modernization"
      key_terms: ["30% infrastructure overhead reduction", "scalable cloud-native architectures"]
      ibm_role: "Cost optimization through modernization"
    bul_ibm_003:
      intensity_default: "LIGHT_PROTECTED"
      content: "SaaS-like platform conversion for regulatory and analytics workflows"
      key_terms: ["25% renewal rate improvement", "reusable platforms"]
      ibm_role: "Portfolio and productization"
      protected_reason: "Contains specific business metric (25%)"
    bul_ibm_004:
      intensity_default: "MODERATE"
      content: "Real-time data ingestion, lineage, and observability frameworks"
      key_terms: ["50% regulatory response latency reduction", "data lineage", "observability"]
      ibm_role: "Data engineering and compliance enablement"
    bul_ibm_005:
      intensity_default: "LIGHT_PROTECTED"
      content: "Hyperscaler alliances and co-sell partnership execution"
      key_terms: ["$15M incremental revenue", "multi-year alliances"]
      ibm_role: "Strategic partnerships and ecosystem execution"
      protected_reason: "Contains specific revenue metric ($15M)"

metric_preservation_rules:
  - metric: "99.9% uptime"
    bullet: "bul_ibm_001"
    preservation: "EXACT"
  - metric: "30% infrastructure overhead reduction"
    bullet: "bul_ibm_002"
    preservation: "EXACT"
  - metric: "25% renewal rate improvement"
    bullet: "bul_ibm_003"
    preservation: "EXACT"
  - metric: "50% regulatory response latency reduction"
    bullet: "bul_ibm_004"
    preservation: "EXACT"
  - metric: "$15M incremental revenue"
    bullet: "bul_ibm_005"
    preservation: "EXACT"

forbidden_terms_unless_ibm_source:
  - term: "agentic AI"
    action: "REJECT — not in IBM source facts"
  - term: "GraphRAG"
    action: "REJECT — not in IBM source facts"
  - term: "multi-agent orchestration"
    action: "REJECT — not in IBM source facts"
  - term: "deterministic routing"
    action: "REJECT — not in IBM source facts"
  - term: "sandboxed execution"
    action: "REJECT — not in IBM source facts"
  - term: "replayable traces"
    action: "REJECT — not in IBM source facts"
  - term: "governed AI runtime"
    action: "REJECT — not in IBM source facts"
  - term: "prompt assembly"
    action: "REJECT — not in IBM source facts"
  - term: "C0"
    action: "REJECT — not in IBM source facts"
  - term: "L2"
    action: "REJECT — not in IBM source facts"
  - term: "Exit"
    action: "REJECT — not in IBM source facts (unless referring to job departure)"
  - term: "UWG"
    action: "REJECT — not in IBM source facts"
  - term: "agentic runtime"
    action: "REJECT — repo vocabulary"
  - term: "judge mesh"
    action: "REJECT — repo vocabulary"
  - term: "governed spine"
    action: "REJECT — repo vocabulary"

forbidden_patterns:
  - pattern: "em dash"
    check: "character U+2014 or U+2013 not allowed"
    action: "REJECT"
  - pattern: "narrative paragraph"
    check: "output.bullets must not contain paragraph breaks or narrative flow"
    action: "REJECT"
  - pattern: "excessive_jd_copying"
    check: "No more than 4 consecutive words from JD"
    action: "FLAG_AND_REWRITE"
  - pattern: "unify_fact_contamination"
    check: "source_fact_id must start with bul_ibm_*"
    action: "REJECT"
  - pattern: "insurtech_fact_contamination"
    check: "source_fact_id must start with bul_ibm_*"
    action: "REJECT"
  - pattern: "ey_fact_contamination"
    check: "source_fact_id must start with bul_ibm_*"
    action: "REJECT"
  - pattern: "early_career_contamination"
    check: "source_fact_id must start with bul_ibm_*"
    action: "REJECT"
  - pattern: "unify_runtime_inflation"
    check: "Any claim implying agentic runtime, orchestration mesh, GraphRAG, governed spine, or Unify-platform vocabulary at IBM"
    action: "REJECT"
  - pattern: "taxonomy_label_prefix_in_bullet_text"
    check: "bullet_text must not match ^[A-Z][A-Za-z /,&-]{3,60}:\\s+"
    action: "REJECT"

validation_rules:
  pre_output:
    - assert: "len(output.bullets) == 5"
      error: "BULLET_COUNT_INVALID"
      message: "Must emit exactly 5 bullets"
    - assert: "output.rewrite_distribution.HEAVY == 0"
      error: "HEAVY_REWRITE_FORBIDDEN"
      message: "IBM bullets do not permit HEAVY rewrites"
    - assert: "output.rewrite_distribution.MODERATE >= 2 and output.rewrite_distribution.MODERATE <= 3"
      error: "MODERATE_COUNT_INVALID"
      message: "MODERATE must be 2 or 3"
    - assert: "output.rewrite_distribution.LIGHT_PROTECTED >= 2"
      error: "INSUFFICIENT_LIGHT_PROTECTED"
      message: "Must have at least 2 LIGHT_PROTECTED bullets"
    - assert: "sum([output.rewrite_distribution[k] for k in ['MODERATE', 'LIGHT_PROTECTED', 'HEAVY']]) == 5"
      error: "DISTRIBUTION_SUM_INVALID"
      message: "Distribution must sum to 5"
    - assert: "not any([U+2014 in b.bullet_text for b in output.bullets])"
      error: "EM_DASH_DETECTED"
      message: "Em dash character forbidden"
    - assert: "all([b.source_fact_id.startswith('bul_ibm_') for b in output.bullets])"
      error: "CROSS_CONTAMINATION"
      message: "All bullets must source from IBM facts only"
    - assert: "not any([term in b.bullet_text.lower() for b in output.bullets for term in ['agentic', 'graphrag', 'multi-agent', 'deterministic routing', 'sandboxed', 'replayable', 'C0', 'UWG']])"
      error: "UNIFY_RUNTIME_INFLATION"
      message: "IBM bullets must not include Unify runtime terms"
  post_output:
    - check: "claim_ledger completeness"
    - check: "gap_notes populated if gaps exist"
    - check: "change_log tracks all modifications"

temperature_profile:
  range: "0.30 - 0.45"
  default: 0.35
  rationale: "Conservative rewrite variation — IBM supports Unify claims, not competes with them"
  sweep_validation: "Must pass at 0.30, 0.375, 0.45 with consistent structure"

payload_scope:
  input_tokens_estimate: "~2,200"
  output_tokens_estimate: "~1,000"
  context_window_required: "4K minimum"
  json_schema_strict: true

ibm_positioning_guidance: |
  IBM bullets are standalone FOUNDATION PROOF for regulated enterprise delivery — cloud-native AI/analytics
  platforms, modernization, reusable platform patterns, lineage + observability + regulatory turnaround,
  and hyperscaler alliances.
  They must NOT read as the current Unify agentic-platform role, heavy wholesale rewrite, or Unify fact import.
  Never prefix bullet_text with taxonomy labels (use bullet_theme / structured fields instead).
  Forbidden in visible bullets: agentic runtime/repo vocabulary (GraphRAG, C0/L2/Exit/UWG, judge mesh,
  governed spine, multi-agent orchestration, etc.) unless literally present in IBM source facts (normally absent).

# W5 — SSOT excerpt for contract tests.
w5_proof_targeting_harmonization: |
  Proof: SelectedRoleFactSet facts for ibm_bullets only; bullet and claim_ledger source_fact_ids must match this section's
  allowlist. Targeting only: JD, briefing, target title, target company, IBM positioning context — never proof; no
  unsupported IBM-specific claims from JD alone. Out-of-slice source_fact_ids fail X2. No invented employers, metrics,
  partners, alliances, domains, revenue, savings, percentages, or regulated claims beyond selected IBM facts.

metadata:
  produced_at: "2026-05-14"
  produced_by: "W2C STOP 7 — IBM Bullet Tailor"
  receipt_path: "artifacts/apps_rg/prompt_reset/w2c_outputs/stop_7_ibm_bullet_receipt.json"

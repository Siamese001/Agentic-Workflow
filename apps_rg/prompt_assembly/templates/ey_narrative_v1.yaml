template_id: ey_narrative_v1
section_id: ey_narrative
purpose: >
  Generate exactly one sentence for the EY role episode after finalized bul_ey
  bullets exist. Keep the sentence within 58 words and 360 characters. Use only
  source_fact_ids from the active proof pool; targeting context is
  targeting_only and jd_used_as_proof must remain false.
output_contract:
  format: json_object
  required_keys:
    - narrative_sentence
    - claim_ledger
    - jd_alignment
proof_contract:
  source_fact_ids: required
  bullet_dependency: bul_ey
  targeting_only: true
  jd_used_as_proof: false
  retries_cannot_repair_missing_upstream_evidence: true

version: "1.0"
section: executive_summary
description: >
  Multishot examples for the executive_summary section (product band exactly 6 sentences, max 140 words).
  Proof substrate is always selected base-résumé facts + claim_ledger in runtime artifacts;
  examples teach voice and structure only unless marked as STYLE_EXAMPLE_NOT_PROOF.

examples:
  - id: exec_summary_gold_base_resume_001
    category: positive_gold
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building production-grade AI platforms and the runtime architecture that makes autonomous systems usable in regulated enterprise environments.
      Designs and operates governed AI systems that combine deterministic routing, multi-agent orchestration, graph-aware retrieval, sandboxed execution, policy enforcement, replayable traces, evaluation discipline, and human escalation controls to improve reliability, auditability, and deployment speed.
      Leads the full platform lifecycle across architecture, operating model, engineering scale-out, and commercialization, converting bespoke delivery into reusable platform services adopted across enterprise programs.
      Generated $22M in productized AI revenue, expanded gross margins by 20%, and reclaimed $14M in operating capacity across enterprise programs.
      Reduced deployment cycles by turning complex AI capabilities into repeatable, production-ready infrastructure grounded in quantitative actuarial depth.
      Distributed systems and regulated-risk analytics experience inform governance and commercialization balance when selected facts support those themes.
    claim_ledger_grounded: false
    annotation: >
      STYLE AND QUALITY TARGET ONLY — not proof for arbitrary runs.
      This is the voice, density, synthesis, and executive register to emulate.
      Do not copy example facts, metrics, or credentials unless current selected facts
      contain the same substance. The example demonstrates executive-level synthesis,
      not claim-label stitching. Metrics and credentials appear here because this
      paragraph assumes those facts are already in the proof substrate.
      Runtime proof remains claim_ledger + source_fact_ids only; resume_display_text
      stays clean prose.

  - id: exec_summary_pos_outcomes_led_001

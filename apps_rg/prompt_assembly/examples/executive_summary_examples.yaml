version: "1.0"
section: executive_summary
description: >
  Multishot examples for the executive_summary section.
  Proof substrate is always selected base-résumé facts + claim_ledger in runtime artifacts;
  examples teach voice and structure only unless marked as STYLE_EXAMPLE_NOT_PROOF.

examples:
  - id: exec_summary_gold_base_resume_001
    category: positive_gold
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building production-grade AI platforms and the runtime architecture that makes autonomous systems usable in regulated enterprise environments. Designs and operates governed AI systems that combine deterministic routing, multi-agent orchestration, graph-aware retrieval, sandboxed execution, policy enforcement, replayable traces, evaluation discipline, and human escalation controls to improve reliability, auditability, and deployment speed. Leads the full platform lifecycle across architecture, operating model, engineering scale-out, and commercialization, converting bespoke delivery into reusable platform services adopted across enterprise programs. Generated $22M in productized AI revenue, expanded gross margins by 20%, reclaimed $14M in operating capacity, and reduced deployment cycles by turning complex AI capabilities into repeatable, production-ready infrastructure grounded in quantitative actuarial and distributed systems depth.
    claim_ledger_grounded: false
    annotation: >
      STYLE AND QUALITY TARGET ONLY — not proof for arbitrary runs.
      This is the voice, density, synthesis, and executive register to emulate.
      Do not copy example facts, metrics, or credentials unless current selected facts
      contain the same substance. The example demonstrates executive-level synthesis,
      not claim-label stitching. Metrics and credentials appear here because this
      paragraph assumes those facts are already in the proof substrate.
      Runtime proof remains claim_ledger + source_fact_ids only; resume_display_text
      stays clean prose.

  - id: exec_summary_pos_outcomes_led_001
    category: positive_variant
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Generated $22M in productized AI revenue and expanded gross margins by 20% by turning complex AI capabilities into repeatable, production-ready platform services adopted across enterprise programs. Engineering executive building production-grade AI platforms and governed runtime architecture for regulated enterprise environments. Designs and operates systems that combine orchestration, retrieval, policy enforcement, and traceability to improve reliability, auditability, and deployment speed. Leads full platform lifecycle work across architecture, operating model, and engineering scale-out. Quantitative actuarial depth supports regulated delivery when those themes appear in the allowed pool.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — outcomes-led narrative order (commercial arc first). Same density
      register as platform-led gold; teaches reordering and emphasis without new facts.
      Do not copy metrics or credentials unless ALLOWED_SOURCE_FACT_IDS support them.

  - id: exec_summary_pos_integrated_cred_001
    category: positive_variant
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building governed agentic AI platforms for regulated enterprise delivery with deterministic controls and traceable execution. Leads platform lifecycle and commercialization, converting complex delivery into reusable services adopted across programs. Generated proof-backed revenue and margin outcomes when selected facts support them. Quantitative and platform depth inform governance and commercialization balance, woven into delivery context rather than listed as a separate credential inventory.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — credentials woven into a substantive sentence (not a fifth-slot cert dump).

  - id: exec_summary_pos_credibility_implied_001
    category: positive_variant
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building governed agentic AI platforms for regulated enterprise delivery with traceable execution and policy discipline. Leads platform lifecycle and commercialization, converting complex capabilities into reusable services adopted across programs. Generated proof-backed revenue and margin outcomes when selected facts support them. Quantitative actuarial training and cloud data platform depth reinforce governance and delivery decisions without naming individual certifications.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — passes x2_exec_summary_no_credential_dump: implies credibility without
      AWS/Databricks/FSA/Basel/CCAR label stacks or a trailing cert sentence.

  - id: exec_summary_pos_svp_it_strategy_001
    category: positive_variant
    authority: E0_STYLE_EXAMPLE_NOT_PROOF
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Technology strategy executive aligning governed AI platforms, regulatory lineage, and commercialization into one enterprise direction when facts support platform and governance themes. Scales engineering and platform delivery with quantified margin and revenue outcomes woven into a single narrative arc rather than stacked bullets. Leads platform lifecycle and operating-model design when selected facts support scale and governance themes. Delivers proof-backed outcomes across regulated enterprise programs when ALLOWED_SOURCE_FACT_IDS support commercial and delivery metrics.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — SVP IT strategy register (targeting shapes emphasis only). Four dense
      sentences; JD/briefing may tilt emphasis but must not add proof.

  - id: exec_summary_neg_credential_dump_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building governed platforms for enterprise delivery. Leads lifecycle and commercial adoption across programs. Delivery outcomes remain grounded in selected executive facts. AWS Certified Machine Learning Engineer, AWS Certified Solutions Architect, Databricks Lakehouse Fundamentals, and Fellow of the Society of Actuaries credentials reinforce senior IT strategy leadership.
    annotation: >
      VIOLATION: credential/certification inventory block; belongs in certifications section.

  - id: exec_summary_neg_mechanism_inventory_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive building governed platforms. The leader delivers deterministic routing, multi-agent orchestration, GraphRAG retrieval, sandboxed execution, policy gating, validation controls, and replayable execution traces into enterprise capability. Platform lifecycle work spans architecture and operating model design. Outcomes stay grounded in selected executive facts.
    annotation: >
      VIOLATION: mechanism inventory sentence; comma-chain architecture list, not synthesis.

  - id: exec_summary_neg_label_stitch_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Enterprise Agentic AI Platform Architecture: designed and operationalized a governed agentic AI platform. Dependency Graph Accelerator: built software dependency graph intelligence.
    annotation: >
      VIOLATION: selected-fact label / title colon stitching; reads like artifact
      labels pasted into prose instead of one executive paragraph.
    ai_giveaway_markers:
      - label_colon_stitching
      - non_executive_register

  - id: exec_summary_neg_meta_filler_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive across the scope described in selected facts with active-voice delivery and governance discipline.
    annotation: >
      VIOLATION: meta-scaffolding; prompt-compliance narration; not credible résumé prose.
    ai_giveaway_markers:
      - meta_filler
      - selected_facts_phrase_leak

  - id: exec_summary_neg_sentence_stack_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Engineering executive specializing in governed agentic AI platforms. Built deterministic routing. Built GraphRAG retrieval. Built telemetry instrumentation. Reduced deployment cycles.
    annotation: >
      VIOLATION: one short sentence per fact; proof stacking; lacks narrative synthesis.
    ai_giveaway_markers:
      - sentence_stacked_proof
      - bullet_voice

  - id: exec_summary_neg_001
    category: negative
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: null
    after: |
      Seasoned executive -- bringing 18+ years of cross-functional synergies and
      dynamic leadership to enterprise AI transformations. Passionate about
      fostering innovation across diverse, high-performing teams.
    annotation: >
      VIOLATION: opens with discouraged opener "Seasoned executive", uses double
      hyphen substituting em dash, "cross-functional synergies" corporate
      buzzword, "Passionate about" generic opener, no claim_ledger-ready proof, JD keyword
      mirror, no concrete metrics.
    ai_giveaway_markers:
      - generic_opener
      - corporate_buzzwords
      - no_ledger_grounding
      - keyword_mirror
    anti_ai_compliance:
      no_em_dash: false
      no_pioneered_orchestrated: false
      no_corporate_buzzwords: false
      voice_variation_score: low

  - id: exec_summary_neg_002
    category: negative
    section: executive_summary
    seniority_band: SENIOR
    xml_wrapped: true
    before: null
    after: |
      Results-driven technology leader who is passionate about leveraging
      synergies to drive meaningful impact across the dynamic landscape of
      modern enterprise software. Proven track record of delivering value.
    annotation: >
      VIOLATION: "Results-driven" generic opener, "passionate about", "leveraging
      synergies", "dynamic landscape", "drive meaningful impact", "Proven track
      record" -- all AI-pattern phrases. Zero concrete evidence or ledger-ready proof.
    ai_giveaway_markers:
      - generic_opener
      - corporate_buzzwords
      - no_ledger_grounding
      - no_metrics
    anti_ai_compliance:
      no_em_dash: true
      no_pioneered_orchestrated: false
      no_corporate_buzzwords: false
      voice_variation_score: low

  - id: exec_summary_repair_001
    category: repair
    section: executive_summary
    seniority_band: EXECUTIVE
    xml_wrapped: true
    before: |
      Visionary CTO -- pioneering AI transformation across enterprise clients
      with a holistic approach to robust solution delivery. Spearheaded
      cross-functional synergies resulting in paradigm-shifting outcomes.
    after: |
      CTO with 14 years building AI platforms for Fortune 500 clients.
      Delivered $3.8M ARR growth through platform consolidation in 2022.
      Scaled engineering org from 12 to 60 across three acquisitions.
    repair_actions:
      - Removed "Visionary" generic opener
      - Removed em dash (--) and replaced sentence structure
      - Replaced "pioneering AI transformation" with concrete role + years
      - Removed "holistic approach", "robust solution", "cross-functional synergies", "paradigm-shifting"
      - Bound metrics to claim_ledger rows (display prose stays free of inline source tags)
      - Grounded claims in specific metrics
    annotation: >
      Repair converts AI-pattern opener + buzzword density into concrete,
      ledger-grounded natural prose with seniority identity lead.
    anti_ai_compliance:
      no_em_dash: true
      no_pioneered_orchestrated: true
      no_corporate_buzzwords: true
      voice_variation_score: high


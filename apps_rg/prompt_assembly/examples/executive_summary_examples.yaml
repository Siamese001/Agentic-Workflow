      Engineering executive building production-grade AI platforms and governed runtime architecture for regulated enterprise environments.
      Designs and operates systems that combine orchestration, retrieval, policy enforcement, and traceability to improve reliability, auditability, and deployment speed.
      Leads full platform lifecycle work across architecture, operating model, and engineering scale-out.
      Quantitative actuarial depth supports regulated delivery when those themes appear in the allowed pool.
      Platform commercialization and governance themes stay woven into one narrative arc rather than stacked credential lists.
    claim_ledger_grounded: false
    annotation: >
      STYLE VARIANT — outcomes-led narrative order (commercial arc first). Same density
      register as platform-led gold; teaches reordering and emphasis without new facts.
      Do not copy metrics or credentials unless ALLOWED_SOURCE_FACT_IDS support them.


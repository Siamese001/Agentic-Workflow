      - U0
      - D0
      - R0
    optional_slots:
      - H0
    output_contract:
      format: json
      schema_ref: rg_output_schema.json
      sections:
        - verification_report
        - unsupported_claims
        - suggested_corrections
    
  unsupported_claim_omission_v1:
    template_id: unsupported_claim_omission_v1

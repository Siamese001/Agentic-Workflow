# apps_rg Prompt Template Registry
# Maps flow_routes to template files with slot bindings
# Ownership: apps_rg owns this registry; agentic_core must never modify.

schema_version: "1.0"
registry_id: "reg::apps_rg::resume_generation::v1"
app_id: apps_rg
task_class: resume_generation
version: "1"
status: active

# =============================================================================
# E3 Execution Templates (Primary Generation Flows)
# =============================================================================
templates:
  strategic_tailor_v1:
    template_id: strategic_tailor_v1
    description: Strategic tailoring for executive/senior roles with deep JD alignment
    path: templates/strategic_tailor_v1.yaml
    version: "1.0"
    allowed_stage: E3_EXEC
    section_contract_refs:
      executive_summary: section_contracts/executive_summary_contract.yaml
      competencies: section_contracts/competencies_contract.yaml
      unify: section_contracts/unify_contract.yaml
    required_slots:
      - S0
      - I0
      - C0
      - U0
      - D0
      - E0
      - Y0
      - R0
    optional_slots:
      - H0
      - M0
    output_contract:
      format: json
      schema_ref: rg_output_schema.json
      sections:
        - summary
        - experience
        - projects
        - skills
        - education
    
  tailor_existing_v1:
    template_id: tailor_existing_v1
    description: Tailor existing resume for target role with minimal restructuring
    path: templates/tailor_existing_v1.yaml
    version: "1.0"

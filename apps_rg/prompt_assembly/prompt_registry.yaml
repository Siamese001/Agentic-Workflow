    required_slots:
      - S0
      - I0
      - C0
      - U0
      - D0
      - Y0
      - R0
    optional_slots:
      - E0
      - H0
      - M0
    output_contract:
      format: json
      schema_ref: rg_output_schema.json
      sections:
        - summary
        - experience
        - projects
        - skills
        - education
    
  generate_scratch_v1:
    template_id: generate_scratch_v1
    description: Generate resume from raw candidate facts without existing resume structure
    path: templates/generate_scratch_v1.yaml
    version: "1.0"
    allowed_stage: E3_EXEC
    section_contract_refs:
      executive_summary: section_contracts/executive_summary_contract.yaml
      competencies: section_contracts/competencies_contract.yaml
      unify: section_contracts/unify_contract.yaml
    required_slots:
      - S0
      - I0
      - C0
      - U0
      - D0
      - E0
      - Y0
      - R0
    optional_slots:

# =============================================================================
# Default Template Resolution
# =============================================================================
default_templates:
  senior: strategic_tailor_v1
  staff: strategic_tailor_v1
  principal: strategic_tailor_v1
  mid: tailor_existing_v1
  junior: generate_scratch_v1
  executive: strategic_tailor_v1

# =============================================================================
# Template Selection Rules
# =============================================================================
selection_rules:
  - condition: seniority_band in [senior, staff, principal, executive]
    template: strategic_tailor_v1
  - condition: has_existing_resume and not requires_restructuring
    template: tailor_existing_v1
  - condition: not has_existing_resume
    template: generate_scratch_v1
  - condition: requires_enhancement_only
    template: enhance_current_v1

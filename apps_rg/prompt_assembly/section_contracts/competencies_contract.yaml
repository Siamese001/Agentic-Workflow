version: "1.0"
section: competencies
description: >
  Professional Competencies is a target-aware, fact-constrained selection and grouping lane.
  It selects, groups, normalizes, and prioritizes supported competency terms from the allowed
  base-resume fact pool. JD, briefing, title, company, and companion generated sections may
  influence emphasis, labels, ordering, and relevance — never proof.

evidence:
  evidence_required: candidate_facts_only
  note: >
    Every emitted competency term must trace to allowed source_fact_ids from the canonical
    base resume / C0 candidate facts. No JD-only, briefing-only, or companion-only proof.

gap_marking:
  jd_gap_marking: optional_notes_only
  note: >
    Unsupported JD or briefing phrases belong in excluded_jd_skills / gap_notes — do not
    emit them as competency terms.

display_and_proof:
  resume_display_text: clean_no_inline_source_tags
  proof_surfaces: claim_ledger_and_source_fact_ids
  display_pattern: "Category Label: compact phrase, compact phrase, ..."
  note: >
    Scannable executive capability index — not a narrative impact section.
    Terms are compact noun phrases (no full sentences, metrics, or accomplishment prose).
    JD/briefing/title/company/companion are targeting context only.

ordering:
  cluster_ordering: target_influenced_within_fact_constraints
  note: >
    JD/briefing may influence category ordering and labels only within allowed facts.

forbidden:
  - jd_only_skills_unlabeled
  - keyword_stuffing
  - unsupported_trendy_terms

naturalness_guidance_ref: "forbidden_ai_phrases.yaml"

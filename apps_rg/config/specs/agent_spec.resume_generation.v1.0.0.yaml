# AgentSpec instance — apps_rg resume generation agent
# Conforms to: requirements/contracts/REQ-CROSS-APP-AGENTSPEC-001.contract.yaml
#
# Resume generation is a deterministic ranked-projection pipeline:
#   intake (master resume + JD) -> ATS keyword extraction -> achievement
#   prioritization -> section composition -> ATS compatibility check ->
#   quality gate -> output bundle.
#
# Tier: WORKFLOW (deterministic pipeline; no autonomous tool-loop; no
# bounded-replan; humans do the actual job application).
#
# Status: experimental. signed_by intentionally empty until L5 attestation
# lands (mirrors apps_underwriting_ai pattern).

spec_id: agt_rgresume000000000000001
spec_version: "0.1.0"
parent_spec_id: null

created_by:
  tenant: agentic-workflow
  principal: cascade-apps-rg-w8
  origin: developer-loop

signed_by: ""  # MUST be set by L5 attestation before registry write

status: experimental

purpose:
  one_line: >-
    Tailor a master resume to a specific job description with full ATS
    compatibility, evidence-grounded claims, and zero fabricated history.
  success_criteria:
    - Output validates against required-sections schema (summary, experience, skills)
    - ATS compatibility score >= rg_thresholds.min_ats_score (70)
    - Quality score >= rg_thresholds.min_quality_score (0.75)
    - No prohibited content emitted (protected_demographics, salary_history, age, photo)
    - No fabricated companies, dates, or credentials beyond master resume
    - Replay produces deterministic rank order for the same (master, JD) pair

scope:
  allowed_tasks:
    - ingest_master_resume
    - ingest_job_description
    - extract_ats_keywords
    - prioritize_achievements
    - compose_summary
    - compose_experience_bullets
    - compose_skills_section
    - check_ats_compatibility
    - score_quality
    - render_output_bundle
  disallowed_tasks:
    - fabricate_employment_history
    - fabricate_credentials
    - inflate_metrics_beyond_source
    - emit_protected_demographics
    - emit_salary_history
    - mimic_jd_phrasing_as_persona
  audience:
    tenant: agentic-workflow
    team: career-development
    role: candidate
    individual: null
  domain_tags:
    - resume_generation
    - ats_optimization
    - career
  out_of_scope_behavior: DECLINE

agency:
  tier: WORKFLOW
  justification: >
    Resume generation is a deterministic multi-stage projection pipeline
    (ingest -> extract -> prioritize -> compose -> check -> score -> render).
    Single orchestrator (resume_orchestrator_engine) is sufficient. No
    tool-loop, no autonomous bounded-replan, no agency over the candidate's
    final job-application decision.
  max_tool_calls_per_turn: 0
  max_turns: 1
  parallel_tool_calls: false

permissions:
  tools: []
  data_sources:
    - source_id: master_resume_json
      access: read
      row_filters: null
      column_filters: null
    - source_id: job_description_json
      access: read
      row_filters: null
      column_filters: null
    - source_id: rg_policies
      access: read
      row_filters: null
      column_filters: null
    - source_id: rg_thresholds
      access: read
      row_filters: null
      column_filters: null
  egress:
    allowed_domains: []
    blocked_by_default: true

instruction_hierarchy:
  - policy
  - registry_constraints
  - developer_constraints
  - evidence_rules
  - tone_bounds
  - one_off_user_instruction

response_contract:
  output_schemas:
    - apps_rg/config/rg_policies.yaml::section_requirements
    - apps_rg/config/rg_thresholds.yaml::quality_gates
  tone_bounds:
    register: neutral_professional
    max_persona_tokens: 600  # compiled-prompt cap; resume itself is the candidate's voice, not the agent's
    forbidden:
      - flattery
      - fake_intimacy
      - mimicry_of_user_phrasing  # JD-phrase mimicry covered here
      - inflated_certainty         # fabricated metrics covered here
      - decorative_apology
      - hedging_filler
    voice_profile_ref: null
    # NOTE: fabricated_employment_history and fabricated_metrics are
    # additionally enforced via anti_overfit_profile.fake_history_tolerance: 0.0
    # and the rubric hard_floor on evidence_grounding.
  citation_policy: REQUIRED_WHEN_EVIDENCE  # every claim must trace to master resume

domain_rules:
  prohibited_features:
    - rg_policies.yaml::content_policies.prohibited
  required_constraints:
    - rg_policies.yaml::section_requirements.summary.required
    - rg_policies.yaml::section_requirements.experience.required
    - rg_policies.yaml::section_requirements.skills.required
    - rg_policies.yaml::content_policies.required
    - rg_thresholds.yaml::quality_gates.min_ats_score
    - rg_thresholds.yaml::quality_gates.min_quality_score
  rule_set_refs:
    - apps_rg/config/rg_policies.yaml
    - apps_rg/config/rg_thresholds.yaml
    - apps_rg/config/rg_agent_specs.json

memory_policy:
  durable_preferences: []
  session_memory:
    enabled: false
    ttl: PT0S
    redaction_rules: []
  forbidden_to_remember:
    - pii
    - transient_intent
    - affect
    - private_phrasing  # JD company internals classified under private_phrasing
  promotion_path: UWG_only

failure_behavior:
  on_ambiguity: ASK_FOCUSED_CLARIFY
  on_missing_evidence: STATE_ASSUMPTION_OR_DECLINE
  on_tool_error: BOUNDED_RETRY_THEN_ESCALATE
  on_policy_conflict: HALT_AND_ESCALATE

escalation:
  triggers:
    - high_stakes_topics
    - low_confidence
    - policy_edge
    - hard_floor_breach  # prohibited content / fabricated history both fire as hard_floor_breach
  target: rg_human_review_queue

evals:
  rubric_id: rub_apps_rg_resume_generation_v1
  rubric_version: "0.1.0"
  test_matrix_id: tmx_rg_v1
  min_release_thresholds:
    task_fit: 3.0
    evidence_grounding: 4.0       # every numeric claim must trace to master
    non_contrivance: 4.0           # zero fabrication tolerance
    overfit_risk_max: 1.0          # tight — resume must not parrot JD phrasing
    safety: 4.0                    # hard floor — prohibited content => reject

governance:
  hitl_required_for:
    - scope_change
    - tool_grant
    - memory_promotion
    - agency_tier_promotion
  replay_policy: FULL
  audit_retention: P2Y

anti_overfit_profile:
  mimicry_max: 0.30                # tight — JD vocabulary must not become candidate voice
  repeated_user_phrase_max: 2      # at most 2 JD phrases reflected back
  forced_warmth_threshold: 0.10
  fake_history_tolerance: 0.0      # zero — all employment must come from master
  certainty_calibration_required: true

# Derived; populated by Spec Compiler. Block omitted pre-compilation.
compiled_artifacts: null

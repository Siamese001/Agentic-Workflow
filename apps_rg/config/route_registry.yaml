# apps_rg L0 route registry.
#
# Mirrors apps_qna/config/route_registry.yaml. Declares the apps_rg routes
# that L0 may select and binds each route to a static L3 DAG. apps_rg's
# only route today is a deterministic HOP pipeline; L3 runtime
# orchestration is correctly bypassed (NO_MANAGED_WORKFLOW_REQUIRED) per
# the e2e proof spec, but the static DAG is registered so the topology
# is auditable.
#
# Schema:
#   app_name              — owning app
#   routes[].route_id     — stable route identifier
#   routes[].execution_form — MANAGED_WORKFLOW | DETERMINISTIC_PIPELINE | ...
#   routes[].l3_required  — true ⇒ runtime L3 must orchestrate; false ⇒ bypass
#   routes[].static_dag_ref — path to the static L3 DAG file
#   routes[].selected_capability — symbolic capability name

app_name: apps_rg
schema_version: "apps_rg.route_registry/v1"

routes:
  # ── Managed workflow route — REGISTERED, NOT YET ACTIVE ────────────────
  # Status reverted to registered_not_active per W5C-P0 Author-Gate decision
  # (Option B, 2026-05-11). Activation is deferred until W5C P1 completes the
  # L0 migration to the generic route policy engine and sentinel tests pass.
  # Do not flip to active until: (1) apps_rg_l0_binding.py replaced by
  # package_driven_l0_binding.py consuming route_profiles.yaml, (2) all
  # test_apps_rg_l0_managed_route_resolution.py sentinel tests pass.
  - route_id: apps_rg.resume_generation_managed_v1
    execution_form: MANAGED_WORKFLOW
    l3_required: true
    static_dag_ref: null
    workflow_manifest_ref: "wfm::apps_rg::resume_generation::v1"
    workflow_manifest_path: "apps_rg/config/workflow_manifest.resume_generation.v1.yaml"
    selected_capability: apps_rg.resume_generation_managed_v1
    status: registered_not_active
    description: >-
      Managed workflow route for apps_rg resume generation. Registered but
      not yet active — activation gated on W5C P1 L0 generic engine migration
      and certification. L3 ManagedWorkflowRunner will orchestrate
      workflow_manifest.resume_generation.v1.yaml once activated.
    activation_plan_ref: "apps-rg-zip-based-full-spine-runtime-restoration-a3f7e2 post-RB16"
    deferred_activation_ref: "W5C_P0 Author-Gate Option B 2026-05-11"
    activate_when: "W5C P1 L0 migration complete and sentinel tests pass"

  # ── Legacy deterministic HOP pipeline — DEPRECATED ───────────────────────
  # Superseded by managed workflow route above (post-RB16 activation).
  # Retained on disk for audit trail only. L0 will not select this route
  # once managed workflow activation policy is active.
  - route_id: apps_rg.resume_generation_v1
    execution_form: DETERMINISTIC_PIPELINE
    l3_required: false
    static_dag_ref: apps_rg/config/l3_dag.yaml
    selected_capability: apps_rg.resume_generation_v1
    status: deprecated
    description: >-
      DEPRECATED: Legacy deterministic HOP pipeline (intake -> generate_resume ->
      narrative_pass -> docx_export). Superseded by resume_generation_managed_v1.
      Retained for audit trail. Do not activate.
    bypass_reason_when_invoked: NO_MANAGED_WORKFLOW_REQUIRED
    deprecated_at: "2026-05-11"
    superseded_by: apps_rg.resume_generation_managed_v1

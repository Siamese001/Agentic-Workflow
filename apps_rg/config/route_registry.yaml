# apps_rg L0 route registry.
#
# Mirrors apps_qna/config/route_registry.yaml. Declares the apps_rg routes
# that L0 may select and binds each route to a static L3 DAG. apps_rg's
# only route today is a deterministic HOP pipeline; L3 runtime
# orchestration is correctly bypassed (NO_MANAGED_WORKFLOW_REQUIRED) per
# the e2e proof spec, but the static DAG is registered so the topology
# is auditable.
#
# Schema:
#   app_name              — owning app
#   routes[].route_id     — stable route identifier
#   routes[].execution_form — MANAGED_WORKFLOW | DETERMINISTIC_PIPELINE | ...
#   routes[].l3_required  — true ⇒ runtime L3 must orchestrate; false ⇒ bypass
#   routes[].static_dag_ref — path to the static L3 DAG file
#   routes[].selected_capability — symbolic capability name

app_name: apps_rg
schema_version: "apps_rg.route_registry/v1"

routes:
  - route_id: apps_rg.resume_generation_v1
    execution_form: DETERMINISTIC_PIPELINE
    l3_required: false
    static_dag_ref: apps_rg/config/l3_dag.yaml
    selected_capability: apps_rg.resume_generation_v1
    description: >-
      Deterministic HOP pipeline: intake -> generate_resume.main() ->
      narrative_pass (HOP-4A..4H) -> docx_export. No retry/branch/join
      logic; runtime L3 orchestration is not required.
    bypass_reason_when_invoked: NO_MANAGED_WORKFLOW_REQUIRED

  # ── Managed workflow route (W3 registry binding — not yet active) ────────
  # Registered for discoverability by ManagedWorkflowEngine.register_workflow().
  # l3_required: true — this route requires runtime L3 orchestration.
  # Activation guarded by route contract; DETERMINISTIC_PIPELINE route
  # remains the active default until L3 runner is wired in W4.
  - route_id: apps_rg.resume_generation_managed_v1
    execution_form: MANAGED_WORKFLOW
    l3_required: true
    static_dag_ref: null
    workflow_manifest_ref: "wfm::apps_rg::resume_generation::v1"
    workflow_manifest_path: "apps_rg/config/workflow_manifest.resume_generation.v1.yaml"
    selected_capability: apps_rg.resume_generation_managed_v1
    status: registered_not_active
    description: >-
      Managed workflow route for apps_rg resume generation. Declares the
      workflow manifest for ManagedWorkflowEngine resolution. Not active until
      W4 L3 runner wiring is complete. Exists to make the manifest discoverable
      without app-specific branching in core.
    activation_plan_ref: "apps-rg-zip-based-full-spine-runtime-restoration-a3f7e2 W4"

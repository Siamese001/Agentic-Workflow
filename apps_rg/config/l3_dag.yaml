# Static L3 DAG for apps_rg.resume_generation_v1.
#
# Documents the deterministic HOP pipeline topology. apps_rg does NOT
# request runtime L3 orchestration (l3_required=false in route_registry);
# this DAG exists so the topology is auditable, the registry binding is
# real, and the e2e proof harness can verify all static-DAG invariants:
#
#   - bound to apps_rg
#   - acyclic
#   - has entry + terminal
#   - every node has owner + step_contract_schema + execution_surface
#   - L3 declares no execute / retrieve / prompt-assembly / L4-write authority
#   - every edge references existing nodes
#
# When/if a future apps_rg route adds branches or retries, that route
# will register its own DAG in this file with l3_required=true and the
# bypass receipt path will not apply.

dag_id: apps_rg.resume_generation_v1.l3_dag
dag_name: "apps_rg Resume Generation Pipeline"
dag_version: "1.0.0"
app_name: apps_rg
route_binding: apps_rg.resume_generation_v1

# L3 authority declarations — apps_rg's L3 ONLY shapes workflow.
l3_no_execute_policy: true
l3_no_retrieve_policy: true
l3_no_prompt_assembly_policy: true
l3_no_l4_write_policy: true

entry_nodes:
  - intake

terminal_nodes:
  - docx_export

nodes:
  - id: intake
    name: "U0 Intake"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.U0IntakeEnvelope.v1
    allowed_execution_surface: l0_ingress
    bullet: "Validate CLI args and seed run_id."
  - id: plan
    name: "L1 Plan"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.L1PlanContract.v1
    allowed_execution_surface: l1_planner
    bullet: "Emit deterministic HOP plan."
  - id: route
    name: "L0 Route"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.RouteContract.v1
    allowed_execution_surface: l0_router
    bullet: "Select apps_rg.resume_generation_v1 capability."
  - id: l3_bind
    name: "L3 Bypass Binding"
    owner: apps_rg
    kind: checkpoint
    step_contract_schema: apps_rg.L3BypassReceipt.v1
    allowed_execution_surface: l3_orchestrator
    bullet: "Record NO_MANAGED_WORKFLOW_REQUIRED bypass reason."
  - id: hop_pipeline
    name: "L2 Execute — HOP Pipeline"
    owner: apps_rg
    kind: execution
    step_contract_schema: apps_rg.L2ExecutionReceipt.v1
    allowed_execution_surface: l2_executor
    bullet: "Run generate_resume + narrative_pass + DOCX export."
  - id: exit_disposition
    name: "Exit X3"
    owner: apps_rg
    kind: checkpoint
    step_contract_schema: apps_rg.ExitReviewPacket.v1
    allowed_execution_surface: exit_gate
    bullet: "Seal X3 disposition based on subprocess exit + stage outcomes."
  - id: docx_export
    name: "Terminal — Sealed Resume Artifact"
    owner: apps_rg
    kind: terminal
    step_contract_schema: apps_rg.RuntimeExhaustBundle.v1
    allowed_execution_surface: l6_observer
    bullet: "L6 seals exhaust bundle with all artifact SHAs."

edges:
  - from: intake
    to: plan
    kind: handoff
  - from: plan
    to: route
    kind: handoff
  - from: route
    to: l3_bind
    kind: handoff
  - from: l3_bind
    to: hop_pipeline
    kind: handoff
  - from: hop_pipeline
    to: exit_disposition
    kind: handoff
  - from: exit_disposition
    to: docx_export
    kind: handoff

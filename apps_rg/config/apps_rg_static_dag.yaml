# apps_rg static L2 execution recipe — R4_SINGLE_ACTION route family.
#
# This is the declarative form of the deterministic HOP pipeline.  The
# existing l3_dag.yaml documents topology for auditing; this file is the
# authoritative L2 STATIC RECIPE consumed by integrated_r4_deterministic_
# pipeline_run.py (W2 P3) and validated by the e2e proof harness.
#
# HOP IDs are renamed vs l3_dag.yaml to match the canonical naming
# convention: hop_0_load_validated_inputs, hop_1_plan, etc.
#
# Plan: apps-rg-canonical-wireup-c8a4f2 W4 P9.

schema_version: "apps_rg_static_dag/v1"
dag_id: apps_rg.resume_generation_v1.static_dag
app_name: apps_rg
route_binding: apps_rg.resume_generation_v1
route_family: R4_SINGLE_ACTION

# L3 authority declarations: apps_rg's static recipe shapes workflow ONLY.
l3_no_execute_policy: true
l3_no_retrieve_policy: true
l3_no_prompt_assembly_policy: true
l3_no_l4_write_policy: true

# C0 bypass declaration: apps_rg uses preloaded inputs, not corpus retrieval.
c0_bypass:
  reason: GROUNDING_NOT_REQUIRED
  inputs:
    - label: jd
      description: Job-description JSON, loaded from --jd path at U0 intake.
    - label: company_brief
      description: Company research JSON, loaded from --manual-brief path.
    - label: master_resume
      description: Master résumé JSON at apps_shared/data/master_resume.json.

entry_nodes:
  - hop_0_load_validated_inputs

terminal_nodes:
  - hop_8_seal_exhaust_bundle

nodes:
  - id: hop_0_load_validated_inputs
    name: "HOP-0: Load Validated Inputs"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.U0IntakeEnvelope.v1
    allowed_execution_surface: l0_ingress
    bullet: >-
      Validate CLI args (--jd, --target-company, --manual-brief) against
      intake_policy.yaml; load JD bytes + brief bytes; build
      PreloadedInputContextManifest.

  - id: hop_1_plan
    name: "HOP-1: L1 Deterministic Plan"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.L1PlanContract.v1
    allowed_execution_surface: l1_planner
    bullet: >-
      Extract JDPlan via jd_planner (target_role, seniority_band, key_skills);
      emit deterministic HOP sequence according to jd_plan_rules.yaml.

  - id: hop_2_route
    name: "HOP-2: L0 Route Selection"
    owner: apps_rg
    kind: coordination
    step_contract_schema: apps_rg.RouteContract.v1
    allowed_execution_surface: l0_router
    bullet: >-
      Select apps_rg.resume_generation_v1 via L0 policy (l0_policy.yaml);
      emit C0BypassReceipt (GROUNDING_NOT_REQUIRED).

  - id: hop_3_r4_entrypoint
    name: "HOP-3: R4 Entrypoint — integrated_r4_deterministic_pipeline_run"
    owner: apps_rg
    kind: execution
    step_contract_schema: apps_rg.L2ExecutionReceipt.v1
    allowed_execution_surface: l2_executor
    bullet: >-
      Invoke run_integrated_r4_deterministic_pipeline; produces run_id,
      replay_key, x3_disposition, and manifest path.

  - id: hop_4_generate_resume
    name: "HOP-4: generate_resume main pipeline (HOPs 1-3, K-nodes)"
    owner: apps_rg
    kind: execution
    step_contract_schema: apps_rg.L2ExecutionReceipt.v1
    allowed_execution_surface: l2_executor
    bullet: >-
      Run apps_rg.scripts.generate_resume.main() — HOP-1 profile analysis,
      HOP-2 research grounding, HOP-3 sender grounding, K.0 thematic
      analysis, K.1-K.5 role-bullet generation.

  - id: hop_5_narrative_pass
    name: "HOP-5: Narrative Pass (HOPs 4A-4H, in-process)"
    owner: apps_rg
    kind: execution
    step_contract_schema: apps_rg.L2ExecutionReceipt.v1
    allowed_execution_surface: l2_executor
    bullet: >-
      Run apps_rg.scripts.narrative_pass.main(argv) in-process (W3 P8);
      enriches generated_resume.json with headline, exec summary,
      competencies, per-bullet narrative for Unify / IBM / TraderSense /
      EY, early-career buckets, and marquee outcomes.

  - id: hop_6_docx_export
    name: "HOP-6: DOCX Export (in-process)"
    owner: apps_rg
    kind: execution
    step_contract_schema: apps_rg.L2ExecutionReceipt.v1
    allowed_execution_surface: l2_executor
    bullet: >-
      Run apps_rg.outputs.docx_exporter.main(argv) in-process (W3 P8);
      produces recruiter-ready Word document from enriched
      generated_resume.json.

  - id: hop_7_exit_disposition
    name: "HOP-7: Exit V6 X3 Disposition"
    owner: apps_rg
    kind: checkpoint
    step_contract_schema: apps_rg.ExitReviewPacket.v1
    allowed_execution_surface: exit_gate
    bullet: >-
      Invoke ExitEvalPipeline.run (seal_exhaust=True); produces exactly one
      X3 disposition per run; seals RuntimeExhaustManifest.

  - id: hop_8_seal_exhaust_bundle
    name: "HOP-8: L6 Seal Exhaust Bundle (terminal)"
    owner: apps_rg
    kind: terminal
    step_contract_schema: apps_rg.RuntimeExhaustBundle.v1
    allowed_execution_surface: l6_observer
    bullet: >-
      L6 seals the exhaust bundle with artifact SHAs (generated_resume.json,
      narrative archive, DOCX, preloaded_input_context_manifest.json).

edges:
  - from: hop_0_load_validated_inputs
    to: hop_1_plan
    kind: handoff
  - from: hop_1_plan
    to: hop_2_route
    kind: handoff
  - from: hop_2_route
    to: hop_3_r4_entrypoint
    kind: handoff
  - from: hop_3_r4_entrypoint
    to: hop_4_generate_resume
    kind: handoff
  - from: hop_4_generate_resume
    to: hop_5_narrative_pass
    kind: handoff
  - from: hop_5_narrative_pass
    to: hop_6_docx_export
    kind: handoff
  - from: hop_6_docx_export
    to: hop_7_exit_disposition
    kind: handoff
  - from: hop_7_exit_disposition
    to: hop_8_seal_exhaust_bundle
    kind: handoff

# R5 terminal paths (short-circuit the normal pipeline).
r5_terminal_paths:
  - trigger: BRIEF_MISSING
    description: "company_brief file does not exist at --manual-brief path"
    short_circuit_after: hop_2_route
    policy_ref: rg_r5_policy.py::BRIEF_MISSING
  - trigger: JD_MISSING
    description: "JD file does not exist at --jd path"
    short_circuit_after: hop_0_load_validated_inputs
    policy_ref: rg_r5_policy.py::JD_MISSING
  - trigger: JD_INVALID
    description: "JD fails U0 schema validation (jd_schema.json)"
    short_circuit_after: hop_0_load_validated_inputs
    policy_ref: rg_r5_policy.py::JD_INVALID

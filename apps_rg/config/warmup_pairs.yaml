# apps_rg R1B semantic cache warm-up pairs
#
# Used by tools/apps_rg/warm_r1b_cache.py --from-registry to pre-seed the
# R1B semantic cache with synthetic intents for common company/role/level
# combinations. TOP_PAIRS in the script is used as fallback when this file
# is absent.
#
# Schema per entry:
#   company  — target company name (string)
#   role     — target role title (string)
#   level    — seniority level: junior | mid | senior | staff | principal | manager (string, default: mid)


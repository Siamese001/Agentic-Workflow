provider_profile_registry_id: apps_rg::provider_profiles::v1
app_id: apps_rg
version: "1.0.0"
status: active

wave10a_policy:
  default_provider: external_claude
  external_default_status: claude_default_for_apps_rg_e2e

profiles:
  local_generator_stub:
    profile_id: apps_rg::provider::local_generator_stub::v1
    provider_profile: local_generator_stub
    provider_class: stub
    capabilities:
      - text_generation
      - structured_json_generation
    endpoint_env_var: null
    api_key_env_var: null
    default: false

  external_openai_generator:
    profile_id: apps_rg::provider::external_openai_generator::v1
    provider_profile: external_openai
    provider_class: external_api
    model_env_var: APPS_RG_EXTERNAL_OPENAI_MODEL
    endpoint_env_var: APPS_RG_EXTERNAL_OPENAI_BASE_URL
    api_key_env_var: OPENAI_API_KEY
    capabilities:
      - text_generation
      - structured_json_generation
    default: false
    wave10a_status: selectable_for_parity_not_default

  external_claude_generator:
    profile_id: apps_rg::provider::external_claude_generator::v1
    provider_profile: external_claude
    provider_class: external_api
    # SINGLE SSOT for the apps_rg section generator model (no other file/env may define it).
    # default_model = high-signal default (all bullets + executive_summary + headline).
    # model_by_section = per-lane cost-tier overrides (competencies + all narratives -> Haiku).
    # Resolver: section_model_limits.resolve_section_generation_model(section_id).
    # Operator pin APPS_RG_EXTERNAL_CLAUDE_MODEL (model_env_var) overrides ALL sections when set.
    default_model: claude-sonnet-4-6
    model_by_section:
      competencies: claude-haiku-4-5
      unify_narrative: claude-haiku-4-5
      ibm_narrative: claude-haiku-4-5
      insurtech_narrative: claude-haiku-4-5
      ey_narrative: claude-haiku-4-5
    # Per-lane generation reasoning intensity (plan apps-rg-config-ssot-consolidation W2).
    # Resolver: section_model_limits.resolve_section_reasoning_intensity(section_id).
    # NOT yet threaded into the live generation request (W3 wires it after the modular-lane
    # generation seam is located); until then this is inert SSOT (tests only). Per-lane values
    # are placeholders to be reconciled with the live seam's current params before W3 threading.
    reasoning_by_section:
      default: { temperature: 0.2, max_output_tokens: 4096 }
      executive_summary: { temperature: 0.1, max_output_tokens: 4096 }
      headline: { temperature: 0.3, max_output_tokens: 1024 }
    model_env_var: APPS_RG_EXTERNAL_CLAUDE_MODEL
    endpoint_env_var: APPS_RG_EXTERNAL_CLAUDE_BASE_URL
    api_key_env_var: ANTHROPIC_API_KEY
    capabilities:
      - text_generation
      - structured_json_generation
    default: true
    wave10a_status: default_for_apps_rg_e2e

  external_default_generator:
    profile_id: apps_rg::provider::external_default_generator::v1
    provider_profile: external_default
    provider_class: external_api
    capabilities:
      - text_generation
      - structured_json_generation
    default: false
    wave10a_status: target_only_after_wave10b_parity

  deterministic_grader:
    profile_id: apps_rg::provider::deterministic_grader::v1
    provider_profile: deterministic_grader
    provider_class: deterministic
    capabilities:
      - deterministic_grading
    endpoint_env_var: null
    api_key_env_var: null
    default: false

  llm_judge_stub:
    profile_id: apps_rg::provider::llm_judge_stub::v1
    provider_profile: llm_judge_stub
    provider_class: stub
    capabilities:
      - judge_grade_only
    endpoint_env_var: null
    api_key_env_var: null
    default: false

  executive_positioning_judge_stub:
    profile_id: apps_rg::provider::executive_positioning_judge_stub::v1
    provider_profile: executive_positioning_judge_stub
    provider_class: stub
    capabilities:
      - executive_positioning_judge
    endpoint_env_var: null
    api_key_env_var: null
    default: false

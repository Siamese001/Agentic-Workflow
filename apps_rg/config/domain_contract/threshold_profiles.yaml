- threshold_profile_id: atp::apps_rg::resume_generation::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  overall_pass_threshold: 0.75
  risk_tier: standard
  route_id: "rg.resume_generation.default"
  unknown_policy: fail_closed
  abstain_policy: hard
  hitl_policy: required_on_low
  policy_hash: "policy://apps_rg/v1"
  # Per-dimension minimums — Exit enforces these in addition to overall_pass_threshold.
  # Source: apps_rg/config/rg_thresholds.yaml (migrated to L4 via UWG).
  dimension_minimums:
    factual_grounding: 0.95
    role_alignment: 0.65
    ats_readability: 0.80
    executive_positioning: 0.0       # not always required
    specificity: 0.55
    concision: 0.60
    format_compliance: 0.95
    no_fabrication: 0.99
    competencies_structure: 0.60     # 6-category engineering/platform format required
  # W4.P3 (plan apps-eval-harness-parity-f8d4a2): dims listed here keep
  # min=0.0 deliberately — they remain in the weighted overall score but
  # are NOT gated per-dim. Their eval_rubric min_required_score still
  # applies only as documentation of "ideal" performance; runtime gating
  # is by the weighted overall_pass_threshold plus the non-zero entries
  # above. CI gate check_app_domain_harness_parity.py suppresses
  # NO_DEAD_THRESHOLDS WARNs for these dims.
  intentional_zero_dims:
    - executive_positioning  # contextual — only meaningful for senior/exec roles
  source_app_config_ref: "apps_rg/config/rg_thresholds.yaml"
  created_at: "2026-05-01"

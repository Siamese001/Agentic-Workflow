# apps_rg Delegation Profile
# Defines validation and delegation rules for the Resume Generation app
# This is app-owned configuration - agentic_core reads but does not hardcode these values

profile_version: "1.0"
app_id: "apps_rg"

# Payload validation rules
payload_validation:
  # Whether this app requires jd_content_hash for delegation
  require_jd_content_hash: true
  
  # Whether this app requires role_context_hash for delegation
  require_role_context_hash: false
  
  # Custom error messages for validation failures
  error_messages:
    missing_jd_hash: "apps_rg delegation requires jd_content_hash when JD context present"
    missing_role_hash: "apps_rg delegation requires role_context_hash when role context present"

# Substrate reuse validation rules
reuse_validation:
  # Fields to compare for substrate reuse eligibility
  required_match_fields:
    - tenant_id
    - jd_content_hash
  
  # Fields that must not be compared (app-specific exclusions)
  exclude_fields: []
  
  # Reuse eligibility rules
  eligibility_rules:
    - rule_id: "jd_hash_match"
      field: "jd_content_hash"
      condition: "equals"
      failure_eligibility: "JD_HASH_MISMATCH"
      description: "Substrate JD hash must match request JD hash"

# Terminal cache prohibition
terminal_cache:
  # Output types that are prohibited from being cached as terminal answers
  prohibited_output_types:
    - "apps_rg_final_resume_bullets_terminal_cache"
    - "apps_rg_final_resume_sections_terminal_cache"
  
  # Data boundary labels that are always allowed
  allowed_boundary_labels:
    - "EVIDENCE_DATA_ONLY"

# Delegation routing rules
delegation_routing:
  # Allowed target apps for delegation
  allowed_targets:
    - "apps_research"
  
  # Required fields in delegation context
  required_context_fields:
    - "caller_app_id"
    - "task_class"
    - "cross_app_reuse_policy_ref"
  
  # Optional fields that may be validated if present
  optional_context_fields:
    - "jd_content_hash"
    - "tenant_id"
    - "session_id"

# Profile metadata
metadata:
  description: "Resume Generation app delegation profile"
  owner: "apps_rg"
  created_at: "2026-05-11"
  migration_source: "cross_app_payload_validator.py, package_driven_delegation_broker.py"

# apps_rg eval rubric — domain-specific dimensions per the user's spec:
# factual grounding, role alignment, ATS readability, exec positioning,
# specificity, concision, format compliance, no fabrications.
- eval_rubric_id: aer::apps_rg::resume_generation::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  policy_hash: "policy://apps_rg/v1"
  source_app_config_ref: "apps_eval/config/rubrics/rub_apps_rg_resume_generation_v1.yaml"
  created_at: "2026-05-01"
  score_dimensions:
    - dimension_id: factual_grounding
      description: >-
        Every employer, date, title, credential, and metric in the rendered
        resume must trace back to the candidate_profile by exact id or by
        deterministic match. Hallucinated content is the cardinal failure.
      weight: 0.25
      grader_type: deterministic
      min_required_score: 0.95
      evidence_required: true
      fail_closed_if_unknown: true
      taxonomy_class: regression

    - dimension_id: role_alignment
      description: >-
        Resume language and emphasis align with the target_role_spec
        (title, level, JD requirements, seniority signals).
      weight: 0.15
      grader_type: hybrid
      min_required_score: 0.65
      evidence_required: true
      fail_closed_if_unknown: true
      taxonomy_class: capability

    - dimension_id: ats_readability
      description: >-
        Output parses cleanly through ATS systems — standard sections,
        no rare unicode in headers, parseable date format, no
        text-in-image artifacts.
      weight: 0.10
      grader_type: deterministic
      min_required_score: 0.80
      evidence_required: false
      fail_closed_if_unknown: true
      taxonomy_class: regression

    - dimension_id: executive_positioning
      description: >-
        For senior+/exec target levels, the summary and top experience
        bullets foreground scope, ownership, scale, and outcomes.
      weight: 0.10
      grader_type: llm_as_judge
      min_required_score: 0.55
      evidence_required: true
      fail_closed_if_unknown: false  # not all roles need this
      taxonomy_class: capability
      informational_only: true  # ADR-082: tracked-only pending judge implementation (W4 policy resolution dec_19dedd3f565173b7f)
    - dimension_id: specificity
      description: >-
        Achievements use concrete metrics, scope, or outcomes (where
        supported by profile evidence). No vague boilerplate.
      weight: 0.10
      grader_type: hybrid
      min_required_score: 0.55
      evidence_required: true
      fail_closed_if_unknown: true
      taxonomy_class: capability

    - dimension_id: concision
      description: >-
        Output respects length_preference. No padding, no redundant
        bullets, every sentence carries information density.
      weight: 0.05
      grader_type: deterministic
      min_required_score: 0.60
      evidence_required: false
      fail_closed_if_unknown: false
      taxonomy_class: capability

    - dimension_id: format_compliance
      description: >-
        Output structure matches AppOutputSchemaRecord exactly — required
        sections present, ordered, field constraints met.
      weight: 0.10
      grader_type: deterministic
      min_required_score: 0.95
      evidence_required: false
      fail_closed_if_unknown: true
      taxonomy_class: regression

    - dimension_id: no_fabrication
      description: >-
        Hard guardrail: no fabricated employer, no fabricated date
        range, no fabricated credential, no fabricated metric, no
        fabricated publication or authorship claim. Strict pass/fail.
      weight: 0.15
      grader_type: deterministic
      min_required_score: 0.99
      evidence_required: true
      fail_closed_if_unknown: true
      taxonomy_class: regression

    - dimension_id: competencies_structure
      description: >-
        Competencies section must have exactly 6 category lines in the form
        "Category Name: phrase 1, phrase 2, phrase 3[, 4, 5]" covering the
        required engineering/platform labels: Engineering & Platform,
        AI & Data Architecture, Innovation & Strategy, Governance & Compliance,
        Leadership & Delivery, Commercial & Partnerships. Flat noun phrases or
        fewer than 6 categories is a structural failure.
      weight: 0.10
      grader_type: llm_as_judge
      min_required_score: 0.60
      evidence_required: false
      fail_closed_if_unknown: true
      taxonomy_class: capability
      judge_prompt_ref: "rg::competencies_structure_judge::v1"

# apps_rg repair profile — apps-core-contract-rectification-a8f3c2 Phase 1.2
repair_profile_id: rp::apps_rg::resume_generation::v1
app_id: apps_rg
version: 1.0.0
status: active
source_app_config_ref: apps_rg/config/domain_contract/repair_profiles.yaml
created_at: '2026-05-03'

repair_scenarios:
  - scenario_id: retry_hop1_on_extraction_failure
    stage_id: HOP1
    trigger_condition: output_missing:profile_features
    recovery_action: retry_with_backoff:2
    rollback_target: HOP1
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 1

  - scenario_id: retry_hop3_on_low_executive_positioning
    stage_id: HOP3
    trigger_condition: score_below_threshold:executive_positioning:0.6
    recovery_action: retry_with_expanded_context:generation_prompt
    rollback_target: HOP3
    healing_trigger: executive_positioning
    escalation_path: escalate_to_hitl
    max_attempts: 2
    priority: 2

  - scenario_id: retry_hop4_on_validation_failure
    stage_id: HOP4
    trigger_condition: score_below_threshold:content_quality:0.7
    recovery_action: retry_with_backoff:2
    rollback_target: HOP4
    healing_trigger: content_quality
    escalation_path: mark_partial_pass
    max_attempts: 2
    priority: 3

  - scenario_id: rollback_hop5_gate_fail
    stage_id: HOP5
    trigger_condition: score_below_threshold:gate_score:0.8
    recovery_action: retry_with_expanded_context:validation_report
    rollback_target: HOP3
    healing_trigger: gate_score
    escalation_path: escalate_to_hitl
    max_attempts: 3
    priority: 4

  - scenario_id: retry_on_stage_exception
    stage_id: any
    trigger_condition: stage_exception:RuntimeError
    recovery_action: retry_with_backoff:2
    rollback_target: none
    healing_trigger: ''
    escalation_path: abort_run
    max_attempts: 2
    priority: 5

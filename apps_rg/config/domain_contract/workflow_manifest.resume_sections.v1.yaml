# Phase-1 section lane DAG — apps_rg whole-run parallel orchestration SSOT
# Plan: apps-rg-parallel-section-orchestration-f2a8c4 (W0.1)
#
# Dependency-ordered redesign (2026-06-06):
#   wave 0 — upstream proof-bearing sections
#            (competencies, unify/IBM/InsurTech/EY bullets)
#   wave 1 — narratives that consume finalized selected bullets
#   wave 2 — executive_summary synthesizes finalized bullets + narratives + competencies
#   wave 3 — headline is final positioning; must not run before exec_summary finalizes
#
# Every lane `depends_on` must sit in a strictly earlier wave (assert_section_dag_wave_order).
schema_version: resume_sections_dag_v1
lanes:
  - id: competencies
    weight: light
    wave: 0
  - id: unify_bullets
    weight: light
    wave: 0
  - id: ibm_bullets
    weight: light
    wave: 0
  - id: insurtech_bullets
    weight: light
    wave: 0
  - id: ey_bullets
    weight: light
    wave: 0
  - id: unify_narrative
    weight: light
    wave: 1
    depends_on:
      - unify_bullets
  - id: ibm_narrative
    weight: light
    wave: 1
    depends_on:
      - ibm_bullets
  - id: insurtech_narrative
    weight: light
    wave: 1
    depends_on:
      - insurtech_bullets
  - id: ey_narrative
    weight: light
    wave: 1
    depends_on:
      - ey_bullets
  - id: executive_summary
    weight: heavy
    wave: 2
    depends_on:
      - competencies
      - unify_bullets
      - ibm_bullets
      - insurtech_bullets
      - ey_bullets
      - unify_narrative
      - ibm_narrative
      - insurtech_narrative
      - ey_narrative
  - id: headline
    weight: light
    wave: 3
    depends_on:
      - executive_summary
      - competencies
      - unify_bullets
      - ibm_bullets
      - insurtech_bullets
      - ey_bullets
waves:
  - id: 0
    description: upstream proof-bearing sections (competencies + bullets), parallel-eligible
    lanes: [competencies, unify_bullets, ibm_bullets, insurtech_bullets, ey_bullets]
    max_parallel_env: APPS_RG_PHASE1_MAX_PARALLEL
    # 2026-06-14: re-pinned 5->1 (serial). Phase-1 lanes share non-thread-safe process
    # globals (chromadb client, augmented_skills_graph cache); parallel wave-0 bullets race
    # and crash mid-C0 (proven: full integrated run crashed unify_bullets+ibm_bullets after
    # c02_atoms while each passes single-lane X3_ALLOW). Serial is the safe default until the
    # lanes are made thread-safe; parallel is opt-in via APPS_RG_PHASE1_MAX_PARALLEL>1.
    default_max_parallel: 1
  - id: 1
    # 2026-06-14: re-pinned 4->1 (serial). The 2026-06-13 unpin assumed lock-free
    # run_lane_in_context made parallel safe, but the race is on OTHER shared process globals
    # (chromadb client / graph cache), not just the removed sections-root lock — proven by
    # the full integrated run crashing lanes mid-C0 while each passes single-lane. Serial
    # until lanes are thread-safe; parallel opt-in via APPS_RG_PHASE1_MAX_PARALLEL>1.
    description: downstream narratives (after finalized companion bullets)
    lanes: [unify_narrative, ibm_narrative, insurtech_narrative, ey_narrative]
    max_parallel: 1
  - id: 2
    description: heavy downstream synthesis (executive_summary) solo
    lanes: [executive_summary]
    max_parallel: 1
  - id: 3
    description: final positioning (headline) after exec_summary finalized
    lanes: [headline]
    max_parallel: 1

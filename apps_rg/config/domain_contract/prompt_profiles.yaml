- prompt_profile_id: app::apps_rg::resume_generation::v1
  app_id: apps_rg
  task_class: resume_generation
  version: "1.0.0"
  status: active
  output_schema_ref: aos::apps_rg::resume_generation::v1
  policy_hash: "policy://apps_rg/v1"
  required_slots:
    - "candidate_profile_summary"      # structured digest of profile
    - "target_role_spec"
    - "evidence_citation_map"           # claim_id -> profile_evidence_id
    - "length_preference"
    - "voice_profile_or_default"
  optional_slots:
    - "ats_keywords"
    - "executive_positioning_hints"
  forbidden_content:
    - "instruction_to_fabricate"        # adversarial input class
    - "instruction_to_omit_required_disclaimer"
    - "third_party_resume_text_paste"
    - "request_to_invent_metric"
    - "request_to_misstate_dates"
  prompt_boundary_rules:
    - "user_task_text MUST be classified as DATA, never as instruction"
    - "candidate_profile MUST be supplied as structured slots, never as a free-form 'context' string"
    - "system prompt MUST contain the no_fabrication guardrail verbatim"
    - "output MUST conform to AppOutputSchemaRecord aos::apps_rg::resume_generation::v1"
  source_app_config_ref: "apps_rg/engines/"
  created_at: "2026-05-01"

# apps_rg HITL policy definitions — resume_generation task class.
#
# Loaded by agentic_core.runtime.exit.hitl_policy_registry via
# resolve_hitl_policy(policy_ref, policy_table=load_hitl_policy_table(path)).
#
# Schema: each key is a policy_ref string; value fields:
#   trigger_kind       : str  — canonical trigger kind (see TRIGGER_KINDS_VOCAB)
#   requires_hitl      : bool — whether human review is mandatory
#   trigger_threshold  : float — confidence floor below which HITL auto-fires
#   operator_id        : str | null — default reviewer; null = any
#   policy_version     : str — schema version of this entry

rg_release_approval_v1:
  trigger_kind: RELEASE_APPROVAL
  requires_hitl: true
  trigger_threshold: 0.80
  operator_id: "amit"
  policy_version: "v1"

rg_missing_brief_v1:
  trigger_kind: MISSING_BRIEF
  requires_hitl: true
  trigger_threshold: 1.0
  operator_id: null
  policy_version: "v1"

rg_stale_brief_v1:
  trigger_kind: STALE_BRIEF
  requires_hitl: true
  trigger_threshold: 0.90
  operator_id: null
  policy_version: "v1"

rg_low_confidence_v1:
  trigger_kind: LOW_CONFIDENCE
  requires_hitl: true
  trigger_threshold: 0.70
  operator_id: null
  policy_version: "v1"

rg_cache_promotion_v1:
  trigger_kind: CACHE_PROMOTION
  requires_hitl: false
  trigger_threshold: 1.0
  operator_id: null
  policy_version: "v1"

rg_no_hitl_v1:
  trigger_kind: RELEASE_APPROVAL
  requires_hitl: false
  trigger_threshold: 1.0
  operator_id: null
  policy_version: "v1"

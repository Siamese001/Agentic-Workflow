# apps_rg task_classes — one entry per declared task_class.
- task_class: resume_generation
  kind: generation
  description: >-
    Generate an ATS-readable resume tailored to a target role from a
    candidate profile, prior experiences, and role requirements. The
    resume must be factually grounded in the profile and contain no
    fabricated employers, dates, credentials, metrics, or accomplishments.
  risk_tier: standard
  hitl_required: false

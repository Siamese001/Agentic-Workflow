# apps_rg output schema — what apps_rg may produce for resume_generation.
output_schema_id: aos::apps_rg::resume_generation::v1
app_id: apps_rg
task_class: resume_generation
version: "1.0.0"
status: active
output_type: structured_record

required_sections:
  - header_block            # name, contact, location
  - professional_summary
  - experience_block        # 1..N entries
  - skills_block
  - education_block

optional_sections:
  - certifications_block
  - publications_block
  - selected_projects_block

field_constraints:
  header_block.email: "RFC-5322 valid email"
  header_block.phone: "E.164 OR null"
  experience_block.entries[*].dates: "ISO-8601 YYYY-MM (start) and YYYY-MM (end) OR present"
  experience_block.entries[*].employer: "must equal candidate_profile.experiences[].employer exactly"
  experience_block.entries[*].title: "must equal candidate_profile.experiences[].title exactly OR be normalized to the candidate's documented title progression"
  experience_block.entries[*].achievements[*]: "must be supported by candidate_profile evidence"
  skills_block: "subset of candidate_profile.skills (no fabrications)"
  education_block.entries[*].institution: "must equal candidate_profile.education[].institution exactly"
  education_block.entries[*].degree: "must equal candidate_profile.education[].degree exactly"

formatting_constraints:
  total_length_one_page: "<= 600 words rendered"
  total_length_two_page: "<= 1200 words rendered"
  bullet_style: "achievement-first, metric-where-supported"
  date_format: "MMM YYYY"

prohibited_outputs:
  - "fabricated_employer"
  - "fabricated_date_range"
  - "fabricated_credential_or_degree"
  - "fabricated_metric_unsupported_by_profile"
  - "self_disclosed_sensitive_attribute_inserted_by_generator"
  - "claim_of_authorship_for_unverified_publication"
  - "endorsement_block_for_third_party"

schema_validation_rules:
  - "every experience_block entry must trace back to a candidate_profile.experiences entry by employer + title + date_range"
  - "every metric in achievements must reference a profile evidence_id"
  - "skills_block must be a subset of candidate_profile.skills (case-insensitive)"
  - "education_block must equal candidate_profile.education (no extras)"
  - "header_block.location must equal candidate_profile.location OR omit"

source_app_config_ref: "apps_rg/engines/"
created_at: "2026-05-01"

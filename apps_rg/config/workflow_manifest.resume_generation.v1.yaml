manifest_id: wfm::apps_rg::resume_generation::v1
manifest_version: "1.0.0"
owner_ref: apps_rg
task_class: resume_generation
execution_form: MANAGED_WORKFLOW
status: active
created_at: "2026-05-11"
schema_ref: "apps_rg/config/workflow_manifest.resume_generation.v1.yaml"

# ── cross-profile refs (resolved by registry; never hard-imported) ──────────
orchestration_profile_ref: "aop::apps_rg::resume_generation::v1"
output_schema_ref: "aos::apps_rg::resume_generation::v1"
prompt_profile_ref: "app::apps_rg::resume_generation::v1"
runtime_gate_profile_ref: "rgp::apps_rg::resume_generation::v1"
exit_profile_ref: "xp::apps_rg::resume_generation::v1"
judge_profile_ref: "jp::apps_rg::resume_generation::v1"
provider_profile_ref: "pvp::apps_rg::resume_generation::v1"
candidate_gate_profile_ref: "cgp::apps_rg::resume_generation::v1"

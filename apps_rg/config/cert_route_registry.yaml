# apps_rg L0 cert-facing route registry.
#
# apps_rg's PRODUCT routing (HOP-0..HOP-5 deterministic pipeline) lives in
# route_registry.yaml and is consumed by the resume generator + narrative
# pass. This file is a SIBLING, dedicated to the apps_e2e certification
# harness: it exposes apps_rg's runtime as a DETERMINISTIC_PIPELINE form
# (HOP pipeline) whose sealed L2 artifact (generated_resume.json) must be
# run through the v6 Exit pipeline so the 8-dim apps_rg rubric executes.
#
# Plan: apps-runtime-domain-enforcement-a7e9d4 W2.P1 (2026-05-03).
# Pairs with apps_rg/config/domain_contract/rubric_output_map.yaml which
# projects the L2 receipt into the canonical dim_scores / dim_evidence
# shape the AppSpecificEvaluator consumes.

app_name: apps_rg
schema_version: "apps_rg.cert_route_registry/v1"

routes:
  - route_id: apps_rg.resume_generation_v1
    execution_form: DETERMINISTIC_PIPELINE
    l3_required: false
    # Opt-in flag (W2.P3 of apps-eval-harness-parity-f8d4a2): when true,
    # the cert entrypoint MUST invoke run_exit_eval against the sealed L2
    # artifact so the app-specific rubric executes. Closes APPS-DOM-002
    # (AppSpecificEvaluator invoked) + APPS-DOM-003 (ExitReviewPacket.app_
    # specific_eval.bound=True) for apps_rg per plan apps-runtime-domain-
    # enforcement-a7e9d4.
    invoke_exit_eval: true
    # Path (relative to repo root) to the declarative rubric output map
    # consumed by apps_shared.cert.rubric_output_mapper.map_l2_receipt_to_dim_scores.
    # Engine is fail-soft: missing / malformed YAML yields empty dim_scores,
    # which the evaluator then fail-closes per rubric evidence_required=true.
    rubric_output_map_path: apps_rg/config/domain_contract/rubric_output_map.yaml
    selected_capability: apps_rg.resume_generation_v1
    description: >-
      Deterministic HOP pipeline: HOP-0 intake -> HOP-1 extract ->
      HOP-2 score -> HOP-3 assemble -> HOP-4 narrative -> HOP-5 DOCX.
      No retries, branches, or joins at the spine level.
    bypass_reason_when_invoked: DETERMINISTIC_HOP_PIPELINE
    route_reason: >-
      L0 selects apps_rg.resume_generation_v1 because the entrypoint is
      the generate_resume orchestrator, a hard-coded HOP pipeline. No
      managed workflow orchestration is required.

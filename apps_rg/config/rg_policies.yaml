# Resume Generation Policy Rules
# SVP Engineering Standards - Explicit policies, evidence-based

# Section Requirements
section_requirements:
  summary:
    required: true
    min_words: 50
    max_words: 200
    require_achievement_focus: true

  experience:
    required: true
    min_entries: 1
    max_entries: 5
    min_words_per_entry: 50
    max_words_per_entry: 150
    require_metrics: true

  skills:
    required: true
    min_skills: 5
    max_skills: 20
    require_categorization: true

  education:
    required: false
    min_entries: 0
    max_entries: 3

# Quality Scoring
quality_scoring:
  # ATS compatibility weight
  ats_weight: 0.30

  # Content relevance weight
  relevance_weight: 0.25

  # Achievement density weight
  achievement_weight: 0.25

  # Format consistency weight
  format_weight: 0.20

  # Minimum passing score
  passing_score: 0.75

# Gate Policies
gate_policies:
  # Hard gates - cannot be overridden
  hard_gates:
    - min_ats_score_met
    - required_sections_present
    - no_formatting_errors

  # Soft gates - can be waived with justification
  soft_gates:
    - quality_warnings
    - length_warnings
    - keyword_density_warnings

# Content Policies
content_policies:
  # Prohibited content
  prohibited:
    - protected_demographics
    - salary_history
    - age_references
    - photo_references

  # Required elements
  required:
    - contact_info
    - professional_summary
    - relevant_experience

# Resume Generation Configuration
# SVP Engineering Standards - Explicit thresholds, no silent degradation

# Quality Gate Thresholds
quality_gates:
  # Minimum quality score (0.0-1.0)
  min_quality_score: 0.75

  # Minimum ATS compatibility score (0-100)
  min_ats_score: 70

  # Maximum word count
  max_words: 1000

  # Minimum word count
  min_words: 200

# ATS Optimization Settings
ats_optimization:
  # Enable ATS keyword optimization
  enabled: true

  # Keyword density target (percentage)
  keyword_density_target: 3.0

  # Maximum keyword density (avoid stuffing)
  max_keyword_density: 8.0

  # Preferred section order for ATS parsing
  preferred_section_order:
    - summary
    - skills
    - experience
    - education
    - certifications

# Content Requirements
content:
  # Required sections
  required_sections:
    - summary
    - experience
    - skills

  # Optional sections
  optional_sections:
    - education
    - certifications
    - projects
    - publications

  # Maximum sections
  max_sections: 6

# Format Settings
formats:
  standard:
    max_length: 500
    ats_optimized: true

  ats_optimized:
    max_length: 600
    ats_optimized: true
    keyword_focus: true

  executive:
    max_length: 700
    highlight_leadership: true

  creative:
    max_length: 500
    ats_optimized: false

# Output Configuration
output:
  # Emit Markdown resume
  emit_markdown_resume: true

  # Emit JSON artifacts
  emit_json_artifacts: true

  # Include provenance metadata
  include_provenance: true

  # Artifact retention (days)
  retention_days: 90
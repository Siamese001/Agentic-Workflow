# apps_rg candidate gate profile registry — W3
# Plan: apps-rg-zip-based-full-spine-runtime-restoration-a3f7e2
#
# GOVERNANCE:
#   - Declarative data only. No executable functions.
#   - Candidate gate enforcement is owned by agentic_core eval pipeline.
#   - Gate verdicts are evidence, not X3 disposition.
#   - runtime_gate_family maps each candidate gate to the G-gate family
#     declared in runtime_gate_profile.resume_generation.v1.json.

candidate_gate_profile_id: "cgp::apps_rg::resume_generation::v1"
app_id: apps_rg
task_class: resume_generation
version: "1.0.0"
status: active
created_at: "2026-05-11"
source_refs:
  - "apps_rg/config/domain_contract/eval_rubrics.yaml"
  - "apps_rg/config/domain_contract/threshold_profiles.yaml"
  - "apps_rg/config/domain_contract/grader_roster.yaml"
  - "apps_rg/config/domain_contract/output_schema.yaml"

gates:

  - gate_id: no_fabrication
    description: >
      Hard guardrail — every employer, date, title, credential, metric, and
      publication in the candidate output must trace back to candidate_profile.
      Score must be >= 0.99. Strict pass/fail.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - header_block
      - education_block
      - certifications_block
      - selected_projects_block
      - final_render
      - no_fabrication_guardrail
    threshold: 0.99
    severity: hard_fail
    fail_closed: true
    evidence_required: true
    repair_allowed: false
    repair_note: "No repair allowed — fabrication requires candidate rejection, not repair."
    runtime_gate_family: [G14, G26]
    grader_ref: "rg::no_fabrication_guardrail::v1"

  - gate_id: factual_grounding
    description: >
      Every claim must have a traceable evidence_id from candidate_profile.
      Score must be >= 0.95.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - certifications_block
      - selected_projects_block
      - final_render
      - factual_grounding_check
    threshold: 0.95
    severity: hard_fail
    fail_closed: true
    evidence_required: true
    repair_allowed: true
    repair_note: "Unsupported claims may be omitted via unsupported_claim_omission_v1 repair template."
    runtime_gate_family: [G15, G22]
    grader_ref: "rg::factual_grounding_grader::v1"

  - gate_id: format_compliance
    description: >
      Output structure must match output_schema_ref exactly.
      All required sections present, ordered, field constraints met. Score >= 0.95.
    applies_to_nodes:
      - final_render
      - ats_validate
    threshold: 0.95
    severity: hard_fail
    fail_closed: true
    evidence_required: false
    repair_allowed: true
    repair_note: "Format repair loop allowed up to 2 iterations before G25 HITL trigger."
    runtime_gate_family: [G19, G21, G22]
    grader_ref: "rg::format_compliance_grader::v1"

  - gate_id: ats_readability
    description: >
      Output must parse cleanly through ATS — standard section headers,
      no rare unicode, parseable date format, no text-in-image artifacts. Score >= 0.80.
    applies_to_nodes:
      - final_render
      - ats_validate
    threshold: 0.80
    severity: hard_fail
    fail_closed: true
    evidence_required: false
    repair_allowed: true
    repair_note: "ATS formatting repair allowed via format_compliance repair template."
    runtime_gate_family: [G21, G22]
    grader_ref: "rg::ats_readability_grader::v1"

  - gate_id: concision
    description: >
      Output respects length_preference. No padding or redundant bullets. Score >= 0.60.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - final_render
    threshold: 0.60
    severity: warn
    fail_closed: false
    evidence_required: false
    repair_allowed: true
    repair_note: "Bullet diversity repair template may address concision issues."
    runtime_gate_family: [G22]
    grader_ref: "rg::concision_grader::v1"

  - gate_id: role_alignment
    description: >
      Resume language and emphasis must align with target_role_spec.
      Hybrid gate: deterministic keyword overlap + LLM judge consensus. Score >= 0.65.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - skills_block
      - final_render
    threshold: 0.65
    severity: hard_fail
    fail_closed: true
    evidence_required: true
    repair_allowed: false
    repair_note: "Role alignment failures require candidate regeneration, not repair."
    runtime_gate_family: [G22]
    grader_ref: "rg::role_alignment_hybrid_v1"

  - gate_id: specificity
    description: >
      Achievements must use concrete metrics or scope where supported by profile evidence.
      Hybrid gate. Score >= 0.55.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - selected_projects_block
    threshold: 0.55
    severity: hard_fail
    fail_closed: true
    evidence_required: true
    repair_allowed: false
    repair_note: "Low specificity requires candidate regeneration."
    runtime_gate_family: [G22]
    grader_ref: "rg::specificity_hybrid_v1"

  - gate_id: prompt_leakage
    description: >
      No system prompt text, slot labels, governance instructions, or API credentials
      must appear in candidate output.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - header_block
      - skills_block
      - education_block
      - final_render
    threshold: 0.0
    severity: hard_fail
    fail_closed: true
    evidence_required: false
    repair_allowed: false
    repair_note: "Prompt leakage is an immediate disqualification — no repair."
    runtime_gate_family: [G23]

  - gate_id: unsupported_claim
    description: >
      Any metric, achievement, or credential in output must be supported by candidate_profile evidence.
      More than 3 unsupported claims triggers G25 HITL escalation.
    applies_to_nodes:
      - professional_summary
      - experience_block
      - certifications_block
      - selected_projects_block
      - final_render
    threshold: 0.0
    severity: hard_fail
    fail_closed: true
    evidence_required: true
    repair_allowed: true
    repair_note: "Unsupported claims may be omitted via unsupported_claim_omission_v1 repair template. > 3 unsupported triggers G25."
    runtime_gate_family: [G14, G26]

  - gate_id: missing_required_section
    description: >
      All required output sections (header_block, professional_summary, experience_block,
      skills_block, education_block) must be present in final_render output.
    applies_to_nodes:
      - final_render
      - ats_validate
    threshold: 0.0
    severity: hard_fail
    fail_closed: true
    evidence_required: false
    repair_allowed: false
    repair_note: "Missing required section triggers G25 HITL escalation — not repairable inline."
    runtime_gate_family: [G21]

  - gate_id: schema_shape
    description: >
      Output JSON shape must conform to output_schema_ref field types and constraints.
      Field type mismatch or null in non-nullable field is a hard fail.
    applies_to_nodes:
      - final_render
      - ats_validate
    threshold: 0.0
    severity: hard_fail
    fail_closed: true
    evidence_required: false
    repair_allowed: true
    repair_note: "Schema shape repair loop allowed up to 2 iterations before G25 HITL trigger."
    runtime_gate_family: [G21]
    schema_ref: "apps_rg/config/domain_contract/output_schema.yaml"

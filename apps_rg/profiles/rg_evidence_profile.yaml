# rg_evidence_profile.yaml
# Apps RG Evidence Profile — Declarative Extraction & Validation Rules
# AG-RGGOV-6: All fields are static constraints
# AG-RGGOV-6a: duplicate_threshold is advisory (0.85 target)
# AG-RGGOV-6b: TARGET/GATE semantics (0.7 target / 0.8 gate)
# AG-RGGOV-6c: Scoring weights are advisory
#
# Purpose: Declarative evidence rules for C0 Retrieval and validation

profile_metadata:
  profile_id: rg_evidence_v1
  profile_type: evidence_rules
  domain: resume_generation
  advisory_only: true

extraction_rules:
  # Metric extraction patterns (declarative regex, core implements)
  metrics_patterns:
    - "\\$\\d+\\.?\\d*[MBK]\\+?"  # Currency: $10M, $500K
    - "\\d+\\.?\\d*%"             # Percentages: 15%, 99.9%
    - "\\d{1,3}(?:,\\d{3})+"      # Numbers: 1,000, 10,000
  
  # Evidence types to extract (declarative list)
  evidence_categories:
    - quantified_achievements
    - scope_indicators
    - impact_metrics
    - leadership_signals

validation_scope:
  # Rule categories to validate (advisory scope list)
  rule_categories:
    - grammar
    - formatting
    - content_quality
    - ats_compatibility

quality_thresholds:
  # AG-RGGOV-6b: TARGET/GATE semantics
  # 0.7 is aspirational target, 0.8 is hard gate threshold
  min_quality_target: 0.70  # Aspirational: aim for this
  pass_gate_threshold: 0.80  # Hard gate: must meet to proceed
  threshold_semantics: target_gate  # TARGET < GATE pattern

scoring_dimensions:
  # AG-RGGOV-6c: Weights are advisory only
  # Core may adjust weighting based on context
  advisory_weighting: true
  dimensions:
    content_quality:
      weight: 0.30
      description: Substance and relevance of content
    ats_compatibility:
      weight: 0.25
      description: Applicant tracking system parsing
    keyword_match:
      weight: 0.25
      description: Alignment with job description
    formatting:
      weight: 0.20
      description: Visual structure and readability

content_constraints:
  # AG-RGGOV-6a: Advisory duplicate detection target
  duplicate_similarity_target: 0.85
  advisory_semantics: true  # Core may approximate

# NO runtime validation logic:
# - No validation functions (core implements)
# - No scoring algorithms (core implements)
# - No gate enforcement (core L5 owns gates)

# rg_prompt_profile.yaml
# Apps RG Prompt Profile — Style & Content Constraints
# AG-RGGOV-6: Static style constraints only
# AG-RGGOV-6d: Power verbs are advisory style preference
#
# Purpose: Declarative style guidance for Prompt Assembly (core L1/L2)

schema_version: "1.0"

profile_metadata:
  profile_id: rg_prompt_v1
  profile_type: style_constraints
  domain: resume_generation
  advisory_only: true  # AG-RGGOV-6d: All style guidance is advisory

style_constraints:
  # Forbidden phrases to avoid (advisory: prefer alternatives)
  forbidden_phrases:
    - "responsible for"
    - "duties included"
    - "helped with"
    - "assisted with"
    - "worked on"
  
  # Preferred phrasing guidance
  preferred_patterns:
    passive: "Responsible for managing team"
    active: "Led team of 12 engineers"

format_constraints:
  # Sentence-based counts per best practice (TechnCV 2026, CEO Resume Writer, Arielle Executive)
  # DO NOT target words or tokens — token counts create uneven word-count dispersion
  executive_summary:
    sentence_count: 5
    structure:
      - "positioning: who the candidate is + primary expertise tailored to this role"
      - "method: how they architect or govern (systems design, platform governance, integration patterns) — SEPARATE sentence"
      - "scope: full leadership scope — strategy through delivery, team scale, commercialization — SEPARATE sentence"
      - "outcomes: exactly 3-4 quantified metrics verbatim from source resume (revenue, margin, capacity, cycle time)"
      - "credentials: single highest-signal credential (Fellowship, advanced degree, certification)"
    output_schema: '{"content": ["<all 5 sentences as ONE concatenated string>"]}'
    ats_note: >
      Embed JD keywords naturally within sentences.
      ATS weight is earned here AND reinforced in experience bullets.

  experience_bullets:
    # Per-role sentence counts: 1 intro sentence + N labeled achievement bullets
    # Bullet label format: "Bold Label: achievement sentence with metric"
    roles:
      - company_match: "Unify"
        intro_sentences: 1
        bullet_count: 6
      - company_match: "IBM"
        intro_sentences: 1
        bullet_count: 5
      - company_match: "InsurTech"
        intro_sentences: 1
        bullet_count: 3
      - company_match: "Ernst & Young"
        intro_sentences: 1
        bullet_count: 3
      - company_match: "Early Career"
        intro_sentences: 1
        bullet_count: 1
    bullet_schema: '{"evidence_anchor": "Label", "description": "Label: full achievement sentence"}'
    ats_note: >
      ATS assigns full tenure credit to keywords appearing in experience bullets.
      Mirror JD keywords in bullet text — not just the competencies grid.

  competencies:
    # 6 engineering/platform category blocks (TechnCV 2026 SVP/C-suite executive format)
    # Each block: "Category Name: capability phrase 1, capability phrase 2, capability phrase 3 [, 4, 5]"
    # Recruiter-facing signal — communicates depth of domain expertise, not just keyword presence
    entry_count: 6
    format: "Category Name: 3-5 supporting capability phrases (comma-separated)"
    required_categories:
      - "Engineering & Platform"
      - "AI & Data Architecture"
      - "Innovation & Strategy"
      - "Governance & Compliance"
      - "Leadership & Delivery"
      - "Commercial & Partnerships"
    ats_note: >
      Competencies section communicates domain depth to executive recruiters.
      Each category line must contain 3-5 specific capability phrases grounded in the source resume.
      Primary ATS keyword credit comes from experience bullets — this section reinforces signal depth.

content_constraints:
  # AG-RGGOV-6a: Advisory duplicate similarity target
  duplicate_similarity_target: 0.85
  advisory_semantics: true
  description: Target for content deduplication (core may approximate)

vocabulary:
  # AG-RGGOV-6d: Power verbs are ADVISORY — style preference only
  # Not hard constraint. Core may suggest alternatives when appropriate.
  style_preference: true
  
  power_verbs:
    - achieved
    - delivered
    - led
    - drove
    - established
    - transformed
    - accelerated
    - optimized
    - pioneered
    - spearheaded
    - architected
    - engineered
    - orchestrated
    - scaled
    - secured

  usage_guidance: >
    These verbs are preferred for describing achievements.
    Selection should be context-appropriate. Not all bullets
    require power verbs; substance matters over style.

section_guidance:
  # Per-section substance and rigor targets consumed by PA binding → Qwen system prompt.
  # Rules are sentence-based. DO NOT target words or tokens — dispersion is uneven.
  # All content claims MUST be grounded in supplied source materials (no fabrication).

  executive_summary:
    rigor_rules:
      - "Every metric cited (revenue, margin, capacity, cycle time) MUST appear verbatim in the source resume — no rounding, no inference."
      - "Sentence 1 must name the candidate and their primary expertise domain tailored to THIS specific role and company."
      - "Sentence 2 (method) and Sentence 3 (scope) MUST be separate sentences — do not merge them into one."
      - "Sentence 4 must contain EXACTLY 3-4 quantified outcomes with units (e.g. $22M, 20%, $14M). No vague claims."
      - "Sentence 5 must state the single highest-signal credential exactly as it appears in the source resume."
    voice_rules:
      - "Third person (He/She/They), present-tense verbs for current role, past-tense for prior roles."
      - "No first-person ('I', 'my'). No passive voice ('was responsible for')."
      - "Dense, declarative sentences. No filler phrases like 'proven track record' or 'results-driven'."
    ats_rules:
      - "Embed at least 3 JD title-level keywords naturally within the 5 sentences."
      - "Mirror the exact job title from the JD in sentence 1 where contextually accurate."

  experience_unify:
    rigor_rules:
      - "Intro sentence: current role framing — scope, team size, and primary mission at Unify Consulting."
      - "6 bullets required. Each bullet must cover a DISTINCT achievement domain — no duplication across bullets."
      - "Bullet domains (draw from source resume): Platform Commercialization, AI Governance, Multi-Agent Architecture, Engineering Delivery, Client Revenue, Team Leadership."
      - "Every metric in every bullet MUST be grounded in the source resume evidence."
      - "Each bullet opens with a bold label (2-3 words) followed by a colon — label names the achievement domain."
    ats_rules:
      - "Bullets for current role carry highest ATS weight — ensure primary JD keywords appear here."
      - "Mirror JD language for: AI strategy, platform governance, enterprise architecture, innovation, data."

  experience_ibm:
    rigor_rules:
      - "Intro sentence: IBM role framing — scope, division, and transformation mandate."
      - "5 bullets required. Cover DISTINCT domains — no repetition."
      - "Bullet domains (draw from source): Cloud Migration, AI/ML Platform, Delivery Governance, Revenue Impact, Organizational Scale."
      - "Every metric grounded in source resume. Cite IBM-specific numbers only."
    ats_rules:
      - "IBM bullets reinforce large-scale enterprise transformation, cloud, and AI/ML keywords."

  experience_insurtech:
    rigor_rules:
      - "Intro sentence: InsurTech Cloud Solutions — founding/leadership context and core mission."
      - "3 bullets required. Cover DISTINCT domains."
      - "Bullet domains (draw from source): Platform Build, Revenue/Commercial Outcome, Technical Architecture."
      - "Every metric grounded in source resume."
    ats_rules:
      - "Reinforce InsurTech/cloud-native, API, and platform-as-a-product keywords."

  experience_ey:
    rigor_rules:
      - "Intro sentence: Ernst & Young — advisory scope, client base, and practice focus."
      - "3 bullets required. Cover DISTINCT domains."
      - "Bullet domains (draw from source): Client Delivery, Practice Development, Quantified Impact."
      - "Every metric grounded in source resume."
    ats_rules:
      - "Reinforce consulting, strategy, enterprise architecture, and advisory keywords."

  experience_early_career:
    rigor_rules:
      - "Intro sentence: early career / actuarial role — context, employer, and transition narrative."
      - "1 bullet required. Single most distinctive achievement with a metric."
      - "Metric grounded in source resume."

  competencies:
    rigor_rules:
      - "Output EXACTLY 6 category lines. Each line: 'Category Name: phrase 1, phrase 2, phrase 3[, 4, 5]'."
      - "Required categories (use exactly these labels): Engineering & Platform, AI & Data Architecture, Innovation & Strategy, Governance & Compliance, Leadership & Delivery, Commercial & Partnerships."
      - "Each category MUST contain 3-5 specific capability phrases grounded in the source resume — NOT generic filler."
      - "Engineering & Platform must name concrete platform capabilities (e.g. distributed systems, cloud-native microservices, API governance, CI/CD, observability)."
      - "AI & Data Architecture must name specific AI/data system capabilities (e.g. multi-agent orchestration, GraphRAG, vector retrieval, LLM governance, data pipelines)."
      - "Phrases drawn from source resume evidence only — no invented capabilities."
      - "No short noun phrases alone — every entry must be a 'Category: phrase, phrase, phrase' block."
    ats_rules:
      - "Category labels and sub-phrases communicate domain depth to executive recruiters."
      - "Mirror JD language in sub-phrases: IT strategy, enterprise architecture, innovation, AI, data platforms, interoperability."
      - "Primary ATS keyword credit comes from experience bullets — competencies reinforce signal depth."

judge_guidance:
  # Consumed by apps_rg judge prompt builder (apps_rg/config/domain_contract/judge_prompts.yaml).
  # NOT consumed by the generator prompt. Governs LLM-as-judge scoring criteria.
  # DO NOT target word counts — evaluate sentence structure, specificity, and evidence grounding.

  executive_positioning:
    scoring_criteria:
      - "Does the executive summary foreground scope (team size, P&L, org span) rather than task execution?"
      - "Does sentence 1 position the candidate at the correct seniority level for the target role?"
      - "Are outcomes quantified with specific metrics rather than qualitative claims?"
      - "Does the summary read as written for THIS role/company — or is it generic?"
      - "Is the credential sentence (sentence 5) the single highest-signal one from the source?"
    score_anchors:
      "1.0": "All 5 criteria clearly met. Summary is board-ready for SVP/C-suite."
      "0.8": "4 of 5 criteria met. Minor gap in scope signal or specificity."
      "0.6": "3 of 5. Summary present but generic or missing seniority signals."
      "0.4": "2 of 5. Summary reads as mid-level, or outcomes are vague."
      "0.2": "1 or 0 of 5. Summary fails executive positioning test."
    do_not_penalize:
      - "Sentence count variation if all 5 roles are covered substantively"
      - "Word count — evaluate content density not volume"

  role_alignment:
    scoring_criteria:
      - "Does the resume lead with the most JD-relevant experience at Unify Consulting (current role)?"
      - "Are JD title-level keywords (IT Strategy, Innovation, Enterprise Architecture, AI, Data) present in the top 3 bullets of the current role?"
      - "Does the competencies section mirror the JD's required capabilities section language?"
      - "Is the overall narrative arc (from early career to present) consistent with the target seniority level?"
    score_anchors:
      "1.0": "Resume reads as purpose-built for this exact JD. Keywords densely and naturally embedded."
      "0.8": "Strong alignment. Minor keyword gaps or 1-2 competencies not mirrored from JD."
      "0.6": "Moderate alignment. Resume is relevant but not tailored — generic language present."
      "0.4": "Weak alignment. JD keywords sparse. Narrative not calibrated to this role."
      "0.2": "No meaningful alignment. Generic resume not targeted to this role."
    do_not_penalize:
      - "Factually accurate content that happens to use synonyms of JD keywords"
      - "Older roles with fewer JD keywords — recency weighting is expected"

  specificity:
    scoring_criteria:
      - "Do experience bullets contain concrete metrics (dollar amounts, percentages, headcount, time-to-market)?"
      - "Are metrics role-specific — i.e. attributable to THIS employer not to a generic claim?"
      - "Does the executive summary sentence 4 contain at least 3 distinct quantified outcomes?"
      - "Are bullet labels precise domain names (not vague like 'Leadership:') ?"
    score_anchors:
      "1.0": "Every bullet has a specific metric grounded in source resume. No vague claims."
      "0.8": "Most bullets specific. 1-2 bullets have weak metrics or qualitative-only claims."
      "0.6": "Mix of specific and vague. Some metrics present but inconsistent."
      "0.4": "Mostly vague. Few metrics. Achievement bullets read as generic responsibilities."
      "0.2": "No specific metrics anywhere. Reads as duty list not achievement record."
    do_not_penalize:
      - "Early career / actuarial role with limited available metrics"
      - "Consulting roles where client names are confidential — scope/outcome metrics sufficient"

# NO prompt assembly logic:
# - No prompt templates (core Prompt Assembly owns)
# - No slot mapping (core owns)
# - No conditional prompt logic (core owns)

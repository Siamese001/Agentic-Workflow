# rg_capability_profile.yaml
# Apps RG Capability Profile — Declarative Capability Metadata
# AG-RGGOV-6: Static capability declarations only
#
# Purpose: Declare what this profile package claims to support
# Core validates against actual capability registry

schema_version: "1.0"

profile_metadata:
  profile_id: rg_capability_v1
  profile_type: capability_declaration
  domain: resume_generation
  advisory_only: true  # Declarations are claims, not guarantees

declared_capabilities:
  # Supported output formats (advisory list)
  supported_formats:
    - ats_compatible_resume
    - executive_summary
    - qa_assessment_report
  
  # Supported content domains (advisory)
  content_domains:
    - technology
    - finance
    - healthcare
    - consulting
    - general_professional
  
  # Optimization targets (AG-RGGOV-6: Aspirational only)
  # These are declared goals, not runtime directives
  optimization_targets:
    - keyword_density
    - action_verb_strength
    - quantification_rate
    - ats_parseability
  
  target_guidance: >
    These are aspirational optimization targets.
    Core may prioritize based on context, job description,
    and profile configuration. Not all targets may be
    achievable in every output.

feature_support:
  # Feature availability (declarative, core validates)
  features:
    jd_analysis:
      declared: true
      description: Can reference job description for targeting
    
    metrics_extraction:
      declared: true
      description: Can extract and preserve quantified metrics
    
    style_guidance:
      declared: true
      description: Can apply style profile preferences
    
    validation_feedback:
      declared: true
      description: Can generate QA assessment report

# NO runtime capability logic:
# - No capability negotiation (core owns)
# - No feature routing (core owns)
# - No fallback chains (core owns)
# - No feature flags for runtime control (core owns)

# NO runtime configuration:
# - No max_iterations (runtime L2 concern)
# - No step_limits (runtime L3 concern)
# - No retry counts (runtime L3/L5 concern)
# - No checkpoint settings (runtime L4 concern)

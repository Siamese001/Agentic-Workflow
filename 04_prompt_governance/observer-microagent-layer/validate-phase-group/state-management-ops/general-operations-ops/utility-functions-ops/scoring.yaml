# Outreach Scoring Prompts v1.0
# Evaluation and scoring prompts for outreach quality assessment

outreach_scoring:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Scoring frameworks
  scoring_frameworks:
    # Overall quality scoring
    overall_quality:
      comprehensive_assessment:
        prompt: |
          Evaluate outreach message quality using comprehensive scoring criteria:
          
          Scoring Categories (0-100 scale):
          1. Personalization Quality (30%):
             - Research-based personalization depth
             - Recipient-specific detail inclusion
             - Contextual relevance demonstration
             - Authentic connection establishment
             
          2. Value Proposition (25%):
             - Clear benefit to recipient
             - Specific, actionable value offered
             - Mutual benefit orientation
             - Long-term relationship potential
             
          3. Communication Effectiveness (25%):
             - Professional tone and language
             - Message clarity and conciseness
             - Appropriate length and format
             - Engagement optimization
             
          4. Strategic Positioning (15%):
             - Career goal alignment
             - Professional brand enhancement
             - Network expansion potential
             - Opportunity creation likelihood
             
          5. Professional Standards (5%):
             - Ethical compliance
             - Respect for boundaries
             - Cultural appropriateness
             - Industry professionalism
             
          Provide detailed scoring with specific feedback for improvement areas.
          
        scoring_methodology:
          - "Weighted_category_scoring"
          - "Detailed_feedback_provision"
          - "Improvement_prioritization"
          - "Benchmark_comparison"
          
    # Response probability scoring
      response_probability:
        prompt: |
          Score outreach message for response likelihood and engagement potential:
          
          Response Probability Criteria:
          1. Opening Impact (30 points):
             - Compelling, personalized hook
             - Immediate relevance establishment
             - Research-based connection
             - Curiosity generation without clickbait
             
          2. Value Proposition (25 points):
             - Clear recipient benefit
             - Specific, actionable value
             - Mutual benefit demonstration
             - Immediate value delivery
             
          3. Call to Action (25 points):
             - Clear, easy next step
             - Low commitment requirement
             - Appropriate urgency without pressure
             - Multiple response options
             
          4. Professional Credibility (20 points):
             - Professional authority demonstration
             - Expertise showcase
             - Trust establishment
             - Authenticity maintenance
          
          Provide specific recommendations to improve response rates.
          
        response_metrics:
          - "Opening_engagement_score"
          - "Value_proposition_impact"
          - "Call_to_action_effectiveness"
          - "Professional_credibility_rating"
          
  # Component-specific scoring
  component_scoring:
    # Subject line scoring
    subject_line_scoring:
      effectiveness_evaluation:
        prompt: |
          Evaluate email subject lines for effectiveness and engagement:
          
          Subject Line Scoring Criteria:
          1. Personalization Quality (30 points):
             - Recipient-specific elements
             - Contextual relevance
             - Research-based personalization
             - Avoids generic templates
             
          2. Engagement Potential (25 points):
             - Curiosity generation
             - Professional intrigue
             - Click-worthy without clickbait
             - Emotional connection potential
             
          3. Professional Standards (20 points):
             - Professional tone maintenance
             - Appropriate length (under 50 characters)
             - Spam filter avoidance
             - Industry appropriateness
             
          4. Clarity and Relevance (25 points):
             - Clear message purpose
             - Direct relevance to recipient
             - Value proposition hint
             - Action orientation
          
          Score each subject line variant and provide optimization recommendations.
          
        subject_metrics:
          - "Personalization_depth_score"
          - "Engagement_potential_rating"
          - "Professional_standards_compliance"
          - "Clarity_relevance_assessment"
          
    # Message body scoring
    message_body_scoring:
      content_quality:
        prompt: |
          Score outreach message body for quality and effectiveness:
          
          Message Body Scoring Criteria:
          1. Content Personalization (35 points):
             - Research-based details
             - Recipient-specific references
             - Contextual relevance
             - Authentic connection establishment
             
          2. Value Proposition (30 points):
             - Clear recipient benefits
             - Specific, actionable value
             - Mutual benefit orientation
             - Immediate value delivery
             
          3. Communication Quality (25 points):
             - Professional tone and language
             - Message clarity and conciseness
             - Appropriate length and formatting
             - Reading optimization
             
          4. Strategic Alignment (10 points):
             - Career goal alignment
             - Professional brand consistency
             - Network expansion potential
             - Long-term relationship building
          
          Provide specific content improvement recommendations.
          
        body_metrics:
          - "Content_personalization_score"
          - "Value_proposition_quality"
          - "Communication_effectiveness"
          - "Strategic_alignment_rating"
          
    # Call to action scoring
    call_to_action_scoring:
      effectiveness_scoring:
        prompt: |
          Evaluate call to action effectiveness and conversion potential:
          
          Call to Action Scoring Criteria:
          1. Clarity and Specificity (35 points):
             - Clear, unambiguous action request
             - Specific next steps outlined
             - Easy to understand and execute
             - No confusion or ambiguity
             
          2. Commitment Level (25 points):
             - Appropriate initial commitment
             - Low barrier to entry
             - Progressive engagement potential
             - Risk minimization for recipient
             
          3. Value Proposition (25 points):
             - Clear benefit of taking action
             - Immediate value delivery
             - Mutual benefit emphasis
             - Long-term relationship potential
             
          4. Professional Appropriateness (15 points):
             - Professional tone maintenance
             - Respect for recipient's time
             - Appropriate urgency without pressure
             - Cultural and industry appropriateness
          
          Provide specific call to action optimization recommendations.
          
        cta_metrics:
          - "Clarity_specificity_score"
          - "Commitment_appropriateness"
          - "Value_proposition_strength"
          - "Professional_standards_compliance"
          
  # Channel-specific scoring
  channel_scoring:
    # Email scoring
    email_scoring:
      effectiveness_assessment:
        prompt: |
          Score email outreach for effectiveness and professional standards:
          
          Email Scoring Criteria:
          1. Subject Line Performance (25 points):
             - Open rate optimization
             - Personalization quality
             - Professional tone
             - Spam filter avoidance
             
          2. Message Body Quality (35 points):
             - Content personalization
             - Value proposition clarity
             - Professional communication
             - Length and formatting optimization
             
          3. Call to Action Effectiveness (25 points):
             - Clear, specific action request
             - Low commitment requirement
             - Professional tone
             - Conversion optimization
             
          4. Professional Presentation (15 points):
             - Proper email formatting
             - Professional signature
             - Contact information completeness
             - Mobile optimization
          
          Provide email-specific optimization recommendations.
          
        email_metrics:
          - "Subject_line_performance"
          - "Message_body_quality"
          - "Call_to_action_effectiveness"
          - "Professional_presentation"
          
    # LinkedIn scoring
    linkedin_scoring:
      platform_optimization:
        prompt: |
          Score LinkedIn outreach for platform optimization and effectiveness:
          
          LinkedIn Scoring Criteria:
          1. Connection Request Quality (30 points):
             - Personalized message effectiveness
             - Professional connection reason
             - Mutual reference inclusion
             - Platform-appropriate tone
             
          2. InMail Message Quality (35 points):
             - Professional networking focus
             - Value proposition emphasis
             - Relationship building orientation
             - Platform-appropriate length
             
          3. Profile Engagement Strategy (20 points):
             - Thoughtful interaction quality
             - Professional community participation
             - Value-added content sharing
             - Network expansion potential
             
          4. Professional Brand Alignment (15 points):
             - LinkedIn profile consistency
             - Professional authority demonstration
             - Thought leadership positioning
             - Industry expertise showcase
          
          Provide LinkedIn-specific optimization recommendations.
          
        linkedin_metrics:
          - "Connection_request_quality"
          - "Inmail_effectiveness"
          - "Profile_engagement_strategy"
          - "Professional_brand_alignment"
          
  # Industry-specific scoring
  industry_scoring:
    # Technology industry scoring
    technology_scoring:
      prompt: |
        Score outreach for technology industry professionals:
          
          Technology Industry Scoring Criteria:
          1. Technical Expertise Recognition (35 points):
             - Specific technical contribution acknowledgment
             - Technology stack understanding
             - Project complexity recognition
             - Innovation appreciation
             
          2. Industry Knowledge Demonstration (30 points):
             - Current technology trends awareness
             - Industry challenge understanding
             - Technical insight sharing
             - Emerging technology discussion
             
          3. Community Engagement (20 points):
             - Technical community involvement
             - Open source contribution recognition
             - Conference participation acknowledgment
             - Professional network engagement
             
          4. Collaboration Potential (15 points):
             - Technical collaboration opportunities
             - Knowledge exchange possibilities
             - Project partnership potential
             - Innovation synergy identification
          
          Provide technology industry-specific improvement recommendations.
          
        tech_metrics:
          - "Technical_expertise_recognition"
          - "Industry_knowledge_demonstration"
          - "Community_engagement_quality"
          - "Collaboration_potential"
          
    # Healthcare industry scoring
    healthcare_scoring:
      prompt: |
        Score outreach for healthcare industry professionals:
          
          Healthcare Industry Scoring Criteria:
          1. Clinical Excellence Recognition (35 points):
             - Patient care contribution acknowledgment
             - Quality improvement initiative recognition
             - Clinical skill appreciation
             - Treatment advancement understanding
             
          2. Healthcare System Knowledge (30 points):
             - Healthcare challenge awareness
             - System improvement understanding
             - Regulatory knowledge demonstration
             - Policy development insight
             
          3. Professional Development (20 points):
             - Continuing education acknowledgment
             - Specialty certification recognition
             - Professional association involvement
             - Research contribution appreciation
             
          4. Collaboration Opportunities (15 points):
             - Research collaboration potential
             - Quality improvement partnership
             - Knowledge exchange opportunities
             - System improvement synergy
          
          Provide healthcare industry-specific enhancement strategies.
          
        healthcare_metrics:
          - "Clinical_excellence_recognition"
          - "Healthcare_system_knowledge"
          - "Professional_development_acknowledgment"
          - "Collaboration_opportunity_assessment"
          
  # Relationship building scoring
  relationship_scoring:
    # Long-term relationship potential
    relationship_potential:
      prompt: |
        Score outreach for long-term relationship building potential:
          
          Relationship Building Scoring Criteria:
          1. Trust Establishment (30 points):
             - Professional credibility demonstration
             - Reliability and consistency indication
             - Authenticity and transparency
             - Professional integrity maintenance
             
          2. Value Exchange Quality (25 points):
             - Mutual benefit orientation
             - Ongoing value provision potential
             - Resource sharing willingness
             - Knowledge exchange opportunities
             
          3. Professional Growth Support (25 points):
             - Career development support
             - Learning opportunity sharing
             - Mentorship potential
             - Network expansion facilitation
             
          4. Long-term Engagement (20 points):
             - Sustainable relationship foundation
             - Ongoing engagement strategy
             - Community building potential
             - Professional alignment
          
          Provide relationship building optimization recommendations.
          
        relationship_metrics:
          - "Trust_establishment_potential"
          - "Value_exchange_quality"
          - "Professional_growth_support"
          - "Long_term_engagement_likelihood"
          
  # Scoring validation and calibration
  scoring_validation:
    # Calibration standards
    calibration:
      prompt: |
        Ensure outreach scoring consistency and accuracy through calibration:
          
          Calibration Criteria:
          1. Response Rate Correlation:
             - Compare with actual response data
             - Validate against successful outreach examples
             - Ensure engagement prediction accuracy
             - Cross-validate with conversion metrics
             
          2. Professional Standards Alignment:
             - Compare with industry best practices
             - Validate against professional networking guidelines
             - Ensure ethical compliance accuracy
             - Cross-validate with expert feedback
             
          3. Quality Benchmarking:
             - Compare with high-performing outreach examples
             - Validate against professional standards
             - Ensure competitive positioning accuracy
             - Cross-validate with success stories
             
          4. User Outcome Correlation:
             - Compare with actual networking success
             - Validate against relationship building outcomes
             - Ensure career advancement correlation
             - Cross-validate with professional growth metrics
          
          Provide calibration recommendations and quality metrics.
          
        calibration_metrics:
          - "Response_rate_correlation"
          - "Professional_standards_alignment"
          - "Quality_benchmark_accuracy"
          - "User_outcome_correlation"
          
    # Performance tracking
      performance_tracking:
        prompt: |
          Track outreach scoring system performance and effectiveness:
          
          Performance Metrics:
          1. Predictive Validity:
             - Response rate prediction accuracy
             - Engagement quality correlation
             - Relationship building success prediction
             - Network expansion outcome tracking
             
          2. User Engagement:
             - Scoring completion rates
             - Feedback implementation rates
             - User satisfaction scores
             - Recommendation adoption tracking
             
          3. System Effectiveness:
             - Scoring processing efficiency
             - Accuracy improvement over time
             - User learning and development
             - System optimization opportunities
             
          4. Professional Impact:
             - Career advancement correlation
             - Professional network growth
             - Opportunity creation success
             - Personal brand enhancement
          
          Provide performance improvement recommendations.
          
        performance_metrics:
          - "Predictive_validity_score"
          - "User_engagement_rating"
          - "System_effectiveness"
          - "Professional_impact_assessment"

# Outreach Rewriting Prompts v1.0
# Prompts for rewriting and optimizing outreach content

outreach_rewriting:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Content rewriting frameworks
  content_rewriting:
    # Message rewriting
    message_rewriting:
      personalization_enhancement:
        prompt: |
          Rewrite outreach messages to enhance personalization and authenticity:
          
          Personalization Enhancement Framework:
          1. Research-Based Personalization:
             - Incorporate specific company research findings
             - Reference recent company news or achievements
             - Acknowledge recipient's specific contributions
             - Connect to industry trends affecting their role
             
          2. Contextual Relevance:
             - Align with their current projects or challenges
             - Reference their professional interests and expertise
             - Connect to mutual connections or shared experiences
             - Consider their career stage and goals
             
          3. Value Proposition Integration:
             - Weave specific value into message naturally
             - Demonstrate understanding of their needs
             - Offer tailored insights or resources
             - Propose mutually beneficial collaboration
             
          4. Authentic Voice:
             - Maintain genuine, conversational tone
             - Avoid template-like language
             - Show personality and enthusiasm
             - Use appropriate professional language
             
          Example transformation:
          FROM: "I'm reaching out to connect about potential opportunities"
          TO: "I was impressed by your team's recent AI healthcare initiative and would love to share insights from my work in medical data analytics"
          
        enhancement_criteria:
          - "Research_integration_quality"
          - "Contextual_relevance_score"
          - "Value_proposition_clarity"
          - "Authentic_voice_maintenance"
          
      engagement_optimization:
        prompt: |
          Rewrite outreach messages to optimize engagement and response rates:
          
          Engagement Optimization Framework:
          1. Opening Impact:
             - Start with compelling, personalized hook
             - Create immediate relevance and interest
             - Demonstrate genuine research effort
             - Establish common ground quickly
             
          2. Value First Approach:
             - Lead with offering value to recipient
             - Share relevant insights or resources
             - Provide helpful information or connections
             - Focus on their benefit before yours
             
          3. Clear Value Proposition:
             - Articulate specific mutual benefits
             - Demonstrate understanding of their needs
             - Propose concrete collaboration opportunities
             - Show respect for their time and expertise
             
          4. Compelling Call to Action:
             - Make next step clear and easy
             - Keep commitment level low initially
             - Provide specific action options
             - Include appropriate urgency without pressure
             
          Focus on creating messages that recipients genuinely want to respond to.
          Ensure all optimization maintains professional authenticity.
          
        optimization_strategy:
          - "Opening_impact_enhancement"
          - "Value_first_messaging"
          - "Clear_proposition_articulation"
          - "Compelling_action_design"
          
    # Follow-up rewriting
    follow_up_rewriting:
      value_added_follow_up:
        prompt: |
          Rewrite follow-up messages to add value and maintain engagement:
          
          Value-Added Follow-Up Framework:
          1. New Value Introduction:
             - Share relevant industry insights
             - Provide helpful resources or articles
             - Introduce valuable connections
             - Offer additional expertise or assistance
             
          2. Contextual Connection:
             - Reference previous conversation naturally
             - Build on established rapport
             - Show continued interest in their work
             - Maintain conversation flow
             
          3. Professional Persistence:
             - Maintain helpful, supportive tone
             - Demonstrate patience and understanding
             - Focus on relationship building
             - Respect their communication preferences
             
          4. Strategic Timing:
             - Allow appropriate response intervals
             - Consider their schedule and priorities
             - Time follow-ups with relevant events
             - Maintain consistent but not overwhelming presence
             
          Example transformation:
          FROM: "Just following up on my previous message"
          TO: "I came across this article on healthcare AI trends and thought of your work - wanted to share in case it's valuable for your current projects"
          
        follow_up_enhancement:
          - "Value_addition_focus"
          - "Contextual_connection_maintenance"
          - "Professional_persistence_strategy"
          - "Strategic_timing_optimization"
          
  # Language and tone optimization
  language_optimization:
    # Professional tone refinement
    tone_refinement:
      prompt: |
        Refine outreach message language for optimal professional tone:
          
          Tone Optimization Guidelines:
          1. Professional Confidence:
             - Use confident but not arrogant language
             - Demonstrate expertise without boasting
             - Maintain professional authority
             - Show enthusiasm and passion
             
          2. Respectful Communication:
             - Honor their time and priorities
             - Use appropriate formal language
             - Avoid overly casual expressions
             - Maintain professional boundaries
             
          3. Authentic Personality:
             - Allow genuine personality to show
             - Use natural, conversational language
             - Avoid robotic or overly formal tone
             - Demonstrate genuine interest
             
          4. Cultural Sensitivity:
             - Consider cultural communication norms
             - Avoid potentially insensitive language
             - Adapt to industry-specific communication styles
             - Maintain inclusive and respectful approach
             
          Tone adjustments:
          - Replace generic phrases with specific, personalized language
          - Ensure consistency in professional tone throughout message
          - Balance enthusiasm with professional restraint
          - Adapt language to recipient's communication style
          
        tone_quality_metrics:
          - "Professional_confidence_score"
          - "Respectful_communication_rating"
          - "Authentic_personality_assessment"
          - "Cultural_sensitivity_evaluation"
          
    # Conciseness and clarity
    clarity_optimization:
      prompt: |
        Optimize outreach messages for maximum clarity and impact:
          
          Clarity Enhancement Framework:
          1. Message Structure:
             - Clear, logical flow of information
             - Appropriate paragraph breaks
             - Scannable bullet points when relevant
             - Strong topic sentences
             
          2. Conciseness Principles:
             - Eliminate redundant phrases
             - Use precise, specific language
             - Keep sentences focused and clear
             - Maintain appropriate message length
             
          3. Readability Enhancement:
             - Use simple, accessible language
             - Avoid jargon unless industry-standard
             - Ensure proper grammar and punctuation
             - Optimize for mobile viewing
             
          4. Impact Maximization:
             - Place key information prominently
             - Use strong, active language
             - Create memorable key phrases
             - End with compelling call to action
             
          Focus on making messages easy to understand and act upon.
          Ensure clarity doesn't sacrifice personalization or value.
          
        clarity_optimization:
          - "Message_structure_clarity"
          - "Conciseness_effectiveness"
          - "Readability_score"
          - "Impact_maximization"
          
  # Channel-specific rewriting
  channel_rewriting:
    # Email optimization
    email_optimization:
      prompt: |
        Optimize email outreach for maximum effectiveness:
          
          Email Enhancement Framework:
          1. Subject Line Optimization:
             - Personalized and intriguing
             - Professional and appropriate
             - Avoids spam triggers
             - Creates curiosity without clickbait
             
          2. Opening Enhancement:
             - Strong, personalized hook
             - Clear relevance establishment
             - Professional greeting
             - Immediate value proposition
             
          3. Body Content Optimization:
             - Concise, scannable paragraphs
             - Value-focused messaging
             - Professional language and tone
             - Appropriate length (150-200 words)
             
          4. Call to Action Enhancement:
             - Specific, easy-to-execute action
             - Low initial commitment
             - Clear next steps
             - Appropriate urgency without pressure
             
          5. Professional Closing:
             - Appropriate sign-off
             - Complete contact information
             - Professional signature
             - Future engagement invitation
          
          Ensure mobile optimization and accessibility.
          Maintain professional email etiquette throughout.
          
        email_optimization_elements:
          - "Subject_line_effectiveness"
          - "Opening_engagement_quality"
          - "Body_content_optimization"
          - "Call_to_action_clarity"
          
    # LinkedIn optimization
    linkedin_optimization:
      prompt: |
        Optimize LinkedIn outreach for professional networking:
          
          LinkedIn Enhancement Framework:
          1. Connection Request Optimization:
             - Personalized message (300 characters max)
             - Clear connection reason
             - Mutual connection or interest reference
             - Professional and respectful tone
             
          2. InMail Message Enhancement:
             - Platform-appropriate length
             - Professional networking focus
             - Value proposition emphasis
             - Relationship building orientation
             
          3. Profile Engagement Strategy:
             - Thoughtful post comments
             - Relevant article sharing
             - Professional group participation
             - Skill endorsement reciprocity
             
          4. Follow-Up Optimization:
             - Platform-appropriate timing
             - Value-added content sharing
             - Professional relationship nurturing
             - Network expansion opportunities
          
          Leverage LinkedIn's professional context and features.
          Maintain platform-appropriate communication style.
          
        linkedin_optimization_elements:
          - "Connection_request_effectiveness"
          - "Inmail_optimization_quality"
          - "Profile_engagement_strategy"
          - "Platform_appropriateness"
          
  # Industry-specific rewriting
  industry_rewriting:
    # Technology industry
    technology_focus:
      prompt: |
        Rewrite outreach for technology industry professionals:
          
          Technology Industry Enhancement:
          1. Technical Expertise Recognition:
             - Acknowledge specific technical contributions
             - Reference open source work or projects
             - Show understanding of technical challenges
             - Connect to emerging technologies
             
          2. Innovation Discussion:
             - Discuss cutting-edge developments
             - Share relevant technical insights
             - Connect to industry trends
             - Propose technical collaboration
             
          3. Community Engagement:
             - Reference conference participation
             - Acknowledge community contributions
             - Connect to technical forums
             - Share thought leadership content
             
          4. Problem-Solving Focus:
             - Address technical challenges
             - Share solution approaches
             - Discuss implementation strategies
             - Propose knowledge exchange
          
          Demonstrate technical understanding while maintaining accessibility.
          Ensure technical references are accurate and relevant.
          
        technology_enhancement:
          - "Technical_expertise_recognition"
          - "Innovation_discussion_quality"
          - "Community_engagement_strategy"
          - "Problem_solving_focus"
          
    # Healthcare industry
    healthcare_focus:
      prompt: |
        Rewrite outreach for healthcare industry professionals:
          
          Healthcare Industry Enhancement:
          1. Clinical Excellence Recognition:
             - Acknowledge patient care contributions
             - Reference quality improvement initiatives
             - Show understanding of healthcare challenges
             - Connect to treatment advancements
             
          2. Research and Innovation:
             - Discuss medical research developments
             - Share healthcare insights
             - Connect to clinical innovations
             - Propose research collaboration
             
          3. Professional Development:
             - Acknowledge continuing education
             - Reference specialty certifications
             - Connect to professional associations
             - Share learning opportunities
             
          4. System Improvement Focus:
             - Discuss healthcare system challenges
             - Share process improvement insights
             - Connect to policy developments
             - Propose system optimization
          
          Maintain patient privacy and confidentiality.
          Ensure compliance with healthcare standards.
          
        healthcare_enhancement:
          - "Clinical_excellence_recognition"
          - "Research_innovation_discussion"
          - "Professional_development_focus"
          - "System_improvement_strategy"
          
  # Relationship building rewriting
  relationship_rewriting:
    # Long-term relationship focus
    relationship_building:
      prompt: |
        Rewrite outreach to focus on long-term relationship building:
          
          Relationship Building Enhancement:
          1. Trust Establishment:
             - Demonstrate reliability and consistency
             - Share valuable insights regularly
             - Show genuine interest in their success
             - Maintain professional integrity
             
          2. Value Exchange:
             - Focus on mutual benefit
             - Share resources and connections
             - Provide ongoing support
             - Create collaboration opportunities
             
          3. Professional Growth Support:
             - Support their career development
             - Share learning opportunities
             - Provide mentorship when appropriate
             - Celebrate their achievements
             
          4. Network Expansion:
             - Introduce valuable connections
             - Facilitate introductions
             - Create networking opportunities
             - Build community engagement
          
          Focus on building authentic, lasting professional relationships.
          Ensure all relationship building is ethical and professional.
          
        relationship_building_elements:
          - "Trust_establishment_strategy"
          - "Value_exchange_optimization"
          - "Professional_growth_support"
          - "Network_expansion_focus"
          
  # Quality assurance for rewriting
  rewriting_quality:
    # Validation checks
    validation:
      prompt: |
        Validate rewritten outreach content for quality and effectiveness:
          
          Quality Validation Criteria:
          1. Personalization Authenticity:
             - Genuine research-based personalization
             - Specific, relevant details included
             - Avoids template or generic language
             - Demonstrates true interest and understanding
             
          2. Professional Standards:
             - Appropriate tone and language
             - Respect for time and boundaries
             - Compliance with professional ethics
             - Cultural and industry appropriateness
             
          3. Value Proposition:
             - Clear benefit to recipient
             - Specific, actionable value offered
             - Mutual benefit orientation
             - Long-term relationship potential
             
          4. Communication Effectiveness:
             - Clear, concise messaging
             - Appropriate length and format
             - Strong engagement potential
             - Professional presentation
             
          Flag any issues that could negatively impact professional relationships.
          Ensure compliance with networking best practices.
          
        validation_metrics:
          - "Personalization_authenticity_score"
          - "Professional_standards_compliance"
          - "Value_proposition_effectiveness"
          - "Communication_impact_rating"
          
    # Performance optimization
      optimization:
        prompt: |
          Optimize rewritten outreach content for maximum performance:
          
          Performance Optimization Areas:
          1. Response Rate Enhancement:
             - Subject line and opening optimization
             - Call to action effectiveness
             - Personalization depth
             - Value proposition clarity
             
          2. Engagement Quality:
             - Relationship building potential
             - Long-term connection value
             - Professional network expansion
             - Trust and credibility establishment
             
          3. Conversion Optimization:
             - Meeting request acceptance
             - Collaboration opportunity creation
             - Resource sharing effectiveness
             - Network introduction success
             
          4. Brand Enhancement:
             - Professional authority demonstration
             - Thought leadership positioning
             - Industry expertise showcase
             - Personal brand alignment
          
          Provide specific optimization recommendations with expected impact.
          
        optimization_techniques:
          - "Response_rate_optimization"
          - "Engagement_quality_enhancement"
          - "Conversion_strategy_improvement"
          - "Brand_development_support"

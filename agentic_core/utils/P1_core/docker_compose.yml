networks:
  subatomic-net:
    driver: bridge
services:
  agentic-app:
    build:
      context: .
      dockerfile: Dockerfile
    command: python verify_installation.py
    container_name: subatomic-core
    depends_on:
      redis-stack:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 24G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    environment:
    - REDIS_HOST=redis-stack
    - REDIS_PORT=6379
    - REDIS_URL=redis://redis-stack:6379/0
    - VECTOR_DB_URL=http://vector-db:6333
    - QDRANT_URL=http://vector-db:6333
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    - PINECONE_API_KEY=${PINECONE_API_KEY}
    - MISTRALAI_API_KEY=${MISTRALAI_API_KEY}
    - COHERE_API_KEY=${COHERE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - PYTHONUNBUFFERED=1
    - LOG_LEVEL=INFO
    networks:
    - subatomic-net
    ports:
    - 8000:8000
    - 8501:8501
    restart: unless-stopped
    volumes:
    - ./data:/app/data
    - ./config:/app/config
    - ./scripts:/app/scripts
    - ./logs:/app/logs
  jaeger:
    container_name: subatomic-jaeger
    environment:
    - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    image: jaegertracing/all-in-one:1.53
    networks:
    - subatomic-net
    ports:
    - 16686:16686
    - 4317:4317
  redis-stack:
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    container_name: agentic-redis-stack
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis/redis-stack-server:7.4.0-v3
    networks:
    - subatomic-net
    ports:
    - 6379:6379
    - 8001:8001
    volumes:
    - redis_data:/data
  vector-db:
    container_name: subatomic-qdrant
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
    - QDRANT__SERVICE__ENABLE_GRPC=true
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s
      test:
      - CMD-SHELL
      - timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      timeout: 5s
    image: qdrant/qdrant:v1.7.3
    networks:
    - subatomic-net
    ports:
    - 6333:6333
    - 6334:6334
    volumes:
    - qdrant_data:/qdrant/storage
version: '3.8'
volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local

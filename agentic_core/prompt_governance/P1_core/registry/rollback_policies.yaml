rollback_policies:
  configuration:
    audit_trail:
      enabled: true
      events:
      - policy_created
      - policy_updated
      - rollback_triggered
      - rollback_completed
      - emergency_override_used
      retention: 7_years
    change_management:
      approval_required: true
      approvers:
      - prompt_lead
      - ops_manager
    policy_versioning:
      auto_increment: true
      enabled: true
  documentation:
    incident_docs:
      required_sections:
      - executive_summary
      - timeline
      - root_cause
      - impact_assessment
      - prevention_measures
      template: rollback_incident_template.md
    rollback_reports:
      auto_generate: true
      distribution:
      - management
      - compliance
      format: pdf
  emergency:
    emergency_rollback:
      enabled: true
      execution:
        alert_management: true
        bypass_approval: true
        immediate_switch: true
      trigger_conditions:
      - security_breach
      - data_corruption
      - service_outage
    manual_override:
      enabled: true
      override_types:
      - force_rollback
      - skip_health_checks
      - extend_rollback_window
      required_roles:
      - emergency_responder
      - system_admin
  engines:
    outreach_engine:
      custom_triggers:
      - name: spam_score
        threshold: 0.1
      health_checks:
      - name: response_success_rate
        threshold: 0.9
      - name: personalization_score
        threshold: 0.75
      - name: safety_compliance
        threshold: 1.0
      rollback_strategy: immediate
    resume_engine:
      custom_triggers:
      - name: format_compliance
        threshold: 0.98
      health_checks:
      - name: processing_success_rate
        threshold: 0.95
      - name: output_quality_score
        threshold: 0.8
      - name: processing_latency
        threshold: 5000
      rollback_strategy: gradual
  global_config:
    automatic_rollback: true
    enabled: true
    health_thresholds:
      error_rate: 0.05
      latency_increase: 2.0
      quality_score_drop: 0.15
    manual_approval_required: false
    max_rollback_attempts: 3
    monitoring_period: 72h
    rollback_window: 24h
  last_updated: '2024-01-01T00:00:00Z'
  monitoring:
    health_checks:
    - interval: 30s
      name: rollback_system_health
      timeout: 10s
    - interval: 1m
      name: version_availability
      timeout: 15s
    metrics:
    - labels:
      - engine
      - trigger
      - strategy
      name: rollback_events_total
      type: counter
    - labels:
      - engine
      - strategy
      name: rollback_duration_seconds
      type: histogram
    - labels:
      - engine
      - strategy
      name: rollback_success_rate
      type: gauge
  notifications:
    rollback_completed:
      channels:
      - slack
      - email
      recipients:
      - ops_team
      - prompt_engineers
      - stakeholders
    rollback_failed:
      channels:
      - pagerduty
      - slack
      - phone
      recipients:
      - oncall_engineer
      - ops_manager
    rollback_started:
      channels:
      - slack
      - email
      - pagerduty
      recipients:
      - ops_team
      - prompt_engineers
  safety:
    post_rollback_validation:
    - name: functionality_test
      required: true
    - name: performance_test
      required: true
    - name: safety_test
      required: true
    pre_rollback_checks:
    - name: data_integrity_check
      required: true
    - name: dependency_validation
      required: true
    - name: security_scan
      required: true
  strategies:
    canary:
      description: Test rollback on small traffic subset
      execution:
        auto_promote: false
        canary_percentage: 5
        evaluation_duration: 10m
      triggers:
      - minor_issues
      - a_b_testing
    gradual:
      description: Phased rollback with traffic shifting
      execution:
        phases:
        - duration: 5m
          health_check: true
          percentage: 10
        - duration: 15m
          health_check: true
          percentage: 50
        - duration: 30m
          health_check: true
          percentage: 100
      triggers:
      - performance_degradation
      - quality_issues
    immediate:
      description: Instant rollback to previous version
      execution:
        cleanup_resources: true
        drain_connections: true
        switch_traffic: true
      triggers:
      - safety_violations
      - critical_errors
  testing:
    rollback_tests:
      enabled: true
      schedule: 0 3 * * 0
      test_scenarios:
      - name: performance_degradation
        simulation: latency_injection
      - name: quality_degradation
        simulation: quality_score_reduction
      - name: error_spike
        simulation: error_rate_increase
    validation:
      functional_tests:
      - resume_processing_workflow
      - outreach_generation_workflow
      performance_tests:
      - load_test_100_rps
      - stress_test_500_rps
      safety_tests:
      - content_safety_validation
      - pii_detection_validation
  triggers:
    automatic:
      error_rate_threshold:
        consecutive_violations: 3
        enabled: true
        evaluation_window: 15m
        threshold: 0.05
      latency_threshold:
        enabled: true
        evaluation_window: 10m
        threshold_multiplier: 2.0
      quality_threshold:
        enabled: true
        evaluation_window: 30m
        threshold_drop: 0.15
      safety_violations:
        enabled: true
        evaluation_window: 5m
        threshold: 1
    manual:
      operator_intervention:
        enabled: true
        required_roles:
        - admin
        - prompt_engineer
      user_feedback:
        enabled: true
        evaluation_window: 1h
        negative_feedback_threshold: 10
  version: '1.0'
  version_management:
    cleanup:
      enabled: true
      retention_period: 90d
      schedule: 0 2 * * *
    retention:
      active_versions: 3
      archive_versions: 10
      rollback_versions: 5
    tagging:
      auto_tag_rollback: true
      auto_tag_stable: true
      tag_format: v{major}.{minor}.{patch}-{type}

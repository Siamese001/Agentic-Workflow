prompt_manifest:
  compliance:
    data_retention:
      audit_trails: 7_years
      prompt_versions: 2_years
      usage_logs: 90_days
    frameworks:
    - last_audit: '2024-01-01T00:00:00Z'
      name: SOC 2
      status: compliant
    - last_audit: '2024-01-01T00:00:00Z'
      name: GDPR
      status: compliant
    - name: HIPAA
      status: not_applicable
  generated_at: '2024-01-01T00:00:00Z'
  global_config:
    default_language: en
    default_model: gpt-4
    fallback_models:
    - gpt-3.5-turbo
    - claude-3
    quality_standards:
      max_tokens: 4000
      min_tokens: 50
      required_sections:
      - description
      - purpose
      - usage
    security:
      audit_logging: true
      content_filtering: true
      pii_detection: true
    supported_languages:
    - en
    - es
    - fr
    - de
    - zh
    - ja
  injections:
    constraints:
      category: safety
      file: injections/constraints.yaml
      id: constraints
      metadata:
        description: System constraints and boundary enforcement
        purpose: Ensure all outputs stay within defined parameters
      name: Constraint Enforcement
      status: active
      version: 1.0.0
    context_engineering:
      category: system
      file: injections/context_engineering.yaml
      id: context_engineering
      metadata:
        description: Context building and information structuring
        purpose: Organize and structure context for optimal processing
      name: Context Engineering
      status: active
      version: 1.0.0
    framing:
      category: system
      file: injections/framing.yaml
      id: framing
      metadata:
        description: Problem definition and perspective framing
        purpose: Frame problems and tasks for optimal solution approaches
      name: Problem Framing
      status: active
      version: 1.0.0
    output_governance:
      category: safety
      file: injections/output_governance.yaml
      id: output_governance
      metadata:
        description: Output format and content governance
        purpose: Ensure outputs meet formatting and quality standards
      name: Output Governance
      status: active
      version: 1.0.0
    reasoning:
      category: system
      file: injections/reasoning.yaml
      id: reasoning
      metadata:
        description: Logical reasoning and decision-making frameworks
        purpose: Guide systematic reasoning and analysis processes
      name: Reasoning Logic
      status: active
      version: 1.0.0
    safety:
      category: safety
      file: injections/safety.yaml
      id: safety
      metadata:
        description: Safety checks and ethical guidelines
        purpose: Ensure all outputs are safe and ethically sound
      name: Safety Protocols
      status: active
      version: 1.0.0
    tool_use:
      category: system
      file: injections/tool_use.yaml
      id: tool_use
      metadata:
        description: Tool selection and usage guidance
        purpose: Guide appropriate tool usage and integration
      name: Tool Usage
      status: active
      version: 1.0.0
  prompts:
    outreach_archetype:
      category: system
      engine: outreach_engine
      file: engines/outreach_engine/archetype.yaml
      id: outreach_archetype
      metadata:
        description: Core persona and archetype definitions for outreach
        purpose: Define communication styles and professional personas
      name: Outreach Archetype Prompts
      status: active
      version: 1.0.0
    outreach_messaging:
      category: user
      engine: outreach_engine
      file: engines/outreach_engine/messaging.yaml
      id: outreach_messaging
      metadata:
        description: Message composition and formatting prompts
        purpose: Generate professional outreach messages and communications
      name: Outreach Messaging Prompts
      status: active
      version: 1.0.0
    outreach_personalization:
      category: user
      engine: outreach_engine
      file: engines/outreach_engine/personalization.yaml
      id: outreach_personalization
      metadata:
        description: Personalization logic for tailored outreach messages
        purpose: Customize outreach based on recipient profile and context
      name: Outreach Personalization Prompts
      status: active
      version: 1.0.0
    outreach_reflective_checks:
      category: safety
      engine: outreach_engine
      file: engines/outreach_engine/reflective_checks.yaml
      id: outreach_reflective_checks
      metadata:
        description: Quality and safety checks for outreach content
        purpose: Ensure outreach meets professional and ethical standards
      name: Outreach Reflective Checks
      status: active
      version: 1.0.0
    resume_rewriting:
      category: user
      engine: resume_engine
      file: engines/resume_engine/rewriting.yaml
      id: resume_rewriting
      metadata:
        dependencies:
        - system_prompts.yaml
        - scoring.yaml
        description: Prompts for rewriting and optimizing resume content
        purpose: Transform raw resume data into polished, professional content
      name: Resume Rewriting Prompts
      status: active
      version: 1.0.0
    resume_scoring:
      category: evaluation
      engine: resume_engine
      file: engines/resume_engine/scoring.yaml
      id: resume_scoring
      metadata:
        description: Evaluation and scoring prompts for resume quality
        purpose: Assess resume effectiveness and provide improvement recommendations
      name: Resume Scoring Prompts
      status: active
      version: 1.0.0
    resume_summarization:
      category: user
      engine: resume_engine
      file: engines/resume_engine/summarization.yaml
      id: resume_summarization
      metadata:
        description: Prompts for creating concise resume summaries
        purpose: Generate executive summaries and highlights from resume content
      name: Resume Summarization Prompts
      status: active
      version: 1.0.0
    resume_system_prompts:
      category: system
      engine: resume_engine
      file: engines/resume_engine/system_prompts.yaml
      id: resume_system_prompts
      metadata:
        created_at: '2024-01-01T00:00:00Z'
        created_by: system
        dependencies:
        - safety.yaml
        - constraints.yaml
        description: Core system prompts for resume processing workflow
        parameters:
        - default: modern
          name: resume_format
          options:
          - modern
          - classic
          - technical
          type: string
        - name: target_role
          required: true
          type: string
        purpose: Provide foundational instructions for resume analysis and generation
        updated_at: '2024-01-01T00:00:00Z'
        updated_by: system
        usage:
          api_endpoints:
          - /api/resume/analyze
          - /api/resume/generate
          integration_points:
          - L1_planning
          - L2_execution
      name: Resume System Prompts
      status: active
      version: 1.0.0
  schema_version: '1.0'
  templates:
    outreach_cold:
      category: template
      file: templates/outreach/cold_outreach_template.md
      id: outreach_cold_template
      metadata:
        description: Template for cold outreach messages
        purpose: Standardized format for initial contact messages
      name: Cold Outreach Template
      status: active
      version: 1.0.0
    outreach_connection:
      category: template
      file: templates/outreach/connection_request.md
      id: outreach_connection_template
      metadata:
        description: Template for professional connection requests
        purpose: Standardized format for networking requests
      name: Connection Request Template
      status: active
      version: 1.0.0
    outreach_followup:
      category: template
      file: templates/outreach/followup_template.md
      id: outreach_followup_template
      metadata:
        description: Template for follow-up communications
        purpose: Standardized format for follow-up messages
      name: Follow-up Template
      status: active
      version: 1.0.0
    resume_experience:
      category: template
      file: templates/resume/experience_template.md
      id: resume_experience_template
      metadata:
        description: Template for work experience descriptions
        purpose: Standardized format for experience sections
      name: Resume Experience Template
      status: active
      version: 1.0.0
    resume_skills:
      category: template
      file: templates/resume/skills_template.md
      id: resume_skills_template
      metadata:
        description: Template for skills and competencies
        purpose: Standardized format for skills presentation
      name: Resume Skills Template
      status: active
      version: 1.0.0
    resume_summary:
      category: template
      file: templates/resume/summary_template.md
      id: resume_summary_template
      metadata:
        description: Template for resume executive summaries
        purpose: Standardized format for resume summary sections
      name: Resume Summary Template
      status: active
      version: 1.0.0
  version: '1.0'
  version_tracking:
    current_version: 1.0.0
    version_history:
    - changes:
      - Initial release
      - Complete prompt manifest
      released_at: '2024-01-01T00:00:00Z'
      version: 1.0.0

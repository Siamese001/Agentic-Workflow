constraints_injection:
  business_constraints:
    cost:
      cost_optimization_enabled: true
      max_cost_per_request: 0.1
      max_daily_budget: 100.0
    quality:
      min_accuracy_score: 0.85
      min_quality_score: 0.8
      min_relevance_score: 0.9
  engine_constraints:
    outreach_engine:
      content_constraints:
        forbidden_content:
        - spam_indicators
        - misleading_claims
        - excessive_urgency
        - personal_data_requests
        max_call_to_actions: 1
        max_message_length: 500
        min_personalization_elements: 3
        required_elements:
        - professional_greeting
        - context_reference
        - value_proposition
        - clear_call_to_action
      timing_constraints:
        max_followup_frequency: 7_days
        min_interval_between_messages: 3_days
    resume_engine:
      content_constraints:
        forbidden_content:
        - personal_identifiers
        - age_birth_date
        - marital_status
        - religious_information
        max_bullets_per_section: 8
        max_sections: 10
        max_years_experience: 50
        required_sections:
        - contact_information
        - professional_summary
        - work_experience
        - education
        - skills
      format_constraints:
        font_size_range:
        - 10
        - 12
        margin_requirements: standard
        max_page_length: 2
  environments:
    development:
      enforcement_level: moderate
      monitoring_enabled: true
    production:
      enforcement_level: strictest
      monitoring_enabled: true
      real_time_alerting: true
    staging:
      enforcement_level: strict
      monitoring_enabled: true
  global_constraints:
    content_constraints:
      forbidden_topics:
      - illegal_activities
      - harmful_instructions
      - discriminatory_content
      - personal_data_requests
      required_elements:
      - professional_tone
      - factually_accurate
      - ethically_sound
    enabled: true
    enforcement_level: strict
    output_constraints:
      format_requirements:
      - valid_json_or_yaml
      - no_malicious_content
      - professional_language
      max_response_time: 30
      max_tokens: 4000
      min_tokens: 50
  integrations:
    api_constraints:
      authentication_required: true
      rate_limiting: true
      request_validation: true
    database_constraints:
      connection_pool_size: 10
      query_timeout: 30
      transaction_size_limit: 100MB
  last_updated: '2024-01-01T00:00:00Z'
  legal_constraints:
    data_handling:
      audit_logging: true
      data_encryption: true
      retention_policy: 90_days
    regulations:
      ccpa_compliant: true
      gdpr_compliant: true
      sox_compliant: false
  maintenance:
    update_schedule:
      review_frequency: monthly
      update_frequency: quarterly
    version_control:
      require_approval: true
      rollback_available: true
      track_changes: true
  monitoring:
    alerting:
      critical_violation_threshold: 1
      violation_rate_threshold: 0.05
    metrics:
    - labels:
      - constraint_type
      - severity
      name: constraint_violations_total
      type: counter
    - name: constraint_enforcement_rate
      type: gauge
    - name: constraint_processing_time
      type: histogram
  performance_constraints:
    latency:
      max_network_time: 5
      max_processing_time: 25
      max_response_time: 30
    resources:
      max_concurrent_requests: 100
      max_cpu_usage: 80%
      max_memory_usage: 1GB
  safety_constraints:
    content_safety:
      hate_speech_detection: true
      hate_threshold: 0.05
      self_harm_detection: true
      sexual_content_detection: true
      toxicity_threshold: 0.1
      violence_detection: true
      violence_threshold: 0.05
    enabled: true
    pii_constraints:
      detection_enabled: true
      protected_fields:
      - social_security_numbers
      - credit_card_numbers
      - bank_account_numbers
      - email_addresses
      - phone_numbers
      - home_addresses
      redaction_enabled: true
    priority: highest
  templates:
    patterns:
      content_constraint:
        allowed_values:
        - professional
        - informative
        - helpful
        forbidden_values:
        - spam
        - harmful
        - illegal
        type: list
      format_constraint:
        pattern: ^[\w\s\.,!?-]+$
        type: regex
      length_constraint:
        max: 4000
        min: 50
        type: range
  validation_rules:
    post_processing:
      output_validation:
      - verify_output_format
      - check_output_length
      - scan_for_violations
      quality_validation:
      - assess_content_quality
      - verify_factual_accuracy
      - check_tone_appropriateness
    pre_processing:
      context_validation:
      - verify_context_relevance
      - check_context_completeness
      input_validation:
      - check_input_format
      - validate_input_size
      - scan_for_malicious_content
  version: '1.0'
  violation_handling:
    responses:
      content_violation:
      - sanitize_content
      - apply_filters
      - request_revision
      format_violation:
      - reformat_output
      - apply_template
      - validate_structure
      performance_violation:
      - optimize_processing
      - reduce_complexity
      - cache_results
    severity_levels:
      critical:
        action: immediate_rejection
        notification: security_team
      high:
        action: automatic_correction
        notification: ops_team
      low:
        action: log_only
        notification: none
      medium:
        action: warning_and_correction
        notification: user

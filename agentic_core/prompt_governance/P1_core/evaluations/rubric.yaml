prompt_evaluation_rubric:
  continuous_improvement:
    feedback_loops:
      iterative_updates:
      - Schedule regular evaluation cycles
      - Implement incremental improvements
      - Test and validate changes
      - Document improvement history
      performance_monitoring:
      - Track prompt performance metrics
      - Monitor output quality trends
      - Measure efficiency improvements
      - Analyze success rates
      user_feedback:
      - Collect user experience feedback
      - Monitor usage patterns and issues
      - Track satisfaction metrics
      - Analyze support requests
  evaluation_criteria:
    content_quality:
      clarity_score:
        description: Assessment of prompt clarity and understandability
        levels:
          average: Prompt has some ambiguity but is generally understandable
          excellent: Prompt is crystal clear, unambiguous, and easily understood
          failing: Prompt is completely unclear or incomprehensible
          good: Prompt is clear with minor ambiguity that doesn't affect execution
          poor: Prompt is unclear, confusing, or difficult to understand
        weight: 0.2
      completeness_score:
        description: Coverage of all necessary aspects and edge cases
        levels:
          average: Covers basic aspects with notable gaps
          excellent: Comprehensive coverage of all aspects and edge cases
          failing: Incomplete coverage missing critical aspects
          good: Covers most aspects with minor gaps
          poor: Limited coverage with significant gaps
        weight: 0.15
      specificity_score:
        description: Degree of specific, actionable guidance provided
        levels:
          average: Moderately specific with some general guidance
          excellent: Highly specific with detailed, actionable guidance
          failing: Completely generic with no specific guidance
          good: Specific with clear guidance for most scenarios
          poor: Vague with limited specific guidance
        weight: 0.15
    effectiveness:
      output_quality_score:
        description: Quality and reliability of outputs generated by the prompt
        levels:
          average: Generates adequate outputs with notable issues
          excellent: Consistently generates high-quality, reliable outputs
          failing: Fails to generate usable outputs
          good: Generally generates quality outputs with minor issues
          poor: Generates poor quality outputs with significant issues
        weight: 0.15
      task_alignment_score:
        description: How well the prompt aligns with intended task objectives
        levels:
          average: Moderate alignment with some task objectives
          excellent: Perfect alignment with all task objectives
          failing: No alignment with task objectives
          good: Strong alignment with most task objectives
          poor: Weak alignment with few task objectives
        weight: 0.15
    technical_quality:
      consistency_score:
        description: Internal consistency and coherence of the prompt
        levels:
          average: Generally consistent with some contradictions
          excellent: Perfectly consistent with no contradictions
          failing: Highly inconsistent with numerous contradictions
          good: Consistent with minor inconsistencies
          poor: Inconsistent with multiple contradictions
        weight: 0.1
      maintainability_score:
        description: Ease of updating, modifying, and maintaining the prompt
        levels:
          average: Somewhat maintainable with basic structure
          excellent: Highly maintainable with modular, well-documented structure
          failing: Unmaintainable with no clear structure
          good: Maintainable with clear structure and documentation
          poor: Difficult to maintain with poor structure
        weight: 0.1
      structure_score:
        description: Logical organization and formatting of the prompt
        levels:
          average: Adequately structured with some organizational issues
          excellent: Perfectly structured with optimal formatting and organization
          failing: Chaotic structure with no clear organization
          good: Well-structured with minor formatting improvements possible
          poor: Poorly structured with significant formatting problems
        weight: 0.1
    usability:
      documentation_score:
        description: Quality and completeness of prompt documentation
        levels:
          average: Basic documentation with limited examples
          excellent: Comprehensive, clear documentation with examples
          failing: No documentation
          good: Good documentation with adequate examples
          poor: Minimal documentation with no examples
        weight: 0.1
      ease_of_use_score:
        description: How easy the prompt is to understand and apply
        levels:
          average: Moderately easy with some complexity
          excellent: Extremely easy to understand and apply
          failing: Very difficult or impossible to use
          good: Easy to understand and apply
          poor: Difficult to understand or apply
        weight: 0.1
  evaluation_process:
    evaluation_execution:
      content_assessment:
      - Analyze prompt clarity and specificity
      - Evaluate completeness of coverage
      - Check for logical consistency
      - Assess documentation quality
      effectiveness_testing:
      - Test prompt with various inputs
      - Evaluate output quality and consistency
      - Assess task alignment and goal achievement
      - Measure performance and efficiency
      technical_assessment:
      - Review prompt structure and formatting
      - Evaluate maintainability aspects
      - Check for technical best practices
      - Assess integration capabilities
    post_evaluation:
      analysis_reporting:
      - Compile evaluation results and scores
      - Identify strengths and improvement areas
      - Provide specific recommendations
      - Create action plan for improvements
    pre_evaluation:
      requirements_review:
      - Review prompt objectives and intended use cases
      - Identify target audience and context
      - Establish evaluation criteria priorities
      - Prepare test scenarios and edge cases
  improvement_framework:
    priority_levels:
      critical: Must fix - blocks functionality or violates standards
      high: Should fix - significantly impacts quality or usability
      low: Nice to fix - minor improvements or optimizations
      medium: Could fix - moderate impact on quality or user experience
    recommendation_categories:
      content_improvements:
      - Enhance clarity and specificity
      - Improve completeness and coverage
      - Strengthen task alignment
      - Optimize output quality
      technical_improvements:
      - Improve structure and formatting
      - Enhance maintainability
      - Optimize performance
      - Strengthen integration
      usability_improvements:
      - Simplify complexity
      - Enhance documentation
      - Improve user experience
      - Add helpful examples
  last_updated: '2024-01-01T00:00:00Z'
  quality_assurance:
    automated_checks:
      content_validation:
      - Spelling and grammar checking
      - Consistency verification
      - Duplicate content detection
      - Template compliance checking
      format_validation:
      - YAML syntax validation
      - Required field completeness
      - Data type consistency
      - Naming convention compliance
    manual_review:
      expert_review:
      - Subject matter expert validation
      - Industry standards compliance
      - Best practices alignment
      - User experience assessment
      peer_review:
      - Cross-functional team review
      - Stakeholder feedback collection
      - Usability testing results
      - Performance evaluation
  reporting_templates:
    detailed_analysis:
      sections:
      - Methodology Overview
      - Test Results and Data
      - Comparative Analysis
      - Risk Assessment
      - Improvement Roadmap
      - Success Metrics
    evaluation_summary:
      sections:
      - Executive Summary
      - Overall Score and Grade
      - Detailed Criteria Breakdown
      - Strengths and Weaknesses
      - Specific Recommendations
      - Action Plan and Timeline
  scoring_methodology:
    grade_classifications:
      A: 90-94 (Excellent)
      A_plus: 95-100 (Exceptional)
      B: 80-84 (Good)
      B_plus: 85-89 (Very Good)
      C: 70-74 (Average)
      C_plus: 75-79 (Above Average)
      D: 60-69 (Below Average)
      F: 0-59 (Failing)
    overall_score_calculation:
      excellence_threshold: 90
      formula: weighted_average_of_all_criteria
      max_score: 100
      passing_threshold: 70
  specialized_rubrics:
    outreach_engine_prompts:
      additional_criteria:
        engagement_optimization: Optimizes for engagement and response rates
        networking_expertise: Demonstrates professional networking knowledge
        professional_standards: Maintains high professional communication standards
        relationship_building: Focuses on long-term relationship development
      scoring_weights:
        content_quality: 0.3
        effectiveness: 0.35
        technical_quality: 0.25
        usability: 0.1
    resume_engine_prompts:
      scoring_weights:
        content_quality: 0.35
        effectiveness: 0.3
        technical_quality: 0.25
        usability: 0.1
      system_prompts:
        additional_criteria:
          ats_optimization: Incorporates ATS optimization best practices
          career_guidance: Provides effective career development guidance
          industry_relevance: Aligns with current industry standards
          resume_expertise: Demonstrates deep resume industry knowledge
  version: '1.0'

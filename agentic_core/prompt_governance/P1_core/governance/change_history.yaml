change_history:
  change_analysis:
    impact_analysis:
      business_impact:
      - cost_impact: Financial impact of changes
      - productivity_impact: Impact on team productivity
      - risk_impact: Changes in risk exposure
      compliance_impact:
      - regulatory_compliance: Impact on regulatory compliance
      - audit_findings: Audit-related changes and findings
      - policy_adherence: Adherence to internal policies
      performance_impact:
      - response_time_changes: Impact on prompt response times
      - quality_score_changes: Impact on output quality metrics
      - user_satisfaction_impact: Impact on user satisfaction scores
    trend_analysis:
      metrics:
      - change_frequency: Number of changes per time period
      - change_distribution: Distribution by category and severity
      - approval_cycle_time: Time from submission to approval
      - implementation_success_rate: Success rate of implemented changes
      reporting_periods:
        daily: Daily change activity summary
        monthly: Monthly comprehensive change report
        quarterly: Quarterly strategic change analysis
        weekly: Weekly trend analysis and insights
  change_record_template:
    approval_information:
      approval_timestamp: approval_completion_time
      approvers: list_of_approvers
      rejection_reasons: rejection_justifications
      workflow_id: approval_workflow_identifier
    change_details:
      dependencies: related_changes
      description: detailed_change_description
      rationale: change_justification
      scope: affected_components
    impact_assessment:
      compliance_impact: regulatory_compliance_impact
      performance_impact: performance_metrics_impact
      risk_assessment: risk_level_and_mitigation
      user_impact: user_experience_impact
    implementation:
      implementation_date: deployment_timestamp
      implementer: deployment_user_id
      monitoring_plan: post_deployment_monitoring
      rollback_plan: rollback_procedures
    metadata:
      category: change_category
      change_id: unique_identifier
      severity: change_severity
      submitter: user_id
      timestamp: ISO_8601_timestamp
      version: semantic_version
  governance_policies:
    change_authorization:
      authorization_matrix:
        emergency_fix:
        - technical_lead_submit
        - governance_committee_approve
        prompt_creation:
        - prompt_engineer_submit
        - technical_lead_approve
        prompt_deprecation:
        - technical_lead_submit
        - governance_committee_approve
        prompt_modification:
        - prompt_engineer_submit
        - technical_lead_approve
      authorized_roles:
      - prompt_engineer: Can submit changes for review
      - technical_lead: Can approve technical changes
      - compliance_officer: Can approve compliance-related changes
      - governance_committee: Can approve high-impact changes
    change_constraints:
      resource_constraints:
      - maximum_concurrent_changes: Maximum 5 changes per team
      - testing_requirements: All changes require comprehensive testing
      - documentation_requirements: All changes require complete documentation
      time_constraints:
      - standard_changes: Maximum 14 days from submission to implementation
      - high_severity_changes: Maximum 7 days from submission to implementation
      - emergency_changes: Maximum 24 hours from submission to implementation
  historical_changes:
    change_entry_template:
      approval_information:
        approval_timestamp: '2024-01-01T14:30:00Z'
        approvers:
        - prompt_engineer
        - technical_lead
        rejection_reasons: []
        workflow_id: WF-2024-01-01-001
      category: prompt_modification
      change_details:
        dependencies:
        - CHANGE-2024-01-01-001
        description: Modified executive summary prompt for better clarity
        rationale: User feedback indicated ambiguity in career transition guidance
        scope: resume_engine/system_prompts.yaml
      change_id: CHANGE-YYYY-MM-DD-NNN
      impact_assessment:
        compliance_impact: No compliance impact
        performance_impact: Minimal performance impact (< 2% increase)
        risk_assessment: Low risk with comprehensive monitoring
        user_impact: Improved clarity for career transition users
      implementation:
        implementation_date: '2024-01-01T16:00:00Z'
        implementer: release_manager@example.com
        monitoring_plan: Monitor user satisfaction scores for 30 days
        rollback_plan: Revert to version 1.0.0 using version control
      severity: medium
      submitter: user@example.com
      timestamp: '2024-01-01T12:00:00Z'
      version: 1.0.1
  improvement_process:
    feedback_collection:
    - stakeholder_surveys: Quarterly stakeholder feedback surveys
    - user_feedback: Continuous user feedback collection
    - performance_reviews: Monthly performance review meetings
    - incident_analysis: Post-incident analysis and learning
    optimization_activities:
    - process_streamlining: Regular process optimization reviews
    - automation_enhancement: Continuous automation improvement
    - policy_updates: Regular policy review and updates
    - training_improvement: Training program enhancements
    success_metrics:
    - cycle_time_reduction: 'Target: 20% reduction in cycle time'
    - quality_improvement: 'Target: 15% improvement in change quality'
    - stakeholder_satisfaction: 'Target: 85% stakeholder satisfaction'
    - risk_reduction: 'Target: 25% reduction in change-related risk'
  last_updated: '2024-01-01T00:00:00Z'
  notification_system:
    notification_channels:
      dashboard:
      - real_time_updates: Real-time dashboard updates
      - change_status_tracking: Live status tracking
      - performance_metrics: Live performance impact tracking
      email:
      - standard_changes: Email notification to approvers
      - high_severity_changes: Email to all stakeholders
      - emergency_changes: Immediate email to all stakeholders
      slack:
      - change_submissions: Slack notification to relevant channels
      - approval_completions: Slack notification of approvals
      - implementation_notifications: Slack notification of implementations
    notification_triggers:
    - change_submitted: Notify relevant approvers and stakeholders
    - change_approved: Notify submitter and implementation team
    - change_rejected: Notify submitter with rejection reasons
    - change_implemented: Notify all stakeholders of implementation
    - change_rolled_back: Notify all stakeholders of rollback
  performance_metrics:
    business_metrics:
    - cost_per_change: Track and optimize change costs
    - productivity_impact: Measure impact on team productivity
    - risk_exposure: Monitor and manage risk exposure
    - innovation_rate: Track rate of innovative changes
    efficiency_metrics:
    - average_change_cycle_time: 'Target: < 10 days'
    - change_success_rate: 'Target: > 95%'
    - rollback_rate: 'Target: < 5%'
    - approval_efficiency: 'Target: > 90% on-time approvals'
    quality_metrics:
    - change_quality_score: 'Target: > 85%'
    - user_satisfaction_impact: 'Target: Positive impact'
    - performance_impact: 'Target: < 5% performance degradation'
    - compliance_maintenance: 'Target: 100% compliance maintenance'
  rollback_procedures:
    rollback_process:
      immediate_rollback:
      - trigger: Critical production issues
      - authority: Technical lead or release manager
      - process: Immediate rollback to previous stable version
      - notification: Immediate notification to all stakeholders
      scheduled_rollback:
      - trigger: Non-critical issues identified
      - authority: Governance committee approval
      - process: Scheduled rollback during maintenance window
      - notification: Advance notification to affected users
    rollback_triggers:
    - performance_degradation: Performance metrics below threshold
    - user_complaints: Significant user complaints or issues
    - compliance_violations: Regulatory compliance violations
    - security_vulnerabilities: Security issues identified
    rollback_validation:
    - pre_rollback_testing: Test rollback procedures in staging
    - post_rollback_verification: Verify system stability after rollback
    - impact_assessment: Assess rollback impact on users and systems
    - documentation_update: Update documentation with rollback details
  system_integrations:
    monitoring:
    - performance_monitoring: Integration with performance monitoring systems
    - error_tracking: Integration with error tracking systems
    - user_analytics: Integration with user analytics platforms
    - compliance_monitoring: Integration with compliance monitoring systems
    project_management:
    - jira_integration: Integration with Jira for task tracking
    - trello_integration: Integration with Trello for visual tracking
    - confluence_integration: Integration with Confluence for documentation
    - slack_integration: Integration with Slack for notifications
    version_control:
    - git_integration: Integration with Git for change tracking
    - branch_management: Automated branch creation and management
    - merge_tracking: Automated merge request tracking
    - tag_management: Automated version tagging
  tracking_configuration:
    change_categories:
    - approval_required: true
      description: Creation of new prompts
      documentation_required: true
      impact_level: medium
      name: prompt_creation
    - approval_required: true
      description: Modifications to existing prompts
      documentation_required: true
      impact_level: variable
      name: prompt_modification
    - approval_required: true
      description: Deprecation of prompts
      documentation_required: true
      impact_level: high
      name: prompt_deprecation
    - approval_required: true
      description: Version upgrades of prompts
      documentation_required: true
      impact_level: medium
      name: version_upgrade
    - approval_required: true
      description: Emergency fixes to prompts
      documentation_required: true
      impact_level: high
      name: emergency_fix
    - approval_required: true
      description: Updates to governance policies
      documentation_required: true
      impact_level: high
      name: governance_update
    change_severity:
      critical:
        approval_workflow: emergency_approval
        description: Changes affecting system stability or compliance
        notification_level: immediate
        rollback_required: true
      high:
        approval_workflow: full_approval
        description: Significant changes with broad impact
        notification_level: high_priority
        rollback_required: true
      low:
        approval_workflow: simplified_approval
        description: Minor changes with minimal impact
        notification_level: low
        rollback_required: false
      medium:
        approval_workflow: standard_approval
        description: Moderate changes with limited impact
        notification_level: standard
        rollback_required: false
  version: '1.0'

semantic_versioning:
  automation_tools:
    monitoring_automation:
    - Version performance monitoring
    - Automated compatibility checking
    - Issue tracking and alerting
    - Usage analytics and reporting
    release_automation:
    - Automated release pipelines
    - Version tag creation
    - Release note generation
    - Deployment automation
    version_management:
    - Automated version bumping tools
    - Semantic version calculators
    - Dependency version checking
    - Compatibility validation tools
  build_metadata:
    build_rules:
    - Build metadata ignored for version precedence
    - Used for build identification and debugging
    - Can contain dot-separated identifiers
    examples:
    - 1.0.0+20130313144700
    - 1.0.0-beta+exp.sha.5114f85
    format: MAJOR.MINOR.PATCH+BUILD
  compatibility_matrix:
    backward_compatibility:
      major_compatibility:
        description: Breaking changes, migration required
        examples:
        - 1.x.x not compatible with 2.x.x
        - 2.x.x not compatible with 3.x.x
        migration_required: mandatory
      minor_compatibility:
        description: Generally backward compatible
        examples:
        - 1.0.x compatible with 1.1.x
        - 1.1.x compatible with 1.2.x
        migration_required: optional
      patch_compatibility:
        description: Fully backward compatible
        examples:
        - 1.0.0 compatible with 1.0.1
        - 1.0.1 compatible with 1.0.2
        migration_required: false
    dependency_compatibility:
      engine_dependencies:
      - Template versions must match engine versions
      - Evaluation components compatible within major version
      - Governance components require exact version match
      integration_dependencies:
      - Cross-engine compatibility within same major version
      - API compatibility maintained within minor version
      - Data format compatibility within patch version
  component_versioning:
    evaluation_components:
      eval_sets: 1.0.0
      regression_tests: 1.0.0
      rubric: 1.0.0
      style_checks: 1.0.0
    governance_components:
      approval_workflow: 1.0.0
      change_history: 1.0.0
      ownership: 1.0.0
      semantic_versioning: 1.0.0
    prompt_engines:
      outreach_engine:
        components:
          feedback: 1.0.0
          rewriting: 1.0.0
          scoring: 1.0.0
          summarization: 1.0.0
          system_prompts: 1.0.0
        current_version: 1.0.0
        versioning_strategy: semantic
      resume_engine:
        components:
          feedback: 1.0.0
          rewriting: 1.0.0
          scoring: 1.0.0
          summarization: 1.0.0
          system_prompts: 1.0.0
        current_version: 1.0.0
        versioning_strategy: semantic
    template_components:
      outreach_templates: 1.0.0
      resume_templates: 1.0.0
  documentation_requirements:
    api_documentation:
      requirements:
      - Version-specific API documentation
      - Compatibility matrices
      - Migration guides between versions
      - Deprecation notices and timelines
    change_logs:
      format: Keep a Changelog (KCH) format
      sections:
      - 'Added: New features'
      - 'Changed: Changes in existing functionality'
      - 'Deprecated: Soon-to-be removed features'
      - 'Removed: Removed features'
      - 'Fixed: Bug fixes'
      - 'Security: Security improvements'
    release_notes:
      content:
      - Version summary and highlights
      - New features and improvements
      - Bug fixes and security updates
      - Known issues and limitations
      - Upgrade and migration instructions
  git_integration:
    branching_strategy:
      development_branch: develop
      feature_branches: feature/DESCRIPTION
      hotfix_branches: hotfix/VERSION
      main_branch: main
      release_branches: release/VERSION
    commit_conventions:
      conventional_commits:
        format: 'type(scope): description'
        types:
        - 'feat: New features (minor increment)'
        - 'fix: Bug fixes (patch increment)'
        - 'BREAKING CHANGE: Breaking changes (major increment)'
        - 'docs: Documentation changes (patch increment)'
        - 'style: Code style changes (patch increment)'
        - 'refactor: Code refactoring (patch increment)'
        - 'test: Test additions (patch increment)'
        - 'chore: Maintenance tasks (patch increment)'
    version_tags:
      examples:
      - v1.0.0
      - v1.1.0
      - v1.0.1
      format: vMAJOR.MINOR.PATCH
      tagging_rules:
      - Tag only final releases, not pre-releases
      - Annotated tags with release notes
      - Sign tags for security
  increment_rules:
    major_increment:
      conditions:
      - Breaking changes to prompt structure
      - Removal of existing prompt categories
      - Major governance policy changes
      - Incompatible API changes
      process:
      - Requires governance committee approval
      - Comprehensive impact assessment
      - Migration planning required
      - Extended testing period
    minor_increment:
      conditions:
      - New prompt categories added
      - New governance features
      - Enhanced functionality additions
      - New evaluation criteria
      process:
      - Requires technical lead approval
      - Standard testing procedures
      - Documentation updates
      - Stakeholder notification
    patch_increment:
      conditions:
      - Bug fixes and corrections
      - Documentation improvements
      - Performance optimizations
      - Minor text improvements
      process:
      - Requires prompt engineer approval
      - Focused testing on changes
      - Change log updates
      - Standard deployment
  last_updated: '2024-01-01T00:00:00Z'
  pre_release:
    format: MAJOR.MINOR.PATCH-PRERELEASE
    identifiers:
    - alpha: Internal testing, not feature-complete
    - beta: External testing, feature-complete
    - rc: Release candidate, final testing phase
    pre_release_rules:
    - Pre-release versions have lower precedence than final versions
    - Multiple pre-release identifiers separated by dots
    - Numeric identifiers have higher precedence than alphanumeric
  release_process:
    release_checklist:
      post_release:
      - Release validation completed
      - Performance monitoring initiated
      - User feedback collection started
      - Issue tracking activated
      - Success metrics measured
      pre_release:
      - Version compatibility assessment
      - Documentation updates completed
      - Test suites passing
      - Security review completed
      - Performance benchmarks met
      - Stakeholder approval obtained
      release:
      - Version tags created
      - Release notes published
      - Deployment procedures executed
      - Monitoring activated
      - Rollback procedures prepared
    release_types:
      major_release:
        approval_required: governance_committee
        frequency: Quarterly or as needed
        preparation_time: 4-6 weeks
        testing_period: 2-3 weeks
      minor_release:
        approval_required: technical_lead
        frequency: Monthly
        preparation_time: 2-3 weeks
        testing_period: 1 week
      patch_release:
        approval_required: prompt_engineer
        frequency: As needed (weekly if required)
        preparation_time: 1 week
        testing_period: 2-3 days
  version: '1.0'
  version_monitoring:
    tracking_metrics:
      adoption_metrics:
      - Version adoption rate
      - Migration success rate
      - Feature usage by version
      - Support tickets by version
      quality_metrics:
      - Bug discovery rate by version
      - Performance degradation by version
      - User satisfaction by version
      - Compliance issues by version
      release_metrics:
      - Release frequency and timing
      - Time between releases
      - Release success rate
      - Rollback frequency
  version_policies:
    deprecation_policy:
      deprecation_timeline:
      - 'Announcement: 6 months before deprecation'
      - 'Warning period: 3 months before end-of-life'
      - 'End-of-life: No further support or updates'
      - 'Archive: Documentation and code preserved'
      migration_support:
      - Migration guides provided
      - Support during transition period
      - Tools for version migration
      - Training for new versions
    support_policy:
      extended_support:
        availability: Enterprise agreements only
        description: Extended support for enterprise customers
        duration: 36 months
        support_level: Full maintenance support
      lts_support:
        description: Long-term support versions
        duration: 24 months
        selection_criteria: Major releases with high adoption
        support_level: Security patches and critical bug fixes
      standard_support:
        coverage: All minor and patch releases
        description: Standard support versions
        duration: 12 months
        support_level: All bug fixes and security patches
  version_scheme:
    description: Semantic versioning for prompt governance components
    format: MAJOR.MINOR.PATCH
    version_components:
      major:
        approval_required: governance_committee
        description: Incompatible API changes or major architectural changes
        impact_level: high
        increment_triggers:
        - Breaking changes to prompt structure
        - Major architectural redesign
        - Removal of deprecated features
        - Significant governance policy changes
      minor:
        approval_required: technical_lead
        description: New features in backward-compatible manner
        impact_level: medium
        increment_triggers:
        - New prompt categories or types
        - New governance features
        - Enhanced functionality additions
        - New evaluation criteria
      patch:
        approval_required: prompt_engineer
        description: Backward-compatible bug fixes and improvements
        impact_level: low
        increment_triggers:
        - Bug fixes and error corrections
        - Documentation improvements
        - Performance optimizations
        - Minor text improvements

# Phase 2 Multi-Model Integration Configuration

# Contextual Bandit Configuration
bandit:
  # LinUCB parameters
  context_dim: 50
  alpha: 1.0  # Exploration parameter
  decay_factor: 0.99  # Historical data decay
  
  # Initial arms (routing agents)
  initial_arms:
    - "code_reviewer"
    - "resume_writer" 
    - "data_analyst"
    - "writer"
    - "researcher"
  
  # Performance thresholds
  min_confidence: 0.3
  max_uncertainty: 0.7
  exploration_rate_min: 0.01
  exploration_rate_max: 0.1

# Ensemble Router Configuration
ensemble:
  # Ensemble strategy
  strategy: "weighted_voting"  # Options: weighted_voting, meta_learning, simple_voting
  
  # Base models
  base_models:
    - type: "intent_embedding"
      weight: 1.0
      enabled: true
    - type: "rule_based"
      weight: 0.8
      enabled: true
    - type: "confidence_monitor"
      weight: 0.6
      enabled: false  # Future implementation
  
  # Meta-learner parameters
  meta_learner:
    input_dim: 10
    hidden_dim: 20
    learning_rate: 0.01
    training_threshold: 100  # Minimum samples before training
  
  # Decision thresholds
  min_ensemble_confidence: 0.5
  max_ensemble_uncertainty: 0.6
  agent_agreement_threshold: 0.6

# Model Serving Configuration
serving:
  # API configuration
  host: "0.0.0.0"
  port: 8080
  workers: 4
  
  # Performance settings
  max_concurrent_requests: 100
  request_timeout: 30  # seconds
  cache_size: 1000
  
  # Load balancing
  load_balancer: "round_robin"  # Options: round_robin, weighted, least_connections
  
  # Monitoring
  enable_metrics: true
  metrics_port: 9090
  health_check_interval: 30  # seconds

# Feedback Pipeline Configuration
feedback:
  # Collection settings
  collection_enabled: true
  batch_size: 100
  flush_interval: 300  # seconds
  
  # Reward calculation
  reward_weights:
    task_completion: 0.6
    completion_time: 0.2
    user_satisfaction: 0.2
  
  # Time penalties
  max_completion_time: 300  # seconds (5 minutes)
  time_penalty_factor: 0.1
  
  # Update policies
  bandit_update_policy: "immediate"  # Options: immediate, batch, periodic
  ensemble_update_policy: "batch"
  batch_update_interval: 3600  # seconds (1 hour)

# Monitoring and Metrics
monitoring:
  # Calibration metrics
  enable_calibration_monitoring: true
  calibration_window: 1000  # samples
  ece_bins: 10
  
  # Performance metrics
  track_latency: true
  latency_buckets: [10, 50, 100, 200, 500, 1000]  # milliseconds
  
  # Business metrics
  track_success_rate: true
  track_user_satisfaction: true
  track_cost_efficiency: true
  
  # Alerting
  alert_thresholds:
    min_success_rate: 0.85
    max_latency_p95: 200  # milliseconds
    max_error_rate: 0.05
    min_calibration_score: 0.9

# Development and Testing
development:
  # Test settings
  test_data_size: 1000
  test_timeout: 30  # seconds
  
  # Mock services
  enable_mock_classifier: true
  enable_mock_bandit: true
  mock_reward_delay: 0.1  # seconds
  
  # Debug settings
  debug_logging: true
  trace_decisions: true
  save_decision_history: true

# Production Deployment
production:
  # Scaling
  auto_scaling: true
  min_instances: 2
  max_instances: 10
  scale_up_threshold: 80  # CPU percentage
  scale_down_threshold: 30
  
  # Reliability
  health_check_path: "/health"
  grace_period: 30  # seconds
  max_retries: 3
  
  # Security
  enable_authentication: true
  rate_limiting: true
  rate_limit: 100  # requests per minute
  
  # Backup and recovery
  backup_interval: 3600  # seconds (1 hour)
  state_retention: 7  # days
  disaster_recovery: true

# Feature Flags
features:
  # Phase 2 features
  contextual_bandit: true
  ensemble_router: true
  model_serving: true
  feedback_pipeline: true
  
  # Experimental features
  advanced_meta_learning: false
  dynamic_model_weights: false
  adaptive_exploration: false
  
  # Future Phase 3 features
  mixture_of_experts: false
  meta_learning_integration: false
  advanced_optimization: false

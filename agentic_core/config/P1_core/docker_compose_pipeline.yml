networks:
  pipeline_net:
    driver: bridge
    ipam:
      config:
      - subnet: 172.21.0.0/16
services:
  architect:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    command: python fix_structural_debt_llm.py
    container_name: agentic-architect
    depends_on:
      librarian:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
    - PHASE=A
    - SERVICE=architect
    - PYTHONUNBUFFERED=1
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - test -f /app/workspace/architect_complete.flag
      timeout: 5s
    image: agentic/architect:latest
    networks:
    - pipeline_net
    volumes:
    - ./01_agentic_core:/app/01_agentic_core:rw
    - ./02_apps:/app/02_apps:rw
    - ./03_runtime:/app/03_runtime:rw
    - ./04_tools:/app/04_tools:rw
    - ./05_data:/app/05_data:rw
    - ./06_data:/app/06_data:rw
    - ./07_config:/app/07_config:rw
    - ./08_scripts:/app/08_scripts:rw
    - ./09_tests:/app/09_tests:rw
    - ./10_docs:/app/10_docs:rw
    - ./11_examples:/app/11_examples:rw
    - ./12_integrations:/app/12_integrations:rw
    - ./13_monitoring:/app/13_monitoring:rw
    - ./14_archive:/app/14_archive:rw
    - ./15_experimental:/app/15_experimental:rw
    - ./16_legacy:/app/16_legacy:rw
    - ./17_runtime_servers:/app/17_runtime_servers:rw
    - ./18_runtime_agents:/app/18_runtime_agents:rw
    - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
    - workspace_data:/app/workspace
  librarian:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    command: python apps_rg/L0_maintenance/deduplicate_and_index.py
    container_name: agentic-librarian
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
    - PHASE=A
    - SERVICE=librarian
    - PYTHONUNBUFFERED=1
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - test -f /app/workspace/active_manifest.json
      timeout: 5s
    image: agentic/librarian:latest
    networks:
    - pipeline_net
    volumes:
    - ./01_agentic_core:/app/01_agentic_core:rw
    - ./02_apps:/app/02_apps:rw
    - ./03_runtime:/app/03_runtime:rw
    - ./04_tools:/app/04_tools:rw
    - ./05_data:/app/05_data:rw
    - ./06_data:/app/06_data:rw
    - ./07_config:/app/07_config:rw
    - ./08_scripts:/app/08_scripts:rw
    - ./09_tests:/app/09_tests:rw
    - ./10_docs:/app/10_docs:rw
    - ./11_examples:/app/11_examples:rw
    - ./12_integrations:/app/12_integrations:rw
    - ./13_monitoring:/app/13_monitoring:rw
    - ./14_archive:/app/14_archive:rw
    - ./15_experimental:/app/15_experimental:rw
    - ./16_legacy:/app/16_legacy:rw
    - ./17_runtime_servers:/app/17_runtime_servers:rw
    - ./18_runtime_agents:/app/18_runtime_agents:rw
    - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
    - workspace_data:/app/workspace
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: python orchestrator.py
    container_name: agentic-orchestrator
    depends_on:
      redis:
        condition: service_healthy
      surgeon:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    environment:
    - PHASE=B
    - SERVICE=orchestrator
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - PYTHONUNBUFFERED=1
    - LOG_LEVEL=INFO
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - python
      - -c
      - import requests; requests.get('http://localhost:8080/health')
      timeout: 5s
    image: agentic/orchestrator:latest
    networks:
    - pipeline_net
    ports:
    - 8080:8080
    restart: unless-stopped
    volumes:
    - ./01_agentic_core:/app/01_agentic_core:rw
    - ./02_apps:/app/02_apps:rw
    - ./03_runtime:/app/03_runtime:rw
    - ./04_tools:/app/04_tools:rw
    - ./05_data:/app/05_data:rw
    - ./06_data:/app/06_data:rw
    - ./07_config:/app/07_config:rw
    - ./08_scripts:/app/08_scripts:rw
    - ./09_tests:/app/09_tests:rw
    - ./10_docs:/app/10_docs:rw
    - ./11_examples:/app/11_examples:rw
    - ./12_integrations:/app/12_integrations:rw
    - ./13_monitoring:/app/13_monitoring:rw
    - ./14_archive:/app/14_archive:rw
    - ./15_experimental:/app/15_experimental:rw
    - ./16_legacy:/app/16_legacy:rw
    - ./17_runtime_servers:/app/17_runtime_servers:rw
    - ./18_runtime_agents:/app/18_runtime_agents:rw
    - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
    - workspace_data:/app/workspace
    - ./logs:/app/logs:rw
  redis:
    command: 'redis-server  --appendonly yes --save 900 1 --save 300 10 --save 60
      10000 --maxmemory 512mb --maxmemory-policy allkeys-lru

      '
    container_name: pipeline-redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      timeout: 3s
    image: redis:7.2-alpine
    networks:
    - pipeline_net
    volumes:
    - redis_data:/data
  surgeon:
    build:
      context: .
      dockerfile: Dockerfile.sanitizer
    command: python fix_syntax_llm.py
    container_name: agentic-surgeon
    depends_on:
      architect:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
    - PHASE=A
    - SERVICE=surgeon
    - PYTHONUNBUFFERED=1
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - test -f /app/workspace/surgeon_complete.flag
      timeout: 5s
    image: agentic/surgeon:latest
    networks:
    - pipeline_net
    volumes:
    - ./01_agentic_core:/app/01_agentic_core:rw
    - ./02_apps:/app/02_apps:rw
    - ./03_runtime:/app/03_runtime:rw
    - ./04_tools:/app/04_tools:rw
    - ./05_data:/app/05_data:rw
    - ./06_data:/app/06_data:rw
    - ./07_config:/app/07_config:rw
    - ./08_scripts:/app/08_scripts:rw
    - ./09_tests:/app/09_tests:rw
    - ./10_docs:/app/10_docs:rw
    - ./11_examples:/app/11_examples:rw
    - ./12_integrations:/app/12_integrations:rw
    - ./13_monitoring:/app/13_monitoring:rw
    - ./14_archive:/app/14_archive:rw
    - ./15_experimental:/app/15_experimental:rw
    - ./16_legacy:/app/16_legacy:rw
    - ./17_runtime_servers:/app/17_runtime_servers:rw
    - ./18_runtime_agents:/app/18_runtime_agents:rw
    - ./19_runtime_pipeline:/app/19_runtime_pipeline:rw
    - workspace_data:/app/workspace
version: '3.8'
volumes:
  redis_data:
    driver: local
  workspace_data:
    driver: local

networks:
  subatomic-net:
    driver: bridge
services:
  agentic-app:
    build:
      context: .
      dockerfile: Dockerfile
    command: tail -f /dev/null
    container_name: subatomic-core
    depends_on:
      agentic-redis:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    environment:
    - REDIS_HOST=agentic-redis
    - REDIS_PORT=6379
    - REDIS_URL=redis://agentic-redis:6379/0
    - VECTOR_DB_URL=http://vector-db:6333
    - QDRANT_URL=http://vector-db:6333
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    - PINECONE_API_KEY=${PINECONE_API_KEY}
    - MISTRALAI_API_KEY=${MISTRALAI_API_KEY}
    - COHERE_API_KEY=${COHERE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
    - FIGMA_API_KEY=${FIGMA_API_KEY}
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    - PYTHONUNBUFFERED=1
    - LOG_LEVEL=INFO
    networks:
    - subatomic-net
    ports:
    - 8000:8000
    - 8501:8501
    restart: unless-stopped
    volumes:
    - ./data:/app/data
    - ./config:/app/config
    - ./scripts:/app/scripts
    - ./logs:/app/logs
    - .:/app/workspace
  agentic-redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    container_name: agentic-redis
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      interval: 5s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis/redis-stack:latest
    networks:
    - subatomic-net
    ports:
    - 6379:6379
    - 8001:8001
    volumes:
    - redis_data:/data
  jaeger:
    container_name: subatomic-jaeger
    environment:
    - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    image: jaegertracing/all-in-one:1.53
    networks:
    - subatomic-net
    ports:
    - 16686:16686
    - 4317:4317
  mcp-fetch:
    command: npx -y mcp-server-fetch
    container_name: mcp_fetch
    image: node:18-alpine
    networks:
    - subatomic-net
  mcp-figma:
    command: npx -y @modelcontextprotocol/server-figma
    container_name: mcp_figma
    env_file: .env
    image: node:18-alpine
    networks:
    - subatomic-net
  mcp-filesystem:
    command: npx -y @modelcontextprotocol/server-filesystem /projects/workspace
    container_name: mcp_filesystem
    image: node:18-alpine
    networks:
    - subatomic-net
    volumes:
    - .:/projects/workspace
  mcp-gitkraken:
    command: echo "GitKraken MCP placeholder"
    container_name: mcp_gitkraken
    env_file: .env
    image: node:18-alpine
    networks:
    - subatomic-net
  mcp-memory:
    command: npx -y @modelcontextprotocol/server-memory
    container_name: mcp_memory
    image: node:18-alpine
    networks:
    - subatomic-net
    volumes:
    - mem_data:/app/.memory
  mcp-pinecone:
    command: npx -y @pinecone-database/mcp
    container_name: mcp_pinecone
    env_file: .env
    image: node:18-alpine
    networks:
    - subatomic-net
  mcp-playwright:
    command: npx -y @playwright/mcp@latest --headless --browser chromium --no-sandbox
    container_name: mcp_playwright
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    networks:
    - subatomic-net
    shm_size: 2gb
  mcp-sendemail:
    command: echo "Send Email MCP placeholder"
    container_name: mcp_sendemail
    image: node:18-alpine
    networks:
    - subatomic-net
  mcp-time:
    command: pip install mcp-server-time && python -m mcp_server_time --host 0.0.0.0
    container_name: mcp_time
    image: python:3.11-slim
    networks:
    - subatomic-net
  vector-db:
    container_name: subatomic-qdrant
    environment:
    - QDRANT__SERVICE__ENABLE_GRPC=true
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s
      test:
      - CMD-SHELL
      - timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      timeout: 5s
    image: qdrant/qdrant:v1.7.3
    networks:
    - subatomic-net
    ports:
    - 6333:6333
    - 6334:6334
    volumes:
    - qdrant_data:/qdrant/storage
version: '3.8'
volumes:
  mem_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

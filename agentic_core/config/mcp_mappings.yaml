defaults:
- args:
  - -y
  - '@modelcontextprotocol/server-filesystem'
  - ./
  command: npx
  description: Local filesystem access for reading/writing files
  server: filesystem
- args:
  - -y
  - '@modelcontextprotocol/server-memory'
  command: npx
  description: Persistent memory storage for agent context
  server: memory
env_templates:
  BRAVE_API_KEY: Required for Brave Search access
  DATABASE_URL: PostgreSQL connection string
  DEEPWIKI_PRIVATE_KEY: Required for private DeepWiki repository access
  GITHUB_TOKEN: Required for GitHub API access
  PYTHONPATH: Python path for MCP servers
roles:
  CODER:
  - args:
    - servers/telemetry_server.py
    command: python
    description: Telemetry for self-correction and debugging
    env:
      PYTHONPATH: .
    server: telemetry
  - args:
    - -y
    - '@modelcontextprotocol/server-github'
    command: npx
    description: GitHub repository access and operations
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    server: github
  - args:
    - -y
    - '@modelcontextprotocol/server-git'
    command: npx
    description: Local git operations
    server: git
  CONTEXT_GATHERER:
  - args:
    - -y
    - '@modelcontextprotocol/server-github'
    command: npx
    description: Scan repositories for code context
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    server: github
  - args:
    - -y
    - '@modelcontextprotocol/server-fetch'
    command: npx
    description: Scrape company websites for context
    server: fetch
  DATA_ANALYST:
  - args:
    - -y
    - '@modelcontextprotocol/server-postgres'
    - postgresql://localhost/mydb
    command: npx
    description: PostgreSQL database access
    env:
      DATABASE_URL: ${DATABASE_URL}
    server: postgres
  - args:
    - -y
    - '@modelcontextprotocol/server-sqlite'
    - ./data/analytics.db
    command: npx
    description: SQLite database for local analytics
    server: sqlite
  DEBUGGER:
  - args:
    - servers/telemetry_server.py
    command: python
    description: Telemetry and introspection tools for debugging
    env:
      PYTHONPATH: .
    server: telemetry
  - args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ./
    command: npx
    description: File system access
    server: filesystem
  K25_DEEP_RESEARCHER:
  - args:
    - -y
    - '@modelcontextprotocol/server-brave-search'
    command: npx
    description: Deep web research capabilities
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    server: brave-search
  - args:
    - -y
    - '@modelcontextprotocol/server-fetch'
    command: npx
    description: Navigate to 10-K filings and technical docs
    server: fetch
  - args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ./research_cache
    command: npx
    description: Save research notes for citation
    server: filesystem
  MANAGER:
  - args:
    - servers/telemetry_server.py
    command: python
    description: Telemetry and performance monitoring
    env:
      PYTHONPATH: .
    server: telemetry
  - args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ./
    command: npx
    description: File system access
    server: filesystem
  PROTOCOL_ENFORCER:
  - args:
    - -y
    - '@modelcontextprotocol/server-postgres'
    command: npx
    description: Check interaction history in database
    env:
      DATABASE_URL: ${DATABASE_URL}
    server: postgres
  QUALITY_CRITIC:
  - args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ./
    command: npx
    description: Read generated files for validation
    server: filesystem
  RESEARCHER:
  - args:
    - -y
    - '@modelcontextprotocol/server-brave-search'
    command: npx
    description: Web search capabilities via Brave Search API
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    server: brave-search
  - args:
    - -y
    - '@modelcontextprotocol/server-fetch'
    command: npx
    description: HTTP fetch for retrieving web content
    server: fetch
  REVIEWER:
  - args:
    - servers/telemetry_server.py
    command: python
    description: Quality metrics and performance data
    env:
      PYTHONPATH: .
    server: telemetry
  - args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ./
    command: npx
    description: Read generated files for validation
    server: filesystem
  apps_rg:
  - args:
    - -m
    - mcp_deepwiki
    - --url
    - https://mcp.deepwiki.com/sse
    - --private-token
    - ${DEEPWIKI_PRIVATE_KEY}
    command: python
    description: Private repository documentation access
    env:
      DEEPWIKI_PRIVATE_KEY: ${DEEPWIKI_PRIVATE_KEY}
    server: deepwiki
  validator:
  - args:
    - -m
    - mcp_deepwiki
    - --url
    - https://mcp.deepwiki.com/sse
    command: python
    description: Repository documentation access for canon validation
    server: deepwiki

backfill:
  load_batch_size: 500
  max_chunk_size: 2000
  max_concurrent_files: 10
  transform_batch_size: 100
continuous:
  cleanup_interval_hours: 24
  failure_retention_days: 90
  flush_interval_seconds: 30
  ingestion_batch_size: 50
logging:
  backup_count: 5
  file: backfill.log
  level: INFO
  max_size_mb: 100
metadata:
  default_agent_name: BackfillPipeline
  default_project_tag: historical
  environment: production
  region: us-west-2
  tags:
  - backfill
  - historical
  - batch_load
qdrant:
  host: localhost
  index_name: canon-l2
  port: 6333
sources:
  git_repos:
  - branch: main
    path: /path/to/your/repo
  - branch: develop
    path: /path/to/another/repo
  local_paths:
  - path: /path/to/source/code
  - path: /path/to/legacy/code
  s3_buckets:
  - bucket: my-code-bucket
    prefix: python/
  - bucket: archives-bucket
    prefix: historical/
targets:
  max_ingestion_latency_ms: 100
  min_chunks_per_second: 10

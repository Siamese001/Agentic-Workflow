[pytest]
# Pytest configuration for SSOT enforcement tests
# This overrides the global pyproject.toml settings for scripts/ directory tests

minversion = 7.0

# SSOT-specific coverage settings
# Only measure coverage of SSOT-related modules, not entire agentic_core
addopts =
    --cov=scripts.dashboard_ssot_definitions
    --cov=scripts.generate_dashboard_ssot
    --cov=scripts.test_ssot_enforcement
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:coverage_html_ssot
    --cov-fail-under=80
    -ra
    -v

# Test discovery for scripts directory
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for SSOT tests
markers =
    ssot: SSOT enforcement and validation tests
    generator: YAML generator tests
    integrity: Data integrity tests

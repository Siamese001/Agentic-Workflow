# L5 Agentic Core - Signal Weights Configuration
# YAML configuration for signal weighting with L5 safety constraints

signal_weights:
  user_input:
    base_weight: 0.8
    priority_multiplier: 1.5
    decay_rate: 0.1
    max_weight: 1.0
    min_weight: 0.1
    
  system_event:
    base_weight: 0.6
    priority_multiplier: 1.2
    decay_rate: 0.05
    max_weight: 0.9
    min_weight: 0.1
    
  feedback:
    base_weight: 0.4
    priority_multiplier: 1.0
    decay_rate: 0.2
    max_weight: 0.8
    min_weight: 0.05
    
  error:
    base_weight: 0.9
    priority_multiplier: 2.0
    decay_rate: 0.01
    max_weight: 1.0
    min_weight: 0.5
    
  safety:
    base_weight: 1.0
    priority_multiplier: 3.0
    decay_rate: 0.0
    max_weight: 1.0
    min_weight: 0.8
    
  performance:
    base_weight: 0.2
    priority_multiplier: 0.8
    decay_rate: 0.3
    max_weight: 0.6
    min_weight: 0.05

priority_weights:
  critical: 1.0
  high: 0.8
  medium: 0.6
  low: 0.4
  info: 0.2

weight_adjustments:
  temporal_decay:
    enabled: true
    half_life_hours: 24
    min_weight_threshold: 0.05
    
  frequency_penalty:
    enabled: true
    penalty_rate: 0.1
    max_penalty: 0.5
    
  confidence_boost:
    enabled: true
    boost_factor: 0.2
    min_confidence: 0.7

safety_policies:
  fail_closed: true
  max_signal_weight: 1.0
  require_validation: true
  audit_weight_changes: true

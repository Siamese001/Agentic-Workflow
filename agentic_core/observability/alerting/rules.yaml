# Proactive Alerting Rules for Sovereign System Health

# Healing Invocation Alerts
alerts:
  - name: low_healing_invocation
    description: "Healing invocation ratio below acceptable threshold"
    condition: "invocation_ratio < 80"
    severity: "warning"
    action: "log_alert"
    message: "Healing invocation below 80% - system may have dormant agents"
    
  - name: critical_healing_invocation
    description: "Healing invocation critically low"
    condition: "invocation_ratio < 50"
    severity: "critical"
    action: "trigger_diagnostic"
    message: "Critical: Healing invocation below 50% - immediate investigation required"
  
  # Entropy Alerts
  - name: entropy_drop
    description: "System entropy below threshold indicating layer imbalance"
    condition: "system_entropy < 2.5"
    severity: "warning"
    action: "trigger_coverage_optimization"
    message: "Layer activation entropy dropped - potential imbalance detected"
  
  - name: entropy_critical
    description: "System entropy critically low"
    condition: "system_entropy < 1.5"
    severity: "critical"
    action: "trigger_emergency_rebalance"
    message: "Critical entropy drop - emergency layer rebalancing initiated"
  
  # Chain Depth Alerts
  - name: shallow_chain_depth
    description: "Healing chain depth below expected"
    condition: "healing_chain_depth < 2"
    severity: "warning"
    action: "log_alert"
    message: "Healing chain depth shallow - parent chain may not be fully activated"
  
  # Cycle Detection Alerts
  - name: excessive_cycles
    description: "Excessive cycle detections in healing chain"
    condition: "cycle_detections_total > 10"
    severity: "warning"
    action: "log_alert"
    message: "Excessive cycle detections - possible infinite loop risk"
  
  # Depth Limit Alerts
  - name: depth_limits_hit
    description: "Depth limits being hit in healing chain"
    condition: "depth_limit_hits_total > 5"
    severity: "warning"
    action: "log_alert"
    message: "Depth limits hit - healing chain may be truncated"
  
  # Agent-Specific Alerts
  - name: agent_healing_failure
    description: "Agent healing operations failing"
    condition: "healing_failures_total > healing_successes_total"
    severity: "critical"
    action: "trigger_agent_diagnostic"
    message: "Agent healing failures exceed successes - investigate agent health"
  
  # Health Score Alerts
  - name: health_score_degradation
    description: "Overall health score degrading"
    condition: "health_score < 80"
    severity: "warning"
    action: "log_alert"
    message: "Health score below 80% - system quality degrading"
  
  - name: health_score_critical
    description: "Overall health score critically low"
    condition: "health_score < 60"
    severity: "critical"
    action: "trigger_full_diagnostic"
    message: "Critical health score - full system diagnostic required"

# Alert Actions
actions:
  log_alert:
    description: "Log alert to structured logs"
    implementation: "structured_logger.critical(message)"
  
  trigger_diagnostic:
    description: "Trigger system diagnostic"
    implementation: "DiagnosticAgent.run_diagnostic()"
  
  trigger_coverage_optimization:
    description: "Trigger coverage optimization"
    implementation: "CoverageAgent.optimize_layer_activation()"
  
  trigger_emergency_rebalance:
    description: "Trigger emergency layer rebalancing"
    implementation: "CoverageAgent.emergency_rebalance()"
  
  trigger_agent_diagnostic:
    description: "Trigger agent-specific diagnostic"
    implementation: "AutonomyGuardianAgent.diagnose_agent(agent_name)"
  
  trigger_full_diagnostic:
    description: "Trigger full system diagnostic"
    implementation: "ComplianceOrchestrator.run_full_compliance()"

# Alert Thresholds (configurable)
thresholds:
  healing_invocation_warning: 80
  healing_invocation_critical: 50
  entropy_warning: 2.5
  entropy_critical: 1.5
  chain_depth_minimum: 2
  cycle_detection_threshold: 10
  depth_limit_threshold: 5
  health_score_warning: 80
  health_score_critical: 60

# Alert Routing
routing:
  warning:
    - structured_logs
    - metrics_export
  
  critical:
    - structured_logs
    - metrics_export
    - trigger_action
    - notify_operators

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Test Page</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .pass { color: #4ec9b0; }
        .fail { color: #f48771; }
        .section { margin: 20px 0; padding: 15px; background: #252526; border-radius: 4px; }
        h2 { color: #569cd6; }
        pre { background: #1e1e1e; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Dashboard Module Test</h1>
    <div id="results"></div>

    <!-- Load all modules in order -->
    <script src="data/dashboard_data.js"></script>
    <script src="data/agent_data.js"></script>
    <script src="data/recommendations.js"></script>
    <script src="data/observations.js"></script>
    
    <script src="js/utils/random-utils.js"></script>
    <script src="js/utils/color-utils.js"></script>
    <script src="js/utils/math-utils.js"></script>
    <script src="js/utils/format-utils.js"></script>
    
    <script src="js/renderers/modal-renderer.js"></script>
    <script src="js/renderers/table-renderer.js"></script>
    <script src="js/renderers/kpi-renderer.js"></script>
    <script src="js/renderers/content-renderer.js"></script>

    <script>
        const results = document.getElementById('results');
        let html = '';
        
        function test(name, condition, details = '') {
            const status = condition ? '<span class="pass">✓ PASS</span>' : '<span class="fail">✗ FAIL</span>';
            html += `<div>${status} ${name}${details ? ' - ' + details : ''}</div>`;
        }
        
        html += '<div class="section"><h2>1. Data Files</h2>';
        test('window.dashboardData exists', typeof window.dashboardData !== 'undefined', window.dashboardData ? window.dashboardData.length + ' rows' : 'missing');
        test('window.realAgentData exists', typeof window.realAgentData !== 'undefined', window.realAgentData ? Object.keys(window.realAgentData).length + ' territories' : 'missing');
        test('window.recommendationsData exists', typeof window.recommendationsData !== 'undefined', window.recommendationsData ? window.recommendationsData.length + ' items' : 'missing');
        test('window.strategicObservationsData exists', typeof window.strategicObservationsData !== 'undefined');
        html += '</div>';
        
        html += '<div class="section"><h2>2. Utility Functions</h2>';
        test('hashString', typeof hashString === 'function');
        test('mulberry32', typeof mulberry32 === 'function');
        test('createSeededRandom', typeof createSeededRandom === 'function');
        test('getColor', typeof getColor === 'function');
        test('getWorstCaseColor', typeof getWorstCaseColor === 'function');
        test('computeDistributionStats', typeof computeDistributionStats === 'function');
        test('countOutliers', typeof countOutliers === 'function');
        test('formatOutlierBadge', typeof formatOutlierBadge === 'function');
        test('generateSparkline', typeof generateSparkline === 'function');
        html += '</div>';
        
        html += '<div class="section"><h2>3. Renderer Functions</h2>';
        test('renderTerritorySummaryTable', typeof renderTerritorySummaryTable === 'function');
        test('renderCodeQualityTable', typeof renderCodeQualityTable === 'function');
        test('openDrillModal', typeof openDrillModal === 'function');
        test('formatProblemAgentsTooltip', typeof formatProblemAgentsTooltip === 'function');
        test('initializeSemanticMetrics', typeof initializeSemanticMetrics === 'function');
        test('initializeRuntimeMonitoring', typeof initializeRuntimeMonitoring === 'function');
        test('renderStrategicObservations', typeof renderStrategicObservations === 'function');
        test('renderRecommendations', typeof renderRecommendations === 'function');
        test('renderInterviewQuestions', typeof renderInterviewQuestions === 'function');
        html += '</div>';
        
        html += '<div class="section"><h2>4. Function Execution Tests</h2>';
        
        // Test utility function execution
        try {
            const rand = createSeededRandom('test');
            const val = rand();
            test('createSeededRandom executes', val >= 0 && val <= 1, 'returns ' + val.toFixed(4));
        } catch (e) {
            test('createSeededRandom executes', false, e.message);
        }
        
        try {
            const color = getColor(75);
            test('getColor executes', typeof color === 'string', 'returns ' + color);
        } catch (e) {
            test('getColor executes', false, e.message);
        }
        
        try {
            const stats = computeDistributionStats([50, 60, 70, 80, 90]);
            test('computeDistributionStats executes', stats.avg === 70, 'avg=' + stats.avg);
        } catch (e) {
            test('computeDistributionStats executes', false, e.message);
        }
        
        html += '</div>';
        
        html += '<div class="section"><h2>5. Data Validation</h2>';
        if (window.dashboardData) {
            const totalRow = window.dashboardData.find(r => r.Territory === 'TOTAL');
            test('TOTAL row exists', !!totalRow);
            if (totalRow) {
                test('TOTAL has Total field', typeof totalRow.Total === 'number', totalRow.Total);
                test('TOTAL has Health field', typeof totalRow.Health === 'number', totalRow.Health.toFixed(1) + '%');
            }
        }
        html += '</div>';
        
        // Summary
        const passCount = (html.match(/class="pass"/g) || []).length;
        const failCount = (html.match(/class="fail"/g) || []).length;
        const total = passCount + failCount;
        
        html = `<div class="section"><h2>Test Summary</h2>
            <div style="font-size: 1.2em; margin: 10px 0;">
                <span class="pass">${passCount} passed</span> / 
                <span class="${failCount > 0 ? 'fail' : 'pass'}">${failCount} failed</span> / 
                ${total} total
            </div>
        </div>` + html;
        
        results.innerHTML = html;
        
        // Log to console
        console.log('=== DASHBOARD MODULE TEST ===');
        console.log('Passed:', passCount);
        console.log('Failed:', failCount);
        console.log('Total:', total);
    </script>
</body>
</html>

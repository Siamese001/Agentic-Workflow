<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Console Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        .info { color: #9cdcfe; }
        pre { background: #252526; padding: 10px; border-radius: 4px; overflow-x: auto; }
        h2 { color: #569cd6; }
        .status { padding: 10px; margin: 10px 0; border-left: 4px solid; }
        .status.ok { border-color: #4ec9b0; background: #1a2f2a; }
        .status.fail { border-color: #f48771; background: #2f1a1a; }
    </style>
</head>
<body>
    <h1>Dashboard Loading Diagnostics</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = msg;
            output.appendChild(div);
        }
        
        function status(msg, ok) {
            const div = document.createElement('div');
            div.className = `status ${ok ? 'ok' : 'fail'}`;
            div.textContent = (ok ? '✓ ' : '✗ ') + msg;
            output.appendChild(div);
        }
        
        async function testDashboard() {
            log('='.repeat(80), 'info');
            log('DASHBOARD LOADING TEST', 'info');
            log('='.repeat(80), 'info');
            
            // Test 1: Can we reach the server?
            try {
                const serverTest = await fetch('http://localhost:8080/');
                status(`Server reachable (HTTP ${serverTest.status})`, serverTest.ok);
            } catch (e) {
                status(`Server NOT reachable: ${e.message}`, false);
                log('Start server: python agentic_core/L6_observability/dashboards/serve_dashboard.py', 'warning');
                return;
            }
            
            // Test 2: Can we load Plotly?
            try {
                const plotlyTest = await fetch('http://localhost:8080/plotly.min.js');
                const size = plotlyTest.headers.get('content-length');
                status(`Plotly.js accessible (${(size/1024/1024).toFixed(1)}MB)`, plotlyTest.ok);
            } catch (e) {
                status(`Plotly.js NOT accessible: ${e.message}`, false);
            }
            
            // Test 3: Can we load dashboard HTML?
            try {
                const dashTest = await fetch('http://localhost:8080/autonomy_dashboard.html');
                status(`Dashboard HTML accessible (${dashTest.status})`, dashTest.ok);
            } catch (e) {
                status(`Dashboard HTML NOT accessible: ${e.message}`, false);
            }
            
            // Test 4: Load dashboard in iframe and check for errors
            log('\n--- Loading Dashboard in iframe ---', 'info');
            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:8080/autonomy_dashboard.html';
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '2px solid #569cd6';
            iframe.style.marginTop = '20px';
            
            const errors = [];
            const logs = [];
            
            iframe.onload = function() {
                try {
                    const iframeWin = iframe.contentWindow;
                    
                    // Intercept console errors
                    const originalError = iframeWin.console.error;
                    iframeWin.console.error = function(...args) {
                        errors.push(args.join(' '));
                        originalError.apply(iframeWin.console, args);
                    };
                    
                    const originalLog = iframeWin.console.log;
                    iframeWin.console.log = function(...args) {
                        logs.push(args.join(' '));
                        originalLog.apply(iframeWin.console, args);
                    };
                    
                    // Check after 3 seconds
                    setTimeout(() => {
                        log('\n--- Dashboard Status After 3s ---', 'info');
                        
                        if (typeof iframeWin.Plotly !== 'undefined') {
                            status('Plotly loaded successfully', true);
                            log(`Plotly version: ${iframeWin.Plotly.version || 'unknown'}`, 'success');
                        } else {
                            status('Plotly NOT loaded', false);
                        }
                        
                        if (errors.length > 0) {
                            log('\n--- JavaScript Errors ---', 'error');
                            errors.forEach(err => log(err, 'error'));
                        } else {
                            status('No JavaScript errors', true);
                        }
                        
                        if (logs.length > 0) {
                            log('\n--- Console Logs ---', 'info');
                            logs.slice(0, 10).forEach(l => log(l, 'info'));
                        }
                        
                        // Check for charts
                        const iframeDoc = iframeWin.document;
                        const riskMatrix = iframeDoc.getElementById('riskMatrix');
                        const healthChart = iframeDoc.getElementById('healthChart');
                        
                        if (riskMatrix && riskMatrix.innerHTML.trim()) {
                            status('Risk Matrix rendered', true);
                        } else {
                            status('Risk Matrix NOT rendered', false);
                        }
                        
                        if (healthChart && healthChart.innerHTML.trim()) {
                            status('Health Chart rendered', true);
                        } else {
                            status('Health Chart NOT rendered', false);
                        }
                        
                        log('\n='.repeat(80), 'info');
                        log('DIAGNOSTICS COMPLETE', 'info');
                        log('='.repeat(80), 'info');
                    }, 3000);
                    
                } catch (e) {
                    status(`Cannot access iframe content: ${e.message}`, false);
                    log('This is normal for file:// protocol - use http://localhost:8080', 'warning');
                }
            };
            
            iframe.onerror = function(e) {
                status('Dashboard failed to load in iframe', false);
            };
            
            document.body.appendChild(iframe);
        }
        
        testDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard Loading</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .log { padding: 5px; margin: 2px 0; border-left: 3px solid #555; }
        .error { border-left-color: #f48771; background: #3a1e1e; }
        .success { border-left-color: #4ec9b0; background: #0d3a2e; }
        .info { border-left-color: #569cd6; background: #1e2a3a; }
        pre { background: #2d2d2d; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Dashboard Loading Debug</h1>
    <div id="logs"></div>
    
    <script>
        const logs = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ timestamp, message, type });
            updateDisplay();
            console.log(`[${timestamp}] ${message}`);
        }
        
        function updateDisplay() {
            const html = logs.map(l => 
                `<div class="log ${l.type}">[${l.timestamp}] ${l.message}</div>`
            ).join('');
            document.getElementById('logs').innerHTML = html;
        }
        
        log('Starting dashboard load test...', 'info');
        
        // Load the actual dashboard
        fetch('autonomy_dashboard.html')
            .then(r => r.text())
            .then(html => {
                log('✓ Dashboard HTML loaded', 'success');
                
                // Create iframe to load dashboard
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '600px';
                iframe.style.border = '2px solid #569cd6';
                iframe.style.marginTop = '20px';
                
                iframe.onload = function() {
                    log('✓ Dashboard iframe loaded', 'success');
                    
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        const iframeWin = iframe.contentWindow;
                        
                        // Check if data is defined
                        setTimeout(() => {
                            try {
                                if (typeof iframeWin.dashboardData !== 'undefined') {
                                    log(`✓ dashboardData defined: ${iframeWin.dashboardData.length} items`, 'success');
                                } else {
                                    log('✗ dashboardData NOT defined', 'error');
                                }
                                
                                if (typeof iframeWin.recommendationsData !== 'undefined') {
                                    log(`✓ recommendationsData defined: ${iframeWin.recommendationsData.length} items`, 'success');
                                } else {
                                    log('✗ recommendationsData NOT defined', 'error');
                                }
                                
                                // Check if elements are populated
                                const kpiGrid = iframeDoc.getElementById('kpiGrid');
                                if (kpiGrid) {
                                    if (kpiGrid.innerHTML.trim().length > 0) {
                                        log(`✓ kpiGrid populated: ${kpiGrid.innerHTML.length} chars`, 'success');
                                    } else {
                                        log('✗ kpiGrid is EMPTY', 'error');
                                        log('Attempting to manually call loadData()...', 'info');
                                        
                                        if (typeof iframeWin.loadData === 'function') {
                                            iframeWin.loadData();
                                            log('✓ loadData() called manually', 'success');
                                            
                                            setTimeout(() => {
                                                if (kpiGrid.innerHTML.trim().length > 0) {
                                                    log(`✓ kpiGrid NOW populated: ${kpiGrid.innerHTML.length} chars`, 'success');
                                                } else {
                                                    log('✗ kpiGrid STILL empty after loadData()', 'error');
                                                    
                                                    // Check console errors
                                                    log('Check browser console for JavaScript errors', 'error');
                                                }
                                            }, 500);
                                        } else {
                                            log('✗ loadData() function NOT defined', 'error');
                                        }
                                    }
                                } else {
                                    log('✗ kpiGrid element NOT found', 'error');
                                }
                                
                                // Check for JavaScript errors
                                const scripts = iframeDoc.querySelectorAll('script');
                                log(`Found ${scripts.length} script tags`, 'info');
                                
                            } catch (e) {
                                log(`✗ Error checking iframe: ${e.message}`, 'error');
                            }
                        }, 1000);
                        
                    } catch (e) {
                        log(`✗ Cannot access iframe content: ${e.message}`, 'error');
                    }
                };
                
                iframe.onerror = function(e) {
                    log(`✗ Iframe load error: ${e}`, 'error');
                };
                
                iframe.srcdoc = html;
                document.body.appendChild(iframe);
                
            })
            .catch(err => {
                log(`✗ Failed to load dashboard: ${err.message}`, 'error');
            });
    </script>
</body>
</html>

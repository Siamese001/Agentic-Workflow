<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Diagnostic</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
        pre { background: #000; padding: 10px; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <h1>Dashboard Diagnostic Tool</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        const log = (msg, type = 'success') => {
            output.innerHTML += `<div class="${type}">${msg}</div>`;
        };

        // Capture console errors
        window.onerror = function(msg, url, line, col, error) {
            log(`❌ ERROR: ${msg} at ${url}:${line}:${col}`, 'error');
            return false;
        };

        log('=== LOADING DASHBOARD FILES ===');
        
        // Load files in order
        const scripts = [
            'config/config.js',
            'data/dashboard_data.js',
            'data/agent_data.js',
            'data/observations.js',
            'data/recommendations.js',
            'js/utils/color-utils.js',
            'js/utils/stat-utils.js',
            'js/renderers/modal-renderer.js',
            'js/renderers/table-renderer.js',
            'js/renderers/kpi-renderer.js',
            'js/renderers/content-renderer.js',
            'js/main.js'
        ];

        let loaded = 0;
        scripts.forEach(src => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => {
                loaded++;
                log(`✅ Loaded: ${src}`);
                
                if (loaded === scripts.length) {
                    setTimeout(() => {
                        log('\n=== CHECKING GLOBAL VARIABLES ===');
                        log(`dashboardData: ${typeof window.dashboardData} (${window.dashboardData ? window.dashboardData.length + ' rows' : 'undefined'})`);
                        log(`realAgentData: ${typeof window.realAgentData}`);
                        
                        log('\n=== CHECKING FUNCTIONS ===');
                        log(`renderTerritorySummaryTable: ${typeof window.renderTerritorySummaryTable}`);
                        log(`renderCodeQualityTable: ${typeof window.renderCodeQualityTable}`);
                        log(`loadData: ${typeof window.loadData}`);
                        
                        log('\n=== CHECKING TABLE CONTAINERS ===');
                        const kpiGrid = document.getElementById('kpiGrid');
                        const codeQualityGrid = document.getElementById('codeQualityGrid');
                        log(`#kpiGrid exists: ${!!kpiGrid}`);
                        log(`#codeQualityGrid exists: ${!!codeQualityGrid}`);
                        
                        if (window.dashboardData && window.dashboardData.length > 0) {
                            log('\n=== CHECKING TOTAL ROW ===');
                            const totalRow = window.dashboardData.find(r => r.Territory === 'TOTAL');
                            if (totalRow) {
                                log(`✅ TOTAL row found in data at index ${window.dashboardData.indexOf(totalRow)}`);
                                log(`   Total agents: ${totalRow.Total}`);
                            } else {
                                log('❌ TOTAL row NOT found in data', 'error');
                            }
                            
                            log('\n=== ATTEMPTING TO RENDER TABLES ===');
                            try {
                                if (typeof window.renderTerritorySummaryTable === 'function') {
                                    window.renderTerritorySummaryTable(window.dashboardData);
                                    log('✅ renderTerritorySummaryTable() called');
                                    
                                    // Check if table was actually rendered
                                    setTimeout(() => {
                                        const table = document.querySelector('#kpiGrid table');
                                        if (table) {
                                            const rows = table.querySelectorAll('tbody tr');
                                            log(`✅ Table 1 rendered with ${rows.length} rows`);
                                            if (rows.length > 0) {
                                                const firstRowText = rows[0].textContent;
                                                const hasTotalFirst = firstRowText.includes('TOTAL');
                                                log(`   First row: ${firstRowText.substring(0, 50)}...`);
                                                log(`   TOTAL is first: ${hasTotalFirst ? '✅ YES' : '❌ NO'}`, hasTotalFirst ? 'success' : 'error');
                                            }
                                        } else {
                                            log('❌ Table 1 HTML not found in DOM', 'error');
                                        }
                                    }, 100);
                                }
                                
                                if (typeof window.renderCodeQualityTable === 'function') {
                                    window.renderCodeQualityTable(window.dashboardData);
                                    log('✅ renderCodeQualityTable() called');
                                    
                                    setTimeout(() => {
                                        const table = document.querySelector('#codeQualityGrid table');
                                        if (table) {
                                            const rows = table.querySelectorAll('tbody tr');
                                            log(`✅ Table 2 rendered with ${rows.length} rows`);
                                            if (rows.length > 0) {
                                                const firstRowText = rows[0].textContent;
                                                const hasTotalFirst = firstRowText.includes('TOTAL');
                                                log(`   First row: ${firstRowText.substring(0, 50)}...`);
                                                log(`   TOTAL is first: ${hasTotalFirst ? '✅ YES' : '❌ NO'}`, hasTotalFirst ? 'success' : 'error');
                                            }
                                        } else {
                                            log('❌ Table 2 HTML not found in DOM', 'error');
                                        }
                                    }, 100);
                                }
                            } catch (e) {
                                log(`❌ ERROR rendering tables: ${e.message}`, 'error');
                                log(`   Stack: ${e.stack}`, 'error');
                            }
                        }
                    }, 500);
                }
            };
            script.onerror = () => {
                log(`❌ FAILED to load: ${src}`, 'error');
            };
            document.head.appendChild(script);
        });
    </script>

    <!-- Add table containers -->
    <h2>Table 1: Territory Summary</h2>
    <div id="kpiGrid"></div>

    <h2>Table 2: Code Quality</h2>
    <div id="codeQualityGrid"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .pass { background: #d1fae5; color: #065f46; }
        .fail { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border: 1px solid #ddd; }
        th { background: #2563eb; color: white; }
    </style>
</head>
<body>
    <h1>Dashboard Data Test</h1>
    <div id="status"></div>
    <div id="output"></div>
    
    <script>
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        
        function log(msg, isPass = true) {
            const div = document.createElement('div');
            div.className = 'status ' + (isPass ? 'pass' : 'fail');
            div.textContent = (isPass ? '✅ ' : '❌ ') + msg;
            status.appendChild(div);
        }
        
        // Load and test the dashboard
        fetch('autonomy_dashboard.html')
            .then(r => r.text())
            .then(html => {
                log('Dashboard HTML loaded: ' + html.length + ' bytes');
                
                // Extract dashboardData
                const dashMatch = html.match(/const dashboardData = (\[[\s\S]*?\]);/);
                if (!dashMatch) {
                    log('dashboardData NOT FOUND', false);
                    return;
                }
                
                log('dashboardData found in HTML');
                
                // Parse it
                try {
                    const data = JSON.parse(dashMatch[1]);
                    log('dashboardData parsed: ' + data.length + ' rows');
                    
                    const total = data.find(r => r.Territory === 'TOTAL');
                    if (total) {
                        log('TOTAL row: ' + total.Total + ' agents, ' + total['Heal Cap %'] + '% heal cap');
                        
                        // Render a simple table
                        let table = '<table><thead><tr><th>Territory</th><th>Agents</th><th>Heal Cap %</th><th>Health</th></tr></thead><tbody>';
                        
                        for (let row of data.slice(0, 10)) {
                            table += `<tr>
                                <td>${row.Territory}</td>
                                <td>${row.Total}</td>
                                <td>${row['Heal Cap %']}%</td>
                                <td>${row.Health}%</td>
                            </tr>`;
                        }
                        
                        table += '</tbody></table>';
                        output.innerHTML = table;
                        log('Table rendered with ' + Math.min(10, data.length) + ' rows');
                    } else {
                        log('TOTAL row NOT FOUND', false);
                    }
                } catch (e) {
                    log('Parse error: ' + e.message, false);
                }
                
                // Check for realAgentData
                const realMatch = html.match(/const realAgentData = (\{[\s\S]*?\});/);
                if (realMatch) {
                    try {
                        const realData = JSON.parse(realMatch[1]);
                        const territories = Object.keys(realData);
                        log('realAgentData found: ' + territories.length + ' territories');
                    } catch (e) {
                        log('realAgentData parse error: ' + e.message, false);
                    }
                } else {
                    log('realAgentData NOT FOUND', false);
                }
                
                // Check if loadData is called
                if (html.includes('loadData();')) {
                    log('loadData() is called');
                } else {
                    log('loadData() NOT CALLED', false);
                }
                
                // Check for DOM elements
                if (html.includes('id="kpiGrid"')) {
                    log('kpiGrid element exists');
                } else {
                    log('kpiGrid element MISSING', false);
                }
                
            })
            .catch(err => {
                log('Failed to load dashboard: ' + err.message, false);
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Render Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .pass { background: #d1fae5; color: #065f46; }
        .fail { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Dashboard Rendering Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function test(name, condition, details = '') {
            const div = document.createElement('div');
            div.className = 'status ' + (condition ? 'pass' : 'fail');
            div.innerHTML = `<strong>${condition ? '✅' : '❌'} ${name}</strong><br>${details}`;
            results.appendChild(div);
            return condition;
        }
        
        // Load the actual dashboard HTML via fetch to check data
        fetch('autonomy_dashboard.html')
            .then(r => r.text())
            .then(html => {
                // Extract dashboardData
                const dashMatch = html.match(/const dashboardData = (\[[\s\S]*?\]);/);
                const realMatch = html.match(/const realAgentData = (\{[\s\S]*?\});/);
                
                test('Dashboard HTML loaded', true, `${html.length} bytes`);
                
                if (dashMatch) {
                    try {
                        const data = JSON.parse(dashMatch[1]);
                        test('dashboardData parsed', true, `${data.length} rows`);
                        
                        const total = data.find(r => r.Territory === 'TOTAL');
                        if (total) {
                            test('TOTAL row found', true, `${total.Total} agents, ${total['Heal Cap %']}% heal cap`);
                        } else {
                            test('TOTAL row found', false);
                        }
                    } catch (e) {
                        test('dashboardData parsed', false, e.message);
                    }
                } else {
                    test('dashboardData found', false);
                }
                
                if (realMatch) {
                    try {
                        const realData = JSON.parse(realMatch[1]);
                        const territories = Object.keys(realData);
                        test('realAgentData parsed', true, `${territories.length} territories`);
                        
                        if (territories.length > 0) {
                            const sample = realData[territories[0]];
                            test('Sample territory has agents', sample.agents && sample.agents.length > 0, 
                                `${sample.agents ? sample.agents.length : 0} agents in ${territories[0]}`);
                        }
                    } catch (e) {
                        test('realAgentData parsed', false, e.message);
                    }
                } else {
                    test('realAgentData found', false);
                }
                
                // Check for loadData call
                test('loadData() called', html.includes('loadData();'));
                
                // Check for containers
                test('kpiGrid container', html.includes('id="kpiGrid"'));
                test('codeQualityGrid container', html.includes('id="codeQualityGrid"'));
                
                // Check for rendering functions
                test('renderTerritorySummaryTable', html.includes('function renderTerritorySummaryTable'));
                test('renderCodeQualityTable', html.includes('function renderCodeQualityTable'));
                
                // Now try to actually open the dashboard
                const link = document.createElement('a');
                link.href = 'autonomy_dashboard.html';
                link.textContent = '🚀 Open Full Dashboard';
                link.style.cssText = 'display:block; margin:20px 0; padding:15px; background:#3b82f6; color:white; text-decoration:none; border-radius:8px; text-align:center; font-weight:bold;';
                results.appendChild(link);
                
                const note = document.createElement('div');
                note.style.cssText = 'margin-top:20px; padding:15px; background:#fef3c7; border-left:4px solid #f59e0b;';
                note.innerHTML = `
                    <strong>⚠️ If dashboard appears empty:</strong><br>
                    1. Press F12 to open Developer Tools<br>
                    2. Go to Console tab<br>
                    3. Look for red error messages<br>
                    4. Check Network tab for failed requests<br>
                    5. Try hard refresh: Ctrl+Shift+R (Windows) or Cmd+Shift+R (Mac)
                `;
                results.appendChild(note);
            })
            .catch(err => {
                test('Load dashboard HTML', false, err.message);
            });
    </script>
</body>
</html>

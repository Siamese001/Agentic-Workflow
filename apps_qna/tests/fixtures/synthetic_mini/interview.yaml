jd:
  sections:
    - heading: Mandate
      body: Build governed agentic systems for the decisioning practice.
      extracted_keywords:
        - agentic
        - decisioning
    - heading: Requirements
      body: 10+ years engineering, governed AI experience.
      extracted_keywords:
        - governed AI

experience:
  points:
    - title: Constitutional governance pattern
      one_liner: Authored a constitutional governance pattern for agentic systems.
      technical_depth_tags:
        - governance
        - agentic
  star_bank:
    stories:
      - name: ConstitutionalGovernance
        situation: Multiple agents were colliding on writes with no audit trail.
        task: Establish a write-gateway pattern with explicit approval and rollback.
        action: Designed UWG, integrated with L5 safety gates, shipped in 3 sprints.
        result: Zero corrupted writes in 6 months; 4 teams adopted the pattern.
        lesson: Governance is a contract, not a guardrail.
        tags:
          - governance
          - agentic
          - platform
  rca_bank:
    - name: SilentFallback
      situation: A retrieval router silently fell back to grep when SQLite failed.
      task: Identify the root cause and prevent recurrence.
      root_cause: The fallback hierarchy collapsed two tiers into one.
      action: Split the fallback into explicit tiers with reason codes.
      result: Subsequent fallbacks emit telemetry and are auditable.
      operating_model_change: Every fallback now requires an explicit reason code.


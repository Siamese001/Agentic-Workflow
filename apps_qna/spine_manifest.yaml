# apps_qna spine manifest
#
# Declares which spine route types apps_qna serves so the runtime-mode
# scanner (tools/analysis/apps_spine_coverage.py) can verify the
# canonical contract delegation evidence.
#
# Format: docs/reference/APP_OVERLAY_VS_CORE_ONLY_RUNTIME.md §"Route-typed contract requirement matrix"
# Scanner: tools.analysis.apps_spine_coverage.ROUTE_TYPE_CONTRACT_REQUIREMENTS

schema_version: 1
app: apps_qna

claimed_routes:
  - type: build_time_compiler
    description: >-
      Compiles a 22-card interview-prep context pack at build time. The
      operator pastes the resulting pack into ChatGPT (the external
      agent), which then becomes the runtime answer surface. The
      agentic_core spine is NOT in the runtime path of the pasted
      answer — ChatGPT is. Therefore this route legitimately requires
      zero canonical authority contracts (no L1PlanContract,
      RouteContract, CompiledPromptArtifact, SealedArtifact,
      ExitReviewPacket, CommitRequest). What the spine DOES provide is
      intake validation (ValidatedRequest), atomic writes (UWG), audit
      trail (apps_qna_pack_lifecycle ledger), and ranking primitives
      (BGE-M3 embeddings via spine_adapter). The spine_handoff.py
      module wraps the existing CardPackBuilder.build() in a
      ValidatedRequest envelope so build-time invocations get the same
      schema-validation discipline as runtime requests.
    notes:
      - "Empty required-contract set per ROUTE_TYPE_CONTRACT_REQUIREMENTS"
      - "Apps that match this shape: apps_qna (paste-pack), apps_eval (scorecard)"
      - "Distinct from R3_action: no LLM call at build time; no spine routing"

  - type: R4_SINGLE_ACTION
    description: >-
      Live interview runtime pack builder with governed spine pipeline
      (U0→L1→L0→C0/Briefing→L2→Exit). Two sub-routes: grounded
      (canonical C0 retrieval) and briefing-based (uploaded briefing
      validation). Emits L1PlanContract, RouteContract,
      FinalEvidenceContract, L2 execution receipts, ExitReviewPacket.
      Output is local filesystem artifact (reports/qna/<slug>/), not
      UWG/L4 durable write by default.
    route_ids:
      - apps_qna.live_interview_runtime_pack_v1
      - apps_qna.live_interview_runtime_pack_from_uploaded_brief_v1
    notes:
      - "R4_SINGLE_ACTION per RouteIdV15 canonical enum"
      - "ExecutionForm: SINGLE_STEP"
      - "Plan: .windsurf/plans/apps-qna-spine-integration-e9c5b3.md"


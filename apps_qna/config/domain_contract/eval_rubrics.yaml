# apps_qna Fort Knox app-domain contract — generated from tools/apps_proof/generate_compact_app_contracts.py
- eval_rubric_id: aer::apps_qna::qna_pack_build::v1
  app_id: apps_qna
  task_class: qna_pack_build
  version: 1.0.0
  status: active
  policy_hash: policy://apps_qna/v1
  score_dimensions:
  - dimension_id: route_fit
    description: Pack content matches the declared route_id.
    weight: 0.25
    grader_type: deterministic
    min_required_score: 0.9
    evidence_required: true
    fail_closed_if_unknown: true
  - dimension_id: factual_grounding
    description: Answers cite KB source_ids.
    weight: 0.25
    grader_type: deterministic
    min_required_score: 0.95
    evidence_required: true
    fail_closed_if_unknown: true
  - dimension_id: de_duplication
    description: No duplicate cards within a pack.
    weight: 0.1
    grader_type: deterministic
    min_required_score: 0.98
    evidence_required: false
    fail_closed_if_unknown: true
  - dimension_id: coverage
    description: Pack covers the declared pathology_taxonomy for the route.
    weight: 0.15
    grader_type: hybrid
    min_required_score: 0.7
    evidence_required: true
    fail_closed_if_unknown: true
  - dimension_id: freshness
    description: Sources within freshness window.
    weight: 0.1
    grader_type: deterministic
    min_required_score: 0.8
    evidence_required: true
    fail_closed_if_unknown: true
  - dimension_id: no_paste_of_forbidden_content
    description: No forbidden content patterns (PII, secrets).
    weight: 0.15
    grader_type: deterministic
    min_required_score: 0.99
    evidence_required: true
    fail_closed_if_unknown: true
  # W3.P5 / apps-eval-harness-closeout-b7c9d2 W1.P1 — RAG metric dims with
  # OpenAI canonical baselines (context_recall 0.85, context_precision 0.70,
  # answer_relevancy 0.80). weight=0.0 keeps the existing weighted overall
  # unchanged; these dims are tracked-only until upstream producers populate
  # output["dim_scores"][<dim_id>]. fail_closed_if_unknown=false prevents
  # cascading fails on runs where the producer hasn't wired the metric yet.
  - dimension_id: context_recall
    description: RAG retrieval completeness (observed-evidence fraction over needed-evidence).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.85
    evidence_required: true
    fail_closed_if_unknown: false
  - dimension_id: context_precision
    description: RAG retrieval precision (signal-to-noise in retrieved chunks).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.70
    evidence_required: true
    fail_closed_if_unknown: false
  - dimension_id: answer_relevancy
    description: Answer relevancy to the interview question intent.
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.80
    evidence_required: true
    fail_closed_if_unknown: false
  # W2 / bge-m3-deferred-scope-remaining-c4e7a1 — real LLM judge (Anthropic).
  # IS_CALIBRATED=False until Spearman >= 0.80 on holdout verified.
  # weight=0.0 and fail_closed_if_unknown=false until calibration passes.
  - dimension_id: interview_card_quality
    description: Overall LLM-judged quality of the interview card answer (relevance, completeness, accuracy, clarity, actionability).
    weight: 0.0
    grader_type: llm_as_judge
    min_required_score: 0.75
    evidence_required: true
    fail_closed_if_unknown: false
    judge_module: apps_qna.engines.judges.interview_card_quality_judge
    calibration_status: uncalibrated
    calibration_target_spearman: 0.80
  source_app_config_ref: apps_eval/config/rubrics/
  created_at: '2026-05-01'
  # Frozen holdout salt — changing this reassigns all slugs to different partitions.
  # Any change requires CI alert and human approval (corpus-reassignment risk).
  holdout_salt: "a3f7e9d2c8b1a6f5d4e3c2b1a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1"

# apps_qna Fort Knox app-domain contract — generated from tools/apps_proof/generate_compact_app_contracts.py
- eval_rubric_id: aer::apps_qna::qna_pack_build::v1
  app_id: apps_qna
  task_class: qna_pack_build
  version: 1.0.0
  status: active
  policy_hash: policy://apps_qna/v1
  score_dimensions:
  - dimension_id: route_fit

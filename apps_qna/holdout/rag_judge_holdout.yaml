# =============================================================================
# apps_qna RAG Judge Holdout Corpus — Heuristic Sanity Baseline (Tier 1)
# =============================================================================
#
# dataset_id: rag_judge_heuristic_sanity_v1
# dataset_purpose: heuristic_sanity_baseline
# label_source: heuristic_sanity_synthetic
# label_policy: >
#   Scores are calibrated to track the deterministic heuristic's surface-level
#   signals (overlap ratios, length, vocabulary diversity). This corpus proves
#   the heuristic fallback is stable and monotonic. It does NOT prove semantic
#   quality alignment with human judgment. For semantic calibration see
#   rag_judge_holdout_semantic.yaml (Tier 2).
# promotion_eligible: false
# notes: >
#   Heuristic sanity tests may assert Spearman >= threshold on these examples,
#   but passing this corpus does NOT qualify a judge for production semantic
#   scoring. A heuristic that passes Tier 1 but fails Tier 2 is fallback-only.
#
# SCHEMA (per example):
#   example_id: str         — unique identifier
#   judge_id: str           — one of: context_recall, context_precision, answer_relevancy
#   query: str              — interview question
#   retrieved_context: list — retrieved source IDs
#   gold_context: list      — expected source IDs (optional for answer_relevancy)
#   answer: str             — generated answer text (required for answer_relevancy + context_precision)
#   human_score: float      — heuristic-aligned reference score 0.0–1.0
#   human_rationale: str    — brief justification
#   labeler_id: str         — "heuristic_sanity_synthetic"
#
# THRESHOLDS (Spearman rank correlation — heuristic sanity tier):
#   overall: >= 0.70
#   per_judge: >= 0.60
#
# =============================================================================


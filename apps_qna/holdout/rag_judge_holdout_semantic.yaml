# =============================================================================
# apps_qna RAG Judge Holdout Corpus — Human Semantic Alignment (Tier 2)
# =============================================================================
#
# dataset_id: rag_judge_semantic_alignment_v1
# dataset_purpose: human_semantic_alignment_baseline
# label_source: synthetic_human_semantic
# label_policy: >
#   Scores represent genuine human semantic quality judgments. High score means
#   the answer is directly responsive, complete, specific, and grounded in the
#   question. Low score means off-topic, evasive, generic, too short to be
#   useful, or semantically non-responsive. Labels must NOT be modified to make
#   a weak judge pass. A judge that fails Tier 2 is fallback-only.
# promotion_eligible: true
# minimum_spearman_threshold:
#   overall: 0.70
#   per_judge: 0.60
# notes: >
#   This corpus is the promotion-quality metric. Passing Tier 2 proves a judge
#   tracks human semantic quality ranking. The deterministic heuristic for
#   answer_relevancy is expected to fail this tier because it scores surface
#   signals (word overlap, length, uniqueness) rather than semantic relevance.
#   That failure is correct and informative — it means the heuristic should not
#   be promoted as a semantic judge. The LLM-backed path is the candidate for
#   semantic promotion when provider_context is available.
#
# SCHEMA (per example):
#   example_id: str         — unique identifier (prefixed sem_)
#   judge_id: str           — one of: context_recall, context_precision, answer_relevancy
#   query: str              — interview question
#   retrieved_context: list — retrieved source IDs
#   gold_context: list      — expected source IDs (optional for answer_relevancy)
#   answer: str             — generated answer text
#   human_score: float      — semantic quality reference score 0.0–1.0
#   human_rationale: str    — brief justification grounded in semantic quality
#   labeler_id: str         — "synthetic_human_semantic"
#
# =============================================================================

---


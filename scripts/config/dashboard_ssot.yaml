# ============================================================================
# DASHBOARD SSOT CONFIGURATION
# ============================================================================
# CANONICAL SOURCE OF TRUTH - DO NOT HARDCODE STRINGS ELSEWHERE
#
# This YAML file is the single source of truth for all dashboard constants.
# It is automatically synchronized to:
#   - Python: scripts/dashboard_ssot_definitions.py
#   - JavaScript: agentic_core/L6_observability/dashboards/js/constants/dashboard-constants.js
#
# To update constants:
#   1. Edit this file
#   2. Run: python scripts/generate_dashboard_ssot.py
#   3. Regenerate dashboard data: python scripts/regenerate_dashboard_data.py
#
# Last Updated: 2026-01-16
# ============================================================================

# ============================================================================
# DASHBOARD COLUMN NAMES
# ============================================================================
# These are the display names shown in the dashboard tables.
# They must match exactly what's in dashboard_data.js.

columns:
  # Table 1: Territory Summary (Health Metrics)
  territory: "Territory"
  total: "Total"
  compliant: "Compliant"
  heal_cap: "Heal Cap %"
  invocation: "Invocation %"
  test: "Test %"
  hardened: "MCP Hardened %"
  complexity_health: "Complexity Health %"
  health: "Health"
  
  # Table 2: Code Quality Metrics
  typed: "Typed %"
  documented: "Documented %"
  schema_strictness: "Schema Strictness %"
  canonical_inheritance: "Canonical Inheritance %"
  code_quality: "Code Quality Score"
  
  # Additional Metrics
  avg_cc: "Avg CC"
  observable: "Observable %"

# ============================================================================
# TERRITORY NAMES
# ============================================================================
# Canonical territory names used across agent discovery and dashboard.
# These are synchronized with territory_ssot_definitions.py.

territories:
  # Base/Root
  sovereign_base: "Sovereign Base Agent"
  
  # L6 Observability
  l6_base: "L6_Observability/Base Agent"
  l6_metrics: "L6_Observability/Metrics"
  l6_telemetry: "L6_Observability/Telemetry"
  l6_tracing: "L6_Observability/Tracing"
  l6_compliance: "L6_Observability/Compliance"
  
  # L5 Safety
  l5_base: "L5 Safety/Base Agent"
  l5_validators: "L5 Safety/Validators"
  l5_guardrails: "L5 Safety/Guardrails"
  l5_red_teaming: "L5 Safety/Red Teaming"
  l5_gravity: "L5 Safety/Gravity"
  
  # L4 State
  l4_base: "L4 State/Base Agent"
  l4_core: "L4 State/Core"
  l4_infrastructure: "L4 State/Infrastructure"
  l4_specialized: "L4 State/Specialized"
  
  # L3 Orchestration
  l3_base: "L3 Orchestration/Base Agent"
  l3_core: "L3 Orchestration/Core"
  l3_infrastructure: "L3 Orchestration/Infrastructure"
  l3_specialized: "L3 Orchestration/Specialized"
  
  # L2 Execution
  l2_base: "L2 Execution/Base Agent"
  l2_core: "L2 Execution/Core"
  l2_specialized: "L2 Execution/Specialized"
  
  # L1 Cognition
  l1_base: "L1 Cognition/Base Agent"
  l1_core: "L1 Cognition/Core"
  l1_specialized: "L1 Cognition/Specialized"
  
  # L0 Maintenance
  l0_base: "L0 Maintenance/Base Agent"
  l0_core: "L0 Maintenance/Core"
  l0_infrastructure: "L0 Maintenance/Infrastructure"
  
  # Apps
  apps_lic: "Apps Lic"
  apps_rg: "Apps Rg"
  apps_shared: "Apps Shared"
  
  # Utils
  utils: "Utils"

# ============================================================================
# AGENT DISCOVERY FIELD NAMES
# ============================================================================
# Field names used in agent_discovery_full.json.
# These are the keys used to access agent properties.

fields:
  # Core Identification
  class_name: "class_name"
  path: "path"
  layer: "layer"
  territory: "territory"
  category: "category"
  
  # Capabilities
  has_healing: "has_healing"
  has_tests: "has_tests"
  has_tools: "has_tools"
  has_memory: "has_memory"
  mcp_hardened: "mcp_hardened"
  
  # Metrics
  invocation: "invocation"
  typed_pct: "typed_pct"
  documented_pct: "documented_pct"
  schema_strictness: "schema_strictness"
  proper_base_class: "proper_base_class"
  cyclomatic_complexity: "cyclomatic_complexity"
  
  # Inheritance
  inheritance: "inheritance"
  base_classes: "base_classes"

# ============================================================================
# METRIC THRESHOLDS
# ============================================================================
# Standard thresholds for metric validation and outlier detection.

thresholds:
  # Target Values (100% expected)
  mcp_hardened_target: 100.0
  heal_cap_target: 100.0
  
  # Minimum Acceptable Values
  test_coverage_min: 50.0
  health_score_min: 60.0
  complexity_health_min: 30.0
  
  # Target Values (aspirational)
  test_coverage_target: 80.0
  typed_target: 100.0
  documented_target: 100.0
  schema_strictness_target: 100.0
  
  # Outlier Detection
  outlier_threshold_default: 50.0
  outlier_threshold_critical: 0.0
  
  # Complexity Limits
  complexity_health_max: 60.0
  avg_cc_warning: 15.0
  avg_cc_critical: 25.0
  
  # Phase 2: Granular Thresholds for Stricter Logic
  coverage_warning: 70.0
  coverage_critical: 40.0
  quality_target: 90.0

# ============================================================================
# HEALTH SCORE FORMULA WEIGHTS
# ============================================================================
# Weights for calculating the overall Health score.
# Must sum to 1.0 for standard territories.

health_weights:
  heal_cap: 0.30
  invocation: 0.10
  test: 0.25
  observable: 0.20
  complexity: 0.15

# L0-specific weights (infrastructure layer - no healing)
health_weights_l0:
  test: 0.40
  hardened: 0.30
  complexity: 0.30

# ============================================================================
# CODE QUALITY FORMULA WEIGHTS
# ============================================================================
# Weights for calculating Code Quality Score.
# Must sum to 1.0.

code_quality_weights:
  typed: 0.25
  documented: 0.25
  schema_strictness: 0.25
  canonical_inheritance: 0.25

# ============================================================================
# PLACEHOLDERS
# ============================================================================
# Documented placeholder values for metrics not yet implemented.

placeholders:
  observable_pct: 50.0  # Observable % awaiting implementation

# ============================================================================
# FILE PATHS
# ============================================================================
# Canonical file paths relative to project root.

paths:
  agent_discovery_json: "agent_discovery_full.json"
  dashboard_data_js: "agentic_core/L6_observability/dashboards/data/dashboard_data.js"
  dashboard_html: "agentic_core/L6_observability/dashboards/autonomy_dashboard.html"
  dashboard_dir: "agentic_core/L6_observability/dashboards"
  js_constants: "agentic_core/L6_observability/dashboards/js/constants/dashboard-constants.js"

# ============================================================================
# JAVASCRIPT METRIC KEYS
# ============================================================================
# CamelCase keys used in JavaScript agentData objects.
# These map to the Python field names above.

js_keys:
  healCap: "healCap"
  invocation: "invocation"
  hardened: "hardened"
  test: "test"
  complexityHealth: "complexityHealth"
  health: "health"
  typed: "typed"
  documented: "documented"
  schemaStrictness: "schemaStrictness"
  properBase: "properBase"
  codeQuality: "codeQuality"

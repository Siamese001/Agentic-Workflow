research:
  company_brief: |
    Searce is a process-first, AI-native modern technology consultancy founded in 2004 by Hardik Parekh, headquartered in Pune, India with executive presence in Houston, Texas. ~2,200 employees, ~$126M revenue (2025), entirely bootstrapped — a rare profile at this scale. Originally a BPO and process-consulting firm, it pivoted in the mid-2010s to become a premier Google Cloud Platform implementation partner, expanded to AWS/Databricks/Snowflake by the early 2020s, and rebranded its entire portfolio as "AI-native" in 2024. Searce's neologism "futurify" anchors marketing; the proprietary "evlos" methodology (the word SOLVE backwards) anchors execution — reverse-engineering from desired outcome to foundational code, redesigning business processes BEFORE overlaying technology. Internal HAPPIER values (Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible) drive cultural fit screening; the DRI (Directly Responsible Individual) model assigns absolute accountability to senior leaders for revenue + delivery + architecture, with no hand-offs. External recognition is strong (Google Cloud Premier Partner, Everest Major Contender 2025); employee sentiment data shows operational friction in middle management, compensation, and offshore delivery centers — material context for any senior hire's first-90-day plan.
  role_areas_of_focus:
    - "Build North America Applied AI pipeline + repeatable sales motion"
    - "Production-grade AI architectures: GenAI, agentic workflows, retrieval systems, MLOps, data platforms, governance"
    - "Reusable accelerators, reference architectures, implementation playbooks"
    - "Google Cloud co-sell motions + funded client programs"
    - "Delivery standards: AI quality, evaluation, observability, cost control, human escalation, post-launch monitoring"
    - "Cross-functional team building: AI architecture, ML engineering, data engineering, platform engineering, solution consulting"
    - "DRI accountability for revenue + architecture + delivery (no hand-offs to offshore)"
  industry_trends:
    - "2026 inflection: AI moves from isolated experiments to AI-native enterprise architectures"
    - "Context Engineering replacing Prompt Engineering as the primary lever — chunking, metadata, semantic search"
    - "Agentic RAG and Graph-Based RAG over flat vector similarity for multi-hop reasoning"
    - "Model Context Protocol (MCP) emerging as the zero-trust standard for LLM tool integration"
    - "Layered Memory Design (short-term + episodic + semantic + procedural) becoming table stakes for true agents"
    - "AI Gateways + FinOps: model routing by task complexity, rate limiting, prompt-injection guardrails"
    - "Multi-Agent A2A architectures over single monolithic models — Agent Development Kits formalizing this pattern"
  interviewer_lenses:
    Ram Devaraj: |
      Director of Applied AI & Modern Product Engineering at Searce. Two-decade systems engineer. Foundational background in C/C++, Embedded Linux, device drivers, agile methodologies, full-stack architecture (Motorola Mobile Devices, Texas Instruments, Robert Bosch, Aditi Technologies). Co-founded Powerupcloud (Director of Engineering 2015-2017). Prior tenure at Searce as Director of Software Engineering (2018-2020) and CTO of Product Initiatives (2020-2021), then external CEO at Cloudside Technologies before returning. Views AI as complex deterministic software requiring rigorous memory management, hyper-efficient compute, robust system architecture — NOT algorithmic magic. Penalizes buzzwords and API-wrapper depth. Jan 2026 Searce blog "Building AI Systems in 2026" is the definitive blueprint for his interviewing priorities — Architectures Over Models. Will probe context engineering, agentic+graph RAG, MCP zero-trust, layered memory, A2A multi-agent, AI gateways/FinOps. Cultural overlay: HAPPIER values strictly enforced, particularly Responsible (end-to-end DRI ownership) and Humble (no-ego architecture pivots when data demands it).
  source_register:
    - claim: "Searce was founded in 2004 by Hardik Parekh, headquartered in Pune India with executive presence in Houston TX; ~2,200 employees, ~$126M revenue (2025), entirely bootstrapped"
      claim_type: direct_evidence
      source_id: SRC-001
      section_id: company_history
    - claim: "Searce is a Google Cloud Premier Partner and Everest Group 2025 PEAK Matrix Major Contender for GCP Services Specialists"
      claim_type: direct_evidence
      source_id: SRC-002
      section_id: market_positioning
    - claim: "Searce led a $1.8M Series A in ConveGenius (Feb 2024), its first vertical-AI IP equity move"
      claim_type: direct_evidence
      source_id: SRC-003
      section_id: strategic_investments
    - claim: "Vrinda Khurjekar serves as VP Solutions Consulting NA; Siddharth Shah as AVP — they own the commercial pre-sales motion in North America"
      claim_type: direct_evidence
      source_id: SRC-004
      section_id: regional_leadership
    - claim: "Ram Devaraj is Director of Applied AI & Modern Product Engineering at Searce; prior tenures at Searce 2018-2021 (Director SW Eng, CTO Product Initiatives), external CEO stint at Cloudside, returned to current role"
      claim_type: direct_evidence
      source_id: SRC-005
      section_id: interviewer_profile
    - claim: "Ram Devaraj's Jan 2026 blog 'Building AI Systems in 2026: Core Concepts and Essential Components' lays out his architectural priorities: context engineering, agentic+graph RAG, MCP, layered memory, A2A multi-agent, AI gateways"
      claim_type: direct_evidence
      source_id: SRC-006
      section_id: interviewer_thought_leadership
    - claim: "Searce's HAPPIER values (Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible) are strictly enforced in technical interview behavioral screening; technical brilliance without HAPPIER alignment results in disqualification"
      claim_type: direct_evidence
      source_id: SRC-007
      section_id: cultural_fit
    - claim: "Searce employee sentiment data shows significant friction in middle management, compensation structures, offshore delivery — relevant context for first-90-day planning by senior hires"
      claim_type: analyst_inference
      source_id: SRC-008
      section_id: operational_friction
  glossary_entries:
    - term: "EVLOS"
      definition: "Searce's proprietary problem-solving methodology — 'SOLVE' spelled backwards; reverse-engineers from desired business outcome to foundational code; redesigns business processes BEFORE overlaying technology."
    - term: "HAPPIER"
      definition: "Searce's seven-pillar value system: Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible. Strictly screened in interviews."
    - term: "DRI"
      definition: "Directly Responsible Individual — Searce's accountability model. A single person holds absolute accountability for outcome (revenue, architecture, delivery)."
    - term: "Futurify"
      definition: "Searce's central value-prop neologism — empowering enterprises to become future-ready by synthesizing process consulting DNA with AI/cloud/data engineering."
    - term: "Agentic RAG"
      definition: "Architecture where autonomous agents iterate dynamically on retrieval queries, evaluating context relevance before generating final response. Successor to one-shot RAG."
    - term: "Graph-Based RAG"
      definition: "Retrieval over knowledge graphs (nodes + edges) enabling multi-hop reasoning. Successor to flat vector similarity for relational queries."
    - term: "MCP (Model Context Protocol)"
      definition: "JSON-RPC-over-WebSockets standard bridging AI agents to external tools/data with zero-trust governance. Decouples model reasoning from tool implementation."
    - term: "Layered Memory Design"
      definition: "Tiered agent memory: short-term (within session) + long-term (procedural skills, episodic events, semantic facts). Avoids context-window overflow + cost runaway."
    - term: "A2A Communication"
      definition: "Agent-to-Agent protocols — independent specialized agents negotiate data formats and delegate sub-tasks (e.g., reasoning agent → coding agent for math)."
    - term: "AI Gateway"
      definition: "Architectural traffic-cop between application and models — enforces rate limits, routes by task complexity, blocks prompt injection / data exfiltration."
    - term: "PanyaThAI"
      definition: "Searce's Thailand-launched program for enterprise-grade agentic AI on Google Cloud stack."
  likely_questions:
    - route_id: architecture
      questions:
        - "Walk me through how you'd architect an enterprise agentic AI system end-to-end — from intake to production — for a Fortune 500 financial services client"
        - "How does Graph-Based RAG handle multi-hop reasoning differently than flat vector RAG? When would you reach for one vs. the other?"
        - "What does Context Engineering look like in practice — chunking, metadata filtering, retrieval grounding — for an enterprise data lake?"
        - "How does Model Context Protocol enable zero-trust LLM tool access in regulated environments?"
        - "Walk through a layered-memory architecture: short-term, long-term episodic, long-term semantic, long-term procedural. How do they coordinate?"
        - "Multi-agent A2A — when do you actually need it vs. a single specialized model with tools?"
    - route_id: governance
      questions:
        - "How do you enforce AI governance — policy, evaluation gates, rollback, audit trail — in a production agentic system?"
        - "How do you build an AI Gateway that handles model routing by task complexity, rate limiting, prompt-injection guardrails, and FinOps cost control?"
        - "What does human-in-the-loop look like for high-stakes regulated workflows?"
        - "How do you instrument trace integrity and replayability across distributed agent flows?"
    - route_id: ds_to_platform
      questions:
        - "How do you take a successful AI pilot from notebook to production with proper MLOps, observability, and cost control?"
        - "What does AI CI/CD look like — evaluation gates, rollback, drift monitoring, anomaly detection?"
        - "How do you operationalize AI evaluation pipelines that survive model swaps and prompt drift?"
    - route_id: productization
      questions:
        - "How do you convert successful client engagements into repeatable IP / accelerators / reference architectures?"
        - "How do you price and package an AI offering so field teams can sell and delivery teams can execute?"
        - "What does a $22M productization story look like — what made the IP reusable vs. bespoke?"
    - route_id: global_engineering
      questions:
        - "How do you operate as a DRI with a distributed global delivery team — esp. given Searce's offshore model?"
        - "How do you address the friction points in middle management and compensation in delivery centers without breaking the practice's growth velocity?"
        - "How do you scale an AI engineering org from 8 to 28 specialists while maintaining quality?"
    - route_id: executive_fit
      questions:
        - "Walk me through your first 90 days as Applied AI Practice Leader at Searce — what would you build, what would you measure?"
        - "How do you translate ambiguous CxO demand into a fundable AI program with measurable outcomes?"
        - "How do you navigate the DRI model — owning revenue, architecture, AND delivery with no hand-offs?"
        - "How do you partner with Vrinda Khurjekar (VP Solutions Consulting NA) on co-sell motions while owning the AI practice's P&L?"
    - route_id: rca
      questions:
        - "Tell me about a production AI failure — root cause, recovery, operating-model change"
        - "What's an architectural decision you got wrong, and what did the post-mortem teach you?"
    - route_id: cross_exam
      questions:
        - "Why MCP over a custom REST gateway? What's the actual security model?"
        - "Why GraphRAG over vector RAG when relational logic isn't dominant in the corpus?"
        - "How does layered memory avoid context-window blowup at scale — what's the eviction policy?"
        - "Defend your AI Gateway design against prompt-injection and data-exfiltration attacks"
    - route_id: star_proof
      questions:
        - "Tell me about a time you took an AI capability from prototype to production in a regulated enterprise environment"
        - "STAR: a CxO conversation that turned an ambiguous problem into a funded multi-quarter AI program"
        - "STAR: you had to build a practice from scratch — pipeline, IP, team, partner motion — what was the playbook?"

research:
  company_brief: |
    Searce is a process-first, AI-native modern technology consultancy founded in 2004 by Hardik Parekh, headquartered in Pune, India with executive presence in Houston, Texas. ~2,200 employees, ~$126M revenue (2025), entirely bootstrapped — a rare profile at this scale. Originally a BPO and process-consulting firm, it pivoted in the mid-2010s to become a premier Google Cloud Platform implementation partner, expanded to AWS/Databricks/Snowflake by the early 2020s, and rebranded its entire portfolio as "AI-native" in 2024. Searce's neologism "futurify" anchors marketing; the proprietary "evlos" methodology (the word SOLVE backwards) anchors execution — reverse-engineering from desired outcome to foundational code, redesigning business processes BEFORE overlaying technology. Internal HAPPIER values (Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible) drive cultural fit screening; the DRI (Directly Responsible Individual) model assigns absolute accountability to senior leaders for revenue + delivery + architecture, with no hand-offs. External recognition is strong (Google Cloud Premier Partner, Everest Major Contender 2025); employee sentiment data shows operational friction in middle management, compensation, and offshore delivery centers — material context for any senior hire's first-90-day plan.
  role_areas_of_focus:
    - "Build North America Applied AI pipeline + repeatable sales motion"
    - "Production-grade AI architectures: GenAI, agentic workflows, retrieval systems, MLOps, data platforms, governance"
    - "Reusable accelerators, reference architectures, implementation playbooks"
    - "Google Cloud co-sell motions + funded client programs"
    - "Delivery standards: AI quality, evaluation, observability, cost control, human escalation, post-launch monitoring"
    - "Cross-functional team building: AI architecture, ML engineering, data engineering, platform engineering, solution consulting"
    - "DRI accountability for revenue + architecture + delivery (no hand-offs to offshore)"
  industry_trends:
    - "2026 inflection: AI moves from isolated experiments to AI-native enterprise architectures"
    - "Context Engineering replacing Prompt Engineering as the primary lever — chunking, metadata, semantic search"
    - "Agentic RAG and Graph-Based RAG over flat vector similarity for multi-hop reasoning"
    - "Model Context Protocol (MCP) emerging as the zero-trust standard for LLM tool integration"
    - "Layered Memory Design (short-term + episodic + semantic + procedural) becoming table stakes for true agents"
    - "AI Gateways + FinOps: model routing by task complexity, rate limiting, prompt-injection guardrails"
    - "Multi-Agent A2A architectures over single monolithic models — Agent Development Kits formalizing this pattern"
  interviewer_lenses:
    Vrinda Khurjekar: |
      VP Americas at Searce since Sept 2024 (LinkedIn). 17 years at Searce — joined 2008 as Business Process Improvement Manager (Houston), grew through Sr. Director Cloud Consulting AMER and Head AMER Business to current VP role. Saw the company scale from 20 to 2200+ employees. This role reports into her. She is a 'techie turned business leader' — customer-empathy-first, hands-on problem solver, Forbes Business Development Council member. Her self-stated style: passionate, empathetic, strategic thinker, builds genuine relationships, throws herself into anything that needs to be fixed. Her published Sept 2025 priorities for the next phase (LinkedIn): (1) deepen customer partnerships as trusted long-term collaborators, (2) scale AI-native offerings to help clients adopt innovation faster, (3) expand Americas footprint across new regions and industries, (4) strengthen partner ecosystem and co-create value with joint customers, (5) build and empower high-performance teams. Public POV territory: regulated industries (Emerj podcast on regulated-industries AI with Paul Pallath), healthcare (MedCity precision-medicine), manufacturing (Authority Magazine), retail supply chain (Street Fight). Speaker at Google Cloud Next '26. She will probe commercial credibility (can you own the AI pipeline?), practice fit (can you commercialize IP?), partner motion (can you make Google Cloud co-sell real?), team building (can you hire and retain?), and cultural alignment (do you fit HAPPIER?) — NOT deep architecture (Ram already vetted that). She is hiring her direct report; she needs to trust that you partner with her motion rather than compete with it.
  source_register:
    - claim: "Searce was founded in 2004 by Hardik Parekh, headquartered in Pune India with executive presence in Houston TX; ~2,200 employees, ~$126M revenue (2025), entirely bootstrapped"
      claim_type: direct_evidence
      source_id: SRC-001
      section_id: company_history
    - claim: "Searce is a Google Cloud Premier Partner and Everest Group 2025 PEAK Matrix Major Contender for GCP Services Specialists"
      claim_type: direct_evidence
      source_id: SRC-002
      section_id: market_positioning
    - claim: "Searce led a $1.8M Series A in ConveGenius (Feb 2024), its first vertical-AI IP equity move"
      claim_type: direct_evidence
      source_id: SRC-003
      section_id: strategic_investments
    - claim: "Vrinda Khurjekar serves as VP Solutions Consulting NA; Siddharth Shah as AVP — they own the commercial pre-sales motion in North America"
      claim_type: direct_evidence
      source_id: SRC-004
      section_id: regional_leadership
    - claim: "Vrinda Khurjekar is VP Americas at Searce (Sept 2024-present per LinkedIn), 17-year tenure, started 2008 as Business Process Improvement Manager (Houston). The role being interviewed for reports into her."
      claim_type: direct_evidence
      source_id: SRC-005
      section_id: interviewer_profile
    - claim: "Vrinda's Sept 2025 LinkedIn post enumerates her 5 priorities for Searce's next phase: deepen customer partnerships, scale AI-native offerings, expand Americas footprint, strengthen partner ecosystem, build high-performance teams"
      claim_type: direct_evidence
      source_id: SRC-006
      section_id: interviewer_priorities
    - claim: "Vrinda has published bylines on regulated-industries AI in Emerj podcast (with Paul Pallath), MedCity News (precision medicine), Authority Magazine (manufacturing), and Street Fight (retail supply chain) — establishing her POV territory"
      claim_type: direct_evidence
      source_id: SRC-009
      section_id: interviewer_thought_leadership
    - claim: "Searce's HAPPIER values (Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible) are strictly enforced in technical interview behavioral screening; technical brilliance without HAPPIER alignment results in disqualification"
      claim_type: direct_evidence
      source_id: SRC-007
      section_id: cultural_fit
    - claim: "Searce employee sentiment data shows significant friction in middle management, compensation structures, offshore delivery — relevant context for first-90-day planning by senior hires"
      claim_type: analyst_inference
      source_id: SRC-008
      section_id: operational_friction
  glossary_entries:
    - term: "EVLOS"
      definition: "Searce's proprietary problem-solving methodology — 'SOLVE' spelled backwards; reverse-engineers from desired business outcome to foundational code; redesigns business processes BEFORE overlaying technology."
    - term: "HAPPIER"
      definition: "Searce's seven-pillar value system: Humble, Adaptable, Positive, Passionate, Innovative, Excellence, Responsible. Strictly screened in interviews."
    - term: "DRI"
      definition: "Directly Responsible Individual — Searce's accountability model. A single person holds absolute accountability for outcome (revenue, architecture, delivery)."
    - term: "Futurify"
      definition: "Searce's central value-prop neologism — empowering enterprises to become future-ready by synthesizing process consulting DNA with AI/cloud/data engineering."
    - term: "Agentic RAG"
      definition: "Architecture where autonomous agents iterate dynamically on retrieval queries, evaluating context relevance before generating final response. Successor to one-shot RAG."
    - term: "Graph-Based RAG"
      definition: "Retrieval over knowledge graphs (nodes + edges) enabling multi-hop reasoning. Successor to flat vector similarity for relational queries."
    - term: "MCP (Model Context Protocol)"
      definition: "JSON-RPC-over-WebSockets standard bridging AI agents to external tools/data with zero-trust governance. Decouples model reasoning from tool implementation."
    - term: "Layered Memory Design"
      definition: "Tiered agent memory: short-term (within session) + long-term (procedural skills, episodic events, semantic facts). Avoids context-window overflow + cost runaway."
    - term: "A2A Communication"
      definition: "Agent-to-Agent protocols — independent specialized agents negotiate data formats and delegate sub-tasks (e.g., reasoning agent → coding agent for math)."
    - term: "AI Gateway"
      definition: "Architectural traffic-cop between application and models — enforces rate limits, routes by task complexity, blocks prompt injection / data exfiltration."
    - term: "PanyaThAI"
      definition: "Searce's Thailand-launched program for enterprise-grade agentic AI on Google Cloud stack."
  likely_questions:
    - route_id: executive_fit
      questions:
        - "Walk me through your first 90 days as Applied AI Practice Leader at Searce — what would you build, what would you measure, and how would you partner with me?"
        - "Why Searce, why now? What about our motion is harder/different from where you've worked before?"
        - "How do you translate ambiguous CxO demand into a fundable AI program with measurable outcomes?"
        - "How do you navigate the DRI model — owning revenue, architecture, AND delivery with no hand-offs to offshore?"
        - "What's the line between this role's P&L and my Americas P&L? How do we partner so neither of us is in every deal?"
        - "How do you build genuine customer trust at the CxO level — not transactional, not deal-flow?"
    - route_id: productization
      questions:
        - "Scaling AI-native offerings is my #2 priority for the next phase. What does your accelerator catalog look like, and how do you decide what becomes IP vs. stays bespoke?"
        - "How do you convert successful client engagements into repeatable IP that field teams can actually sell and delivery teams can actually execute?"
        - "How do you price and package an AI offering for the regulated-industries buyer? What's the deal cycle and what's the comp model?"
        - "$22M productized AI revenue at Unify — what was the formula? What made the IP reusable rather than another bespoke deliverable?"
        - "How do you balance margin discipline with the investment needed to build durable IP?"
    - route_id: global_engineering
      questions:
        - "My #5 priority is building and empowering high-performance teams. What's your hiring playbook for senior AI architects — your network, your bar, your interview rubric?"
        - "How do you operate as a practice leader with distributed global delivery? Searce's offshore model has friction — how would you reduce it without breaking velocity?"
        - "How do you scale an AI engineering org from a small team to 25+ specialists while maintaining quality and culture?"
        - "What's your view on onshore-offshore handoff standards? Where does the line move as a program scales?"
        - "What's your approach to leveling, comp, and retention for top-tier AI engineering talent? What authority do you need from me to make this work?"
    - route_id: ds_to_platform
      questions:
        - "How do you take an AI pilot from notebook to production in a regulated enterprise environment — what are the actual gates?"
        - "What does AI CI/CD look like in your world — evaluation, rollback, drift, observability — and how does it land at a Fortune 500 financial services client?"
        - "How do you operationalize AI evaluation pipelines that survive model swaps and prompt drift over time?"
        - "You've said cycle time matters — what's your story on lab-to-production compression?"
    - route_id: star_proof
      questions:
        - "Tell me about a time you built deep customer trust at the CxO level. What did you do that someone else might not have?"
        - "STAR: a CxO conversation that turned an ambiguous problem into a funded multi-quarter AI program"
        - "STAR: you had to build a practice from scratch — pipeline, IP, team, partner motion. What was the playbook? What broke and how did you fix it?"
        - "STAR: a hyperscaler co-sell motion you ran end-to-end. What did the partner side actually need from you?"
        - "STAR: a regulated-industries deal where governance/compliance was a deal-blocker. How did you unblock it?"
    - route_id: rca
      questions:
        - "Tell me about a production AI failure or a deal that fell apart — root cause, recovery, what changed about how you operated afterward."
        - "What's a hire that didn't work out, and what did you learn about your screening rubric?"
        - "What's a partner-motion that misfired? Where did the alignment break?"
    - route_id: governance
      questions:
        - "Healthcare and financial services demand strict governance — how do you stand up the gates without slowing the deal cycle?"
        - "What's your view on the human-in-the-loop boundary for high-stakes regulated workflows?"
        - "How do you instrument trace integrity and audit trail in a way that survives a regulatory exam?"
    - route_id: architecture
      questions:
        - "At a high level — not Ram-deep — how would you architect the platform spine that lets us deliver Applied AI consistently across the practice?"
        - "What's your view on Graph RAG vs. vector RAG for enterprise use cases? When does the complexity pay off?"
        - "How does MCP fit into the partner-distributable accelerators we'd build?"
    - route_id: cross_exam
      questions:
        - "Defend your $22M productized revenue claim — walk me through the deal mix and the IP economics"
        - "Defend your 8→28 team-scaling claim — what was the attrition, what was the leveling spread, what made it sustainable?"
        - "Defend your hyperscaler partner-revenue claim — was that real co-sell or marketing line?"

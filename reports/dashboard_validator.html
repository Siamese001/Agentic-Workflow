<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Validator</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .test { margin: 10px 0; padding: 10px; border-left: 4px solid #555; }
        .pass { border-left-color: #4ec9b0; background: #0d3a2e; }
        .fail { border-left-color: #f48771; background: #3a1e1e; }
        .info { border-left-color: #569cd6; background: #1e2a3a; }
        h1 { color: #4ec9b0; }
        h2 { color: #569cd6; margin-top: 20px; }
        code { background: #2d2d2d; padding: 2px 6px; border-radius: 3px; }
        .count { font-weight: bold; color: #dcdcaa; }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Rendering Validator</h1>
    <div id="results"></div>
    
    <script>
        const results = [];
        
        function test(name, condition, details = '') {
            const passed = condition;
            results.push({ name, passed, details });
            return passed;
        }
        
        // Load the actual dashboard data
        fetch('autonomy_dashboard.html')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Extract script content
                const scripts = doc.querySelectorAll('script');
                let dashboardScript = '';
                scripts.forEach(s => {
                    if (s.textContent.includes('dashboardData')) {
                        dashboardScript = s.textContent;
                    }
                });
                
                // Test 1: Data injection
                test('Data Injection: dashboardData', 
                    !dashboardScript.includes('const dashboardData = [];'),
                    'dashboardData should be populated with actual data');
                
                test('Data Injection: recommendationsData', 
                    !dashboardScript.includes('const recommendationsData = [];'),
                    'recommendationsData should be populated');
                
                test('Data Injection: gaugeData', 
                    !dashboardScript.includes('const gaugeData = {};'),
                    'gaugeData should be populated');
                
                // Test 2: HTML structure
                test('HTML: kpiGrid element exists', 
                    doc.getElementById('kpiGrid') !== null,
                    'KPI grid container must exist');
                
                test('HTML: All chart divs exist', 
                    doc.getElementById('healthChart') && 
                    doc.getElementById('healingChart') && 
                    doc.getElementById('riskMatrix') &&
                    doc.getElementById('complianceChart') &&
                    doc.getElementById('observabilityChart') &&
                    doc.getElementById('complexityChart'),
                    'All 6 chart containers must exist');
                
                test('HTML: Interview questions container', 
                    doc.getElementById('interviewQuestions') !== null,
                    'Interview prep tab container must exist');
                
                test('HTML: Recommendations container', 
                    doc.getElementById('recommendationsList') !== null,
                    'Recommendations list container must exist');
                
                // Test 3: Tab navigation
                const tabs = doc.querySelectorAll('.nav-tab');
                test('Navigation: All tabs present', 
                    tabs.length === 6,
                    `Expected 6 tabs, found ${tabs.length}`);
                
                const tabTargets = ['executive', 'territory', 'risk', 'compliance', 'recommendations', 'interview'];
                const foundTargets = Array.from(tabs).map(t => t.getAttribute('data-target'));
                test('Navigation: Correct tab targets', 
                    JSON.stringify(foundTargets.sort()) === JSON.stringify(tabTargets.sort()),
                    `Tabs: ${foundTargets.join(', ')}`);
                
                // Test 4: Functions defined
                const functionsToCheck = [
                    'renderKPIBoxes',
                    'renderHealthChart',
                    'renderHealingChart',
                    'renderRiskMatrix',
                    'renderComplianceChart',
                    'renderObservabilityChart',
                    'renderComplexityChart',
                    'renderInterviewQuestions',
                    'renderRecommendations',
                    'loadData'
                ];
                
                functionsToCheck.forEach(fn => {
                    test(`Function: ${fn} defined`, 
                        dashboardScript.includes(`function ${fn}(`),
                        `${fn} must be defined in script`);
                });
                
                // Test 5: Plotly library
                test('Library: Plotly CDN link', 
                    html.includes('plotly'),
                    'Plotly.js must be loaded from CDN');
                
                // Test 6: Auto-refresh
                test('Auto-refresh: Meta tag set to 30s', 
                    html.includes('content="30"'),
                    'Meta refresh should be 30 seconds');
                
                // Test 7: CSS variables
                const cssVars = ['--primary', '--success', '--warning', '--danger', '--background'];
                cssVars.forEach(v => {
                    test(`CSS: ${v} defined`, 
                        html.includes(v),
                        `CSS variable ${v} must be defined`);
                });
                
                // Display results
                displayResults();
            })
            .catch(err => {
                document.getElementById('results').innerHTML = 
                    `<div class="test fail">❌ Failed to load dashboard: ${err.message}</div>`;
            });
        
        function displayResults() {
            const passed = results.filter(r => r.passed).length;
            const failed = results.filter(r => !r.passed).length;
            const total = results.length;
            
            let html = `
                <div class="test info">
                    <h2>Summary</h2>
                    <p>Total Tests: <span class="count">${total}</span></p>
                    <p>Passed: <span class="count" style="color: #4ec9b0">${passed}</span></p>
                    <p>Failed: <span class="count" style="color: #f48771">${failed}</span></p>
                    <p>Success Rate: <span class="count">${((passed/total)*100).toFixed(1)}%</span></p>
                </div>
                <h2>Test Results</h2>
            `;
            
            results.forEach(r => {
                const icon = r.passed ? '✓' : '✗';
                const cls = r.passed ? 'pass' : 'fail';
                html += `
                    <div class="test ${cls}">
                        <strong>${icon} ${r.name}</strong>
                        ${r.details ? `<br><small>${r.details}</small>` : ''}
                    </div>
                `;
            });
            
            document.getElementById('results').innerHTML = html;
            
            // Log to console
            console.log(`Dashboard Validation: ${passed}/${total} tests passed`);
            if (failed > 0) {
                console.error('Failed tests:', results.filter(r => !r.passed));
            }
        }
    </script>
</body>
</html>

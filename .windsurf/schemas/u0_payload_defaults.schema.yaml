# U0 Payload Defaults Profile Schema
# Defines app-specific U0 payload synthesizer defaults

schema_version: "1.0"
profile_type: "u0_payload_defaults"
description: "App-specific U0 payload synthesizer default configuration"

required_fields:
  - app_id
  - payload_defaults
  - synthesis_config

fields:
  app_id:
    type: string
    description: "Canonical app identifier"
    pattern: "^apps_[a-z_]+$"
    
  payload_defaults:
    type: object
    description: "Default payload field values"
    properties:
      default_capability:
        type: string
        description: "Default capability identifier"
      default_sandbox_mode:
        type: boolean
        default: false
      default_egress_policy:
        type: string
        enum: ["strict", "permissive", "none"]
        default: "strict"
      required_context_fields:
        type: array
        items:
          type: string
        description: "Fields required in context"
      optional_context_fields:
        type: array
        items:
          type: string
        description: "Optional fields in context"
    required:
      - default_capability
      
  synthesis_config:
    type: object
    description: "Payload synthesis configuration"
    properties:
      synthesis_mode:
        type: string
        enum: ["static", "template", "dynamic", "hybrid"]
        default: "template"
      template_path:
        type: string
        description: "Path to template in app package"
      field_inheritance:
        type: array
        items:
          type: string
        description: "Fields to inherit from parent context"
      computed_fields:
        type: object
        description: "Field computation rules (field -> dot-path to function)"
        additionalProperties:
          type: string

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

examples:
  - app_id: "apps_lic"
    payload_defaults:
      default_capability: "license_analysis"
      default_sandbox_mode: false
      default_egress_policy: "strict"
      required_context_fields: ["tenant_id", "capability"]
      optional_context_fields: ["session_id", "trace_id"]
    synthesis_config:
      synthesis_mode: "template"
      template_path: "apps_lic.runtime.templates.default_payload"
      field_inheritance: ["tenant_id"]
      computed_fields:
        timestamp: "apps_lic.runtime.utils.generate_timestamp"
        request_id: "apps_lic.runtime.utils.generate_request_id"

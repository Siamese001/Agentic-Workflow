# L6 Writeback Profile Schema
# Defines app-specific L6 writeback orchestration configuration

schema_version: "1.0"
profile_type: "l6_writeback"
description: "App-specific L6 writeback orchestration configuration"

required_fields:
  - app_id
  - orchestration_config
  - store_mapping

fields:
  app_id:
    type: string
    description: "Canonical app identifier"
    pattern: "^apps_[a-z_]+$"
    
  orchestration_config:
    type: object
    description: "Writeback orchestration configuration"
    properties:
      writeback_proposer_enabled:
        type: boolean
        default: true
      writeback_stages:
        type: array
        items:
          type: string
          enum: ["collect", "aggregate", "validate", "persist", "notify"]
        default: ["collect", "aggregate", "persist"]
      stage_timeout_seconds:
        type: integer
        default: 30
      fail_on_stage_error:
        type: boolean
        default: false
    required:
      - writeback_proposer_enabled
      
  store_mapping:
    type: object
    description: "Per-data-type store mapping"
    properties:
      dim_scores:
        type: string
        enum: ["sqlite", "redis", "file", "ledger"]
        default: "sqlite"
      execution_traces:
        type: string
        enum: ["sqlite", "redis", "file", "ledger"]
        default: "ledger"
      evaluation_outcomes:
        type: string
        enum: ["sqlite", "redis", "file", "ledger"]
        default: "ledger"
      feedback_records:
        type: string
        enum: ["sqlite", "redis", "file", "ledger"]
        default: "sqlite"
    required:
      - dim_scores
      
  app_specific_handlers:
    type: object
    description: "App-specific writeback handler paths (no core code)"
    properties:
      pre_writeback_hook:
        type: string
        description: "Dot-path to pre-writeback hook in app package"
      post_writeback_hook:
        type: string
        description: "Dot-path to post-writeback hook in app package"
      custom_aggregator:
        type: string
        description: "Dot-path to custom aggregator in app package"

validation_behavior:
  missing_profile: FAIL_CLOSED
  invalid_profile: FAIL_CLOSED
  unknown_app: FAIL_CLOSED

examples:
  - app_id: "apps_lic"
    orchestration_config:
      writeback_proposer_enabled: true
      writeback_stages: ["collect", "aggregate", "validate", "persist"]
      stage_timeout_seconds: 45
      fail_on_stage_error: true
    store_mapping:
      dim_scores: "ledger"
      execution_traces: "ledger"
      evaluation_outcomes: "ledger"
      feedback_records: "sqlite"

# Outreach Feedback Prompts v1.0
# Feedback generation and improvement recommendation prompts for outreach

outreach_feedback:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Feedback generation frameworks
  feedback_frameworks:
    # Comprehensive feedback system
    comprehensive_feedback:
      structured_feedback:
        prompt: |
          Generate comprehensive, actionable feedback for outreach improvement:
          
          Feedback Structure:
          1. Executive Summary:
             - Overall outreach effectiveness score (0-100)
             - Key strengths and competitive advantages
             - Critical improvement areas
             - Priority action items for immediate impact
             
          2. Message Analysis:
             - Personalization quality assessment
             - Value proposition effectiveness
             - Communication clarity and professionalism
             - Call to action optimization potential
             
          3. Strategic Evaluation:
             - Relationship building potential
             - Network expansion opportunities
             - Professional brand alignment
             - Long-term engagement strategy
             
          4. Specific Recommendations:
             - Immediate optimizations (high impact, low effort)
             - Strategic improvements (1-2 week implementation)
             - Relationship building enhancements (1 month development)
             - Professional positioning adjustments
             
          5. Implementation Guidance:
             - Step-by-step action plan
             - Resource requirements and tools
             - Timeline and milestone recommendations
             - Success measurement criteria
          
          Provide specific examples with before/after comparisons where applicable.
          Ensure all feedback is constructive, actionable, and prioritized.
          
        feedback_principles:
          - "Constructive_and_actionable"
          - "Relationship_building_focused"
          - "Specific_with_examples"
          - "Implementation_oriented"
          
    # Targeted feedback systems
    targeted_feedback:
      component_specific:
        prompt: |
          Generate targeted feedback for specific outreach components:
          
          Component Feedback Framework:
          1. Subject Line Optimization:
             - Open rate prediction and improvement
             - Personalization effectiveness
             - Professional tone assessment
             - Spam filter avoidance strategies
             
          2. Opening Enhancement:
             - Hook effectiveness and engagement
             - Research-based personalization quality
             - Contextual relevance demonstration
             - Professional connection establishment
             
          3. Value Proposition:
             - Recipient benefit clarity
             - Mutual benefit articulation
             - Specific, actionable value offered
             - Long-term relationship potential
             
          4. Call to Action:
             - Clarity and specificity assessment
             - Commitment level appropriateness
             - Conversion optimization potential
             - Professional appropriateness
             
          5. Professional Presentation:
             - Tone and language quality
             - Formatting and readability
             - Mobile optimization
             - Brand consistency
             
          Provide specific improvement suggestions with implementation examples.
          
        component_focus:
          - "Detailed_component_analysis"
          - "Specific_improvement_suggestions"
          - "Implementation_examples"
          - "Quality_enhancement_strategies"
          
  # Improvement recommendation systems
  improvement_recommendations:
    # Priority-based recommendations
    priority_recommendations:
      impact_effort_matrix:
        prompt: |
          Generate prioritized outreach improvement recommendations:
          
          Priority Categories:
          1. Quick Wins (High Impact, Low Effort):
             - Subject line optimization
             - Opening personalization enhancement
             - Call to action clarity improvement
             - Professional tone refinement
             
          2. Strategic Investments (High Impact, High Effort):
             - Comprehensive research integration
             - Value proposition development
             - Relationship building strategy creation
             - Professional brand alignment
             
          3. Incremental Improvements (Low Impact, Low Effort):
             - Message formatting adjustments
             - Length optimization
             - Mobile viewing enhancement
             - Signature professionalization
             
          4. Consider Later (Low Impact, High Effort):
             - Complete outreach strategy overhaul
             - Industry transition focus
             - Executive positioning development
             - Major network restructuring
          
          For each recommendation, provide:
          - Specific action required with examples
          - Estimated time investment
          - Expected impact on response rates
          - Implementation difficulty assessment
          - Success measurement criteria
          
        prioritization_criteria:
          - "Response_rate_impact"
          - "Relationship_building_potential"
          - "Implementation_complexity"
          - "Professional_brand_enhancement"
          
    # Channel-specific recommendations
    channel_recommendations:
      email_optimization:
        prompt: |
          Generate email-specific outreach improvement recommendations:
          
          Email Optimization Areas:
          1. Subject Line Enhancement:
             - Personalization depth improvement
             - Open rate optimization strategies
             - Spam filter avoidance techniques
             - Professional intrigue generation
             
          2. Message Body Optimization:
             - Research integration enhancement
             - Value proposition strengthening
             - Professional communication improvement
             - Length and formatting optimization
             
          3. Call to Action Improvement:
             - Conversion rate optimization
             - Commitment level adjustment
             - Professional appropriateness enhancement
             - Mobile optimization
             
          4. Professional Presentation:
             - Email formatting best practices
             - Signature professionalization
             - Contact information optimization
             - Brand consistency enhancement
          
          Provide specific email optimization examples and templates.
          
        email_enhancement_areas:
          - "Subject_line_optimization"
          - "Message_body_enhancement"
          - "Call_to_action_improvement"
          - "Professional_presentation"
          
      linkedin_optimization:
        prompt: |
          Generate LinkedIn-specific outreach improvement recommendations:
          
          LinkedIn Optimization Areas:
          1. Connection Request Enhancement:
             - Personalization depth improvement
             - Professional connection reason articulation
             - Mutual reference integration
             - Platform-appropriate tone optimization
             
          2. InMail Message Optimization:
             - Professional networking focus enhancement
             - Value proposition strengthening
             - Relationship building orientation
             - Platform-appropriate length optimization
             
          3. Profile Engagement Strategy:
             - Thoughtful interaction quality improvement
             - Professional community participation
             - Value-added content sharing
             - Network expansion strategy
             
          4. Professional Brand Alignment:
             - LinkedIn profile consistency
             - Professional authority demonstration
             - Thought leadership positioning
             - Industry expertise showcase
          
          Provide LinkedIn-specific optimization strategies and examples.
          
        linkedin_enhancement_areas:
          - "Connection_request_optimization"
          - "Inmail_enhancement"
          - "Profile_engagement_strategy"
          - "Professional_brand_alignment"
          
  # Feedback delivery methods
  delivery_methods:
    # Written feedback formats
    written_feedback:
      detailed_report:
        prompt: |
          Generate comprehensive written outreach feedback report:
          
          Report Structure:
          1. Outreach Assessment Overview:
             - Overall effectiveness score and rating
             - Response rate prediction and potential
             - Relationship building capability assessment
             - Professional brand alignment analysis
             
          2. Strengths Analysis:
             - Top 5 outreach competitive advantages
             - Personalization excellence areas
             - Value proposition strengths
             - Professional communication highlights
             
          3. Improvement Opportunities:
             - Critical gaps and weaknesses
             - Response rate optimization areas
             - Relationship building enhancement needs
             - Professional development opportunities
             
          4. Action Plan:
             - Prioritized improvement steps
             - Timeline and implementation milestones
             - Resource requirements and tools
             - Success measurement and tracking criteria
             
          5. Implementation Examples:
             - Before/after message comparisons
             - Specific wording and phrase suggestions
             - Format and structure improvements
             - Personalization enhancement examples
          
          Use clear, professional language with specific, actionable recommendations.
          Include templates and examples for immediate implementation.
          
        report_elements:
          - "Comprehensive_outreach_assessment"
          - "Strengths_highlighting"
          - "Improvement_prioritization"
          - "Actionable_implementation_plan"
          
    # Verbal feedback guides
    verbal_feedback:
      consultation_guide:
        prompt: |
          Generate structured verbal outreach feedback consultation guide:
          
          Consultation Flow:
          1. Outreach Strategy Assessment:
             - Current approach overview and evaluation
             - Target audience and goal alignment
             - Initial effectiveness assessment
             - User networking objectives review
             
          2. Message Deep Dive:
             - Message-by-message review and analysis
             - Personalization quality evaluation
             - Value proposition effectiveness assessment
             - Professional communication review
             
          3. Strategy Discussion:
             - User questions and concerns addressing
             - Recommendation clarification and prioritization
             - Implementation planning and resource identification
             - Success metrics definition and tracking
             
          4. Action Planning:
             - Short-term outreach optimization steps
             - Long-term relationship building strategy
             - Professional network development plan
             - Follow-up and engagement scheduling
             
          5. Closing Summary:
             - Key takeaways and next steps reinforcement
             - Confidence building and motivation
             - Success metrics and tracking confirmation
             - Ongoing support and follow-up
          
          Include specific talking points and example responses for common outreach questions.
          
        consultation_elements:
          - "Structured_assessment_flow"
          - "Interactive_strategy_discussion"
          - "Action_planning_framework"
          - "Motivational_support"
          
  # Feedback quality assurance
  quality_assurance:
    # Feedback validation
    validation:
      prompt: |
          Validate outreach feedback quality and effectiveness:
          
          Validation Criteria:
          1. Actionability:
             - Specific, implementable outreach suggestions
             - Clear step-by-step guidance
             - Resource and tool requirement identification
             - Timeline feasibility assessment
             
          2. Relationship Building Focus:
             - Long-term relationship orientation
             - Professional network development support
             - Authentic connection building emphasis
             - Mutual benefit prioritization
             
          3. Professional Standards:
             - Ethical networking compliance
             - Professional communication standards
             - Industry appropriateness
             - Cultural sensitivity consideration
             
          4. Effectiveness Orientation:
             - Response rate optimization focus
             - Engagement quality enhancement
             - Conversion potential improvement
             - Professional brand development
             
          Review feedback against these criteria and refine as needed.
          
        validation_metrics:
          - "Actionability_score"
          - "Relationship_building_focus"
          - "Professional_standards_compliance"
          - "Effectiveness_orientation"
          
    # Continuous improvement
      improvement:
        prompt: |
          Implement continuous improvement for outreach feedback quality:
          
          Improvement Mechanisms:
          1. User Feedback Collection:
             - Response rate improvement tracking
             - Relationship building success measurement
             - Network expansion outcome monitoring
             - Professional development achievement assessment
             
          2. Quality Monitoring:
             - Feedback consistency checks
             - Recommendation effectiveness tracking
             - User outcome correlation analysis
             - Professional network growth measurement
             
          3. System Optimization:
             - Feedback template refinement
             - Recommendation algorithm improvement
             - Personalization enhancement
             - Delivery method optimization
             
          4. Expert Validation:
             - Professional networking expert review
             - Industry specialist feedback integration
             - Career coach consultation
             - Best practice incorporation
          
          Use data-driven insights to continuously enhance feedback quality.
          
        improvement_strategies:
          - "User_outcome_tracking"
          - "Performance_monitoring"
          - "System_optimization"
          - "Expert_validation"
          
  # Personalization systems
  personalization:
    # User-specific adaptation
    user_adaptation:
      prompt: |
          Personalize outreach feedback based on user characteristics and goals:
          
          Personalization Factors:
          1. Career Level:
             - Entry-level: Potential and readiness focus
             - Mid-career: Advancement and specialization emphasis
             - Senior-level: Leadership and strategic impact
             - Executive: Vision and industry influence
             
          2. Industry Context:
             - Technology: Technical expertise and innovation focus
             - Healthcare: Patient care and regulatory compliance
             - Finance: Analytical rigor and risk management
             - Education: Student outcomes and curriculum development
             
          3. Networking Goals:
             - Job search: Immediate opportunity focus
             - Career growth: Long-term relationship building
             - Industry leadership: Thought leadership emphasis
             - Entrepreneurship: Partnership and collaboration focus
             
          4. Communication Style:
             - Formal: Professional, structured communication
             - Casual: Conversational, approachable style
             - Technical: Industry-specific terminology integration
             - General: Accessible, broad audience communication
          
          Tailor feedback tone, examples, and recommendations accordingly.
          Ensure personalization supports individual networking objectives.
          
        personalization_elements:
          - "Career_level_adaptation"
          - "Industry_specific_customization"
          - "Networking_goal_alignment"
          - "Communication_style_matching"
          
    # Industry-specific feedback
    industry_adaptation:
      technology_focus:
        prompt: |
          Generate technology industry-specific outreach feedback:
          
          Technology Industry Feedback Areas:
          1. Technical Expertise Demonstration:
             - Technical contribution recognition
             - Technology stack understanding
             - Project complexity appreciation
             - Innovation capability showcase
             
          2. Industry Knowledge Integration:
             - Current technology trends awareness
             - Industry challenge understanding
             - Technical insight sharing
             - Emerging technology discussion
             
          3. Community Engagement:
             - Technical community involvement
             - Open source contribution recognition
             - Conference participation acknowledgment
             - Professional network engagement
             
          4. Collaboration Opportunities:
             - Technical collaboration potential
             - Knowledge exchange possibilities
             - Project partnership opportunities
             - Innovation synergy identification
          
          Provide technology-specific examples and optimization strategies.
          
        tech_feedback_elements:
          - "Technical_expertise_recognition"
          - "Industry_knowledge_integration"
          - "Community_engagement_strategy"
          - "Collaboration_opportunity_identification"
          
      healthcare_focus:
        prompt: |
          Generate healthcare industry-specific outreach feedback:
          
          Healthcare Industry Feedback Areas:
          1. Clinical Excellence Recognition:
             - Patient care contribution acknowledgment
             - Quality improvement initiative recognition
             - Clinical skill appreciation
             - Treatment advancement understanding
             
          2. Healthcare System Knowledge:
             - Healthcare challenge awareness
             - System improvement understanding
             - Regulatory knowledge demonstration
             - Policy development insight
             
          3. Professional Development:
             - Continuing education acknowledgment
             - Specialty certification recognition
             - Professional association involvement
             - Research contribution appreciation
             
          4. Ethical Considerations:
             - Patient privacy maintenance
             - Professional boundary respect
             - Ethical communication standards
             - Regulatory compliance adherence
          
          Ensure all feedback maintains healthcare industry standards and ethics.
          
        healthcare_feedback_elements:
          - "Clinical_excellence_recognition"
          - "Healthcare_system_knowledge"
          - "Professional_development_support"
          - "Ethical_standards_maintenance"

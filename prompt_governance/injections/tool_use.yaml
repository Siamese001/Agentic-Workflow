# Tool Use Injection v1.0
# Tool selection and usage guidance prompts for optimal tool integration

tool_use_injection:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Global tool use principles
  global_principles:
    enabled: true
    optimization_level: "maximum"
    
    # Core tool areas
    tool_areas:
      tool_selection: true
      usage_optimization: true
      integration_coordination: true
      performance_monitoring: true
      
  # Tool selection frameworks
  tool_selection:
    # Resume processing tools
    resume_tools:
      parsing_tools:
        resume_parser:
          description: "Extract structured data from resume documents"
          selection_criteria:
            - "format_support"  # PDF, DOC, DOCX
            - "accuracy_rate"  # > 95%
            - "processing_speed"  # < 5 seconds
            - "field_extraction"  # Contact, experience, education, skills
            
          recommended_tools:
            - name: "nlp_resume_parser"
              strengths: ["high_accuracy", "format_flexible"]
              use_case: "complex_resume_formats"
              
            - name: "structured_parser"
              strengths: ["fast_processing", "standard_formats"]
              use_case: "high_volume_processing"
              
      analysis_tools:
        skill_analyzer:
          description: "Analyze and categorize skills from resume content"
          selection_criteria:
            - "skill_taxonomy_coverage"
            - "industry_specific_recognition"
            - "proficiency_level_detection"
            
          recommended_tools:
            - name: "taxonomy_skill_analyzer"
              strengths: ["comprehensive_taxonomy", "industry_mapping"]
              use_case: "skill_gap_analysis"
              
        experience_classifier:
          description: "Classify work experience by relevance and impact"
          selection_criteria:
            - "relevance_scoring"
            - "achievement_detection"
            - "career_progression_analysis"
            
          recommended_tools:
            - name: "impact_classifier"
              strengths: ["achievement_focused", "quantification_support"]
              use_case: "experience_optimization"
              
    # Outreach processing tools
    outreach_tools:
      research_tools:
        company_researcher:
          description: "Gather and analyze company information"
          selection_criteria:
            - "data_source_coverage"
            - "information_freshness"
            - "relevance_scoring"
            
          recommended_tools:
            - name: "web_research_aggregator"
              strengths: ["comprehensive_sources", "real_time_data"]
              use_case: "company_intelligence_gathering"
              
        contact_enricher:
          description: "Enrich contact information with professional details"
          selection_criteria:
            - "data_accuracy"
            - "privacy_compliance"
            - "coverage_breadth"
            
          recommended_tools:
            - name: "professional_network_enricher"
              strengths: ["professional_focus", "verified_data"]
              use_case: "contact_profile_enhancement"
              
      personalization_tools:
        message_generator:
          description: "Generate personalized outreach messages"
          selection_criteria:
            - "personalization_quality"
            - "tone_adaptability"
            - "template_flexibility"
            
          recommended_tools:
            - name: "contextual_message_generator"
              strengths: ["deep_personalization", "tone_control"]
              use_case: "high_value_outreach"
              
  # Usage optimization
  usage_optimization:
    # Tool coordination
    coordination:
      sequential_workflows:
        resume_processing:
          steps:
            - tool: "resume_parser"
              input: "raw_resume_document"
              output: "structured_resume_data"
              
            - tool: "skill_analyzer"
              input: "structured_resume_data"
              output: "categorized_skills"
              
            - tool: "experience_classifier"
              input: "structured_resume_data"
              output: "classified_experience"
              
            - tool: "quality_scorer"
              input: "classified_experience, categorized_skills"
              output: "resume_quality_score"
              
        outreach_processing:
          steps:
            - tool: "company_researcher"
              input: "company_identifier"
              output: "company_profile"
              
            - tool: "contact_enricher"
              input: "contact_information"
              output: "enriched_contact_profile"
              
            - tool: "message_generator"
              input: "company_profile, enriched_contact_profile"
              output: "personalized_message"
              
    # Parallel processing
    parallel_workflows:
      resume_optimization:
        parallel_tasks:
          - tool: "skill_analyzer"
            focus: "skill_extraction_and_categorization"
            
          - tool: "experience_classifier"
            focus: "experience_relevance_scoring"
            
          - tool: "format_validator"
            focus: "format_compliance_check"
            
        synchronization_point: "quality_assessment"
        
  # Performance monitoring
  performance_monitoring:
    # Tool performance metrics
    metrics:
      processing_metrics:
        - name: "tool_processing_time"
          type: "histogram"
          labels: ["tool_name", "input_type"]
          
        - name: "tool_success_rate"
          type: "gauge"
          labels: ["tool_name"]
          
        - name: "tool_accuracy_score"
          type: "histogram"
          labels: ["tool_name", "task_type"]
          
      quality_metrics:
        - name: "output_quality_score"
          type: "gauge"
          labels: ["tool_name", "output_type"]
          
        - name: "user_satisfaction_rating"
          type: "histogram"
          labels: ["tool_name"]
          
    # Performance thresholds
    thresholds:
      processing_time:
        max_acceptable: 30  # seconds
        target_optimal: 10  # seconds
        
      accuracy:
        minimum_acceptable: 0.85
        target_optimal: 0.95
        
      success_rate:
        minimum_acceptable: 0.90
        target_optimal: 0.98
        
  # Tool integration
  integration:
    # API integration
    api_integration:
      authentication:
        methods:
          - "api_key_authentication"
          - "oauth2_authentication"
          - "jwt_authentication"
          
      rate_limiting:
        enabled: true
        default_limits:
          requests_per_minute: 60
          requests_per_hour: 1000
          
      error_handling:
        retry_strategy: "exponential_backoff"
        max_retries: 3
        fallback_behavior: "graceful_degradation"
        
    # Data flow integration
    data_flow:
      input_validation:
        schema_validation: true
        format_validation: true
        content_validation: true
        
      output_standardization:
        consistent_format: true
        metadata_inclusion: true
        quality_metrics: true
        
      error_propagation:
        error_logging: true
        user_notification: true
        recovery_attempts: true
        
  # Tool optimization
  optimization:
    # Resource optimization
    resource_management:
      memory_optimization:
        caching_strategy: "lru_cache"
        memory_limits: "2GB"
        garbage_collection: "aggressive"
        
      cpu_optimization:
        parallel_processing: true
        batch_operations: true
        load_balancing: true
        
      network_optimization:
        connection_pooling: true
        request_batching: true
        compression_enabled: true
        
    # Cost optimization
    cost_management:
      api_cost_monitoring:
        enabled: true
        cost_per_request_tracking: true
        monthly_budget_limits: true
        
      tool_selection_optimization:
        cost_effectiveness_analysis: true
        performance_cost_ratio: true
        budget_constrained_selection: true
        
  # Tool governance
  governance:
    # Access control
    access_control:
      role_based_access:
        roles:
          - "basic_user"
          - "advanced_user"
          - "admin"
          
        permissions:
          basic_user: ["standard_tools"]
          advanced_user: ["standard_tools", "advanced_tools"]
          admin: ["all_tools", "tool_configuration"]
          
    # Usage policies
    usage_policies:
      fair_usage:
        daily_limits:
          basic_user: 100
          advanced_user: 500
          admin: "unlimited"
          
      data_privacy:
        data_retention: "30_days"
        audit_logging: true
        consent_required: true
        
  # Tool maintenance
  maintenance:
    # Update management
    updates:
      automatic_updates: true
      rollback_capability: true
      testing_before_deployment: true
      
      update_schedule:
        security_patches: "immediate"
        feature_updates: "weekly"
        major_versions: "monthly"
        
    # Monitoring and alerting
    monitoring:
      health_checks:
        enabled: true
        frequency: "5_minutes"
        alert_thresholds: "performance_degradation"
        
      alerting:
        channels: ["email", "slack", "pagerduty"]
        escalation_rules: "severity_based"
        
  # Tool testing
  testing:
    # Automated testing
    automated_tests:
      unit_tests:
        coverage_requirement: 90
        test_frequency: "on_commit"
        
      integration_tests:
        coverage_requirement: 80
        test_frequency: "daily"
        
      performance_tests:
        baseline_comparison: true
        regression_detection: true
        test_frequency: "weekly"
        
    # Manual testing
    manual_testing:
      user_acceptance_testing:
        required: true
        test_scenarios: ["happy_path", "edge_cases", "error_conditions"]
        
      quality_assurance:
        review_process: true
        approval_workflow: true
        documentation_requirements: true
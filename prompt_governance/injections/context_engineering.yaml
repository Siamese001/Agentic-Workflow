# Context Engineering Injection v1.0
# Context building and information structuring prompts for optimal processing

context_engineering:
  version: "1.0"
  last_updated: "2024-01-01T00:00:00Z"
  
  # Global context engineering principles
  global_principles:
    enabled: true
    optimization_level: "maximum"
    
    # Context organization
    organization:
      hierarchical_structure: true
      logical_grouping: true
      temporal_ordering: true
      
    # Information density
    density_optimization:
      compression_ratio: 0.7
      relevance_threshold: 0.8
      redundancy_elimination: true
      
  # Context building strategies
  building_strategies:
    # Progressive context building
    progressive:
      enabled: true
      layers:
        - name: "core_context"
          priority: "highest"
          max_tokens: 1000
          
        - name: "supporting_context"
          priority: "high"
          max_tokens: 1500
          
        - name: "auxiliary_context"
          priority: "medium"
          max_tokens: 1000
          
    # Dynamic context adaptation
    dynamic:
      enabled: true
      adaptation_criteria:
        - "task_complexity"
        - "user_preferences"
        - "performance_metrics"
        
    # Context caching
    caching:
      enabled: true
      cache_duration: "1h"
      cache_size_limit: "100MB"
      
  # Resume context engineering
  resume_context:
    # Resume data structure
    data_structure:
      sections:
        personal_info:
          priority: "high"
          fields:
            - "name"
            - "professional_title"
            - "location"
            - "email"
            - "phone"
            - "linkedin"
            
        professional_summary:
          priority: "high"
          max_length: 300
          optimization: "impact_focused"
          
        work_experience:
          priority: "highest"
          structure:
            - "company_name"
            - "job_title"
            - "employment_dates"
            - "responsibilities"
            - "achievements"
            
        education:
          priority: "medium"
          structure:
            - "institution_name"
            - "degree"
            - "graduation_date"
            - "relevant_coursework"
            
        skills:
          priority: "high"
          categorization:
            - "technical_skills"
            - "soft_skills"
            - "certifications"
            - "languages"
            
    # Context optimization
    optimization:
      # Relevance filtering
      relevance_filtering:
        enabled: true
        threshold: 0.7
        dynamic_adjustment: true
        
      # Experience prioritization
      experience_prioritization:
        recent_experience_weight: 1.5
        relevant_experience_weight: 2.0
        achievement_weight: 1.8
        
      # Skills ranking
      skills_ranking:
        market_demand_weight: 1.2
        skill_level_weight: 1.0
        relevance_weight: 1.5
        
  # Outreach context engineering
  outreach_context:
    # Recipient data structure
    recipient_structure:
      professional_info:
        priority: "high"
        fields:
          - "name"
          - "job_title"
          - "company"
          - "industry"
          - "experience_level"
          
        contact_info:
          priority: "medium"
          fields:
            - "email"
            - "linkedin"
            - "professional_networks"
            
        background:
          priority: "high"
          fields:
            - "career_history"
            - "expertise_areas"
            - "interests"
            - "mutual_connections"
            
    # Message context
    message_context:
      purpose:
        priority: "highest"
        types:
          - "networking_request"
          - "job_inquiry"
          - "information_request"
          - "collaboration_proposal"
          
      personalization_elements:
        priority: "high"
        elements:
          - "shared_interests"
          - "mutual_connections"
          - "company_research"
          - "industry_insights"
          
      call_to_action:
        priority: "medium"
        types:
          - "meeting_request"
          - "information_exchange"
          - "collaboration_discussion"
          
  # Context enhancement techniques
  enhancement_techniques:
    # Information synthesis
    synthesis:
      enabled: true
      techniques:
        - name: "key_point_extraction"
          confidence_threshold: 0.8
          
        - name: "trend_identification"
          min_data_points: 3
          
        - name: "gap_analysis"
          completeness_threshold: 0.7
          
    # Context enrichment
    enrichment:
      external_data:
        enabled: true
        sources:
          - "industry_trends"
          - "company_news"
          - "market_insights"
          
      internal_data:
        enabled: true
        sources:
          - "previous_interactions"
          - "user_preferences"
          - "success_patterns"
          
    # Context validation
    validation:
      data_quality:
        completeness_check: true
        accuracy_check: true
        consistency_check: true
        
      relevance_validation:
        semantic_relevance: true
        task_alignment: true
        user_intent_match: true
        
  # Context management
  management:
    # Context lifecycle
    lifecycle:
      creation:
        automated: true
        validation_required: true
        
      maintenance:
        update_frequency: "real_time"
        cleanup_schedule: "daily"
        
      archival:
        retention_period: "90_days"
        compression_enabled: true
        
    # Context versioning
    versioning:
      enabled: true
      track_changes: true
      rollback_available: true
      
    # Context sharing
    sharing:
      cross_session: true
      cross_engine: true
      privacy_controls: true
      
  # Performance optimization
  optimization:
    # Processing efficiency
    processing:
      parallel_processing: true
      batch_operations: true
      caching_enabled: true
      
    # Memory management
    memory:
      context_window_optimization: true
      token_efficiency: true
      garbage_collection: true
      
    # Latency reduction
    latency:
      pre_processing: true
      lazy_loading: true
      prediction_caching: true
      
  # Context analytics
  analytics:
    # Usage metrics
    metrics:
      - name: "context_utilization_rate"
        type: "gauge"
        
      - name: "context_relevance_score"
        type: "histogram"
        
      - name: "context_processing_time"
        type: "histogram"
        
    # Quality metrics
    quality_metrics:
      - name: "context_completeness"
        type: "gauge"
        
      - name: "context_accuracy"
        type: "gauge"
        
      - name: "context_freshness"
        type: "gauge"
        
  # Context templates
  templates:
    # Resume context template
    resume_template:
      structure:
        header: "personal_info"
        summary: "professional_summary"
        experience: "work_experience"
        education: "education"
        skills: "skills"
        
      optimization:
        max_total_tokens: 3500
        section_weights:
          personal_info: 0.1
          professional_summary: 0.2
          work_experience: 0.4
          education: 0.15
          skills: 0.15
          
    # Outreach context template
    outreach_template:
      structure:
        recipient: "professional_info"
        background: "background"
        purpose: "purpose"
        personalization: "personalization_elements"
        action: "call_to_action"
        
      optimization:
        max_total_tokens: 2000
        section_weights:
          professional_info: 0.2
          background: 0.25
          purpose: 0.2
          personalization_elements: 0.25
          call_to_action: 0.1
          
  # Context security
  security:
    # Data protection
    protection:
      encryption_at_rest: true
      encryption_in_transit: true
      access_logging: true
      
    # Privacy controls
    privacy:
      pii_detection: true
      data_minimization: true
      consent_management: true
      
    # Access control
    access_control:
      role_based_access: true
      audit_trail: true
      session_management: true